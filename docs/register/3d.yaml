    Mini scene "object-edit": add, select, edit, group and undo objects; saved scene and export match.
  status: not-started
  evidence: []

- id: 3d.physics-world
  name: "Rigid-body physics world (Rapier): gravity"
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "Rapier rigid-body physics: gravity strength and direction"
      category: "3D scene and physics"
      checked: true
  artist_can: >-
    Turn on physics for a scene and set gravity: its strength (including zero or very weak for floaty looks) and its
    direction (down, sideways, up toward the roof). Objects marked as physics objects then move under real rigid-body
    physics.
  projection_example: >-
    Gravity 9.8 m/s2 down for falling bricks. Gravity 0.5 m/s2 upward for rising debris.
  controls:
    - { name: "Gravity strength", type: "float", animatable: true }
    - { name: "Gravity direction", type: "vector", animatable: true }
    - { name: "Time scale", type: "float", animatable: false }
    - { name: "Quality (substeps)", type: "int", animatable: false }
    - { name: "Ground plane (none, flat, venue)", type: "enum", animatable: false }
    - { name: "Seed", type: "int", animatable: false }
  animation: >-
    Gravity can change over time. The bake applies each change at its exact step.
  dependencies: [3d.scene-model, fx.simulation.deterministic-seeds, fx.simulation.cache-checkpoints, 3d.units-scale]
  implementation: >-
    A Rapier world (deterministic WASM build) owned by the scene and stepped at a fixed dt in a worker, with an
    explicit solver configuration (substeps, iterations). World settings are stored in the project. Units are scene
    metres (3d.units-scale).
  io: >-
    World settings are saved with the scene.
  limitations: >-
    Determinism holds for the same Rapier version, insertion order and inputs, so a Rapier upgrade can change results
    and needs hash tests.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Scene settings, Physics: one switch and a gravity dial with an arrow.
    defaults: >-
      Earth gravity pointing down, venue floor as the ground.
    automation: >-
      Chooses sensible substeps for the object count.
    usability_check: >-
      A first-time user turns on physics and lets objects fall in under 30 s.
  acceptance: >-
    Mini scene "gravity-tests": down, sideways and weak gravity with the same objects; seek and export agree.
  status: not-started
  evidence: []

- id: 3d.physics-body
  name: Mass, friction and bounce on 3D objects
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "Rapier rigid-body physics: mass, friction, bounce"
      category: "3D scene and physics"
      checked: true
  artist_can: >-
    Make any object a physics object (moves), a fixed obstacle (does not move) or a keyframe-driven mover, and set its
    mass, friction, bounciness and damping, with simple presets (brick, glass, rubber, feather).
  projection_example: >-
    Bricks weigh 2 kg with friction 0.8 and bounce 0.1. A rubber ball bounces at 0.9.
  controls:
    - { name: "Body type (dynamic, static, kinematic)", type: "enum", animatable: false }
    - { name: "Mass or density", type: "float", animatable: false }
    - { name: "Friction", type: "float", animatable: false }
    - { name: "Bounce", type: "float", animatable: false }
    - { name: "Linear and angular damping", type: "float[2]", animatable: false }
    - { name: "Initial velocity", type: "vector", animatable: false }
    - { name: "Material preset", type: "enum", animatable: false }
  animation: >-
    Kinematic bodies follow the keyframes, so an animator can push an object. Other values are constant per bake.
  dependencies: [3d.physics-world, 3d.object-editing, 3d.scene-model, expr.presets]
  implementation: >-
    The values map directly to Rapier rigid-body and collider parameters (mass or density, friction, restitution,
    damping, locked axes, initial velocities). Presets are saved looks. Kinematic bodies follow the evaluated
    transforms.
  io: >-
    Saved with the object in the scene.
  limitations: >-
    Rigid bodies only: no bending, cloth or soft bodies (Blender simulation covers those).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Select an object, then Physics: Moves, Fixed or Animated, and pick a material preset.
    defaults: >-
      Dynamic body with the Brick preset.
    automation: >-
      Sets mass from size and material density.
    usability_check: >-
      A first-time user makes a ball bounce on the ground in under 45 s.
  acceptance: >-
    Mini scene "body-properties": heavy, light, sticky and bouncy objects behave as expected.
  status: not-started
  evidence: []

- id: 3d.physics-forces
  name: Forces and impulses
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "Rapier rigid-body physics: forces and impulses"
      category: "3D scene and physics"
      checked: true
  artist_can: >-
    Push things around: constant forces (wind), one-off impulses (a kick at a moment, at a point on an object), radial
    blasts, and torque, timed on the timeline or on a music beat.
  projection_example: >-
    An impulse on the beat sends the bricks flying outward, and a constant sideways wind pushes them across the
    facade.
  controls:
    - { name: "Force type (constant, impulse, radial, torque)", type: "enum", animatable: false }
    - { name: "Strength and direction", type: "vector", animatable: true }
    - { name: "Application point", type: "point3d", animatable: false }
    - { name: "Start time and duration", type: "time[2]", animatable: true }
    - { name: "Falloff for radial", type: "curve", animatable: false }
    - { name: "Trigger (marker, beat)", type: "enum", animatable: false }
  animation: >-
    Strength and direction are keyframable. Beat-triggered events resolve from the cached beat grid.
  dependencies: [3d.physics-body, anim.keyframe.core, audio.beat-markers, tool.beat-sync, fx.simulation.deterministic-seeds]
  implementation: >-
    Force events are a time-ordered list in the project (time in flicks). The bake applies them at the exact step with
    Rapier add-force, apply-impulse and add-torque calls. Beat-triggered events resolve against the cached beat grid,
    so seek and export see the same sequence.
  io: >-
    Saved in the scene.
  limitations: >-
    Very strong impulses on small objects can tunnel through thin colliders. The bake uses continuous collision
    detection where needed and reports it.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Select objects, then "Add a push": pick Kick, Wind or Blast and place it on the timeline or on a beat.
    defaults: >-
      A single impulse at the playhead with a visible arrow.
    automation: >-
      Fits strength to the object mass.
    usability_check: >-
      A first-time user kicks an object on a beat in under 1 minute.
  acceptance: >-
    Mini scene "beat-kick": impulses on beats, wind and a blast; consistent in preview and export.
  status: not-started
  evidence: []

- id: 3d.physics-colliders
  name: Collision geometry and object-to-object collisions
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "Rapier rigid-body physics: collision geometry and object collisions"
      category: "3D scene and physics"
      checked: true
  artist_can: >-
    Choose each object's collision shape (box, sphere, capsule, convex hull, or exact mesh for fixed things), switch
    object-to-object collisions on or off by group, and let objects hit the building's real ledges, sills and floor
    taken from the venue geometry.
  projection_example: >-
    Falling fragments land on the first-floor ledge, slide off and knock into each other. The audience barrier ignores
    them.
  controls:
    - { name: "Collider shape (auto, box, sphere, capsule, convex hull, mesh)", type: "enum", animatable: false }
    - { name: "Collision group and filter", type: "bitmask", animatable: false }
    - { name: "Collide with the venue (on, off, which parts)", type: "enum", animatable: false }
    - { name: "Show colliders", type: "bool", animatable: false }
    - { name: "Margin", type: "float", animatable: false }
  animation: >-
    None.
  dependencies: [3d.physics-body, 3d.physics-world, 3d.physical-vs-creative, map.model-3d, map.venue-proxy]
  implementation: >-
    Rapier colliders generated from render meshes (convex decomposition for moving objects, triangle meshes or
    heightfields for fixed venue parts), cached by mesh hash. Venue geometry enters as read-only fixed colliders, so
    creative edits cannot move it. Groups map to Rapier interaction groups. A collider overlay shows what will
    collide.
  io: >-
    Collider caches are in the project cache folder.
  limitations: >-
    Exact-mesh colliders are for fixed bodies only. The venue proxy is an approximation, so ledge contacts are only as
    accurate as the survey.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Physics, Collisions: "Hit the building" and "Hit each other" switches, with an overlay to check.
    defaults: >-
      Auto shape, collide with the building and with each other.
    automation: >-
      Builds shapes from the meshes and the venue ledges automatically.
    usability_check: >-
      A first-time user makes objects land on a ledge in under 1 minute.
  acceptance: >-
    Mini scene "ledge-landing": objects land on a surveyed ledge and collide with each other; seek-stable.
  status: not-started
  evidence: []

- id: 3d.physics-bake
  name: Physics baked through prepare and cache
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "Rapier physics baked through the prepare and cache workflow for consistent seek and export"
      category: "3D scene and physics"
      checked: true
  artist_can: >-
    Press "Prepare physics" and the app simulates the scene once in the background and saves the result. Scrubbing,
    preview, seeking and export then all show the identical motion, and editing a physics setting marks the bake out
    of date and re-prepares it.
  projection_example: >-
    Jump to 0:42 and see the same pile of bricks that export renders.
  controls:
    - { name: "Prepare or re-prepare", type: "action", animatable: false }
    - { name: "Range", type: "time[2]", animatable: false }
    - { name: "Quality (steps per frame)", type: "int", animatable: false }
    - { name: "Cache status (up to date, stale)", type: "view", animatable: false }
    - { name: "Clear cache", type: "action", animatable: false }
  animation: >-
    Baked per-frame transforms are read for any time, so seeking is random access after the first run.
  dependencies: [fx.simulation.prepare-workflow, fx.simulation.cache-checkpoints, 3d.physics-world, render.snapshot, preview.cache-invalidation, render.determinism]
  implementation: >-
    Reuses the simulation Prepare workflow: sequential Rapier stepping at a fixed dt in a worker, per-frame transforms
    recorded to a transform cache, with world snapshots as checkpoints. Both are keyed by a hash of the scene's
    physics inputs and the Rapier version. Preview and export read the same cache, and render snapshots include the
    cache key.
  io: >-
    Cache files in the project cache folder, keyed by hash.
  limitations: >-
    Bakes cost time and disk in proportion to object count and duration. Hash mismatch after a Rapier upgrade forces a
    re-prepare.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      A "Prepare physics" bar appears when physics settings change, with progress.
    defaults: >-
      Prepares automatically after edits when idle, and the viewport shows the last good bake until then.
    automation: >-
      Hashes inputs, bakes in the background and tells you when the preview is current.
    usability_check: >-
      After editing a mass and preparing, scrub and export show identical piles.
  acceptance: >-
    Mini scene "bake-seek": random seeks and export frames from the bake match bit-for-bit on this machine.
  status: not-started
  evidence: []

- id: 3d.blender-link
  name: Blender link (linked scenes and round trip)
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "Deep optional Blender integration: linked scenes"
      category: "Blender integration"
      checked: true
  artist_can: >-
    Link a .blend file as a scene: edit it in Blender and Before Effects updates (objects, materials, lights, cameras,
    animation), or send the creative scene or the venue model to Blender and bring the result back. The link is
    optional and everything else works without Blender.
  projection_example: >-
    A modeller builds a collapsing tower in Blender and saves, and the show updates with the new tower animation.
  controls:
    - { name: "Link a .blend file", type: "file", animatable: false }
    - { name: "Reload on save", type: "bool", animatable: false }
    - { name: "Import (objects, animation, cameras, lights)", type: "flags", animatable: false }
    - { name: "Unlink and keep as glTF", type: "action", animatable: false }
    - { name: "Send to Blender", type: "action", animatable: false }
  animation: >-
    Baked animation from Blender plays as the model animation (3d.model-animation).
  dependencies: [3d.dcc-import, 3d.model-format-gltf, 3d.scene-model, 3d.model-animation, render.queue]
  implementation: >-
    Headless Blender (bpy) runs a job that exports glTF/GLB with baked animation plus a JSON side-car for lights,
    cameras and custom properties. A file watcher re-runs the job on save. Overrides made in Before Effects
    (materials, area assignment, physics) are keyed by node path and survive reimport. Send to Blender writes the
    creative scene as GLB and opens Blender.
  io: >-
    Reads .blend. Writes GLB and JSON. Keeps the original .blend untouched.
  limitations: >-
    Procedural rigs and modifiers that Blender's glTF exporter cannot bake are lost, and the import report lists them.
    Blender is GPL and stays behind an integration boundary. Blender versions are tested per release.
  disposition: required-integration
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      Drag a .blend file in, or Scene, "Send to Blender".
    defaults: >-
      Imports objects, animation, cameras and lights and reloads on save.
    automation: >-
      Finds Blender, converts in the background and reports what could not be converted.
    usability_check: >-
      A first-time user links a .blend and sees an edit appear after saving in Blender.
  acceptance: >-
    Mini scene "blender-tower": edit in Blender, saved, scene updates with overrides kept.
  status: not-started
  evidence: []

- id: 3d.blender-simulation
  name: Advanced simulation in Blender, baked into the show
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "Deep optional Blender integration: advanced simulation"
      category: "Blender integration"
      checked: true
  artist_can: >-
    Run cloth, destruction, fluid, smoke and particle simulations in Blender and bring the baked result back as
    animated objects or a cache, placed and timed from Before Effects.
  projection_example: >-
    A cloth curtain falls over a window in Blender and plays in the show in time with the music.
  controls:
    - { name: "Simulation file or collection", type: "ref", animatable: false }
    - { name: "Bake range", type: "time[2]", animatable: false }
    - { name: "Start time and speed", type: "time + percent", animatable: true }
    - { name: "Area placement", type: "region-ref", animatable: false }
  animation: >-
    Start time and speed are keyframable. The baked frames are fixed.
  dependencies: [fx.simulation.mantaflow-offline, 3d.dcc-alembic, 3d.blender-link, fx.simulation.prepare-workflow, fx.simulation.cache-checkpoints]
  implementation: >-
    Blender headless bakes to Alembic or glTF vertex caches (and EXR volumes for smoke and liquids). The result is
    imported as a cache object read by frame. The Prepare workflow tracks bake status and hashes inputs so preview and
    export read the same cache.
  io: >-
    Alembic, glTF with vertex caches, EXR volumes, from Blender.
  limitations: >-
    Offline only. Bake times range from minutes to hours. Results depend on the Blender version.
  disposition: required-integration
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      Link a Blender simulation, press "Bake in Blender", then place the result on an area.
    defaults: >-
      Whole simulation, full range, starts at the playhead.
    automation: >-
      Runs Blender in the background and re-bakes only when the file changes.
    usability_check: >-
      A first-time user bakes and plays a Blender simulation on a facade without opening Blender again.
  acceptance: >-
    Mini scene "blender-cloth": a baked simulation plays on an area; preview and export match.
  status: not-started
  evidence: []
