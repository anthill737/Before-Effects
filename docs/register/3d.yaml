# 3D — Before Effects capability register
# Sources: S01 (AE user guide: 3D layers, 3D design space, gizmos, cameras, lights, materials, IBL, shadows, shadow catchers, parametric meshes, model import, Draft 3D, Cinema 4D/Classic 3D, stereoscopic), S10 (Advanced 3D renderer), brief §9 (true 3D and 2.5D), brief §15/§19 (venue vs show separation). Live pages checked 2026-10-01 where `checked: true`.

- id: 3d.scene
  name: 3D scene
  sources:
    - ref: S10
      item: Advanced 3D renderer
      category: Work with 3D composition
      checked: true
    - ref: S01
      item: 3D layers
      category: Work with layers
      checked: false
    - ref: brief
      item: §9 True 3D and 2.5D workspace
      category: Product requirement
      checked: true
  artist_can: >-
    Build a 3D scene inside a composition where flat layers, imported models, primitives, extruded type,
    cameras and lights share one coordinate space and render together with correct depth, lighting and shadows.
  projection_example: >-
    A tunnel behind a real doorway: primitive walls, a model train passing through, lit and rendered from the
    audience viewpoint into the doorway region.
  controls:
    - { name: Renderer, type: enum(final|classic-look), animatable: false }
    - { name: Scene unit, type: enum(m|cm|ft), animatable: false }
    - { name: Ambient colour, type: color, animatable: true }
    - { name: Background, type: enum(transparent|color|environment), animatable: false }
  animation: >-
    Every transform, camera, light and material property is keyframable, expression-linkable and audio-drivable,
    evaluated at exact flick times so seeking and export match.
  dependencies: [proj.composition, proj.layer, anim.keyframe.core, 3d.renderer, 3d.camera, 3d.light, 3d.units-scale, 3d.physical-vs-creative]
  implementation: >-
    The scene graph lives in the core project model. Each frame the engine updates a persistent three.js scene
    (WebGPURenderer, TSL node materials) from evaluated properties and renders a scene-linear, premultiplied
    rgba16float target into the WGSL compositor. 2D layers stacked between 3D layers split render groups, as in AE.
  io: >-
    Saved in the project; models referenced by path plus content hash. Depth, normal and ID passes on request (pass.*).
  limitations: >-
    A 2D layer between 3D layers breaks intersection across it (AE semantics). Not a modelling, sculpting or CAD package.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "Add depth" / "Make it 3D" on the selection, or start from the "Tunnel in a doorway" starter scene.
    defaults: >-
      Camera at the audience viewpoint, one key light plus a soft environment, metres as units.
    automation: >-
      Creates a camera and lights when the first 3D object appears and switches the composition to 3D rendering.
    usability_check: >-
      A first-time user turns a flat logo into a 3D object and orbits around it in under 60 s without opening a dialog.
  acceptance: >-
    AS-2 tunnel scene; mini scene "logo-in-space": reopen and seek produce identical frames to the first render.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: 3d.layer-3d
  name: 3D layer switch (2.5D layers)
  sources:
    - ref: S01
      item: 3D layers
      category: Work with layers
      checked: false
    - ref: brief
      item: §9 flat layers positioned in 3D
      category: Product requirement
      checked: true
  artist_can: >-
    Turn any footage, solid, precomp, text or shape layer into a card in 3D space with XYZ position, orientation,
    rotation and scale, so layers at different depths create parallax.
  projection_example: >-
    Cut-out forest layers stacked at different depths behind a window region; a slow camera drift makes the window
    look like it opens onto a deep landscape.
  controls:
    - { name: 3D layer, type: bool, animatable: false }
    - { name: Position, type: point3d, animatable: true }
    - { name: Orientation, type: vector3, animatable: true }
    - { name: X/Y/Z Rotation, type: angle, animatable: true }
    - { name: Scale, type: vector3, animatable: true }
    - { name: Anchor point, type: point3d, animatable: true }
  animation: >-
    All transform channels keyframable with separate dimensions; spatial paths in 3D; auto-orient to camera or path.
  dependencies: [3d.scene, proj.layer, anim.motion-path, 3d.light-linking]
  implementation: >-
    The layer is a textured quad (PlaneGeometry) whose base colour and opacity come from the layer's own rendered
    rgba16float texture. Vector and text layers re-rasterize at their projected screen size (Skia CanvasKit) so they stay sharp.
  io: >-
    none
  limitations: >-
    Effects on a 3D layer render in layer space before projection (AE order). Depth effects that read auxiliary
    channels do not apply correctly to a layer viewed off-axis.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "Add depth" on selected layers, then drag the depth handle on the canvas.
    defaults: >-
      Layers keep their apparent size when converted (z placed so the audience camera sees the same framing).
    automation: >-
      Auto-scales layers pushed back in depth so they keep their framed size unless "true size" is chosen.
    usability_check: >-
      A novice spreads four layers in depth and previews parallax in under 2 minutes with no numeric entry.
  acceptance: >-
    Mini scene "parallax-window": converted layers keep framing at t=0 and produce parallax under camera motion.
  status: not-started
  evidence: []

- id: 3d.renderer
  name: Physically based 3D renderer (Advanced 3D equivalent)
  sources:
    - ref: S10
      item: Advanced 3D renderer — Render Quality, Shadows (Resolution, Smoothness, Casting Box Size/Center, Fit to Scene)
      category: Work with 3D composition
      checked: true
  artist_can: >-
    Render models, primitives, extrusions and 3D layers with physically based materials, image-based lighting and
    shadows, choosing a quality level that trades interactivity for final image quality.
  projection_example: >-
    A metallic sculpture model appears to stand in a niche of the facade, reflecting an HDR sky and casting a shadow.
  controls:
    - { name: Render quality, type: int, animatable: false }
    - { name: Shadow resolution, type: enum(half|full|double), animatable: false }
    - { name: Shadow smoothness, type: int, animatable: false }
    - { name: Casting box size, type: vector3, animatable: false }
    - { name: Casting box centre, type: point3d, animatable: false }
    - { name: Fit casting box to scene, type: action, animatable: false }
    - { name: Anti-aliasing samples, type: enum(1|4|8|16), animatable: false }
  animation: >-
    Renderer settings are not animated; everything they render is.
  dependencies: [3d.scene, 3d.material-pbr, 3d.light, 3d.shadows, 3d.quality-modes]
  implementation: >-
    three.js WebGPURenderer with MeshStandardNodeMaterial/MeshPhysicalNodeMaterial, PCF-soft shadow maps (cascaded for
    directional lights) in place of AE voxel shadows, PMREM-filtered environment maps. Final quality uses a fixed
    supersampling jitter pattern and no cross-frame accumulation, so every frame is independently reproducible.
  io: >-
    none
  limitations: >-
    Appearance will not match Adobe Standard Material exactly. Bit-identical output is only promised on the same GPU,
    driver and app version; across machines the target is a measured tolerance. Emissive surfaces do not light other objects.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      No action needed; a "Quality" slider (Fast ↔ Best) sits in the viewer toolbar.
    defaults: >-
      Fast in the viewer, Best for every export.
    automation: >-
      Fits the shadow casting box to the visible scene automatically when objects move outside it.
    usability_check: >-
      Users never need to open renderer options to get correct shadows in the three starter 3D scenes.
  acceptance: >-
    AS-2; mini scene "pbr-spheres": roughness/metal grid renders consistently between viewer Best and export.
  status: not-started
  evidence: []

- id: 3d.renderer-classic
  name: Classic 3D look and material options
  sources:
    - ref: S01
      item: Classic 3D renderer; Material Options (Ambient, Diffuse, Specular Intensity, Specular Shininess, Metal, Light Transmission)
      category: Work with 3D composition
      checked: false
    - ref: S01
      item: Modify materials properties of a 3D layer
      category: Work with materials
      checked: true
  artist_can: >-
    Light flat 2D layers in 3D with the simple Ambient/Diffuse/Specular/Shininess/Metal options and light transmission,
    for the graphic "lit postcard" look rather than photoreal shading.
  projection_example: >-
    Flat paper-cut illustrations on a facade catch a moving spotlight, with light glowing through a translucent banner.
  controls:
    - { name: Ambient, type: percent, animatable: true }
    - { name: Diffuse, type: percent, animatable: true }
    - { name: Specular intensity, type: percent, animatable: true }
    - { name: Specular shininess, type: percent, animatable: true }
    - { name: Metal, type: percent, animatable: true }
    - { name: Light transmission, type: percent, animatable: true }
  animation: >-
    All options keyframable and expression-linkable.
  dependencies: [3d.renderer, 3d.material-pbr, 3d.light]
  implementation: >-
    A "classic look" material preset on the same renderer: AE options map to PBR channels as documented by Adobe
    (Diffuse→base colour, Shininess→inverse roughness, Metal→metalness); light transmission is a TSL back-lighting node.
  io: >-
    none
  limitations: >-
    One renderer serves both looks; Classic 3D's exact shading and intersection quirks are not reproduced.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Not needed for projection workflows now: After Effects 3D/DCC parity item. Revisit if a show needs it."
  milestone: C
  beginner:
    action: >-
      Material picker → "Flat graphic" style.
    defaults: >-
      Ambient 100, Diffuse 100, Specular 0 so the 3D layer matches its 2D look.
    automation: >-
      Converting a 2D layer to 3D defaults to the flat-graphic style so artwork does not suddenly change colour.
    usability_check: >-
      Converting a graphic layer to 3D shows no visible colour change (ΔE < 2) under default lighting.
  acceptance: >-
    Mini scene "lit-postcards": a spotlight sweep across flat layers with light transmission renders identically in preview and export.
  status: not-started
  evidence: []

- id: 3d.renderer-cinema4d
  name: Cinema 4D composition renderer
  sources:
    - ref: S01
      item: CINEMA 4D Composition Renderer
      category: Work with compositions
      checked: false
  artist_can: >-
    Get extruded and bevelled type and shapes, environment reflections and curved footage layers without a separate
    renderer choice.
  projection_example: >-
    Chrome-bevelled show title over the entrance reflecting an environment map.
  controls:
    - { name: none (covered by 3d.extrude / 3d.environment-light / 3d.mesh-primitives), type: none, animatable: false }
  animation: >-
    See replacement entries.
  dependencies: [3d.renderer, 3d.extrude, 3d.environment-light, 3d.mesh-primitives]
  implementation: >-
    No second renderer. Extrusion and bevel come from 3d.extrude, reflections from 3d.environment-light, curved
    footage from the curved-panel primitive in 3d.mesh-primitives.
  io: >-
    none
  limitations: >-
    Superseded by 3d.renderer: the useful outcomes (extrusion, bevel, reflections, curved layers) are covered there and
    must be demonstrated in the mini scene below before this disposition is final.
  disposition: superseded
  superseded_by: 3d.renderer
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      Not a user-facing choice; reached through "Make it 3D" and the material picker.
    defaults: >-
      n/a
    automation: >-
      n/a
    usability_check: >-
      A user reproduces a bevelled reflective title and a curved video panel without choosing a renderer.
  acceptance: >-
    Mini scene "c4d-outcomes": bevelled reflective title plus curved footage panel.
  status: not-started
  evidence: []

- id: 3d.quality-modes
  name: Draft (real-time) vs final 3D quality
  sources:
    - ref: S01
      item: What is Draft 3D Preview
      category: 3D viewing and preview
      checked: true
    - ref: S10
      item: Draft 3D; Render Quality
      category: Work with 3D composition
      checked: true
  artist_can: >-
    Work interactively in a fast draft 3D view and switch to final quality to check the true look before export.
  projection_example: >-
    Scrub a heavy collapse scene in draft while blocking timing, then check final shadows and motion blur on one frame.
  controls:
    - { name: Viewer 3D quality, type: enum(draft|balanced|final), animatable: false }
    - { name: Draft skips (shadows/DOF/motion blur), type: flags, animatable: false }
    - { name: Show final for this frame, type: action, animatable: false }
  animation: >-
    n/a
  dependencies: [3d.renderer, preview.quality, preview.fidelity-disclosure]
  implementation: >-
    Same scene graph and evaluation for all modes; draft lowers pixel ratio, shadow-map size and PMREM resolution
    and skips DOF and motion-blur subframes. Exports always run at final quality.
  io: >-
    none
  limitations: >-
    Draft differs visibly from export; the difference is always disclosed by preview.fidelity-disclosure.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Viewer toggle "Fast / Best"; badge lists what Fast is skipping.
    defaults: >-
      Fast while dragging, Best when idle on a frame.
    automation: >-
      Automatically refines the paused frame to final quality in the background.
    usability_check: >-
      In a test, 8 of 10 users correctly say whether the viewer shows the export look after reading the badge.
  acceptance: >-
    Mini scene "heavy-collapse": draft playback ≥ 24 fps on the target GPU; final frame matches export within tolerance.
  status: not-started
  evidence: []

- id: 3d.viewport-aids
  name: Ground plane, extended viewer and venue ghost
  sources:
    - ref: S01
      item: 3D Ground Plane; Extended Viewer
      category: 3D viewing and preview
      checked: true
    - ref: brief
      item: §9 / §15 venue geometry distinct from creative geometry
      category: Product requirement
      checked: true
  artist_can: >-
    See a ground grid, view content beyond the frame edges, and see the measured building as a non-rendering ghost
    while placing creative objects.
  projection_example: >-
    Place a virtual balcony so it lines up with the real cornice shown as a wireframe ghost of the venue model.
  controls:
    - { name: Ground plane, type: bool, animatable: false }
    - { name: Extended viewer, type: bool, animatable: false }
    - { name: Venue ghost, type: enum(off|wireframe|shaded|photo), animatable: false }
    - { name: Ghost opacity, type: percent, animatable: false }
  animation: >-
    n/a (viewer state, saved per viewer)
  dependencies: [3d.scene, map.venue, map.model-3d, 3d.physical-vs-creative]
  implementation: >-
    Overlay passes drawn after the scene render in the viewer only; the venue ghost reads the locked venue geometry
    and is excluded from every render path like an AE guide layer.
  io: >-
    none
  limitations: >-
    Ghost shows the venue as surveyed; it is only as accurate as the venue model.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "Show the building" toggle in the 3D viewer.
    defaults: >-
      Ground plane and venue ghost on when a venue exists.
    automation: >-
      Ghost auto-hides inside the active camera frame when "Show final" is on.
    usability_check: >-
      A user aligns a virtual box to a ghosted window within 5 cm in under 2 minutes.
  acceptance: >-
    AS-2: tunnel geometry aligned to the doorway using the ghost; ghost never appears in any export.
  status: not-started
  evidence: []

- id: 3d.view-navigation
  name: Orbit, pan and dolly navigation and view layouts
  sources:
    - ref: S10
      item: Camera controls (dolly, orbit, pan)
      category: Work with 3D composition
      checked: true
    - ref: S01
      item: Work in 3D design space; view layouts; custom views
      category: Work with 3D composition
      checked: false
  artist_can: >-
    Orbit, pan and dolly around the scene, frame the selection, and use one, two or four viewers with custom and
    active-camera views.
  projection_example: >-
    Orbit behind the facade to check the tunnel walls are closed, then return to the audience camera.
  controls:
    - { name: Orbit / Pan / Dolly tools, type: tool, animatable: false }
    - { name: Frame selection, type: action, animatable: false }
    - { name: View layout, type: enum(1|2h|2v|4), animatable: false }
    - { name: View, type: enum(active-camera|custom-1|custom-2|custom-3|ortho), animatable: false }
    - { name: Navigation moves active camera, type: bool, animatable: false }
  animation: >-
    View navigation is not animation; with "moves active camera" enabled, navigation writes camera keyframes.
  dependencies: [3d.scene, 3d.camera, ux.operation-system]
  implementation: >-
    Viewer cameras are editor state saved per viewer (not undoable ops). Only the explicit "move active camera" mode
    emits camera transform ops, so looking around never silently edits the show.
  io: >-
    none
  limitations: >-
    Custom views cannot be rendered; render through a camera layer.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Middle-drag to orbit, scroll to dolly; "Back to audience view" button.
    defaults: >-
      Single viewer on the audience camera.
    automation: >-
      "Frame selection" picks a distance that fits the object.
    usability_check: >-
      Users who orbit away return to the audience view within 5 s in 10 of 10 trials.
  acceptance: >-
    Mini scene "orbit-check": navigation produces no undo entries and no camera changes unless the mode is on.
  status: not-started
  evidence: []

- id: 3d.view-ortho
  name: Orthographic and perspective views
  sources:
    - ref: S01
      item: 3D views (Front, Left, Top, Back, Right, Bottom, Custom)
      category: Work with 3D composition
      checked: false
    - ref: brief
      item: §9 orthographic and perspective views
      category: Product requirement
      checked: true
  artist_can: >-
    Check placement in front/side/top orthographic views and render through an orthographic camera when an undistorted
    elevation is needed.
  projection_example: >-
    Use the front orthographic view (an architectural elevation) to align a frieze exactly with the window rows.
  controls:
    - { name: Ortho view, type: enum(front|back|left|right|top|bottom), animatable: false }
    - { name: Camera projection, type: enum(perspective|orthographic), animatable: false }
    - { name: Ortho size, type: float, animatable: true }
  animation: >-
    Ortho size keyframable on camera layers.
  dependencies: [3d.view-navigation, 3d.camera]
  implementation: >-
    three.js OrthographicCamera for viewer and camera layers; drawing primitives in any view (as AE allows) places them
    on the view plane.
  io: >-
    none
  limitations: >-
    Depth of field is disabled in orthographic projection.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      View cube in the viewer corner: click "Front".
    defaults: >-
      Front view aligned to the venue's main facade normal.
    automation: >-
      Front view auto-aligns to the selected venue surface instead of world Z.
    usability_check: >-
      A user switches to front view and back in two clicks without help.
  acceptance: >-
    Mini scene "elevation-align": frieze aligned in front view matches region edges within 1 px at output.
  status: not-started
  evidence: []

- id: 3d.gizmo
  name: 3D transform gizmos
  sources:
    - ref: S01
      item: 3D Transform Gizmo; Single 3D gizmo for multiple 3D layers
      category: Work in 3D design space
      checked: false
  artist_can: >-
    Move, rotate and scale objects directly with on-canvas handles, including one gizmo for several selected objects.
  projection_example: >-
    Drag a group of virtual panels outward from the wall along its normal with a single handle.
  controls:
    - { name: Gizmo mode, type: enum(move|rotate|scale|universal), animatable: false }
    - { name: Axis space, type: enum(local|world|view|surface), animatable: false }
    - { name: Snap increment, type: float, animatable: false }
  animation: >-
    Gizmo drags set keyframes when the property already has keyframes (stopwatch on).
  dependencies: [3d.scene, ux.operation-system, proj.undo-redo, 3d.align-snap]
  implementation: >-
    A WebGPU overlay pass in the viewer with ray-picked handles; each drag emits typed transform ops merged into one
    undo step.
  io: >-
    none
  limitations: >-
    None beyond the operation model.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Select an object; arrows/rings appear. "Surface" axis mode moves along the wall.
    defaults: >-
      Universal gizmo, surface axes when a venue surface is under the object.
    automation: >-
      Chooses surface-aligned axes automatically for objects placed on venue surfaces.
    usability_check: >-
      A novice moves an object 1 m out from the wall in under 20 s.
  acceptance: >-
    Mini scene "panel-push": multi-select drag produces one undo step and correct per-object positions.
  status: not-started
  evidence: []

- id: 3d.pivot
  name: Object pivots
  sources:
    - ref: S01
      item: Anchor point in 3D; Pan Behind (Anchor Point) tool
      category: Work with layers
      checked: false
    - ref: brief
      item: §9 object pivots
      category: Product requirement
      checked: true
  artist_can: >-
    Move the point an object rotates and scales around without moving the object, snap it to bounds, edges or vertices.
  projection_example: >-
    Put a virtual door's pivot on its real hinge edge so it swings open like the building's door.
  controls:
    - { name: Pivot (anchor point), type: point3d, animatable: true }
    - { name: Pivot preset, type: enum(center|bottom-center|bounds-corner|origin), animatable: false }
    - { name: Snap pivot to vertex/edge, type: bool, animatable: false }
  animation: >-
    Pivot keyframable like the AE anchor point.
  dependencies: [3d.gizmo, 3d.align-snap, anim.keyframe.core]
  implementation: >-
    Pivot edits emit a compensating pair of ops (anchor + position) so the object stays put; vertex/edge snapping uses
    three-mesh-bvh raycasts.
  io: >-
    Imported model pivots come from the source file's node origin.
  limitations: >-
    Compensation is exact at the current time only when position is animated; the app warns before changing an animated pivot.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Right-click → "Rotate around…" → click an edge.
    defaults: >-
      Bottom-centre for primitives and models so they sit on surfaces.
    automation: >-
      Suggests the nearest venue edge as a hinge when a panel touches one.
    usability_check: >-
      A user sets a door hinge pivot and swings it in under 45 s.
  acceptance: >-
    AS-3 panels swing about region edges; pivot changes do not shift objects visually.
  status: not-started
  evidence: []

- id: 3d.align-snap
  name: 3D alignment and snapping
  sources:
    - ref: brief
      item: §9 alignment; §0.3 snapping and alignment guides
      category: Product requirement
      checked: true
  artist_can: >-
    Snap objects to vertices, edges, faces, the grid or the ground; drop them onto surfaces; align and distribute
    several objects.
  projection_example: >-
    Distribute twelve virtual lanterns evenly along a real ledge and snap each to the ledge face.
  controls:
    - { name: Snap targets, type: flags(vertex|edge|face|grid|ground|venue), animatable: false }
    - { name: Drop to surface, type: action, animatable: false }
    - { name: Align, type: enum(min|center|max), animatable: false }
    - { name: Distribute, type: enum(spacing|centers), animatable: false }
  animation: >-
    Alignment edits keyframes at the current time when properties are animated.
  dependencies: [3d.gizmo, 3d.physical-vs-creative, map.model-3d]
  implementation: >-
    three-mesh-bvh (MIT) acceleration on creative meshes and the read-only venue mesh; snapping never edits venue geometry.
  io: >-
    none
  limitations: >-
    Snapping precision is bounded by the venue model's accuracy.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Place on wall" and "Line up" buttons in the context toolbar.
    defaults: >-
      Venue faces and edges are snap targets when a venue exists.
    automation: >-
      Dropped objects orient to the face normal automatically.
    usability_check: >-
      A user lines up 6 objects evenly on a ledge in under 60 s.
  acceptance: >-
    Mini scene "lanterns-on-ledge": all objects within 1 mm of the face after drop-to-surface.
  status: not-started
  evidence: []

- id: 3d.units-scale
  name: Units and real-world scale
  sources:
    - ref: S01
      item: Model Settings — Object Scale, Model Units, Make Comp Size
      category: Import and add 3D models
      checked: true
    - ref: brief
      item: §9 units and scale
      category: Product requirement
      checked: true
  artist_can: >-
    Work in real units (metres, centimetres or feet) that match the measured venue, and read sizes and distances in those units.
  projection_example: >-
    A 3 m doorway in the survey is 3 m in the creative scene, so a 1.8 m virtual figure walking through looks human-sized.
  controls:
    - { name: Display units, type: enum(m|cm|mm|ft|in), animatable: false }
    - { name: Pixels per metre (2.5D layers), type: float, animatable: false }
    - { name: Measure tool, type: tool, animatable: false }
  animation: >-
    n/a
  dependencies: [3d.scene, map.venue]
  implementation: >-
    The internal scene unit is the metre. 2D layers placed in 3D use a per-composition pixels-per-metre factor; models
    are converted from their declared units (glTF metres, FBX UnitScaleFactor, OBJ asked on import).
  io: >-
    Model import converts units; exported 3D data (pass.depth) is in metres.
  limitations: >-
    AE projects use pixels as 3D units; values carried from AE habits need the pixels-per-metre factor.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Sizes show in metres in the inspector; a ruler tool measures on the canvas.
    defaults: >-
      Metres; pixels-per-metre derived from the venue region when present.
    automation: >-
      Detects implausible model scale (e.g. a 300 m chair) and offers "Fit to real size".
    usability_check: >-
      A user imports a mis-scaled model and corrects it with one click when prompted.
  acceptance: >-
    Mini scene "scale-check": a 1 m cube measures 1 m against the venue survey in the viewer.
  status: not-started
  evidence: []

- id: 3d.hierarchy
  name: 3D hierarchy, nulls and model node access
  sources:
    - ref: S01
      item: Parenting and null objects in 3D; FAQ — "Can I access the rigging of 3D models?"
      category: Work with layers / Import and add 3D models
      checked: false
    - ref: brief
      item: §9 consistent transforms and hierarchy
      category: Product requirement
      checked: true
  artist_can: >-
    Parent objects to 3D nulls and to each other, and move, hide or re-material individual parts of an imported model.
  projection_example: >-
    Animate each window shutter of an imported facade-ornament model separately to flap open in sequence.
  controls:
    - { name: Parent, type: layer-ref, animatable: false }
    - { name: Model node transform override, type: transform3d, animatable: true }
    - { name: Model node visible, type: bool, animatable: true }
  animation: >-
    Node overrides keyframable and drivable by rigs (expr.rigs) and tool.sequence-light-up timing.
  dependencies: [3d.scene, 3d.model-import, expr.rigs, tool.sequence-light-up]
  implementation: >-
    glTF/FBX nodes map to stable node paths; overrides are stored by path so re-importing an updated model keeps them,
    with a report of paths that no longer exist.
  io: >-
    Overrides survive model reimport where node paths match.
  limitations: >-
    No skeleton editing or re-rigging; skinned bones can be overridden but IK is out of scope (use the DCC path).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Click a part of a model to select just that part; "Animate parts in sequence".
    defaults: >-
      Model selected as a whole first, parts on double-click.
    automation: >-
      Groups identical parts (e.g. all shutters) for one-step sequencing.
    usability_check: >-
      A user selects one part of a model and changes its colour in under 30 s.
  acceptance: >-
    Mini scene "shutters": per-node overrides survive save, reopen and model reimport.
  status: not-started
  evidence: []

- id: 3d.camera
  name: Camera layers
  sources:
    - ref: S01
      item: Cameras, camera settings, Adjust Default Camera Settings
      category: Work with 3D composition
      checked: false
    - ref: brief
      item: §9 camera control; §15 projector vs content vs audience camera
      category: Product requirement
      checked: true
  artist_can: >-
    Add one-node or two-node cameras with focal length, angle of view, film size and clipping, and animate them.
  projection_example: >-
    A slow dolly into the tunnel from the audience viewpoint makes the illusion feel deeper as the music builds.
  controls:
    - { name: Type, type: enum(one-node|two-node), animatable: false }
    - { name: Focal length / Zoom, type: float, animatable: true }
    - { name: Angle of view, type: angle, animatable: true }
    - { name: Film size, type: float, animatable: false }
    - { name: Lens preset, type: enum(15mm|20mm|24mm|28mm|35mm|50mm|80mm|135mm|200mm), animatable: false }
    - { name: Near/far clip, type: float, animatable: true }
  animation: >-
    All camera properties keyframable, expression-linkable and trackable (track.camera-solve output).
  dependencies: [3d.scene, anim.keyframe.core, 3d.units-scale]
  implementation: >-
    three.js PerspectiveCamera driven by evaluated properties; zoom/film-size conversions follow AE's model so imported
    camera data maps directly. Projector cameras are separate objects owned by map.projector.
  io: >-
    Camera data exportable as JSON/.chan for external tools; import from glTF and track.camera-solve.
  limitations: >-
    A creative camera is not the projector; editing it never alters calibration.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "Camera move" recipe: choose Push in / Drift / Orbit, set amount and duration.
    defaults: >-
      Camera at the saved audience viewpoint, 35 mm equivalent.
    automation: >-
      Creates the audience camera from the venue's audience position automatically.
    usability_check: >-
      A novice adds a 5 s push-in that keeps the tunnel framed in under 60 s.
  acceptance: >-
    AS-2 camera move; camera values identical after save/reopen and at random-access seek.
  status: not-started
  evidence: []

- id: 3d.camera-path
  name: Camera paths and point of interest
  sources:
    - ref: S01
      item: Point of Interest; Auto-Orient; motion paths in 3D
      category: Work with 3D composition
      checked: false
    - ref: brief
      item: §9 camera paths
      category: Product requirement
      checked: true
  artist_can: >-
    Move a camera along a drawn 3D path at constant or eased speed while it looks at a point of interest or along the path.
  projection_example: >-
    A fly-through that travels down the tunnel at constant speed, always looking at the far light.
  controls:
    - { name: Point of interest, type: point3d, animatable: true }
    - { name: Orient, type: enum(off|toward-poi|along-path), animatable: false }
    - { name: Path source, type: layer-ref, animatable: false }
    - { name: Constant speed, type: bool, animatable: false }
    - { name: Bank/roll, type: angle, animatable: true }
  animation: >-
    Path progress keyframable with ease curves; roving keyframes for constant speed.
  dependencies: [3d.camera, anim.motion-path, anim.graph-editor, shape.path]
  implementation: >-
    Spatial Bezier evaluation in core with arc-length reparameterisation; look-at quaternions computed per frame;
    orbit/fly-through rigs generated by the recipe engine as editable nulls and keyframes.
  io: >-
    none
  limitations: >-
    Look-at flips near vertical; bank control resolves it manually.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Fly along a path": draw the path in the viewer, pick a speed.
    defaults: >-
      Look along the path; ease in/out of 0.5 s.
    automation: >-
      Smooths hand-drawn paths and sets constant speed.
    usability_check: >-
      A user creates a fly-through in under 2 minutes without touching the graph editor.
  acceptance: >-
    Mini scene "tunnel-flythrough": measured speed variation under 1% with constant speed on.
  status: not-started
  evidence: []

- id: 3d.camera-multi
  name: Multiple cameras and camera switching
  sources:
    - ref: S01
      item: Active camera (topmost camera layer) and multiple cameras
      category: Work with 3D composition
      checked: false
    - ref: brief
      item: §9 multiple cameras; §15 projector, content and audience cameras
      category: Product requirement
      checked: true
  artist_can: >-
    Keep several cameras in a scene and cut or switch between them over time; see clearly which camera is creative,
    which is the audience preview and which belong to projectors.
  projection_example: >-
    Cut from a wide audience view to a close camera for an inset scene shown inside one window.
  controls:
    - { name: Active camera at time, type: derived, animatable: false }
    - { name: Camera role, type: enum(creative|audience-preview), animatable: false }
    - { name: Camera switcher track, type: layer-ref, animatable: true }
  animation: >-
    Switching via layer trims (AE rule) or a camera-switch track with hold keyframes.
  dependencies: [3d.camera, map.projector, proj.layer]
  implementation: >-
    Active camera resolved per frame as the topmost enabled camera (AE semantics) unless a switch track exists.
    Projector cameras are referenced read-only from map.projector and cannot become creative cameras.
  io: >-
    none
  limitations: >-
    Perspective-dependent illusions are only correct from the chosen audience viewpoint; other cameras reveal that.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Camera list in the viewer with "Look through" and "Cut to this camera here".
    defaults: >-
      One audience camera; extra cameras labelled by role.
    automation: >-
      Warns when the active creative camera differs from the audience viewpoint used for an illusion.
    usability_check: >-
      A user adds a second camera and cuts to it at a marker in under 60 s.
  acceptance: >-
    Mini scene "two-cam-cut": cut lands on the exact frame; projector output unaffected.
  status: not-started
  evidence: []

- id: 3d.depth-of-field
  name: Camera depth of field
  sources:
    - ref: S01
      item: Camera Options — Depth of Field, Focus Distance, Aperture, Blur Level, Iris shape/rotation/roundness, Highlight gain/threshold/saturation
      category: Work with 3D composition
      checked: false
    - ref: brief
      item: §9 depth of field
      category: Product requirement
      checked: true
  artist_can: >-
    Focus the camera at a distance or on a layer so nearer and farther objects blur with a controllable bokeh.
  projection_example: >-
    Rack focus from the front of the tunnel to a figure at its end as the music changes.
  controls:
    - { name: Depth of field, type: bool, animatable: false }
    - { name: Focus distance, type: float, animatable: true }
    - { name: Link focus to layer, type: layer-ref, animatable: false }
    - { name: Aperture / f-stop, type: float, animatable: true }
    - { name: Blur level, type: percent, animatable: true }
    - { name: Iris shape, type: enum(fast-rect|triangle|square|pentagon|hexagon|heptagon|octagon|nonagon|decagon), animatable: false }
    - { name: Iris rotation / roundness, type: float, animatable: true }
    - { name: Highlight gain / threshold / saturation, type: float, animatable: true }
  animation: >-
    Focus and aperture keyframable; focus can follow a layer by expression.
  dependencies: [3d.camera, pass.depth, fx.blur-sharpen.camera-lens-blur, fx.3d-channel.depth-of-field]
  implementation: >-
    Thin-lens circle of confusion from the linear depth pass, then a WGSL gather bokeh pass with separate near/far
    layers to limit edge bleeding; shared code with the depth-of-field effects.
  io: >-
    none
  limitations: >-
    Post-process DOF cannot reveal occluded background. The real projector has its own optical focus; this is an artistic look.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Not needed for projection workflows now: After Effects 3D/DCC parity item. Revisit if a show needs it."
  milestone: D
  beginner:
    action: >-
      "Focus on…" then click an object; "Blur strength" slider.
    defaults: >-
      Off; when enabled, focus on the clicked object with moderate blur.
    automation: >-
      Keeps focus on a moving object by linking focus distance automatically.
    usability_check: >-
      A user creates a rack focus between two objects in under 90 s.
  acceptance: >-
    Mini scene "rack-focus": bokeh matches between viewer Best and export; no halo beyond tolerance at depth edges.
  status: not-started
  evidence: []

- id: 3d.motion-blur
  name: 3D motion blur
  sources:
    - ref: S01
      item: Motion blur — Shutter Angle, Shutter Phase, Samples Per Frame, Adaptive Sample Limit
      category: Composition settings / Advanced
      checked: false
    - ref: brief
      item: §9 motion blur
      category: Product requirement
      checked: true
  artist_can: >-
    Add realistic motion blur to moving 3D objects and cameras with shutter angle and phase control.
  projection_example: >-
    Falling bricks in a collapse streak naturally instead of strobing on the facade.
  controls:
    - { name: Motion blur (layer/comp switches), type: bool, animatable: false }
    - { name: Shutter angle, type: angle, animatable: false }
    - { name: Shutter phase, type: angle, animatable: false }
    - { name: Samples per frame, type: int, animatable: false }
    - { name: Adaptive sample limit, type: int, animatable: false }
  animation: >-
    n/a (render setting per layer/composition)
  dependencies: [3d.renderer, 3d.quality-modes, render.settings]
  implementation: >-
    Final quality renders N subframes at exact flick offsets inside the shutter interval and averages them in linear
    light (deterministic). Draft uses a velocity-buffer blur node and is flagged as approximate.
  io: >-
    none
  limitations: >-
    Cost scales with samples; very fast rotation may need more samples than the adaptive limit.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Not needed for projection workflows now: After Effects 3D/DCC parity item. Revisit if a show needs it."
  milestone: D
  beginner:
    action: >-
      "Smooth fast motion" toggle on the object or scene.
    defaults: >-
      180° shutter, -90° phase, 16 samples.
    automation: >-
      Turns on automatically for recipes with fast motion (collapse, fly-through).
    usability_check: >-
      Users can tell blur is on from the viewer badge and the export matches it in a side-by-side check.
  acceptance: >-
    AS-3 fragments; per-frame hash identical across two exports.
  status: not-started
  evidence: []

- id: 3d.light
  name: 3D lights
  sources:
    - ref: S01
      item: Light layers — Parallel, Spot, Point, Ambient, Environment; Intensity, Color, Falloff (None, Smooth, Inverse Square Clamped), Radius, Cone Angle/Feather
      category: Work with 3D composition
      checked: false
    - ref: S01
      item: Modify materials properties — Inverse Square Clamped falloff tip
      category: Work with materials
      checked: true
  artist_can: >-
    Add parallel, spot, point, ambient and environment lights with colour, intensity, falloff and cone controls.
  projection_example: >-
    A virtual torch beam sweeps across carved stone shapes so they seem to cast real relief shadows.
  controls:
    - { name: Light type, type: enum(parallel|spot|point|ambient|environment), animatable: false }
    - { name: Intensity, type: percent, animatable: true }
    - { name: Colour, type: color, animatable: true }
    - { name: Falloff, type: enum(none|smooth|inverse-square-clamped), animatable: false }
    - { name: Radius / falloff distance, type: float, animatable: true }
    - { name: Cone angle / feather, type: angle, animatable: true }
    - { name: Casts shadows, type: bool, animatable: false }
  animation: >-
    All values keyframable, expression-linkable and audio-drivable (lights pulsing with the bass).
  dependencies: [3d.scene, 3d.renderer, 3d.shadows, 3d.environment-light]
  implementation: >-
    three.js DirectionalLight, SpotLight, PointLight (decay 2 for inverse square) and AmbientLight with a documented
    AE-percent to physical-intensity mapping; Environment delegates to 3d.environment-light.
  io: >-
    Lights import from glTF KHR_lights_punctual (3d.model-lights-cameras).
  limitations: >-
    Virtual light only brightens the projected image; it cannot exceed the projector's brightness on the real surface.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "Light it" recipe: Soft / Dramatic / Sweep; drag the light handle on the canvas.
    defaults: >-
      Key light from the upper left of the audience view plus ambient fill.
    automation: >-
      Proposes lighting from the venue's orientation and the audience viewpoint.
    usability_check: >-
      A novice adds a sweeping spotlight across a model in under 90 s.
  acceptance: >-
    AS-2 tunnel lighting; light intensity identical in preview and export.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: 3d.light-linking
  name: Light and shadow participation (Accepts Lights, Casts/Accepts Shadows)
  sources:
    - ref: S01
      item: Accepts Lights; Cast Shadows; Receive/Accepts Shadows (Only = shadow catcher)
      category: Create realistic reflections and ambient lighting / Shadow catchers
      checked: true
    - ref: S01
      item: Light Transmission (Material Options)
      category: Work with 3D composition
      checked: false
  artist_can: >-
    Choose per object whether it is lit, casts shadows or receives shadows, and limit lights to chosen objects.
  projection_example: >-
    Keep a glowing neon sign unlit by the scene lights so it stays fully bright while a spotlight sweeps the wall.
  controls:
    - { name: Accepts lights, type: bool, animatable: false }
    - { name: Casts shadows, type: enum(on|off|only), animatable: false }
    - { name: Accepts shadows, type: enum(on|off|only), animatable: false }
    - { name: Light include list, type: layer-refs, animatable: false }
  animation: >-
    n/a
  dependencies: [3d.light, 3d.shadows]
  implementation: >-
    TSL per-material lights node (material.lightsNode) for include lists; unlit objects use MeshBasicNodeMaterial with
    base and emission only; shadow flags map to castShadow/receiveShadow and the shadow-catcher material.
  io: >-
    none
  limitations: >-
    Environment reflections cannot be linked per light; only on/off per object.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      Inspector toggles "Lit by scene" and "Casts shadow".
    defaults: >-
      Everything lit and casting; emissive-only materials default to unlit.
    automation: >-
      Turns off "Lit by scene" automatically for objects using a "glow/neon" material.
    usability_check: >-
      A user makes one object ignore a light in under 30 s.
  acceptance: >-
    Mini scene "neon-under-spot": neon brightness unchanged as the spotlight passes.
  status: not-started
  evidence: []

- id: 3d.shadows
  name: Shadows
  sources:
    - ref: S01
      item: Cast and accept shadows; Enable lights to cast shadows; Shadow Darkness, Shadow Diffusion
      category: Cast and accept shadows
      checked: false
    - ref: S10
      item: Shadows — Resolution, Smoothness, Casting Box
      category: Advanced 3D renderer
      checked: true
  artist_can: >-
    Make lights cast soft or hard shadows of controllable darkness from objects onto other objects.
  projection_example: >-
    Virtual pillars cast long shadows across a projected floor pattern as a sun light sets.
  controls:
    - { name: Shadow darkness, type: percent, animatable: true }
    - { name: Shadow diffusion / softness, type: float, animatable: true }
    - { name: Shadow resolution, type: enum(half|full|double), animatable: false }
    - { name: Casting box, type: box3, animatable: false }
  animation: >-
    Darkness and softness keyframable.
  dependencies: [3d.light, 3d.renderer, 3d.light-linking]
  implementation: >-
    three.js shadow maps per light (cascaded shadow maps for directional, cube maps for point) with PCF-soft filtering;
    resolution tiers map to map sizes 1024/2048/4096; fixed sampling patterns for reproducibility.
  io: >-
    Shadow-only pass available via pass.render-passes.
  limitations: >-
    Very soft area-light shadows are approximated; contact shadows are not ray traced.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      "Shadows" toggle on a light, with a Soft ↔ Sharp slider.
    defaults: >-
      Key light casts medium-soft shadows; casting box fits the scene.
    automation: >-
      Refits shadow bounds when objects move far.
    usability_check: >-
      A user turns on shadows and softens them in under 20 s.
  acceptance: >-
    AS-2 tunnel shadows; no shadow acne at default settings in starter scenes.
  status: not-started
  evidence: []

- id: 3d.shadow-catcher
  name: Shadow catcher
  sources:
    - ref: S01
      item: Shadow catchers — Accepts Shadows set to Only, Shadow Color
      category: Cast and accept shadows
      checked: true
  artist_can: >-
    Make an invisible surface that only shows the shadows falling on it, so virtual objects cast shadows onto other
    footage or onto the real building.
  projection_example: >-
    A giant virtual ball rolls along a real ledge and its shadow falls on the real wall below.
  controls:
    - { name: Shadow-only surface, type: bool, animatable: false }
    - { name: Shadow colour, type: color, animatable: true }
    - { name: Catcher source, type: enum(plane|venue-surface), animatable: false }
  animation: >-
    Shadow colour and opacity keyframable; follows embedded model animation.
  dependencies: [3d.shadows, 3d.light-linking, 3d.physical-vs-creative, map.model-3d]
  implementation: >-
    ShadowNodeMaterial (shadow-only, transparent) on a plane or on a read-only proxy instance of the venue mesh, so the
    shadow lands exactly on the surveyed geometry.
  io: >-
    none
  limitations: >-
    A projected shadow can only be darker than surrounding projected light; it cannot darken the wall below its
    ambient-lit appearance with the projector off.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      "Cast shadows on the building" toggle on a 3D object.
    defaults: >-
      Uses venue surfaces under the object as catchers; black shadow at 60%.
    automation: >-
      Creates the catcher from the venue geometry automatically; no manual plane alignment.
    usability_check: >-
      A user makes a model cast a shadow on the facade in two actions.
  acceptance: >-
    AS-2/AS-3 shadows land on venue surfaces within the calibration tolerance.
  status: not-started
  evidence: []

- id: 3d.environment-light
  name: Environment lights (image-based lighting)
  sources:
    - ref: S01
      item: Image-Based Lighting — Environment light Source (.hdr/.exr, footage or composition), Cast Shadows, Create Environment Light Background Layer
      category: Create realistic reflections and ambient lighting
      checked: true
    - ref: S01
      item: Animated Environment Lights
      category: Create realistic reflections and ambient lighting
      checked: false
  artist_can: >-
    Light and reflect a scene from an HDR image, video or animated composition surrounding it, optionally showing it as background.
  projection_example: >-
    Chrome letters over the entrance reflect a slowly rotating sunset HDR that matches the show's colour story.
  controls:
    - { name: Source, type: layer-ref, animatable: false }
    - { name: Intensity, type: percent, animatable: true }
    - { name: Rotation, type: vector3, animatable: true }
    - { name: Casts shadows, type: bool, animatable: false }
    - { name: Show as background, type: bool, animatable: false }
  animation: >-
    Intensity and rotation keyframable; animated sources update per frame.
  dependencies: [3d.light, 3d.renderer]
  implementation: >-
    EXRLoader/HDRLoader equirect → PMREMGenerator on the GPU; animated sources regenerate PMREM per frame at reduced
    resolution, cached by source-frame hash. Environment shadows use a derived directional light from the brightest
    region (approximation of AE voxel shadows), disclosed in the inspector.
  io: >-
    Reads .hdr, .exr, footage and precomps as sources.
  limitations: >-
    Animated environments cost a PMREM rebuild per frame; LDR sources give flat lighting.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      "Lighting mood" picker with HDR thumbnails (Studio, Sunset, Night city).
    defaults: >-
      Neutral studio HDR when 3D objects exist and no lights are added.
    automation: >-
      Converts 8-bit images to float on assignment and warns that they will light flatly.
    usability_check: >-
      A user changes a scene's lighting mood in one click and sees reflections update.
  acceptance: >-
    Mini scene "chrome-title": reflections match between preview Best and export.
  status: not-started
  evidence: []

- id: 3d.material-pbr
  name: PBR materials
  sources:
    - ref: S01
      item: Parametric mesh material — Base Color, Roughness, Metallic, Emission Color, Emission Intensity, Ambient Response
      category: Create parametric meshes
