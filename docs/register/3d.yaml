  artist_can: >-
    Give text and shape layers real depth with front, bevel, side and back faces, each with its own material.
  projection_example: >-
    The show title extrudes out of the facade with a gold bevel, then rotates to reveal its depth.
  controls:
    - { name: Extrusion depth, type: float, animatable: true }
    - { name: Bevel style, type: enum(none|angular|concave|convex|stepped), animatable: false }
