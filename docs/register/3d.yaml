- id: 3d.dcc-import
  name: External DCC import path (Blender bridge)
  sources:
    - ref: brief
      item: §9 retain paths for importing externally authored complex geometry, rigs, simulations and animation
      category: Product requirement
      checked: true
    - ref: S01
      item: FAQ — "Will more 3D model formats be supported, such as USDZ, FBX, Alembic"
      category: Import and add 3D models
      checked: true
  artist_can: >-
    Bring in work from other 3D tools (.blend, .fbx, .dae, .ply, .stl and others) through an automatic conversion, and
    send a model to Blender and back.
  projection_example: >-
    A rigged creature animated in Blender is converted to GLB on import and plays in the show.
  controls:
    - { name: Source file, type: file, animatable: false }
    - { name: Bake animation, type: bool, animatable: false }
    - { name: Open in Blender / reimport, type: action, animatable: false }
  animation: >-
    Animation baked to glTF clips (skins, morphs, node TRS).
  dependencies: [3d.model-import, 3d.model-format-gltf]
  implementation: >-
    Blender headless (bpy, GPL acceptable for personal use) run as a job: import with Blender's importers, export GLB
    with baked animation; watched-file reimport preserves node-path overrides.
  io: >-
    Requires a local Blender install (detected or user-pointed); conversions cached by source hash.
  limitations: >-
    Procedural rigs, constraints and modifiers not baked by Blender's glTF exporter are lost; the import report lists them.
  disposition: required-integration
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      Drag any supported 3D file in; conversion is automatic.
    defaults: >-
      Bake all animation, Y-up, metres.
    automation: >-
      Finds Blender, converts, imports, and reports what could not be carried over.
    usability_check: >-
      A user imports a .blend without knowing a conversion happened (task success 9 of 10).
  acceptance: >-
    Mini scene "blend-creature": converted animation matches Blender's viewport playback within tolerance.
  status: not-started
  evidence: []

- id: 3d.dcc-alembic
  name: Alembic cache import
  sources:
    - ref: S01
      item: FAQ — Alembic support question
      category: Import and add 3D models
      checked: true
    - ref: brief
      item: §9 externally authored simulations and animation
      category: Product requirement
      checked: true
  artist_can: >-
    Bring in baked cloth, fluid or destruction caches from other tools as animated meshes.
  projection_example: >-
    A cloth banner simulated in Blender unfurls down the facade.
  controls:
    - { name: Cache file, type: file, animatable: false }
    - { name: Playback mode, type: enum(morph-targets|vertex-texture|point-sprite), animatable: false }
  animation: >-
    Cache time remappable.
  dependencies: [3d.dcc-import, 3d.model-animation]
  implementation: >-
    Candidate: Blender headless reads .abc and bakes to glTF morph targets (constant topology) or a vertex-animation
    texture (changing topology). No maintained three.js Alembic loader exists.
  io: >-
    Large caches may exceed VRAM; streaming would be required.
  limitations: >-
    Decision 2026-10-02: import Alembic through headless Blender conversion to glTF / point caches, needed for content originating in other 3D tools and simulations.

    Open question: are in-app animated caches needed, or are pre-rendered EXR passes (pass.exr-read) enough for the
    shows planned? Topology-changing fluid meshes are the hard case.
  disposition: required-integration
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      Drag an .abc file in (if adopted).
    defaults: >-
      Auto-select playback mode by topology.
    automation: >-
      Conversion via Blender.
    usability_check: >-
      A user imports a cloth cache and scrubs it smoothly.
  acceptance: >-
    Decision recorded; if adopted, mini scene "cloth-banner".
  status: not-started
  evidence: []

