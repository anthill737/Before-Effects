      checked: false
  artist_can: >-
    Draw or add cubes, spheres, cylinders, cones, tori, planes and curved panels with editable dimensions and segments.
  projection_example: >-
    Build a tunnel from a stretched open cylinder and boxes, and a curved panel that wraps video around a rounded tower.
  controls:
    - { name: Shape, type: enum(cube|sphere|cylinder|cone|torus|plane|curved-panel), animatable: false }
