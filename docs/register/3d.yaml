    each settable by value or texture.
  projection_example: >-
    Turn a virtual copy of the facade from stone to polished copper by animating metallic and roughness.
  controls:
    - { name: Base colour (+ map), type: color, animatable: true }
    - { name: Roughness (+ map), type: percent, animatable: true }
    - { name: Metallic (+ map), type: percent, animatable: true }
    - { name: Specular level, type: percent, animatable: true }
    - { name: Ambient response, type: percent, animatable: true }
    - { name: Ambient occlusion map, type: texture, animatable: false }
  animation: >-
    All channel values keyframable, expression-linkable and audio-drivable; texture transforms animatable.
  dependencies: [3d.renderer, 3d.material-texture-source]
  implementation: >-
    Materials are project assets compiled to MeshStandardNodeMaterial/MeshPhysicalNodeMaterial TSL graphs; channel
    uniforms update per frame without recompiling; texture channels sampled with KHR_texture_transform-style UV transforms.
  io: >-
    Imported glTF metallic-roughness materials map 1:1; OBJ/FBX materials are approximated.
  limitations: >-
    Material appearance on a real wall depends on the wall's colour and ambient light (see color.simulate-output).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Material picker with swatches (Stone, Metal, Glass, Glow) and a "Shiny ↔ Matte" slider.
    defaults: >-
      Neutral off-white, roughness 60%, non-metal.
    automation: >-
      Material previews render on the selected object in the viewer before applying.
    usability_check: >-
      A user makes an object look like brushed metal in under 30 s without numeric input.
  acceptance: >-
    Mini scene "pbr-spheres"; AS-3 material change.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: 3d.material-emissive
  name: Emissive materials
  sources:
    - ref: S01
      item: Emission Color; Emission Intensity (does not cast light onto other objects)
      category: Create parametric meshes
      checked: true
  artist_can: >-
    Make surfaces glow with a colour or emission map at a chosen intensity, independent of scene lights.
  projection_example: >-
    Window frames of a virtual building copy glow neon blue on beat while the rest stays dark.
  controls:
    - { name: Emission colour (+ map), type: color, animatable: true }
    - { name: Emission intensity, type: float, animatable: true }
    - { name: Light nearby objects (approx.), type: bool, animatable: false }
  animation: >-
    Intensity is the most commonly audio-driven property; fully keyframable.
  dependencies: [3d.material-pbr, audio.drive]
  implementation: >-
    TSL emissive node in scene-linear HDR (values above 1.0 survive into bloom effects). Optional approximate
    illumination places RectAreaLights (LTC) matching large emitters.
  io: >-
    glTF KHR_materials_emissive_strength honoured.
  limitations: >-
    Emission does not light other objects unless the approximation is enabled (same as AE Advanced 3D).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      "Glow" material swatch; "Brightness" slider.
    defaults: >-
      Emission colour = base colour, intensity 2.
    automation: >-
      Adds a glow effect suggestion after making something emissive.
    usability_check: >-
      A user makes window frames glow and pulse to music in three actions.
  acceptance: >-
    AS-1/AS-3 neon accents; HDR emission survives to export without clipping before the output transform.
  status: not-started
  evidence: []

- id: 3d.material-normal
  name: Normal, bump and displacement maps
  sources:
    - ref: brief
      item: §9 normal and texture controls
      category: Product requirement
      checked: true
  artist_can: >-
    Add surface relief with normal or bump maps and true geometric displacement from a height map.
  projection_example: >-
    A flat virtual wall gains deep brick relief that catches a moving light, exaggerating the real masonry.
  controls:
    - { name: Normal map, type: texture, animatable: false }
    - { name: Normal strength, type: float, animatable: true }
    - { name: Bump map / height, type: texture, animatable: false }
    - { name: Displacement amount, type: float, animatable: true }
    - { name: Subdivision for displacement, type: int, animatable: false }
  animation: >-
    Strength and displacement keyframable; height source may be an animated comp (breathing walls).
  dependencies: [3d.material-pbr, 3d.material-texture-source]
  implementation: >-
    TSL normalMap(), bumpMap() and vertex displacement via positionNode on subdivided geometry.
  io: >-
    glTF normal maps (tangent-space) map directly.
  limitations: >-
    Displacement requires dense meshes; normal maps only change shading, not silhouettes.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      "Surface relief" slider in the material picker.
    defaults: >-
      Relief from the material preset's map.
    automation: >-
      Generates a normal map from a height/greyscale image automatically.
    usability_check: >-
      A user adds visible relief to a surface in under 30 s.
  acceptance: >-
    Mini scene "relief-sweep": light sweep over normal-mapped wall matches in preview and export.
  status: not-started
  evidence: []

- id: 3d.material-transparency
  name: Opacity, transmission and glass
  sources:
    - ref: S01
      item: Use layers as material sources — Opacity material stream
      category: Work with materials
      checked: true
    - ref: brief
      item: §9 transparency
      category: Product requirement
      checked: true
  artist_can: >-
    Make surfaces transparent, cut-out or glass-like with index of refraction and thickness.
  projection_example: >-
    A wall section turns to glass, revealing virtual machinery behind it.
  controls:
    - { name: Opacity (+ map), type: percent, animatable: true }
    - { name: Alpha mode, type: enum(blend|mask|opaque), animatable: false }
    - { name: Transmission, type: percent, animatable: true }
    - { name: IOR, type: float, animatable: true }
    - { name: Thickness, type: float, animatable: true }
    - { name: Double-sided, type: bool, animatable: false }
  animation: >-
    Opacity and transmission keyframable (material dissolves).
  dependencies: [3d.material-pbr, 3d.renderer]
  implementation: >-
    MeshPhysicalNodeMaterial transmission/IOR/thickness (screen-space transmission); alpha blending with sorted
    transparent objects; alpha-mask via alphaTest.
  io: >-
    glTF KHR_materials_transmission/volume/ior honoured.
  limitations: >-
    No order-independent transparency; intersecting transparent objects can sort wrongly. Transmission is screen-space.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      "Glass" swatch; "See-through" slider.
    defaults: >-
      Transmission 100%, IOR 1.5, roughness 5%.
    automation: >-
      Enables double-sided and sorting hints automatically for glass presets.
    usability_check: >-
      A user turns a box into glass in one click.
  acceptance: >-
    Mini scene "glass-wall": transmission stable across seeks; no sort flicker in the starter scene.
  status: not-started
  evidence: []

- id: 3d.material-texture-source
  name: Video and compositions as material textures
  sources:
    - ref: S01
      item: Use layers as material sources — precomp, solid, image or video; Offset, Rotation, Scale
      category: Work with materials
      checked: true
    - ref: brief
      item: §9 images, videos and animated compositions as material sources
      category: Product requirement
      checked: true
  artist_can: >-
    Use any image, video or animated composition as a live texture on a 3D object, positioned with offset, rotation and scale.
  projection_example: >-
    The tunnel walls play a looping animated graffiti composition that updates live as it is edited.
  controls:
    - { name: Source, type: layer-ref, animatable: false }
    - { name: Channel, type: enum(base|emission|roughness|metallic|opacity|normal|height), animatable: false }
    - { name: Offset / Rotation / Scale, type: transform2d, animatable: true }
    - { name: Wrap, type: enum(repeat|clamp|mirror), animatable: false }
    - { name: Source time offset / loop, type: time, animatable: true }
  animation: >-
    UV transform keyframable; source time is remappable (anim.time-remap).
  dependencies: [3d.material-pbr, proj.precompose, anim.time-remap]
  implementation: >-
    The render graph renders the source comp to an rgba16float texture first (sized to its on-screen footprint, capped
    by budget) and binds it to a TSL texture node; mipmaps generated per frame for minification.
  io: >-
    none
  limitations: >-
    Very large sources are resampled to fit VRAM budgets; the inspector shows the effective texture resolution.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Drag a clip or composition onto a 3D object.
    defaults: >-
      Fit to the object's UVs; loop the source.
    automation: >-
      Picks texture resolution from on-screen size automatically.
    usability_check: >-
      A user puts a video on a 3D wall by drag-and-drop in under 15 s.
  acceptance: >-
    AS-2 tunnel walls textured with an animated comp; frame-exact source time in export.
  status: not-started
  evidence: []

- id: 3d.material-assign
  name: Material assignment, extraction and replacement on models
  sources:
    - ref: S01
      item: Model Settings — Extract all materials; Material Assignment
      category: Import and add 3D models / Work with materials
      checked: true
  artist_can: >-
    Pull a model's materials out as editable project materials and assign or swap materials per part.
  projection_example: >-
    Swap the stone material on every column of a facade model to animated marble in one step.
  controls:
    - { name: Extract materials, type: action, animatable: false }
    - { name: Material slot per part, type: material-ref, animatable: false }
    - { name: Replace everywhere, type: action, animatable: false }
  animation: >-
    Material switches can be timed by hold keyframes or crossfades.
  dependencies: [3d.material-pbr, 3d.model-import, 3d.hierarchy]
  implementation: >-
    Imported materials become project material assets keyed by model node path and slot; assignments stored as overrides.
  io: >-
    Extracted textures copied into the project asset store for collect/relink.
  limitations: >-
    OBJ/FBX material approximations may need manual touch-up after extraction.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      Drag a material swatch onto any part; "Apply to all similar parts".
    defaults: >-
      Embedded materials kept.
    automation: >-
      Groups parts sharing a source material for one-step replacement.
    usability_check: >-
      A user re-materials all columns of a model in under 30 s.
  acceptance: >-
    Mini scene "marble-columns": assignment survives reopen and model reimport.
  status: not-started
  evidence: []

- id: 3d.material-library
  name: Procedural material library
  sources:
    - ref: S01
      item: Apply Substance 3D materials (material library outcome)
      category: Work with materials
      checked: false
    - ref: brief
      item: §0.5 visual library of editable outcomes; §1 brick to water/metal/glass
      category: Product requirement
      checked: true
  artist_can: >-
    Pick editable procedural materials (brick, concrete, metal, glass, water, marble, wood, neon, lava) whose patterns
    and colours can be adjusted and animated.
  projection_example: >-
    Brick transforms into flowing water by crossfading two procedural materials over the wall copy.
  controls:
    - { name: Preset, type: enum(library), animatable: false }
    - { name: Scale, type: float, animatable: true }
    - { name: Colour variation, type: float, animatable: true }
    - { name: Evolution, type: float, animatable: true }
    - { name: Seed, type: int, animatable: false }
  animation: >-
    Evolution and parameters keyframable; seeded so preview and export match.
  dependencies: [3d.material-pbr, ux.effect-library, ux.recipe-engine]
  implementation: >-
    TSL node graphs using three.js MaterialX noise functions (mx_noise, mx_worley/voronoi), seeded via the stateless RNG;
    thumbnails rendered on a sphere and on the selected region.
  io: >-
    Materials saved as reusable assets/presets.
  limitations: >-
    Procedural looks are approximations, not scanned materials.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      "Change the material" → animated thumbnail grid; search "make it look like water".
    defaults: >-
      Scale fitted to the target object's real size.
    automation: >-
      Auto-scales patterns to metres so bricks are brick-sized.
    usability_check: >-
      A user finds and applies a water look by typing an everyday phrase, in under 30 s.
  acceptance: >-
    AS-3 material transformation; seeded patterns identical after reopen.
  status: not-started
  evidence: []

- id: 3d.material-sbsar
  name: Substance 3D (.sbsar) materials
  sources:
    - ref: S01
      item: Apply Substance 3D materials
      category: Work with materials
      checked: false
  artist_can: >-
    Load Substance .sbsar materials and adjust their exposed parameters.
  projection_example: >-
    Use a purchased weathered-metal .sbsar and adjust its rust amount over the show.
  controls:
    - { name: SBSAR file, type: file, animatable: false }
    - { name: Exposed parameters, type: dynamic, animatable: true }
  animation: >-
    Exposed parameters keyframable if supported.
  dependencies: [3d.material-pbr]
  implementation: >-
    Would need the proprietary Adobe Substance Engine SDK. Fallback: import baked texture sets exported from Substance
    tools, which 3d.material-pbr already covers.
  io: >-
    .sbsar import (if resolved); baked PBR texture sets today.
  limitations: >-
    Decision 2026-10-02 (reversible default): import baked PBR texture sets exported from Substance tools now; live .sbsar editing only if the Substance Automation Toolkit is available. Does not block other work.

    Open question: is live .sbsar parameter editing needed, and can the Substance Engine be licensed for personal
    use in this app? Until then, baked textures are the path.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Live .sbsar editing is a niche material route. Baked PBR texture sets are already importable. Revisit if live .sbsar editing is wanted."
  milestone: F
  beginner:
    action: >-
      Drag a texture folder exported from Substance onto an object.
    defaults: >-
      Auto-detects map types from file names.
    automation: >-
      Matches _basecolor/_roughness/_normal suffixes to channels.
    usability_check: >-
      A user applies a Substance-exported texture set in under 30 s.
  acceptance: >-
    Decision recorded; if adopted, mini scene "rust-sbsar".
  status: not-started
  evidence: []

- id: 3d.model-import
  name: 3D model import
  sources:
    - ref: S01
      item: Import and add 3D models — GLB, GLTF, OBJ, FBX; Model Settings (Object Scale, Make Comp Size, Model Units, Up Axis, Flip Z Axis, Extract all materials)
      category: Import and add 3D models
      checked: true
    - ref: S10
      item: Imported 3D models in GLTF, GLB, OBJ and FBX
      category: Advanced 3D renderer
      checked: true
  artist_can: >-
    Import glTF, GLB, OBJ and FBX models with a preview of scale, units and up-axis settings, then drop them into a composition.
  projection_example: >-
    Import a GLB statue and stand it life-size in a real niche of the building.
  controls:
    - { name: Object scale, type: float, animatable: false }
    - { name: Fit to composition / real size, type: enum(fit-comp|real-size), animatable: false }
    - { name: Model units, type: enum(m|cm|mm|in|ft|unitless), animatable: false }
    - { name: Up axis, type: enum(y|z), animatable: false }
    - { name: Flip Z, type: bool, animatable: false }
    - { name: Extract materials, type: bool, animatable: false }
  animation: >-
    Model transforms animate as a layer; embedded animation via 3d.model-animation.
  dependencies: [3d.scene, 3d.units-scale, proj.project-model, 3d.model-format-gltf, 3d.model-format-obj, 3d.model-format-fbx]
  implementation: >-
    Loaders run in a worker (GLTFLoader with DRACOLoader/KTX2Loader/MeshoptDecoder, OBJLoader+MTLLoader, FBXLoader),
    normalise to metres and Y-up, compute a content hash and cache a processed GLB; dependent files tracked as hidden
    asset dependencies (decluttered, collected by proj collect).
  io: >-
    Dependencies (textures, .bin, .mtl) recorded for relink and collect; missing textures reported by name.
  limitations: >-
    Format-specific limits in 3d.model-format-*; no geometry editing beyond node overrides.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Drag a model file into the app; a preview card shows its size against a person silhouette.
    defaults: >-
      Real size from declared units; Y-up; materials kept.
    automation: >-
      Detects Z-up and wrong units heuristically and proposes the fix in the preview.
    usability_check: >-
      A novice imports a GLB and places it on the ground at plausible size in under 60 s.
  acceptance: >-
    Mini scene "statue-niche": GLB, OBJ and FBX versions of one asset import at the same size and orientation.
  status: not-started
  evidence: []

- id: 3d.model-format-gltf
  name: glTF 2.0 / GLB import limits
  sources:
    - ref: S01
      item: GLTF and GLB (scene cameras and lights, compression, model animation, PBR materials); GLB preferred
      category: Import and add 3D models
      checked: true
  artist_can: >-
    Import glTF/GLB with PBR materials, textures, node hierarchy, cameras, lights, skins, morph targets and animations.
  projection_example: >-
    A downloaded animated GLB bird flies across the facade with its own wing animation.
  controls:
    - { name: Animation clip, type: enum(dynamic), animatable: false }
    - { name: Import cameras/lights, type: bool, animatable: false }
  animation: >-
    Embedded clips via 3d.model-animation.
  dependencies: [3d.model-import]
  implementation: >-
    three.js GLTFLoader: metallic-roughness PBR, KHR_texture_transform, KHR_materials_emissive_strength/transmission/
    volume/ior/clearcoat/specular, KHR_draco_mesh_compression, EXT_meshopt_compression, KHR_texture_basisu (KTX2),
    KHR_mesh_quantization, KHR_lights_punctual, skins and morph targets.
  io: >-
    Preferred interchange format; Blender bridge (3d.dcc-import) converts other formats to GLB.
  limitations: >-
    Unsupported extensions are listed in an import report; deprecated KHR_materials_pbrSpecularGlossiness is
    approximated. Limits must be re-verified per three.js release.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Same drag-and-drop import; report shown only if something was skipped.
    defaults: >-
      All supported features imported.
    automation: >-
      Decompresses Draco/meshopt/KTX2 transparently.
    usability_check: >-
      Import report wording is understood by 8 of 10 users (they can say what was skipped).
  acceptance: >-
    Khronos glTF-Sample-Assets subset renders within tolerance of reference images.
  status: not-started
  evidence: []

- id: 3d.model-format-obj
  name: OBJ/MTL import limits
  sources:
    - ref: S01
      item: OBJ (Wavefront Object)
      category: Import and add 3D models
      checked: true
  artist_can: >-
    Import static OBJ meshes with MTL materials and textures.
  projection_example: >-
    Import a photogrammetry scan of a statue as OBJ with its texture.
  controls:
    - { name: Units (OBJ is unitless), type: enum(m|cm|mm|in|ft), animatable: false }
    - { name: Smooth normals, type: bool, animatable: false }
  animation: >-
    Transform only; no embedded animation.
  dependencies: [3d.model-import]
  implementation: >-
    three.js OBJLoader + MTLLoader; MTL Phong terms (Kd/Ks/Ns/d/map_Kd/map_Bump) converted to PBR approximations.
  io: >-
    Large scans: decimation is out of scope (use the DCC path).
  limitations: >-
    No hierarchy beyond groups, no animation, no units; materials approximate.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Drag-and-drop; asked once "How big is this?" with a guess.
    defaults: >-
      Guess units from bounding box size.
    automation: >-
      Finds textures referenced by MTL in nearby folders.
    usability_check: >-
      A user imports an OBJ scan at correct size in under 60 s.
  acceptance: >-
    Mini scene "statue-niche" OBJ variant.
  status: not-started
  evidence: []

- id: 3d.model-format-fbx
  name: FBX import limits
  sources:
    - ref: S01
      item: FBX (Filmbox) with embedded animations
      category: Import and add 3D models
      checked: true
  artist_can: >-
    Import FBX models including skinned characters and their animations (e.g. from character-animation libraries).
  projection_example: >-
    A dancing character FBX performs on a virtual ledge in time with the music.
  controls:
    - { name: Animation clip, type: enum(dynamic), animatable: false }
    - { name: Convert via Blender, type: bool, animatable: false }
  animation: >-
    Embedded clips via 3d.model-animation.
  dependencies: [3d.model-import, 3d.dcc-import]
  implementation: >-
    three.js FBXLoader (FBX 7.x binary and ASCII; skinning, morphs, animation; Phong/Lambert materials approximated).
    If loading fails or materials look wrong, the Blender headless bridge converts FBX → GLB.
  io: >-
    Embedded textures extracted to the asset store.
  limitations: >-
    FBX before 7.0 is unsupported by FBXLoader (Blender path may work). Material fidelity is lower than glTF. The
    Autodesk FBX SDK is not used.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      Drag-and-drop; "Fix this model" button if import looks wrong.
    defaults: >-
      Direct load first, Blender conversion on failure.
    automation: >-
      Retries via Blender automatically when FBXLoader throws.
    usability_check: >-
      Users import a Mixamo-style character and see it animate in under 90 s.
  acceptance: >-
    Mini scene "dancer": FBX animation frames match the Blender-converted GLB within tolerance.
  status: not-started
  evidence: []

- id: 3d.model-animation
  name: Embedded model animation
  sources:
    - ref: S01
      item: Animate embedded 3D model; Animation Options
      category: Work with 3D composition
      checked: false
    - ref: brief
      item: §9 embedded model animation
      category: Product requirement
      checked: true
  artist_can: >-
    Choose which animation clip a model plays, retime it, offset it, loop it and blend between clips.
  projection_example: >-
    A flock of imported birds plays its flap cycle at different offsets so they do not move in lockstep.
  controls:
    - { name: Clip, type: enum(dynamic), animatable: true }
    - { name: Speed, type: percent, animatable: true }
    - { name: Time offset, type: time, animatable: false }
    - { name: Loop mode, type: enum(once|loop|ping-pong|hold), animatable: false }
    - { name: Clip time (remap), type: time, animatable: true }
  animation: >-
    Clip time remappable with keyframes (freeze, reverse) and offset per instance by expressions.
  dependencies: [3d.model-import, anim.time-remap, expr.engine]
  implementation: >-
    three.js AnimationMixer evaluated statelessly with mixer.setTime(clipTime(t)) at exact flick times, never by
    accumulated deltas, so random-access seek and parallel export match.
  io: >-
    none
  limitations: >-
    No IK or retargeting; cloth/fluid caches go through 3d.dcc-alembic.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      Model inspector: clip dropdown with thumbnails and a speed slider.
    defaults: >-
      First clip, looping, 100%.
    automation: >-
      Duplicated instances get automatic random offsets (seeded) when "Vary" is on.
    usability_check: >-
      A user picks a different clip and slows it in under 20 s.
  acceptance: >-
    Mini scene "flock": seek to random frames equals sequential playback, frame hash identical.
  status: not-started
  evidence: []

- id: 3d.model-lights-cameras
  name: Extract lights and cameras from models
  sources:
    - ref: S01
      item: Extract and animate lights and cameras
      category: Work with 3D composition
      checked: false
  artist_can: >-
    Turn cameras and lights embedded in a model file into editable camera and light layers, keeping their animation.
  projection_example: >-
    A camera move authored in Blender drives the tunnel fly-through exactly.
  controls:
    - { name: Extract cameras, type: action, animatable: false }
    - { name: Extract lights, type: action, animatable: false }
    - { name: Keep linked to model, type: bool, animatable: false }
  animation: >-
    Extracted animation becomes keyframes (baked per frame or as curves where available).
  dependencies: [3d.model-import, 3d.camera, 3d.light]
  implementation: >-
    glTF cameras and KHR_lights_punctual (and FBX cameras/lights) become native layers; animation sampled into keyframes
    at the composition frame rate or kept as linked curves.
  io: >-
    none
  limitations: >-
    Light intensity units differ between tools; mapping is approximate and reported.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Not needed for projection workflows now: After Effects 3D/DCC parity item. Revisit if a show needs it."
  milestone: D
  beginner:
    action: >-
      Prompt after import: "This model contains a camera — use it?"
    defaults: >-
      Linked, so reimporting updates the camera.
    automation: >-
      Detects embedded cameras/lights on import.
    usability_check: >-
      A user adopts an embedded camera with one click.
  acceptance: >-
