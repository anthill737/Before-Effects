  animation: >-
    Interaxial and convergence keyframable.
  dependencies: [3d.camera, render.encode]
  implementation: >-
    Two cameras from a rig, rendered as separate passes and packed; anaglyph via a WGSL colour matrix.
  io: >-
    Side-by-side/over-under outputs.
  limitations: >-
    User 2026-10-02: stereoscopic left/right-eye video is UNCONFIRMED and recorded as a possible future capability. It must not complicate the normal build or setup; ordinary 3D and dimensional illusions proceed independently.

    Open question: will any show use stereo projection or glasses? Audience-viewpoint illusions already give monocular depth.
  disposition: unresolved
  superseded_by: null
  exclusion_reason: null
  milestone: F
  beginner:
    action: >-
      "3D glasses version" export option (if adopted).
    defaults: >-
      Convergence at the venue surface.
    automation: >-
      Sets interaxial from audience distance.
    usability_check: >-
      A user exports an anaglyph test without opening rig settings.
  acceptance: >-
    Decision recorded.
  status: not-started
  evidence: []

- id: 3d.scene-model
  name: Project-stored 3D scene
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "Project-stored 3D scene with meshes, materials, lights, cameras, transforms, animation and physical properties"
      category: "3D scene and physics"
      checked: true
  artist_can: >-
    Everything in the 3D scene (objects, meshes, materials, lights, cameras, transforms, animation and physical
    properties) is saved in the project and reopens exactly, so a scene stays editable data and not baked output.
  projection_example: >-
    Reopen the show next week and the falling-bricks scene still has its brick bodies, masses, sun light and camera
    move, ready to edit.
  controls:
    - { name: "Scene objects", type: "list", animatable: false }
    - { name: "Object kind (mesh, primitive, model instance, light, camera, null)", type: "enum", animatable: false }
    - { name: "Physical properties", type: "group", animatable: false }
  animation: >-
    Transforms, light and camera properties and material parameters are keyframable.
  dependencies: [3d.scene, 3d.physical-vs-creative, proj.project-model, proj.format-migration, 3d.model-import, 3d.material-pbr, 3d.light, 3d.camera]
  implementation: >-
    Scene-graph nodes in the core project model: {id, kind, parent, transform, materialRef, meshRef or primitive
    parameters, physics {bodyType, mass, friction, restitution, collider}, role}. Meshes are referenced assets (glTF
    or geometry file with a hash) or parametric primitives. Materials and textures are asset references. The scene is
    versioned and migrated with the project, and venue geometry is referenced read-only (3d.physical-vs-creative).
  io: >-
    Creative scene exports to glTF/GLB for Blender (3d.blender-link).
  limitations: >-
    Imported mesh files are referenced, so moving or replacing them goes through relink.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Nothing to learn: the 3D scene is saved with the project.
    defaults: >-
      New scenes start empty with a default camera and light.
    automation: >-
      Saves and migrates all scene data on every project save.
    usability_check: >-
      Close and reopen a project with a 3D scene and compare the viewport and an export frame: identical.
  acceptance: >-
    Mini scene "bricks-3d": save, close, reopen; scene graph, physics settings and render match.
  status: not-started
  evidence: []

- id: 3d.object-editing
  name: Create, select and edit 3D objects
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "Create, select and edit 3D objects"
      category: "3D scene and physics"
      checked: true
  artist_can: >-
    Add primitives (box, plane, sphere, cylinder) or imported models to the scene, select them in the viewport or an
    outline list, and edit position, rotation, scale, material, light and camera settings, grouping and physical
    properties in an inspector.
  projection_example: >-
    Add 40 boxes, group them as "Bricks", set one material and mass for the group, and move the camera.
  controls:
    - { name: "Add object", type: "action", animatable: false }
    - { name: "Outline list (select, rename, group, hide, lock)", type: "list", animatable: false }
    - { name: "Transform gizmo", type: "gizmo", animatable: true }
    - { name: "Inspector sections (transform, material, physics)", type: "panel", animatable: false }
    - { name: "Duplicate or array", type: "action", animatable: false }
  animation: >-
    Every inspector value can be keyframed.
  dependencies: [3d.scene-model, 3d.gizmo, 3d.mesh-primitives, 3d.model-import, 3d.material-assign, 3d.hierarchy, ux.inspector, ux.operation-system, ux.canvas-direct]
  implementation: >-
    A React outliner and viewport picking (three.js raycast or a GPU id pass) emit typed operations (add-object,
    set-transform, set-material, set-physics). Every edit is undoable and available to external agents. Inspector
    sections are progressive: three to five controls, then more.
  io: >-
    None.
  limitations: >-
    Not a modelling package. Mesh editing is limited to primitives and imported models.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Add 3D object" then drag it on the canvas; click it to edit in the inspector.
    defaults: >-
      Objects drop onto the venue ground plane, at real-world size, with a default material.
    automation: >-
      Snaps to the venue, keeps units in metres and groups duplicates automatically.
    usability_check: >-
      A first-time user adds, moves and recolours a 3D object in under 1 minute.
