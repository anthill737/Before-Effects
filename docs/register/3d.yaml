- id: 3d.physical-vs-creative
  name: Physical installation geometry vs animated creative geometry
  sources:
    - ref: brief
      item: §9 distinct objects for physical installation geometry and animated creative geometry
      category: Product requirement
      checked: true
  artist_can: >-
    Animate virtual geometry freely (bricks, panels, objects) knowing the measured building, its regions and its
    calibration can never be moved by creative edits.
  projection_example: >-
    A virtual brick falls out of the wall; the surveyed wall and the projector calibration stay exactly where they were.
  controls:
    - { name: Venue geometry (read-only reference), type: venue-ref, animatable: false }
    - { name: Creative geometry, type: layers, animatable: true }
    - { name: Edit venue…, type: action, animatable: false }
  animation: >-
    Only creative geometry is animatable; venue geometry has no animatable properties in the show.
  dependencies: [map.venue, map.model-3d, map.calibration, ux.operation-system, 3d.scene]
  implementation: >-
    Venue meshes are referenced from map.venue as read-only scene instances (holdout, snapping target, shadow catcher,
    ghost). The operation system rejects any show-scope op targeting venue IDs; venue edits happen only in venue setup,
    versioned separately.
  io: >-
    Shows reference venue roles, not venue geometry copies, so a show can rebind to another venue.
  limitations: >-
    Creative copies of venue pieces (3d.creative-copy) are new objects; changing the survey later does not update
    existing copies automatically (the app flags stale copies).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      The building appears locked (padlock) in creative mode; "Edit venue" switches to setup.
    defaults: >-
      Venue locked while animating.
    automation: >-
      Dragging the building in creative mode offers "Make a movable copy of this piece?" instead of moving it.
    usability_check: >-
      In a test, no participant moves the measured building by accident while animating a collapse.
  acceptance: >-
    AS-3: collapse animation leaves calibration hash and venue geometry hash unchanged; AS-7 rebinding.
  status: not-started
  evidence: []

- id: 3d.creative-copy
  name: Detach a piece of the building as creative geometry
  sources:
    - ref: brief
      item: §19 crack, fragment, disassembly and rebuilding; §9 creative vs physical geometry
      category: Product requirement
      checked: true
  artist_can: >-
    Select a wall, window or region and make a movable 3D copy of it whose surface content stays aligned until it moves,
    with what is "behind" it filled in.
  projection_example: >-
    A block of the facade slides forward and tilts, revealing a dark cavity with glowing machinery behind.
  controls:
    - { name: Source regions, type: region-refs, animatable: false }
    - { name: Thickness, type: float, animatable: true }
    - { name: Surface content, type: enum(live-show-content|frozen-frame|material), animatable: false }
    - { name: Revealed cavity, type: enum(black|material|comp), animatable: false }
  animation: >-
    Copy transforms keyframable; fracture/collapse via the simulation tools.
  dependencies: [3d.physical-vs-creative, map.region, map.model-3d, 3d.material-texture-source, 3d.extrude]
  implementation: >-
    Extracts the region's mesh piece from the venue model (with its UVs), extrudes it by thickness, binds the region's
    show content as a live texture, and adds a cavity mesh behind; Rapier fracture can consume the copy.
  io: >-
    Copies stored in the show with a reference to the venue version they came from.
  limitations: >-
    The illusion holds from the audience viewpoint only; revealed cavities are projected light on a flat wall.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      Select a region → "Pull out" / "Break apart" recipe.
    defaults: >-
      20 cm thickness, dark cavity, content follows the moving piece.
    automation: >-
      Builds the copy, cavity and lighting automatically from the venue region.
    usability_check: >-
      A novice makes a wall block slide out in under 2 minutes using supplied venue data.
  acceptance: >-
    AS-3 transformation; piece at rest is pixel-aligned with the un-detached projection.
  status: not-started
  evidence: []

- id: 3d.stereo
  name: Stereoscopic 3D rig
  sources:
    - ref: S01
      item: Stereoscopic 3D (3D Glasses effect, stereo camera rig)
      category: Work with 3D composition
      checked: false
  artist_can: >-
    Render left/right eye views for 3D-glasses or anaglyph presentation.
  projection_example: >-
