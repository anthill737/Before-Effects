- id: render.blender
  name: Blender rendering of linked scenes as show content
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "Deep optional Blender integration: rendering"
      category: "Blender integration"
      checked: true
  artist_can: >-
    Render a linked Blender scene (final-quality Cycles or fast EEVEE) in the background and use the result as video
    or an image sequence assigned to areas, with alpha and depth if wanted.
  projection_example: >-
    Render a 20 s Cycles shot of a storm cloud and assign it to the roof area.
  controls:
    - { name: "Engine (Cycles, EEVEE)", type: "enum", animatable: false }
    - { name: "Camera and frame range", type: "ref + time[2]", animatable: false }
    - { name: "Resolution and samples", type: "int[2]", animatable: false }
    - { name: "Passes (alpha, depth)", type: "flags", animatable: false }
    - { name: "Stale warning", type: "view", animatable: false }
  animation: >-
    None.
  dependencies: [3d.blender-link, render.background, render.queue, pass.exr-read, proj.import-media, render.determinism]
  implementation: >-
    Render jobs run headless Blender with a generated script on the render queue (render.queue) and write PNG or EXR
    sequences with optional depth. The result is registered as an asset with a hash of the render settings and the
    .blend, and is marked stale when either changes.
  io: >-
    Writes image sequences or video as an ordinary asset.
  limitations: >-
    Blender renders are offline and can take hours. Results differ by GPU and Blender version, so reruns are not
    bit-identical across machines.
  disposition: required-integration
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      Linked scene, "Render in Blender" with a quality choice.
    defaults: >-
      EEVEE at the scene resolution, full range, with alpha.
    automation: >-
      Queues the job in the background and imports the result when it finishes.
    usability_check: >-
      A first-time user renders a Blender shot and assigns it to an area in under 3 clicks after the render.
  acceptance: >-
    Mini scene "blender-shot": a Blender render becomes content on an area; stale detection works.
  status: not-started
  evidence: []
