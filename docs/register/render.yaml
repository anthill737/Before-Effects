- id: render.codec-hap
  name: HAP
  sources:
    - ref: brief
      item: §17 investigate HAP
      category: Product requirement
      checked: true
  artist_can: >-
    Export GPU-decoded HAP video that media servers (Resolume, MadMapper, TouchDesigner, etc.) play smoothly at high resolutions.
  projection_example: >-
    A 4K facade show plays smoothly from HAP on the venue's media server.
  controls:
    - { name: Compressor, type: enum(snappy|none), animatable: false }
    - { name: Chunks, type: int, animatable: false }
  animation: >-
    n/a
  dependencies: [render.encode, render.codec-probe]
  implementation: >-
    FFmpeg hap encoder -format hap (BC1/DXT1), MOV; requires an FFmpeg build with libsnappy; frame dimensions padded to
    multiples of 4.
  io: >-
    No alpha; ≈ 4 bits/pixel before Snappy (≈ 250 Mb/s at 1080p30, ≈ 1 Gb/s at 4K30): disk throughput matters.
  limitations: >-
    FFmpeg's texture compressor favours speed over quality (visible blocking on gradients); a higher-quality GPU BC1
    compressor could be added later. No audio in many HAP playback setups (players vary).
  disposition: required-integration
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Files for my projector" with a media-server preset.
    defaults: >-
      Snappy, chunks = 4 for 4K.
    automation: >-
      Pads dimensions and warns about drive speed for the file's data rate.
    usability_check: >-
      Users get a HAP file without knowing the term.
  acceptance: >-
    Plays in at least one HAP-capable player at target fps; probe evidence.
  status: not-started
  evidence: []

