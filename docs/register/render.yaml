- id: render.audio
  name: Audio export
  sources:
    - ref: S30
      item: Audio Output in output module settings; audio-only formats (AIFF, MP3, WAV)
      category: Render and export
      checked: true
  artist_can: >-
    Include the mixed soundtrack in video files or export audio on its own, with correct sync, sample rate and channels.
  projection_example: >-
    The projector file carries the show soundtrack in sync; a separate WAV goes to the venue's sound desk.
  controls:
    - { name: Include audio, type: enum(auto|on|off), animatable: false }
    - { name: Codec, type: enum(pcm-24|pcm-16|aac|mp3|flac), animatable: false }
    - { name: Sample rate, type: enum(44100|48000|96000), animatable: false }
    - { name: Channels, type: enum(stereo|mono), animatable: false }
    - { name: Loudness normalise, type: bool, animatable: false }
  animation: >-
    n/a
  dependencies: [audio.levels, render.encode]
  implementation: >-
    Deterministic offline mix (OfflineAudioContext with shared AudioWorklet DSP) rendered once to a float WAV cache,
    then muxed by FFmpeg (pcm_s24le in MOV/WAV, aac or libmp3lame where chosen), starting at exactly t=0 of the range.
  io: >-
    Audio-only exports: WAV, AIFF, MP3, FLAC.
  limitations: >-
    Some players need audio in specific codecs (e.g. AAC in MP4); presets handle this. Lossy encoders add priming delay,
    compensated with edit lists where the container supports them.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Automatic when the composition has audio; "Also save the soundtrack" checkbox.
    defaults: >-
      AAC 320 kb/s in MP4, PCM 24-bit in MOV, 48 kHz.
    automation: >-
      Warns if audio is muted or missing in a composition that had music.
    usability_check: >-
      Users never get a silent export by accident in testing.
  acceptance: >-
    AS-6: measured A/V offset in the exported file ≤ 1 ms (sample-accurate start); duration within one frame.
  status: implemented
  evidence:
    - "journey: import-media (picture, video, music copied into project media; beat found 119.9 BPM), video-in-windows (frame-accurate FFmpeg decode, proxy sizes for preview), music-on-timeline (waveform), move-with-beat, audio-preview-sync (picture follows sound clock, 0 ms), export-with-sound (Sound: yes), av-timing-measured (59/59 clicks paired, mean 1 ms, worst 1 frame @30 fps)"
    - "unit: packages/core/test/audio.test.ts (tempo 90/120/128/140 BPM within 2 BPM, beats within 30 ms, downbeat phase, deterministic)"

- id: render.progress-logs
  name: Progress, logs and clear failures
  sources:
    - ref: S30
      item: Log (Errors Only, Plus Settings, Plus Per Frame Info); render status messages; Info (concurrent frames, frame time); chime on completion; notifications
      category: Render and export
      checked: true
    - ref: S31
      item: Render Queue info — what's rendering, time remaining, progress, system usage
      category: Multi-Frame Rendering
      checked: true
  artist_can: >-
    See progress, time remaining and current speed, get notified when done, and get a plain explanation and a fix when
    something fails, with full logs available.
  projection_example: >-
    A render fails at frame 1,203 because a video file went offline; the message names the file and offers "Relink".
  controls:
    - { name: Progress (frames / time left / fps), type: display, animatable: false }
    - { name: Log level, type: enum(errors|settings|per-frame), animatable: false }
    - { name: Notify on completion, type: bool, animatable: false }
    - { name: Show details / open log, type: action, animatable: false }
  animation: >-
    n/a
  dependencies: [render.queue, ux.guided-workflow]
  implementation: >-
    Structured job events (JSONL) from render and encoder processes; errors mapped to user-facing messages with the
    affected item and an action (relink, retry, free space, choose compatible preset); OS notifications via Electron.
  io: >-
    Logs stored per job next to export history.
  limitations: >-
    Driver-level GPU crashes give limited detail; the app records device-lost reasons where available.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Progress bar in the Exports drawer; plain message cards for failures.
    defaults: >-
      Errors-only log plus settings; notification on.
    automation: >-
      Separates "Rendering", "Encoding" and "Uploading" phases in plain words (§0.8).
    usability_check: >-
      Given a missing-file failure, 9 of 10 users fix it from the message without help.
  acceptance: >-
    Fault-injection tests (missing file, disk full, encoder crash, GPU lost) each produce a correct message and action.
  status: implemented
  evidence:
    - "Renders panel (top bar): per-job phase, frames, fps, ETA, size estimate, free-space check before queueing (statfs), history kept in userData/render-history.json; main.log records each job"

- id: render.estimate
  name: Estimated time and size
  sources:
    - ref: S30
      item: Estimated size of the rendered composition
      category: Render and export
      checked: true
    - ref: brief
      item: §0.8 show estimated time and size
      category: Product requirement
      checked: true
  artist_can: >-
    See roughly how long an export will take and how big it will be before starting it.
  projection_example: >-
    See that a 10-minute ProRes 4444 master will need 180 GB and choose HAP instead.
  controls:
    - { name: Estimated size, type: display, animatable: false }
    - { name: Estimated time, type: display, animatable: false }
  animation: >-
    n/a
  dependencies: [render.encode, preview.profiler]
  implementation: >-
    Size from codec data-rate models (ProRes/DNxHR/HAP nominal rates, bitrate for H.264/HEVC, sampled-frame compression
    ratios for PNG/EXR); time from profiler-sampled frame costs plus encoder throughput; refined live during render.
  io: >-
    none
  limitations: >-
    Estimates are approximate and labelled so; heavy-variance scenes refine after a few hundred frames.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Shown under each outcome choice.
    defaults: >-
      Always shown when enough information exists.
    automation: >-
      Samples a few frames in the background to estimate.
    usability_check: >-
      Estimates within ±30% for starter projects.
  acceptance: >-
    Logged estimate vs actual for 20 renders; median error under 25%.
  status: implemented
  evidence:
    - "Renders panel (top bar): per-job phase, frames, fps, ETA, size estimate, free-space check before queueing (statfs), history kept in userData/render-history.json; main.log records each job"

- id: render.disk-space
  name: Disk-space checks
  sources:
    - ref: S30
      item: Render pauses when the output disk runs out of space; resume after freeing space
      category: Render and export
      checked: true
    - ref: brief
      item: §17 disk-space checks
      category: Product requirement
      checked: true
  artist_can: >-
    Be warned before starting if the export will not fit, and have a running export pause (not fail) if space runs low.
  projection_example: >-
    The overnight master pauses at 95% full instead of producing a truncated file.
  controls:
    - { name: Preflight check, type: display, animatable: false }
    - { name: Pause threshold, type: size, animatable: false }
    - { name: Resume, type: action, animatable: false }
  animation: >-
    n/a
  dependencies: [render.estimate, render.cancel-retry]
  implementation: >-
    fs.statfs on the destination before and during the job; encoder back-pressure pauses frame production below the
    threshold; movie outputs resume into the same FFmpeg process when possible, sequences resume by frame.
  io: >-
    none
  limitations: >-
    Network and cloud-synced folders may report free space inaccurately.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Warning before export with "Choose another drive" / "Smaller file" options.
    defaults: >-
      Pause below 2 GB or 2% free.
    automation: >-
      Suggests a destination with enough space.
    usability_check: >-
      Users resolve a not-enough-space warning without losing the render.
  acceptance: >-
    Fault injection: filling the disk pauses the job; freeing space resumes with a valid file.
  status: implemented
  evidence:
    - "Renders panel (top bar): per-job phase, frames, fps, ETA, size estimate, free-space check before queueing (statfs), history kept in userData/render-history.json; main.log records each job"

- id: render.cancel-retry
  name: Cancel, pause, resume and retry
  sources:
    - ref: S30
      item: Stop / User Stopped status with new queued item continuing from where it stopped; duplicate to re-render
      category: Render and export
      checked: true
    - ref: brief
      item: §17 cancel/retry
      category: Product requirement
      checked: true
  artist_can: >-
    Cancel, pause or retry any export, and re-run a finished one, without losing completed work where avoidable.
  projection_example: >-
    Pause the master to free the GPU for a client preview, then resume.
  controls:
    - { name: Pause / resume, type: action, animatable: false }
    - { name: Cancel (keep partial / delete partial), type: action, animatable: false }
    - { name: Retry, type: action, animatable: false }
    - { name: Duplicate, type: action, animatable: false }
  animation: >-
    n/a
  dependencies: [render.queue, render.resume-sequence]
  implementation: >-
    Job state machine in the main process; pause stops frame production while keeping processes alive; cancelled
    movie outputs are finalised or removed; retry reuses the same snapshot unless the user chooses latest edits.
  io: >-
    Partial movie files are clearly named (.partial) until verified.
  limitations: >-
    Paused movie encodes keep VRAM/RAM allocated; long pauses release and resume by re-render from the last keyframe-safe point.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Pause / Stop / Try again buttons on each export card.
    defaults: >-
      Cancel deletes partial movie files; keeps sequence frames.
    automation: >-
      Retry offers "same version" vs "with latest changes".
    usability_check: >-
      A user pauses and resumes an export in two clicks and the result verifies.
  acceptance: >-
    AS-6: paused/resumed movie verifies; retried job produces identical frames.
  status: implemented
  evidence:
    - "journey test (apps/studio: npx electron . --ui-test) steps export-run, render-while-editing, cancel-and-retry, export-half-range, drive-upload-retry; 2026-10-02: cancel at frame ~20, retry re-rendered from the kept snapshot and passed its file check"

- id: render.resume-sequence
  name: Resumable image-sequence rendering
  sources:
    - ref: S30
      item: Skip Existing Files (re-render only missing frames of a sequence)
      category: Render and export
      checked: true
    - ref: brief
      item: §17 resumable image-sequence rendering; §22 AS-6 interrupted sequence resumes without missing or duplicated frames
      category: Product requirement
      checked: true
  artist_can: >-
    Resume an interrupted sequence render (crash, power cut, cancel) and get every frame exactly once.
  projection_example: >-
    After a power cut at frame 9,000 of a 20,000-frame EXR master, the render continues from the last good frame.
  controls:
    - { name: Resume, type: action, animatable: false }
    - { name: Validate existing frames, type: enum(size|header|hash), animatable: false }
  animation: >-
    n/a
  dependencies: [render.image-sequence, render.snapshot, render.missing-frames]
  implementation: >-
    Frames written to temp names then atomically renamed; the sequence manifest (JSONL) records frame index, size and
    hash; on resume, frames present with valid header and matching snapshot hash are skipped; mismatched snapshot
    prompts re-render or continue.
  io: >-
    Manifest stored with the sequence.
  limitations: >-
    Stateful simulations restart from the nearest checkpoint before the first missing frame.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      After a crash, the Exports drawer shows "Continue where it stopped".
    defaults: >-
      Header validation plus manifest hash.
    automation: >-
      Detects interrupted jobs on app start.
    usability_check: >-
      A user resumes an interrupted export in one click.
  acceptance: >-
    AS-6: kill the process mid-render, resume, verify no missing or duplicated frames and all hashes match a clean render.
  status: not-started
  evidence: []

- id: render.missing-frames
  name: Missing and corrupt frame detection
  sources:
    - ref: brief
      item: §17 detection of missing frames
      category: Product requirement
      checked: true
  artist_can: >-
    Be told exactly which frames are missing, empty or corrupt in a sequence or movie, and re-render just those.
  projection_example: >-
    A USB drive glitch left three zero-byte EXRs; the app lists and re-renders them.
  controls:
    - { name: Scan, type: action, animatable: false }
    - { name: Problem frames, type: list, animatable: false }
    - { name: Re-render problems, type: action, animatable: false }
  animation: >-
    n/a
  dependencies: [render.image-sequence, render.verify]
  implementation: >-
    Sequence scan against expected indices and manifest (gaps, duplicates, zero-byte, truncated, header decode); movies
    checked by full decode (ffmpeg -xerror -f null) and frame counting.
  io: >-
    Scan results appended to export history.
  limitations: >-
    Silent bit-rot inside compressed frames is only detected by hash comparison (manifest required).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Automatic after every export; "Check again" on a history item.
    defaults: >-
      Always on.
    automation: >-
      Offers one-click re-render of only the problem frames.
    usability_check: >-
      A user repairs a sequence with missing frames in one action.
  acceptance: >-
    Fault-injected gaps, duplicates and truncations are all detected.
  status: not-started
  evidence: []

- id: render.history
  name: Export history
  sources:
    - ref: brief
      item: §17 export history; §0.8 show the finished file and destination
      category: Product requirement
      checked: true
  artist_can: >-
    See every past export with its settings, project version, location, verification result and logs; open its folder,
    play it, or export again with the same settings.
  projection_example: >-
    Find which version of the show was sent to the venue last Friday and re-export it with today's fixes.
  controls:
    - { name: History list, type: list, animatable: false }
    - { name: Show in folder / play, type: action, animatable: false }
    - { name: Export again, type: action, animatable: false }
    - { name: Compare settings, type: action, animatable: false }
  animation: >-
    n/a
  dependencies: [render.queue, render.verify, render.snapshot]
  implementation: >-
    Append-only history store per project (JSON) with snapshot hash, settings, stage declaration, outputs, verification
    and log paths; snapshots retained on request so old versions can be re-rendered.
  io: >-
    Travels with the project; deliveries (deliver.*) add upload records.
  limitations: >-
    Re-rendering an old version requires its snapshot and assets to be retained.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Exports" drawer → history list with thumbnails.
    defaults: >-
      Keeps records forever, snapshots for the last 10 exports.
    automation: >-
      Marks files that were moved or deleted.
    usability_check: >-
      Users find yesterday's export without help (§0.10 target).
  acceptance: >-
    AS-7: history shows export and upload records; "Export again" reproduces identical settings.
  status: implemented
  evidence:
    - "Renders panel (top bar): per-job phase, frames, fps, ETA, size estimate, free-space check before queueing (statfs), history kept in userData/render-history.json; main.log records each job"

- id: render.verify
  name: Automatic output verification
  sources:
    - ref: brief
      item: §17 automatic verification of resolution, frame rate, frame count, duration, alpha and sound
      category: Product requirement
      checked: true
  artist_can: >-
    Trust that every export has the intended resolution, frame rate, frame count, duration, transparency, colour tags
    and sound, with problems shown in plain words.
  projection_example: >-
    The projector file is verified as 3840×2160, 60 fps, 36,000 frames, no alpha, 48 kHz stereo before it leaves the studio.
  controls:
    - { name: Verification report, type: display, animatable: false }
    - { name: Deep check (full decode + frame hashes), type: bool, animatable: false }
  animation: >-
    n/a
  dependencies: [render.encode, render.audio]
  implementation: >-
    After finalisation: ffprobe JSON (width, height, r_frame_rate, nb_read_frames with -count_frames, duration, pix_fmt,
    colour tags, audio streams); full decode for errors; alpha check (pix_fmt has alpha and sampled alpha not constant
    when expected); lossless outputs compared frame-by-frame to the render log hashes (framemd5), lossy outputs by PSNR
    on sampled frames; audio duration and start offset compared to video.
  io: >-
    Report stored in export history and shown on the export card.
  limitations: >-
    Verification proves the file, not that a particular playback device will play it in sync.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Automatic; green tick "Checked: 3840×2160, 60 fps, 10:00, sound OK".
    defaults: >-
      Standard checks always; deep check for masters and projector files.
    automation: >-
      Re-verifies after copy/upload where possible.
    usability_check: >-
      Users can state from the export card whether the file has transparency and sound (9 of 10).
  acceptance: >-
    Fault-injected outputs (wrong fps, dropped frame, missing audio, stripped alpha) each fail verification with a clear message.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: render.determinism
  name: Deterministic, reproducible renders
  sources:
    - ref: brief
      item: §20 deterministic time, seeded randomness, shared preview/export semantics
      category: Product requirement
      checked: true
  artist_can: >-
    Re-export a project and get the same frames, so fixes do not cause unexpected changes elsewhere.
  projection_example: >-
    After fixing one scene, re-exporting the master changes only that scene's frames.
  controls:
    - { name: Determinism report (frame hash diff), type: display, animatable: false }
  animation: >-
    n/a
  dependencies: [render.offline, track.matte-cache, audio.analysis]
  implementation: >-
    Integer flick time, stateless seeded RNG, no wall-clock inputs, frozen ML caches, cached audio analysis, fixed
    sampling patterns, ordered GPU reductions where possible; per-frame hashes of the rgba16float output logged and
    compared across renders.
  io: >-
    Hash logs in history.
  limitations: >-
    Bit-identity is promised for the same machine, driver and app version; across GPUs/drivers the target is a measured
    tolerance. Encoders (NVENC) may produce different bytes for identical frames; comparison uses decoded frames.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Not visible; history can show "What changed since last export".
    defaults: >-
      Always on.
    automation: >-
      Highlights changed frame ranges between two exports.
    usability_check: >-
      n/a for novices; expert check: diff report lists only edited ranges.
  acceptance: >-
    AS-3/AS-6: two renders of the starter projects produce identical frame hashes; an edit changes only affected frames.
  status: not-started
  evidence: []

- id: render.codec-probe
  name: Tested codec capability matrix
  sources:
    - ref: brief
      item: §17 report real tested support rather than listing extensions the encoder cannot produce correctly
      category: Product requirement
      checked: true
  artist_can: >-
    Only see export formats that actually work on this machine, with alpha, bit depth and size limits stated.
  projection_example: >-
    On a laptop without NVENC, H.264 presets automatically use the software encoder; HAP is hidden if the FFmpeg build lacks Snappy.
  controls:
    - { name: Capability report, type: display, animatable: false }
    - { name: Re-run probe, type: action, animatable: false }
  animation: >-
    n/a
  dependencies: [render.encode]
  implementation: >-
    On first run and after FFmpeg/driver updates: parse ffmpeg -encoders / -h encoder=X, then encode and decode a short
    test clip per preset (size limits, pixel formats, alpha) and record pass/fail; NVENC session test detects
    driver/API mismatch.
  io: >-
    Capability matrix cached in app data; included in bug reports.
  limitations: >-
    Probe takes up to a minute; runs in the background.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Not visible; unavailable options simply do not appear (Advanced shows why).
    defaults: >-
      Auto.
    automation: >-
      Chooses fallbacks (NVENC → software) automatically.
    usability_check: >-
      No user ever sees an export fail because a listed codec is unsupported.
  acceptance: >-
    Matrix generated on the target machine and stored as evidence for each codec entry.
  status: not-started
  evidence: []

- id: render.codec-h264
  name: H.264 (MP4/MOV)
  sources:
    - ref: brief
      item: §17 MP4/H.264
      category: Product requirement
      checked: true
    - ref: S30
      item: QuickTime (MOV); Export H.264 from After Effects
      category: Render and export
      checked: true
  artist_can: >-
    Export widely playable H.264 video for sharing, review and many playback systems.
  projection_example: >-
    A share copy for the client and a projector file for a simple single-projector media player.
  controls:
    - { name: Encoder, type: enum(auto|nvenc|x264), animatable: false }
    - { name: Quality, type: enum(good|better|best|bitrate), animatable: false }
    - { name: Profile / level, type: enum(high|high10), animatable: false }
    - { name: Keyframe interval, type: int, animatable: false }
    - { name: Container, type: enum(mp4|mov), animatable: false }
  animation: >-
    n/a
  dependencies: [render.encode, render.codec-probe, color.output-transform]
  implementation: >-
    FFmpeg h264_nvenc (preset p6–p7, VBR/CQ) or libx264 (CRF, preset slow), yuv420p 8-bit, Rec.709 tags, +faststart,
    closed GOP; libx264 used automatically above NVENC's 4096-pixel limit.
  io: >-
    No alpha. 4:2:0 chroma. Typical hardware decoders cap at 4096×2304 (level 5.1/5.2).
  limitations: >-
    Very wide multi-projector canvases exceed many hardware decoders even when the encoder succeeds; presets warn and
    suggest HEVC, HAP or ProRes. Fine coloured detail suffers from 4:2:0.
  disposition: required-integration
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "A video to share" outcome.
    defaults: >-
      NVENC if probed OK, else x264; Better quality; MP4; 1 s keyframe interval.
    automation: >-
      Picks level and encoder from resolution and frame rate.
    usability_check: >-
      The share export plays in the OS default player and a browser on first try.
  acceptance: >-
    Verified plays in Windows Media Player, VLC and Chromium; render.verify passes.
  status: not-started
  evidence: []

- id: render.codec-hevc
  name: HEVC / H.265
  sources:
    - ref: brief
      item: §17 investigate HEVC
      category: Product requirement
      checked: true
  artist_can: >-
    Export smaller, higher-quality files, including 10-bit and resolutions above 4K, for players that support HEVC.
  projection_example: >-
    A 7680×1080 two-projector canvas plays from one HEVC file on a media server that decodes HEVC 8K.
  controls:
    - { name: Encoder, type: enum(auto|nvenc|x265), animatable: false }
    - { name: Bit depth, type: enum(8|10), animatable: false }
    - { name: Chroma, type: enum(420|422), animatable: false }
    - { name: Quality, type: enum(good|better|best|bitrate), animatable: false }
  animation: >-
    n/a
  dependencies: [render.encode, render.codec-probe]
  implementation: >-
    FFmpeg hevc_nvenc (up to 8192×8192; Blackwell NVENC adds 4:2:2 10-bit) or libx265; Main/Main10; hvc1 tag for MOV/MP4 compatibility.
  io: >-
    No alpha offered (HEVC-with-alpha playback support is too narrow). HEVC decode licensing varies by player/OS.
  limitations: >-
    Player support must be confirmed on the venue's playback machine; 4:2:2 HEVC decode is rare.
  disposition: required-integration
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Offered by "Files for my projector" when the player supports it, or Share → Smaller file.
    defaults: >-
      NVENC, Main10, 4:2:0.
    automation: >-
      Chosen automatically for canvases above 4096 px wide when the target player supports HEVC.
    usability_check: >-
      Users never pick HEVC manually in the guided path.
  acceptance: >-
    Probe evidence plus playback test on the target player.
  status: not-started
  evidence: []

- id: render.codec-prores-422
  name: ProRes 422 (Proxy, LT, 422, HQ)
  sources:
    - ref: brief
      item: §17 investigate ProRes
      category: Product requirement
      checked: true
  artist_can: >-
    Export high-quality, edit-friendly masters that keep detail through further processing.
  projection_example: >-
    The show master is ProRes 422 HQ, from which projector files and review copies are made.
  controls:
