# Rendering and export — Before Effects capability register
# Sources: S30 (basics of rendering and exporting: Render Queue, render settings, output modules, templates, logs, Skip Existing Files, Media Encoder, supported formats; checked 2026-10-01), S31 (Multi-Frame Rendering, CPU reserve, render queue info; checked 2026-10-01), brief §0.8, §17, §20, §22 (AS-6). Multi-projector bundle manifests and Google Drive delivery are covered by out.*/deliver.* entries.

- id: render.queue
  name: Render queue (batch rendering)
  sources:
    - ref: S30
      item: Render Queue panel — render items, statuses (Unqueued, Queued, Rendering, Done, Failed, User Stopped), reorder, Comment column, render many items unattended in a batch
      category: Render and export
      checked: true
  artist_can: >-
    Queue several compositions or exports, reorder them, add notes, and render them all unattended in one batch.
  projection_example: >-
    Queue the facade master, the audience preview and the projector file overnight.
  controls:
    - { name: Add to queue, type: action, animatable: false }
    - { name: Item status, type: enum(unqueued|queued|rendering|done|failed|stopped), animatable: false }
    - { name: Reorder / remove / duplicate, type: action, animatable: false }
    - { name: Comment, type: string, animatable: false }
    - { name: Render all, type: action, animatable: false }
  animation: >-
    n/a
  dependencies: [render.snapshot, render.background, render.encode, render.progress-logs, render.presets]
  implementation: >-
    Queue state lives in the main process (persisted JSON so it survives app restarts); each item references an
    immutable project snapshot and runs as a job in a hidden renderer process; the editor stays responsive.
  io: >-
    Queue persisted with the project and in app state.
  limitations: >-
    One GPU: jobs run sequentially by default; concurrent jobs share VRAM budgets (preview.memory-budget).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "Save a video" adds a job automatically; an "Exports" drawer shows the queue.
    defaults: >-
      New jobs start immediately unless "Queue for later" is chosen.
    automation: >-
      Retains finished items with links to their files and verification results.
    usability_check: >-
      A first-time user starts an export and later finds the finished file from the Exports drawer without help.
  acceptance: >-
    AS-6: three queued items render unattended; queue survives an app restart.
  status: implemented
  evidence:
    - "journey test (apps/studio: npx electron . --ui-test) steps export-run, render-while-editing, cancel-and-retry, export-half-range, drive-upload-retry; 2026-10-02: queue in main + hidden render worker; export frame 150 matched the queued snapshot (0.02 avg diff) while the editor hid all layers (25.1 diff vs edited show)"

- id: render.offline
  name: Offline frame-accurate rendering
  sources:
    - ref: brief
      item: §17 offline frame-accurate rendering independently of preview speed
      category: Product requirement
      checked: true
    - ref: S30
      item: What is rendering (creation of frames from a composition)
      category: Render and export
      checked: true
  artist_can: >-
    Render every frame at full quality and exact time, no matter how slow the scene is, with no dropped or duplicated frames.
  projection_example: >-
    A heavy collapse scene that previews at 6 fps renders every frame perfectly for a 60 fps projector file.
  controls:
    - { name: Quality, type: enum(final), animatable: false }
  animation: >-
    Every property evaluated at exact frame times (integer flicks).
  dependencies: [proj.composition, anim.keyframe.core, render.determinism, preview.export-parity]
  implementation: >-
    Frame n is evaluated at t = start + n × frameDuration in flicks (exact for 23.976/29.97/59.94 via rational rates);
    the same core evaluation and WGSL/three.js passes as preview at final quality; never real-time paced.
  io: >-
    Feeds render.encode.
  limitations: >-
    Render time scales with scene cost; estimate provided by render.estimate.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Implicit in every export.
    defaults: >-
      Final quality always.
    automation: >-
      n/a
    usability_check: >-
      Users understand from the progress UI that export does not depend on preview speed (quiz 9 of 10).
  acceptance: >-
    AS-6: frame count and per-frame timestamps exact for 24, 25, 29.97, 30, 50, 59.94, 60 fps exports.
  status: not-started
  evidence: []

- id: render.snapshot
  name: Immutable render snapshots
  sources:
    - ref: brief
      item: §17 immutable render snapshots so editing can continue
      category: Product requirement
      checked: true
  artist_can: >-
    Keep editing while an export runs, knowing the export renders exactly the version that was queued.
  projection_example: >-
    Start the master render, then keep refining the next scene without affecting the running export.
  controls:
    - { name: Snapshot version, type: display, animatable: false }
    - { name: Re-render with current edits, type: action, animatable: false }
  animation: >-
    n/a
  dependencies: [proj.project-model, render.queue]
  implementation: >-
    On enqueue the core serialises the project state (structural sharing, copy-on-write) plus an asset manifest with
    content hashes; render processes load only the snapshot; assets changed on disk mid-render are detected by hash.
  io: >-
    Snapshot hash stored in export history.
  limitations: >-
    Footage replaced on disk during a render fails the job with a clear message rather than mixing versions.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      None; a note says "Rendering the version from 14:02 — keep working".
    defaults: >-
      Always snapshot.
    automation: >-
      Offers "Re-render with latest changes" when the project changes after queueing.
    usability_check: >-
      Users keep editing during export without asking whether it is safe.
  acceptance: >-
    AS-6: edits during render do not alter output frames (hash comparison).
  status: implemented
  evidence:
    - "journey test (apps/studio: npx electron . --ui-test) steps export-run, render-while-editing, cancel-and-retry, export-half-range, drive-upload-retry; 2026-10-02: queue in main + hidden render worker; export frame 150 matched the queued snapshot (0.02 avg diff) while the editor hid all layers (25.1 diff vs edited show)"

- id: render.background
  name: Background render jobs
  sources:
    - ref: S30
      item: Render with Adobe Media Encoder to keep working while files process
      category: Render and export
      checked: true
    - ref: S31
      item: "% CPU reserved for other applications"
      category: Multi-Frame Rendering
      checked: true
  artist_can: >-
    Render in the background while working, with control over how much of the machine the render may use.
  projection_example: >-
    A long 4K master renders while the user edits the next scene with a responsive preview.
  controls:
    - { name: Resource share, type: enum(fast-export|balanced|keep-editor-smooth), animatable: false }
    - { name: CPU reserved (%), type: percent, animatable: false }
    - { name: Pause while previewing, type: bool, animatable: false }
  animation: >-
    n/a
  dependencies: [render.snapshot, preview.memory-budget, preview.concurrent-frames]
  implementation: >-
    Hidden BrowserWindow renderer with its own WebGPU device per job; the encoder runs in a utility process; OS priority
    and frame-in-flight limits throttle the job when the editor is active; VRAM budgets shared via the main process.
  io: >-
    none
  limitations: >-
    One GPU is shared; the editor and render slow each other under heavy load.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      None; export runs in the background automatically.
    defaults: >-
      Balanced.
    automation: >-
      Lowers render priority while the user scrubs, raises it when idle.
    usability_check: >-
      Editor preview stays interactive (≥ 15 fps on the starter scene) during a background export.
  acceptance: >-
    AS-6: long target-resolution render continues while the editor is used.
  status: implemented
  evidence:
    - "journey test (apps/studio: npx electron . --ui-test) steps export-run, render-while-editing, cancel-and-retry, export-half-range, drive-upload-retry; 2026-10-02: queue in main + hidden render worker; export frame 150 matched the queued snapshot (0.02 avg diff) while the editor hid all layers (25.1 diff vs edited show)"

- id: render.settings
  name: Render settings
  sources:
    - ref: S30
      item: Render settings — Quality, Resolution, Disk Cache, Proxy Use, Effects, Solo Switches, Guide Layers, Color Depth, Frame Blending, Motion Blur, Time Span, Frame Rate, Skip Existing Files
      category: Render and export
      checked: true
  artist_can: >-
    Override quality, resolution, effects, motion blur, frame blending, proxies, frame rate and time span per export
    without changing the composition.
  projection_example: >-
    Render a quick half-resolution draft for review with motion blur off, then the full master.
  controls:
    - { name: Quality, type: enum(final|draft), animatable: false }
    - { name: Resolution, type: enum(full|half|third|quarter|custom), animatable: false }
    - { name: Proxy use, type: enum(never|current|always), animatable: false }
    - { name: Effects / solo / guide layers, type: enum(current|all-on|all-off), animatable: false }
    - { name: Motion blur / frame blending, type: enum(current|on-for-checked|off), animatable: false }
    - { name: Frame rate, type: enum(comp|custom), animatable: false }
    - { name: Precision, type: enum(project|16f|32f), animatable: false }
  animation: >-
    n/a
  dependencies: [render.offline, preview.proxy, color.bit-depth]
  implementation: >-
    Settings are a typed object applied to the snapshot evaluation; render-setting overrides never mutate the project.
  io: >-
    Saved in presets (render.presets) and in history.
  limitations: >-
    Field rendering and pulldown are tracked separately (render.fields-pulldown).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Hidden behind export outcomes; "Draft for review" outcome sets them.
    defaults: >-
      Final quality, full resolution, never proxies.
    automation: >-
      Warns if a final export would use proxies or disabled effects.
    usability_check: >-
      No guided export requires opening render settings.
  acceptance: >-
    Draft and final renders differ only in the overridden settings (checked in history diff).
  status: not-started
  evidence: []

- id: render.presets
  name: Render and output presets
  sources:
    - ref: S30
      item: Render settings templates (Best, Draft, DV, Multi-Machine); output module templates (Lossless…); Make Template; Save All/Load; default templates
      category: Render and export
      checked: true
  artist_can: >-
    Save and reuse combinations of render settings and output formats, set defaults, and share presets between projects.
  projection_example: >-
    A "Venue A projector" preset with the right resolution, frame rate and codec is reused for every show at that venue.
  controls:
    - { name: Preset list, type: enum(dynamic), animatable: false }
    - { name: Save as preset, type: action, animatable: false }
    - { name: Set default, type: action, animatable: false }
    - { name: Import/export presets, type: action, animatable: false }
  animation: >-
    n/a
  dependencies: [render.settings, render.encode]
  implementation: >-
    Presets are versioned JSON (render settings + output module + naming + verification expectations); built-in presets
    are only those that passed the codec probe on this machine.
  io: >-
    Preset files portable between machines; unsupported codecs flagged on import.
  limitations: >-
    Presets referencing unavailable encoders are disabled with an explanation.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "Remember these settings" checkbox after a custom export.
    defaults: >-
      Built-ins: Share (H.264), Master (ProRes 422 HQ), Transparent (ProRes 4444), Image sequence (PNG), Projector (per output).
    automation: >-
      Remembers the last outcome per project.
    usability_check: >-
      A user re-exports with yesterday's settings in two clicks.
  acceptance: >-
    Preset round trip (save, load on another machine) reproduces identical settings.
  status: not-started
  evidence: []

