    Render job whose graph root is the projector output pipeline (venue geometry from the calibrated projector camera,
    content via UV/projective texturing, output masks, blend, output colour, residual warp) at the projector's native
    resolution and rate; multi-projector manifests are produced by out.*/deliver.*.
  io: >-
    Records calibration version and baked stages in history and stage declaration.
  limitations: >-
    A file is only correct for the calibration it was rendered with; recalibration invalidates it (flagged in history).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "Files for my projector" outcome.
    defaults: >-
      All stages baked for standalone players.
    automation: >-
      Chooses resolution, frame rate, codec and stages from the projector/player profile.
    usability_check: >-
      A first-time user exports the projector file for a calibrated single projector without extra settings.
  acceptance: >-
    Milestone B guided path: projector file plays on hardware aligned to the calibration; stage declaration correct.
  status: not-started
  evidence: []

- id: render.stage-declaration
  name: Baked-stage declaration (never apply twice)
  sources:
    - ref: brief
      item: §17 specify which stages are baked and which are expected in playback software; never apply mapping, blending or output colour correction twice
      category: Product requirement
      checked: true
  artist_can: >-
    Know, for every export, which stages are already baked in and which the playback software must still do, and be
    stopped from double-applying them.
  projection_example: >-
    A media server that does its own blending receives files with blending off, and the app says so in the export record.
  controls:
    - { name: Declared stages, type: display, animatable: false }
  animation: >-
    n/a
  dependencies: [render.history, out.projector-output]
  implementation: >-
    Every render job carries a stage record (content, mapping, output mask, blend, output colour, residual warp, colour
    transform) with versions; the render graph refuses to apply a stage the source already contains (e.g. re-exporting
    a projector file through a projector pipeline).
  io: >-
    Written into history and into sidecar JSON next to the file.
  limitations: >-
    Third-party playback software cannot be checked; the sidecar documents expectations.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Shown in plain words on the export card: "Includes mapping and blending. Your player should not blend."
    defaults: >-
      Generated automatically.
    automation: >-
      Blocks double application with an explanation.
    usability_check: >-
      Users can say from the export card whether their player must blend (9 of 10).
  acceptance: >-
    Test: attempting to re-map a projector file is blocked; declarations match actual pipeline.
  status: not-started
  evidence: []

- id: render.post-actions
  name: Post-render actions
  sources:
    - ref: S30
      item: Post-render actions; drag output module to Project panel to import result
      category: Render and export
      checked: true
  artist_can: >-
    After rendering, automatically import the result, replace a composition's usage with it, or set it as a proxy.
  projection_example: >-
    A heavy particle precomp is rendered and swapped in for its uses to keep the main show light.
  controls:
    - { name: Action, type: enum(none|import|import-and-replace|set-proxy), animatable: false }
  animation: >-
    n/a
  dependencies: [render.queue, proj.precompose, preview.prerender]
  implementation: >-
    Post-action is an operation applied after verification passes, undoable, linking the rendered file to the source
    composition's dependency hash so it is flagged stale when the source changes.
  io: >-
    none
  limitations: >-
    Replaced usage loses live edits until reverted.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Render-queue or output-module parity detail, or a format no projection delivery needs now. H.264, HEVC, ProRes, HAP family, PNG sequence, audio, verification and projector bake stay required."
  milestone: C
  beginner:
    action: >-
      Mostly automatic via pre-render (preview.prerender); explicit choice in Advanced.
    defaults: >-
      None.
    automation: >-
      Flags stale replacements.
    usability_check: >-
      n/a for novices.
  acceptance: >-
    Replaced usage renders identically to the live comp at the time of render.
  status: not-started
  evidence: []

