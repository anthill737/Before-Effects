- id: render.encode
  name: Encoding pipeline (output modules)
  sources:
    - ref: S30
      item: Output modules and output module settings (format, compression, channels, color, audio); embedded encoder
      category: Render and export
      checked: true
  artist_can: >-
    Turn rendered frames into files of the chosen format, codec, pixel format, channels and audio, efficiently and correctly.
  projection_example: >-
    Frames stream straight into a ProRes master as they render, without temporary image files.
  controls:
    - { name: Format / codec, type: enum(dynamic), animatable: false }
    - { name: Pixel format / bit depth, type: enum(dynamic), animatable: false }
    - { name: Channels, type: enum(rgb|rgba|alpha-only), animatable: false }
    - { name: Alpha mode, type: enum(premultiplied|straight), animatable: false }
    - { name: Rate control, type: enum(quality|bitrate|lossless), animatable: false }
  animation: >-
    n/a
  dependencies: [render.offline, color.output-transform, color.banding-dither, render.codec-probe]
  implementation: >-
    Final rgba16float frame → WGSL output transform, dither and packing to the target layout (yuv420p, yuv422p10le,
    yuva444p10le, rgba64le…) → copyTextureToBuffer into an async readback ring (N MAP_READ buffers) → transfer to an
    Electron utility process → FFmpeg stdin as rawvideo with exact rational frame rate; per-frame hashes logged.
  io: >-
    Requires the bundled FFmpeg (full GPL build) and ffprobe.
  limitations: >-
    PCIe readback bandwidth caps throughput at very high resolutions; ring depth tuned per resolution.
  disposition: required-integration
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Hidden behind outcomes; Advanced shows codec, pixel format and alpha mode.
    defaults: >-
      From the chosen outcome.
    automation: >-
      Picks pixel layout and alpha mode the codec supports.
    usability_check: >-
      No guided export exposes encoder terms unless a compatibility decision is needed.
  acceptance: >-
    4K30 ProRes 422 HQ encode sustains ≥ real time on the target machine for a simple scene; frames hash-match the render log.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: render.multi-output
  name: Multiple encodes from one render
  sources:
    - ref: S30
      item: Multiple output modules per render item (e.g. movie plus alpha matte; several formats from one render)
      category: Render and export
      checked: true
  artist_can: >-
    Render once and get several files at the same time — e.g. a ProRes master, an H.264 review copy and a PNG sequence.
  projection_example: >-
    One render of the show produces the projector HAP file and a small MP4 for the client.
  controls:
    - { name: Outputs, type: output-list, animatable: false }
    - { name: Add output, type: action, animatable: false }
  animation: >-
    n/a
  dependencies: [render.encode]
  implementation: >-
    Each rendered frame is packed once per output (cheap WGSL passes from the same frame) and fanned out to one FFmpeg
    process per output; the slowest encoder applies back-pressure.
  io: >-
    Each output verified separately.
  limitations: >-
    Outputs needing different render settings (e.g. resolution of the render itself) need separate items.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Tick more than one outcome in "Save a video".
    defaults: >-
      Share + Master when "Also make a master" is ticked.
    automation: >-
      Resizes per output (render.output-resize) from one full-resolution render.
    usability_check: >-
      A user gets two files from one export in one action.
  acceptance: >-
    All outputs decode to frames consistent with the single render (lossless outputs bit-exact).
  status: not-started
  evidence: []

- id: render.output-resize
  name: Output crop, resize and padding
  sources:
    - ref: S30
      item: Output module crop, stretch or shrink after rendering
      category: Render and export
      checked: true
  artist_can: >-
    Crop, scale or pad an output after rendering, e.g. a smaller review copy or padding to a size a codec requires.
  projection_example: >-
    Make a 1080p review copy from a 5760×1080 three-projector render, letterboxed.
  controls:
    - { name: Crop (T/L/B/R), type: int, animatable: false }
    - { name: Resize to, type: size, animatable: false }
    - { name: Fit, type: enum(fit|fill|stretch), animatable: false }
    - { name: Resample filter, type: enum(lanczos|bicubic|bilinear), animatable: false }
  animation: >-
    n/a
  dependencies: [render.encode]
  implementation: >-
    WGSL resample/crop in the pack stage (linear light, Lanczos), padding to codec multiples (HAP ×4, 4:2:0 even sizes).
  io: >-
    none
  limitations: >-
    Projector outputs must not be resized after mapping; such presets lock this control.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Quality choice "Small / Full size" in outcomes.
    defaults: >-
      Full size.
    automation: >-
      Pads silently to codec-required multiples and reports it.
    usability_check: >-
      A user makes a small review copy without seeing crop controls.
  acceptance: >-
    Resized output matches reference Lanczos downscale within tolerance.
  status: implemented
  evidence:
    - "journey test (apps/studio: npx electron . --ui-test) steps export-run, render-while-editing, cancel-and-retry, export-half-range, drive-upload-retry; 2026-10-02: Export dialog Half size + preview range produced a 960x540, 90-frame file (ffprobe verified); preview at Quarter still exported 1920x1080"

