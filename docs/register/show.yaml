    defaults: >-
      Default input, recording on.
    automation: >-
      Auto gain and baking after the show.
    usability_check: >-
      Users switch a beat recipe from a music file to live input in ≤3 actions.
  acceptance: >-
    Mini scene "live-bake": a recorded live session re-exports identically twice.
