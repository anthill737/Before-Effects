# Tracking, roto, cleanup and puppet — Before Effects capability register
# Sources: S20 (tracking and stabilization incl. Mocha AE, mask/face/3D camera trackers), S21 (Roto Brush, Next-Gen Roto Brush, AI Object Matte, Refine Matte), S22 (Content-Aware Fill), S23 (Puppet tools, Advanced Puppet engine), S01 (Clone Stamp, track mask, 3D Camera Tracker), brief §12. Live pages checked 2026-10-01 where `checked: true`. Footage tracking here is distinct from projector calibration (map.calibration).

- id: track.point
  name: Point tracking (1-, 2- and 4-point)
  sources:
    - ref: S20
      item: Point tracker — Track Type (Stabilize, Transform, Parallel Corner Pin, Perspective Corner Pin, Raw); feature region, search region, attach point; Analyze forward/backward/1 frame
      category: Track motion
      checked: true
    - ref: S20
      item: Motion tracking options — Channel (RGB/Luminance/Saturation), Enhance Before Match, Subpixel Positioning, Adapt Feature On Every Frame, If Confidence Is Below (Continue/Stop/Extrapolate/Adapt)
      category: Track motion
      checked: true
  artist_can: >-
    Track one point for position, two for rotation and scale, or four for perspective corner pinning, frame by frame
    or in one pass, with control over what image data is matched and what happens when confidence drops.
  projection_example: >-
    Track a performer's hand in filmed footage so a projected spark follows it inside the composite.
  controls:
    - { name: Track type, type: enum(transform|parallel-corner-pin|perspective-corner-pin|raw), animatable: false }
    - { name: Track position / rotation / scale, type: flags, animatable: false }
    - { name: Feature region / search region / attach point, type: rect2d, animatable: true }
    - { name: Channel, type: enum(rgb|luminance|saturation), animatable: false }
    - { name: Enhance before match, type: enum(off|blur|enhance), animatable: false }
    - { name: Subpixel positioning, type: bool, animatable: false }
    - { name: Adapt feature, type: enum(never|every-frame|below-confidence), animatable: false }
    - { name: If confidence below, type: enum(continue|stop|extrapolate|adapt), animatable: false }
    - { name: Analyze, type: enum(back-1|back|forward|forward-1|stop), animatable: false }
  animation: >-
    Tracking produces keyframes (attach point, confidence) that are ordinary editable properties (track.data-edit).
  dependencies: [proj.layer, anim.keyframe.core, track.data-edit, track.attach]
  implementation: >-
    Python sidecar with OpenCV: normalised cross-correlation (matchTemplate TM_CCOEFF_NORMED) in the search region with
    parabolic subpixel refinement, optional pyramidal Lucas–Kanade for robustness; frames come from the media decoder
    at full resolution; results streamed back as keyframe ops so each analysed frame appears live and is undoable as one step.
  io: >-
    Track data saved in the project; exportable as CSV/JSON.
  limitations: >-
    Footage tracking is not projector calibration. Occlusions, motion blur and lighting changes cause drift; planar or
    camera solve may suit better.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Motion tracking, stabilisation, roto and cleanup serve moving footage. Projection targets a fixed building, and region suggestion (map.region-suggest) plus photo tracing cover outlining. Revisit for moving subjects."
  milestone: D
  beginner:
    action: >-
      "Follow this" — click a spot in the footage, then pick what should follow it.
    defaults: >-
      One point, RGB, adapt below 80% confidence, subpixel on.
    automation: >-
      Auto-sizes feature/search regions from local contrast and motion; stops and highlights frames where confidence drops.
    usability_check: >-
      A novice attaches a graphic to a moving object in supplied footage in under 2 minutes.
  acceptance: >-
    AS-4 tracked attachment; mini scene "follow-hand": mean error under 1 px against hand-annotated ground truth.
  status: not-started
  evidence: []

- id: track.attach
  name: Apply tracking data to targets
  sources:
    - ref: S20
      item: Motion Target / Edit Target / Apply; Apply dimensions (X and Y, X only, Y only); Attach Point Offset; apply to null and parent
      category: Track motion
      checked: true
  artist_can: >-
    Send tracking data to any layer, null or effect point, restrict it to X or Y, offset the attach point, and reuse
    one track on many targets.
  projection_example: >-
    One track of a moving drone drives a light glow, a text label and the audio pan at once.
  controls:
    - { name: Target, type: property-ref, animatable: false }
    - { name: Apply dimensions, type: enum(xy|x|y), animatable: false }
    - { name: Attach point offset, type: point2d, animatable: true }
    - { name: Via null, type: bool, animatable: false }
    - { name: Live link (expression) vs bake, type: enum(link|bake), animatable: false }
  animation: >-
    Results are keyframes or expression links; re-tracking updates linked targets.
  dependencies: [track.point, expr.engine, anim.keyframe.core]
  implementation: >-
    Apply is an op that writes keyframes or creates a null with keyframes and parents the target; link mode uses an
    expression reference to the track point so edits to the track propagate.
  io: >-
    none
  limitations: >-
    Motion-blurred attached layers need shutter phase −½ shutter angle to avoid lead/lag (set automatically).
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Motion tracking, stabilisation, roto and cleanup serve moving footage. Projection targets a fixed building, and region suggestion (map.region-suggest) plus photo tracing cover outlining. Revisit for moving subjects."
  milestone: D
  beginner:
    action: >-
      After tracking: drag the track onto any layer, or pick "Make this follow".
    defaults: >-
      Via null, linked.
    automation: >-
      Sets the target layer's motion-blur shutter phase to centre blur on the attach point.
    usability_check: >-
      A user applies one track to two targets in under 30 s.
  acceptance: >-
    AS-4; mini scene "one-track-many-targets".
  status: not-started
  evidence: []

- id: track.data-edit
  name: Editable tracking data
  sources:
    - ref: S20
      item: Motion tracking properties (Feature Center, Feature Size, Search Offset, Search Size, Confidence, Attach Point, Attach Point Offset); correcting a motion track; editing motion paths
      category: Track motion
      checked: true
  artist_can: >-
    See and fix tracks: edit track points on a motion path, view confidence over time, re-track a section, delete bad
    frames, smooth jitter, average trackers and import/export data.
  projection_example: >-
    Fix five drifting frames where the performer's hand passes behind a prop, without re-tracking the shot.
  controls:
    - { name: Confidence graph, type: display, animatable: false }
    - { name: Re-track range, type: time-range, animatable: false }
    - { name: Smooth, type: float, animatable: false }
    - { name: Average selected tracks, type: action, animatable: false }
    - { name: Import/export track data, type: action, animatable: false }
  animation: >-
    Track points are keyframes editable in the motion path and graph editor.
  dependencies: [anim.motion-path, anim.graph-editor, track.point]
  implementation: >-
    Tracks stored as keyframed properties with per-frame confidence; smoothing is a deterministic Savitzky–Golay or
    Gaussian filter op; export formats CSV/JSON and Nuke .chan for cameras.
  io: >-
    CSV/JSON import/export; Mocha-style corner-pin text import.
  limitations: >-
    Smoothing removes real high-frequency motion along with jitter.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Motion tracking, stabilisation, roto and cleanup serve moving footage. Projection targets a fixed building, and region suggestion (map.region-suggest) plus photo tracing cover outlining. Revisit for moving subjects."
  milestone: D
  beginner:
    action: >-
      Low-confidence frames show red on the track; "Fix these frames" re-tracks or interpolates them.
    defaults: >-
      Confidence threshold 80%.
    automation: >-
      Offers interpolation across short gaps automatically.
    usability_check: >-
      A user repairs a 5-frame drift in under 60 s.
  acceptance: >-
    Mini scene "occluded-hand": repaired track error under 1 px on repaired frames.
  status: not-started
  evidence: []

- id: track.stabilize
  name: Stabilization
  sources:
    - ref: S20
      item: Stabilize Motion (position → Anchor Point, rotation, scale keyframes); Warp Stabilizer
      category: Track motion
      checked: true
  artist_can: >-
    Remove camera shake or lock a moving object still in frame, choosing which of position, rotation and scale to
    stabilise, with automatic reframing to hide edges.
  projection_example: >-
    Steady handheld footage of dancers before playing it inside a large window region.
  controls:
    - { name: Method, type: enum(point-tracker|automatic), animatable: false }
    - { name: Stabilise position / rotation / scale, type: flags, animatable: false }
    - { name: Result, type: enum(smooth-motion|no-motion), animatable: false }
    - { name: Smoothness, type: percent, animatable: false }
    - { name: Framing, type: enum(stabilize-only|crop|crop-auto-scale|synthesize-edges), animatable: false }
  animation: >-
    Generates anchor/rotation/scale keyframes (point method) or a stabilisation warp (automatic).
  dependencies: [track.point, fx.distort.warp-stabilizer]
  implementation: >-
    Point method writes compensating keyframes. Automatic method: OpenCV feature tracks (goodFeaturesToTrack + LK) →
    camera path smoothing → per-frame similarity/perspective warp applied as a WGSL warp pass; the effect-facing
    controls are shared with fx.distort.warp-stabilizer.
  io: >-
    Stabilisation solve cached per clip.
  limitations: >-
    Rolling-shutter and parallax-heavy shots need the subspace/mesh method, which is approximate.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Motion tracking, stabilisation, roto and cleanup serve moving footage. Projection targets a fixed building, and region suggestion (map.region-suggest) plus photo tracing cover outlining. Revisit for moving subjects."
  milestone: D
  beginner:
    action: >-
      "Steady this shot".
    defaults: >-
      Smooth motion, 50% smoothness, crop + auto-scale.
    automation: >-
      Analyses in the background and reports the zoom needed.
    usability_check: >-
      A user stabilises a shaky clip in one action and can undo it.
  acceptance: >-
    Mini scene "steady-dancers": residual motion reduced by ≥ 80% on a reference shot.
  status: not-started
  evidence: []

- id: track.planar
  name: Planar tracking
  sources:
    - ref: S20
      item: Planar Tracking with Mocha AE (GPU-accelerated; motion blur and off-screen objects)
      category: Track motion
      checked: true
  artist_can: >-
    Track a flat surface (a wall, screen, sign or floor) as a plane through perspective changes, partial occlusion and
    motion blur.
  projection_example: >-
    Track the side of a moving bus in footage so a replacement advert sticks to it in a show segment.
  controls:
    - { name: Plane shape, type: bezier, animatable: true }
    - { name: Motion model, type: enum(translation|similarity|affine|perspective), animatable: false }
    - { name: Exclusion shapes, type: bezier-list, animatable: true }
    - { name: Track direction, type: enum(forward|backward|both), animatable: false }
    - { name: Min % pixels used, type: percent, animatable: false }
  animation: >-
    Produces a per-frame homography plus corner keyframes; shapes are keyframable.
  dependencies: [track.data-edit, mask.bezier]
  implementation: >-
    OpenCV in the sidecar: AKAZE/ORB features inside the plane mask, RANSAC/MAGSAC homography (findHomography with
    USAC_MAGSAC), then ECC refinement (findTransformECC, MOTION_HOMOGRAPHY) for subpixel accuracy; exclusion shapes
    mask out occluders.
  io: >-
    Exports corner pin/transform data; imports Mocha corner-pin text.
  limitations: >-
    Needs texture on the plane; non-planar surfaces drift.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Motion tracking, stabilisation, roto and cleanup serve moving footage. Projection targets a fixed building, and region suggestion (map.region-suggest) plus photo tracing cover outlining. Revisit for moving subjects."
  milestone: D
  beginner:
    action: >-
      "Stick to this surface" — click inside the surface in the footage.
    defaults: >-
      Perspective model; plane outline auto-drawn from a SAM 2 segment of the clicked surface.
    automation: >-
      Proposes the plane outline and occluder exclusions automatically.
    usability_check: >-
      A novice replaces a screen in supplied footage in under 3 minutes.
  acceptance: >-
    Mini scene "screen-replace": corner error under 1.5 px RMS vs ground truth.
  status: not-started
  evidence: []

- id: track.planar-attach
  name: Planar attachment (corner pin, transform, spline export)
  sources:
    - ref: S20
      item: Applying Mocha AE data — Create Track Data; Export Option Corner Pin or Transform; Create AE Masks; Apply Matte
      category: Track motion
      checked: true
  artist_can: >-
    Pin any layer onto a tracked plane, apply the plane's transform to other layers, or turn tracked shapes into masks or mattes.
  projection_example: >-
    A tracked doorway in footage gets a projected-glow layer pinned into it and a matte that hides a passer-by.
  controls:
    - { name: Export as, type: enum(corner-pin|transform|mask|matte), animatable: false }
    - { name: Target layer, type: layer-ref, animatable: false }
    - { name: Motion blur on pinned layer, type: bool, animatable: false }
  animation: >-
    Exports become keyframes on fx.distort.corner-pin or transforms, or animated masks.
  dependencies: [track.planar, fx.distort.corner-pin, mask.bezier, mask.track-matte]
  implementation: >-
    Ops convert the homography series into corner-pin keyframes, decomposed transforms, or per-frame mask paths;
    matte mode rasterises shapes with feather in WGSL.
  io: >-
    none
  limitations: >-
    Transform decomposition loses perspective; corner pin keeps it.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Motion tracking, stabilisation, roto and cleanup serve moving footage. Projection targets a fixed building, and region suggestion (map.region-suggest) plus photo tracing cover outlining. Revisit for moving subjects."
  milestone: D
  beginner:
    action: >-
      After tracking: drag a layer onto the tracked surface.
    defaults: >-
      Corner pin with motion blur matching the footage.
    automation: >-
      Fits the dropped layer to the plane's corners.
    usability_check: >-
      A user pins a layer to a tracked plane in one drag.
  acceptance: >-
    Mini scene "screen-replace" pinned content stays within 1.5 px.
  status: not-started
  evidence: []

