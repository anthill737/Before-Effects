- id: track.camera-solve
  name: 3D camera solve (camera tracker)
  sources:
    - ref: S20
      item: 3D Camera tracker — extract camera motion and 3D scene data
      category: Track motion
      checked: true
    - ref: S01
      item: 3D Camera Tracker effect — Shot type, solve method, track points, ground plane/origin, Create Camera, Create Null/Solid/Text, average error
      category: Work with 3D composition
      checked: false
  artist_can: >-
    Recover the moving camera and a cloud of 3D points from filmed footage, set ground and origin, and place 3D
    objects that stay locked into the footage.
  projection_example: >-
    A drone shot of the venue is solved so a virtual dragon can fly around the real tower in the audience preview.
  controls:
    - { name: Shot type, type: enum(fixed-fov|variable-zoom|specify-fov), animatable: false }
    - { name: Solve method, type: enum(auto|typical|mostly-flat|tripod-pan), animatable: false }
    - { name: Set ground plane and origin, type: action, animatable: false }
    - { name: Scale (known distance), type: float, animatable: false }
    - { name: Create camera / null / plane / text, type: action, animatable: false }
    - { name: Average error, type: display, animatable: false }
  animation: >-
    Produces a keyframed camera and nulls; data editable like any camera.
  dependencies: [3d.camera, 3d.scene, track.data-edit, track.roto]
  implementation: >-
    Sidecar job: pycolmap (BSD) incremental SfM with sequential matching on decoded frames (moving objects masked by
    SAM 2), or Blender headless libmv tracker as an alternative; camera converted to the app's metres/Y-up convention.
    The effect-facing controls correspond to fx.perspective.3d-camera-tracker in the effect catalog.
  io: >-
    Camera export as .chan/JSON/glTF camera; point cloud as PLY.
  limitations: >-
    Fails on pure rotation without parallax (tripod mode), featureless or highly dynamic shots. Not projector calibration.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Motion tracking, stabilisation, roto and cleanup serve moving footage. Projection targets a fixed building, and region suggestion (map.region-suggest) plus photo tracing cover outlining. Revisit for moving subjects."
  milestone: D
  beginner:
    action: >-
      "Add 3D to this footage" → analyse → click the ground.
    defaults: >-
      Auto method; origin at clicked ground point; scale 1 unit = 1 m from a user-entered known distance (optional).
    automation: >-
      Masks moving people automatically before solving; reports quality in plain words (Good/Usable/Poor).
    usability_check: >-
      A user places a 3D object that stays locked in a supplied drone shot in under 5 minutes of interaction.
  acceptance: >-
    Mini scene "drone-solve": reprojection error under 0.7 px on the reference shot.
  status: not-started
  evidence: []

- id: track.roto
  name: Propagated segmentation (Roto Brush equivalent)
  sources:
    - ref: S21
      item: Roto Brush (Next-Gen Roto Brush 3.0, Roto Brush 2, Roto Brush 1); strokes, spans, base frames, propagation; Version; Quality; Invert Foreground/Background; Enable Classic Controls
      category: Roto Brush and Refine Matte
      checked: true
  artist_can: >-
    Paint rough foreground and background strokes on a few frames and get a matte that propagates through the shot,
    correcting it with more strokes where it slips.
  projection_example: >-
    Cut out a dancer from rehearsal footage so they appear to perform inside a window of the building.
  controls:
    - { name: Foreground / background stroke, type: tool, animatable: false }
    - { name: Base frames, type: frame-list, animatable: false }
    - { name: Span, type: time-range, animatable: false }
    - { name: Quality, type: enum(standard|best), animatable: false }
    - { name: Invert foreground/background, type: bool, animatable: false }
    - { name: Brush size, type: float, animatable: false }
  animation: >-
    Matte is a cached per-frame sequence; corrections on any frame re-propagate the affected span.
  dependencies: [track.object-matte, track.refine-edge, track.matte-cache, mask.track-matte]
  implementation: >-
    SAM 2.1 video predictor in the sidecar: strokes become positive/negative point and mask prompts on base frames;
    propagation forward and backward through the span using SAM 2's memory bank; masks streamed back as 8/16-bit alpha
    and cached (track.matte-cache).
  io: >-
    Model download: SAM 2.1 checkpoints, Apache-2.0 — tiny ≈160 MB, small ≈185 MB, base+ ≈320 MB, large ≈900 MB.
  limitations: >-
    Hair, motion blur and transparency need track.refine-edge; long occlusions may lose the object; ML output can
    vary across GPU/driver versions, which is why mattes are frozen to cache before export.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Motion tracking, stabilisation, roto and cleanup serve moving footage. Projection targets a fixed building, and region suggestion (map.region-suggest) plus photo tracing cover outlining. Revisit for moving subjects."
  milestone: D
  beginner:
    action: >-
      "Cut out the performer": brush over them once; fix with green (keep) / red (remove) strokes.
    defaults: >-
      Base+ model, best quality, propagate across the whole clip.
    automation: >-
      Downloads the model on first use (size shown), propagates in the background showing progress, flags frames
      where the matte area jumps suspiciously.
    usability_check: >-
      A novice gets a clean cutout of a dancer over 10 s of supplied footage in under 5 minutes of interaction.
  acceptance: >-
    AS-4 performer composite; mini scene "dancer-roto": J&F ≥ 0.85 against a hand-made reference matte.
  status: not-started
  evidence: []

