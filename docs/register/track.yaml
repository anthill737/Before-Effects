- id: track.refine-edge
  name: Refine edge and matte refinement
  sources:
    - ref: S21
      item: Roto Brush & Refine Edge effect — Fine-tune Roto Brush Matte, Roto Brush Matte, Render Refine Edge, Base Refine Edge Radius, Fine-tune Refine Edge Matte, Refine Edge Matte, Use Motion Blur, Decontaminate Edge Colors; Refine Edge Tool
      category: Roto Brush and Refine Matte
      checked: true
  artist_can: >-
    Turn a hard segmentation into a soft, natural edge with feather, contrast, shift edge and chatter reduction, recover
    hair and motion-blurred edges, and remove background colour spill at edges.
  projection_example: >-
    A dancer's hair edges blend cleanly over a bright projected background without a dark halo.
  controls:
    - { name: Feather, type: float, animatable: true }
    - { name: Contrast, type: percent, animatable: true }
    - { name: Shift edge, type: percent, animatable: true }
    - { name: Reduce chatter, type: percent, animatable: true }
    - { name: Refine edge radius / brush, type: float, animatable: false }
    - { name: Use motion blur (samples / shutter angle), type: int, animatable: false }
    - { name: Decontaminate edge colours (amount / extend radius), type: percent, animatable: true }
  animation: >-
    Refinement parameters keyframable; refined matte cached.
  dependencies: [track.roto, fx.matte.refine-soft-matte, fx.matte.refine-hard-matte]
  implementation: >-
    Trimap from the segmentation band → ViTMatte (MIT) alpha matting in the sidecar for hair-level detail; temporal
    chatter reduction by flow-guided averaging (RAFT, BSD-3); feather/contrast/shift and decontamination as WGSL passes
    on premultiplied linear data.
  io: >-
    Model downloads: ViTMatte ≈100–400 MB depending on variant (MIT); RAFT ≈20 MB (BSD-3).
  limitations: >-
    Semi-transparent objects (smoke, glass) remain hard; refined edges are only as good as the trimap.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Motion tracking, stabilisation, roto and cleanup serve moving footage. Projection targets a fixed building, and region suggestion (map.region-suggest) plus photo tracing cover outlining. Revisit for moving subjects."
  milestone: D
  beginner:
    action: >-
      "Soften the edges" slider and "Fix hair" brush on any cutout.
    defaults: >-
      Feather 1 px, chatter reduction 30%, decontaminate on.
    automation: >-
      Auto-detects hair-like edge regions and refines them without brushing.
    usability_check: >-
      Users rate edge quality acceptable after one slider adjustment in 8 of 10 cases on supplied footage.
  acceptance: >-
    AS-4 corrected edges; exported alpha shows no dark/bright fringe beyond tolerance.
  status: not-started
  evidence: []

- id: track.matte-cache
  name: Freeze and cache ML results
  sources:
    - ref: S21
      item: Freeze button — cache and lock segmentation for spans, saved with the project
      category: Roto Brush and Refine Matte
      checked: true
  artist_can: >-
    Lock a finished matte, fill, depth map or track so it never recalculates and renders identically every time.
  projection_example: >-
    Freeze the dancer matte before the show render so a driver update cannot change the cutout.
  controls:
    - { name: Freeze / unfreeze, type: action, animatable: false }
    - { name: Cache location, type: path, animatable: false }
    - { name: Status, type: display, animatable: false }
  animation: >-
    n/a
  dependencies: [proj.project-model, preview.disk-cache]
  implementation: >-
    Results written as image sequences (16-bit PNG alpha / half EXR) in a project-relative cache keyed by inputs hash +
    model ID + parameters; render jobs read frozen caches only and refuse to run inference during export.
  io: >-
    Frozen caches are collected with the project (proj collect) and are required for reproducible renders.
  limitations: >-
    Caches can be large (≈ 1–4 MB per HD frame); disk usage shown.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      Automatic: finished AI results freeze when you leave the tool; padlock icon shows status.
    defaults: >-
      Auto-freeze on.
    automation: >-
      Re-freezes when inputs change and warns if an export would use a stale result.
    usability_check: >-
      Users never see an export wait for AI inference in testing.
  acceptance: >-
    AS-6: two exports of a roto shot are bit-identical; export log shows zero inference calls.
  status: not-started
  evidence: []

- id: track.matte-to-mask
  name: Convert mattes to editable masks
  sources:
    - ref: S20
      item: Mocha AE — Create AE Masks (spline to native mask)
      category: Track motion
      checked: true
    - ref: brief
      item: §12 manually corrected object isolation
      category: Product requirement
      checked: true
  artist_can: >-
    Turn an AI or tracked matte into animated Bezier masks that can be edited point by point.
  projection_example: >-
    Convert a performer matte to masks, then hand-fix the outline on frames where a prop confused the AI.
  controls:
    - { name: Point density, type: float, animatable: false }
    - { name: Simplify tolerance, type: float, animatable: false }
    - { name: Keyframe every N frames, type: int, animatable: false }
  animation: >-
    Produces mask path keyframes with consistent point counts for smooth interpolation.
  dependencies: [mask.bezier, track.roto, track.planar-attach]
  implementation: >-
    Contour extraction (OpenCV findContours) → curve fitting to Bezier (Schneider fit) with point correspondence across
    frames to keep vertex counts stable.
  io: >-
    none
  limitations: >-
    Topology changes (object splitting) create separate masks.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Motion tracking, stabilisation, roto and cleanup serve moving footage. Projection targets a fixed building, and region suggestion (map.region-suggest) plus photo tracing cover outlining. Revisit for moving subjects."
