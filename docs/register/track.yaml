- id: track.face
  name: Face tracking
  sources:
    - ref: S20
      item: Face tracker — outline and detailed features (pupils, mouth, nose)
      category: Track motion
      checked: true
  artist_can: >-
    Track a face outline or detailed features (eyes, pupils, mouth, nose) to drive masks, effects or animations.
  projection_example: >-
    A performer's mouth opening drives the brightness of a projected light burst in the composite.
  controls:
    - { name: Mode, type: enum(outline|detailed-features), animatable: false }
    - { name: Feature data outputs, type: display, animatable: false }
  animation: >-
    Outputs keyframed points and scalar measures (mouth openness, eye distance) usable by expressions.
  dependencies: [track.data-edit, expr.engine, mask.bezier]
  implementation: >-
    MediaPipe Face Landmarker (Apache-2.0, ≈4 MB model, 478 landmarks) in the sidecar; landmarks smoothed and written
    as track points and a face-outline mask.
  io: >-
    none
  limitations: >-
    Profiles and occluded faces lose landmarks; one face per tracker.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Motion tracking, stabilisation, roto and cleanup serve moving footage. Projection targets a fixed building, and region suggestion (map.region-suggest) plus photo tracing cover outlining. Revisit for moving subjects."
  milestone: D
  beginner:
    action: >-
      "Track this face".
    defaults: >-
      Outline mask plus key features.
    automation: >-
      Detects the face automatically; no clicking needed.
    usability_check: >-
      A user drives an effect from mouth openness in under 3 minutes.
  acceptance: >-
