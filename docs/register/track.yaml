  beginner:
    action: >-
      "Make the outline editable" on a cutout.
    defaults: >-
      Keyframe every 2 frames, moderate simplification.
    automation: >-
      Keeps point count stable to avoid boiling.
    usability_check: >-
      A user hand-fixes one frame of a converted mask in under 60 s.
  acceptance: >-
    Mini scene "mask-fix": converted mask matches the matte within 1 px mean distance.
  status: not-started
  evidence: []

- id: track.content-aware-fill
  name: Content-aware fill (object removal)
  sources:
    - ref: S22
      item: Content-Aware Fill panel — Fill Target, Alpha Expansion, Fill Method (Object, Surface, Edge Blend), Lighting Correction (Subtle/Moderate/Strong), Range, Create Reference Frame, Generate Fill Layer; settings (Output Depth, Output Location)
      category: Remove objects from your videos
      checked: true
  artist_can: >-
    Remove an unwanted object from video by masking it; the app fills the hole from surrounding frames or surface
    texture, with lighting correction and optional hand-painted reference frames.
  projection_example: >-
    Remove a lamp post and a passer-by from footage of the venue used for the audience preview.
  controls:
    - { name: Fill method, type: enum(object|surface|edge-blend), animatable: false }
    - { name: Alpha expansion, type: float, animatable: false }
    - { name: Lighting correction, type: enum(off|subtle|moderate|strong), animatable: false }
    - { name: Range, type: enum(work-area|entire-duration), animatable: false }
    - { name: Reference frames, type: layer-list, animatable: false }
    - { name: Output depth, type: enum(8|16|32), animatable: false }
  animation: >-
    Fill layer is a cached sequence; masks driving the hole are animatable/trackable.
  dependencies: [track.mask, track.roto, track.matte-cache, track.clone-paint, mask.bezier]
  implementation: >-
    Sidecar: ProPainter (flow-guided video inpainting with RAFT flow completion) for Object; planar-tracked texture
    propagation plus LaMa for Surface; LaMa or Telea/biharmonic for Edge Blend; reference frames injected as
    known pixels; lighting correction via per-frame local colour transfer. Processing chunked for 16 GB VRAM.
  io: >-
    Writes fill sequences (PNG 8/16-bit or EXR 32-bit) to a project-relative Fills folder. Downloads: ProPainter ≈150 MB
    + RAFT/flow-completion ≈40 MB (S-Lab non-commercial licence, acceptable for personal use); big-lama ≈200 MB (Apache-2.0).
  limitations: >-
    Complex moving textures (water, crowds) and large holes fail; ProPainter is VRAM-hungry above 1080p (processed in
    tiles/chunks); non-commercial licences restrict any future commercial use.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Motion tracking, stabilisation, roto and cleanup serve moving footage. Projection targets a fixed building, and region suggestion (map.region-suggest) plus photo tracing cover outlining. Revisit for moving subjects."
  milestone: D
  beginner:
    action: >-
      "Remove this": brush or click the object, choose "Moving thing / Flat surface / Small blemish".
    defaults: >-
      Object method, alpha expansion 5 px, lighting correction Moderate.
    automation: >-
      Builds and tracks the hole mask from a click (SAM 2), picks the method from camera motion, renders in the
      background prioritising the frame under the playhead.
    usability_check: >-
      A novice removes a passer-by from 5 s of supplied footage in under 5 minutes of interaction.
  acceptance: >-
    Mini scene "remove-passerby": no visible ghosting on review by two viewers; fill cached and reused for export.
  status: not-started
  evidence: []

- id: track.clone-paint
  name: Clone and paint cleanup
  sources:
    - ref: S01
      item: Clone Stamp tool (source layer, source time, offset, aligned, lock source time); Eraser; Paint tools
      category: Drawing, Painting, and Paths
      checked: false
    - ref: S22
      item: Reference frame cleanup (Clone Stamp / patch on a single frame)
      category: Remove objects from your videos
      checked: true
  artist_can: >-
    Paint out blemishes, wires or markers by cloning from another place or time, frame by frame or across a duration,
    and fix a single reference frame that guides content-aware fill.
  projection_example: >-
    Clone out tracking markers on a performer's costume before compositing them into the show.
  controls:
    - { name: Source layer / point, type: point2d, animatable: true }
    - { name: Source time shift / lock source time, type: time, animatable: false }
    - { name: Aligned, type: bool, animatable: false }
    - { name: Brush size / hardness / opacity, type: float, animatable: false }
    - { name: Duration, type: enum(constant|write-on|single-frame|custom), animatable: false }
  animation: >-
    Strokes are animatable paint strokes (write-on, duration), consistent with the paint tools.
  dependencies: [proj.layer, shape.path, track.point]
  implementation: >-
    Clone strokes are vector paint strokes (Skia path) rasterised per frame in WGSL sampling the source layer at a time
    offset; strokes can follow a track via track.attach. Shares the stroke engine with the paint tools in the shape area.
  io: >-
    none
  limitations: >-
    Manual work per shot; large removals belong to content-aware fill.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Motion tracking, stabilisation, roto and cleanup serve moving footage. Projection targets a fixed building, and region suggestion (map.region-suggest) plus photo tracing cover outlining. Revisit for moving subjects."
  milestone: D
  beginner:
    action: >-
      "Touch up" brush: paint over the spot; source picked automatically nearby.
    defaults: >-
      Source offset auto-chosen from similar texture; stroke lasts the whole clip and follows tracking if present.
    automation: >-
      Suggests a clean source region and attaches strokes to a track automatically.
    usability_check: >-
      A user removes a tracking marker across 3 s of footage in under 2 minutes.
  acceptance: >-
    Mini scene "marker-cleanup".
  status: not-started
  evidence: []

- id: track.puppet
  name: Puppet mesh deformation
  sources:
    - ref: S23
      item: Puppet Position Pin tool; mesh from alpha auto-trace, mask, shape or text outline; Expansion; Density (Advanced engine) / Triangles (Legacy); Show mesh; multiple meshes; Puppet engine choice
      category: Animate with Puppet tools
      checked: true
  artist_can: >-
    Drop pins on a drawing, logo or footage layer and drag them to bend it naturally, with the rest of the image
    deforming as rigidly as possible.
  projection_example: >-
    A drawn vine on the facade sways and curls as the wind rises in the music.
  controls:
    - { name: Position pin, type: point2d, animatable: true }
    - { name: Mesh density, type: int, animatable: true }
    - { name: Expansion, type: float, animatable: true }
    - { name: Outline source, type: enum(alpha|mask|shape|text), animatable: false }
    - { name: Show mesh, type: bool, animatable: false }
    - { name: Engine, type: enum(advanced|legacy), animatable: false }
  animation: >-
    Pins auto-keyframe on drag; mesh evaluated statelessly per frame from pin positions.
  dependencies: [proj.layer, anim.keyframe.core, anim.motion-path, mask.bezier, shape.path, text.layer]
  implementation: >-
    Outline from alpha (marching squares) or vector paths; constrained Delaunay triangulation; As-Rigid-As-Possible
    deformation solved with a prefactored sparse system (Cholesky in WASM) per frame; mesh rendered as a WGSL textured
    triangle mesh; deterministic since it depends only on pin values at t.
  io: >-
    none
  limitations: >-
    Mesh is built at the frame it was created and does not follow motion in footage; very dense meshes slow interaction.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Motion tracking, stabilisation, roto and cleanup serve moving footage. Projection targets a fixed building, and region suggestion (map.region-suggest) plus photo tracing cover outlining. Revisit for moving subjects."
  milestone: D
  beginner:
    action: >-
      "Bend it" — click points on the artwork to add pins, drag to pose.
    defaults: >-
      Advanced engine, density 10, expansion 3 px.
    automation: >-
      Auto-builds the mesh from the clicked outline; suggests pin spots at extremities.
    usability_check: >-
      A novice makes a drawn figure wave its arm in under 2 minutes.
  acceptance: >-
    Mini scene "vine-sway": identical frames when seeking backwards vs playing forwards.
  status: not-started
  evidence: []

