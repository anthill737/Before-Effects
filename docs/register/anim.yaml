# Animation engine, graph editor and time — Before Effects capability register
# Sources: S04 (keyframe interpolation; animation basics), S05 (time stretching and time remapping), S01 (keyframe assistants, Sequence Layers, motion blur), brief §4, §20. Adobe helpx pages returned HTTP 403 on 2026-10-01; Adobe items authored from knowledge (checked: false).

- id: anim.time-model
  name: Deterministic integer time model
  sources:
    - ref: "brief §20"
      item: "Use deterministic time and seeded randomness"
      category: "Architecture and build rules"
      checked: true
    - ref: "brief §4"
      item: "Time-remapped nested scenes must behave consistently during scrubbing and export"
      category: "Animation engine and graph editor"
      checked: true
  artist_can: >-
    Work at any common frame rate (23.976, 24, 25, 29.97, 30, 50, 59.94, 60) and mix footage of different rates in one show,
    with every keyframe landing on the same instant in preview and export.
  projection_example: >-
    A 25 fps show built from 30 fps stock footage and 60 fps generated content keeps every light hit on the exact beat frame
    after a reopen, a scrub and a background export.
  controls:
    - { name: "Composition frame rate", type: "enum(23.976|24|25|29.97|30|48|50|59.94|60|custom)", animatable: false }
    - { name: "Time display", type: "enum(timecode|frames|seconds)", animatable: false }
    - { name: "Drop-frame timecode", type: "bool", animatable: false }
    - { name: "Start frame / start timecode", type: "time", animatable: false }
  animation: >-
    Not animatable itself; it is the clock every keyframe, expression, simulation and render job reads.
  dependencies: []
  implementation: >-
    All times stored as integer flicks (1/705,600,000 s), held as JS numbers below 2^53 (about 148 days of range) with BigInt
    used only for serialization checks. Every supported rate is an exact integer frame length (23.976 = 29,429,400 flicks,
    29.97 = 23,543,520, 25 = 28,224,000). Frame-to-time and time-to-frame conversions live in one core module with explicit
    floor/round policies, and sub-frame times (motion-blur samples, time remap) stay exact flick integers.
  io: >-
    Project files store flicks plus the rate as a rational; import of footage records its native rate as a rational from FFmpeg
    probe (r_frame_rate), never a rounded float.
  limitations: >-
    Variable-frame-rate source video is conformed to a constant rate on import (see proj.source-interpretation); the
    original timing is kept as metadata but not edited directly.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Invisible by default — the guided "New show" step picks the frame rate from the chosen output preset or projector setup.
    defaults: >-
      Frame rate follows the selected projector/output preset (30 fps if none); time shown as seconds plus frames.
    automation: >-
      Imported footage at a different rate is conformed automatically with a plain note ("Played at 25 fps to match your show").
    usability_check: >-
      A first-time user creates a show and adds mixed-rate footage without ever being asked to choose a frame rate or
      timecode format, and a preview and export of the same frame range are frame-identical.
  acceptance: >-
    AS-6 and mini scene "mixed-rate-beat": 24/25/30/60 fps assets keyed to one beat; exported frame N matches the preview
    frame N hash at three rates.
  status: not-started
  evidence: []

- id: anim.keyframe.core
  name: Keyframes on every animatable property
  sources:
    - ref: S04
      item: "Setting, selecting and deleting keyframes; stopwatch; keyframe navigation"
      category: "Animation basics"
      checked: false
    - ref: "brief §4"
      item: "Keyframe editing on all meaningful animatable properties"
      category: "Animation engine and graph editor"
      checked: true
  artist_can: >-
    Set, select, move, delete and numerically edit keyframes on any animatable property (transforms, effect values, masks,
    materials, lights, cameras, text selectors, sound levels, procedural controls), and jump between them.
  projection_example: >-
    Key a window region's brightness from dark to full and back so it glows for two seconds on the chorus.
  controls:
    - { name: "Animate (stopwatch) toggle per property", type: "bool", animatable: false }
    - { name: "Keyframe time", type: "time", animatable: false }
    - { name: "Keyframe value", type: "property-ref", animatable: true }
    - { name: "Auto-key mode", type: "bool", animatable: false }
    - { name: "Previous / next keyframe", type: "action", animatable: false }
    - { name: "Keyframe label colour", type: "enum(none|red|yellow|green|blue|purple)", animatable: false }
  animation: >-
    This is the keyframe system itself; expressions run after keyframe interpolation and can read keyframe data
    (expr.value-at-time).
  dependencies: [anim.time-model, ux.operation-system]
  implementation: >-
    Each animatable property holds a sorted array of keyframes with stable IDs (not indices), flick times, typed values and
    in/out interpolation records; a pure evaluate(property, tFlicks, ctx) in core TS binary-searches the segment and calls
    the interpolation kernel, memoized per (property, time, dependency hash). Add/move/delete/set-value are typed ops in the
    operation system, applied with Immer so undo replays inverse patches.
  io: >-
    Keyframes serialize with the project; stable keyframe IDs let recipes track overrides and the AI assistant target edits.
  limitations: >-
    Properties marked non-animatable (e.g. a source file path) cannot take keyframes; they can still be swapped by ops or
    markers.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "Animate this" — select a thing, press Animate, move the playhead and change the value; the app records keyframes.
    defaults: >-
      Auto-key is on in the guided workspace; new keyframes use Easy Ease temporal and auto-Bezier spatial interpolation.
    automation: >-
      Recipes create keyframes for the user; changing a value later in time adds a keyframe instead of moving the first one.
    usability_check: >-
      A first-time user makes a window fade up and back down over two seconds in under 60 s with no instructions, then
      undoes one keyframe change.
  acceptance: >-
    AS-1 and mini scene "window-glow": brightness keyframes on a region; reopen and seek to five random frames give
    identical values to the pre-save evaluation.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: anim.interp.linear
  name: Linear interpolation
  sources:
    - ref: S04
      item: "Linear interpolation"
      category: "Keyframe interpolation"
      checked: false
  artist_can: >-
    Make a value change at a constant rate between two keyframes, producing mechanical, even motion.
  projection_example: >-
    A scanning bar sweeps across the facade at an even speed, matching a metronomic music section.
  controls:
    - { name: "Temporal interpolation in/out", type: "enum(linear|bezier|continuous-bezier|auto-bezier|hold)", animatable: false }
  animation: >-
    Applies per keyframe side (incoming and outgoing independently).
  dependencies: [anim.keyframe.core]
  implementation: >-
    Linear kernel in the core evaluator: lerp for scalars and vectors, shortest-path option for angles, linear-light or
    perceptual mixing for colours selected by the colour pipeline; segment parameter computed from exact flick ratios.
  io: >-
    none
  limitations: >-
    Linear colour interpolation is in the working colour space; perceptual mixes are available through the colour control
    option, not by default.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Reached through the timing picker on any animation → "Steady".
    defaults: >-
      Not the default; offered when the user picks "Steady" or "Mechanical".
    automation: >-
      Recipes that need constant motion (scans, sweeps) set linear automatically.
    usability_check: >-
      A first-time user changes an eased move to a steady one in two actions or fewer without opening a graph.
  acceptance: >-
    Mini scene "steady-scan": a bar crosses 1920 px in 4 s; measured position per frame is exactly linear.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: anim.interp.hold
  name: Hold interpolation
  sources:
    - ref: S04
      item: "Hold interpolation; Toggle Hold Keyframe"
      category: "Keyframe interpolation"
      checked: false
  artist_can: >-
    Keep a value unchanged until the next keyframe and then jump, for strobes, cuts and stepped motion.
  projection_example: >-
    Windows switch on and off instantly in a rhythmic pattern instead of fading.
  controls:
    - { name: "Hold (outgoing)", type: "bool", animatable: false }
  animation: >-
    Hold can be set on the outgoing side of any keyframe; applies to spatial and temporal values and is the only mode for
    non-interpolable values (enums, source text, booleans).
  dependencies: [anim.keyframe.core]
  implementation: >-
    Step kernel in the evaluator returning the left keyframe value for t < next key time; non-interpolable value types are
    forced to hold by the property type definition.
  io: >-
    none
  limitations: >-
    none
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Reached through the timing picker → "Instant switch"; also the default for on/off controls.
    defaults: >-
      Toggles, dropdowns and text content keyframes are hold automatically.
    automation: >-
      "Flash on the beat" recipes write hold keyframes on beat markers.
    usability_check: >-
      A first-time user turns a fade into an instant on/off in two actions or fewer.
  acceptance: >-
    Mini scene "strobe-windows": hold keys at beat markers; no in-between values appear on any frame.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: anim.interp.bezier
  name: Bezier interpolation with split handles
  sources:
    - ref: S04
      item: "Bezier interpolation; direction handles; split in/out handles"
      category: "Keyframe interpolation"
      checked: false
    - ref: "brief §4"
      item: "Bezier curve handling; separate incoming/outgoing handles; ease-in/out"
      category: "Animation engine and graph editor"
      checked: true
  artist_can: >-
    Shape exactly how a value accelerates and decelerates into and out of each keyframe using independent incoming and
    outgoing handles.
  projection_example: >-
    A facade panel slams fast into place and then decays slowly, with a sharp corner in the speed curve at impact.
  controls:
    - { name: "Incoming speed", type: "float", animatable: false }
    - { name: "Incoming influence", type: "percent", animatable: false }
    - { name: "Outgoing speed", type: "float", animatable: false }
    - { name: "Outgoing influence", type: "percent", animatable: false }
    - { name: "Split handles", type: "bool", animatable: false }
  animation: >-
    Temporal Bezier on any interpolable property; also used for spatial tangents (anim.interp.spatial-temporal).
  dependencies: [anim.keyframe.core]
  implementation: >-
    AE-style speed/influence representation stored per keyframe side and converted to a cubic in (time, value) space;
    the evaluator solves the cubic for t with Newton iteration plus bisection fallback (bounded iterations, deterministic).
    Multi-dimensional properties without separated dimensions share one temporal curve on normalized progress.
  io: >-
    Speed/influence storage keeps a future AE keyframe import (proj.aep-interop) lossless where it is attempted.
  limitations: >-
    Influence is clamped to 0.1–100% per side as in AE so curves remain functions of time.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Reached through "Edit animation" → drag the curve handles; most users only use the timing picker presets.
    defaults: >-
      New Bezier keys start as Easy Ease (0 speed, 33.33% influence).
    automation: >-
      Timing presets ("Gentle", "Snappy", "Heavy landing") write matched handle values.
    usability_check: >-
      A user who has completed the guided path makes a move "start fast, land gently" by choosing a preset or dragging one
      handle, in under 45 s.
  acceptance: >-
    AS-1 and mini scene "panel-slam": asymmetric handles; speed graph shows the designed break; export matches preview.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: anim.interp.continuous-bezier
  name: Continuous Bezier interpolation
  sources:
    - ref: S04
      item: "Continuous Bezier interpolation"
      category: "Keyframe interpolation"
      checked: false
  artist_can: >-
    Keep motion smooth through a keyframe by locking incoming and outgoing handles together while still adjusting them.
  projection_example: >-
    A light orb drifts through several points on the facade without a visible kink at each keyframe.
  controls:
    - { name: "Continuous (locked handles)", type: "bool", animatable: false }
    - { name: "Handle direction / speed", type: "float", animatable: false }
  animation: >-
    Applies to temporal and spatial interpolation; converting an auto-Bezier key by dragging its handle makes it continuous.
  dependencies: [anim.interp.bezier]
  implementation: >-
    A per-keyframe flag constraining in/out speed to be equal (temporal) and spatial tangents to be collinear; enforced in
    the keyframe-edit op so the stored data always satisfies the constraint.
  io: >-
    none
  limitations: >-
    none
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "After Effects keyframe or time-tool parity detail that no projection workflow needs now. Basic keyframes, easing, graph editing, looping and time stretch stay required."
  milestone: C
  beginner:
    action: >-
      Reached through "Edit animation" → right-click a keyframe → "Smooth through".
    defaults: >-
      Dragging an automatic key's handle converts it to continuous rather than breaking it.
    automation: >-
      "Smooth this path" recipe step converts sharp keys to continuous.
    usability_check: >-
      A user removes a visible jerk at a mid keyframe in under 30 s using "Smooth through".
  acceptance: >-
    Mini scene "orb-drift": five keys; numerical derivative is continuous at every key within tolerance.
  status: not-started
  evidence: []

- id: anim.interp.auto-bezier
  name: Auto Bezier interpolation
  sources:
    - ref: S04
      item: "Auto Bezier interpolation"
      category: "Keyframe interpolation"
      checked: false
  artist_can: >-
    Let the app choose smooth handles automatically that update whenever neighbouring keyframes change.
  projection_example: >-
    A spotlight's position path stays smooth as the artist drags waypoints to fit different window positions.
  controls:
    - { name: "Auto Bezier", type: "bool", animatable: false }
  animation: >-
    Default for spatial interpolation; available for temporal.
  dependencies: [anim.interp.bezier]
  implementation: >-
    Handles recomputed from neighbour keyframes (Catmull-Rom-style tangent, AE-compatible magnitude) on every edit op, and
    stored, so evaluation never depends on recomputation order.
  io: >-
    none
  limitations: >-
    Exact AE handle magnitudes are approximated; visual parity is the target, not bit equality.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Invisible default for paths; reachable as "Automatic smooth" in the keyframe menu.
    defaults: >-
      Spatial keys created on the canvas are auto Bezier.
    automation: >-
      Handles update automatically as keys move.
    usability_check: >-
      A user drags three motion-path points and never sees a kink or overshoot loop in the path without touching handles.
  acceptance: >-
    Mini scene "spot-waypoints": moving one key updates its neighbours' handles; reopen reproduces identical paths.
  status: not-started
  evidence: []

- id: anim.interp.spatial-temporal
  name: Spatial versus temporal interpolation
  sources:
    - ref: S04
      item: "Spatial and temporal interpolation; Keyframe Interpolation dialog; default spatial interpolation preference"
      category: "Keyframe interpolation"
      checked: false
    - ref: "brief §4"
      item: "temporal versus spatial interpolation"
      category: "Animation engine and graph editor"
      checked: true
  artist_can: >-
    Control the shape of a moving object's path (spatial) separately from its timing along that path (temporal).
  projection_example: >-
    A comet follows a curved arc over the roofline (spatial Bezier) while moving at a steady pace (temporal linear).
  controls:
    - { name: "Spatial interpolation", type: "enum(linear|bezier|continuous-bezier|auto-bezier)", animatable: false }
    - { name: "Temporal interpolation", type: "enum(linear|bezier|continuous-bezier|auto-bezier|hold)", animatable: false }
    - { name: "Default spatial interpolation", type: "enum(linear|auto-bezier)", animatable: false }
  animation: >-
    Spatial interpolation applies to point2d/point3d properties (position, anchor, effect points); temporal applies to all.
  dependencies: [anim.interp.bezier]
  implementation: >-
    Spatial segments are cubic Bezier curves in property space with stored tangents; temporal curves map time to
    arc-length progress, computed with a cached arc-length table (Gauss-Legendre integration) so speed is distance-based.
  io: >-
    none
  limitations: >-
    3D spatial paths use the same model in 3D; quaternion orientation interpolation is handled by the 3D workspace (3d.scene).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Reached through "Edit animation" → path shape (Curved / Straight) and timing picker shown as two separate choices.
    defaults: >-
      Curved path, eased timing.
    automation: >-
      Drawing a path on a surface sets spatial keys; timing presets set temporal only.
    usability_check: >-
      A user straightens a curved path without changing its timing, in under 30 s.
  acceptance: >-
    Mini scene "comet-arc": curved spatial path with linear temporal; measured screen speed is constant within 1%.
  status: not-started
  evidence: []

- id: anim.roving-keyframes
  name: Roving keyframes (constant speed)
  sources:
    - ref: S04
      item: "Roving keyframes; Rove Across Time"
      category: "Keyframe interpolation"
      checked: false
    - ref: "brief §4"
      item: "a light travels around a roofline at constant speed"
      category: "Animation engine and graph editor"
      checked: true
  artist_can: >-
    Let intermediate keyframes slide in time so motion across several points has one smooth, even speed.
  projection_example: >-
    A light travels around an irregular roofline outline at constant speed even though the waypoints are unevenly spaced.
  controls:
    - { name: "Rove across time", type: "bool", animatable: false }
  animation: >-
    Applies to spatial properties; first and last keyframes stay fixed in time.
  dependencies: [anim.interp.spatial-temporal, anim.motion-path]
  implementation: >-
    On each edit op, roving key times are recomputed from cumulative arc length between the fixed endpoints and stored as
    flick times (rounded to the nearest flick); the recompute is part of the op so undo restores prior times exactly.
  io: >-
    none
  limitations: >-
    Roving keys cannot be placed on exact beats; use markers on the fixed keys instead.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Even speed" checkbox in the travel/trace recipes; advanced users toggle "Rove" per keyframe.
    defaults: >-
      On for "Travel along" and "Trace with light" recipes.
    automation: >-
      Recipes that follow a path convert intermediate keys to roving automatically.
    usability_check: >-
      A user makes uneven motion even with one checkbox and confirms it visually in under 20 s.
  acceptance: >-
    AS-1 and mini scene "roofline-runner": 12 uneven waypoints; per-frame travelled distance varies under 1%.
  status: not-started
  evidence: []

- id: anim.separate-dimensions
  name: Separate dimensions
  sources:
    - ref: S04
      item: "Separate Dimensions"
      category: "Graph Editor"
      checked: false
  artist_can: >-
    Split a position into X, Y (and Z) properties so each axis has its own keyframes and curves.
  projection_example: >-
    A ball of light moves steadily across the facade while bouncing vertically on a different rhythm.
  controls:
    - { name: "Separate dimensions", type: "bool", animatable: false }
    - { name: "X position", type: "float", animatable: true }
    - { name: "Y position", type: "float", animatable: true }
    - { name: "Z position", type: "float", animatable: true }
  animation: >-
    Each separated axis is an independent keyframed and expression-capable property.
  dependencies: [anim.keyframe.core, anim.graph-editor]
  implementation: >-
    A property-structure op that converts one vector property into component properties, converting spatial keys to
    per-axis temporal keys (sampling where needed) and back; conversion results are recorded as Immer patches for undo.
  io: >-
    none
  limitations: >-
    Recombining after independent per-axis edits resamples at the union of key times; spatial Bezier tangents are lost and
    the user is told before conversion.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "After Effects keyframe or time-tool parity detail that no projection workflow needs now. Basic keyframes, easing, graph editing, looping and time stretch stay required."
  milestone: C
  beginner:
    action: >-
      Reached through "Edit animation" → "Move across and up/down separately".
    defaults: >-
      Off; "Bounce" recipes turn it on for the vertical axis only.
    automation: >-
      Bounce and drift recipes separate axes automatically when they need independent rhythms.
    usability_check: >-
      A user adds a vertical bounce to an existing horizontal move without breaking the horizontal timing, in under 60 s.
  acceptance: >-
    Mini scene "bouncing-orb": separated axes; recombine warning shown; undo restores original data exactly.
  status: not-started
  evidence: []

- id: anim.easy-ease
  name: Easy Ease, Ease In and Ease Out
  sources:
    - ref: S04
      item: "Easy Ease; Easy Ease In; Easy Ease Out"
      category: "Keyframe interpolation"
      checked: false
    - ref: "brief §4"
      item: "ease-in/out"
      category: "Animation engine and graph editor"
      checked: true
  artist_can: >-
    Make motion start and stop gently with one command, on either side of a keyframe or both.
  projection_example: >-
    Facade panels glide open and come to rest softly instead of starting and stopping abruptly.
  controls:
    - { name: "Ease", type: "enum(easy-ease|ease-in|ease-out)", animatable: false }
    - { name: "Ease strength (influence)", type: "percent", animatable: false }
    - { name: "Timing preset", type: "enum(steady|gentle|snappy|heavy|anticipate)", animatable: false }
  animation: >-
    Writes temporal Bezier handle values to selected keyframes; applies to any animatable property.
  dependencies: [anim.keyframe.core]
  implementation: >-
    An op that sets speed 0 and influence 33.33% (or a preset's values) on the chosen keyframe sides; the temporal-Bezier
    evaluation kernel ships in milestone B with this entry, while full manual handle editing arrives with anim.interp.bezier.
    Timing presets are a small table of speed/influence pairs shared by the recipe engine.
  io: >-
    none
  limitations: >-
    Presets approximate named easing curves; exact CSS-style cubic-bezier curves are entered through the graph editor.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Timing picker on every animation: "Steady", "Gentle", "Snappy", "Heavy", each with an animated thumbnail.
    defaults: >-
      "Gentle" (Easy Ease both sides) for all new guided animations.
    automation: >-
      Recipes choose a timing preset per motion type; changing the preset updates every key the recipe owns.
    usability_check: >-
      A first-time user changes an animation's feel from steady to gentle in two actions or fewer without seeing a graph.
  acceptance: >-
    Mini scene "panel-glide": eased keys; speed is 0 at both keys within tolerance; preset change is one undo step.
  status: not-started
  evidence: []

