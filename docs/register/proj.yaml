- id: proj.import-media
  name: Import video, images, sequences and audio
  sources:
    - ref: S01
      item: "Importing footage (video, still images, image sequences, audio)"
      category: "Importing"
      checked: false
    - ref: "brief §0.6"
      item: "handle media conversion, build proxies"
      category: "User experience"
      checked: true
  artist_can: >-
    Bring in videos, images, numbered image sequences and audio just by dragging them in.
  projection_example: >-
    Drag in a folder of rendered PNG frames, a ProRes clip and a WAV soundtrack in one go.
  controls:
    - { name: "Import", type: "action", animatable: false }
    - { name: "Treat numbered images as a sequence", type: "bool", animatable: false }
    - { name: "Import folder", type: "bool", animatable: false }
    - { name: "Optimize for editing", type: "enum(auto|never|always)", animatable: false }
  animation: >-
    Not animatable.
  dependencies: [proj.project-model]
  implementation: >-
    The FFmpeg sidecar probes streams (size, rate, duration, pixel format, alpha, colour metadata, audio layout). Preview decodes through WebCodecs where it is frame-exact, otherwise through FFmpeg into the frame cache. Numbered files are detected as sequences, and variable-frame-rate or long-GOP sources are offered a background transcode to an intra-frame proxy (preview.proxy).
  io: >-
    Inputs include MOV/MP4 (H.264, HEVC, ProRes, DNxHR, HAP), PNG/JPEG/TIFF/EXR stills and sequences, and WAV/AIFF/MP3/FLAC audio, per tested FFmpeg support; unsupported codecs are reported explicitly.
  limitations: >-
    Variable-frame-rate phone video is conformed to a constant rate (reported). Camera RAW and some proprietary codecs are unsupported unless the FFmpeg build handles them.
  disposition: required-integration
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Drag files anywhere, or use "Add content"; items appear with thumbnails.
    defaults: >-
      Auto-detect sequences; optimize difficult sources in the background.
    automation: >-
      Probes, detects sequences, interprets alpha, frame rate and colour, and builds proxies in the background.
    usability_check: >-
      A first-time user imports a video and a music file and sees both in the show in under 30 s.
  acceptance: >-
    Mini scene "import-matrix": a test media matrix imports with correct metadata and frame-exact decode; AS-4 uses imported footage.
  status: implemented
  evidence:
    - "journey: import-media (picture, video, music copied into project media; beat found 119.9 BPM), video-in-windows (frame-accurate FFmpeg decode, proxy sizes for preview), music-on-timeline (waveform), move-with-beat, audio-preview-sync (picture follows sound clock, 0 ms), export-with-sound (Sound: yes), av-timing-measured (59/59 clicks paired, mean 1 ms, worst 1 frame @30 fps)"
    - "unit: packages/core/test/audio.test.ts (tempo 90/120/128/140 BPM within 2 BPM, beats within 30 ms, downbeat phase, deterministic)"

- id: proj.source-interpretation
  name: Interpret footage (size, timing, looping, colour)
  sources:
    - ref: S01
      item: "Interpret footage items (frame rate, pixel aspect ratio, fields and pulldown, looping, color management)"
      category: "Importing"
      checked: false
    - ref: "brief §3"
      item: "record source dimensions, timing, alpha interpretation, and color space"
      category: "Projects, compositions, assets, and editing"
      checked: true
  artist_can: >-
    See and correct how a file is read: its size, pixel aspect, frame rate, start timecode, fields, colour space and how many times it loops.
  projection_example: >-
    Conform a 25 fps clip to play at 30 fps for the show, or loop a 4-second texture 20 times.
  controls:
    - { name: "Assume frame rate", type: "float", animatable: false }
    - { name: "Pixel aspect ratio", type: "float", animatable: false }
    - { name: "Fields", type: "enum(off|upper-first|lower-first)", animatable: false }
    - { name: "Loop count", type: "int", animatable: false }
    - { name: "Start timecode", type: "time", animatable: false }
    - { name: "Input colour space", type: "enum(auto|srgb|rec709|rec2020|acescg|linear|custom)", animatable: false }
  animation: >-
    Not animatable; the evaluator maps layer time to source frames through these settings.
  dependencies: [proj.import-media]
  implementation: >-
    An interpretation record per asset, stored separately from the probed metadata so changes are reversible. Layer time maps to source frames with exact rational arithmetic in flicks; the input colour space is passed to color.management for the input transform. Deinterlacing uses FFmpeg bwdif.
  io: >-
    Interpretations are saved per asset and travel with collected projects.
  limitations: >-
    Pulldown removal covers standard cadences only; deinterlacing is basic.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Automatic. Each item shows a plain summary such as "1920×1080, 25 fps, 12 s, transparent background", with "Fix" only when something looks wrong.
    defaults: >-
      Probed values; loop once; colour space from metadata.
    automation: >-
      Probes and applies interpretations, and warns once about frame-rate mismatch with the show.
    usability_check: >-
      In the supplied-asset journey, users make 0 manual interpretation corrections.
  acceptance: >-
    Mini scene "interpretation-rates": 23.976, 25, 29.97, 50 and 60 fps sources map frame-exactly into a 30 fps scene.
  status: not-started
  evidence: []

- id: proj.alpha-interpretation
  name: Transparency (alpha) interpretation
  sources:
    - ref: S01
      item: "Alpha channel interpretation (Ignore, Straight-Unmatted, Premultiplied-Matted with color, Guess, Invert Alpha)"
      category: "Importing"
      checked: false
    - ref: "brief §6"
      item: "alpha interpretation"
      category: "Masks, mattes, compositing, and layer styles"
      checked: true
    - ref: "brief §0.10"
      item: "without needing to understand alpha premultiplication"
      category: "User experience"
      checked: true
  artist_can: >-
    Make transparent media composite cleanly without dark or bright fringes; the app works out how transparency was stored and fixes it.
  projection_example: >-
    A logo PNG and a ProRes 4444 smoke clip composite over the facade with no dark halos.
  controls:
    - { name: "Transparency", type: "enum(auto|straight|premultiplied|ignore)", animatable: false }
    - { name: "Premultiplied against colour", type: "color", animatable: false }
    - { name: "Invert alpha", type: "bool", animatable: false }
  animation: >-
    Not animatable.
  dependencies: [proj.import-media]
  implementation: >-
    On decode, sources convert to premultiplied scene-linear rgba16float; straight alpha is premultiplied after linearization, and premultiplied-with-colour sources are unmatted against that colour first. Auto-detect samples edge pixels (colour exceeding alpha implies straight) and uses container metadata when present.
  io: >-
    The export alpha convention comes from the render preset (straight for most codecs) and is written to the render manifest to prevent double premultiplication downstream.
  limitations: >-
    Auto-detection can be wrong on unusual art; the user can override it, and a transparency-check view helps.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Automatic; if fringes are detected, a quick action appears: "Edges look dark? Fix transparency".
    defaults: >-
      Auto.
    automation: >-
      Detects the mode, premultiplies consistently and flags suspicious sources.
    usability_check: >-
      Supplied assets composite with no fringe above the automated edge-difference threshold, and no novice encounters the word "premultiplied".
  acceptance: >-
    Brief §6 acceptance (exported alpha shows no unexplained dark or bright fringes); mini scene "alpha-fringe" with straight, premultiplied and matted test sources.
  status: not-started
  evidence: []

- id: proj.layered-file-import
  name: Layered Photoshop import
  sources:
    - ref: S01
      item: "Import Photoshop files (as composition, retain layer sizes, editable layer styles)"
      category: "Importing"
      checked: false
  artist_can: >-
    Import a layered Photoshop design as a scene with each layer separate, aligned and ready to animate.
  projection_example: >-
    A designer's PSD with each window painted on its own layer becomes 40 animatable layers aligned to the facade.
  controls:
    - { name: "Import as", type: "enum(merged|scene|scene-keep-layer-sizes)", animatable: false }
    - { name: "Editable layer styles", type: "bool", animatable: false }
    - { name: "Text layers as editable text", type: "bool", animatable: false }
  animation: >-
    Imported layers animate like any other; the source PSD can be re-imported to update pixels while keeping animation.
  dependencies: [proj.import-media, proj.composition]
  implementation: >-
    PSD/PSB parsed with ag-psd (MIT) in a worker. Layers become images cropped to their bounds; blend modes map to mask.blend-modes, groups to layer groups or nested scenes, layer masks to masks or alpha, and layer styles to mask.layer-styles where equivalent.
  io: >-
    Reads PSD and PSB; no PSD export.
  limitations: >-
    Smart objects import as pixels; adjustment layers map only where an equivalent effect exists; everything unsupported is listed in an import report.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "After Effects project-management convenience with no projection workflow behind it. Scenes, nesting, layers, trims, replace source, markers, import and AE import stay required."
  milestone: D
  beginner:
    action: >-
      Drag in a PSD and answer one question: "Keep layers separate?"
    defaults: >-
      Scene with layer sizes kept; editable styles on.
    automation: >-
      Aligns layers, maps blend modes and styles, and reports anything unsupported.
    usability_check: >-
      A first-time user imports a 40-layer PSD and animates one window layer in under 2 minutes.
  acceptance: >-
    Mini scene "psd-import-fidelity": the composite of imported layers matches the PSD's flattened preview within tolerance for supported features.
  status: not-started
  evidence: []

- id: proj.asset-browser
  name: Content browser with thumbnails
  sources:
    - ref: S01
      item: "Project panel (folders, thumbnails, columns)"
      category: "Projects"
      checked: false
    - ref: "brief §3"
      item: "thumbnail browsing"
      category: "Projects, compositions, assets, and editing"
      checked: true
    - ref: "brief §0.5"
      item: "animated thumbnails"
      category: "User experience"
      checked: true
  artist_can: >-
    Browse all media, scenes, rigs and saved looks in the project with animated thumbnails, folders and details.
  projection_example: >-
    Hover over a clip thumbnail to scrub through it before dragging it onto a window region.
  controls:
    - { name: "View", type: "enum(grid|list)", animatable: false }
    - { name: "Thumbnail size", type: "int", animatable: false }
    - { name: "Sort / filter", type: "enum(name|kind|date|duration|unused)", animatable: false }
    - { name: "Hover scrub", type: "bool", animatable: false }
    - { name: "New folder", type: "action", animatable: false }
  animation: >-
    Not animatable.
  dependencies: [proj.import-media]
  implementation: >-
    Thumbnails and hover-scrub strips are generated in the background by the FFmpeg sidecar and cached by content hash; scenes are thumbnailed by low-resolution headless renders. The grid is a virtualized React list.
  io: >-
    Thumbnail cache lives outside the project and is rebuildable.
  limitations: >-
    Very long media is sampled for scrub strips rather than fully decoded.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
