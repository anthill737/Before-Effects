- id: proj.scene-from-areas
  name: Scenes built from the same building areas
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "Scenes built from the same areas"
      category: "Scenes and show timeline"
      checked: true
  artist_can: >-
    Build several scenes that all use the same building areas. Each scene decides what plays in each area, but the
    areas (outlines, names, holes, depth) are defined once for the building, so correcting an area updates every
    scene.
  projection_example: >-
    "Intro", "Water" and "Collapse" all use windows 1 to 24 and the roofline. Moving one outline fixes all three
    scenes.
  controls:
    - { name: "Areas used by this scene", type: "list", animatable: false }
    - { name: "Add or remove an area from the scene", type: "action", animatable: false }
    - { name: "Missing-area warnings", type: "view", animatable: false }
  animation: >-
    None specific. Each scene has its own timeline.
  dependencies: [proj.composition, map.region, map.binding, tool.area-assign, mask.area-scene-adjust, ux.scene-timeline]
  implementation: >-
    A scene (composition) references venue areas by id or role through the binding (map.binding). Area assignments
    belong to the scene. The venue is versioned separately, so a scene never copies geometry. A scene warns when an
    area it uses is deleted or its role is unbound, and offers to reassign.
  io: >-
    Scenes reference the venue by id. Exporting a scene alone embeds the area names it needs.
  limitations: >-
    Deleting an area leaves its assignments orphaned until reassigned. The warning lists every scene affected.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Add a scene: it starts with all building areas available. Pick what goes on each.
    defaults: >-
      A new scene lists every area and has no content until you add some.
    automation: >-
      Keeps one shared set of areas and shows which scenes use each area.
    usability_check: >-
      A first-time user adds a second scene and fills the same windows differently in under 2 minutes.
  acceptance: >-
    Mini scene "three-scenes-same-areas": three scenes share the areas; an outline correction reaches all three.
  status: not-started
  evidence: []

- id: proj.scene-save-duplicate
  name: Save an arrangement as a scene; duplicate a scene and swap content
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "Save arrangement as scene; duplicate scene and swap content"
      category: "Scenes and show timeline"
      checked: true
  artist_can: >-
    Save what is currently on the areas as a named scene, duplicate a scene and swap its content (same layout,
    different videos), or turn a scene into a starting template, each in a couple of actions.
  projection_example: >-
    Duplicate "Summer" as "Winter" and replace its three videos. Placement, timing and effects stay.
  controls:
    - { name: "Save arrangement as scene", type: "action", animatable: false }
    - { name: "Duplicate scene", type: "action", animatable: false }
    - { name: "Swap content (list of assets with replace targets)", type: "action", animatable: false }
    - { name: "Save as template", type: "action", animatable: false }
  animation: >-
    Keyframes and timing are copied unchanged.
  dependencies: [proj.scene-from-areas, proj.composition, proj.replace-source, tool.copy-assignment, proj.layer-duplicate, proj.templates]
  implementation: >-
    Duplicate clones the scene's assignments with new ids and shares assets until one is replaced. "Swap content"
    lists the scene's assets with replace targets (proj.replace-source), keeping placement, trim and effects. "Save
    arrangement as scene" snapshots the current assignments as a new composition and can also register it as a
    template (proj.templates).
  io: >-
    Templates are saved in the project or the user template folder.
  limitations: >-
    Swapped content with a different duration changes the loop or trim; the swap list shows the difference.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Right-click a scene: Duplicate, then "Swap content" and choose new files.
    defaults: >-
      Duplicates keep all placement and timing.
    automation: >-
      Lists every asset in the scene once so a single swap updates every area that uses it.
    usability_check: >-
      A first-time user duplicates a scene and swaps two videos in under 1 minute.
  acceptance: >-
    Mini scene "duplicate-and-swap": scene duplicated, three assets swapped, export matches preview.
  status: not-started
  evidence: []

- id: proj.import-atmosfx
  name: AtmosFX and projection-stock media import
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "AtmosFX and other projection media import"
      category: "Media import"
      checked: true
  artist_can: >-
    Bring in AtmosFX-style projection packs and other stock projection media as a library: drop a pack folder in and
    get named, categorised, previewable clips, with loops and black backgrounds handled correctly.
  projection_example: >-
    Drop the "Haunted Windows" pack. It appears under Windows with thumbnails, and a clip is assigned to a window with
    one drag.
  controls:
    - { name: "Pack folder", type: "folder", animatable: false }
    - { name: "Category tags (window, door, wall, full facade)", type: "tag list", animatable: false }
    - { name: "Black means no light (Add blend)", type: "bool", animatable: false }
    - { name: "Loop check", type: "action", animatable: false }
    - { name: "Keep originals in place or copy", type: "enum", animatable: false }
  animation: >-
    None.
  dependencies: [proj.import-media, proj.asset-browser, proj.source-interpretation, tool.area-assign, preview.proxy, fx.keying.unmult, mask.blend.lighten]
  implementation: >-
    Recursive folder import through the standard media pipeline (probe, proxies). A pack index assigns categories from
    folder and file names. Clips on black default to the Add blend mode, with Unmult available. Loop quality (first
    and last frame difference) is computed once and cached. No pack content is bundled with the app, and licence notes
    that ship with a pack are shown.
  io: >-
    Imports MP4, MOV and image sequences. Originals are kept.
  limitations: >-
    Pack naming and formats vary, so the importer reports anything it could not classify. Licensing is the user's.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Drag a pack folder into the content browser.
    defaults: >-
      Clips are sorted into categories and previewed on the building with Add blend if they sit on black.
    automation: >-
      Classifies and makes proxies in the background and reports clips it could not understand.
    usability_check: >-
      A first-time user imports a pack and puts a clip on a window in under 2 minutes.
  acceptance: >-
    Mini scene "pack-import": a pack imports, classifies, loops and exports on a facade.
  status: not-started
  evidence: []

- id: proj.clip-duration-edit
  name: Edit clip and scene-block duration on the timeline
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "Timeline clip duration editing"
      category: "Timeline editing"
      checked: true
  artist_can: >-
    Change how long a clip or scene block lasts by dragging its end or typing a duration, and choose whether that
    trims the media, stretches its speed, loops it, or ripples everything after it. Edges snap to beats, markers and
    the playhead.
  projection_example: >-
    Drag the end of the water scene to the end of the chorus. The ocean clip loops to fill it and the transition moves
    with it.
  controls:
    - { name: "Duration", type: "time", animatable: true }
    - { name: "Edit mode (trim, stretch, loop, ripple)", type: "enum", animatable: false }
    - { name: "Snap to beats and markers", type: "bool", animatable: false }
  animation: >-
    Keyframes on a stretched clip scale with it. On a trimmed clip they stay in place.
  dependencies: [proj.layer-trim, proj.layer-slip, anim.time-stretch, anim.loop, proj.snapping, proj.markers, audio.beat-markers, ux.scene-timeline]
  implementation: >-
    Edge drags and numeric entry emit set-in and set-out operations quantised to the frame grid. A modifier key or
    toolbar mode selects trim, stretch, loop or ripple. On a scene block, the child timeline is clamped or extended
    with a visible notice, and attached transitions are retimed through the recipe that placed them.
  io: >-
    None.
  limitations: >-
    Stretching a video changes speed. Looping a clip with a visible seam shows the seam, and the loop check reports
    it.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Drag the right edge of a clip or block. Hold a key for stretch or ripple.
    defaults: >-
      Trim by default, snapping to beats.
    automation: >-
      Moves attached transitions and reports the new duration.
    usability_check: >-
      A first-time user lengthens a scene to the end of a song section in under 20 s.
  acceptance: >-
    Mini scene "duration-edits": trim, stretch, loop and ripple on clips and a scene block; undo restores exactly.
  status: not-started
  evidence: []
