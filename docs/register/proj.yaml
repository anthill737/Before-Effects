    defaults: >-
      Grid view, auto-folders by kind, hover scrub on.
    automation: >-
      Auto-folders by kind, generates thumbnails, and marks unused items.
    usability_check: >-
      A first-time user finds and places a specific clip among 50 in under 20 s.
  acceptance: >-
    Mini scene "browser-thumbnails": thumbnails for 200 mixed items appear without blocking editing (UI frame time stays within budget).
  status: not-started
  evidence: []

- id: proj.relink
  name: Relink missing media
  sources:
    - ref: S01
      item: "Replace footage / find missing footage"
      category: "Importing"
      checked: false
    - ref: "brief §3"
      item: "relink missing media"
      category: "Projects, compositions, assets, and editing"
      checked: true
  artist_can: >-
    When files have moved, point the show at their new location once and every other missing file is found automatically.
  projection_example: >-
    After copying the show to the venue laptop, choose the new media folder and all 120 clips reconnect.
  controls:
    - { name: "Locate", type: "action", animatable: false }
    - { name: "Search folder", type: "file", animatable: false }
    - { name: "Match by", type: "enum(name|name-and-size|content-hash)", animatable: false }
    - { name: "Relink everything found in folder", type: "bool", animatable: false }
  animation: >-
    Not animatable; layers keep all animation while media is offline.
  dependencies: [proj.import-media, proj.save-reopen]
  implementation: >-
    Asset records store relative path, absolute path, size, duration and content hash. Missing files are searched relative to the project first, then in user-chosen folders; matches are verified by size, probe and optional hash, and relinking is one undoable op.
  io: >-
    Placeholders render as a labelled checkerboard in preview and block export until resolved or explicitly accepted.
  limitations: >-
    Hash matching reads whole files (done in the background); renamed and re-encoded media can only be matched by name, with confirmation.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      An error banner such as "12 files are missing — Find them", then choose a folder.
    defaults: >-
      Match by name and size, searching subfolders.
    automation: >-
      Relative-path resolution and folder-wide matching; placeholders keep layers intact meanwhile.
    usability_check: >-
      A first-time user reconnects all missing files of a moved show in at most 3 actions and under 60 s.
  acceptance: >-
    AS-7 (move a collected project, relink it).
  status: implemented
  evidence:
    - "Find missing files… (Content panel and import report) searches a folder tree by name, copies found media into the show and relinks with its real details; journey step ae-find-missing-files (2 of 3 found, the third still listed), 2026-10-02"

- id: proj.missing-report
  name: Missing fonts, codecs, effects and media report
  sources:
    - ref: S01
      item: "Missing fonts / missing effects / missing footage warnings"
      category: "Projects"
      checked: false
    - ref: "brief §3"
      item: "report missing fonts/codecs"
      category: "Projects, compositions, assets, and editing"
      checked: true
    - ref: "brief §0.9"
      item: "Errors must say what happened, identify the affected item, and offer a practical action"
      category: "User experience"
      checked: true
  artist_can: >-
    Get one clear list of everything missing or unsupported (media, fonts, codecs, effects), with what it affects and how to fix it.
  projection_example: >-
    Opening the show on another PC reports: "Font 'Gotham Bold' missing — used in 3 titles — Substitute or Locate".
  controls:
    - { name: "Show report", type: "action", animatable: false }
    - { name: "Fix (per item)", type: "action", animatable: false }
    - { name: "Substitute font", type: "font", animatable: false }
    - { name: "Accept and ignore", type: "bool", animatable: false }
  animation: >-
    Not animatable.
  dependencies: [proj.relink, text.font-substitution]
  implementation: >-
    On load and before render, a validator walks assets, fonts, effect ids and versions, and decodability (an actual FFmpeg decode test, not an extension check). It emits structured issues {kind, item, affected nodes, suggested ops}, which render verification uses to block exports that would be wrong.
  io: >-
    Issues are included in render logs and in the proj.collect-files report.
  limitations: >-
    Codec support differs by FFmpeg build and hardware decoder; the report states tested results only.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      A single "Needs attention" badge listing items with one-click fixes.
    defaults: >-
      Checked on open and before every export.
    automation: >-
      Detects issues, proposes substitutes and relinks, and re-checks after each fix.
    usability_check: >-
      A first-time user resolves a missing font and a missing clip from the report in under 90 s.
  acceptance: >-
    AS-7; mini scene "missing-everything": a fixture with a missing font, codec, effect and clip lists all four with their affected layers.
  status: implemented
  evidence:
    - "Find missing files… (Content panel and import report) searches a folder tree by name, copies found media into the show and relinks with its real details; journey step ae-find-missing-files (2 of 3 found, the third still listed), 2026-10-02"

- id: proj.collect-files
  name: Collect files (package for another computer)
  sources:
    - ref: S01
      item: "Collect Files / Reduce Project / Remove Unused Footage / Consolidate All Footage"
      category: "Projects"
      checked: false
    - ref: "brief §3"
      item: "collect assets for transfer"
      category: "Projects, compositions, assets, and editing"
      checked: true
  artist_can: >-
    Package the show with all its media, fonts and optional pre-renders into one folder or zip that opens on another computer, optionally dropping unused items.
  projection_example: >-
    Collect the facade show onto a USB drive for the venue's playback laptop.
  controls:
    - { name: "Destination", type: "file", animatable: false }
    - { name: "Include", type: "enum(everything|used-only|selected-scenes)", animatable: false }
    - { name: "Include fonts", type: "bool", animatable: false }
    - { name: "Include pre-renders and proxies", type: "bool", animatable: false }
    - { name: "Zip", type: "bool", animatable: false }
  animation: >-
    Not animatable.
  dependencies: [proj.relink, proj.missing-report]
  implementation: >-
    Uses the dependency graph to compute required assets for the chosen scenes, checks disk space, copies with progress and hash verification, rewrites paths as relative, and writes a report. Reduce and consolidate operate on the collected copy, never the open project.
  io: >-
    Output folder or zip containing the project, media, optional fonts, caches and a report.
  limitations: >-
    Font licences may restrict redistribution; the report lists every copied font so the user can check.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: E
  beginner:
    action: >-
      "Package for another computer" among the export choices.
    defaults: >-
      Used items only; fonts included; zip off.
    automation: >-
      Finds every dependency, checks disk space and verifies the copies.
    usability_check: >-
      A first-time user packages a show and opens it on a second machine with 0 missing items, in at most 4 actions.
  acceptance: >-
    AS-7 (move a collected project, relink it, bind the show to another venue).
  status: not-started
  evidence: []

- id: proj.aep-interop
  name: After Effects project import
  sources:
    - ref: "brief §2"
      item: ".aep round-tripping is a separate compatibility question; do not promise it by implication"
      category: "Define feature completeness"
      checked: true
    - ref: S01
      item: "Projects (.aep)"
      category: "Projects"
      checked: false
  artist_can: >-
    Possibly open simple After Effects projects (scenes, layers, keyframes, masks, shapes, text) as a starting point.
  projection_example: >-
    Bring an older After Effects facade animation in and retarget it to a measured venue.
  controls:
    - { name: "Import After Effects project", type: "action", animatable: false }
    - { name: "Import report", type: "action", animatable: false }
  animation: >-
    If built, keyframes, interpolation and supported expressions would carry over; unsupported items would be listed.
  dependencies: [proj.project-model, proj.composition]
  implementation: >-
    Candidate routes: an ExtendScript exporter run inside an installed copy of After Effects that writes JSON; Lottie (bodymovin) JSON import for shapes and text; or direct parsing of the RIFX binary .aep format. No route is chosen.
  io: >-
    Import only, if pursued; no .aep export.
  limitations: >-
    User 2026-10-02: importing existing After Effects projects and continuing to edit them is REQUIRED; a flattened video does not count. Two routes: (1) an exporter script that runs inside After Effects (needs After Effects installed) for the highest fidelity, and (2) a direct .aep reader for structure, timing and keyframes when After Effects is not available. Every import produces an explicit compatibility report and the original file is never modified. See proj.aep-exporter, proj.aep-reader, proj.aep-report.

    Open question: is After Effects project import wanted at all, and if so through which route (exporter script that needs After Effects installed, Lottie, or binary parsing)? Effect fidelity would be partial, and the brief says not to promise .aep round-tripping.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      If built: "Bring in an After Effects project", followed by a plain report of what came across.
    defaults: >-
      Imports into a new scene; unsupported items listed, never silently dropped.
    automation: >-
      Maps supported items and lists everything skipped.
    usability_check: >-
      If built: a user imports a sample project and understands the skip report in under 2 minutes.
  acceptance: >-
    Decide the disposition with the user; if accepted, mini scene "aep-sample" compares renders of imported fixtures.
  status: implemented
  evidence:
    - "docs/06-after-effects-import.md; packages/aep/test (603/603 corpus files read; 113 reader tests), packages/aep/test/import.test.ts (47 end-to-end), journey steps ae-*, 2026-10-02: .aep read directly without After Effects, imported with a per-item compatibility report; original kept"

- id: proj.aep-exporter
  name: After Effects exporter script (runs inside After Effects)
  sources:
    - ref: S01
      item: Scripting (ExtendScript)
      checked: false
    - ref: brief
      item: User requirement 2026-10-02 (After Effects import)
      checked: true
  artist_can: >-
    Run one script inside After Effects to export a project's compositions, layers, timing, keyframes (with easing), expressions, masks, text, shapes, parenting, cameras, lights, effects and media references for Before Effects.
  projection_example: >-
    Bring last year's After Effects facade show into Before Effects and keep editing it.
  controls:
    - { name: "Collect media", type: bool, animatable: false }
  animation: >-
    Keyframes exported with temporal ease and spatial tangents; expressions exported as source.
  dependencies: [proj.aep-report]
  implementation: >-
    ExtendScript (.jsx) walking the full property tree by matchName and writing versioned JSON; Before Effects maps matchNames to native layers, properties and effects.
  io: >-
    Writes a .bfx-ae.json next to the project; never modifies the .aep.
  limitations: >-
    Requires After Effects to be installed. Third-party effects export their parameters but render only if an equivalent exists; otherwise the report offers a rendered fallback.
  disposition: required-integration
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      File > Import After Effects project; follow the two-step guide.
    defaults: >-
      Collect media on.
    automation: >-
      Converts everything it can and explains the rest.
    usability_check: >-
      A user with After Effects imports a project and finds the compatibility report without help.
  acceptance: >-
    Representative projects reopen with matching timing and keyframes; the report lists every unsupported item.
  status: prototype
  evidence:
    - "tools/ae-exporter/BeforeEffectsExport.jsx; tools/ae-exporter/test/exporter.test.ts runs it against a simulated AE scripting model built from a real AE 2026 export (all 5181 property-tree entries reproduced). Not yet run inside real After Effects (not installed on the build PC)"

- id: proj.aep-reader
  name: Direct .aep reader (no After Effects needed)
  sources:
    - ref: brief
      item: User requirement 2026-10-02 (After Effects import)
      checked: true
  artist_can: >-
    Open an .aep file directly to recover compositions, layers, timing, sources, transforms, keyframes and masks when After Effects is not installed.
  projection_example: >-
    Recover an old project on a machine without After Effects.
  controls:
    - { name: "Import", type: action, animatable: false }
  animation: >-
    Keyframes recovered where the binary layout is understood.
  dependencies: [proj.aep-report]
  implementation: >-
    Reader for the RIFX chunk format (folders, items, compositions, layers, property groups by matchName, keyframe blocks), validated against public sample files.
  io: >-
    Read-only; original untouched.
  limitations: >-
    Reverse-engineered format: coverage is partial and every gap is reported; effects and text may need the exporter route.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      File > Import After Effects project.
    defaults: >-
      none
    automation: >-
      Chooses the best route automatically.
    usability_check: >-
      The report clearly separates transferred, converted, fallback and unsupported items.
  acceptance: >-
    Sample .aep files import with correct composition settings, layer order and timing.
  status: implemented
  evidence:
    - "docs/06-after-effects-import.md; packages/aep/test (603/603 corpus files read; 113 reader tests), packages/aep/test/import.test.ts (47 end-to-end), journey steps ae-*, 2026-10-02: .aep read directly without After Effects, imported with a per-item compatibility report; original kept"

