  artist_can: >-
    Scatter pixels randomly around their position, horizontally, vertically or both, for a grainy, diffused or dissolving look.
  projection_example: >-
    An image dissolves into sandy grain on the wall before the next scene sharpens in.
  controls:
    - { name: "Scatter amount", type: float, animatable: true }
    - { name: "Grain (both, horizontal, vertical)", type: enum, animatable: false }
    - { name: "Randomize every frame", type: bool, animatable: false }
    - { name: "Seed", type: seed, animatable: false }
  animation: >-
    Scatter amount keyframable; per-frame randomization makes it shimmer.
  dependencies: [fx.simulation.deterministic-seeds]
  implementation: >-
    WGSL gather: each pixel reads from an offset of hash(seed, pixel, frame slot if randomized) × amount along the grain axes. Stateless and random-access; the frame slot derives from comp time in flicks, so it is stable at any render order. Bounds expand by the scatter amount.
  io: >-
    none
  limitations: >-
    Per-frame randomization depends on frame rate (a different frame rate gives a different pattern), which is documented.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
