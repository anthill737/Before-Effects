      Reached through the "Carve into stone" recipe → More controls.
    defaults: >-
      Light from the upper left of the audience view, moderate relief, blended over the stone texture.
    automation: >-
      Multiplies the relief over the wall's base colour so it reads as carved rather than grey.
    usability_check: >-
      A first-time user makes a logo look carved into a wall in ≤3 deliberate actions and under 30 s.
