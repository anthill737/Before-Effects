- id: fx.stylize.find-edges
  name: Find Edges
  sources:
    - ref: S02
      item: Find Edges
      category: Stylize
      adobe_support: { gpu: null, bpc: [], mfr: null }
      checked: false
    - ref: S16
      item: Find Edges
      category: Stylize
      checked: false
  artist_can: >-
    Find the edges in an image and show them as lines (dark on light, or bright on dark when inverted), for sketch looks or as the starting point for neon outlines.
  projection_example: >-
    A photo of the facade becomes bright outlines of its own windows and mouldings, which then glow.
  controls:
    - { name: "Invert", type: bool, animatable: false }
    - { name: "Blend with original", type: float, animatable: true }
    - { name: "Source (luma or per channel, product addition)", type: enum, animatable: false }
    - { name: "Edge strength and thickness (product addition)", type: float, animatable: true }
  animation: >-
    Blend and strength keyframable; outlines can fade in.
  dependencies: [proj.effect-stack]
  implementation: >-
    WGSL Sobel gradient magnitude per channel or on luma, normalized against display-encoded values so HDR highlights don't overpower edges; optional dilation for thickness. Stateless with a 1-pixel apron (bounds unchanged; edge-clamp sampling).
  io: >-
    none
  limitations: >-
    Image edges are not architectural edges: noisy textures produce clutter. Clean region outlines come from tool.edge-trace and map.region.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Reached through the "Neon outline" (image source) and "Sketch" recipes → More controls.
    defaults: >-
      Inverted (bright lines on black), luma source, strength auto-normalized.
    automation: >-
      Auto-normalizes strength from the image histogram so outlines are visible without tuning.
    usability_check: >-
      A first-time user turns a photo into bright outlines in ≤3 deliberate actions and under 20 s.
  acceptance: >-
    Mini scene "sketch-facade": export matches preview within tolerance.
  status: not-started
  evidence: []

- id: fx.stylize.glow
  name: Glow
  sources:
    - ref: S02
      item: Glow
      category: Stylize
      adobe_support: { gpu: true, bpc: [8, 16, 32], mfr: null }
      checked: false
    - ref: S16
      item: Glow
      category: Stylize
      checked: false
    - ref: brief §0.1
      item: Trace with light
      category: User experience
      checked: true
  artist_can: >-
    Make the bright parts of a layer, or its alpha shape, glow with a soft halo of chosen size, strength and colour, from subtle bloom to strong neon.
  projection_example: >-
    Light traced around the windows and roofline blooms into a soft halo that spills slightly onto the surrounding stone.
  controls:
    - { name: "Glow based on (color channels, alpha channel)", type: enum, animatable: false }
    - { name: "Glow threshold", type: float, animatable: true }
    - { name: "Glow radius", type: float, animatable: true }
    - { name: "Glow intensity", type: float, animatable: true }
    - { name: "Composite original (on top, behind, none)", type: enum, animatable: false }
    - { name: "Glow operation (blend mode)", type: enum, animatable: false }
    - { name: "Glow colors (original or A and B), color looping, loops, phase, A and B midpoint", type: group, animatable: true }
    - { name: "Color A and color B", type: color, animatable: true }
    - { name: "Glow dimensions (horizontal and vertical, horizontal, vertical)", type: enum, animatable: false }
    - { name: "Mode (classic AE-matching, physical bloom; product addition)", type: enum, animatable: false }
  animation: >-
    Threshold, radius, intensity, colours and phase keyframable, expression-linkable and audio-drivable (glow pulses on beats).
  dependencies: [proj.effect-stack, mask.blend-modes, out.output-mask]
  implementation: >-
    WGSL pass graph: a soft-knee threshold on luminance or alpha in scene-linear rgba16float, then a downsample mip chain with upsample-accumulate (dual-filter or 13-tap) approximating large Gaussians in near-linear time (an exact separable Gaussian for small radii; H/V-only for single dimensions), then optional A/B colour remap with looping, then the chosen blend. The pass declares bounds expansion of about 3× the radius on every side (capped at comp bounds) so halos are never clipped at layer edges; values above 1.0 are preserved for HDR bloom, and 8-bit exports are dithered to avoid banding. Stateless and parallel-safe; a creative glow may spill past objects within the comp, while out.output-mask still stops physical spill.
  io: >-
    none
  limitations: >-
    Classic mode matches AE's look, not its exact pixels. Very large radii at 4K rely on the mip pyramid's approximation. Layer-style Outer/Inner Glow is mask.layer-styles and shares this blur pyramid.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "Make it glow" on any selection, and added automatically by "Trace with light"; first controls are glow size, strength and colour.
    defaults: >-
      Threshold set from the layer's histogram, radius proportional to stroke width or region size, original on top, additive (screen-like) blend.
    automation: >-
      Expands layer bounds automatically, rescales radius on resolution change and adds the glow inside trace and neon recipes.
    usability_check: >-
      A first-time user makes a traced roofline glow and adjusts its size and colour in ≤3 deliberate actions, and no glow is clipped at the layer edges.
  acceptance: >-
    AS-1 (Architectural trace): traced windows and rooflines glow; halos extend past layer bounds without clipping; preview and export match within tolerance with no visible banding.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: fx.stylize.mosaic
  name: Mosaic
  sources:
    - ref: S02
      item: Mosaic
      category: Stylize
      adobe_support: { gpu: null, bpc: [], mfr: null }
      checked: false
    - ref: S16
      item: Mosaic
      category: Stylize
      checked: false
  artist_can: >-
    Pixelate an image into a grid of solid-colour blocks, with block counts that can animate for pixel transitions.
  projection_example: >-
    A scene pixelates into big blocks that line up with the stone coursing, then resolves into the next scene.
  controls:
    - { name: "Horizontal blocks and vertical blocks", type: int, animatable: true }
    - { name: "Sharp colors", type: bool, animatable: false }
    - { name: "Square blocks / block size in pixels (product addition)", type: group, animatable: true }
    - { name: "Grid anchored to region (product addition)", type: bool, animatable: false }
  animation: >-
    Block counts keyframable; a fall-and-rise in block count is the classic pixel transition.
  dependencies: [map.region]
  implementation: >-
    WGSL block-average via compute reduction per cell (or the centre sample when Sharp colors is on), written back as flat blocks; block grid optionally in region UV space so blocks follow the architecture. Stateless; no bounds expansion; averaging in scene-linear.
  io: >-
    none
  limitations: >-
    Non-integer block counts during animation pop between sizes, as in AE; a smooth option cross-fades between adjacent counts.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Stylize filter or CC plug-in clone with no projection workflow behind it. Glow, motion tile, strobe, neon outline and rhythmic flash stay required."
  milestone: C
  beginner:
    action: >-
      "Pixelate" recipe (and the "Pixel transition" transition); first controls are block size and duration.
    defaults: >-
      Square blocks, about 24 across the region, grid anchored to the region.
    automation: >-
      Keys the pixel-in/pixel-out envelope around the cut point.
    usability_check: >-
      A first-time user adds a pixel transition between two scenes in ≤3 deliberate actions and under 20 s.
  acceptance: >-
    Mini scene "pixel-cut": export matches preview; blocks align to the region grid.
  status: not-started
  evidence: []

- id: fx.stylize.motion-tile
  name: Motion Tile
  sources:
    - ref: S02
      item: Motion Tile
      category: Stylize
      adobe_support: { gpu: null, bpc: [], mfr: null }
      checked: false
    - ref: S16
      item: Motion Tile
      category: Stylize
      checked: false
  artist_can: >-
    Repeat a layer as tiles, optionally mirrored at the seams, enlarge the output beyond the layer, and offset alternate rows or columns.
  projection_example: >-
    One brick-pattern loop tiles seamlessly across a long wall; mirrored edges fill gaps when a distortion pulls the image inward.
  controls:
    - { name: "Tile center", type: point2d, animatable: true }
    - { name: "Tile width and tile height", type: float, animatable: true }
    - { name: "Output width and output height", type: float, animatable: true }
    - { name: "Mirror edges", type: bool, animatable: false }
    - { name: "Phase", type: angle, animatable: true }
    - { name: "Horizontal phase shift", type: bool, animatable: false }
  animation: >-
    Tile centre and phase keyframable; animating the centre scrolls a seamless pattern.
  dependencies: [proj.effect-stack]
  implementation: >-
    WGSL UV remap with repeat or mirror-repeat addressing, plus a phase offset on alternate rows or columns. The pass declares bounds expansion equal to the output width/height percentage. Stateless, exact sampling (bicubic when tiles are scaled), and also used internally as edge extension under distortions and blurs.
  io: >-
    none
  limitations: >-
    Seam quality depends on the source; non-seamless sources need mirror edges or a blend (CC RepeTile).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Repeat as pattern" recipe; also applied automatically when a distortion would reveal empty edges.
    defaults: >-
      Tile size from the source, mirror edges on, output large enough to cover the region.
    automation: >-
      Sizes the output to cover the selected region and adds edge extension under distortions without asking.
    usability_check: >-
      A first-time user fills a long wall with a repeating pattern from one clip in ≤3 deliberate actions and under 20 s.
  acceptance: >-
    Mini scene "tiled-wall": no visible seams or edge gaps in export.
  status: not-started
  evidence: []

- id: fx.stylize.posterize
  name: Posterize
  sources:
    - ref: S02
      item: Posterize
      category: Stylize
      adobe_support: { gpu: null, bpc: [], mfr: null }
      checked: false
    - ref: S16
      item: Posterize
      category: Stylize
      checked: false
  artist_can: >-
    Reduce each colour channel to a small number of levels for a flat, screen-printed poster look.
  projection_example: >-
    A video on the facade becomes a four-tone screen-print look that matches a band's album art.
  controls:
    - { name: "Level", type: int, animatable: true }
    - { name: "Quantize in (display, linear, OKLab; product addition)", type: enum, animatable: false }
  animation: >-
    Level keyframable (stepwise), useful for stylized transitions.
  dependencies: [color.management]
  implementation: >-
    WGSL per-channel quantization, floor(v·levels)/(levels−1). By default it runs on display-encoded values so steps look even to artists (scene-linear quantization bunches steps in the darks), and the conversion boundary is declared to the colour pipeline. Stateless; no bounds expansion.
  io: >-
    none
  limitations: >-
    HDR values above 1.0 clamp to the top level; results vary with the chosen quantization space, so the space is recorded with the project.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Stylize filter or CC plug-in clone with no projection workflow behind it. Glow, motion tile, strobe, neon outline and rhythmic flash stay required."
  milestone: C
  beginner:
    action: >-
      "Poster look" recipe; the first control is the number of colours.
    defaults: >-
      4 levels, display-space quantization.
    automation: >-
      Chooses the quantization space automatically from the working colour space.
    usability_check: >-
      A first-time user gives a video a poster look and changes the number of tones in ≤3 deliberate actions and under 15 s.
  acceptance: >-
    Mini scene "screen-print": export matches preview level-for-level.
  status: not-started
  evidence: []

