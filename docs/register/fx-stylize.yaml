- id: fx.stylize.strobe-light
  name: Strobe Light
  sources:
    - ref: S02
      item: Strobe Light
      category: Stylize
      adobe_support: { gpu: null, bpc: [], mfr: null }
      checked: false
    - ref: S16
      item: Strobe Light
      category: Stylize
      checked: false
  artist_can: >-
    Flash a colour over the layer, or make it transparent, at regular or random intervals, with chosen duration, period, probability and blend operation.
  projection_example: >-
    The whole facade flashes white in a regular strobe during a musical build.
  controls:
    - { name: "Strobe color", type: color, animatable: true }
    - { name: "Blend with original", type: float, animatable: true }
    - { name: "Strobe duration and strobe period (seconds or beats)", type: float, animatable: true }
    - { name: "Random strobe probability", type: float, animatable: true }
    - { name: "Strobe (operates on color only, makes layer transparent)", type: enum, animatable: false }
    - { name: "Strobe operator (copy, add, subtract, multiply, difference, screen and others)", type: enum, animatable: false }
    - { name: "Random seed", type: seed, animatable: false }
  animation: >-
    Period, duration and probability keyframable; period can lock to BPM from audio analysis.
  dependencies: [fx.simulation.deterministic-seeds, audio.analysis, mask.blend-modes]
  implementation: >-
    Stateless: whether a strobe is on at time t depends only on floor(t / period) and hash(seed, period index) < probability, evaluated in integer flicks so periods are exact at any frame rate and render order. The flash colour is applied with the chosen operator, or alpha is cut. No bounds expansion.
  io: >-
    none
  limitations: >-
    Fast high-contrast flashing can trigger photosensitive seizures; the app warns when flash frequency exceeds about 3 per second (see fx.stylize.rhythmic-flash).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Reached through the "Flash" and "Flash with the beat" recipes → More controls.
    defaults: >-
      White flash, 1 frame duration, period of one beat when music exists (else 0.5 s).
    automation: >-
      Locks the period to detected BPM and checks the flash rate for safety.
    usability_check: >-
      A first-time user makes a wall flash on every beat in ≤3 deliberate actions and under 20 s.
  acceptance: >-
    Mini scene "beat-strobe": flashes land on the same frames in preview and export.
  status: not-started
  evidence: []

