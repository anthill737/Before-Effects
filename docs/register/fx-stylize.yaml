  name: CC RepeTile
  sources:
    - ref: S02
      item: CC RepeTile
      category: Stylize
      adobe_support: { gpu: null, bpc: [], mfr: null }
      checked: false
    - ref: S16
      item: CC RepeTile
      category: Stylize
      checked: false
  artist_can: >-
    Extend a layer beyond its edges in any direction by repeating it with tiling styles (repeat, mirror/unfold, brick, checker flip) and blended borders.
  projection_example: >-
    One window-sized animation is extended to cover an entire floor of windows without a seam.
  controls:
    - { name: "Expand right, left, down, up", type: int, animatable: true }
    - { name: "Tiling (repeat, unfold, brick, checker flip and others)", type: enum, animatable: false }
    - { name: "Blend borders", type: float, animatable: true }
  animation: >-
    Expansion amounts and border blend keyframable (a pattern can grow outward).
  dependencies: [fx.stylize.motion-tile]
  implementation: >-
    WGSL tiled lookup with mirror, brick-offset and checker-flip addressing, cross-fading within a seam band for blend borders. The pass declares bounds expansion equal to the four expand values. Stateless.
  io: >-
    none
  limitations: >-
    Shares addressing code with Motion Tile but stays separate because it expands bounds per side and blends seams.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Stylize filter or CC plug-in clone with no projection workflow behind it. Glow, motion tile, strobe, neon outline and rhythmic flash stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Repeat as pattern" recipe → "Extend beyond edges".
    defaults: >-
      Expand to cover the selected region, unfold tiling, small border blend.
    automation: >-
      Computes the expansion needed to cover the target region.
    usability_check: >-
      A first-time user extends one clip to cover a wider region without seams in ≤3 deliberate actions and under 20 s.
  acceptance: >-
    Mini scene "window-row": no seams or clipping in export.
  status: not-started
  evidence: []

