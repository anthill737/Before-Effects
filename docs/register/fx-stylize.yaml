  dependencies: [fx.noise-grain.fractal-noise, fx.simulation.deterministic-seeds, mask.bezier]
  implementation: >-
    WGSL: a jump-flood signed distance field from the layer alpha, offset by seeded fractal noise (the same kernel as fx.noise-grain.fractal-noise, with loopable evolution), thresholded with edge sharpness into new alpha, plus a coloured band for the colour, rusty and photocopy types. Stateless (evolution is a function of time); bounds expand by the border width.
  io: >-
