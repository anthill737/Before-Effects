- id: fx.stylize.cc-vignette
  name: CC Vignette
  sources:
    - ref: S02
      item: CC Vignette
      category: Stylize
      adobe_support: { gpu: null, bpc: [], mfr: null }
      checked: false
    - ref: S16
      item: CC Vignette
      category: Stylize
      checked: false
  artist_can: >-
    Darken (or lighten) the image toward its edges like a lens vignette, with amount, angle of view, centre and highlight protection.
  projection_example: >-
    Content softly darkens toward the edges of a stage backdrop so it doesn't end in a hard rectangle.
  controls:
    - { name: "Amount", type: float, animatable: true }
    - { name: "Angle of view", type: angle, animatable: true }
    - { name: "Center", type: point2d, animatable: true }
    - { name: "Pin highlights", type: float, animatable: true }
    - { name: "Shape from region edges (product addition)", type: bool, animatable: false }
  animation: >-
    All values keyframable.
  dependencies: [map.region, out.output-mask]
  implementation: >-
    WGSL radial falloff (cos⁴-style by angle of view) multiplying colour in scene-linear, with pin highlights protecting bright pixels; the product option derives falloff from a region-edge distance field so the vignette follows the surface shape. Stateless; no bounds expansion.
  io: >-
    none
  limitations: >-
    A creative vignette, not an output-edge feather; physical edge softening belongs to out.output-mask and out.edge-blend.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Stylize filter or CC plug-in clone with no projection workflow behind it. Glow, motion tile, strobe, neon outline and rhythmic flash stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Soft edges" look → More controls.
    defaults: >-
      Moderate amount, centred on the region, shape from region edges.
    automation: >-
      Centres on the selected region and fits the falloff to its shape.
    usability_check: >-
      A first-time user softens content toward a region's edges in ≤3 deliberate actions and under 15 s.
  acceptance: >-
    Mini scene "soft-backdrop": export matches preview within tolerance.
  status: not-started
  evidence: []

- id: fx.stylize.neon-outline
  name: Neon outline
  sources:
    - ref: brief §11E
      item: Neon outlines
      category: Stylization
      checked: true
    - ref: brief §0.1
      item: Click a roofline, choose Trace with light
      category: User experience
      checked: true
  artist_can: >-
    Turn region edges, drawn paths, text or detected image edges into glowing neon tubes with a white-hot core, a coloured halo, flicker and a power-on animation.
  projection_example: >-
    Every window frame becomes pink neon that flickers on one window after another, then buzzes in time with the bass.
  controls:
    - { name: "Source (region outlines, paths, text, detected image edges)", type: enum, animatable: false }
    - { name: "Tube width", type: float, animatable: true }
    - { name: "Core color and glow color", type: color, animatable: true }
    - { name: "Glow size and intensity", type: float, animatable: true }
    - { name: "Flicker amount and seed", type: group, animatable: true }
    - { name: "Power-on order, delay and duration", type: group, animatable: true }
    - { name: "Edge-detection threshold (image source)", type: float, animatable: true }
    - { name: "Darken background", type: float, animatable: true }
  animation: >-
    Every value keyframable, with flicker and brightness audio-drivable. Power-on is a trim-path and sequence animation on the generated strokes.
  dependencies: [tool.edge-trace, tool.sequence-light-up, fx.stylize.glow, fx.stylize.find-edges, fx.stylize.threshold, shape.path, map.region, audio.analysis, ux.recipe-engine, fx.simulation.deterministic-seeds]
  implementation: >-
    A recipe that generates real items: region outlines or traced paths become CanvasKit round-capped strokes, with a narrow near-white core over a wider coloured stroke, then fx.stylize.glow in physical-bloom mode with two radii, then a seeded flicker (stateless hash per tube per time slot), with the power-on sequence handled by tool.sequence-light-up. Image sources go through Find Edges, Threshold and thinning first. Bounds come from Glow's declared expansion; brightness above 1.0 drives the bloom.
  io: >-
    none
  limitations: >-
    Image-edge sources are noisy compared with region or traced paths. Neon brightness is limited by the projector, not the comp; on a lit facade the halo reads weaker than on screen.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Neon outline": select regions (or click a roofline), choose the recipe, then pick colour, thickness and how it switches on.
    defaults: >-
      Pink core-and-halo neon, tube width from the output resolution, slight flicker, windows power on left to right with a 0.15 s delay.
    automation: >-
      Traces the region outlines, builds strokes, glow, flicker and the sequence, and orders regions by position.
    usability_check: >-
      A first-time user turns all selected windows into neon outlines that switch on one after another in ≤3 deliberate actions and under 45 s.
  acceptance: >-
    AS-1 variant "neon-windows": strokes stay on the region edges after rebinding, glow is unclipped, and flicker is identical in preview and export.
  status: not-started
  evidence: []

- id: fx.stylize.stained-glass
  name: Stained glass
  sources:
    - ref: brief §11E
      item: Stained-glass looks
      category: Stylization
      checked: true
    - ref: brief §1
      item: Brick changes into glass or glowing patterns
      category: What the product must enable
      checked: true
  artist_can: >-
    Turn a surface into stained glass: the image splits into cells (random, hexagonal, or following the real window mullions), each filled with a rich colour, separated by dark lead lines and glowing as if backlit.
  projection_example: >-
    The arched windows fill with stained glass whose lead lines sit on the real mullions, brightening as a "sunrise" sweeps across.
  controls:
    - { name: "Cell source (Voronoi, hexagons, region mullions, custom paths)", type: enum, animatable: false }
    - { name: "Cell size and irregularity", type: float, animatable: true }
    - { name: "Lead line width and color", type: group, animatable: true }
    - { name: "Cell color (from image, palette, posterized)", type: enum, animatable: false }
    - { name: "Saturation and palette", type: group, animatable: true }
    - { name: "Glass texture amount", type: float, animatable: true }
    - { name: "Backlight glow and light sweep", type: group, animatable: true }
    - { name: "Seed", type: seed, animatable: false }
  animation: >-
    Backlight, light sweep, saturation and texture keyframable; cells can light up in sequence via per-cell order.
  dependencies: [fx.generate.cell-pattern, fx.stylize.posterize, fx.stylize.glow, fx.stylize.cc-glass, fx.noise-grain.fractal-noise, map.region, tool.sequence-light-up, ux.recipe-engine, fx.simulation.deterministic-seeds]
  implementation: >-
    A recipe plus one dedicated WGSL pass that builds a cell-ID map from seeded Voronoi (jump-flood) or rasterized region/path polygons, averages colour per cell (compute reduction) or quantizes it in OKLab, and draws anti-aliased lead lines from cell-ID boundaries. Glass texture comes from fractal-noise bumps through the CC Glass bump-shade pass, and the backlight from Glow. Cells live in region UV space so they stay on the building; stateless and seeded.
  io: >-
    none
  limitations: >-
    "Following the mullions" needs the mullions drawn as regions or paths; it is not detected automatically from a photo.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Stylize filter or CC plug-in clone with no projection workflow behind it. Glow, motion tile, strobe, neon outline and rhythmic flash stay required."
  milestone: D
  beginner:
    action: >-
      "Stained glass": select windows or a wall, choose the recipe, adjust cell size, colours and glow.
    defaults: >-
      Region mullions as lead lines when available, otherwise Voronoi cells sized to about 15 across; jewel-tone palette; soft backlight.
    automation: >-
      Uses the drawn mullion paths automatically, picks a palette from the content, and adds the glass texture and glow.
    usability_check: >-
      A first-time user turns selected arched windows into glowing stained glass in ≤3 deliberate actions and under 45 s.
  acceptance: >-
    Mini scene "rose-glass": lead lines align with region mullions; cells stable across seek and reopen.
  status: not-started
  evidence: []

- id: fx.stylize.rhythmic-flash
  name: Rhythmic flashes
  sources:
    - ref: brief §11E
      item: Rhythmic flashes
      category: Stylization
      checked: true
    - ref: brief §13
      item: Beat markers, BPM grid, onset detection, frequency-band control signals
      category: Sound and music-driven animation
      checked: true
  artist_can: >-
    Flash regions or the whole show on the music: full-white hits, colour pops, or chases across windows, controlling intensity, decay and which beats trigger.
  projection_example: >-
    On every kick all windows flash white and decay; on the snare the columns flash red in alternation.
  controls:
    - { name: "Trigger (beats, bars, onsets, frequency band, markers, fixed rate)", type: enum, animatable: false }
    - { name: "Pattern (every beat, every 2nd, custom steps)", type: enum, animatable: false }
    - { name: "Flash color and intensity", type: group, animatable: true }
    - { name: "Attack and decay", type: float, animatable: true }
    - { name: "Targets and order (all, chase, alternate, random)", type: group, animatable: false }
    - { name: "Blend mode", type: enum, animatable: false }
    - { name: "Safety limit (max flashes per second, contrast)", type: group, animatable: false }
  animation: >-
    Intensity, decay and colour keyframable. Triggers come from cached audio analysis, so preview and export flash on identical frames.
  dependencies: [audio.analysis, audio.to-keyframes, fx.stylize.strobe-light, tool.sequence-light-up, map.region, expr.engine, ux.recipe-engine, fx.simulation.deterministic-seeds]
  implementation: >-
    A recipe that generates real items: cached beat and onset lists from audio.analysis feed a stateless envelope expression, e(t) = Σ over the last few triggers before t of attack/decay curves, which drives solid or Strobe Light opacity per region. Chases use tool.sequence-light-up and random target choice uses hash(seed, trigger index). A photosensitivity check scans rendered luminance for more than 3 general flashes in any 1 s window (WCAG 2.3.1 style) and warns before export or show, with an override for private tests.
  io: >-
    none
  limitations: >-
    The safety check is a warning tool, not a certified photosensitive-epilepsy analysis. Beat accuracy depends on the analysis; users can nudge triggers on the timeline.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Flash with the beat": select regions, choose the recipe, then pick which beats, the colour and how fast it fades.
    defaults: >-
      Every beat, white, 0.25 s decay, all selected regions together, safety limit on.
    automation: >-
      Analyzes the music, places triggers, builds the envelopes and flags unsafe flash rates with a one-click "make safer" fix.
    usability_check: >-
      A first-time user makes selected windows flash on each beat of the added music in ≤3 deliberate actions and under 30 s.
  acceptance: >-
    Mini scene "beat-windows": flashes land on identical frames in preview and export; a 5 Hz pattern triggers the safety warning.
  status: not-started
  evidence: []
