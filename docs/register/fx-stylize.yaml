# Stylize — Before Effects capability register
# Sources: S02 (effect list + support matrix), S16 (Stylize effects), brief §0, §1, §11E, §13, §14, §19, §22. Live helpx.adobe.com pages returned HTTP 403 (bot block) on 2026-10-01 for all regional variants; category membership was cross-checked via search-engine listings of S16 and Contour Paint controls via Adobe's community beta announcement, but Adobe items were authored from prior knowledge (checked: false) and adobe_support values are best-known, not matrix-verified.

- id: fx.stylize.brush-strokes
  name: Brush Strokes
  sources:
    - ref: S02
      item: Brush Strokes
      category: Stylize
      adobe_support: { gpu: null, bpc: [8], mfr: null }
      checked: false
    - ref: S16
      item: Brush Strokes
      category: Stylize
      checked: false
  artist_can: >-
    Give an image a rough painted look made of directional brush strokes with a chosen size, length, density and randomness.
  projection_example: >-
    The projected scene turns into an impressionist painting across the facade for a gallery-night show.
  controls:
    - { name: "Stroke angle", type: angle, animatable: true }
    - { name: "Brush size, stroke length, stroke density", type: float, animatable: true }
    - { name: "Stroke randomness", type: float, animatable: true }
    - { name: "Paint surface (on original, transparent, white, black)", type: enum, animatable: false }
    - { name: "Blend with original", type: float, animatable: true }
    - { name: "Stroke anchoring (screen or region space, product addition)", type: enum, animatable: false }
  animation: >-
    All numeric controls keyframable; animating Blend with original fades the painted look in.
  dependencies: [fx.simulation.deterministic-seeds, map.region]
  implementation: >-
    Stateless WGSL stroke splatting: stroke centres on a jittered grid (density) with hash(seed, cell) randomness, each drawn as an oriented soft elongated quad coloured from the source at its centre and accumulated in rgba16float, then composited per paint-surface mode. Strokes are fixed in screen space (or in region UV space when anchored) so they don't boil frame to frame. Bounds expand by half the stroke length.
  io: >-
    none
  limitations: >-
    Screen-anchored strokes "shower-door" over moving footage; region anchoring fixes this for content moving with the building but not for camera moves inside footage.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Stylize filter or CC plug-in clone with no projection workflow behind it. Glow, motion tile, strobe, neon outline and rhythmic flash stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Painted look" recipe → More controls.
    defaults: >-
      Brush size scaled to output resolution, strokes anchored to the region, angle 135°, moderate randomness.
    automation: >-
      Scales brush size with resolution changes and anchors strokes to the selected region.
    usability_check: >-
      A first-time user turns a selected scene into a painted look and makes the strokes bigger in ≤3 deliberate actions and under 30 s.
  acceptance: >-
    Mini scene "painted-facade": export matches preview within tolerance; strokes stay stable across frames.
  status: not-started
  evidence: []

- id: fx.stylize.cartoon
  name: Cartoon
  sources:
    - ref: S02
      item: Cartoon
      category: Stylize
      adobe_support: { gpu: null, bpc: [], mfr: null }
      checked: false
    - ref: S16
      item: Cartoon
      category: Stylize
      checked: false
  artist_can: >-
    Make footage look hand-drawn: simplify detail, flatten shading into a few tones and add ink-like edge lines.
  projection_example: >-
    Live-action footage of dancers becomes a comic-book animation on the theatre wall.
  controls:
    - { name: "Render (fill, edges, fill and edges)", type: enum, animatable: false }
    - { name: "Detail radius and detail threshold", type: float, animatable: true }
    - { name: "Fill (shading steps, shading smoothness)", type: group, animatable: true }
    - { name: "Edge (threshold, width, softness, opacity)", type: group, animatable: true }
    - { name: "Advanced (edge enhancement, edge black level, edge contrast)", type: group, animatable: true }
  animation: >-
    All values keyframable; edge width and shading steps are common animation targets.
  dependencies: [proj.effect-stack]
  implementation: >-
    WGSL pass graph: an edge-preserving bilateral smooth (separable approximation, detail radius and threshold), then luminance quantized into shading steps with smoothstep softness, then Sobel/DoG edges on the smoothed luma with threshold, width and softness, then composite. Luma is computed on display-encoded values to match artist expectations, while colour stays scene-linear. Stateless; no bounds expansion.
  io: >-
    none
  limitations: >-
    Per-frame filtering can shimmer on noisy footage; denoise first or raise detail threshold.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Stylize filter or CC plug-in clone with no projection workflow behind it. Glow, motion tile, strobe, neon outline and rhythmic flash stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Cartoon look" recipe → More controls.
    defaults: >-
      Medium detail radius, 6 shading steps, thin dark edges.
    automation: >-
      Suggests a denoise pre-pass when footage noise is detected.
    usability_check: >-
      A first-time user gives a video a cartoon look and thickens its outlines in ≤3 deliberate actions and under 30 s.
  acceptance: >-
    Mini scene "comic-dancers": export matches preview within tolerance.
  status: not-started
  evidence: []

- id: fx.stylize.color-emboss
  name: Color Emboss
  sources:
    - ref: S02
      item: Color Emboss
      category: Stylize
      adobe_support: { gpu: null, bpc: [], mfr: null }
      checked: false
    - ref: S16
      item: Color Emboss
      category: Stylize
      checked: false
  artist_can: >-
    Sharpen edges into a raised, lit relief while keeping the image's colours.
  projection_example: >-
    A projected mural looks carved into the stone yet keeps its colours.
  controls:
    - { name: "Direction", type: angle, animatable: true }
    - { name: "Relief", type: float, animatable: true }
    - { name: "Contrast", type: float, animatable: true }
    - { name: "Blend with original", type: float, animatable: true }
  animation: >-
    All controls keyframable; animating direction makes the light appear to move.
  dependencies: [fx.stylize.emboss]
  implementation: >-
    Shares the Emboss WGSL pass: a directional difference between each pixel and its neighbour at relief distance along the chosen angle, scaled by contrast and added to the original colour (hue preserved). Stateless; bounds expand by the relief distance.
  io: >-
    none
  limitations: >-
    A 2D image-space relief, not real lighting of the venue model (see 3d.light).
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Stylize filter or CC plug-in clone with no projection workflow behind it. Glow, motion tile, strobe, neon outline and rhythmic flash stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Carve into stone" recipe → "Keep colour" option.
    defaults: >-
      Light from the upper left of the audience view, moderate relief.
    automation: >-
      Sets direction from the scene's main light when one exists.
    usability_check: >-
      A first-time user makes a colourful image look carved in under 30 s with one option change.
  acceptance: >-
    Mini scene "carved-mural": export matches preview within tolerance.
  status: not-started
  evidence: []

- id: fx.stylize.contour-paint
  name: Contour Paint
  sources:
    - ref: S02
      item: Contour Paint
      category: Stylize
      adobe_support: { gpu: null, bpc: [], mfr: null }
      checked: false
    - ref: S16
      item: Contour Paint
      category: Stylize
      checked: false
  artist_can: >-
    Smear the image along its contours like finger-painting and reduce it to flat, hand-drawn colour fills, from print-like graphics to strong abstraction.
  projection_example: >-
    A video of waves becomes a flowing, poster-like painting on a museum facade.
  controls:
    - { name: "View (final result, edge map)", type: enum, animatable: false }
    - { name: "Stylization and cleanliness", type: float, animatable: true }
    - { name: "Smear iterations", type: int, animatable: true }
    - { name: "Apply to alpha", type: bool, animatable: false }
    - { name: "Draw color fills (none, over smeared image, only)", type: enum, animatable: false }
    - { name: "Reduction method (k-means, median, nearest custom color)", type: enum, animatable: false }
    - { name: "Posterization level and custom color set", type: group, animatable: true }
    - { name: "Limit fills by edge strength", type: float, animatable: true }
    - { name: "Flow map edits (offset angles, quantize angles, freehand flow strokes)", type: group, animatable: true }
    - { name: "External edge map layer", type: layer, animatable: false }
    - { name: "Lock palette from a reference frame (product addition)", type: bool, animatable: false }
  animation: >-
    Stylization, cleanliness, iterations, palette and flow offsets keyframable.
  dependencies: [fx.stylize.posterize, fx.stylize.find-edges, shape.path]
  implementation: >-
    WGSL pass graph: a Gaussian-smoothed structure tensor gives an edge-tangent flow field, and the image is smeared by iterated flow-guided line-integral convolution (ping-pong rgba16float, one pass per iteration). Colours are reduced by palette quantization in OKLab (k-means or median-cut on a downsampled frame in compute, or nearest custom colour); freehand flow edits are stored as vector strokes rasterized into an angle-offset map. Per-frame palettes can flicker, so "Lock palette" keeps it stateless and stable; bounds are unchanged.
  io: >-
    none
  limitations: >-
    Adobe introduced this effect in After Effects Beta 27.0 (build 6+), and its controls were taken from Adobe's beta announcement; confirm the shipping control set when S16 can be read. The algorithm is proprietary, so the equivalent targets the look. Freehand flow edits are static and need tracking for moving footage.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Stylize filter or CC plug-in clone with no projection workflow behind it. Glow, motion tile, strobe, neon outline and rhythmic flash stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Painted poster" recipe → More controls.
    defaults: >-
      Medium stylization, 20 smear iterations, 8 k-means colours with palette locked.
    automation: >-
      Picks the palette from the first frame and locks it to prevent flicker.
    usability_check: >-
      A first-time user turns a video into a flat poster-paint look and changes the colour count in ≤3 deliberate actions and under 30 s.
  acceptance: >-
    Mini scene "poster-waves": no palette flicker over 10 s with lock on; export matches preview.
  status: not-started
  evidence: []

