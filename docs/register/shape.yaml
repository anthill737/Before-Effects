- id: shape.path-morph
  name: Path animation and morphing
  sources:
    - ref: S08
      item: "Path keyframes, First Vertex"
      category: "Shapes and shape attributes"
      checked: false
    - ref: "brief §7"
      item: "path animation and morphing; morph the outlines into another pattern"
      category: "Vector shapes, paths and drawing"
      checked: true
  artist_can: >-
    Animate a path from one outline to a completely different one, even with different point counts or numbers of
    contours, and control which points travel to which.
  projection_example: >-
    Repeated window outlines morph into a lattice of diamonds, then into circles, staying on the facade grid.
  controls:
    - { name: "Path keyframes", type: "path", animatable: true }
    - { name: "First vertex", type: "int", animatable: false }
    - { name: "Correspondence", type: "enum(auto-arc-length|by-index|manual-pairs)", animatable: false }
    - { name: "Morph path direction", type: "enum(auto|keep)", animatable: false }
    - { name: "Morph to shape", type: "action", animatable: false }
  animation: >-
    Path keyframes interpolate with temporal easing from the graph editor; correspondence is stored per keyframe pair.
  dependencies: [shape.path, anim.keyframe.core]
  implementation: >-
    At keyframe-pair creation, core resamples both outlines by arc length to a shared vertex count, aligns starting
    points by minimizing travel distance, and matches contour counts by splitting or collapsing contours to points.
    The prepared pair is cached, so per-frame interpolation is a cheap vertex lerp.
  io: >-
    Interpolated shapes export as baked geometry; morph pairs are saved in the project.
  limitations: >-
    After Effects needs matching vertex order (or adds vertices) and has no contour matching; automatic
    correspondence is a product addition and can twist on complex shapes, so manual first-vertex and pairs are
    available.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Morph into" — select outlines, pick a target shape or draw one, set duration.
    defaults: >-
      Automatic correspondence with minimal-travel alignment; 1.5 s with easy ease.
    automation: >-
      Vertex counts and contours are matched automatically; twisting is detected and the start point re-aligned.
    usability_check: >-
      A first-time user morphs a window outline into a circle with no visible twisting in under 45 s.
  acceptance: >-
    AS-1 and mini scene "window-to-diamond": 24 morphing outlines render identically in preview and export.
  status: not-started
  evidence: []

- id: shape.path-snapping
  name: Path snapping and numeric vertex editing
  sources:
    - ref: S01
      item: "Snapping (layer edges, vertices, paths)"
      category: "Drawing, painting and paths"
      checked: false
    - ref: "brief §7"
      item: "snapping, numeric editing"
      category: "Vector shapes, paths and drawing"
      checked: true
    - ref: "brief §0.6"
      item: "path snapping"
      category: "Automate tedious preparation"
      checked: true
  artist_can: >-
    Snap path points to region edges and corners, guides, grids and other paths while drawing, and type exact vertex
    and tangent values when precision matters.
  projection_example: >-
    Drawing a column outline clicks onto the column region's corners so the light line sits exactly on the stone edge.
  controls:
    - { name: "Snap to", type: "enum(region-corners|region-edges|paths|guides|grid|layer-bounds)", animatable: false }
    - { name: "Snap radius (screen px)", type: "float", animatable: false }
    - { name: "Vertex X/Y", type: "point2d", animatable: true }
    - { name: "In/out tangent", type: "point2d", animatable: true }
    - { name: "Temporarily disable snapping (hold key)", type: "action", animatable: false }
  animation: >-
    Numeric edits at the current time create or update path keyframes like any other edit.
  dependencies: [shape.path, proj.snapping, proj.guides-grids, map.region]
  implementation: >-
    A spatial index (uniform grid or R-tree) of snap targets in comp space, including region outlines projected from
    map.region into the comp, queried on pointer move with a screen-space radius; numeric fields edit vertices via
    the same typed ops.
  io: >-
    none
  limitations: >-
    Region snapping depends on how accurately regions were drawn or calibrated; snapping cannot fix a misaligned venue model.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Snapping is on by default while drawing; a magnet toggle and highlighted snap targets show what will be hit.
    defaults: >-
      Snap to region corners and edges first, then paths and guides; 10 px screen radius.
    automation: >-
      Highlights the nearest snap candidate and shows its name (e.g. "Window 3 — top-left corner").
    usability_check: >-
      A first-time user outlines four windows with every corner within 1 px of the region corners in under 2 min.
  acceptance: >-
    Mini scene "snap-columns": snapped paths coincide with region outlines in the projector preview.
  status: not-started
  evidence: []

- id: shape.resolution-independence
  name: Vector sharpness at export resolution
  sources:
    - ref: S01
      item: "Continuously Rasterize (shape and vector layers)"
      category: "Layers"
      checked: false
    - ref: "brief §7"
      item: "Preserve vector sharpness at export resolution"
      category: "Vector shapes, paths and drawing"
      checked: true
  artist_can: >-
    Scale shapes, text and imported vectors to any size in any comp or nested comp and still get crisp edges at the
    final output resolution.
  projection_example: >-
    A logo designed small is scaled up across a 12 m facade on a 4K projector with no soft or stepped edges.
  controls:
    - { name: "Antialiasing quality", type: "enum(draft|analytic|msaa-8x)", animatable: false }
    - { name: "Rasterize at output resolution", type: "bool", animatable: false }
  animation: >-
    Not animatable; applies at every frame and scale.
  dependencies: [shape.layer]
  implementation: >-
    Vector layers are rasterized after full transform concatenation at the output pixel density, through nested comps
    when transforms are collapsed; GPU analytic AA or 8x MSAA; caches keyed by effective resolution so a zoomed
    preview never reuses a low-resolution bitmap for export.
  io: >-
    Export at any resolution re-rasterizes vectors; imported vector files stay vector (shape.vector-import).
  limitations: >-
    Effects that need pixels (blur, glow) rasterize at the effect stage; order follows the documented
    continuous-rasterization rules, and a non-collapsed nested comp rasterizes at its own resolution.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Automatic: no user action; the inspector warns "This layer will look soft at export" when a nested comp limits sharpness.
    defaults: >-
      Rasterize at output resolution on; analytic AA.
    automation: >-
      Detects scale-up through non-collapsed nests and offers a one-click fix.
    usability_check: >-
      A first-time user exports a scaled-up vector logo at 4K and finds no soft edges, with no setting changes.
  acceptance: >-
    AS-1 and mini scene "logo-scale": edge sharpness of a 10x scaled vector matches a natively sized reference in 4K export.
  status: not-started
  evidence: []

- id: shape.vector-import
  name: Vector import (SVG, AI, PDF) to editable shapes
  sources:
    - ref: S01
      item: "Import Illustrator/PDF files; Create Shapes from Vector Layer"
      category: "Importing and interpreting footage"
      checked: false
    - ref: "brief §7"
      item: "usable vector import"
      category: "Vector shapes, paths and drawing"
      checked: true
  artist_can: >-
    Bring in logos and line art from SVG, Illustrator or PDF files and turn them into editable, animatable shape
    layers with their groups, fills, strokes and gradients intact.
  projection_example: >-
    Import the client's SVG logo, then trim-path its outlines so it draws itself onto the facade.
  controls:
    - { name: "File", type: "file", animatable: false }
    - { name: "Import as", type: "enum(editable-shapes|vector-footage|one-layer-per-group)", animatable: false }
    - { name: "Artboard / page", type: "int", animatable: false }
    - { name: "Text handling", type: "enum(outlines|text-layers)", animatable: false }
    - { name: "Create shapes from vector layer", type: "action", animatable: false }
  animation: >-
    Imported shapes animate like any shape layer.
  dependencies: [shape.layer, shape.path, proj.import-media]
  implementation: >-
    SVG is parsed in-process into the native path model: path data (arcs converted to cubics), basic shapes, groups and
    transforms, fill/stroke with dash and caps, linear/radial gradients, opacity, viewBox; clip paths become masks.
    AI (PDF-compatible) and PDF are read through PDF.js operator lists (paths, fills, strokes, colour spaces) with
    CMYK converted via color.management.
  io: >-
    Imports SVG, AI (PDF-compatible save) and PDF. Embedded raster images are extracted as separate footage. Source
    files are linked so changes can be reloaded with a re-import prompt.
  limitations: >-
    Not supported: SVG filters, masks with luminance, CSS/SMIL animation, patterns and mesh gradients; AI files saved
    without PDF compatibility; Illustrator live effects and appearance stacks import as expanded geometry only.
    Unsupported items are listed in an import report.
  disposition: required-integration
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Add a logo or drawing" — drop an SVG/AI/PDF file on the canvas or a region.
    defaults: >-
      Imports as editable shapes, fitted inside the target region with aspect ratio preserved.
    automation: >-
      Converts automatically, groups by source layers, and reports any features that could not be kept.
    usability_check: >-
      A first-time user imports an SVG logo, fits it to a region and starts a draw-on animation in under 90 s.
  acceptance: >-
    Mini scene "svg-logo": a reference SVG renders within tolerance of a browser rendering at 4K; import report lists
    unsupported features.
  status: not-started
  evidence: []

- id: shape.auto-trace
  name: Auto-trace (paths from image edges)
  sources:
    - ref: S01
      item: "Auto-trace (Channel, Threshold, Tolerance, Minimum Area, Corner Roundness, Blur, Time Span)"
      category: "Masks"
      checked: false
    - ref: "brief §7"
      item: "path tracing"
      category: "Vector shapes, paths and drawing"
      checked: true
  artist_can: >-
    Generate editable paths automatically from the edges of an image or video, based on alpha, a colour channel or
    brightness, for one frame or across time.
  projection_example: >-
    Trace the bright window shapes from a night photo of the facade to get starting outlines for light traces.
  controls:
    - { name: "Time span", type: "enum(current-frame|work-area)", animatable: false }
    - { name: "Channel", type: "enum(alpha|red|green|blue|luminance)", animatable: false }
    - { name: "Invert", type: "bool", animatable: false }
    - { name: "Blur before trace (px)", type: "float", animatable: false }
    - { name: "Threshold", type: "percent", animatable: false }
    - { name: "Tolerance (px)", type: "float", animatable: false }
    - { name: "Minimum area (px)", type: "float", animatable: false }
    - { name: "Corner roundness", type: "percent", animatable: false }
    - { name: "Output", type: "enum(masks|shape-layer)", animatable: false }
  animation: >-
    Work-area traces produce one path keyframe per frame; results are ordinary editable paths.
  dependencies: [shape.path, mask.bezier, proj.work-area]
  implementation: >-
    Python vision sidecar: OpenCV threshold, findContours and approxPolyDP, then Schneider Bezier curve fitting with
    the tolerance; results return as native paths through typed ops. Per-frame traces reuse shape.path-morph
    correspondence to keep vertex order stable.
  io: >-
    none
  limitations: >-
    A traced photo gives approximate outlines only; it is not camera calibration or measured geometry. Noisy footage
    gives unstable vertex counts across frames. The edge-trace creative tool (tool.edge-trace) is the guided consumer.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Vector-path operator or paint tool for After Effects parity. Paths, fills, strokes, trim paths, boolean and offset paths, repeater, morphing and vector import stay required."
  milestone: D
  beginner:
    action: >-
      "Trace outlines from this picture" — choose bright or dark parts and adjust one detail slider.
    defaults: >-
      Luminance channel, threshold chosen by Otsu's method, small-area noise removed.
    automation: >-
      Picks the threshold automatically and previews the traced outlines before they are created.
    usability_check: >-
      A first-time user gets usable outlines for six windows from a photo in under 60 s and deletes stray shapes easily.
  acceptance: >-
    Mini scene "photo-trace": traced outlines of a test photo fall within 2 px of hand-drawn reference outlines.
  status: not-started
  evidence: []

- id: shape.mask-conversion
  name: Shape and mask path conversion
  sources:
    - ref: S01
      item: "Copy paths between masks and shape layers; create shape layers from masks"
      category: "Drawing, painting and paths"
      checked: false
    - ref: "brief §7"
      item: "conversion between compatible shape and mask representations"
      category: "Vector shapes, paths and drawing"
      checked: true
  artist_can: >-
    Turn a mask into a shape layer, a shape into masks on another layer, or copy any path (with its keyframes) between
    masks, shapes and motion paths.
  projection_example: >-
    The soft mask that reveals a texture inside a window becomes a shape layer so the same outline can also glow as a stroke.
  controls:
    - { name: "Convert mask to shape", type: "action", animatable: false }
    - { name: "Convert shape to masks on layer", type: "layer-ref", animatable: false }
    - { name: "Include keyframes", type: "bool", animatable: false }
    - { name: "Keep link (product addition)", type: "bool", animatable: false }
  animation: >-
    Path keyframes and their easing are copied; with "keep link" the target follows the source path live.
  dependencies: [shape.path, shape.layer, mask.bezier]
  implementation: >-
    Both representations share the native path model, so conversion is a typed op that copies path tracks;
    RotoBezier masks are converted to standard Bezier first. "Keep link" writes a native path-link reference rather
    than a copy, and the link is shown in the dependency view.
  io: >-
    none
  limitations: >-
    Mask-only attributes (feather, expansion, mode, opacity) have no shape equivalent and are reported rather than
    silently dropped; shape operators are baked when converting to masks.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Use this outline for…" on any selected outline: glow line, cut-out, or motion path.
    defaults: >-
      Keep link on, so editing the original outline updates every use.
    automation: >-
      Creates the target layer, matches its position in the comp and copies keyframes.
    usability_check: >-
      A first-time user reuses a window mask as a glowing outline in under 20 s in two actions.
  acceptance: >-
    Mini scene "mask-to-glow": converted outline matches the mask exactly across all keyframes after reopen.
  status: not-started
  evidence: []

- id: shape.nulls-from-paths
  name: Create nulls from paths
  sources:
    - ref: S01
      item: "Create Nulls from Paths (Points Follow Nulls, Nulls Follow Points, Trace Path)"
      category: "Drawing, painting and paths"
      checked: false
    - ref: "brief §5"
      item: "reusable rigs with exposed parameters"
      category: "Expressions, controllers and reusable rigs"
      checked: true
  artist_can: >-
    Attach null controllers to path points so dragging a null reshapes the path, make nulls ride on the points, or make
    a null travel along the path with a progress control.
  projection_example: >-
    Rig the roofline path's corners to nulls so the whole trace can be adjusted after a calibration tweak, and send a
    particle emitter along the cornice with a trace null.
  controls:
    - { name: "Mode", type: "enum(points-follow-nulls|nulls-follow-points|trace-path)", animatable: false }
    - { name: "Trace progress", type: "percent", animatable: true }
    - { name: "Trace loop", type: "bool", animatable: false }
    - { name: "Vertices to rig", type: "string", animatable: false }
  animation: >-
    Nulls are keyframable layers; trace progress is keyframable or expression-driven.
  dependencies: [shape.path, proj.null-layer, expr.engine]
  implementation: >-
    Generates null layers and links through the operation system. Links use native path-vertex constraints in core
    for speed, with an equivalent AE-style expression (createPath, toComp/fromComp) shown in More controls.
  io: >-
    none
  limitations: >-
    Points-follow-nulls with many vertices creates many layers; the timeline groups them under a collapsible rig folder.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Vector-path operator or paint tool for After Effects parity. Paths, fills, strokes, trim paths, boolean and offset paths, repeater, morphing and vector import stay required."
  milestone: C
  beginner:
    action: >-
      "Add handles to this outline" or "Send something along this line".
    defaults: >-
      Rig only corner vertices; trace progress animates 0–100% over the comp with ease.
    automation: >-
      Creates, names and parents the nulls and links them; layers are grouped under the path's name.
    usability_check: >-
      A first-time user makes a dot travel along a drawn path in under 30 s.
  acceptance: >-
    Mini scene "cornice-runner": a traced null follows the path exactly in preview and export, and editing a vertex updates it.
  status: not-started
  evidence: []

- id: shape.paint-brush
  name: Paint brush strokes
  sources:
    - ref: S01
      item: "Brush tool, Paint panel and Brushes panel (Color, Diameter, Angle, Roundness, Hardness, Spacing, Opacity, Flow, Mode, Channels, tablet pressure)"
      category: "Painting"
      checked: false
    - ref: "brief §7"
      item: "Paint, clone, eraser, and animated stroke functions"
      category: "Vector shapes, paths and drawing"
      checked: true
  artist_can: >-
    Paint brush strokes directly on a layer (or on transparency) with size, hardness, opacity, flow and pressure
    response, and edit or reorder every stroke later.
  projection_example: >-
    Hand-paint chalk-style doodles on a wall layer that later appear stroke by stroke.
  controls:
    - { name: "Color", type: "color", animatable: true }
    - { name: "Diameter", type: "float", animatable: true }
    - { name: "Angle", type: "angle", animatable: true }
    - { name: "Roundness", type: "percent", animatable: true }
    - { name: "Hardness", type: "percent", animatable: true }
    - { name: "Spacing", type: "percent", animatable: true }
    - { name: "Opacity", type: "percent", animatable: true }
    - { name: "Flow", type: "percent", animatable: true }
    - { name: "Mode", type: "enum(normal|add|screen|multiply|...)", animatable: false }
    - { name: "Channels", type: "enum(rgba|rgb|alpha)", animatable: false }
    - { name: "Pressure controls", type: "enum(off|size|opacity|flow|angle|roundness)", animatable: false }
    - { name: "Paint on transparent", type: "bool", animatable: false }
  animation: >-
    Every stroke's path and settings are keyframable; stroke timing is governed by shape.paint-animation.
  dependencies: [proj.layer, proj.effect-stack, shape.path]
  implementation: >-
    Each stroke is a vector stroke record (sampled points with pressure and time) in a non-destructive Paint item in
    the layer's effect stack, rasterized per frame by stamping brush dabs into an rgba16float premultiplied buffer in
    WGSL. Pointer Events supply pen pressure and tilt.
  io: >-
    Strokes save as vector data in the project; no external paint format.
  limitations: >-
    Painting is per-layer and per-frame range; it is not a full raster painting application.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Vector-path operator or paint tool for After Effects parity. Paths, fills, strokes, trim paths, boolean and offset paths, repeater, morphing and vector import stay required."
  milestone: D
  beginner:
    action: >-
      "Draw by hand" — pick a brush look (chalk, marker, soft light) and paint on the canvas.
    defaults: >-
      Brush size relative to region size; strokes last the whole layer; pressure controls size if a pen is present.
    automation: >-
      Creates a transparent paint layer over the selected region when needed.
    usability_check: >-
      A first-time user paints three strokes on a wall and changes one stroke's colour afterwards in under 60 s.
  acceptance: >-
    Mini scene "chalk-wall": 50 painted strokes re-render identically after reopen and at 4K.
  status: not-started
  evidence: []

- id: shape.paint-animation
  name: Animated paint strokes (write-on)
  sources:
    - ref: S01
      item: "Paint stroke Duration (Constant, Write On, Single Frame, Custom), Stroke Options (Start, End)"
      category: "Painting"
      checked: false
    - ref: "brief §7"
      item: "animated stroke functions ... drawn animation"
      category: "Vector shapes, paths and drawing"
      checked: true
  artist_can: >-
    Make painted strokes appear as they were drawn, last for a single frame or a chosen number of frames, or animate
    their start and end for frame-by-frame drawn animation.
  projection_example: >-
    Chalk drawings write themselves onto the wall in the order and speed the artist painted them.
  controls:
    - { name: "Duration", type: "enum(constant|write-on|single-frame|custom)", animatable: false }
    - { name: "Custom duration (frames)", type: "int", animatable: false }
    - { name: "Start", type: "percent", animatable: true }
    - { name: "End", type: "percent", animatable: true }
    - { name: "Playback speed of recorded strokes", type: "float", animatable: false }
  animation: >-
    Write On records the drawing speed as End keyframes; Start/End are keyframable afterwards.
  dependencies: [shape.paint-brush, anim.keyframe.core]
  implementation: >-
    Stroke records keep per-sample timestamps; write-on converts them into End keyframes mapped by arc length.
    Rasterization truncates the dab sequence at the evaluated end.
  io: >-
    none
  limitations: >-
    For clean vector draw-ons on geometry, shape.trim-paths or fx.generate.write-on are better; paint write-on keeps
    the hand-drawn timing.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Vector-path operator or paint tool for After Effects parity. Paths, fills, strokes, trim paths, boolean and offset paths, repeater, morphing and vector import stay required."
  milestone: D
  beginner:
    action: >-
      "Draw it on as I paint" — record strokes and they replay with the same timing.
    defaults: >-
      Write On with real-time playback; strokes play one after another.
    automation: >-
      Speed and order adjust globally with one slider, and the app writes the keyframes.
    usability_check: >-
      A first-time user records a three-stroke drawing that replays at double speed in under 60 s.
  acceptance: >-
    Mini scene "chalk-replay": replay timing matches recorded timing at 30 and 60 fps exports.
  status: not-started
  evidence: []

- id: shape.clone-stamp
  name: Clone stamp
  sources:
    - ref: S01
      item: "Clone Stamp tool (Source, Aligned, Lock Source Time, Source Time Shift, Clone Source Overlay, Clone presets)"
      category: "Painting"
      checked: false
    - ref: "brief §7"
      item: "Paint, clone, eraser ... asset cleanup"
      category: "Vector shapes, paths and drawing"
      checked: true
  artist_can: >-
    Copy pixels from another part of the same or a different layer, at the same or another time, to paint out unwanted
    objects or duplicate details.
  projection_example: >-
    Paint out a lamp post and a sign from the reference video of the facade before using it as a texture.
  controls:
    - { name: "Source layer", type: "layer-ref", animatable: false }
    - { name: "Source offset", type: "point2d", animatable: true }
    - { name: "Aligned", type: "bool", animatable: false }
    - { name: "Lock source time", type: "bool", animatable: false }
    - { name: "Source time shift", type: "time", animatable: false }
    - { name: "Clone source overlay", type: "percent", animatable: false }
    - { name: "Clone presets (5 slots)", type: "int", animatable: false }
  animation: >-
    Each clone stroke is keyframable like a brush stroke (path, offset, duration).
  dependencies: [shape.paint-brush, preview.cache]
  implementation: >-
    Clone strokes are stroke records like brush strokes. WGSL samples the source layer's rendered frame at
    (t + time shift) with the offset, which needs random-access frame fetch through the FFmpeg/WebCodecs decoder and
    preview.cache.
  io: >-
    Cleaned results can be pre-rendered (proj.pre-render) to avoid re-sampling during playback.
  limitations: >-
    Moving-camera cleanup is laborious by hand; track.content-aware-fill is the automated alternative and
    track.point can drive the clone offset.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Vector-path operator or paint tool for After Effects parity. Paths, fills, strokes, trim paths, boolean and offset paths, repeater, morphing and vector import stay required."
  milestone: D
  beginner:
    action: >-
      Reached through "Clean up footage" → "Paint it out by hand" (the manual alternative to automatic removal).
    defaults: >-
      Aligned on, overlay 50% while dragging, source time locked to the current frame.
    automation: >-
      Shows the overlay preview while dragging and can attach the source offset to a tracker.
    usability_check: >-
      A first-time user removes a small sign from a still frame in under 2 min.
  acceptance: >-
    AS-4 and mini scene "remove-sign": the cleaned region shows no repeating seams at 100% in export.
  status: not-started
  evidence: []

- id: shape.eraser
  name: Eraser
  sources:
    - ref: S01
      item: "Eraser tool (Layer Source & Paint, Paint Only, Last Stroke Only)"
      category: "Painting"
      checked: false
    - ref: "brief §7"
      item: "Paint, clone, eraser"
      category: "Vector shapes, paths and drawing"
      checked: true
  artist_can: >-
    Erase parts of a layer or of painted strokes non-destructively, with the same brush and duration settings as painting.
  projection_example: >-
    Erase the bottom of a painted mural so it seems to fade into the doorway.
  controls:
    - { name: "Erase", type: "enum(layer-source-and-paint|paint-only|last-stroke-only)", animatable: false }
    - { name: "Diameter", type: "float", animatable: true }
    - { name: "Hardness", type: "percent", animatable: true }
    - { name: "Opacity", type: "percent", animatable: true }
    - { name: "Duration", type: "enum(constant|write-on|single-frame|custom)", animatable: false }
  animation: >-
    Erase strokes are keyframable like brush strokes and can write on to animate a disappearing drawing.
  dependencies: [shape.paint-brush]
  implementation: >-
    Erase strokes are stroke records with a destination-out operation in the paint pass; "paint only" applies to the
    paint buffer before it is composited over the layer source.
  io: >-
    none
  limitations: >-
    For clean geometric reveals, masks (mask.bezier) are usually better; the eraser suits hand-made, organic edges.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Vector-path operator or paint tool for After Effects parity. Paths, fills, strokes, trim paths, boolean and offset paths, repeater, morphing and vector import stay required."
  milestone: D
  beginner:
    action: >-
      "Rub out" — switch the brush to eraser while painting.
    defaults: >-
      Paint-only erase when the layer has paint; soft 50% hardness.
    automation: >-
      Chooses paint-only automatically when erasing over painted strokes so the source footage is untouched.
    usability_check: >-
      A first-time user erases part of a stroke and undoes it in under 20 s.
  acceptance: >-
