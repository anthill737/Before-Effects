- id: shape.trim-paths
  name: Trim paths (draw-on)
  sources:
    - ref: S08
      item: "Trim Paths (Start, End, Offset, Trim Multiple Shapes: Simultaneously / Individually)"
      category: "Path operations"
      checked: false
    - ref: "brief §7"
      item: "trim-path animation"
      category: "Vector shapes, paths and drawing"
      checked: true
  artist_can: >-
    Show only part of a path and animate start, end and offset so lines draw on, draw off or travel around a shape,
    across several paths at once or one after another.
  projection_example: >-
    Light traces the outline of every window and the roofline, drawing on in sequence and then chasing around them.
  controls:
    - { name: "Start", type: "percent", animatable: true }
    - { name: "End", type: "percent", animatable: true }
    - { name: "Offset", type: "angle", animatable: true }
    - { name: "Trim multiple shapes", type: "enum(simultaneously|individually)", animatable: false }
    - { name: "Constant speed across paths (product addition)", type: "bool", animatable: false }
  animation: >-
    Start/end/offset keyframable with graph-editor easing; recipes drive them with keyframes, expressions or audio.
  dependencies: [shape.layer, shape.path, anim.keyframe.core]
  implementation: >-
    Arc-length trimming with SkContourMeasure (CanvasKit PathEffect.MakeTrim for the single-path case); "individually"
    concatenates contours in stack order and trims the combined length. The constant-speed option weights each path
    by real length so light travels at one speed around differently sized windows.
  io: >-
    Exports bake trimmed geometry per frame; no SVG equivalent beyond animated dashoffset.
  limitations: >-
    Offset wraps on closed paths only; open paths clamp, as in After Effects.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "Draw it on" / "Trace with light" — select edges or regions, choose colour and speed.
    defaults: >-
      Draw-on over 2 s with ease-out; constant speed across paths on; offset loop off.
    automation: >-
      Creates the shape layer, stroke, trim and keyframes from the selected region outlines (tool.edge-trace) and
      offsets each path's timing when "one after another" is chosen.
    usability_check: >-
      A first-time user makes light trace a roofline and two windows in under 60 s and three deliberate actions.
  acceptance: >-
    AS-1 and mini scene "roofline-trace": trace speed stays constant around corners and matches preview, export and reopen.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: shape.merge-paths
  name: Merge paths (Boolean operations)
  sources:
    - ref: S08
      item: "Merge Paths (Merge, Add, Subtract, Intersect, Exclude Intersections)"
      category: "Path operations"
      checked: false
    - ref: "brief §7"
      item: "merge/Boolean operations"
      category: "Vector shapes, paths and drawing"
      checked: true
  artist_can: >-
    Combine the paths above it into one shape by adding, subtracting, intersecting or excluding overlaps, live and animatable.
  projection_example: >-
    Subtract window shapes from a wall-sized rectangle so a texture covers only the masonry, not the glass.
  controls:
    - { name: "Mode", type: "enum(merge|add|subtract|intersect|exclude-intersections)", animatable: false }
  animation: >-
    Inputs animate; the boolean re-evaluates every frame.
  dependencies: [shape.layer]
  implementation: >-
    CanvasKit PathOps (union, difference, intersect, xor; merge as a simplified compound path) on the evaluated
    paths, memoized per frame by input-geometry hash so static inputs are computed once.
  io: >-
    Merged outlines can be exported as SVG or converted to masks.
  limitations: >-
    Boolean results of animated, self-intersecting paths can change vertex counts between frames, which matters only
    when the result is converted to a mask or path keyframes.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Combine shapes" — select shapes and choose Join, Cut out, Keep overlap or Keep non-overlap.
    defaults: >-
      Join (add) for a new merge.
    automation: >-
      Inserts the merge operator in the right group position and groups the selected paths if needed.
    usability_check: >-
      A first-time user cuts three window shapes out of a wall shape in under 45 s.
  acceptance: >-
    Mini scene "masonry-only": subtracted windows stay exact after reopen and in 4K export.
  status: not-started
  evidence: []

- id: shape.offset-paths
  name: Offset paths
  sources:
    - ref: S08
      item: "Offset Paths (Amount, Line Join, Miter Limit, Copies, Copy Offset)"
      category: "Path operations"
      checked: false
    - ref: "brief §7"
      item: "offsets"
      category: "Vector shapes, paths and drawing"
      checked: true
  artist_can: >-
    Grow or shrink paths outward or inward and make several concentric copies whose spacing can animate.
  projection_example: >-
    Concentric outlines ripple outward from a doorway like sound waves.
  controls:
    - { name: "Amount", type: "float", animatable: true }
    - { name: "Line join", type: "enum(miter|round|bevel)", animatable: false }
    - { name: "Miter limit", type: "float", animatable: true }
    - { name: "Copies", type: "int", animatable: true }
    - { name: "Copy offset", type: "float", animatable: true }
  animation: >-
    Amount, copies and copy offset keyframable; animating copy offset makes rings travel.
  dependencies: [shape.layer]
  implementation: >-
    Stroke-to-path at twice the amount with the chosen join, then PathOps union (outset) or difference (inset) with
    the source, via CanvasKit; copies are repeated offsets at amount + i x copy offset.
  io: >-
    none
  limitations: >-
    Large negative offsets on thin shapes collapse to empty, which is correct but should be explained in the inspector.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Ripple outward" — choose number of rings and speed around the selected outline.
    defaults: >-
      Four copies spaced by twice the stroke width, travelling outward once per beat or second.
    automation: >-
      Copy offset is animated with a looping expression so the rings flow continuously.
    usability_check: >-
      A first-time user makes rings ripple out of a doorway in under 30 s.
  acceptance: >-
    Mini scene "door-ripples": inset and outset offsets render identically in preview and export.
  status: not-started
  evidence: []

