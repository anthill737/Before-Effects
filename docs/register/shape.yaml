- id: shape.repeater
  name: Repeater
  sources:
    - ref: S08
      item: "Repeater (Copies, Offset, Composite, Transform: Anchor Point, Position, Scale, Rotation, Start Opacity, End Opacity)"
      category: "Path operations"
      checked: false
    - ref: "brief §7"
      item: "repeaters; draw one window outline, repeat it across a facade, offset stroke timing by column"
      category: "Vector shapes, paths and drawing"
      checked: true
  artist_can: >-
    Make many copies of the shapes above it, each shifted, scaled, rotated and faded progressively, and nest repeaters
    to build grids; a product addition delays each copy's animation by a set time.
  projection_example: >-
    Draw one window outline, repeat it into a 6 x 4 grid matching the facade, and stagger the draw-on so each column
    starts 0.2 s after the previous one.
  controls:
    - { name: "Copies", type: "float", animatable: true }
    - { name: "Offset", type: "float", animatable: true }
    - { name: "Composite", type: "enum(above|below)", animatable: false }
    - { name: "Anchor point", type: "point2d", animatable: true }
    - { name: "Position", type: "point2d", animatable: true }
    - { name: "Scale", type: "size2d", animatable: true }
    - { name: "Rotation", type: "angle", animatable: true }
    - { name: "Start opacity", type: "percent", animatable: true }
    - { name: "End opacity", type: "percent", animatable: true }
    - { name: "Copy time offset (product addition)", type: "duration", animatable: false }
  animation: >-
    All repeater properties keyframable; fractional copies fade in the last copy. The copy time offset evaluates the
    group above at t + copyIndex x offset, giving per-copy timing without duplicating layers.
  dependencies: [shape.group-transform, anim.time-model]
  implementation: >-
    Without a time offset, copies are GPU-instanced draws of one cached tessellation with per-instance matrices and
    opacity. With a time offset, core evaluates the contents above once per distinct time and caches the results.
    Nested repeaters compose to grids.
  io: >-
    Exported SVG would expand copies; there is no other interchange implication.
  limitations: >-
    After Effects repeaters expose no copy index to expressions and have no time offset; both are product additions.
    Copies follow a regular transform, so irregular facades need region-bound recipes (tool.sequence-light-up)
    instead of a repeater.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Repeat across" — drag the repeat handle on the canvas to add copies in a row, then a second handle for rows;
      "One after another" sets the delay.
    defaults: >-
      Spacing is taken from the first two snapped positions; delay 0.15 s per copy, ordered left to right.
    automation: >-
      Can fit the grid spacing to selected regions and builds nested repeaters for rows and columns automatically.
    usability_check: >-
      A first-time user repeats one window outline into a 6 x 4 grid with column-staggered timing in under 90 s.
  acceptance: >-
    AS-1 and mini scene "facade-grid": 24 repeated outlines with column delay match preview, export and reopen.
  status: not-started
  evidence: []

