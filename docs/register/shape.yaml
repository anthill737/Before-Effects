# Vector shapes, paths and paint — Before Effects capability register
# Sources: S08 (shape attributes, paint operations, path operations), S01 (user guide: paint tools, Create Shapes from Vector Layer, Auto-trace, Create Nulls from Paths), brief §7. Adobe helpx pages returned HTTP 403 on 2026-10-01; Adobe items authored from knowledge (checked: false).

- id: shape.path
  name: Bezier paths and pen editing
  sources:
    - ref: S08
      item: "Paths (Bezier path, vertices, direction handles)"
      category: "Drawing, painting and paths"
      checked: false
    - ref: S01
      item: "Pen tool, Add Vertex, Delete Vertex, Convert Vertex tools"
      category: "Drawing, painting and paths"
      checked: false
    - ref: "brief §7"
      item: "editable primitive and Bezier paths"
      category: "Vector shapes, paths and drawing"
      checked: true
  artist_can: >-
    Draw and reshape smooth or sharp outlines point by point, then keep editing them at any time.
    The same path can drive a shape, a mask, a motion path or text on a path.
  projection_example: >-
    Click around the arch of a doorway to draw its outline, then nudge points so the curve hugs the stonework.
  controls:
    - { name: "Path", type: "path", animatable: true }
    - { name: "Closed", type: "bool", animatable: false }
    - { name: "Vertex position", type: "point2d", animatable: true }
    - { name: "In/out tangents", type: "point2d", animatable: true }
    - { name: "Vertex type", type: "enum(corner|smooth|split)", animatable: false }
    - { name: "First vertex", type: "int", animatable: false }
  animation: >-
    The whole path is one keyframable property (vertices and tangents interpolate together) and is readable and
    writable from expressions (points(), createPath()).
  dependencies: [ux.operation-system, anim.keyframe.core]
  implementation: >-
    A single native path model in core TypeScript (vertices with relative in/out tangents, closed flag, multiple
    contours) shared by masks, shapes, motion paths and text-on-path. Vertex edits are typed ops with Immer patches;
    evaluated paths convert to CanvasKit SkPath for path ops and GPU rasterization.
  io: >-
    Path data serializes in the project file as plain arrays; SVG path data and mask/shape clipboard formats map onto it.
  limitations: >-
    Cubic Beziers only; quadratic curves and SVG arcs are converted to cubics on import.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "Draw an outline" — click points on the canvas (drag for curves), or click a region edge to start from its shape.
    defaults: >-
      Paths close automatically when the first point is clicked again; new points snap to region corners and edges.
    automation: >-
      Converts selected region outlines into editable paths and smooths hand-drawn clicks into clean curves on request.
    usability_check: >-
      A first-time user outlines a window with at least one curved edge in under 60 s and moves a point afterwards
      without opening the inspector.
  acceptance: >-
    AS-1 and mini scene "arch-outline": a curved arch path saves, reopens and renders identically at 1x and 4x resolution.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: shape.layer
  name: Shape layers and contents stack
  sources:
    - ref: S08
      item: "Shape layers, shape groups, Contents (path, paint and path-operation attributes)"
      category: "Shapes and shape attributes"
      checked: false
    - ref: "brief §7"
      item: "groups with independent transforms; fills; strokes"
      category: "Vector shapes, paths and drawing"
      checked: true
  artist_can: >-
    Build vector artwork as a stack of shapes, fills, strokes and modifiers inside one layer, and reorder or toggle any
    of them non-destructively.
  projection_example: >-
    One shape layer holds every window outline on a facade with a shared neon stroke and a trim-path draw-on.
  controls:
    - { name: "Contents stack (groups, paths, paint, operators)", type: "string", animatable: false }
    - { name: "Add content", type: "enum(group|rectangle|ellipse|polystar|path|fill|stroke|gradient-fill|gradient-stroke|merge|offset|pucker-bloat|repeater|round-corners|trim|twist|wiggle-paths|wiggle-transform|zig-zag)", animatable: false }
    - { name: "Item enabled", type: "bool", animatable: false }
    - { name: "Group blend mode", type: "enum(normal|add|screen|multiply|overlay|...)", animatable: false }
  animation: >-
    Every numeric property in the contents stack is keyframable and expression-linkable; items can be enabled or
    reordered without losing keyframes.
  dependencies: [shape.path, proj.layer]
  implementation: >-
    Contents are evaluated per group in After Effects order: path generators collect paths, path operators modify all
    paths above them in the same group, paint operations render the paths above. Evaluation produces SkPaths in core;
    the compositor rasterizes them on the GPU at render resolution and caches by evaluated-geometry hash.
  io: >-
    Created from drawing, primitives, SVG/AI/PDF import (shape.vector-import), text outlines or mask conversion;
    extrusion goes through 3d.extrude.
  limitations: >-
    Very large contents stacks with per-frame boolean operators can be expensive; the profiler should name the
    responsible operator.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "Draw a shape" or any outline recipe ("Trace with light") creates a shape layer; "More controls" shows the stack.
    defaults: >-
      New shape layers get one group with a fill or stroke chosen by the recipe, sized to the selected region.
    automation: >-
      Recipes insert and order fills, strokes and operators correctly so users never assemble the stack by hand.
    usability_check: >-
      A first-time user adds a glowing outline to a region and toggles its stroke off and on in under 45 s without
      expanding the contents tree.
  acceptance: >-
    AS-1 and mini scene "stack-order": reordering an operator above or below a paint item changes the render as
    documented and survives save/reopen.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: shape.primitives
  name: Parametric primitives (rectangle, ellipse, polygon, star)
  sources:
    - ref: S08
      item: "Rectangle, Rounded Rectangle, Ellipse, Polygon, Star (Polystar) path properties"
      category: "Shapes and shape attributes"
      checked: false
    - ref: "brief §7"
      item: "editable primitive and Bezier paths"
      category: "Vector shapes, paths and drawing"
      checked: true
  artist_can: >-
    Draw rectangles, ellipses, polygons and stars whose size, roundness and point count stay adjustable and animatable,
    and convert them to free Bezier paths when needed.
  projection_example: >-
    Fill each rectangular window with a rounded rectangle that grows from its centre, then switch to a star burst on the beat.
  controls:
    - { name: "Size", type: "size2d", animatable: true }
    - { name: "Position", type: "point2d", animatable: true }
    - { name: "Roundness", type: "float", animatable: true }
    - { name: "Type (polygon/star)", type: "enum(polygon|star)", animatable: false }
    - { name: "Points", type: "float", animatable: true }
    - { name: "Rotation", type: "angle", animatable: true }
    - { name: "Inner/outer radius", type: "float", animatable: true }
    - { name: "Inner/outer roundness", type: "percent", animatable: true }
    - { name: "Path direction", type: "enum(clockwise|counter-clockwise)", animatable: false }
    - { name: "Convert to Bezier path", type: "action", animatable: false }
  animation: >-
    All parameters keyframable and expression-linkable; fractional point counts animate smoothly as in After Effects.
  dependencies: [shape.layer, shape.path]
  implementation: >-
    Generators in core TypeScript emit cubic Bezier contours per frame from their parameters (ellipse with four kappa
    segments, polystar with roundness tangents); conversion to Bezier is an op that replaces the generator with its
    evaluated path at the current time.
  io: >-
    none
  limitations: >-
    Converting to a Bezier path freezes parameter animation into path keyframes only at the current time unless the
    user chooses to bake every keyframe.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Draw a shape" — choose rectangle, circle, polygon or star and drag on the canvas or click a region to fit it.
    defaults: >-
      Shapes fit the selected region's bounds with a centred anchor; star defaults to five points.
    automation: >-
      Fitting to a region computes size, position and rotation from the region outline.
    usability_check: >-
      A first-time user places a circle exactly inside a round window in under 20 s using fit-to-region.
  acceptance: >-
    Mini scene "primitive-burst": a polygon animates from 3 to 8 points and from rounded to sharp, matching preview and export.
  status: not-started
  evidence: []

- id: shape.group-transform
  name: Shape groups with independent transforms
  sources:
    - ref: S08
      item: "Group (Transform: Anchor Point, Position, Scale, Skew, Skew Axis, Rotation, Opacity)"
      category: "Shapes and shape attributes"
      checked: false
    - ref: "brief §7"
      item: "groups with independent transforms"
      category: "Vector shapes, paths and drawing"
      checked: true
  artist_can: >-
    Group parts of a drawing and move, scale, skew, rotate or fade each group independently inside one layer, with
    groups nested to any depth.
  projection_example: >-
    Each shutter panel on a facade is a group that swings open around its own hinge while the frame stays still.
  controls:
    - { name: "Anchor point", type: "point2d", animatable: true }
    - { name: "Position", type: "point2d", animatable: true }
    - { name: "Scale", type: "size2d", animatable: true }
    - { name: "Skew", type: "float", animatable: true }
    - { name: "Skew axis", type: "angle", animatable: true }
    - { name: "Rotation", type: "angle", animatable: true }
    - { name: "Opacity", type: "percent", animatable: true }
    - { name: "Blend mode", type: "enum(normal|add|screen|multiply|overlay|...)", animatable: false }
  animation: >-
    Every transform property keyframable and expression-linkable; group transforms concatenate with the layer transform.
  dependencies: [shape.layer, anim.keyframe.core]
  implementation: >-
    Groups hold a 2D affine matrix composed in core (anchor, scale, skew, rotation, position) that is applied to child
    paths before paint; opacity multiplies into child paint. Group blend modes render the group to an intermediate
    rgba16float buffer only when the mode is not Normal.
  io: >-
    SVG and AI groups import as shape groups with their transforms preserved.
  limitations: >-
    Per-group blend modes force an extra render target per group and should be flagged by the profiler on large repeats.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Move this part" — select a piece of a drawing on the canvas and drag, rotate or scale it with handles.
    defaults: >-
      Group anchor is placed at the group's bounding-box centre; snapping to region corners lets users set a hinge.
    automation: >-
      Selecting several shapes and choosing "Group" creates the group and recentres its anchor automatically.
    usability_check: >-
      A first-time user groups two shapes and rotates the group about a chosen corner in under 40 s.
  acceptance: >-
    Mini scene "shutters": six nested groups swing open with independent timing; reopen and seek produce identical frames.
  status: not-started
  evidence: []

- id: shape.fill
  name: Fill
  sources:
    - ref: S08
      item: "Fill (Color, Opacity, Fill Rule, Composite, Blend Mode)"
      category: "Shape attributes, paint operations"
      checked: false
    - ref: "brief §7"
      item: "fills"
      category: "Vector shapes, paths and drawing"
      checked: true
  artist_can: >-
    Fill closed or open shapes with a solid colour and opacity, choose how overlapping contours make holes, and pick
    whether the fill sits above or below earlier paint in the group.
  projection_example: >-
    Flood every window with warm amber light that fades up at dusk, leaving the mullions dark through even-odd holes.
  controls:
    - { name: "Color", type: "color", animatable: true }
    - { name: "Opacity", type: "percent", animatable: true }
    - { name: "Fill rule", type: "enum(non-zero|even-odd)", animatable: false }
    - { name: "Composite", type: "enum(below-previous|above-previous)", animatable: false }
    - { name: "Blend mode", type: "enum(normal|add|screen|multiply|overlay|...)", animatable: false }
  animation: >-
    Color and opacity keyframable and expression-linkable (e.g. index-driven colours in expr.index-rig).
  dependencies: [shape.layer]
  implementation: >-
    GPU coverage rasterization of the group's SkPaths (analytic AA or MSAA) with the chosen fill rule, shaded with a
    premultiplied scene-linear colour in WGSL; colours entered in the UI are converted from the display space via
    color.management.
  io: >-
    SVG/AI fills import with fill rule; CMYK fills convert on import.
  limitations: >-
    none
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "Fill with color" — pick a colour swatch for the selected shape or region.
    defaults: >-
      Fill colour comes from the show palette; opacity 100%; non-zero rule.
    automation: >-
      Recipes add and colour fills automatically; the palette keeps colours consistent across many regions.
    usability_check: >-
      A first-time user changes the fill colour of twenty selected windows at once in under 15 s.
  acceptance: >-
    Mini scene "lit-windows": twenty filled windows with even-odd holes match preview and export with no edge fringes.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: shape.stroke
  name: Stroke (width, caps, joins)
  sources:
    - ref: S08
      item: "Stroke (Color, Opacity, Stroke Width, Line Cap, Line Join, Miter Limit, Composite, Blend Mode)"
      category: "Shape attributes, paint operations"
      checked: false
    - ref: "brief §7"
      item: "strokes with caps, joins"
      category: "Vector shapes, paths and drawing"
      checked: true
  artist_can: >-
    Outline any path with a line of chosen colour and width, with butt, round or projecting caps and miter, round or
    bevel joins.
  projection_example: >-
    A 6 px cyan line runs along every cornice; round caps keep the ends soft where the line meets a column.
  controls:
    - { name: "Color", type: "color", animatable: true }
    - { name: "Opacity", type: "percent", animatable: true }
    - { name: "Stroke width", type: "float", animatable: true }
    - { name: "Line cap", type: "enum(butt|round|projecting)", animatable: false }
    - { name: "Line join", type: "enum(miter|round|bevel)", animatable: false }
    - { name: "Miter limit", type: "float", animatable: true }
    - { name: "Composite", type: "enum(below-previous|above-previous)", animatable: false }
    - { name: "Blend mode", type: "enum(normal|add|screen|multiply|overlay|...)", animatable: false }
  animation: >-
    Colour, opacity, width and miter limit keyframable and expression-linkable; width can be audio-driven via audio.to-keyframes.
  dependencies: [shape.layer]
  implementation: >-
    CanvasKit stroke-to-path (Path.stroke with cap/join/miter) produces fill geometry that the GPU rasterizes with
    analytic AA; hairline widths below one pixel fall back to coverage-scaled opacity to avoid shimmer.
  io: >-
    SVG/AI strokes import with caps, joins and miter limits.
  limitations: >-
    Stroke width is in layer pixels and scales with layer/group scale, as in After Effects; a "keep width" option is
    a product addition to evaluate.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "Outline it" or "Trace with light" — choose colour and thickness for the line around the selection.
    defaults: >-
      Width scales with the region size (about 1% of the region's short side); round caps and joins.
    automation: >-
      The edge-trace recipe (tool.edge-trace) creates the stroke on paths generated from the region outline.
    usability_check: >-
      A first-time user outlines a roofline in a chosen colour and thickness in under 30 s and three actions.
  acceptance: >-
    AS-1 and mini scene "cornice-line": strokes stay sharp and correctly joined at 4K export.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: shape.gradient-fill
  name: Gradient fill
  sources:
    - ref: S08
      item: "Gradient Fill (Type, Start Point, End Point, Highlight Length, Highlight Angle, Colors)"
      category: "Shape attributes, paint operations"
      checked: false
    - ref: "brief §7"
      item: "gradient fills"
      category: "Vector shapes, paths and drawing"
      checked: true
  artist_can: >-
    Fill shapes with linear or radial gradients with any number of colour and opacity stops, positioned with on-canvas handles.
  projection_example: >-
    Windows glow brighter at the bottom and fade toward the top, like light pooling on a sill.
  controls:
    - { name: "Type", type: "enum(linear|radial)", animatable: false }
    - { name: "Colors (color and opacity stops)", type: "gradient", animatable: true }
    - { name: "Start point", type: "point2d", animatable: true }
    - { name: "End point", type: "point2d", animatable: true }
    - { name: "Highlight length", type: "percent", animatable: true }
    - { name: "Highlight angle", type: "angle", animatable: true }
    - { name: "Opacity", type: "percent", animatable: true }
    - { name: "Fill rule", type: "enum(non-zero|even-odd)", animatable: false }
  animation: >-
    Stops, points and highlight keyframable; stop colours interpolate between keyframes even when stop counts differ.
  dependencies: [shape.fill]
  implementation: >-
    WGSL gradient shader evaluated in scene-linear with an option for perceptual (Oklab) stop interpolation, plus
    blue-noise dither before 8-bit output to prevent banding; stops stored as a sampled 1D texture per frame.
  io: >-
    SVG/AI linear and radial gradients import, including gradientTransform; mesh and freeform gradients do not.
  limitations: >-
    Gradient stop count changes between keyframes are resolved by resampling; exact After Effects gradient-keyframe
    behaviour is not reproduced.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Fade the color" — pick two colours and drag the gradient arrow on the canvas.
    defaults: >-
      Linear gradient from the region's bottom to top using the palette's primary and transparent.
    automation: >-
      Handles start at the selected region's bounds; dither is always on.
    usability_check: >-
      A first-time user creates a bottom-to-top glow in a window in under 30 s with no visible banding on export.
  acceptance: >-
    Mini scene "window-glow": 8-bit H.264 and 16-bit master exports show no banding at a 1% luminance ramp.
  status: not-started
  evidence: []

- id: shape.gradient-stroke
  name: Gradient stroke
  sources:
    - ref: S08
      item: "Gradient Stroke"
      category: "Shape attributes, paint operations"
      checked: false
    - ref: "brief §7"
      item: "strokes"
      category: "Vector shapes, paths and drawing"
      checked: true
  artist_can: >-
    Colour a stroke with a linear or radial gradient, with the same caps, joins, dashes, taper and wave as a solid stroke.
  projection_example: >-
    The roofline trace shifts from deep blue at the eaves to white at the ridge.
  controls:
    - { name: "Type", type: "enum(linear|radial)", animatable: false }
    - { name: "Colors (color and opacity stops)", type: "gradient", animatable: true }
    - { name: "Start point", type: "point2d", animatable: true }
    - { name: "End point", type: "point2d", animatable: true }
    - { name: "Highlight length", type: "percent", animatable: true }
    - { name: "Highlight angle", type: "angle", animatable: true }
    - { name: "Stroke width", type: "float", animatable: true }
    - { name: "Line cap / join / miter limit", type: "enum(butt|round|projecting)", animatable: false }
  animation: >-
    Same as shape.gradient-fill and shape.stroke.
  dependencies: [shape.stroke, shape.gradient-fill]
  implementation: >-
    Stroke-to-path geometry shaded by the shared gradient shader. A product option "along the path" maps the gradient
    to arc length instead of screen space (needed for colour-travelling traces).
  io: >-
    SVG/AI gradient strokes import where present.
  limitations: >-
    Gradient along the path is a product addition, not an After Effects option; it requires per-vertex arc-length
    attributes on the stroke mesh.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Vector-path operator or paint tool for After Effects parity. Paths, fills, strokes, trim paths, boolean and offset paths, repeater, morphing and vector import stay required."
  milestone: C
  beginner:
    action: >-
      Reached through the "Trace with light" recipe → More controls → "Color fade along the line".
    defaults: >-
      Gradient along the path from the palette's primary to secondary colour.
    automation: >-
      Arc-length mapping is computed automatically when the path changes.
    usability_check: >-
      A first-time user makes a trace fade from one colour to another along its length in under 30 s.
  acceptance: >-
    AS-1 and mini scene "gradient-trace": the colour gradient travels with a trim-path draw-on in preview and export.
  status: not-started
  evidence: []

- id: shape.dashes
  name: Stroke dashes
  sources:
    - ref: S08
      item: "Stroke Dashes (Dash, Gap, Offset)"
      category: "Shape attributes, paint operations"
      checked: false
    - ref: "brief §7"
      item: "dash patterns"
      category: "Vector shapes, paths and drawing"
      checked: true
  artist_can: >-
    Break a stroke into dashes and gaps with several dash/gap pairs, and animate the offset so the pattern travels
    along the line.
  projection_example: >-
    Marching light dashes run around every door frame like a theatre marquee.
  controls:
    - { name: "Dash (per pair)", type: "float", animatable: true }
    - { name: "Gap (per pair)", type: "float", animatable: true }
    - { name: "Offset", type: "float", animatable: true }
    - { name: "Add/remove dash pair", type: "action", animatable: false }
  animation: >-
    All lengths and the offset keyframable; offset is commonly driven by time (expr.time-loops) or the beat.
  dependencies: [shape.stroke]
  implementation: >-
    CanvasKit PathEffect.MakeDash applied before stroke-to-path; offset wraps modulo the pattern length so loops are seamless.
  io: >-
    SVG stroke-dasharray and dashoffset import.
  limitations: >-
    none
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Vector-path operator or paint tool for After Effects parity. Paths, fills, strokes, trim paths, boolean and offset paths, repeater, morphing and vector import stay required."
  milestone: C
  beginner:
    action: >-
      "Marching lights" — choose dash length, gap and speed for the selected outline.
    defaults: >-
      Dash and gap scale with stroke width (3:2); speed loops seamlessly over the comp duration.
    automation: >-
      Speed is converted into an offset expression that loops exactly at the comp length.
    usability_check: >-
      A first-time user makes a door frame show running dashes in under 30 s in three actions.
  acceptance: >-
    Mini scene "marquee": dash offset loops without a jump at the comp boundary in a looped export.
  status: not-started
  evidence: []

- id: shape.taper
  name: Stroke taper
  sources:
    - ref: S08
      item: "Stroke Taper (Start Length, End Length, Start Width, End Width, Start Ease, End Ease, Length Units)"
      category: "Shape attributes, paint operations"
      checked: false
    - ref: "brief §7"
      item: "strokes with ... taper"
      category: "Vector shapes, paths and drawing"
      checked: true
  artist_can: >-
    Make a stroke thin out or swell at its start and end, like a brush mark or a comet tail.
  projection_example: >-
    A light streak tapers to a point as it races along a balcony rail.
  controls:
    - { name: "Length units", type: "enum(percent|pixels)", animatable: false }
    - { name: "Start length", type: "float", animatable: true }
    - { name: "End length", type: "float", animatable: true }
    - { name: "Start width", type: "percent", animatable: true }
    - { name: "End width", type: "percent", animatable: true }
    - { name: "Start ease", type: "percent", animatable: true }
    - { name: "End ease", type: "percent", animatable: true }
  animation: >-
    All values keyframable; taper follows the trimmed segment when combined with shape.trim-paths.
  dependencies: [shape.stroke]
  implementation: >-
    Variable-width stroke outline generated in core: sample the centreline by arc length (SkContourMeasure), offset
    along normals by the eased width profile, then fill the resulting polygon on the GPU. CanvasKit has no native
    variable-width stroke, so this generator is shared with shape.stroke-wave.
  io: >-
    No SVG equivalent; exported SVG would need outlined geometry.
  limitations: >-
    Very sharp corners with heavy taper can self-intersect; the generator uses a non-zero fill to hide overlaps.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Vector-path operator or paint tool for After Effects parity. Paths, fills, strokes, trim paths, boolean and offset paths, repeater, morphing and vector import stay required."
  milestone: C
  beginner:
    action: >-
