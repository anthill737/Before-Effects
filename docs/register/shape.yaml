- id: shape.wiggle-paths
  name: Wiggle paths
  sources:
    - ref: S08
      item: "Wiggle Paths (Size, Detail, Points, Wiggles/Second, Correlation, Temporal Phase, Spatial Phase, Random Seed)"
      category: "Path operations"
      checked: false
    - ref: "brief §7"
      item: "animated irregularity"
      category: "Vector shapes, paths and drawing"
      checked: true
  artist_can: >-
    Make outlines jitter, wobble or crackle by randomly displacing added detail points over time, with a seed for
    repeatable results.
  projection_example: >-
    Window outlines buzz like faulty neon, or crackle with electricity along the cornice.
  controls:
    - { name: "Size", type: "float", animatable: true }
    - { name: "Detail", type: "float", animatable: true }
    - { name: "Points", type: "enum(corner|smooth)", animatable: false }
    - { name: "Wiggles/second", type: "float", animatable: true }
    - { name: "Correlation", type: "percent", animatable: true }
    - { name: "Temporal phase", type: "angle", animatable: true }
    - { name: "Spatial phase", type: "angle", animatable: true }
    - { name: "Random seed", type: "seed", animatable: false }
  animation: >-
    All parameters keyframable; the result is a pure function of (seed, time), so scrubbing, preview and export match.
  dependencies: [shape.layer, expr.stable-random]
  implementation: >-
    Core geometry: subdivide by detail, then displace each point along its normal using stateless seeded smooth noise
    keyed on (seed, point index, time x rate, phases); no per-frame state.
  io: >-
    none
  limitations: >-
    Exact random sequences will not match After Effects for the same seed; only the behaviour and parameters match.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Vector-path operator or paint tool for After Effects parity. Paths, fills, strokes, trim paths, boolean and offset paths, repeater, morphing and vector import stay required."
  milestone: C
  beginner:
    action: >-
      "Make it buzz" — choose intensity and speed on the selected outline.
    defaults: >-
      Size scales with the shape size (about 2%), 3 wiggles/second, seed derived from the layer.
    automation: >-
      Seeds are assigned per region so repeated windows do not wiggle in unison; "Re-roll" picks a new seed.
    usability_check: >-
      A first-time user makes an outline flicker irregularly and re-rolls the randomness in under 20 s.
  acceptance: >-
    AS-3 and mini scene "faulty-neon": the wiggle is identical after reopen, random seek and export.
  status: not-started
  evidence: []

