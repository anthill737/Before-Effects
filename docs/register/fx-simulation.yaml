  projection_example: >-
    The base of a wall or a floor projection gets rain ripples while CC Rainfall streaks fall above.
  controls:
    - { name: "Drip rate and longevity", type: float, animatable: true }
    - { name: "Rippling, displacement, ripple height, spreading", type: float, animatable: true }
    - { name: "Light (source, intensity, color, type, height, position, direction)", type: group, animatable: true }
    - { name: "Shading (ambient, diffuse, specular, roughness, metal)", type: group, animatable: true }
    - { name: "Seed", type: seed, animatable: false }
