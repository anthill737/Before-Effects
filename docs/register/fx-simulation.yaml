    Mini scene "warp-transition": random-frame renders hash-match sequential output.
  status: not-started
  evidence: []

- id: fx.simulation.particle-system
  name: Particle system
  sources:
    - ref: brief §11D
      item: Particle emitters, lifetime/velocity/size/color evolution, forces, sprite/textured particles
      category: Simulation and particles
      checked: true
    - ref: brief §1
      item: Particles, smoke-like imagery, rain, snow and light travel across architectural features
      category: What the product must enable
      checked: true
  artist_can: >-
    Emit particles from points, shapes, regions, paths, text or a layer's pixels; give them lifetime, speed, and size/colour/opacity over life; push them with gravity, drag, wind, turbulence, attractors and vortices; and draw them as dots, streaks, sprites, textured cards or small 3D meshes, flat or through the 3D camera.
  projection_example: >-
    Embers rise from the doorways, swirl around the columns in turbulence and fade out above the roofline in time with the music.
  controls:
    - { name: "Emitter type (point, box/sphere, grid, path, region, text glyphs, layer pixels, layer explode)", type: enum, animatable: false }
    - { name: "Birth rate and burst count", type: float, animatable: true }
    - { name: "Lifetime and variance", type: float, animatable: true }
    - { name: "Initial velocity, direction, spread, inherit velocity", type: group, animatable: true }
    - { name: "Forces (gravity, drag, wind, curl-noise turbulence, attractors/repellers, vortex)", type: group, animatable: true }
    - { name: "Size, opacity and color over life", type: curve, animatable: false }
    - { name: "Rotation and spin", type: group, animatable: true }
    - { name: "Particle look (dot, streak, sprite from layer/comp with time offset, mesh instance)", type: enum, animatable: false }
    - { name: "Blend mode, depth sort, motion blur", type: group, animatable: false }
    - { name: "Sub-emitters (on birth, death, collision)", type: group, animatable: false }
    - { name: "Attribute maps (color/size/velocity from a layer)", type: layer, animatable: false }
    - { name: "Seed, pre-roll, max particles / quality", type: group, animatable: false }
  animation: >-
    Emitter and force values are keyframable, expression-linkable and audio-drivable (birth rate on beats, turbulence on bass). Edits take effect from the time they apply because the simulation integrates forward.
  dependencies: [fx.simulation.deterministic-seeds, fx.simulation.cache-checkpoints, fx.simulation.emission-masks, fx.simulation.collision-surfaces, 3d.camera, 3d.scene, expr.engine, audio.analysis, preview.cache, proj.effect-stack]
  implementation: >-
    WGSL compute particles in struct-of-arrays storage buffers. Each particle has a stable ID (emit frame, emitter, index), and all its random values come from a stateless counter hash of (seed, ID, attribute), never from thread or evaluation order. Integration is fixed-step semi-implicit Euler with an integer number of substeps per frame derived from flicks, with forces evaluated from keyframed values at substep times; dead particles are compacted by a deterministic prefix-sum rather than order-dependent atomics. Rendering uses instanced sprites/streaks/meshes (three.js when sharing the 3D depth buffer) with premultiplied blending and an optional bitonic depth sort; state is checkpointed through fx.simulation.cache-checkpoints, so parallel render workers resume from checkpoints instead of skipping history.
  io: >-
    Sim caches live with the project cache, not the project file. Exporting particle positions as point sequences (PLY/CSV) for other tools is a later consideration.
  limitations: >-
    Bitwise determinism holds for the same app version and GPU/driver class; across vendors it is not guaranteed (FMA and transcendental differences), so other machines use baked caches. Particle count is bounded by VRAM (target 1–2M at 1080p on the RTX 5070 Ti, to be measured). No fluid dynamics between particles.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      "Add particles": select a region or path, then pick a recipe (Sparks, Embers, Dust, Fireflies, Confetti, Petals); first controls are amount, speed, size, color and direction.
    defaults: >-
      Emit from the selection, 3 s life, gentle upward drift with turbulence, pre-roll so particles are present at the scene start, fixed seed.
    automation: >-
      Scales size and speed to the region's physical size, picks sprite and blend mode per recipe, simulates and caches in the background, and warns before counts exceed the preview budget.
    usability_check: >-
      A first-time user adds embers rising from three selected windows in under 60 s without opening More controls, and scrubbing anywhere shows the same embers.
  acceptance: >-
    AS-3: reproducible particles after reopening and seeking; a parallel (MFR-style) render hash-matches a sequential render.
  status: not-started
  evidence: []

- id: fx.simulation.emission-masks
  name: Architectural emission masks
  sources:
    - ref: brief §11D
      item: Architectural emission masks
      category: Simulation and particles
      checked: true
    - ref: brief §19
      item: Particles originate from selected physical regions or follow architectural contours
      category: Projection-specific creative tools
      checked: true
  artist_can: >-
    Make particles and other generators come from chosen parts of the building (inside windows, along rooflines, from mask or text outlines, from bright areas of a video) and optionally travel along those contours.
  projection_example: >-
    Sparks pour only from the edges of each window frame while dust drifts along the cornice line.
  controls:
    - { name: "Emission source (regions, region group or role, mask, shape path, text, layer luminance/alpha, depth or object-ID pass)", type: enum, animatable: false }
    - { name: "Emit from (area, outline, vertices)", type: enum, animatable: false }
    - { name: "Edge offset and thickness", type: float, animatable: true }
    - { name: "Density weighting map", type: layer, animatable: false }
    - { name: "Distribution (random, even blue-noise, sequential along path)", type: enum, animatable: false }
    - { name: "Follow contour strength and speed", type: float, animatable: true }
    - { name: "Per-region order and delay", type: group, animatable: true }
  animation: >-
    Offsets, follow strength and per-region delays keyframable; animated masks and paths re-sample each frame.
  dependencies: [map.region, map.surface-2d, map.model-3d, mask.bezier, shape.path, text.layer, pass.depth, tool.edge-trace, tool.sequence-light-up, fx.simulation.particle-system, fx.simulation.deterministic-seeds]
  implementation: >-
    The core builds emission samplers in content space: region polygons, mask/shape paths and HarfBuzz/CanvasKit glyph outlines are triangulated (area) or arc-length parameterized (outline) on the CPU and uploaded as CDF tables, while pixel sources get a GPU prefix-sum CDF over a downsampled luminance/alpha mip. Each particle picks its spawn point by hash(seed, ID) → CDF lookup, so emission is stateless and identical in preview and export. Contour following stores (path ID, arc length) per particle and advances it each step; emitting by region role keeps shows portable when bound to another venue.
  io: >-
    none
  limitations: >-
    Positions live in content/UV or audience-view space; the system knows only the venue model, not unmodelled physical detail. Rebinding to a venue with different region counts changes the distribution by design (the seed is kept).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      Built into every particle recipe as "Comes from: [current selection]" with "inside", "along the edges" or "along this line".
    defaults: >-
      The current selection; outline mode for line-like regions (rooflines), area mode for windows and doors; emission weighted by area.
    automation: >-
      Converts the selection into an emitter, resolves region roles through venue bindings and keeps the link live when regions are edited.
    usability_check: >-
      A first-time user makes sparks come from the edges of all windows (selected as one group) in ≤3 deliberate actions without drawing a mask.
  acceptance: >-
    Mini scene "window-sparks", plus AS-7 rebinding: the same show bound to a second venue emits from that venue's windows with no edits.
  status: implemented
  evidence:
    - "docs/07-simulations.md; journey steps sim-* (smoke 210 frames in ~2 s, byte-identical second run, re-prepare on edit, water fills windows, background export), 2026-10-02"

- id: fx.simulation.deterministic-seeds
  name: Deterministic seeds
  sources:
    - ref: brief §20
      item: Use deterministic time and seeded randomness
      category: Architecture and build rules
      checked: true
    - ref: brief §11D
      item: Deterministic seeds
      category: Simulation and particles
      checked: true
    - ref: brief §5
      item: Random results stable between preview and export
      category: Expressions, controllers and rigs
      checked: true
  artist_can: >-
    Get the same random result every time (preview, export, after reopening, on another machine) and try other variations with a Shuffle button or seed number, either locking one variation for many regions or letting each region differ.
  projection_example: >-
    A window-by-window random flicker is identical every night of the show and identical in the projector export.
  controls:
    - { name: "Seed", type: int, animatable: false }
    - { name: "Shuffle (new variation)", type: action, animatable: false }
    - { name: "Per-instance variation (same for all, by index, by region)", type: enum, animatable: false }
  animation: >-
    Seeds are not animated; deliberate re-rolls are made by switching variations at a cut. Time-varying randomness comes from hashing time slots, not from changing the seed.
  dependencies: [proj.project-model, expr.engine, ux.recipe-engine]
  implementation: >-
    A stateless counter-based RNG in the core: value = hash(project seed ⊕ item seed, stream, element ID, time slot), using a fixed u32 integer hash (PCG-style) implemented identically in TypeScript (Math.imul) and WGSL and checked against shared golden vectors on both. There is no hidden RNG state and no Math.random, and results do not depend on evaluation order, thread count or frame order, which makes them random-access and safe for parallel rendering. Recipes derive child seeds from hash(parent seed, role), so regenerating a recipe keeps its variations; u32 → [0,1) conversion uses the top 24 bits for exact f32 results.
  io: >-
    Seeds are saved in the project file and survive collect/relink and venue rebinding.
  limitations: >-
    Structural edits (particle count, emission rate, grid size) change which element IDs exist, so the same seed can look different afterwards; the UI says so. Float divergence in downstream GPU math is handled by fx.simulation.cache-checkpoints, not by seeds.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      A "Shuffle" (dice) button on every recipe with randomness; the default is to keep the current variation.
    defaults: >-
      Each new random element gets a seed derived from the project seed and its ID; duplicates keep the seed unless "Make unique" is chosen.
    automation: >-
      Derives distinct seeds per region or instance and records seeds in recipe overrides so regeneration preserves them.
    usability_check: >-
      A first-time user tries three variations with Shuffle and returns to the first with undo in under 20 s; exported frames match the preview.
  acceptance: >-
    Determinism suite: the same project rendered twice, in preview and export, with frames in random order, gives identical hashes; feeds AS-3.
  status: implemented
  evidence:
    - "docs/07-simulations.md; journey steps sim-* (smoke 210 frames in ~2 s, byte-identical second run, re-prepare on edit, water fills windows, background export), 2026-10-02"

- id: fx.simulation.collision-surfaces
  name: Collision and surface-following particles
  sources:
    - ref: brief §11D
      item: Collision or surface-following options
      category: Simulation and particles
      checked: true
    - ref: brief §19
      item: Particles follow architectural contours
      category: Projection-specific creative tools
      checked: true
  artist_can: >-
    Make particles bounce off, slide along, stick to or die on ledges, sills, floors and the building model, or crawl over a surface following its shape.
  projection_example: >-
    Rain hits the window sills and splashes, while glowing beetles crawl over the facade relief following the 3D model.
  controls:
    - { name: "Colliders (region edges, planes, venue model, creative geometry, depth pass)", type: enum, animatable: false }
    - { name: "Response (bounce, slide, stick, kill, spawn sub-emitter)", type: enum, animatable: false }
    - { name: "Bounciness and friction", type: float, animatable: true }
    - { name: "Surface-follow strength and stick distance", type: float, animatable: true }
    - { name: "Collider thickness / offset", type: float, animatable: true }
    - { name: "Show colliders", type: bool, animatable: false }
  animation: >-
    Bounciness, friction and follow strength keyframable; animated creative geometry rebuilds its collider each frame.
  dependencies: [fx.simulation.particle-system, fx.simulation.cache-checkpoints, map.region, map.model-3d, 3d.scene, pass.depth]
  implementation: >-
    In 2D, region edges are rasterized into a signed distance field with a WGSL jump-flood pass, and particles test the SDF each substep, reflecting velocity with restitution and friction. In 3D, venue or creative meshes are voxelized into a 3D SDF texture in compute, with a screen-space depth-pass test for footage-derived geometry. Surface following projects particles to the SDF zero-set and removes normal velocity; static colliders are built once and cached, all within the deterministic fixed step.
  io: >-
    none
  limitations: >-
    SDF resolution limits thin features (mullions under ~2 texels can leak; thickness/offset compensates). Collisions make sims stateful, so checkpoints are required. Only Foam has particle-to-particle contact. The venue model is read-only collision geometry and is never moved (brief §9).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      Toggles in particle recipes: "Bounce off the building" and "Crawl over the surface".
    defaults: >-
      On for rain and snow recipes, with ledges taken from region bottom edges; bounce 0.3, friction 0.5.
    automation: >-
      Builds colliders from the selected regions or venue model and outlines them on the canvas while the toggle is being edited.
    usability_check: >-
      A first-time user makes rain splash on window sills by turning on one option, in under 15 s.
  acceptance: >-
    Mini scene "sill-splash": rain with sill collisions; seek and reopen hash-match a sequential render.
  status: prototype
  evidence:
    - "docs/07-simulations.md; journey steps sim-* (smoke 210 frames in ~2 s, byte-identical second run, re-prepare on edit, water fills windows, background export), 2026-10-02: water collides with container regions (stays inside selected windows); arbitrary collision surfaces and particles not yet"

- id: fx.simulation.cache-checkpoints
  name: Cached, seekable simulation state
  sources:
    - ref: brief §20
      item: Stateful simulations need seek/replay/checkpoint semantics; parallel render workers must not skip necessary simulation history
      category: Architecture and build rules
      checked: true
    - ref: brief §11D
      item: Cacheable simulation state
      category: Simulation and particles
      checked: true
    - ref: brief §22
      item: Reproducible particles and effects after reopening and seeking (show 3)
      category: Acceptance shows
      checked: true
  artist_can: >-
    Scrub, jump or loop anywhere in a simulation and see exactly what the export will contain, without waiting for the sim to run from the start, and get the same result after saving and reopening.
  projection_example: >-
    During rehearsal, jump straight to the 2:40 crack-and-collapse and see the exact fragments that will play in the show.
  controls:
    - { name: "Checkpoint interval (auto or frames)", type: int, animatable: false }
    - { name: "Cache budget and location (RAM, disk)", type: group, animatable: false }
    - { name: "Simulation start and pre-roll", type: group, animatable: false }
    - { name: "Freeze / bake simulation", type: action, animatable: false }
    - { name: "Re-simulate", type: action, animatable: false }
  animation: >-
    Not animatable. Keyframe edits on a simulation's inputs invalidate checkpoints from the first affected time onward.
  dependencies: [preview.cache, render.queue, proj.project-model, proj.autosave-recovery, fx.simulation.deterministic-seeds]
  implementation: >-
    Every stateful pass implements init(seed, params) → state, step(state, t, dt) → state and render(state, t). The engine snapshots full state every K frames (adaptive, so replay stays under ~250 ms at the measured step cost), keyed by a hash of params, upstream inputs, seed and sim version, and a seek replays from the nearest checkpoint at or before the target. Render jobs run a sequential sim pre-pass that fills checkpoints ahead of the parallel frame workers, and workers fetch state from the store, so no worker skips history. Snapshots are held in a VRAM ring and spill to disk with zstd; dependency tracking invalidates only from the first changed time. The pass contract must be fixed in the engine API during milestone A even though the feature lands in D.
  io: >-
    "Bake simulation" writes caches into the project's cache folder so show machines and collected projects can play without re-simulating. Caches can always be rebuilt and are never the only source of truth.
  limitations: >-
    The first playback after an edit needs one sequential pass, shown as cache progress. Checkpoint memory scales with state (1M particles × ~48 B ≈ 48 MB per checkpoint). Cross-vendor GPU results can differ bitwise, so other machines verify by hash and fall back to the baked cache.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      Automatic. A thin bar on the timeline shows simulated ranges, and More controls offers "Freeze simulation".
    defaults: >-
      Auto checkpointing on, background simulation after each edit, disk spill when RAM is low.
    automation: >-
      Pre-simulates in the background, invalidates on edit, manages memory and explains delays in plain words ("Preparing the bubbles… 60%").
    usability_check: >-
      After editing a particle recipe, a first-time user can scrub to any point and gets a correct preview-quality frame within 1 s, without knowing what a cache is.
  acceptance: >-
    AS-3 and AS-6: a simulation scene rendered in parallel hash-matches a sequential render; an interrupted render resumes with correct state; reopen-and-seek gives identical frames.
  status: implemented
  evidence:
    - "docs/07-simulations.md; journey steps sim-* (smoke 210 frames in ~2 s, byte-identical second run, re-prepare on edit, water fills windows, background export), 2026-10-02"

- id: fx.simulation.rigid-body-fracture
  name: 3D fracture, collapse and rebuild
  sources:
    - ref: brief §19
      item: Editable crack, fragment, disassembly and rebuilding scenes
      category: Projection-specific creative tools
      checked: true
    - ref: brief §1
      item: A wall appears to crack, separate into blocks, rotate, fall apart and rebuild
      category: What the product must enable
      checked: true
    - ref: brief §22
      item: Transformation (show 3)
      category: Acceptance shows
      checked: true
  artist_can: >-
    Crack a wall or object into 3D pieces (Voronoi, bricks matched to coursing, planks, radial impact or custom), let them fall and collide with real physics against the floor and each other, then rebuild exactly into place, controlling where cracks start, how pieces break and when.
  projection_example: >-
    The facade cracks from a point of impact, chunks tumble onto the plaza and pile up, then fly back and lock into the wall on the final chord.
  controls:
    - { name: "Fracture pattern (Voronoi, clustered Voronoi, bricks from regions, planks, radial impact, custom mesh/map)", type: enum, animatable: false }
    - { name: "Piece count, size variation, thickness", type: group, animatable: false }
    - { name: "Impact points and crack-line timing", type: point3d, animatable: true }
    - { name: "Release (by time, gradient sweep, impact, region order)", type: enum, animatable: false }
    - { name: "Physics (gravity, mass, friction, restitution, damping)", type: group, animatable: true }
    - { name: "Colliders (floor, venue proxy, other pieces)", type: group, animatable: false }
    - { name: "Rebuild (exact reverse, eased reassembly, mixed) with timing and stagger", type: group, animatable: true }
    - { name: "Materials (front from content, interior and side PBR material, crack glow)", type: group, animatable: true }
    - { name: "Seed", type: seed, animatable: false }
  animation: >-
    Impact, release and rebuild timing are keyframable and beat-snappable. Rebuild plays recorded trajectories backwards, or blends each piece from its rest pose with an eased curve, so reassembly lands exactly.
  dependencies: [3d.scene, 3d.material-pbr, 3d.extrude, 3d.model-import, map.model-3d, map.region, fx.simulation.cache-checkpoints, fx.simulation.deterministic-seeds, fx.simulation.shatter, fx.simulation.particle-system, anim.time-remap, audio.analysis, ux.recipe-engine]
  implementation: >-
    The core generates fracture geometry deterministically (seeded Voronoi cells by convex plane-clipping of the creative proxy mesh, or brick layouts from region and coursing lines), producing convex pieces that serve as Rapier convex-hull colliders and as render meshes with interior faces and UVs for three.js WebGPU. Rapier (WASM, deterministic build) steps at a fixed dt in a worker; its serialized world snapshots are the checkpoints, and per-frame piece transforms are recorded into a transform cache that preview and export both read, so rendering is random-access after the first sequential pass. Pieces are copies of ANIMATED CREATIVE GEOMETRY, never the venue geometry or calibration, and are textured by audience/projector-view projective mapping so the first frame matches the unbroken wall.
  io: >-
    Optional import of pre-fractured meshes (glTF/OBJ) and export of baked transform caches; a Blender handoff for very high piece counts is a later option.
  limitations: >-
    Rapier's cross-platform determinism assumes the same version, inputs and insertion order, which must be verified by hash tests. Piece counts in the low thousands keep stepping interactive. There is no bending or plastic deformation; dust and debris come from particle sub-emitters. The illusion holds only from the audience viewpoint, and falling pieces project onto whatever physical surface lies behind them.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      "Crack and rebuild": select a wall, choose the recipe, adjust intensity, duration and where it starts (click on the wall).
    defaults: >-
      Bricks or Voronoi chosen from the region tag, 60–150 pieces scaled to wall size, impact at the clicked point, 2 s fall, 1 s hold, 2 s rebuild, floor at the region bottom, crack glow and dust on.
    automation: >-
      Builds proxy creative geometry from the wall region or venue model, fractures it, assigns content-front and stone-interior materials, sets the audience camera, runs and caches the physics, and generates the rebuild.
    usability_check: >-
      A first-time user makes a selected wall crack, collapse and rebuild in ≤3 deliberate actions and under 90 s, and the result is identical after saving, reopening and scrubbing.
  acceptance: >-
    AS-3 (Transformation): wall deformation, fragmentation and reassembly; frame hashes stable across reopen, seek and parallel render; the final rebuilt frame matches the unbroken wall within tolerance.
  status: not-started
  evidence: []

- id: fx.simulation.fluid-smoke
  name: Real fluid and smoke simulation
  sources:
    - ref: brief §11C
      item: These looks do not by themselves imply a physical fluid simulator
      category: Noise and texture
      checked: true
    - ref: brief §11D
      item: Liquid-like effects
      category: Simulation and particles
      checked: true
    - ref: brief §1
      item: Smoke-like imagery; brick changes into flowing water
      category: What the product must enable
      checked: true
  artist_can: >-
    Drive smoke, ink or liquid motion with an actual fluid solver, swirling around windows and columns and pushed by moving objects, instead of a noise-based look.
  projection_example: >-
    Ink-like smoke pours out of the windows, curls around the mullions and is pushed aside by a passing logo.
  controls:
    - { name: "Solver (2D GPU grid, baked 3D from Blender)", type: enum, animatable: false }
    - { name: "Resolution", type: int, animatable: false }
    - { name: "Viscosity, vorticity, dissipation, buoyancy", type: float, animatable: true }
    - { name: "Sources (density, velocity, temperature) from emission masks", type: group, animatable: true }
    - { name: "Obstacles from regions or moving layers", type: region-set, animatable: false }
    - { name: "Seed", type: seed, animatable: false }
  animation: >-
    Source strengths and solver values keyframable and audio-drivable; changes act forward in time.
  dependencies: [fx.simulation.cache-checkpoints, fx.simulation.emission-masks, fx.simulation.collision-surfaces, fx.simulation.deterministic-seeds, map.region]
  implementation: >-
    Two candidate routes. (1) A 2D stable-fluids solver in WGSL compute: semi-Lagrangian advection, Jacobi or multigrid pressure projection and vorticity confinement on r32float grids, with region-SDF obstacles, a fixed step and checkpoints. (2) Blender Mantaflow smoke or liquid baked headless and imported as image/EXR sequences or VDB renders (required-integration).
  io: >-
    Route 2 imports Blender bakes as EXR/PNG sequences; caches are referenced like footage.
  limitations: >-
    User 2026-10-02: real fluid and smoke simulation is REQUIRED alongside fast presets. Plan: in-app GPU solvers (grid smoke/ink, water surface, particle-based flowing liquid) with deterministic checkpoint caches and a separate Prepare simulation step, plus optional offline 3D smoke and liquid via Blender Mantaflow. See fx.simulation.gpu-smoke-2d and related entries.

    Open question: does the show need a true fluid solver, or do simulation-like looks (fx.noise-grain.fractal-noise, fx.distort.turbulent-displace, CC Mr. Mercury, Foam, particles with curl noise) cover the useful outcomes? Decide after milestone C prototypes; if yes, prefer the 2D GPU solver for interactivity and keep Blender for hero 3D liquid.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Would be reached through the "Smoke" and "Ink" recipes ("Real fluid" quality option); until resolved those recipes use simulation-like looks and say so.
    defaults: >-
      2D solver at 512 cells across the region, smoke from the selection, region outlines as obstacles.
    automation: >-
      Builds obstacles and sources from the selection, simulates and caches in the background.
    usability_check: >-
      A first-time user makes smoke pour from selected windows and curl around them in ≤3 deliberate actions and under 60 s.
  acceptance: >-
    Mini scene "window-smoke": seek and reopen hash-match a sequential render (if adopted).
  status: implemented
  evidence:
    - "docs/07-simulations.md; journey steps sim-* (smoke 210 frames in ~2 s, byte-identical second run, re-prepare on edit, water fills windows, background export), 2026-10-02"

- id: fx.simulation.gpu-smoke-2d
  name: Smoke and ink simulation (GPU grid solver)
  sources:
    - ref: brief
