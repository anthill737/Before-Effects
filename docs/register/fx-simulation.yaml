      category: Simulation
      checked: false
  artist_can: >-
    Fill an area with falling rain streaks with depth, speed, wind and spread, optionally refracting the background, composited over or with the layer.
  projection_example: >-
    Rain falls across a whole facade but only over the walls (not the windows), with drops subtly refracting the projected content.
  controls:
    - { name: "Drops, size, scene depth", type: float, animatable: true }
    - { name: "Speed, wind, wind variation, spread", type: float, animatable: true }
    - { name: "Color and opacity", type: group, animatable: true }
    - { name: "Background reflection (influence, spread width/height)", type: group, animatable: true }
    - { name: "Transfer mode and composite with original", type: enum, animatable: false }
    - { name: "Extras (appearance, offset, ground level, embed depth)", type: group, animatable: true }
    - { name: "Random seed", type: seed, animatable: false }
  animation: >-
    Amount, wind and speed keyframable (a storm builds); wind can be audio-driven.
  dependencies: [fx.simulation.deterministic-seeds, mask.track-matte, map.region, ux.recipe-engine]
  implementation: >-
    Stateless analytic particles in WGSL: drop i's phase and lane come from hash(seed, i), y(t) = (phase + speed·t) mod fall height with wind drift, drawn as motion-streak quads sized by scene depth, and refraction samples the layer offset along the streak normal. Any frame renders independently (no checkpoints, parallel-safe); region restriction uses a track matte, and with fx.simulation.emission-masks (D) drops can start from ledges and splash on sills.
  io: >-
    none
  limitations: >-
    Stateless rain cannot pool or accumulate; splashes need collision-surfaces (D). Changing the drop count re-randomizes which drops exist.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Make it rain": select an area, choose the recipe, adjust amount, wind and speed.
    defaults: >-
      Medium rain, slight wind, drop size scaled to region height and output resolution, windows excluded when walls are selected, ground at the region bottom.
    automation: >-
      Builds the matte from the selection and exclusions, scales drops to resolution and links ground level to the region's bottom edge.
    usability_check: >-
      A first-time user makes it rain over a selected wall in ≤3 deliberate actions and under 30 s, and changes wind direction with one drag.
