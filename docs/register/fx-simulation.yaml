    Drip rate and ripple controls keyframable; drip rate can follow audio onsets.
  dependencies: [fx.simulation.deterministic-seeds, fx.simulation.cc-rainfall, fx.simulation.emission-masks]
  implementation: >-
    Stateless WGSL pass: drop events form a hashed Poisson process (per spatial cell and time slot, hash(seed, cell, slot)), each ripple is an analytic damped radial wave limited by longevity, and their heights are summed via a grid of active events, then turned into normals for displacement and shading. Random-access with no checkpoints; simulation-like, since ripples don't reflect or interfere physically (Wave World does).
  io: >-
    none
  limitations: >-
    No wave reflection from obstacles; very high drip rates cost more per pixel.
  disposition: deferred
