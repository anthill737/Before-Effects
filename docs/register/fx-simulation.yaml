# Simulation — Before Effects capability register
# Sources: S02 (effect list + support matrix), S15 (Simulation effects), brief §0, §1, §11C, §11D, §19, §20, §22. Live helpx.adobe.com pages returned HTTP 403 (bot block) on 2026-10-01 for all regional variants; category membership was cross-checked via search-engine listings of S15, but Adobe items were authored from prior knowledge (checked: false) and adobe_support values are best-known, not matrix-verified.

- id: fx.simulation.card-dance
  name: Card Dance
  sources:
    - ref: S02
      item: Card Dance
      category: Simulation
      adobe_support: { gpu: false, bpc: [8], mfr: null }
      checked: false
    - ref: S15
      item: Card Dance
      category: Simulation
      checked: false
  artist_can: >-
    Split a layer into a grid of cards that move, rotate and scale in 3D, each card driven by the brightness of one or two gradient layers, so waves of cards ripple, flip and reveal a back image.
  projection_example: >-
    A facade breaks into tiles aligned to the stone coursing that flip in a wave from left to right, revealing the next scene on their backs.
  controls:
    - { name: "Rows and columns (or grid from region cells)", type: int, animatable: false }
    - { name: "Back layer", type: layer, animatable: false }
    - { name: "Gradient layers 1 and 2", type: layer, animatable: false }
    - { name: "Rotation order and transformation order", type: enum, animatable: false }
    - { name: "Position X/Y/Z (source channel, multiplier, offset)", type: group, animatable: true }
    - { name: "Rotation X/Y/Z (source channel, multiplier, offset)", type: group, animatable: true }
    - { name: "Scale X/Y (source channel, multiplier, offset)", type: group, animatable: true }
    - { name: "Camera system (comp camera, built-in camera, corner pins)", type: enum, animatable: false }
    - { name: "Built-in camera and corner pin values", type: group, animatable: true }
    - { name: "Lighting (type, intensity, color, position, ambient)", type: group, animatable: true }
    - { name: "Material (diffuse, specular, highlight sharpness)", type: group, animatable: true }
  animation: >-
    All multipliers, offsets, camera, light and material values are keyframable and expression-linkable. Motion normally comes from animating the gradient layers (a moving ramp), not from per-card keys.
  dependencies: [proj.layer, anim.keyframe.core, 3d.camera, 3d.light, map.region, fx.generate.gradient-ramp]
  implementation: >-
    Stateless WGSL instanced-quad pass: each card samples the gradient layers at its centre, maps the chosen channel through multiplier × value + offset into a transform, and is drawn as a double-sided quad (front = source cell, back = back-layer cell) through the comp camera with Lambert/Blinn shading in scene-linear rgba16float. Output is a pure function of time and inputs, so frames render in any order and in parallel. Bounds expand to comp size because cards rotate out of the layer rectangle; simulation-like only, there is no physics.
  io: >-
    none
  limitations: >-
    Cards are flat, thickness-free quads with no collisions; chunky falling blocks need fx.simulation.rigid-body-fracture or 3d.extrude.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Particle or simulation plug-in clone with no projection scenario of its own. Smoke, water, particles, rain, snow, shatter, caustics, collapse and rigid-body simulation stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Flip into tiles" recipe → More controls: select a wall, choose "Flip into tiles", pick direction, speed and what appears on the back.
    defaults: >-
      Grid matched to the region (or a detected window/coursing grid), a generated left-to-right gradient sweep over 2 s, back layer = the next scene.
    automation: >-
      Creates and animates the driving gradient precomp, binds the comp camera to the audience viewpoint and aligns the grid to the region bounds.
    usability_check: >-
      A first-time user makes a selected wall flip into tiles revealing a second image, in a chosen direction, in ≤3 deliberate actions and under 60 s.
  acceptance: >-
    Mini scene "tile-flip": 16×10 card wave on a facade region; frames rendered out of order and in parallel hash-match a sequential render.
  status: not-started
  evidence: []

- id: fx.simulation.caustics
  name: Caustics
  sources:
    - ref: S02
      item: Caustics
      category: Simulation
      adobe_support: { gpu: false, bpc: [8], mfr: null }
      checked: false
    - ref: S15
      item: Caustics
      category: Simulation
      checked: false
  artist_can: >-
    Render the look of seeing an image through a rippling water surface: the underlying layer refracts, light focuses into moving caustic patterns, and an optional sky layer reflects on top.
  projection_example: >-
    A plaza wall looks submerged, with bright caustic light crawling over the stone, driven by a Wave World ripple or looping noise.
  controls:
    - { name: "Bottom (layer, scaling, repeat mode, blur)", type: group, animatable: true }
    - { name: "Water surface (height-map layer)", type: layer, animatable: false }
    - { name: "Wave height, smoothing, water depth, refractive index", type: float, animatable: true }
    - { name: "Surface color and opacity", type: group, animatable: true }
    - { name: "Caustics strength", type: float, animatable: true }
    - { name: "Sky (layer, scaling, intensity, convergence)", type: group, animatable: true }
    - { name: "Lighting (type, intensity, color, position, height, ambient)", type: group, animatable: true }
    - { name: "Material (diffuse, specular, highlight sharpness)", type: group, animatable: true }
  animation: >-
    Every value except layer choices is keyframable and expression-linkable. Motion comes from the animated height-map layer (Wave World, fractal noise), sampled at the same time.
  dependencies: [fx.simulation.wave-world, fx.noise-grain.fractal-noise, 3d.light, proj.layer]
  implementation: >-
    Stateless two-stage WGSL pass on a height map: Sobel normals refract view rays (Snell, user index) to offset the bottom-layer lookup, and a compute stage forward-projects a refracted vertex grid onto the bottom plane, accumulating the area ratio (Jacobian) with fixed-point atomics so the sum is order-independent, then blurs it by Smoothing. Only the height-map source can hold state, so Caustics itself is random-access and parallel-safe. Caustic peaks exceed 1.0 in the scene-linear rgba16float buffer so downstream Glow reacts; no bounds expansion (repeat modes handle edges).
  io: >-
    none
  limitations: >-
    Single-surface, single-bounce optics (no dispersion, light shafts or splashes); detail is bounded by height-map resolution. It renders water optics, not a fluid solver: the water moves however the height map moves.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      Reached through the "Turn to water" recipe (Underwater variant) → More controls.
    defaults: >-
      Auto-created looping water height map sized to the region, refractive index 1.33, moderate depth and caustics strength, light from above the audience viewpoint.
    automation: >-
      Builds and links the height-map precomp, loops it seamlessly over the scene and scales ripple size to the region's real dimensions.
    usability_check: >-
      A first-time user makes a selected wall look underwater with moving caustic light in under 45 s, and makes it calmer or rougher with one slider.
  acceptance: >-
    Mini scene "turn-to-water": a single random frame rendered alone hash-matches the same frame from a sequential render, before and after reopening.
  status: not-started
  evidence: []

- id: fx.simulation.foam
  name: Foam
  sources:
    - ref: S02
      item: Foam
      category: Simulation
      adobe_support: { gpu: false, bpc: [8], mfr: null }
      checked: false
    - ref: S15
      item: Foam
      category: Simulation
      checked: false
  artist_can: >-
    Generate bubbles and foam that rise, wobble, stick together, pop and flow around a map, with reflective soap-film surfaces or a custom bubble texture.
  projection_example: >-
    Bubbles stream up from a fountain region and pop at the cornice, sliding around window frames that act as a flow map.
  controls:
    - { name: "View (draft, draft + flow map, rendered)", type: enum, animatable: false }
    - { name: "Producer (point, X/Y size, orientation, production rate)", type: group, animatable: true }
    - { name: "Bubbles (size, size variance, lifespan, growth speed, strength)", type: group, animatable: true }
    - { name: "Physics (initial speed/direction, wind, turbulence, wobble, repulsion, pop velocity, viscosity, stickiness)", type: group, animatable: true }
    - { name: "Zoom and universe size", type: float, animatable: true }
    - { name: "Rendering (blend mode, bubble texture or texture layer, orientation, environment map, reflection strength/convergence)", type: group, animatable: true }
    - { name: "Flow map (layer, steepness, fit, simulation quality)", type: group, animatable: false }
    - { name: "Random seed", type: seed, animatable: false }
  animation: >-
    Producer and physics values are keyframable and expression- or audio-drivable; changes are integrated forward, affecting bubbles from that moment on rather than rewriting earlier ones.
  dependencies: [fx.simulation.particle-system, fx.simulation.cache-checkpoints, fx.simulation.deterministic-seeds, fx.simulation.emission-masks, fx.simulation.collision-surfaces]
  implementation: >-
    Preset of the GPU compute particle engine: bubble particles with neighbour repulsion and stickiness through a uniform-grid hash (cells sorted by key so reductions run in a fixed order), curl-noise turbulence, flow-map gradient forces and pop events at lifespan or overlap; rendered as instanced sphere impostors with Fresnel environment reflection or texture sprites. Stateful fixed-step integration with checkpoints every N frames; seeking replays from the nearest checkpoint and pre-roll fills the start. Simulation-like: heuristic bubble physics, not a liquid or foam solver.
  io: >-
    none
  limitations: >-
    Neighbour interactions make results sensitive to float order: bitwise repeatability is guaranteed on the same GPU/driver (hash-tested), not across vendors, so show machines use baked caches. Not a physical foam simulation.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Particle or simulation plug-in clone with no projection scenario of its own. Smoke, water, particles, rain, snow, shatter, caustics, collapse and rigid-body simulation stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Bubbles" recipe ("Foam up" variant) → More controls.
    defaults: >-
      Emit from the bottom edge of the selected region, 2 s lifespan, soap-film reflection with a neutral environment, fixed seed, 2 s pre-roll so bubbles already fill the frame at the start.
    automation: >-
      Builds the flow map from region geometry (walls block, openings flow), scales bubble size to the region and simulates in the background.
    usability_check: >-
      A first-time user makes bubbles rise from a selected doorway in under 45 s; scrubbing to any frame shows the same bubbles as playback.
  acceptance: >-
    AS-3 reproducibility check: frames 300–310 rendered from a cold start after reopening hash-match the same frames from a full sequential render.
  status: not-started
  evidence: []

- id: fx.simulation.particle-playground
  name: Particle Playground
  sources:
    - ref: S02
      item: Particle Playground
      category: Simulation
      adobe_support: { gpu: false, bpc: [8], mfr: null }
      checked: false
    - ref: S15
      item: Particle Playground
      category: Simulation
      checked: false
  artist_can: >-
    Legacy particle generator: fire dots or text characters from a cannon or grid, explode a layer into particles, replace dots with another layer's frames, push particles with gravity, repel and walls, and drive particle properties from layer maps.
  projection_example: >-
    The letters of a show title pour out of a doorway as particles, or a logo explodes into dust that stops at the wall mask.
  controls:
    - { name: "Cannon → point emitter (position, barrel radius, rate, direction, spread, velocity, color, radius)", type: group, animatable: true }
    - { name: "Grid → grid/glyph emitter (size, particles across/down, text characters)", type: group, animatable: true }
    - { name: "Layer Exploder and Particle Exploder → layer-explode emitter and sub-emitters", type: group, animatable: true }
    - { name: "Layer Map → sprite source with time offset", type: group, animatable: false }
    - { name: "Gravity, Repel, Wall → forces and collision boundary", type: group, animatable: true }
    - { name: "Persistent/Ephemeral Property Mappers → attribute maps from a layer", type: group, animatable: false }
  animation: >-
    As fx.simulation.particle-system: emitter and force values keyframable; attribute maps may be animated layers.
  dependencies: [fx.simulation.particle-system, fx.simulation.emission-masks, fx.simulation.collision-surfaces, text.layer]
  implementation: >-
    No separate engine: "Particle Playground" is a search alias plus presets ("Cannon", "Text grid", "Explode layer") on fx.simulation.particle-system, using its grid/glyph and layer-explode emitters, sub-emitters, region-SDF walls and attribute maps.
  io: >-
    none
  limitations: >-
    Superseded by fx.simulation.particle-system, which covers each useful outcome through the mapping listed in controls. Field rendering and the legacy dialog-based text entry are not reproduced; text comes from a real text layer so it stays editable.
  disposition: superseded
  superseded_by: fx.simulation.particle-system
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      No separate button; outcomes are reached through the "Explode into particles" and "Letters pour out" recipes. Searching "Particle Playground" opens the closest preset.
    defaults: >-
      Recipe defaults of the particle system (emit from selection, fixed seed, pre-roll).
    automation: >-
      Converts the selected text or layer into the matching emitter automatically.
    usability_check: >-
      A first-time user makes a title explode into particles in ≤3 deliberate actions and under 45 s.
  acceptance: >-
    Mini scene "title-explode": text layer exploded through the particle system; seek and reopen give identical frames.
  status: not-started
  evidence: []

- id: fx.simulation.shatter
  name: Shatter
  sources:
    - ref: S02
      item: Shatter
      category: Simulation
      adobe_support: { gpu: false, bpc: [8], mfr: null }
      checked: false
    - ref: S15
      item: Shatter
      category: Simulation
      checked: false
  artist_can: >-
    Break a layer into extruded pieces (bricks, glass, squares, hexagons, triangles, planks, puzzle or a custom map) that blow apart from force points or a gradient, tumble under gravity, and show separate front, side and back textures under 3D camera and lighting.
  projection_example: >-
    A wall explodes outward into bricks matched to the real coursing, then, time-reversed, flies back into place on the downbeat.
  controls:
    - { name: "View (rendered, wireframe, wireframe + forces)", type: enum, animatable: false }
    - { name: "Render (all, layer, pieces)", type: enum, animatable: false }
    - { name: "Pattern (bricks, glass, squares, hexagons, triangles, planks, puzzle, custom map, from regions)", type: enum, animatable: false }
    - { name: "Repetitions, direction, origin, extrusion depth", type: group, animatable: true }
    - { name: "Forces 1 and 2 (position, depth, radius, strength)", type: group, animatable: true }
    - { name: "Gradient (layer, shatter threshold, invert)", type: group, animatable: true }
    - { name: "Physics (rotation speed, tumble axis, randomness, viscosity, mass variance, gravity, direction, inclination)", type: group, animatable: true }
    - { name: "Textures (color, opacity, front/side/back mode and layer)", type: group, animatable: true }
    - { name: "Camera system, lighting and material", type: group, animatable: true }
    - { name: "Seed", type: seed, animatable: false }
  animation: >-
    Force positions, radii, strengths and the gradient threshold are keyframable and beat-snappable; rebuild is produced by time-reversing the shatter through time remap.
  dependencies: [fx.simulation.rigid-body-fracture, fx.simulation.deterministic-seeds, 3d.scene, 3d.camera, 3d.light, 3d.material-pbr, map.region, anim.time-remap]
  implementation: >-
    Fragment geometry is generated in the core from the pattern tiling or seeded Voronoi, clipped to layer alpha and extruded into prisms with front/side/back UVs, then drawn as three.js WebGPU instanced meshes into the comp. Motion matches AE's ballistic model in closed form: a piece's release time comes from force spheres and the gradient threshold, then p = p0 + v0·t + ½g·t² with analytic viscosity damping and ω·t rotation, so every frame is stateless and seekable. A "Collide" option hands the same pieces to fx.simulation.rigid-body-fracture (Rapier, checkpointed); output bounds are comp-sized.
  io: >-
    none
  limitations: >-
    Closed-form mode has no piece-to-piece or floor collisions (as in AE); falling and stacking needs the rigid-body mode. Without a 3D venue model the pieces are a 2.5D illusion that holds only from the audience viewpoint.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      "Shatter and rebuild": select a wall, choose the recipe, then adjust intensity, direction and duration; click on the wall to set where it breaks.
    defaults: >-
      Brick pattern sized from detected coursing or region size, one force at the clicked point, gravity toward the audience floor, 1.5 s explode, 1 s hold, 1.5 s rebuild by time reversal.
    automation: >-
      Creates the shatter, the reverse via time remap, front texture from current content, side texture from a stone material, and a camera bound to the audience viewpoint.
    usability_check: >-
      A first-time user makes a selected wall shatter and rebuild in ≤3 deliberate actions and under 60 s, and scrubbing shows identical pieces on every pass.
  acceptance: >-
    AS-3 (Transformation): wall fragments and reassembles; reopened project and out-of-order frame renders hash-match a sequential render.
  status: not-started
  evidence: []

- id: fx.simulation.wave-world
  name: Wave World
  sources:
    - ref: S02
      item: Wave World
      category: Simulation
      adobe_support: { gpu: false, bpc: [8], mfr: null }
      checked: false
    - ref: S15
      item: Wave World
      category: Simulation
      checked: false
  artist_can: >-
    Simulate water waves on a flat surface: ring and line producers make ripples that spread, reflect off edges and a ground/obstacle map, and decay, output as a grayscale height map to drive Caustics, displacement or lighting.
  projection_example: >-
    Ripples spread from where a performer touches the wall and bounce off the window frames; the height map drives Caustics and Displacement Map for a living water facade.
  controls:
    - { name: "View (wireframe preview, height map)", type: enum, animatable: false }
    - { name: "Wireframe controls (rotation, vertical scale)", type: group, animatable: true }
    - { name: "Height map output (brightness, contrast, gamma, dry areas, transparency)", type: group, animatable: true }
    - { name: "Grid resolution and downsampling", type: int, animatable: false }
    - { name: "Wave speed and damping", type: float, animatable: true }
    - { name: "Reflect edges and pre-roll (seconds)", type: group, animatable: false }
    - { name: "Ground (layer, steepness, height, wave strength)", type: group, animatable: true }
    - { name: "Producers (ring/line, position, size, angle, amplitude, frequency, phase); unlimited count", type: group, animatable: true }
    - { name: "Obstacles from regions", type: region-set, animatable: false }
  animation: >-
    Producer amplitude, frequency and position are keyframable and audio-drivable (drops on beats); edits change the waves from that time forward.
  dependencies: [fx.simulation.cache-checkpoints, fx.simulation.collision-surfaces, fx.simulation.caustics, fx.distort.displacement-map, map.region, audio.analysis]
  implementation: >-
    Stateful height-field solver: the 2D damped wave equation on a GPU grid in WGSL compute (explicit finite-difference leapfrog over two r32float buffers, CFL-limited integer substeps per frame), with ground depth as local wave speed and region SDF walls as reflective or absorbing boundaries. The state is tiny (two height buffers, ~2 MB at 512²), so it is checkpointed every frame into the sim cache; seeks replay from the nearest checkpoint and pre-roll runs before time 0. Output is an rgba16float height map; float32 state keeps long sims stable.
  io: >-
    none
  limitations: >-
    Shallow-water-like 2D waves only: no breaking waves, splashes or 3D volume, and detail is bounded by grid resolution. Output is a height map rather than a finished picture, so the recipe pairs it with Caustics and displacement.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      Reached through the "Turn to water" recipe ("Ripples" variant): click on the canvas to drop ripple sources.
    defaults: >-
      512 grid at comp aspect, a ring producer at each click, 1 s pre-roll, reflecting edges, selected region outlines act as walls, output wired into Caustics and displacement.
    automation: >-
      Builds the obstacle map from region masks, links the height map to downstream effects, places producers at click points and caches the sim in the background.
    usability_check: >-
      A first-time user creates ripples from two clicked points on a wall in under 30 s; scrubbing backwards never stalls more than 1 s at 1080p preview quality.
  acceptance: >-
    Mini scene "ripple-facade": two producers plus window obstacles; 20 random-frame seeks hash-match a sequential render.
  status: not-started
  evidence: []

- id: fx.simulation.cc-ball-action
  name: CC Ball Action
  sources:
    - ref: S02
      item: CC Ball Action
      category: Simulation
      adobe_support: { gpu: null, bpc: [], mfr: null }
      checked: false
    - ref: S15
      item: CC Ball Action
      category: Simulation
      checked: false
  artist_can: >-
    Turn a layer into a grid of shaded 3D balls that take each area's colour, then scatter, twist and rotate the grid in depth.
  projection_example: >-
    A logo on a building dissolves into a field of coloured spheres that twist in depth and then re-form.
  controls:
    - { name: "Grid spacing and ball size", type: float, animatable: true }
    - { name: "Scatter and instability state", type: float, animatable: true }
    - { name: "Rotation axis", type: enum, animatable: false }
    - { name: "Rotation", type: angle, animatable: true }
    - { name: "Twist property", type: enum, animatable: false }
    - { name: "Twist angle", type: angle, animatable: true }
    - { name: "Light (intensity, color, direction)", type: group, animatable: true }
    - { name: "Shading (ambient, diffuse, specular, roughness, metal)", type: group, animatable: true }
  animation: >-
    Scatter, rotation, twist and lighting keyframable; the dissolve-and-reform move is two keys on Scatter.
  dependencies: [fx.simulation.deterministic-seeds, anim.keyframe.core, 3d.camera]
  implementation: >-
    Stateless WGSL instanced sphere-impostor pass: the source layer is sampled on a grid (alpha-culled), each ball is offset by hash(seed, ball id) × scatter and twisted about the chosen axis by the selected property, then shaded in scene-linear light. Random-access and parallel-safe; bounds expand to comp size; despite its category it is not a simulation.
  io: >-
    none
  limitations: >-
    No physics or collisions; balls are impostors, so extreme close-ups show flat silhouettes.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Particle or simulation plug-in clone with no projection scenario of its own. Smoke, water, particles, rain, snow, shatter, caustics, collapse and rigid-body simulation stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Dissolve into dots" recipe → More controls.
    defaults: >-
      Ball spacing ~1% of region width, scatter animated 0 → 40% → 0 over 3 s, soft studio light.
    automation: >-
      Keys the dissolve/reform envelope and scales spacing to the target region.
    usability_check: >-
      A first-time user turns a logo into twisting dots and back in under 45 s using only intensity and duration.
  acceptance: >-
    Mini scene "logo-dots": out-of-order frame renders hash-match a sequential render.
  status: not-started
  evidence: []

- id: fx.simulation.cc-bubbles
  name: CC Bubbles
  sources:
    - ref: S02
      item: CC Bubbles
      category: Simulation
      adobe_support: { gpu: null, bpc: [], mfr: null }
      checked: false
    - ref: S15
      item: CC Bubbles
      category: Simulation
      checked: false
  artist_can: >-
    Fill the frame with rising, wobbling bubbles whose surfaces reflect the layer's own image, with amount, speed, size and shading style.
  projection_example: >-
    Light bubbles drift up the length of a column to suggest the building is underwater.
  controls:
    - { name: "Bubble amount, speed, size", type: float, animatable: true }
    - { name: "Wobble amplitude and frequency", type: float, animatable: true }
    - { name: "Reflection type", type: enum, animatable: false }
    - { name: "Shading type (none, lighten, darken, fade inwards/outwards)", type: enum, animatable: false }
    - { name: "Emit from (region or mask)", type: region-set, animatable: false }
    - { name: "Seed", type: seed, animatable: false }
  animation: >-
    Amount, speed, size and wobble keyframable and audio-drivable.
  dependencies: [fx.simulation.deterministic-seeds, fx.simulation.emission-masks]
  implementation: >-
    Stateless analytic particles in WGSL: bubble i's birth time, start position, speed, size and wobble phase come from hash(seed, i), and its position at time t is closed form (rise + sinusoidal wobble), so any frame renders directly without checkpoints. Drawn as sphere impostors reflecting the source layer with a Fresnel term; bounds comp-sized. Simulation-like: bubbles never interact (Foam covers sticking and popping).
  io: >-
    none
  limitations: >-
    No bubble interaction, popping or flow around obstacles.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Particle or simulation plug-in clone with no projection scenario of its own. Smoke, water, particles, rain, snow, shatter, caustics, collapse and rigid-body simulation stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Bubbles" recipe (default light variant).
    defaults: >-
      Bubbles rise from the bottom of the selection, sized to 1–3% of region height, gentle wobble.
    automation: >-
      Emitter and scale derived from the selected region; switches to Foam when the user enables "Pop and stick".
    usability_check: >-
      A first-time user adds rising bubbles to a selected wall in ≤3 deliberate actions and under 30 s.
  acceptance: >-
    Mini scene "bubble-column": random-frame renders hash-match sequential output.
  status: not-started
  evidence: []

- id: fx.simulation.cc-drizzle
  name: CC Drizzle
  sources:
    - ref: S02
      item: CC Drizzle
      category: Simulation
      adobe_support: { gpu: null, bpc: [], mfr: null }
      checked: false
    - ref: S15
      item: CC Drizzle
      category: Simulation
