# Depth and multi-pass compositing — Before Effects capability register
# Sources: S11 (3D Channel effects incl. ProEXR EXtractoR/IDentifier, depth passes for 3D compositions; checked 2026-10-01), S01 (3D scene depth data), brief §10 (depth and multi-pass), brief architecture (OpenEXR bindings, Depth Anything). Effect entries themselves live in fx.3d-channel.*; these entries cover the pass data and workflows.

- id: pass.depth
  name: Depth pass (units, normalisation, camera association)
  sources:
    - ref: S11
      item: 3D Channel Extract — Z-Depth; Black Point/White Point; Anti-alias; Clamp Output; Invert Depth Map; Depth passes for 3D compositions
      category: 3D Channel
      checked: true
    - ref: S01
      item: Work with 3D scene depth data
      category: Work with 3D composition
      checked: false
    - ref: brief
      item: §10 specify depth units, normalisation, camera association and alpha conventions
      category: Product requirement
      checked: true
  artist_can: >-
    Get a depth image for any 3D scene, nested 3D composition or imported render, in real distances or normalised
    between a near and far value, to drive fog, blur, masks and other effects.
  projection_example: >-
    Fade the far end of the tunnel into haze by driving fog from the tunnel's depth pass.
  controls:
    - { name: Encoding, type: enum(metres|normalised-near-far|inverse), animatable: false }
    - { name: Near / far (black/white point), type: float, animatable: true }
    - { name: Invert, type: bool, animatable: false }
    - { name: Anti-aliased edges, type: bool, animatable: false }
    - { name: Clamp 0–1, type: bool, animatable: false }
    - { name: Camera, type: layer-ref, animatable: false }
  animation: >-
    Near/far keyframable; downstream effects read depth per frame.
  dependencies: [3d.scene, 3d.camera, proj.precompose, 3d.units-scale]
  implementation: >-
    three.js renders view-space linear depth to an r32float target alongside beauty via TSL mrt(). Convention: distance
    along the camera's forward axis in scene metres, background = +infinity, depth not premultiplied, coverage kept
    separately; pass metadata records camera ID, near/far and units. Normalised views are derived in WGSL, so nested
    3D precomps expose depth to downstream effects (the AE "depth from nested composition" workflow).
  io: >-
    Writes EXR Z (float32) via pass.exr-write; reads tagged Z/depth channels from EXR via pass.exr-read.
  limitations: >-
    Anti-aliased depth mixes edge depths (bad for DOF; off by default for DOF). Transparent surfaces write the nearest
    opaque depth only. Imported renders need their camera near/far to convert normalised depth to metres.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      Reached through "Add depth haze" / "Blur by distance" recipes → More controls → Depth.
    defaults: >-
      Metres; near/far fitted to the scene bounds; no anti-aliasing for DOF, anti-aliasing for mattes.
    automation: >-
      Fits near/far to the visible scene automatically, replacing AE's 5000 px default guesswork.
    usability_check: >-
      A user adds depth haze to a 3D scene without touching near/far values and gets a visible gradient in 3 actions.
  acceptance: >-
    Mini scene "depth-ruler": a plane at 5 m reads 5.00 m ± 1 mm in the probe; AS-2 haze.
  status: not-started
  evidence: []

- id: pass.normals
  name: Normals pass and normal-based relighting
  sources:
    - ref: S11
      item: Surface Normals channel (camera-relative, anti-aliased) for relighting
      category: 3D Channel
      checked: true
  artist_can: >-
    Output or read surface normals and use them to relight rendered images, build edge or facing masks, and add
    virtual light sweeps after rendering.
  projection_example: >-
    Add a moving rim light to a pre-rendered statue animation without re-rendering it.
  controls:
    - { name: Space, type: enum(camera|world), animatable: false }
    - { name: Encoding, type: enum(signed-float|packed-0-1), animatable: false }
    - { name: Relight direction, type: vector3, animatable: true }
    - { name: Relight colour / intensity, type: color, animatable: true }
  animation: >-
    Relight direction and intensity keyframable and audio-drivable.
  dependencies: [pass.depth, 3d.renderer, pass.exr-read]
  implementation: >-
    TSL mrt() normal output (rgba16float, signed); relight is a WGSL Lambert/Blinn pass over beauty using the normal pass.
  io: >-
    EXR N channels read/write.
  limitations: >-
    Relighting cannot add shadows or remove baked lighting; it is a look, not a re-render.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      "Add a light sweep" recipe on a 3D render layer.
    defaults: >-
      Soft white light sweeping left to right over 2 s.
    automation: >-
      Detects normal channels in imported EXRs and enables the recipe.
    usability_check: >-
      A user adds a light sweep to an EXR render in under 60 s.
  acceptance: >-
    Mini scene "rim-relight": relit EXR frames match between preview and export.
  status: not-started
  evidence: []

- id: pass.object-id
  name: Object ID mattes
  sources:
    - ref: S11
      item: ID Matte — Aux. Channel (Object ID / Material ID), ID Selection, Feather, Invert, Use Coverage; IDentifier
      category: 3D Channel
      checked: true
    - ref: brief
      item: §10 object/material selection mattes
      category: Product requirement
      checked: true
  artist_can: >-
    Isolate any object in a 3D render by clicking it, to colour-correct, glow or mask just that object.
  projection_example: >-
    Add glow only to the virtual columns of the facade copy without touching the rest of the image.
  controls:
    - { name: Pick object, type: tool, animatable: false }
    - { name: IDs selected, type: int-list, animatable: false }
    - { name: Feather, type: float, animatable: true }
    - { name: Invert, type: bool, animatable: false }
    - { name: Use coverage (anti-aliased), type: bool, animatable: false }
  animation: >-
    Feather keyframable; selection is static per matte.
  dependencies: [3d.scene, fx.3d-channel.id-matte, mask.track-matte]
  implementation: >-
    The renderer writes an r32uint object-ID target (stable IDs from layer and model node path) plus a supersampled
    coverage target, so mattes are anti-aliased; mattes feed the ordinary track-matte system.
  io: >-
    Object IDs also exported as Cryptomatte (pass.cryptomatte) for external tools.
  limitations: >-
    Raw integer ID mattes are aliased without coverage; Cryptomatte is preferred for imported renders.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Compositing-pass tooling for After Effects and Cryptomatte workflows. Depth, normals, position, depth fog, depth matte, depth estimation, render passes and EXR read stay required for depth illusions and Blender renders."
  milestone: D
  beginner:
    action: >-
      "Only this object" — click the object in the viewer, then choose an effect or colour change.
    defaults: >-
      Coverage on, feather 0.
    automation: >-
      Builds the matte and the track-matte routing automatically.
    usability_check: >-
      A user glows one object of a 3D render in 3 actions.
  acceptance: >-
    Mini scene "glow-columns": no fringe above tolerance at object edges in export.
  status: not-started
  evidence: []

