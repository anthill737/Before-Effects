- id: pass.cryptomatte
  name: Cryptomatte read and write
  sources:
    - ref: brief
      item: §10 evaluate multi-channel EXR and Cryptomatte workflows
      category: Product requirement
      checked: true
  artist_can: >-
    Pick objects, materials or assets by clicking or by name in Cryptomatte renders from other tools, and export
    Cryptomattes from the app's own 3D scenes.
  projection_example: >-
    Recolour one character in a Blender-rendered fly-through without re-rendering the shot.
  controls:
    - { name: Layer, type: enum(object|material|asset), animatable: false }
    - { name: Selection (names), type: string-list, animatable: false }
    - { name: Picker add/remove, type: tool, animatable: false }
    - { name: Matte only / preview colours, type: enum(matte|preview), animatable: false }
  animation: >-
    n/a
  dependencies: [pass.exr-read, pass.exr-write, pass.object-id, pass.material-id]
  implementation: >-
    Own implementation of the open Cryptomatte spec (MurmurHash3 name hashes, ranked ID/coverage pairs, JSON manifest):
    decoding of EXR planes via OpenEXR Python bindings in the sidecar; matte extraction in WGSL. Writing ranks from the
    supersampled ID buffer.
  io: >-
    Reads/writes Cryptomatte layers in multi-channel EXR with manifest metadata.
  limitations: >-
    Depends on correct manifests from the source renderer; hash-only files show IDs instead of names.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Compositing-pass tooling for After Effects and Cryptomatte workflows. Depth, normals, position, depth fog, depth matte, depth estimation, render passes and EXR read stay required for depth illusions and Blender renders."
  milestone: D
  beginner:
    action: >-
      Imported EXR with Cryptomatte → "Pick objects" eyedropper.
    defaults: >-
      Object layer; preview colours while picking.
    automation: >-
      Detects Cryptomatte layers on import and offers the picker.
    usability_check: >-
      A user isolates one object from a Blender EXR in under 30 s.
  acceptance: >-
    Mini scene "crypto-recolour" using Blender and the app's own exports; round trip keeps names.
  status: not-started
  evidence: []

- id: pass.exr-read
  name: Multi-channel and multi-part EXR read
  sources:
    - ref: S11
      item: Using channels in OpenEXR files; OpenEXR_channel_map.txt; EXtractoR; ProEXR Comp Creator
      category: 3D Channel
      checked: true
  artist_can: >-
    Open EXRs with many passes, see every layer and channel, extract any channel, and split a file into one layer per
    pass for compositing.
  projection_example: >-
    Rebalance the specular and emission passes of a pre-rendered 3D intro to fit the facade's colour.
  controls:
    - { name: Layer / channel picker, type: enum(dynamic), animatable: false }
    - { name: Split into passes (one layer each), type: action, animatable: false }
    - { name: Channel tagging (depth/normal/ID/UV), type: mapping, animatable: false }
    - { name: Unclamped / background / coverage channels, type: enum(dynamic), animatable: false }
  animation: >-
    n/a (sequence playback)
  dependencies: [proj.project-model, color.input-interpretation]
  implementation: >-
    OpenEXR Python bindings in the sidecar decode parts/channels to half or float planes in shared memory → GPU
    upload; FFmpeg remains for single-part RGBA. Channel naming conventions (Blender, Arnold, V-Ray, Redshift) map to
    semantic tags automatically, replacing AE's channel-map text file.
  io: >-
    Multi-part EXR 2.0, deep data not supported; chromaticities attribute read for colour interpretation.
  limitations: >-
    Deep EXR and very large channel counts at 4K+ are slow; split passes are cached as derived sequences.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      Drop an EXR sequence → "This file has 12 passes — show them as layers?"
    defaults: >-
      Beauty shown, passes available in a pass picker.
    automation: >-
      Recognises common pass names and builds a sum-of-passes comp that reproduces the beauty.
    usability_check: >-
      A user finds and brightens the emission pass in under 60 s.
  acceptance: >-
    Mini scene "pass-split": recombined passes equal beauty within float tolerance.
  status: not-started
  evidence: []

- id: pass.exr-write
  name: Multi-layer EXR write
  sources:
    - ref: brief
      item: §10 expose beauty, alpha, depth and auxiliary outputs; §17 EXR
      category: Product requirement
      checked: true
  artist_can: >-
    Export beauty plus chosen passes (depth, normals, IDs, Cryptomatte, emission…) into one multi-layer EXR sequence.
  projection_example: >-
    Hand a collaborator a pass-separated EXR of the tunnel so they can grade it in another tool.
  controls:
    - { name: Passes to include, type: flags, animatable: false }
    - { name: Compression, type: enum(none|zip|zips|piz|dwaa|dwab), animatable: false }
    - { name: Precision per pass, type: enum(half|float), animatable: false }
  animation: >-
    n/a
  dependencies: [render.codec-exr, pass.render-passes, pass.depth, pass.cryptomatte]
  implementation: >-
    Frames read back from GPU per pass and written by the sidecar with OpenEXR Python bindings (multi-layer,
    chromaticities and camera metadata); single-layer RGBA EXR can use FFmpeg's exr encoder instead.
  io: >-
    EXR sequences with per-frame atomic writes (render.resume-sequence).
  limitations: >-
    Lossy DWA compression changes values; depth/ID passes are forced to lossless.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Compositing-pass tooling for After Effects and Cryptomatte workflows. Depth, normals, position, depth fog, depth matte, depth estimation, render passes and EXR read stay required for depth illusions and Blender renders."
  milestone: D
  beginner:
    action: >-
      "High-quality master" → Advanced → "Include passes".
    defaults: >-
      Beauty + alpha + depth, ZIP, half (float for depth).
    automation: >-
      Forces lossless compression for data passes.
    usability_check: >-
      A user exports beauty+depth EXR without choosing compression.
  acceptance: >-
    Round trip: exported EXR re-imported via pass.exr-read reproduces all passes bit-exact.
  status: not-started
  evidence: []

- id: pass.render-passes
  name: Beauty, alpha and auxiliary render passes from the 3D renderer
  sources:
    - ref: brief
      item: §10 expose beauty, alpha, depth and appropriate auxiliary outputs through the renderer
      category: Product requirement
      checked: true
    - ref: S01
      item: FAQ — "Can I access arbitrary output variables (AOV) for my models or scene?"
      category: Import and add 3D models
      checked: true
  artist_can: >-
    Pull separate emission, diffuse, specular, shadow-only and ambient-occlusion passes from the app's 3D scenes for
    targeted adjustments.
  projection_example: >-
    Boost only the shadow pass of virtual pillars so their shadows read stronger on a bright stone facade.
  controls:
    - { name: Pass, type: enum(beauty|alpha|emission|diffuse|specular|shadow|ao|lighting), animatable: false }
    - { name: Use as layer source, type: action, animatable: false }
  animation: >-
    n/a
  dependencies: [3d.renderer, pass.depth, 3d.shadows]
  implementation: >-
    TSL mrt() outputs for each pass from the same render; AO via the TSL ao node (GTAO); pass list declared so beauty
    equals the documented sum of lighting passes.
  io: >-
    Passes available to compositing and pass.exr-write.
  limitations: >-
    Pass decomposition is approximate for transmission and environment reflections.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      On a 3D object or scene: "Adjust shadows only" / "Adjust glow only" recipes.
    defaults: >-
      Passes rendered only when used.
    automation: >-
      Enables needed MRT outputs automatically from the recipes used.
    usability_check: >-
      A user darkens shadows only, in 3 actions.
  acceptance: >-
    Mini scene "pass-sum": lighting passes recombine to beauty within tolerance.
  status: not-started
  evidence: []

- id: pass.uv
  name: UV (ST-map) pass retexturing
  sources:
    - ref: S11
      item: Texture UV channel (red/green mapping coordinates)
      category: 3D Channel
      checked: true
  artist_can: >-
    Use a UV pass from a render to swap the texture on rendered objects without re-rendering.
  projection_example: >-
    Change the animated graffiti on the walls of a Blender-rendered tunnel after the render is done.
  controls:
    - { name: UV source, type: layer-ref, animatable: false }
    - { name: Texture source, type: layer-ref, animatable: false }
    - { name: Filtering, type: enum(bilinear|bicubic), animatable: false }
  animation: >-
    Texture source may be animated.
  dependencies: [pass.exr-read, proj.precompose]
  implementation: >-
    WGSL ST-map sampling pass using float UV channels; coverage-weighted to reduce edge artefacts.
  io: >-
    Reads UV channels from EXR.
  limitations: >-
    No lighting change; aliasing at UV discontinuities; requires float UV passes.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Compositing-pass tooling for After Effects and Cryptomatte workflows. Depth, normals, position, depth fog, depth matte, depth estimation, render passes and EXR read stay required for depth illusions and Blender renders."
  milestone: D
  beginner:
    action: >-
      "Replace texture" on an EXR layer that has a UV pass.
    defaults: >-
      Bicubic filtering.
    automation: >-
      Detects UV channels and wires the ST-map.
    usability_check: >-
      A user swaps a rendered texture in under 60 s.
  acceptance: >-
    Mini scene "stmap-swap".
  status: not-started
  evidence: []

- id: pass.position
  name: World position pass masks
  sources:
    - ref: brief
      item: §10 relevant render-pass extraction; §15 installation-wide coordinates
      category: Product requirement
      checked: true
  artist_can: >-
    Select parts of a rendered scene by where they are in the venue's 3D space (e.g. "everything above 3 m" or
    "inside this box").
  projection_example: >-
    Light only the virtual geometry above the first-floor line, following the real building's storeys.
  controls:
    - { name: Volume, type: enum(box|sphere|half-space), animatable: true }
    - { name: Volume transform, type: transform3d, animatable: true }
    - { name: Falloff, type: float, animatable: true }
  animation: >-
    Volume transform and falloff keyframable (wipes through space).
  dependencies: [pass.depth, map.venue, 3d.units-scale]
  implementation: >-
    World position reconstructed from depth and camera matrices (or written via mrt()); WGSL volume test producing a soft matte.
  io: >-
    P pass read/write in EXR.
  limitations: >-
    Only works for content with known camera and depth.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      "Wipe through the building" recipe with a 3D wipe gizmo.
    defaults: >-
      Horizontal plane rising from the ground.
    automation: >-
      Aligns the volume to venue axes.
    usability_check: >-
      A user makes a bottom-to-top 3D wipe in under 60 s.
  acceptance: >-
    Mini scene "storey-wipe".
  status: not-started
  evidence: []

