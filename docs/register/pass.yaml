    Generate a depth map from ordinary video or photos so depth fog, blur and masks work on 2D footage.
  projection_example: >-
    Add depth haze to stock drone footage of a forest playing inside a window region.
  controls:
    - { name: Model size, type: enum(small|base|large), animatable: false }
    - { name: Temporal consistency (video), type: bool, animatable: false }
    - { name: Near / far calibration, type: float, animatable: true }
  animation: >-
    Generated depth is a cached sequence; calibration keyframable.
  dependencies: [pass.depth, track.matte-cache]
  implementation: >-
    Python sidecar (CUDA): Depth Anything V2 for stills and Video Depth Anything for temporally stable video depth;
    output cached as float EXR sequences keyed by source hash + model version so preview and export never re-run inference.
  io: >-
    Model downloads: Depth Anything V2 Small ≈100 MB (Apache-2.0); Base ≈390 MB and Large ≈1.3 GB (CC-BY-NC-4.0, fine
    for personal use). Video Depth Anything weights similarly split by licence.
  limitations: >-
    Relative (not metric) depth unless calibrated; flicker on long shots without the video model; slow at 4K.
  disposition: required-integration
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      "Guess depth" on a footage layer, then use any depth recipe.
    defaults: >-
      Small model (fast, permissive licence), video mode for clips.
    automation: >-
      Downloads the model on first use with size shown, runs in the background, caches the result.
    usability_check: >-
      A user adds haze to flat footage in under 3 minutes of interaction (excluding compute).
  acceptance: >-
    Mini scene "drone-haze": cached depth reused for export (no inference during render).
  status: not-started
  evidence: []

