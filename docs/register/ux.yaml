- id: ux.save-state
  name: Autosave, recovery and saved indicator
  sources:
    - ref: brief §0.9
      item: "Autosave, recovery, and a clear indication that work is saved"
      category: "Remove fear, confusion, and unnecessary interruptions"
      checked: true
  artist_can: >-
    Always know your work is saved, and get it back after a crash or power cut with a clear explanation of what was
    recovered.
  projection_example: >-
    After a laptop battery dies on site, reopening shows "Recovered your work up to 21:42 (3 seconds before the
    shutdown)".
  controls:
    - { name: "Saved indicator (status + time)", type: "indicator", animatable: false }
    - { name: "Recovery prompt", type: "dialog", animatable: false }
    - { name: "Versions (restore earlier save)", type: "list", animatable: false }
  animation: >-
    None.
  dependencies: [proj.autosave-recovery, ux.operation-system]
  implementation: >-
    The op journal is appended (fsync'd) after each transaction, with periodic snapshots and atomic file replace for
    the project file. On startup the journal is replayed onto the last snapshot. The indicator reflects
    journal-flushed state.
  io: >-
    Journal and snapshots next to the project (or in app data for unsaved projects).
  limitations: >-
    Media files outside the project are not versioned (relink handles moved files).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      The indicator in the title bar shows "All changes saved · 21:43".
    defaults: >-
      Autosave always on.
    automation: >-
      Full.
    usability_check: >-
      After a forced crash, users recover within 1 minute; at least 90% can say whether their work is saved when
      asked at random moments.
  acceptance: >-
    Mini scene "power-cut".
  status: not-started
  evidence: []

- id: ux.errors
