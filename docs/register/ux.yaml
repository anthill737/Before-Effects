  acceptance: >-
    AS-1, AS-2 and AS-5 physical verification records.
  status: not-started
  evidence: []

- id: ux.action-count-guard
  name: Automated journey and action-count regression checks
  sources:
    - ref: brief §0.10
      item: "Apply a common effect to an existing selection in no more than three deliberate actions"
      category: "Test ease of use"
      checked: true
    - ref: brief §0.10
      item: "Revisit them as features are added"
      category: "Test ease of use"
      checked: true
  artist_can: >-
    Not an artist feature: CI checks that common journeys keep working and don't silently grow extra steps as
    features are added.
  projection_example: >-
    A refactor that adds a dialog to "Trace with light" fails CI because the journey went from 3 to 4 actions.
  controls:
    - { name: "Journey scripts with action budgets", type: "test", animatable: false }
  animation: >-
    None.
  dependencies: [ux.operation-system, ux.action-model]
  implementation: >-
    Playwright-for-Electron scripts drive the §0.10 journeys on the sample assets, counting deliberate user actions
    (clicks, drags, key commands excluding typing in text fields) against per-journey budgets. They also assert the
    default inspector control counts (≤5). Results are recorded per build.
  io: >-
    CI artifacts.
  limitations: >-
    Proves step counts and function, not understanding; it complements and never replaces ux.usability-program.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: A
  beginner:
    action: >-
      N/A (engineering).
    defaults: >-
      N/A.
    automation: >-
      Full.
    usability_check: >-
      CI fails when any common-effect journey exceeds 3 deliberate actions or any default inspector shows more than
      5 primary controls.
  acceptance: >-
    CI green on every milestone.
  status: not-started
  evidence: []

- id: ux.launcher
  name: Double-click launcher and desktop shortcut
  sources:
    - ref: brief
      item: User requirement 2026-10-02 (double-click launcher)
      checked: true
  artist_can: >-
    Start Before Effects by double-clicking one clearly named file in the project folder, or the desktop shortcut, with no terminal or developer tools.
  projection_example: >-
    On show day the operator double-clicks "Before Effects" on the desktop and the studio opens ready to play.
  controls:
    - { name: "Launcher executable (Before Effects.exe in the project root)", type: file, animatable: false }
    - { name: "Desktop shortcut", type: shortcut, animatable: false }
  animation: >-
    Not applicable.
  dependencies: [ux.startup-safety]
  implementation: >-
    Native Win32 launcher (C++, static runtime, no installed dependencies) that resolves its own folder, finds the packaged app (build/app/Before Effects.exe), rebuilds it automatically when sources are newer and the toolchain exists, starts it inside a Windows job object so every background process ends with the app, and reports failures with the log tail. Desktop shortcut created with the Windows shell.
  io: >-
    Writes logs under %APPDATA%\Before Effects\logs.
  limitations: >-
    Windows only. Automatic rebuilds need Node.js and pnpm; without them the last packaged build is launched.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Double-click "Before Effects" (desktop or project folder).
    defaults: >-
      Opens the welcome screen or recovers unsaved work.
    automation: >-
      Builds, checks prerequisites, bundles FFmpeg, and cleans up background processes automatically.
    usability_check: >-
      A first-time user starts the app from the desktop with no instructions, and a deliberately broken install shows an understandable message instead of vanishing.
  acceptance: >-
    Launch from Explorer, from the desktop shortcut and from another working folder; second launch focuses the running window; closing the app leaves no FFmpeg or helper processes.
  status: implemented
  evidence:
    - "launcher: double-click Before Effects.exe from another working folder → packaged app + bundled FFmpeg → UI journey 17/17 (launcher.log, main.log)"
    - "launcher: second launch hands over in 1 s (exit 0); closing leaves 0 app/FFmpeg processes (job object)"
    - "launcher: source change → automatic rebuild with progress window; simulated startup failure → plain-language dialog with Start again / Open log (screenshot ui-test/launcher-startup-failure.png)"

- id: ux.startup-safety
  name: Startup checks, single instance and clean shutdown
  sources:
    - ref: brief
      item: User requirement 2026-10-02 (launcher behaviour)
      checked: true
  artist_can: >-
    Get a clear explanation and a fix when something needed is missing, never a window that flashes and disappears; launching twice just brings the open studio forward.
  projection_example: >-
    If FFmpeg or the graphics driver is missing on a venue laptop, the app says exactly what to install.
  controls:
    - { name: "Open log", type: action, animatable: false }
    - { name: "Try again", type: action, animatable: false }
  animation: >-
    Not applicable.
  dependencies: [ux.errors]
  implementation: >-
    Electron single-instance lock with focus of the existing window; main-process log file; prerequisite checks (WebGPU adapter, FFmpeg bundled or on PATH) surfaced as plain-language screens; child processes (FFmpeg sessions, render workers, assistant CLIs, sidecars) tracked and terminated on quit, with the launcher's job object as a backstop.
  io: >-
    Log files with rotation.
  limitations: >-
    Driver-level GPU failures can only be reported, not fixed.
