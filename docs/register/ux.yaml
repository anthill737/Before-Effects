    Depends on access to hardware and venue; until then, milestones record "not physically verified".
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      N/A (process).
    defaults: >-
      N/A.
    automation: >-
