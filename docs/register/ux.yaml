    after 4 points the window outlines snap onto the windows.
  controls:
    - { name: "Step list with progress", type: "nav", animatable: false }
    - { name: "Current target (number, instruction, picture)", type: "card", animatable: false }
    - { name: "Arrow-key / drag positioning", type: "input", animatable: false }
    - { name: "Fit quality badge", type: "indicator", animatable: false }
  animation: >-
    None.
  dependencies: [map.calibration, map.calibration-3d, map.calibration-residuals, map.calibration-versions, map.scale-reference, out.projector-output]
  implementation: >-
    A step machine: check the projector connection → focus pattern → measurement prompts (only those the chosen
    path needs) → numbered targets (auto-chosen, shown on the projector and highlighted on the photo/model) →
    solve and residual feedback → "Check alignment" pattern → save. Every step is skippable and revisitable.
  io: >-
    The calibration version is saved.
  limitations: >-
    The interface guides measurement but cannot make it accurate. Physical accuracy is tested with real equipment;
    canned examples do not count as proof.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Set up the space → "Line up the projector".
    defaults: >-
      4 points for flat surfaces, more for 3D.
    automation: >-
      Target selection, solve, error display and save.
    usability_check: >-
      Physical field test (not canned): a first-time user reaches the target accuracy (≤3 px RMS flat, ≤4 px 3D) in
      under 15 minutes. Confusion points and help requests are recorded.
  acceptance: >-
    AS-1/AS-2 on real hardware when available.
  status: prototype
  evidence:
    - "journey: projector-output-window step — full-screen output on chosen display at projector resolution, identify/grid/checker/white/black/colors patterns, open/close; display identification overlays. Physical projection NOT yet verified on hardware."

- id: ux.guided-export
  name: Guided export with estimates
  sources:
    - ref: brief §0.8
      item: "A video to share, a high-quality master, a transparent animation, or files for my projector setup; recommend preset and destination; estimate time and size; distinguish rendering, encoding, uploading"
      category: "Make export a guided outcome"
      checked: true
  artist_can: >-
    Export by choosing what you need — "A video to share", "A high-quality master", "A transparent animation", "Files
    for my projector setup" — with a recommended preset and destination, and an estimated time and size.
  projection_example: >-
    "Files for my projector setup → Projector 1 → USB player. About 4 min, 1.1 GB. Save to Exports and send to Google
    Drive."
  controls:
    - { name: "Outcome", type: "choice", animatable: false }
    - { name: "Destination(s)", type: "select", animatable: false }
    - { name: "Range (whole show, scene, work area)", type: "enum", animatable: false }
    - { name: "Advanced settings", type: "expander", animatable: false }
  animation: >-
