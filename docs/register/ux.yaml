- id: ux.auto-media-prep
  name: Automatic media conversion and proxies
  sources:
    - ref: brief §0.6
      item: "Handle media conversion, build proxies; preserve originals; explain visible quality tradeoffs and offer a way to reverse them"
      category: "Automate tedious preparation"
      checked: true
  artist_can: >-
    Drop in any video or image and have it just work — phone videos, odd codecs, huge files — while the originals
    stay untouched and any quality trade-off is explained and reversible.
  projection_example: >-
    A variable-frame-rate phone clip is converted in the background to a smooth editing copy; the note "Using an
    editing copy — original kept" has an "Use original" option.
  controls:
    - { name: "Status per item (original, converted, proxy)", type: "badge", animatable: false }
    - { name: "Use original / use proxy", type: "toggle", animatable: false }
  animation: >-
    None.
  dependencies: [preview.proxy, preview.cache, proj.project-model]
  implementation: >-
    On import, FFmpeg ffprobe checks codec, VFR, colour metadata and alpha. Problem media is transcoded in a
    background job to an edit-friendly mezzanine (constant-frame-rate ProRes/DNxHR or an image sequence), and
    proxies are generated above a resolution/bitrate threshold. Originals are referenced for final renders unless
    the user chooses otherwise. Notices are in plain language with a revert option.
  io: >-
    Mezzanines and proxies live in the project cache.
  limitations: >-
    Conversion takes time and disk space, and both are shown. Some sources (DRM, exotic codecs) can't be read; a
    plain-language error explains why.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Automatic on import, with a small status badge.
    defaults: >-
      Convert when needed; proxies above 4K or a heavy bitrate.
    automation: >-
      Full.
    usability_check: >-
      Dropping a VFR phone video gives smooth scrubbing without the user seeing any codec name (at least 90%).
  acceptance: >-
    Mini scene "vfr-phone-clip".
  status: not-started
  evidence: []

- id: ux.auto-cache
  name: Automatic cache management and background pre-render
  sources:
    - ref: brief §0.6
      item: "Manage caches, and pre-render expensive content in the background when appropriate"
      category: "Automate tedious preparation"
      checked: true
  artist_can: >-
    Never manage caches by hand: the app keeps them within limits, cleans up, and quietly pre-renders heavy parts in
    the background so playback stays smooth.
  projection_example: >-
    While you edit the windows, the heavy tunnel scene finishes pre-rendering, and the next playback is real time.
  controls:
    - { name: "Cache size limits (RAM, disk)", type: "GB[2]", animatable: false }
    - { name: "Background pre-render (on, off)", type: "bool", animatable: false }
    - { name: "Clear cache", type: "action", animatable: false }
  animation: >-
    None.
  dependencies: [preview.cache, render.queue]
  implementation: >-
    An LRU cache with budgets keyed by dependency hashes (frame + node + parameter hash). An idle-time background
    scheduler pre-renders nodes flagged expensive (measured cost) into the disk cache. Invalidation happens
    automatically on dependency change. Low-disk detection trims the cache first.
  io: >-
    Cache folder location is configurable.
  limitations: >-
    Pre-rendering uses GPU and power; it pauses during interactive work and live shows.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Automatic. A small "Preparing 2 heavy parts" indicator.
    defaults: >-
      RAM 25%, disk 50 GB, background on.
    automation: >-
      Full.
    usability_check: >-
      No participant needs to clear a cache manually during the 20-minute task, and the disk cache stays under
      budget.
  acceptance: >-
    AS-6 (editing continues during long renders).
  status: not-started
  evidence: []

- id: ux.performance-advisor
  name: Bottleneck finder and quality trade-off advisor
  sources:
    - ref: brief §0.6
      item: "Find performance bottlenecks; explain visible quality tradeoffs and offer a way to reverse them"
      category: "Automate tedious preparation"
      checked: true
    - ref: brief §18
      item: "Profiling; a fast but visually different preview must identify its compromises"
      category: "Preview, performance, and show operation"
      checked: true
  artist_can: >-
    When playback stutters, see in plain words what is slow and one-click fixes (pre-render this scene, lower preview
    quality for particles), with every compromise labelled and reversible.
  projection_example: >-
    "Preview is slow because of the particle storm (14 ms per frame). Prepare it in the background? Or preview
    particles at half amount?"
  controls:
    - { name: "Advisor panel", type: "view", animatable: false }
    - { name: "Fix actions (pre-render, preview quality, proxy)", type: "action", animatable: false }
    - { name: "Active compromises list (revert)", type: "list", animatable: false }
  animation: >-
    None.
  dependencies: [preview.cache, preview.proxy, ux.auto-cache]
  implementation: >-
    Per-pass GPU timing via WebGPU timestamp queries (where available), plus CPU, decode and cache-miss timing per
    node. A rules engine maps bottlenecks to fixes. Preview compromises are tracked as a list shown on the canvas
    ("Preview: particles 50%").
  io: >-
    Profiles are exportable for diagnosis.
  limitations: >-
    Timestamp queries may be unavailable or coarse on some drivers; it falls back to CPU-side timing.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      A "Why is this slow?" link appears when preview drops below real time.
    defaults: >-
      Shown on frame drops.
    automation: >-
      Diagnosis and fix suggestions.
    usability_check: >-
      When preview drops below real time, at least 4 of 5 users restore real-time playback with the advisor, without
      technical vocabulary.
  acceptance: >-
    AS-6.
  status: not-started
  evidence: []

- id: ux.auto-output-settings
  name: Automatic compatible output settings
  sources:
