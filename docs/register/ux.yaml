    fuzzy lexical search (MiniSearch), and a small local sentence-embedding model (ONNX via onnxruntime) for
    semantic matching. Results are re-ranked by selection compatibility. Failed queries are logged locally to improve
    the phrase index. The AI assistant is an optional extra route, not a dependency.
  io: >-
    None.
  limitations: >-
