# Guided experience — Before Effects capability register
# Sources: brief §0.1–§0.10 (user-experience requirements), §2, §3, §5, §17, §18, §20, §21. Product-only requirements; checked against the brief 2026-10-01. Accessibility targets reference WCAG 2.2 AA.

- id: ux.operation-system
  name: Operation system (typed, undoable operations)
  sources:
    - ref: brief §0.7
      item: "Use the same operation system as the visual controls, with reliable undo"
      category: "Plain-language creative assistance"
      checked: true
    - ref: brief §20
      item: "Build the guided operation system alongside the engine so ease of use is structural"
      category: "Architecture and build rules"
      checked: true
  artist_can: >-
    Every change — from a click, a recipe, a script or the assistant — is the same kind of small, named, undoable
    step. Nothing is magic, and anything can be undone, repeated or applied elsewhere.
  projection_example: >-
    "Light up windows" appears in history as one step that undoes cleanly, whether it came from the library, a
    keyboard shortcut or the assistant.
  controls:
    - { name: "History list (plain-language labels)", type: "view", animatable: false }
  animation: >-
    Ops create and edit keyframes, expressions and recipe instances; they are not animation themselves.
  dependencies: [proj.project-model, proj.undo-redo]
  implementation: >-
    Core TS: defineOp({type, version, schema (Zod), label(params) → plain words, scope, apply(draft, params) →
    inverse, coalesceKey}). Transactions group ops. State is immutable snapshots with structural sharing. The op
    journal feeds autosave/recovery. The registry exports JSON Schema via z.toJSONSchema for scripts and the MCP
    server. Versioned op migrations. Drags coalesce into one undo step per gesture. Ops are deterministic and
    tested headless under Node.
  io: >-
    The op journal is persisted for recovery; op logs can be exported for bug reports.
  limitations: >-
    Ops must be complete and deterministic; non-deterministic sources (live input) must be recorded first.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: A
  beginner:
    action: >-
      Invisible: users only see that everything undoes with Ctrl+Z, with readable names in History.
    defaults: >-
      Unlimited undo within the session, with the journal persisted.
    automation: >-
      Coalescing, labels and journaling.
    usability_check: >-
      Automated property test over every registered op: apply then inverse gives the identical state hash. §0.10:
      users undo a mistaken change without assistance (at least 95%).
  acceptance: >-
    All acceptance shows depend on it. Mini scene "op-roundtrip": a random op sequence of 10k steps undone to the
    original hash.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: ux.recipe-engine
  name: Recipe engine (editable generated outcomes)
  sources:
    - ref: brief §0.1
      item: "The app creates the necessary masks, paths, layers, keyframes, expressions, geometry, materials, and routing"
      category: "Design around the result the user wants"
      checked: true
    - ref: brief §0.4
      item: "Advanced edits must not silently get overwritten by a preset change"
      category: "Reveal depth progressively"
      checked: true
    - ref: brief §19
      item: "Do not ship these as opaque canned movies"
      category: "Projection-specific creative tools"
      checked: true
  artist_can: >-
    Apply complete effects ("Trace with light") made of real layers, keyframes, effects and expressions. Change the
    simple controls later, and keep your custom edits when the recipe regenerates.
  projection_example: >-
    After hand-tweaking one window's timing, changing the recipe's overall speed keeps that tweak and marks it as
    custom.
  controls:
    - { name: "Recipe primary controls (3–5)", type: "mixed", animatable: true }
    - { name: "Reset property / reset all to recipe", type: "action", animatable: false }
    - { name: "Detach (convert to plain layers)", type: "action", animatable: false }
  animation: >-
    Recipes generate keyframes and expressions. Primary controls are themselves animatable, as expression controls.
  dependencies: [ux.operation-system, expr.engine, expr.rigs, proj.effect-stack]
  implementation: >-
    A recipe is a versioned TS module: parameter schema (primary + more), target signature (role types and counts),
    and generate(params, targets, context) → op batch. Generated items are tagged {recipeInstanceId, slot}.
    Regeneration does a 3-way merge between the last generated output, the current state and the new output.
    Properties changed by the user become overrides that are kept and flagged. Recipes declare relative units for
    rebinding (ux.auto-adapt).
  io: >-
    Recipe instances are saved in the project with version and overrides. Recipes can be exported/imported as
    packages.
  limitations: >-
    A structural edit (deleting a generated layer) may block a primary control; the UI explains which control and
    offers "Reset this part" (ux.override-indicator).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: A
  beginner:
    action: >-
      Every library item is a recipe: pick it, adjust 3–5 controls, then "More controls" / "Edit animation".
    defaults: >-
      Each recipe ships with tuned defaults and adapts to the target.
    automation: >-
      Generation, regeneration with merge, and override tracking.
    usability_check: >-
      Automated: apply → edit a keyframe → change speed keeps the edit and flags it. At least 4 of 5 users find
      "Reset to recipe" for one property when asked.
  acceptance: >-
    AS-1, AS-3. Mini scene "override-survives-regenerate".
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: ux.action-model
  name: Result-first action model (select → choose → adjust → see)
  sources:
    - ref: brief §0.1
      item: "Select the thing to change, choose what it should do, adjust a few understandable controls, and see the result immediately"
      category: "Design around the result the user wants"
      checked: true
  artist_can: >-
    Work by outcome: select something on the building, pick what it should do, tweak a few controls, and see it
    happen — without assembling layers by hand.
  projection_example: >-
    Click the roofline → "Trace with light" → choose colour and speed → it plays immediately.
  controls:
    - { name: "Action menu for the current selection (contextual)", type: "menu", animatable: false }
  animation: >-
    Actions generate editable animation.
  dependencies: [ux.recipe-engine, ux.effect-library, ux.canvas-direct, ux.inspector]
  implementation: >-
    The selection type (regions, groups, layers, scenes, audio) filters the recipe catalogue to applicable actions,
    ranked by fit and recent use. The chosen action applies as a transaction with live preview (ux.live-preview-apply),
    then the inspector shows its primary controls.
  io: >-
    None.
  limitations: >-
    Outcomes the library doesn't cover need detailed tools or the assistant; the action menu says so ("Not here?
    Try search or Edit animation").
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: A
  beginner:
    action: >-
      Right-click or the "What should this do?" button next to the selection.
    defaults: >-
      The top 6 actions shown for the selection type.
    automation: >-
      Filtering and ranking.
    usability_check: >-
      §0.10: apply a common effect to an existing selection in no more than three deliberate actions, excluding
      optional customization (measured from action logs, at least 80% of participants).
  acceptance: >-
    Milestone A interaction prototype; §0.10 journeys.
  status: not-started
  evidence: []

- id: ux.guided-workflow
  name: Guided route through a show
  sources:
    - ref: brief §0.2
      item: "Set up the space → Add content → Animate → Preview → Export or Play; show the current result and the next useful action"
      category: "Clear, flexible route through a show"
      checked: true
  artist_can: >-
    Follow a clear route (Set up the space → Add content → Animate → Preview → Export or Play), always see the next
    useful step, jump freely between steps, and skip hardware setup when only designing.
  projection_example: >-
    A designer without a projector skips calibration, designs on the photo, exports a master, and does calibration
    on site later.
  controls:
    - { name: "Step bar (5 steps with status)", type: "nav", animatable: false }
    - { name: "Next suggested action", type: "card", animatable: false }
    - { name: "Design without a projector", type: "bool", animatable: false }
  animation: >-
    None.
  dependencies: [ux.operation-system, map.venue, ux.guided-calibration, ux.guided-export]
  implementation: >-
    The step bar is derived from project state (venue exists? projector calibrated? content? exports?), not from a
    forced wizard. The next-action card comes from a rules table over that state. Steps are views over the same
    project (ux.single-project).
  io: >-
    None.
  limitations: >-
    Suggestions are heuristic, and the user can dismiss them.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Always visible at the top of the window.
    defaults: >-
      New projects start at "Set up the space", with the sample offered.
    automation: >-
      Status and suggestions.
    usability_check: >-
      §0.10: with supplied assets, at least 80% of first-time users create and preview an animated effect on a
      surface within 5 minutes without external instructions.
  acceptance: >-
    Milestone B guided path, end to end.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: ux.starter-scenes
  name: Starter scenes and editable sample on first launch
  sources:
    - ref: brief §0.2
      item: "Provide useful starter scenes and an immediately editable sample"
      category: "Clear, flexible route through a show"
      checked: true
  artist_can: >-
    Start by playing with a working example instead of a blank screen, or pick a starter space that matches the job.
  projection_example: >-
    First launch shows the Town Hall sample playing, with "Change the window colour" as the first suggestion.
  controls:
    - { name: "Start screen (sample, starter spaces, recent projects, blank)", type: "view", animatable: false }
  animation: >-
    None.
  dependencies: [tool.starter-content, ux.guided-workflow]
  implementation: >-
    The start screen loads the content pack (tool.starter-content) as copies, with a one-line hint overlay on the
    sample. Recent projects show animated thumbnails.
  io: >-
    None.
  limitations: >-
    None.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      The start screen's first card is "Try the sample".
    defaults: >-
      The sample opens playing.
    automation: >-
      Copy-on-open.
    usability_check: >-
      From launch to the first visible edit in the sample takes under 60 seconds for at least 90% of first-time users.
  acceptance: >-
    §0.10 journeys.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: ux.import-paths
  name: Import paths with honest explanations
  sources:
    - ref: brief §0.2
      item: "Offer an import path for a photo/reference, venue model, or simple shape, and explain only the input needed for that path"
      category: "Clear, flexible route through a show"
      checked: true
  artist_can: >-
    Choose how to describe the space — photo, 3D model or simple shape — and see in one screen what that path needs
    and what it can and cannot give you.
  projection_example: >-
    The photo card says: "Good for tracing windows and edges. It doesn't tell us the building's depth or where your
    projector is — you'll align on site."
  controls:
    - { name: "Path cards (photo, model, simple shape)", type: "choice", animatable: false }
  animation: >-
    None.
  dependencies: [map.photo-trace, map.venue-import, map.venue-proxy]
  implementation: >-
    Three cards, each with "You need", "You get" and "Not included". Copy is maintained in a reviewed string table.
    Each card leads into its map.* flow.
  io: >-
    None.
  limitations: >-
    None.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Set up the space → choose a card.
    defaults: >-
      "Photo" is highlighted when no model is known.
    automation: >-
      None.
    usability_check: >-
      Given 3 scenario descriptions, at least 80% of users choose the right path. In a follow-up question, none
      believes a photo alone aligns the projector.
  acceptance: >-
    Milestone B guided path.
  status: implemented
  evidence:
    - "journey: uitest photo-new-project, trace-rect-window, find-similar-windows (5/5 found), trace-roofline, keep-light-off, correct-outline (+undo), animate-own-windows, projector-respects-keep-off, save-close-reopen — on a generated photo of a different building"

- id: ux.canvas-direct
  name: Canvas-central direct manipulation
  sources:
    - ref: brief §0.3
      item: "Select physical regions and creative objects directly in the preview; drag to position, resize, rotate, reshape; snapping, alignment guides, readable handles, forgiving hit targets"
      category: "Keep the canvas central"
      checked: true
  artist_can: >-
    Select regions and creative objects right on the preview, and drag, resize, rotate and reshape them with snapping,
    alignment guides, readable handles and generous click targets.
  projection_example: >-
    Drag a text block onto a column; it snaps to the column centre, and a guide shows it aligned with the next column.
  controls:
    - { name: "Selection, transform handles", type: "gizmo", animatable: false }
    - { name: "Snapping (regions, edges, guides, grid)", type: "flags", animatable: false }
    - { name: "Alignment guides", type: "bool", animatable: false }
  animation: >-
    Dragging with auto-key on creates keyframes. Otherwise it edits static values.
  dependencies: [ux.operation-system, map.edge-snap, map.region]
  implementation: >-
    A canvas interaction layer over the WebGPU viewport, with GPU picking via an ID buffer (pass.object-id
    infrastructure) for exact hits on regions, layers and paths, plus a hit-slop expansion (≥24 px targets per WCAG
    2.5.8). The selection outline is drawn in a high-contrast style. Snapping is computed in content space and shown
    with labels.
  io: >-
    None.
  limitations: >-
    Dense overlapping objects need a "select underneath" cycle (Alt+click).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Click and drag on the canvas.
    defaults: >-
      Snapping and guides on.
    automation: >-
      Snapping and alignment.
    usability_check: >-
      Mis-click rate under 5% when selecting 8 small windows at default zoom. Users align a layer to a region edge in
      under 10 seconds.
  acceptance: >-
    Milestone A prototype; milestone B journeys.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: ux.draw-on-surface
  name: Draw paths directly on surfaces
  sources:
    - ref: brief §0.3
      item: "Draw paths directly on relevant surfaces"
      category: "Keep the canvas central"
      checked: true
  artist_can: >-
    Draw paths and shapes straight onto the building in the preview (photo or 3D view), and they stay on the surface
    in perspective.
  projection_example: >-
    Draw a wavy line across two walls of the 3D venue; it wraps around the corner as one path.
  controls:
    - { name: "Pen / freehand / shape tools", type: "tool", animatable: false }
    - { name: "Surface lock (stay on surface)", type: "bool", animatable: false }
  animation: >-
    Drawn paths animate like any path (trim, morph).
  dependencies: [shape.path, map.uv-content-space, map.edge-snap]
  implementation: >-
    Pointer rays are cast onto venue geometry (three.js raycaster/BVH). Points are stored in surface UV space,
    curves are evaluated in UV, and rendering goes through the content pipeline. Crossing surface seams splits the
    path into linked segments.
  io: >-
    None.
  limitations: >-
    Paths across UV seams on complex models may need cleanup.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Pick the pen and draw on the building.
    defaults: >-
      Surface lock on, snapping on.
    automation: >-
      Projection to surface and seam handling.
    usability_check: >-
      Users draw a path along a roofline in the 3D venue that stays on the surface (automated distance check) in
      under 1 minute.
  acceptance: >-
    AS-1.
  status: implemented
  evidence:
    - "journey: uitest photo-new-project, trace-rect-window, find-similar-windows (5/5 found), trace-roofline, keep-light-off, correct-outline (+undo), animate-own-windows, projector-respects-keep-off, save-close-reopen — on a generated photo of a different building"

- id: ux.live-preview-apply
  name: Preview before committing
  sources:
    - ref: brief §0.3
      item: "Preview effects before committing"
      category: "Keep the canvas central"
      checked: true
    - ref: brief §0.9
      item: "Reversible previews"
      category: "Remove fear, confusion, and unnecessary interruptions"
      checked: true
  artist_can: >-
    Hover or step through looks and see each one on your selection right away, then commit the one you like or
    escape back without leaving anything behind.
  projection_example: >-
    Arrow through 8 window looks and watch each one play on the windows; Enter keeps "Neon pulse", Esc goes back.
  controls:
    - { name: "Preview on hover / on focus", type: "bool", animatable: false }
    - { name: "Apply (Enter) / cancel (Esc)", type: "action", animatable: false }
  animation: >-
    The preview plays the recipe's default animation.
  dependencies: [ux.operation-system, ux.effect-library, preview.cache]
  implementation: >-
    A provisional transaction is applied to a copy-on-write branch of the project state and rendered. It is
    discarded on cancel, or committed as one transaction (one undo step). The preview starts from cached thumbnails
    while the real evaluation compiles.
  io: >-
    None.
  limitations: >-
    Heavy recipes (simulations) preview at reduced quality first, and this is labelled.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Hover or arrow-key through library items with something selected.
    defaults: >-
      Preview on.
    automation: >-
      Branching and discard.
    usability_check: >-
      Users try at least 3 looks and revert, leaving undo history unchanged (logged). Time to first preview frame is
      under 200 ms for cached items.
  acceptance: >-
    Milestone B journeys.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: ux.inspector
  name: Contextual inspector
  sources:
    - ref: brief §0.3
      item: "A focused contextual inspector with the controls relevant to the selection; avoid deep property trees and nested dialog chains"
      category: "Keep the canvas central"
      checked: true
  artist_can: >-
    See only the controls that matter for what is selected, in plain words, without digging through property trees
    or dialogs.
  projection_example: >-
    Selecting a trace shows Colour, Speed, Trail, Glow and Order; selecting a window region shows Name, Type and
    "What should this do?".
  controls:
    - { name: "Primary controls", type: "panel", animatable: false }
    - { name: "More controls", type: "expander", animatable: false }
  animation: >-
    Keyframe toggles appear next to animatable controls in "Edit animation" mode.
  dependencies: [ux.progressive-disclosure, ux.recipe-engine]
  implementation: >-
    Inspector descriptors come from op/recipe schemas (labels, units, ranges, groups, primary flag). React panels are
    rendered generically from the descriptors, with custom widgets for colour, curves and points. Default view depth
    is at most 2.
  io: >-
    None.
  limitations: >-
    None.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Select anything; the inspector shows its controls.
    defaults: >-
      Primary controls only.
    automation: >-
      Descriptor-driven layout.
    usability_check: >-
      Users find the speed control of a selected trace in under 10 seconds. An automated audit confirms default
      nesting depth ≤2 for all recipes.
  acceptance: >-
    Milestone B journeys.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: ux.enlarge-panels
  name: Enlargeable canvas and timeline
  sources:
    - ref: brief §0.3
      item: "Make the canvas and timeline easy to enlarge"
      category: "Keep the canvas central"
      checked: true
    - ref: brief §0.9
      item: "Adjustable layout"
      category: "Remove fear, confusion, and unnecessary interruptions"
      checked: true
  artist_can: >-
    Make the canvas or timeline fill the window with one key, move panels to a second monitor, and keep the layout
    you like.
  projection_example: >-
    Maximise the canvas to check details on the facade, then toggle back to the timeline view for timing.
  controls:
    - { name: "Maximise panel (toggle)", type: "action", animatable: false }
    - { name: "Detach panel to window", type: "action", animatable: false }
    - { name: "Saved layouts", type: "select", animatable: false }
  animation: >-
    None.
  dependencies: [ux.accessibility]
  implementation: >-
    A dockable layout (e.g. a React docking library or a custom split-pane tree) with persisted per-user layouts.
    Detached panels are separate BrowserWindows sharing state through the store. The ` key maximises the hovered
    panel.
  io: >-
    Layouts saved in user settings.
  limitations: >-
    Panels never go to projector displays (show.control-isolation).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      A maximise button on each panel, or the ` key.
    defaults: >-
      Canvas-dominant layout.
    automation: >-
      None.
    usability_check: >-
      Users maximise the canvas and restore it in ≤2 actions without help.
  acceptance: >-
    Milestone B journeys.
  status: implemented
  evidence:
    - "journey: uitest steps resolution-full/half/quarter/eighth/auto (exact canvas sizes 1920×1080 → 240×135), zoom-is-display-only, view-3d/projector/show with pixel checks, frame-step, loop-range, cache-first-playback (30/30 fps, 0 skipped), edit-invalidates-only-affected, enlarge, pop-out; export at full size after Quarter preview"
    - "unit: core invalidation tests (affectedByPatches)"

- id: ux.scene-timeline
  name: Scene timeline for assembling a show
  sources:
    - ref: brief §0.10
      item: "Assemble a short three-scene show, add music, and start a compatible export in twenty minutes"
      category: "Test ease of use"
      checked: true
    - ref: brief §0.4
      item: "Provide 'More controls' and 'Edit animation' for detailed settings, curves, layers"
      category: "Reveal depth progressively"
      checked: true
  artist_can: >-
    Build the show as scene blocks laid over the music — drag to reorder, stretch to retime, snap to beats — and
    open any block into the full layer timeline when needed.
  projection_example: >-
    Three blocks — "Windows wake up", "Tunnel", "Collapse" — snapped to the song's sections, with transitions between
    them.
  controls:
    - { name: "Scene blocks (order, length)", type: "timeline", animatable: false }
    - { name: "Music track with sections and beats", type: "track", animatable: false }
    - { name: "Transitions between blocks", type: "chip", animatable: false }
    - { name: "Open in full timeline", type: "action", animatable: false }
  animation: >-
    Retiming a block retimes its generated animation (recipes adapt; manual keyframes scale or keep timing by
    choice).
  dependencies: [proj.composition, proj.precompose, audio.analysis, ux.recipe-engine, tool.region-transition]
  implementation: >-
    Scenes are nested compositions shown as blocks on a simplified track view. Music sections come from
    audio.analysis (novelty/segment detection) and beats from the beat grid. Retiming uses time-remap or recipe
    regeneration. It is the same data as the full timeline (ux.single-project).
  io: >-
    None.
  limitations: >-
    Section detection can be wrong; sections are editable markers.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      The Animate step shows scene blocks under the canvas; "Add scene" duplicates or starts from a recipe.
    defaults: >-
      Blocks snap to music sections and bars.
    automation: >-
      Section detection, snapping and fitting.
    usability_check: >-
      §0.10: first-time users assemble a three-scene show, add music and start a compatible export within
      20 minutes using supplied assets, with computation and upload waiting measured separately.
  acceptance: >-
