  dependencies: [ux.auto-output-settings, out.projector-video, render.queue, deliver.local, deliver.google-drive, deliver.reveal]
  implementation: >-
    Outcome → preset → destination flow. Estimates come from measured per-frame cost of the snapshot (sampled frames
    rendered during setup) and encoder bitrate models; they refine during the job. Progress is split into labelled
    phases (Rendering, Encoding, Uploading). The last choices per outcome are remembered.
  io: >-
