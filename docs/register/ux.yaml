    defaults: >-
      As described.
    automation: >-
      Flag-driven.
    usability_check: >-
      At most one confirmation dialog in the 20-minute journey, excluding the upload. An automated check finds no
      confirm dialog on any reversible command.
  acceptance: >-
    §0.10 journeys.
  status: not-started
  evidence: []

