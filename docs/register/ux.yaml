      category: "Make export a guided outcome"
      checked: true
  artist_can: >-
    Get export settings that will actually play where you need them (projector USB player, media server, phone,
    Drive preview), with one plain sentence explaining the choice.
  projection_example: >-
    "H.264, 1920×1080, 30 fps — plays on most projector USB players." HAP is chosen automatically for the media
    server preset.
  controls:
    - { name: "Target (share, projector USB player, media server, master, transparent)", type: "enum", animatable: false }
    - { name: "Advanced settings (codec, pixel format, colour, audio)", type: "expander", animatable: false }
  animation: >-
    None.
  dependencies: [render.encode, out.projector-video, ux.guided-export]
