- id: ux.usability-program
  name: Usability testing program and metrics
  sources:
    - ref: brief §0.10
      item: "Proposed initial usability targets; record completion rates, time, confusion points, required help, and recovery from mistakes"
      category: "Test ease of use"
      checked: true
  artist_can: >-
    Not an artist feature: the process proving the app is easy, by testing representative first-time users against
    the §0.10 targets at every milestone.
  projection_example: >-
    A milestone B round of 5 first-time users runs the 5-minute and 20-minute journeys on the sample assets; results
    and confusion points are filed as evidence.
  controls:
    - { name: "Test plan, task scripts, consent, result sheet", type: "docs", animatable: false }
    - { name: "Opt-in local session logging", type: "bool", animatable: false }
  animation: >-
    None.
  dependencies: [tool.starter-content, ux.action-count-guard]
  implementation: >-
    Rounds of 5–8 first-time participants per milestone (B onward; prototypes in A), think-aloud, plus opt-in local
    action logs (op journal + UI events, never uploaded automatically) to measure time, action counts and errors.
    Results are stored under docs/usability/ and linked as evidence in register entries.
  io: >-
    Local logs only.
  limitations: >-
    Targets are design goals, not measured claims. Automated UI tests cannot establish novice understanding. Small
    samples give direction, not statistics.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: A
  beginner:
    action: >-
      N/A (process).
    defaults: >-
      N/A.
    automation: >-
      Metric extraction from logs.
    usability_check: >-
      The §0.10 targets: (1) animated effect on a surface in 5 min; (2) three-scene show + music + export started in
      20 min, computation/upload measured separately; (3) a common effect on a selection in ≤3 deliberate actions;
      (4) no expressions, node graph, codec or UV/premultiplication knowledge needed; (5) undo a mistake and find the
      saved/exported result unaided.
  acceptance: >-
    A usability report per milestone in docs/usability/.
  status: not-started
  evidence: []

- id: ux.field-test
  name: Physical setup testing with real equipment
  sources:
