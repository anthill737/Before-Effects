      category: "Remove fear, confusion, and unnecessary interruptions"
      checked: true
  artist_can: >-
    When something goes wrong, read what happened in plain words, see which item is affected, and fix it with a
    button (relink, substitute font, retry, use a compatible preset). Technical details are available if wanted.
  projection_example: >-
