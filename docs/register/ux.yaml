      item: "Test physical setup separately with the actual installation and equipment; do not count a canned example as proof of easy calibration"
      category: "Test ease of use"
      checked: true
  artist_can: >-
    Not an artist feature: the field test protocol that measures how easy and accurate real-world setup and
