  controls:
    - { name: "Message, affected item link, action buttons", type: "card", animatable: false }
    - { name: "Details (raw log)", type: "expander", animatable: false }
  animation: >-
    None.
  dependencies: [ux.operation-system]
  implementation: >-
    A typed error catalogue (code, plain message template, affected-item reference, actions as op/command IDs, raw
    detail). Every subsystem (media, render, encode, upload, expressions, AI) must map its errors into the catalogue.
    A lint fails unmapped error paths. Clicking the affected item selects it.
  io: >-
    Error logs saved locally for diagnosis.
  limitations: >-
    Unknown errors fall back to a generic card with details and "Copy report".
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Error cards appear next to the affected item and in the notifications list.
    defaults: >-
      Details collapsed.
    automation: >-
      Suggested fix ranking.
    usability_check: >-
      For 5 injected failures (missing file, missing font, encoder failure, disk full, upload failed), at least 80% of
      users resolve each without help.
  acceptance: >-
    AS-7 (relink). Mini scene "five-failures".
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: ux.confirmations
  name: Confirmations only when warranted
  sources:
    - ref: brief §0.9
      item: "Use confirmations when warranted by irreversible loss or external sharing, not for routine reversible edits"
      category: "Remove fear, confusion, and unnecessary interruptions"
      checked: true
  artist_can: >-
    Work without "Are you sure?" interruptions for normal edits (they can be undone), and get a clear confirmation
    only when something can't be undone or when sharing outside the PC.
  projection_example: >-
    Deleting a scene shows "Deleted — Undo"; overwriting a file on disk or uploading to a new Drive folder asks first.
