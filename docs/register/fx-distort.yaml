- id: fx.distort.mesh-warp
  name: Mesh Warp
  sources:
    - ref: S02
      item: Mesh Warp
      category: Distort
      adobe_support: { gpu: false, bpc: [8, 16], mfr: true }
      checked: true
    - ref: S12
      item: Mesh Warp
      category: Distort
      checked: true
  artist_can: >-
    Lay a grid of Bezier patches over a layer and drag vertices and tangents to bend areas freely; animate the grid over time.
  projection_example: >-
    A panel bulges and sags in specific places, or one window shape morphs into another during a transition.
  controls:
    - { name: "Rows, Columns (up to 31)", type: "int[2]", animatable: false }
    - { name: "Quality", type: "int(1-10)", animatable: false }
    - { name: "Distortion Mesh (vertices + tangents)", type: mesh, animatable: true }
  animation: >-
    The Distortion Mesh is keyframed per vertex and tangent with interpolation, and recipes can drive it by expression.
  dependencies: [anim.keyframe.core, anim.graph-editor, map.region, proj.effect-stack]
  implementation: >-
    A Bezier-patch grid is tessellated in the TS core and drawn with warp.mesh. Patch boundaries clamp vertices to prevent fold-over,
    matching Adobe's rule that an image can't be pushed out of its patch. Bounds are the mesh bbox; no temporal dependency.
  io: >-
    none
  limitations: >-
    Artistic only. The projector residual mesh warp (out.projector-output) and map.calibration are separate object types and look different
    in the UI, so they can't be confused.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Reshape with a grid" under More controls; the "Make the wall breathe" and "Melt it" recipes generate mesh animation for you.
    defaults: >-
      A 4×4 grid fitted to the region's bounding box, colored distinctly from calibration grids.
    automation: >-
      Aligns the grid to the region's axes and sets rows and columns from repeated features.
    usability_check: >-
      Five of five test users correctly identify the creative grid versus the calibration grid without help, and keyframe a 3-point bend in under 2 min.
  acceptance: >-
    Mini scene "grid-bend": a keyframed mesh bend; preview/export match; the calibration file is untouched (hash unchanged).
  status: not-started
  evidence: []

