  deferred_reason: "Long-tail distortion effect or CC plug-in clone. Corner pin, mesh warp, displacement, turbulent displace, ripple, wave warp, transform, offset and the region-aware distortion recipes stay required."
  milestone: D
  beginner:
    action: >-
      Reached through "Melt it" and "Drag a part and stretch the rest" → More controls.
    defaults: >-
      Boundary = selected region plus a margin; source = the clicked feature region.
    automation: >-
      Builds both masks from region outlines.
    usability_check: >-
      A first-time user drags a window region downward and sees the wall stretch with it in under 60 s.
  acceptance: >-
    Mini scene "taffy-window": deterministic re-solve after reopening; preview/export match.
  status: not-started
