- id: fx.distort.reshape
  name: Reshape
  sources:
    - ref: S02
      item: Reshape
      category: Distort
      adobe_support: { gpu: false, bpc: [8, 16], mfr: true }
      checked: true
    - ref: S12
      item: Reshape
      category: Distort
      checked: true
  artist_can: >-
    Morph the image inside one mask shape into another mask shape, dragging the picture along, inside an optional boundary.
  projection_example: >-
    Content in a rectangular window morphs to fill a round porthole shape.
  controls:
    - { name: "Source Mask", type: mask, animatable: false }
    - { name: "Destination Mask", type: mask, animatable: false }
    - { name: "Boundary Mask", type: mask, animatable: false }
    - { name: "Percent", type: percent, animatable: true }
    - { name: "Elasticity", type: "enum(stiff|less-stiff|below-normal|normal|absolutely-normal|above-average|loose|liquid|super-fluid)", animatable: false }
    - { name: "Correspondence Points", type: "point-pairs", animatable: true }
    - { name: "Interpolation Method", type: "enum(discrete|linear|smooth)", animatable: false }
  animation: >-
    Percent and the masks are keyframable. Discrete re-solves every frame, while Linear and Smooth interpolate keyframed solutions.
  dependencies: [mask.bezier, shape.path, preview.cache, anim.keyframe.core]
  implementation: >-
    TS core solver: constrained-Delaunay triangulation inside the boundary, arc-length correspondence between masks, and a harmonic/ARAP
    solve weighted by Elasticity. It runs in float64 with a fixed iteration count for determinism, is cached per keyframe or frame in
    preview.cache, and renders with warp.mesh.
  io: >-
    none
  limitations: >-
    Elasticity names are kept but mapped to our own regularization values, so the result is not identical to Adobe. Solves are CPU-heavy.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail distortion effect or CC plug-in clone. Corner pin, mesh warp, displacement, turbulent displace, ripple, wave warp, transform, offset and the region-aware distortion recipes stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Morph shape to shape" recipe: pick a start outline and an end outline (e.g., two regions).
    defaults: >-
      Normal elasticity; Smooth interpolation; boundary auto-generated with a margin.
    automation: >-
      Builds source, destination and boundary masks from region outlines and places correspondence points at matching corners.
    usability_check: >-
      A first-time user morphs content from a rectangular window into a circle in under 90 s without placing correspondence points.
  acceptance: >-
    Mini scene "rect-to-round": a solve repeated after reopening produces identical vertex positions.
  status: not-started
  evidence: []

