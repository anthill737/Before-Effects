- id: fx.distort.optics-compensation
  name: Optics Compensation
  sources:
    - ref: S02
      item: Optics Compensation
      category: Distort
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S12
      item: Optics Compensation
      category: Distort
      checked: true
  artist_can: >-
    Add or remove camera lens (barrel or fisheye) distortion so composited elements match filmed footage.
  projection_example: >-
    Straighten a drone shot of the venue before tracing it, or add matching lens bend to CG placed into filmed footage.
  controls:
    - { name: "Field Of View (FOV)", type: float, animatable: true }
    - { name: "Reverse Lens Distortion", type: bool, animatable: false }
    - { name: "FOV Orientation", type: "enum(horizontal|vertical|diagonal)", animatable: false }
    - { name: "View Center", type: point2d, animatable: true }
    - { name: "Optimal Pixels", type: bool, animatable: false }
    - { name: "Resize", type: "enum(off|max-2x|max-4x|unlimited)", animatable: false }
  animation: >-
    FOV keyframable for zooming shots.
  dependencies: [track.camera-solve, 3d.camera, anim.keyframe.core]
  implementation: >-
    warp.inverse with an FOV-based tangent/arctangent radial model and an analytic reverse. Brown–Conrady coefficients from a camera solve
    are an alternative model. Resize expands bounds 2×, 4× or unlimited, with a memory estimate shown. Float32 throughout.
  io: >-
    Can import lens coefficients from camera-solve output (pycolmap/Blender).
  limitations: >-
    For filmed footage only. Projector lens distortion belongs to map.calibration (intrinsics) and must never be corrected here.
    Adobe's FOV-to-distortion constant is matched empirically.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail distortion effect or CC plug-in clone. Corner pin, mesh warp, displacement, turbulent displace, ripple, wave warp, transform, offset and the region-aware distortion recipes stay required."
  milestone: D
  beginner:
    action: >-
      "Straighten bent lines" (one slider) for footage; after a camera solve, "Match lens" is offered for CG layers.
    defaults: >-
      FOV from camera-solve data when available; otherwise 0 with a live straight-line guide.
    automation: >-
      Uses solved lens data to apply matching distortion to CG automatically.
    usability_check: >-
      A first-time user straightens a visibly curved roofline in drone footage in under 60 s using the line guide.
  acceptance: >-
    Mini scene "lens-match": distort then reverse with the same FOV round-trips within 0.5 px RMS.
  status: not-started
  evidence: []

