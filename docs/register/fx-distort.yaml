      category: Distort
      adobe_support: { gpu: true, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S12
      item: Transform
      category: Distort
      checked: true
  artist_can: >-
    Move, scale, skew, rotate and fade a layer from inside the effect stack, with its own motion-blur shutter, so the order relative to other effects is controllable.
  projection_example: >-
    Rotate a graphic before a drop shadow is added, so the shadow stays cast in one direction.
  controls:
    - { name: "Anchor Point", type: point2d, animatable: true }
    - { name: "Position", type: point2d, animatable: true }
    - { name: "Uniform Scale", type: bool, animatable: false }
    - { name: "Scale Height, Scale Width", type: "float[2]", animatable: true }
    - { name: "Skew", type: float, animatable: true }
    - { name: "Skew Axis", type: angle, animatable: true }
    - { name: "Rotation", type: angle, animatable: true }
    - { name: "Opacity", type: percent, animatable: true }
    - { name: "Use Composition's Shutter Angle", type: bool, animatable: false }
