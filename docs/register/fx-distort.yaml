- id: fx.distort.warp-stabilizer
  name: Warp Stabilizer
  sources:
    - ref: S02
      item: Warp Stabilizer
      category: Distort
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S12
      item: Warp Stabilizer
      category: Distort
      checked: true
    - ref: S20
      item: Warp Stabilizer VFX
      category: Tracking and stabilizing motion
      checked: true
  artist_can: >-
    Turn shaky handheld footage into smooth or locked-off shots, with cropping, auto-scale or edge synthesis, and reuse the motion on other layers.
  projection_example: >-
    Steady a handheld clip of a performer before keying it into the show, or reverse-stabilize to add effects to a shaky reference shot.
  controls:
    - { name: "Analyze / Cancel", type: action, animatable: false }
    - { name: "Result", type: "enum(smooth-motion|no-motion)", animatable: false }
    - { name: "Smoothness", type: percent, animatable: false }
    - { name: "Method", type: "enum(position|position-scale-rotation|perspective|subspace-warp)", animatable: false }
    - { name: "Preserve Scale", type: bool, animatable: false }
    - { name: "Framing", type: "enum(stabilize-only|stabilize-crop|stabilize-crop-auto-scale|stabilize-synthesize-edges)", animatable: false }
    - { name: "Auto-scale (Maximum Scale, Action-Safe Margin)", type: "percent[2]", animatable: false }
    - { name: "Additional Scale", type: percent, animatable: false }
    - { name: "Detailed Analysis", type: bool, animatable: false }
    - { name: "Rolling Shutter Ripple", type: "enum(automatic|enhanced)", animatable: false }
    - { name: "Crop Less <-> Smooth More", type: percent, animatable: false }
    - { name: "Synthesis Input Range, Edge Feather, Edge Cropping", type: group, animatable: false }
    - { name: "Objective", type: "enum(stabilize|reversible|reverse|apply-motion-to-target|apply-motion-to-target-over-original)", animatable: false }
    - { name: "Target Layer", type: layer, animatable: false }
    - { name: "Track Point Size, Auto-delete Points Across Time, Hide Warning Banner", type: group, animatable: false }
  animation: >-
    No keyframes. The analysis is a property of the clip, and Apply Motion to Target transfers motion to other layers.
  dependencies: [track.point, track.planar, preview.cache, render.queue, proj.layer]
  implementation: >-
    Vision sidecar (OpenCV): Shi-Tomasi features with pyramidal LK tracking, then a per-frame RANSAC similarity or homography fit. The
    camera path is smoothed with an L1-optimal or Gaussian smoother. Subspace Warp is approximated by bundled-path content-preserving mesh
    warps. Per-frame transforms and meshes are stored in the project and rendered on the GPU with warp.inverse or warp.mesh. Synthesize
    Edges reprojects neighbouring frames, so it has a ±range temporal dependency. Analysis runs as a background job.
  io: >-
    The analysis is stored in the project (compressed) and invalidated when the source or the in/out points change.
  limitations: >-
    Subspace warp will not match Adobe's exactly. It can wobble on parallax-heavy shots. Analysis ignores effects on the same layer
    unless precomposed (same as Adobe).
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail distortion effect or CC plug-in clone. Corner pin, mesh warp, displacement, turbulent displace, ripple, wave warp, transform, offset and the region-aware distortion recipes stay required."
  milestone: D
  beginner:
    action: >-
      "Steady this shaky clip" (one click); analysis progress shows in a banner and editing continues meanwhile.
    defaults: >-
      Smooth Motion, smoothness 50%, Subspace Warp, crop + auto-scale.
    automation: >-
      Analysis starts automatically; when cropping gets extreme it offers "Show whole frame" or "Fill edges".
    usability_check: >-
      A first-time user stabilizes a handheld clip with 1 click and can tell how much was cropped from the on-canvas indicator.
  acceptance: >-
    AS-4 performer composite (stabilized plate); re-render after reopen is hash-identical with no re-analysis.
  status: not-started
  evidence: []

- id: fx.distort.wave-warp
  name: Wave Warp
  sources:
    - ref: S02
      item: Wave Warp
      category: Distort
      adobe_support: { gpu: false, bpc: [8, 16], mfr: true }
      checked: true
    - ref: S12
      item: Wave Warp
      category: Distort
      checked: true
  artist_can: >-
    Send a wave (sine, square, triangle, circle, noise and more) travelling across the image in any direction, animating by itself.
  projection_example: >-
    A banner of light across the facade waves like a flag in the breeze.
  controls:
    - { name: "Wave Type", type: "enum(sine|square|triangle|sawtooth|circle|semicircle|uncircle|noise|smooth-noise)", animatable: false }
    - { name: "Wave Height", type: float, animatable: true }
    - { name: "Wave Width", type: float, animatable: true }
    - { name: "Direction", type: angle, animatable: true }
    - { name: "Wave Speed", type: float, animatable: true }
    - { name: "Pinning", type: "enum(none|all-edges|center|…)", animatable: false }
    - { name: "Phase", type: angle, animatable: true }
    - { name: "Antialiasing (Best Quality)", type: "enum(low|medium|high)", animatable: false }
  animation: >-
    Animates by itself at constant speed; for varying speed set it to 0 and keyframe Phase (or drive Phase from beats).
  dependencies: [anim.keyframe.core, expr.engine]
  implementation: >-
    warp.inverse with periodic wave functions. Phase = Phase + speed × t, a pure function of time; Noise types use a seeded hash noise.
    Bounds expand by Wave Height on the displaced axis unless edges are pinned.
  io: >-
    none
  limitations: >-
    The "Wave Height"/"Wave Width" descriptions on S12 look swapped. We follow the visible Adobe behavior: height is amplitude and width is wavelength.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Wave like a flag" — drag the direction arrow on the canvas.
    defaults: >-
      Sine wave, 1 cycle per second, height 2% of region, edges pinned on the "hoist" side.
    automation: >-
      Pins the edge nearest a selected attachment line (e.g., a pole or wall edge).
    usability_check: >-
      A first-time user makes a graphic wave like a flag in 3 or fewer actions.
  acceptance: >-
    Mini scene "flag-wave": constant-speed wave; random-access seek matches sequential render.
  status: not-started
  evidence: []

# ---------------------------------------------------------------------------
# Projection-specific distortion capabilities (brief §11A, §1, §15, §19). Not in Adobe's catalog.
# ---------------------------------------------------------------------------

- id: fx.distort.region-displace
  name: Region-aware displacement
  sources:
    - ref: brief §11A
      item: Distortion and deformation (region-aware use for architecture)
      category: Effect library — distortion
      checked: true
    - ref: brief §15
      item: Named regions and region groups
      category: Projection design
      checked: true
  artist_can: >-
    Apply any displacement (noise, ripple, wave, or a map) so it stays inside chosen architectural regions, pins at their outlines,
    follows each region's own axes and scale, and never smears light onto excluded areas.
  projection_example: >-
    All 24 windows ripple individually while the mullions and the wall between them stay perfectly still.
  controls:
    - { name: "Regions", type: region-set, animatable: false }
    - { name: "Strength", type: float, animatable: true }
    - { name: "Edge pin width", type: float, animatable: true }
    - { name: "Edge pin falloff", type: "enum(smooth|linear|hard)", animatable: false }
    - { name: "Direction frame", type: "enum(comp|region-axes|surface-normal)", animatable: false }
    - { name: "Per-region offset", type: "enum(none|by-index|seeded-random)", animatable: false }
    - { name: "Source displacement", type: "enum(noise|ripple|wave|layer)", animatable: false }
    - { name: "Seed", type: seed, animatable: false }
  animation: >-
    Strength keyframable or audio-driven. Per-region delay and phase come from region index through expr.rigs, so one rig drives 100 windows.
  dependencies: [map.region, map.surface-2d, fx.distort.turbulent-displace, fx.distort.displacement-map, expr.rigs, ux.recipe-engine]
  implementation: >-
    WGSL pass graph. A region-ID raster and signed-distance field (jump flood) come from map.region outlines in the bound content space.
    Displacement vectors are scaled by an edge falloff from the SDF, rotated into each region's local frame, and applied by warp.field, which
    rejects source samples from a different region ID so nothing bleeds across. No bounds expansion outside the region set. It runs in
    show space before out.projector-output.
  io: >-
    Regions are referenced by role so the show rebinds to another venue without re-authoring.
  limitations: >-
    It needs region outlines (traced or imported). It is not a calibration or output-mask tool; spill protection at the venue is still
    out.output-mask's job.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Implicit: every distortion recipe applied to a region selection uses it, with a visible "Keep edges still" toggle.
    defaults: >-
      Edges pinned over 8% of each region's short side; per-region offset by index; strength scaled to region size.
    automation: >-
      Builds region IDs and SDFs from the selection, rescales per region, and rebinds automatically on venue change.
    usability_check: >-
      A first-time user selects 12 windows and applies "Ripple like water" in 3 or fewer actions. An automated mask check finds zero
      displaced pixels outside the windows.
  acceptance: >-
    Mini scene "windows-ripple": per-window ripples with still frames; outline overlay shows no cross-region displacement; rebinding to a
    second venue keeps the behavior (AS-7).
  status: not-started
  evidence: []

- id: fx.distort.breathing-wall
  name: Make the wall breathe
  sources:
    - ref: brief §11A
      item: Breathing walls
      category: Effect library — distortion
      checked: true
    - ref: brief §1
      item: Buildings appear to change shape
      category: What the product must enable
      checked: true
  artist_can: >-
    Make a wall or panel inhale and exhale: it swells toward the audience and settles back, with matching light and shadow cues, shaped
    by the region outline.
  projection_example: >-
    The facade breathes slowly with the music's downbeats before it cracks apart.
  controls:
    - { name: "Depth", type: float, animatable: true }
    - { name: "Breath rate", type: "float (s or beats)", animatable: true }
    - { name: "Edge softness", type: float, animatable: true }
    - { name: "Shading amount", type: percent, animatable: true }
    - { name: "Light direction", type: angle, animatable: true }
    - { name: "Sync to beat", type: bool, animatable: false }
    - { name: "Irregularity + Seed", type: "float+seed", animatable: true }
  animation: >-
    Default seamless loop. The rate can lock to the BPM grid and the depth can follow an audio band, and all values stay keyframable.
  dependencies: [fx.distort.bulge, fx.distort.mesh-warp, fx.distort.region-displace, fx.perspective.region-relief, audio.analysis, audio.to-keyframes, map.region, map.model-3d, ux.recipe-engine]
  implementation: >-
    Recipe-generated stack. A height field comes from the region SDF (smoothed distance transform, power-shaped) times Depth times a
    periodic envelope. In 2D it drives pseudo-perspective magnification through warp.field plus normal-based shading in WGSL. When
    map.model-3d exists, a 3D mode displaces vertices along normals in three.js with projective texturing. It is a pure function of time.
  io: >-
    none
  limitations: >-
    The 2D mode is an illusion that reads correctly only near the chosen audience viewpoint; true 3D mode needs a venue model. It never moves geometry in map.venue or calibration.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Make the wall breathe" — select a wall region and choose it from the Movement library.
    defaults: >-
      Depth 4% of region height; one breath per 4 beats (or 4 s without music); edges pinned; subtle shading from the show light.
    automation: >-
      Derives the height field from the region outline, ties the rate to detected BPM, and generates editable keyframes and expressions.
    usability_check: >-
      A first-time user makes a wall breathe in time with music in 3 or fewer actions and under 60 s.
  acceptance: >-
    AS-3 Transformation (deformation phase); mini scene "breathing-facade": loop closes exactly and the frame at depth 0 is pixel-identical to the source.
  status: not-started
  evidence: []

- id: fx.distort.melting-facade
  name: Melt it
  sources:
    - ref: brief §11A
      item: Melting facades
      category: Effect library — distortion
      checked: true
  artist_can: >-
    Make architectural features soften and drip downward under gravity, starting from ledges and sills, then reverse exactly to rebuild.
  projection_example: >-
    Windows sag and drip down the wall during a bass drop, then flow back into place.
  controls:
    - { name: "Melt amount", type: percent, animatable: true }
    - { name: "Gravity direction", type: angle, animatable: true }
    - { name: "Drip length", type: float, animatable: true }
    - { name: "Drip density", type: float, animatable: true }
    - { name: "Viscosity", type: float, animatable: true }
    - { name: "Melt from", type: "enum(top-edges|ledges|selected-paths)", animatable: false }
    - { name: "Seed", type: seed, animatable: false }
  animation: >-
    Melt amount is the main keyframe; reversing it rebuilds exactly. The time remap can play the melt backwards.
  dependencies: [fx.distort.turbulent-displace, fx.distort.region-displace, map.region, tool.edge-trace, anim.time-remap, ux.recipe-engine]
  implementation: >-
    Procedural, analytic displacement field with no simulation. Displacement points downward and grows with distance below melt-source
    edges (horizontal edges extracted from region outlines). Seeded 1D noise sets the drip columns, and a viscosity-shaped ramp is driven by
    Melt amount. Any frame is random-accessible. Rendered with warp.field; streak extension expands bounds downward by Drip length.
  io: >-
    none
  limitations: >-
    It is not a fluid simulation; physically based melting needs a Blender bake (3D domain). Upward-facing features don't drip.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Melt it" — select regions, adjust "How much" and "How fast"; "Rebuild" appends the reverse.
    defaults: >-
      Melt from ledges and sills; drips 15% of region height; 3 s melt; seed fixed per project.
    automation: >-
      Finds horizontal edges in the selected regions to start drips; generates the reverse keyframes for "Rebuild".
    usability_check: >-
      A first-time user melts windows and rebuilds them in under 2 min; the rebuilt end frame matches the start frame exactly.
  acceptance: >-
    AS-3 Transformation; mini scene "melt-and-rebuild": melt 0% is pixel-identical to the source, and the reverse equals the forward frames mirrored in time.
  status: not-started
  evidence: []

- id: fx.distort.animated-liquify
  name: Push and smudge (animated)
  sources:
    - ref: brief §11A
      item: Liquify-like deformation
      category: Effect library — distortion
      checked: true
  artist_can: >-
    Paint pushes, swirls, pinches and bloats with a brush. Each stroke becomes an editable, keyframable, timed deformation that renders
    identically every time.
  projection_example: >-
    A swirl grows into a stained-glass window on the beat, followed by a pinch on the next window.
  controls:
    - { name: "Strokes (tool, path, size, pressure)", type: stroke-list, animatable: true }
    - { name: "Stroke strength", type: float, animatable: true }
    - { name: "Stroke start / end time", type: "time[2]", animatable: false }
    - { name: "Stroke easing", type: "enum(linear|ease|custom-curve)", animatable: false }
    - { name: "Freeze mask", type: mask, animatable: true }
    - { name: "Turbulence seed", type: seed, animatable: false }
  animation: >-
    Each stroke has its own strength curve, editable in the graph editor. "Animate it" lays strokes out sequentially or on beats.
  dependencies: [fx.distort.liquify, anim.keyframe.core, anim.graph-editor, mask.bezier, ux.operation-system, map.region, audio.analysis]
  implementation: >-
    Each stroke is a parametric deformation primitive (path, brush kernel, tool type) with an animatable strength. At time t, active strokes
    are composed in order into an rg32float field on a fixed grid in WGSL compute, giving a deterministic result. Rendered with warp.field;
    per-frame fields are cached in preview.cache. No frame history.
  io: >-
    Adobe Liquify meshes cannot be imported. A static snapshot can be converted to one "baked" stroke.
  limitations: >-
    Cost grows with the number of active strokes; the UI suggests no more than about 200 per layer. The Reconstruction modes apply per stroke, not to a global mesh.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail distortion effect or CC plug-in clone. Corner pin, mesh warp, displacement, turbulent displace, ripple, wave warp, transform, offset and the region-aware distortion recipes stay required."
  milestone: D
  beginner:
    action: >-
      "Push and smudge" brush, then "Animate it" (strokes grow in the order painted, or on beats).
    defaults: >-
      Each stroke grows over 0.5 s; strokes are spaced by 0.25 s or snapped to beats when music exists.
    automation: >-
      Converts painting order into timing, freezes areas outside the selected region, and snaps stroke starts to beat markers.
    usability_check: >-
      A first-time user paints 3 strokes and has them grow on successive beats in under 2 min. A re-render gives hash-identical frames.
  acceptance: >-
    Mini scene "liquify-on-beat": strokes reproduce identically after reopen and across two render workers.
  status: not-started
  evidence: []

- id: fx.distort.liquid-surface
  name: Turn it into water
  sources:
    - ref: brief §11A
      item: Liquid surfaces, rippling masonry
      category: Effect library — distortion
      checked: true
    - ref: brief §1
      item: Brick changes into flowing water
      category: What the product must enable
      checked: true
  artist_can: >-
    Make a surface look as if it is made of, or seen through, moving water, with refracting waves, raindrop impacts and optional caustic
    light, confined to the chosen region.
  projection_example: >-
    The brick wall becomes a rippling water surface with caustic light dancing across it.
  controls:
    - { name: "Wave size", type: float, animatable: true }
    - { name: "Wave speed", type: float, animatable: true }
    - { name: "Refraction strength", type: float, animatable: true }
    - { name: "Flow direction", type: angle, animatable: true }
    - { name: "Caustics amount", type: percent, animatable: true }
    - { name: "Water tint", type: color, animatable: true }
    - { name: "Raindrop impacts (rate)", type: float, animatable: true }
    - { name: "Seed", type: seed, animatable: false }
  animation: >-
    All controls keyframable. Impacts can fire from beats or onsets, and a transition mode animates brick → water.
  dependencies: [fx.distort.displacement-map, fx.distort.turbulent-displace, fx.distort.region-displace, fx.noise-grain.fractal-noise, fx.simulation.wave-world, fx.simulation.caustics, ux.recipe-engine]
  implementation: >-
    Recipe. A stateless procedural height field (seeded Gerstner and noise sum) gives normals, which drive a refraction offset through
    warp.field. Caustics come from the height-field Laplacian, or from fx.simulation.caustics. Impacts are analytic ripple rings, as in
    CC Ripple Pulse. An optional stateful mode uses fx.simulation.wave-world with checkpointed state.
  io: >-
    none
  limitations: >-
    The stateless mode is not a physical simulation; interacting waves need the stateful Wave World mode, which is costlier to seek.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Turn it into water" — searching "make this look like water" finds it first.
    defaults: >-
      Gentle waves scaled to the region, light caustics, slight blue tint, no rain.
    automation: >-
      Builds the height field, map layers and region constraint; matches wave speed to the music tempo when present.
    usability_check: >-
      A first-time user turns a selected wall into water in 3 or fewer actions, and searching "water" ranks it first.
  acceptance: >-
    Mini scene "brick-to-water": transition plays identically after reopen and on random seeks; acceptance-show material change (brief §1).
  status: not-started
  evidence: []

- id: fx.distort.venue-wave
  name: Send a wave across the building
  sources:
    - ref: brief §11A
      item: Rippling masonry across architectural features
      category: Effect library — distortion
      checked: true
    - ref: brief §16
      item: Installation-wide coordinates
      category: Multiple projectors
      checked: true
  artist_can: >-
    Run one continuous ripple, wave or noise warp across many regions, layers and projector outputs, so it lines up across seams and gaps.
  projection_example: >-
    A ripple starts at the door and travels over every window and column, staying continuous across two overlapping projectors.
  controls:
    - { name: "Origin (venue point)", type: point3d, animatable: true }
    - { name: "Wave type", type: "enum(ripple|linear|noise)", animatable: false }
    - { name: "Speed", type: float, animatable: true }
    - { name: "Wavelength", type: float, animatable: true }
    - { name: "Amplitude", type: float, animatable: true }
    - { name: "Decay", type: float, animatable: true }
    - { name: "Distance mode", type: "enum(flat-facade|along-surface)", animatable: false }
    - { name: "Regions affected", type: region-set, animatable: false }
  animation: >-
    Origin, speed and amplitude keyframable; amplitude can follow audio.
  dependencies: [map.venue, map.region, map.model-3d, fx.distort.region-displace, fx.distort.ripple, fx.distort.wave-warp, out.projector-output]
  implementation: >-
    The displacement field is defined in venue coordinates (facade plane or 3D world position) and sampled per region through its
    content mapping. It is evaluated before out.projector-output, so overlapping projectors receive identical content. The along-surface
    mode precomputes geodesic distances on the venue mesh with the heat method and caches them per venue version.
  io: >-
    Cached distance fields are stored with the venue version.
  limitations: >-
    On non-coplanar surfaces the wave is continuous in surface distance, not in the audience's view. Along-surface mode needs a venue mesh.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      "Send a wave across the building" — click the starting point on the venue view.
    defaults: >-
      Ripple from the clicked point; reaches the farthest region in 3 s; affects all regions except exclusions.
    automation: >-
      Chooses flat or along-surface mode depending on whether a venue model exists; excludes regions marked "exclusion".
    usability_check: >-
      A first-time user sends a wave from the door across all windows in 3 or fewer actions. An automated seam test shows continuous
      phase at region boundaries.
  acceptance: >-
    AS-5 Multi-projector scene: the wave crosses the overlap with matching content in both projector exports.
  status: not-started
  evidence: []

- id: fx.distort.panel-open
  name: Open like a door
  sources:
    - ref: brief §11A
      item: Opening panels
      category: Effect library — distortion
      checked: true
  artist_can: >-
    Make a region (door, shutter, panel) appear to swing open on a hinge along one of its edges, with thickness and shading, revealing what is behind.
  projection_example: >-
    Facade panels swing open one after another to reveal a glowing interior.
  controls:
    - { name: "Hinge edge", type: "enum(left|right|top|bottom|picked-edge)", animatable: false }
    - { name: "Open angle", type: angle, animatable: true }
    - { name: "Swing direction", type: "enum(inward|outward)", animatable: false }
    - { name: "Perspective strength", type: float, animatable: true }
    - { name: "Panel thickness", type: float, animatable: true }
    - { name: "Shading", type: percent, animatable: true }
    - { name: "Reveal layer", type: layer, animatable: false }
  animation: >-
    Open angle keyframed with overshoot or settle presets. Sequences across many panels use the sequence tool's offsets.
  dependencies: [fx.distort.corner-pin, fx.perspective.drop-shadow, map.region, tool.sequence-light-up, 3d.scene, 3d.camera, ux.recipe-engine]
  implementation: >-
    In 2.5D the region quad is rotated about the hinge edge in 3D and seen through the audience-view camera. The TS core computes a
    homography for each frame, which feeds the Corner Pin pass, plus an edge-thickness strip and Lambert shading. When map.model-3d exists,
    a 3D mode extrudes the region in three.js.
  io: >-
    none
  limitations: >-
    The 2.5D illusion is correct only near the audience viewpoint. Non-planar regions need the 3D mode.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Open like a door" — click the hinge edge of a region; for many regions, "Open one after another".
    defaults: >-
      Opens inward to 75° in 1.2 s with a small settle; the reveal shows the next scene.
    automation: >-
      Detects the region's hinge candidates (longest vertical edge) and staggers multiple panels by position.
    usability_check: >-
      A first-time user opens 6 window shutters in sequence in under 2 min.
  acceptance: >-
    Mini scene "shutters-open": staggered panel opening; export matches preview; venue geometry and calibration unchanged.
  status: not-started
  evidence: []

- id: fx.distort.fit-to-region
  name: Fit into this shape
  sources:
    - ref: brief §11A
      item: Curved and mesh warps; path-based reshaping
      category: Effect library — distortion
      checked: true
    - ref: brief §0.1
      item: Select the thing, choose what it should do
      category: User experience
      checked: true
  artist_can: >-
    Stretch a rectangular video or image so it smoothly fills a non-rectangular region (arch, circle, trapezoid, curved panel) without manual mesh editing.
  projection_example: >-
    A looping clip fills a gothic arched window exactly, edge to edge.
  controls:
    - { name: "Region", type: region, animatable: false }
    - { name: "Fit mode", type: "enum(stretch|cover|contain|conformal)", animatable: false }
    - { name: "Corner anchors on outline", type: "point2d[4]", animatable: true }
    - { name: "Smoothness", type: float, animatable: false }
    - { name: "Bleed", type: float, animatable: true }
  animation: >-
    Anchors and bleed keyframable; follows region edits automatically.
  dependencies: [map.region, map.surface-2d, fx.distort.mesh-warp, fx.distort.bezier-warp, fx.distort.corner-pin]
  implementation: >-
    Maps the unit square onto the region outline. Stretch uses a Coons patch on four outline segments split at the anchors; conformal uses
    harmonic or mean-value coordinates on a triangulated region mesh. Both are solved in the TS core, cached per outline version and drawn
    with warp.mesh. Bleed expands the outline for overscan.
  io: >-
    none
  limitations: >-
    When map.surface-2d already supplies UVs for the region, those are preferred. This effect is for creative fits inside a composition
    and must not be used to fix projector misalignment (map.calibration).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Dropping media onto a region offers "Fill this shape" as the default choice.
    defaults: >-
      Stretch mode; anchors at the outline's extreme corners; 1% bleed.
    automation: >-
      Chooses anchors from outline curvature; refits when the region outline changes.
    usability_check: >-
      A first-time user drops a clip on an arched window and it fills the arch edge to edge in 1 action.
  acceptance: >-
    Mini scene "fill-arch": coverage check shows no unfilled pixels inside the arch and none outside beyond the bleed.
  status: not-started
  evidence: []
