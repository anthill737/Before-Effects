  controls:
    - { name: "Warp Style", type: "enum(arc|arc-lower|arc-upper|arch|bulge|shell-lower|shell-upper|flag|wave|fish|rise|fisheye|inflate|squeeze|twist)", animatable: false }
    - { name: "Warp Axis", type: "enum(horizontal|vertical)", animatable: false }
