# Distort — Before Effects capability register
# Sources: S02 effect list + support matrix (Distort rows; page dated May 13, 2026), S12 Distort effects (page dated Jun 27, 2025),
#   S20 Warp Stabilizer settings, S01 user-guide pages "The Rolling Shutter Repair effect" and "Cycore plugins"; brief §0, §1, §11A, §15, §19.
#   All live pages retrieved 2026-10-01. Controls for CC effects and for native effects whose S12 section lists no controls
#   (Bezier Warp, Corner Pin, Displacement Map, Spherize, Transform, Twirl, Warp) come from authoring knowledge, not the live page.
# Shared warp passes named in `implementation`:
#   warp.inverse = WGSL analytic inverse-mapping pass (output pixel -> source coordinate), premultiplied rgba16float source,
#                  bicubic (Mitchell) sampling, EWA/supersampling where the Jacobian compresses (stands in for Adobe "Antialiasing").
#   warp.mesh    = forward triangle-mesh raster pass (tessellated in the TS core, rasterized in WGSL with 4x MSAA).
#   warp.field   = displacement-field pass reading an rg32float vector field texture.
# Control types: float, int, bool, angle, percent, color, point2d, point3d, enum(...), layer, mask, region, region-set, seed, mesh, field, stroke-list, action.
# Artistic distortion is always evaluated in show/content space, before out.projector-output; it never edits map.calibration.

- id: fx.distort.bezier-warp
  name: Bezier Warp
  sources:
    - ref: S02
      item: Bezier Warp
      category: Distort
      adobe_support: { gpu: false, bpc: [8, 16], mfr: true }
      checked: true
    - ref: S12
      item: Bezier Warp
      category: Distort
      checked: true
  artist_can: >-
    Reshape a layer's outline with four curved edges (four corner points and eight tangent handles) so the image bends to follow them.
  projection_example: >-
    Curve the top of a rectangular video so it follows an arched doorway, or make a logo wobble like jelly on the beat.
  controls:
    - { name: "Vertices (4 corners)", type: "point2d[4]", animatable: true }
    - { name: "Tangents (8 handles)", type: "point2d[8]", animatable: true }
    - { name: "Quality", type: "int(1-10)", animatable: false }
  animation: >-
    Every vertex and tangent keyframable with spatial paths and expression-linkable; can be driven by region-outline or tracker data.
  dependencies: [anim.keyframe.core, anim.motion-path, map.region, proj.effect-stack]
  implementation: >-
    Coons patch built from the four cubic boundary curves, tessellated in the TS core (density from Quality) and drawn with warp.mesh.
    Bounds become the bbox of the curve hull. No temporal dependency; geometry is float32.
  io: >-
    none
  limitations: >-
    Interior interpolation is a bilinearly blended Coons patch, so it is not pixel-identical to Adobe. Artistic only; never a
    substitute for the calibration mesh warp in map.calibration / out.projector-output.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Curve to fit" — drag curved edge handles on the canvas; also reached through the "Wobble like jelly" recipe.
    defaults: >-
      Handles start on the layer edges; with a region selected, the vertices snap to the region's corners.
    automation: >-
      "Fit to arch" places the top curve on the selected region's curved edge and sets tangents from the outline.
    usability_check: >-
      A first-time user fits a rectangular clip into an arched window region in under 45 s using only canvas handles.
  acceptance: >-
    Mini scene "arch-fit": a clip curved into an arched window. Preview and export match within tolerance and the handles survive save/reopen.
  status: not-started
  evidence: []

- id: fx.distort.bulge
  name: Bulge
  sources:
    - ref: S02
      item: Bulge
      category: Distort
      adobe_support: { gpu: false, bpc: [8, 16], mfr: true }
      checked: true
    - ref: S12
      item: Bulge
      category: Distort
      checked: true
  artist_can: >-
    Make an elliptical area swell toward or sink away from the viewer around a center point.
  projection_example: >-
    A section of brick wall swells outward as if something is pushing from inside the building.
  controls:
    - { name: "Horizontal Radius", type: float, animatable: true }
    - { name: "Vertical Radius", type: float, animatable: true }
    - { name: "Bulge Center", type: point2d, animatable: true }
    - { name: "Bulge Height", type: float, animatable: true }
    - { name: "Taper Radius", type: float, animatable: true }
    - { name: "Antialiasing", type: "enum(low|medium|high)", animatable: false }
    - { name: "Pin All Edges", type: bool, animatable: false }
  animation: >-
    All numeric and point controls keyframable and expression/audio-linkable; radius handles are editable on the canvas.
  dependencies: [anim.keyframe.core, proj.effect-stack]
  implementation: >-
    warp.inverse with an elliptical dome height profile and a taper falloff. Antialiasing maps to the supersampling factor.
    No bounds expansion and no temporal dependency.
  io: >-
    none
  limitations: >-
    Adobe's exact dome profile is approximated. It is a 2D illusion, read correctly only from roughly the audience viewpoint.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Make it bulge"; it is also the building block of the "Make the wall breathe" recipe (fx.distort.breathing-wall).
    defaults: >-
      Radii fit the selected region and edges are pinned. Height animates 0 → 30% → 0 over 2 s with ease.
    automation: >-
      Centers on the region centroid and sizes the radii from the region's bounding ellipse.
    usability_check: >-
      A first-time user makes a selected wall section swell out and settle back in 3 or fewer actions, without opening the inspector.
  acceptance: >-
    Mini scene "bulge-swell": an animated bulge on a wall region. The pinned edges show zero displacement and reopen/export match the preview.
  status: not-started
  evidence: []

- id: fx.distort.cc-bend-it
  name: CC Bend It
  sources:
    - ref: S02
      item: CC Bend It
      category: Distort
      adobe_support: { gpu: false, bpc: [8, 16], mfr: true }
      checked: true
    - ref: S12
      item: CC Bend It
      category: Distort
      checked: true
  artist_can: >-
    Flex a layer like a rod between a start and end point, bending everything past the start into an arc.
  projection_example: >-
    A graphic laid over a pilaster bends and sways as though the column were made of rubber.
  controls:
    - { name: "Bend", type: float, animatable: true }
    - { name: "Start", type: point2d, animatable: true }
    - { name: "End", type: point2d, animatable: true }
    - { name: "Render Prestart", type: "enum(none|static|bend)", animatable: false }
    - { name: "Distort", type: "enum(legacy|extended)", animatable: false }
  animation: >-
    Bend, Start and End keyframable; Bend is the usual target for wiggle or audio expressions.
  dependencies: [anim.keyframe.core, expr.engine]
  implementation: >-
    warp.inverse mapping coordinates along the Start→End axis onto a circular arc whose curvature follows Bend.
    Bounds expand to the arc's bbox. No temporal dependency.
  io: >-
    none
  limitations: >-
    "Legacy" versus "extended" edge behaviour is matched by observation, not from a specification.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail distortion effect or CC plug-in clone. Corner pin, mesh warp, displacement, turbulent displace, ripple, wave warp, transform, offset and the region-aware distortion recipes stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Bend it" recipe (style: Flex between two points) → More controls.
    defaults: >-
      Start at the bottom and End at the top of the selected element. Bend oscillates ±20 with a 3 s period.
    automation: >-
      Places Start and End on the long axis of the selected region.
    usability_check: >-
      A first-time user makes a column graphic sway back and forth in under 60 s without placing points by hand.
  acceptance: >-
    Mini scene "rubber-column": swaying bend on a column region; seek to any frame gives identical output.
  status: not-started
  evidence: []

- id: fx.distort.cc-bender
  name: CC Bender
  sources:
    - ref: S02
      item: CC Bender
      category: Distort
      adobe_support: { gpu: false, bpc: [8, 16], mfr: true }
      checked: true
    - ref: S12
      item: CC Bender
      category: Distort
      checked: true
  artist_can: >-
    Curve a layer along an axis from a fixed base to a moving top, with Bend, Marilyn (skirt flare), Sharp and Boxer styles.
  projection_example: >-
    A tall banner graphic on a tower bends at its base like a reed in the wind.
  controls:
    - { name: "Amount", type: float, animatable: true }
    - { name: "Style", type: "enum(bend|marilyn|sharp|boxer)", animatable: false }
    - { name: "Adjust To Distance", type: bool, animatable: false }
    - { name: "Top", type: point2d, animatable: true }
    - { name: "Base", type: point2d, animatable: true }
  animation: >-
    Amount, Top and Base keyframable and expression-linkable.
  dependencies: [anim.keyframe.core, fx.distort.cc-bend-it]
  implementation: >-
    warp.inverse with a per-style axial bend profile, sharing the arc math with fx.distort.cc-bend-it.
    Bounds expand to the bent bbox. No temporal dependency.
  io: >-
    none
  limitations: >-
    The style curves are reproduced visually, not numerically.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail distortion effect or CC plug-in clone. Corner pin, mesh warp, displacement, turbulent displace, ripple, wave warp, transform, offset and the region-aware distortion recipes stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Bend it" recipe, using the style picker (Bend / Flare / Sharp / Boxer) with animated thumbnails.
    defaults: >-
      Base at the bottom of the selection, Top at the top, Amount animates 0 → 40 → 0.
    automation: >-
      Aligns Base/Top with the selected region's vertical axis.
    usability_check: >-
      A first-time user picks a bend style from thumbnails and previews it on a tower region in 3 or fewer actions.
  acceptance: >-
    Mini scene "reed-tower": each of the four styles renders in preview and export with matching frames.
  status: not-started
  evidence: []

- id: fx.distort.cc-blobbylize
  name: CC Blobbylize
  sources:
    - ref: S02
      item: CC Blobbylize
      category: Distort
      adobe_support: { gpu: false, bpc: [8, 16], mfr: true }
      checked: true
    - ref: S12
      item: CC Blobbylize
      category: Distort
      checked: true
  artist_can: >-
    Turn a layer into soft, glossy, liquid-looking blobs shaped by another layer's alpha or brightness, with built-in lighting.
  projection_example: >-
    Window shapes soften into shiny jelly blobs before reforming as windows.
  controls:
    - { name: "Blob Layer", type: layer, animatable: false }
    - { name: "Property", type: "enum(alpha|luminance|lightness|red|green|blue)", animatable: false }
    - { name: "Softness", type: float, animatable: true }
    - { name: "Cut Away", type: float, animatable: true }
    - { name: "Light (Using, Type, Intensity, Color, Height, Position, Direction)", type: "group", animatable: true }
    - { name: "Shading (Ambient, Diffuse, Specular, Roughness, Metal)", type: "group(float)", animatable: true }
  animation: >-
    Softness and Cut Away are the main animated controls; the light position can follow a 3D light or a null.
  dependencies: [fx.blur-sharpen.gaussian-blur, 3d.light, anim.keyframe.core]
  implementation: >-
    Pass graph: Gaussian-blur the chosen property of the blob layer → float32 height field → Sobel normals → refraction-style
    displacement (warp.field) plus Blinn-Phong shading; Cut Away thresholds alpha. Bounds expand by the blur radius; no temporal dependency.
  io: >-
    none
  limitations: >-
    Adobe's shading model is approximated. Using comp lights instead of the effect light needs a defined 2.5D light projection.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail distortion effect or CC plug-in clone. Corner pin, mesh warp, displacement, turbulent displace, ripple, wave warp, transform, offset and the region-aware distortion recipes stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Turn it to goo" recipe → More controls.
    defaults: >-
      Blob layer is the target itself; softness scales with region size; top-left light, moderate specular.
    automation: >-
      Creates the blob source from the region matte when no other layer is chosen.
    usability_check: >-
      A first-time user turns a selected region into glossy goo and back in under 90 s without picking a control layer.
  acceptance: >-
    Mini scene "jelly-windows": windows melt to blobs and reform; export matches preview.
  status: not-started
  evidence: []

- id: fx.distort.cc-flo-motion
  name: CC Flo Motion
  sources:
    - ref: S02
      item: CC Flo Motion
      category: Distort
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S12
      item: CC Flo Motion
      category: Distort
      checked: true
  artist_can: >-
    Pinch or stretch the image around two knot points so it flows into or out of them like a vortex or taffy pull.
  projection_example: >-
    The facade texture gets sucked into the main doorway, then pushes back out.
  controls:
    - { name: "Knot 1", type: point2d, animatable: true }
    - { name: "Amount 1", type: float, animatable: true }
    - { name: "Knot 2", type: point2d, animatable: true }
    - { name: "Amount 2", type: float, animatable: true }
    - { name: "Tile Edges", type: bool, animatable: false }
    - { name: "Antialiasing", type: "enum(low|medium|high)", animatable: false }
    - { name: "Falloff", type: float, animatable: true }
  animation: >-
    Knots and amounts keyframable; knots can follow tracker or region-centroid data.
  dependencies: [anim.keyframe.core, map.region]
  implementation: >-
    warp.inverse with two radial power-law attractors. Tile Edges switches the sampler to repeat addressing.
    No bounds change, no temporal dependency, safe in float32.
  io: >-
    none
  limitations: >-
    Extreme amounts produce heavy minification, so EWA filtering is required to avoid shimmer.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail distortion effect or CC plug-in clone. Corner pin, mesh warp, displacement, turbulent displace, ripple, wave warp, transform, offset and the region-aware distortion recipes stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Pull it into a point" recipe → More controls.
    defaults: >-
      Knot 1 sits on the clicked point and Knot 2 is disabled (Amount 0); the pull ramps over 2 s.
    automation: >-
      Click any region to place the knot at its centroid.
    usability_check: >-
      A first-time user sucks a wall texture into a clicked door in 3 or fewer actions.
  acceptance: >-
    Mini scene "door-vortex": pull and release; 32-bit render without banding.
  status: not-started
  evidence: []

- id: fx.distort.cc-griddler
  name: CC Griddler
  sources:
    - ref: S02
      item: CC Griddler
      category: Distort
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S12
      item: CC Griddler
      category: Distort
      checked: true
  artist_can: >-
    Cut the image into a grid of tiles, each scaled and rotated in place, with optional gaps between them.
  projection_example: >-
    A brick-wall image breaks into tilting tiles that line up with the real brick courses.
  controls:
    - { name: "Horizontal Scale", type: float, animatable: true }
    - { name: "Vertical Scale", type: float, animatable: true }
    - { name: "Tile Size", type: float, animatable: true }
    - { name: "Rotation", type: angle, animatable: true }
    - { name: "Cut Tiles", type: bool, animatable: false }
  animation: >-
    All numeric controls keyframable; Rotation is a common audio-driven target.
  dependencies: [anim.keyframe.core, map.region]
  implementation: >-
    WGSL per-cell inverse transform: the cell index comes from floor(p / tile), then a local scale and rotation. The grid can be aligned
    to the region's axes. No bounds change; no temporal dependency.
  io: >-
    none
  limitations: >-
    All tiles share one transform. Per-tile variation belongs to rigs or fx.simulation.card-dance.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail distortion effect or CC plug-in clone. Corner pin, mesh warp, displacement, turbulent displace, ripple, wave warp, transform, offset and the region-aware distortion recipes stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Break into tiles" recipe → More controls.
    defaults: >-
      Tile size comes from the region's repeated-feature spacing when detected, otherwise 1/12 of the region width.
    automation: >-
      Aligns the grid with the region's dominant axis and repeated-feature spacing.
    usability_check: >-
      A first-time user makes a wall tile-out and back with tiles visibly aligned to the brick pattern in under 90 s.
  acceptance: >-
    Mini scene "tile-wall": grid aligned to a brick region; export matches preview.
  status: not-started
  evidence: []

- id: fx.distort.cc-lens
  name: CC Lens
  sources:
    - ref: S02
      item: CC Lens
      category: Distort
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S12
      item: CC Lens
      category: Distort
      checked: true
  artist_can: >-
    Apply a round fisheye lens at a point; the area outside the lens becomes transparent.
  projection_example: >-
    A "magic lens" drifts across the facade, showing a warped, magnified view of the scene inside a round window.
  controls:
    - { name: "Center", type: point2d, animatable: true }
    - { name: "Size", type: float, animatable: true }
    - { name: "Convergence", type: float, animatable: true }
  animation: >-
    All controls keyframable; Center commonly follows a motion path.
  dependencies: [anim.keyframe.core, anim.motion-path]
  implementation: >-
    warp.inverse with a spherical-lens mapping, a Convergence exponent and a transparent exterior.
    No bounds change; float32-safe; no temporal dependency.
  io: >-
    none
  limitations: >-
    The outside is transparent, as in Adobe. Compose the effect over a copy to keep the surroundings.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail distortion effect or CC plug-in clone. Corner pin, mesh warp, displacement, turbulent displace, ripple, wave warp, transform, offset and the region-aware distortion recipes stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Fisheye lens" recipe → More controls.
    defaults: >-
      Lens fits the selected circular region; the recipe composites it over the original so nothing goes black.
    automation: >-
      Snaps Center and Size to a selected round window region.
    usability_check: >-
      A first-time user puts a fisheye view inside a round window in 3 or fewer actions.
  acceptance: >-
    Mini scene "rose-lens": lens inside a circular region with the original visible outside.
  status: not-started
  evidence: []

- id: fx.distort.cc-page-turn
  name: CC Page Turn
  sources:
    - ref: S02
      item: CC Page Turn
      category: Distort
      adobe_support: { gpu: false, bpc: [8, 16], mfr: true }
      checked: true
    - ref: S12
      item: CC Page Turn
      category: Distort
      checked: true
  artist_can: >-
    Curl a layer away like a turning page, showing a chosen back side and revealing what lies underneath.
  projection_example: >-
    The whole facade image peels away from the top-right corner to reveal the next scene.
  controls:
    - { name: "Controls", type: "enum(classic|top-left|top-right|bottom-left|bottom-right)", animatable: false }
    - { name: "Fold Position", type: point2d, animatable: true }
    - { name: "Fold Direction", type: angle, animatable: true }
    - { name: "Fold Radius", type: float, animatable: true }
    - { name: "Light Direction", type: angle, animatable: true }
    - { name: "Render", type: "enum(front-and-back|back-page|front-page)", animatable: false }
    - { name: "Back Page", type: layer, animatable: false }
    - { name: "Back Opacity", type: percent, animatable: true }
    - { name: "Paper Color", type: color, animatable: true }
  animation: >-
    Fold Position is keyframed (usually corner to opposite corner); the rest are optional keyframes.
  dependencies: [anim.keyframe.core, map.region, proj.layer]
  implementation: >-
    Analytic cylinder-fold model. The flat part uses warp.inverse. The curled strip and back face are a tessellated cylinder segment drawn
    with warp.mesh, using Lambert shading from Light Direction. Bounds expand to the fold's bbox. No temporal dependency.
  io: >-
    none
  limitations: >-
    The page is a 2D illusion, not a cloth simulation; for physically bending sheets use the 3D path.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail distortion effect or CC plug-in clone. Corner pin, mesh warp, displacement, turbulent displace, ripple, wave warp, transform, offset and the region-aware distortion recipes stay required."
  milestone: C
  beginner:
    action: >-
      "Peel it away" — select a region or scene layer and click the corner to peel from.
    defaults: >-
      Peel lasts 2 s with ease-in-out; the back is paper-colored; the next scene shows underneath.
    automation: >-
      Sets Controls/Fold Position from the clicked corner and the fold path to the opposite corner of the region.
    usability_check: >-
      A first-time user builds a corner-peel reveal between two scenes on a selected region in 3 or fewer actions and under 60 s.
  acceptance: >-
    Mini scene "peel-reveal": peel from a chosen corner reveals scene 2; export matches preview; reopen keeps the fold path.
  status: not-started
  evidence: []

- id: fx.distort.cc-power-pin
  name: CC Power Pin
  sources:
    - ref: S02
      item: CC Power Pin
      category: Distort
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S12
      item: CC Power Pin
      category: Distort
      checked: true
  artist_can: >-
    Pin a layer's four corners with extra edge-expansion margins, a perspective/bilinear blend and an "unstretch" option.
  projection_example: >-
    Pin a video into a skewed window, extending it a few percent past the frame so no gap shows at the edges.
  controls:
    - { name: "Top Left, Top Right, Bottom Left, Bottom Right", type: "point2d[4]", animatable: true }
    - { name: "Perspective", type: percent, animatable: true }
    - { name: "Unstretch", type: bool, animatable: false }
    - { name: "Expansion (%) Top, Left, Right, Bottom", type: "float[4]", animatable: true }
  animation: >-
    Corners and expansion keyframable; accepts planar-tracker data.
  dependencies: [fx.distort.corner-pin]
  implementation: >-
    Served by the fx.distort.corner-pin pass, which carries the Expansion, Perspective blend and Unstretch controls.
  io: >-
    Imported projects or presets that name CC Power Pin map onto Corner Pin with these controls filled in.
  limitations: >-
    Superseded: fx.distort.corner-pin includes every CC Power Pin control. "CC Power Pin" stays as a search alias.
    The perspective blend is reproduced visually; it is not proven bit-identical.
  disposition: superseded
  superseded_by: fx.distort.corner-pin
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Same "Pin to corners" action as Corner Pin; searching "power pin" finds it.
    defaults: >-
      Expansion 0; Perspective 100%.
    automation: >-
      Same as Corner Pin (region-corner snapping, tracker import).
    usability_check: >-
      Searching "power pin" in the effect library returns Pin to corners as the first result.
  acceptance: >-
    Mini scene "pin-window" re-run with expansion margins set; a reference render matches the expected expanded quad.
  status: not-started
  evidence: []

- id: fx.distort.cc-ripple-pulse
  name: CC Ripple Pulse
  sources:
    - ref: S02
      item: CC Ripple Pulse
      category: Distort
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S12
      item: CC Ripple Pulse
      category: Distort
      checked: true
  artist_can: >-
    Send out ripple rings whose strength follows a keyframed (or audio-driven) Pulse Level, like drops hitting water on every beat.
  projection_example: >-
    Each kick drum sends a ripple ring out from the main door across the wall.
  controls:
    - { name: "Center", type: point2d, animatable: true }
    - { name: "Pulse Level", type: float, animatable: true }
    - { name: "Time Span (sec)", type: float, animatable: true }
    - { name: "Amplitude", type: float, animatable: true }
    - { name: "Render Bump Map", type: bool, animatable: false }
  animation: >-
    Pulse Level must be animated, by keyframes, by an expression or by audio.to-keyframes; nothing ripples while it is static.
  dependencies: [anim.keyframe.core, audio.analysis, audio.to-keyframes, expr.engine]
  implementation: >-
    The ripple at time t sums Pulse Level history over Time Span. Rather than reading frame history, the property curve is sampled at fixed
    sub-steps into a uniform buffer, and warp.inverse applies the sum. Random access stays exact.
    No bounds change.
  io: >-
    none
  limitations: >-
    The history-sample count is capped (e.g. 256 per Time Span), so very fast pulse edits are band-limited.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail distortion effect or CC plug-in clone. Corner pin, mesh warp, displacement, turbulent displace, ripple, wave warp, transform, offset and the region-aware distortion recipes stay required."
  milestone: D
  beginner:
    action: >-
      "Ripple on the beat" recipe — click a point, choose which sound drives it.
    defaults: >-
      Pulse Level comes from the kick/onset band of the show music; 1.5 s time span; amplitude scaled to region size.
    automation: >-
      Links Pulse Level to the cached beat/onset signal without the user editing expressions.
    usability_check: >-
      A first-time user makes ripples fire from a door on every kick drum in under 2 min without editing an expression.
  acceptance: >-
    AS-1 audio timing check reused: ripple onsets land within 1 frame of detected beats in export.
  status: not-started
  evidence: []

