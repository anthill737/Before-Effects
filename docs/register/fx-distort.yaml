    Envelopes are approximations of Adobe's styles, not exact copies.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail distortion effect or CC plug-in clone. Corner pin, mesh warp, displacement, turbulent displace, ripple, wave warp, transform, offset and the region-aware distortion recipes stay required."
  milestone: D
  beginner:
    action: >-
      "Bend into a shape" — a thumbnail picker (Arc, Flag, Wave, Fisheye, Inflate …).
    defaults: >-
      Bend 50%; horizontal axis; Flag and Wave animate the Bend automatically.
    automation: >-
      Arc styles fit the arc to a selected roofline or arch region.
    usability_check: >-
