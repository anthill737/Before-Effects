- id: fx.distort.corner-pin
  name: Corner Pin
  sources:
    - ref: S02
      item: Corner Pin
      category: Distort
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S12
      item: Corner Pin
      category: Distort
      checked: true
  artist_can: >-
    Pin the four corners of any layer to four points so it looks painted onto a skewed surface, or swing it like a door.
  projection_example: >-
    A looping video fits into a window that the photo shows at an angle.
  controls:
    - { name: "Upper Left, Upper Right, Lower Left, Lower Right", type: "point2d[4]", animatable: true }
    - { name: "Expansion margins (top, left, right, bottom)", type: "float[4]", animatable: true }
    - { name: "Perspective blend (projective ↔ bilinear)", type: percent, animatable: true }
    - { name: "Unstretch", type: bool, animatable: false }
    - { name: "Expand output", type: bool, animatable: false }
  animation: >-
    Every corner keyframable and expression-linkable; accepts planar-tracker and region-corner data.
  dependencies: [anim.keyframe.core, map.region, proj.effect-stack]
  implementation: >-
    WGSL projective warp: the homography from the four points is solved in the TS core in double precision and inverse-mapped with
    bicubic sampling plus EWA for minification. Below 100% perspective it blends with a bilinear quad map. Bounds are the pinned quad's bbox
    plus expansion. No temporal dependency.
  io: >-
    none
  limitations: >-
    Not a substitute for projector calibration (map.calibration, out.projector-output); artistic only. Concave or self-intersecting
    quads are clamped with a warning.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Pin to corners" — drag four handles on the canvas; or "Fit to this region".
    defaults: >-
      Corners start at the layer bounds; they snap to region corners when a region is selected.
    automation: >-
      Detects the four corners of a selected region and pins to them; one click applies planar-track data.
    usability_check: >-
      A first-time user fits a video into a skewed window in under 30 s without opening the inspector.
  acceptance: >-
    AS-1 and mini scene "pin-window": video pinned to a window region; export matches preview within tolerance.
  status: not-started
  evidence: []

- id: fx.distort.detail-preserving-upscale
  name: Detail-preserving Upscale
  sources:
    - ref: S02
      item: Detail-preserving Upscale
      category: Distort
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S12
      item: Detail-preserving Upscale
      category: Distort
      checked: true
  artist_can: >-
    Enlarge low-resolution footage or images while keeping edges and texture crisp, with optional noise reduction first.
  projection_example: >-
    Scale a 1080p clip up to fill a 4K facade output without mushy edges.
  controls:
    - { name: "Scale", type: percent, animatable: true }
    - { name: "Fit to Comp Width / Fit to Comp Height", type: action, animatable: false }
    - { name: "Reduce Noise", type: float, animatable: false }
    - { name: "Detail", type: float, animatable: false }
    - { name: "Alpha", type: "enum(bilinear|bicubic)", animatable: false }
  animation: >-
    Scale keyframable. Changing Reduce Noise or Detail invalidates the cache.
  dependencies: [preview.cache, preview.proxy, proj.layer]
  implementation: >-
    Default WGSL path: optional bilateral pre-denoise, Lanczos-3 upscale and a gradient-guided detail restore, with alpha scaled separately.
    An optional "Enhance (AI)" mode runs Real-ESRGAN in the vision sidecar (CUDA) and bakes each frame once to an EXR cache keyed by source
    hash and settings, so preview and export read identical pixels. Bounds equal the scaled layer. No temporal dependency.
  io: >-
    AI mode adds a model-weights download (Real-ESRGAN, BSD-3) and cache files. Original media is never modified.
  limitations: >-
    It cannot invent real detail. AI output is not bit-identical across GPUs or drivers, so it is always baked and reused, and it may
    flicker on video. Adobe's algorithm is proprietary.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail distortion effect or CC plug-in clone. Corner pin, mesh warp, displacement, turbulent displace, ripple, wave warp, transform, offset and the region-aware distortion recipes stay required."
  milestone: D
  beginner:
    action: >-
      Offered automatically: "This clip is smaller than the wall — sharpen it up?" (one click); also listed in the effect library as "Upscale sharply".
    defaults: >-
      Scale fits the comp/region; mild noise reduction; bicubic alpha.
    automation: >-
      Detects when a source is upscaled more than 150% at export resolution and suggests the effect with a before/after split view.
    usability_check: >-
      A user accepts the upscale suggestion for a low-res clip and sees a before/after split in under 20 s.
  acceptance: >-
    Mini scene "upscale-1080-to-4k": edge-sharpness metric beats plain bicubic; AI-mode export re-render is hash-identical (from cache).
  status: not-started
  evidence: []

- id: fx.distort.displacement-map
  name: Displacement Map
  sources:
    - ref: S02
      item: Displacement Map
      category: Distort
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S12
      item: Displacement Map
      category: Distort
      checked: true
  artist_can: >-
    Push pixels horizontally and vertically by the brightness or channels of another layer: heat haze, glass, water, or "pushed through a pattern".
  projection_example: >-
    Show the facade as if seen through rippling glass, with a moving noise layer as the map.
  controls:
    - { name: "Displacement Map Layer", type: layer, animatable: false }
    - { name: "Use For Horizontal Displacement", type: "enum(red|green|blue|alpha|luminance|hue|lightness|saturation|full|half|off)", animatable: false }
    - { name: "Max Horizontal Displacement", type: float, animatable: true }
    - { name: "Use For Vertical Displacement", type: "enum(red|green|blue|alpha|luminance|hue|lightness|saturation|full|half|off)", animatable: false }
    - { name: "Max Vertical Displacement", type: float, animatable: true }
    - { name: "Displacement Map Behavior", type: "enum(center|stretch-to-fit|tile)", animatable: false }
    - { name: "Edge Behavior (Wrap Pixels Around)", type: bool, animatable: false }
    - { name: "Expand Output", type: bool, animatable: false }
  animation: >-
    Max displacements keyframable; the map layer animates on its own timeline (time-remappable).
  dependencies: [proj.layer, proj.precompose, proj.effect-stack, anim.keyframe.core]
  implementation: >-
    warp.field: the map layer is rendered to a texture and its channel read as non-color data, (v - 0.5) * 2 * max, to match Adobe's
    0–255 semantics. Bounds expand by the max displacement when Expand Output is on. The only temporal dependency is the map layer's own time.
    An option uses the map layer with its effects, removing the need for Adobe's precompose workaround.
  io: >-
    none
  limitations: >-
    In a linear-light pipeline, maps are read as raw encoded values, not linearized colour. Otherwise neutral grey would not be zero displacement.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Reached through the "Heat haze", "Look through glass" and "Turn it into water" recipes → More controls; direct entry "Push pixels with another layer".
    defaults: >-
      Recipes supply a generated noise map; max displacement is 2% of region size.
    automation: >-
      Recipes create and link the map layer and hide it from output.
    usability_check: >-
      A first-time user applies "Look through glass" to a window and sees a moving distortion in 3 or fewer actions, never choosing a map layer.
  acceptance: >-
    Mini scene "glass-window": a 50% grey map yields zero displacement (pixel-exact) and preview matches export.
  status: not-started
  evidence: []

- id: fx.distort.liquify
  name: Liquify
  sources:
    - ref: S02
      item: Liquify
      category: Distort
      adobe_support: { gpu: false, bpc: [8, 16], mfr: true }
      checked: true
    - ref: S12
      item: Liquify
      category: Distort
      checked: true
  artist_can: >-
    Push, pull, twirl, pinch, bloat, shift, reflect and clone areas of a layer with brushes, freeze areas with a mask, and reconstruct.
  projection_example: >-
    Hand-sculpt a facade so one window bloats outward and the cornice twists.
  controls:
    - { name: "Tool", type: "enum(warp|turbulence|twirl-cw|twirl-ccw|pucker|bloat|shift-pixels|reflection|clone|reconstruction)", animatable: false }
    - { name: "Brush Size, Brush Pressure", type: "float[2]", animatable: false }
    - { name: "Freeze Area Mask (with Mask Opacity/Feather)", type: mask, animatable: false }
    - { name: "Turbulent Jitter", type: float, animatable: false }
    - { name: "Clone Offset", type: point2d, animatable: false }
    - { name: "Reconstruction Mode", type: "enum(revert|displace|amplitwist|affine)", animatable: false }
    - { name: "View Options (View Mesh, Mesh Size, Mesh Color)", type: group, animatable: false }
    - { name: "Distortion Mesh", type: field, animatable: true }
    - { name: "Distortion Mesh Offset", type: point2d, animatable: true }
    - { name: "Distortion Percentage", type: percent, animatable: true }
  animation: >-
    The distortion mesh is keyframed as whole snapshots; Distortion Percentage and Offset keyframable.
  dependencies: [mask.bezier, ux.operation-system, anim.keyframe.core, preview.cache]
  implementation: >-
    Brush strokes are recorded as serializable operations that write an rg32float field on a fixed grid. One TS reference and one WGSL
    compute kernel give identical results, and the Turbulence tool uses seeded noise. Snapshots interpolate linearly and render with
    warp.field. Bounds may reach comp size.
  io: >-
    Distortion-mesh snapshots are stored as compressed float32 sidecar files in the project package.
  limitations: >-
    Adobe's per-tool falloff curves are approximated. Snapshot keyframes only interpolate linearly; fx.distort.animated-liquify adds per-stroke timing.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail distortion effect or CC plug-in clone. Corner pin, mesh warp, displacement, turbulent displace, ripple, wave warp, transform, offset and the region-aware distortion recipes stay required."
  milestone: D
  beginner:
    action: >-
      Reached as the "Push and smudge" brush under More controls; most users get the animated version (fx.distort.animated-liquify).
    defaults: >-
      Warp tool; brush 5% of region; frozen outside the selected region.
    automation: >-
      Freezes everything outside the selected region automatically; Undo works per stroke.
    usability_check: >-
      A first-time user pushes part of a wall outward and then undoes it with Reconstruct in under 60 s.
  acceptance: >-
    Mini scene "liquify-sculpt": stroke replay after reopen reproduces a hash-identical field.
  status: not-started
  evidence: []

- id: fx.distort.magnify
  name: Magnify
  sources:
    - ref: S02
      item: Magnify
      category: Distort
      adobe_support: { gpu: false, bpc: [8], mfr: true }
      checked: true
    - ref: S12
      item: Magnify
      category: Distort
      checked: true
  artist_can: >-
    Place a magnifying glass (circle or square) over part of the image, with feathered edges, blend modes and resolution-preserving scaling.
  projection_example: >-
    A magnifying glass travels along the cornice, enlarging the carved detail.
  controls:
    - { name: "Shape", type: "enum(circle|square)", animatable: false }
    - { name: "Center", type: point2d, animatable: true }
    - { name: "Magnification", type: percent, animatable: true }
    - { name: "Link", type: "enum(none|size-to-magnification|size-and-feather-to-magnification)", animatable: false }
    - { name: "Size", type: float, animatable: true }
    - { name: "Feather", type: float, animatable: true }
    - { name: "Opacity", type: percent, animatable: true }
    - { name: "Scaling", type: "enum(standard|soft|scatter)", animatable: false }
    - { name: "Blending Mode", type: enum, animatable: false }
    - { name: "Resize Layer", type: bool, animatable: false }
  animation: >-
    Center follows motion paths; Magnification and Size keyframable.
  dependencies: [mask.blend-modes, anim.motion-path, anim.keyframe.core]
  implementation: >-
    WGSL scaled sampling inside a circle or square SDF with a feathered edge. Standard is bicubic, Soft is a B-spline, and Scatter adds
    seeded jitter. Results go through the shared blend-mode compositor. Resize Layer grows the bounds by the magnified radius.
  io: >-
    none
  limitations: >-
    Adobe runs Magnify only at 8 bpc. We run in rgba16float, so results are cleaner but not identical.
  disposition: deferred
