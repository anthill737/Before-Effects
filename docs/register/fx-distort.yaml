    Evolution, Amount, Size and Offset keyframable or expression-driven. Cycle gives exact loops; an audio band can drive Amount.
  dependencies: [fx.noise-grain.fractal-noise, anim.keyframe.core, expr.engine, audio.to-keyframes]
  implementation: >-
    A stateless seeded gradient/simplex fBm is evaluated in WGSL. Evolution is a rotation in a 4D noise slice, so Cycle loops exactly.
    The noise produces displacement vectors for warp.inverse. Smoother variants use quintic interpolation plus supersampling, and Pinning
    fades displacement near the chosen edges. Resize Layer expands bounds by Amount; no temporal history.
  io: >-
    none
  limitations: >-
    Adobe's noise basis is proprietary, so patterns won't match AE pixel for pixel. Our seed semantics are stable across preview, export and machines.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Make it wobble"; it is also the engine of "Heat haze", "Make the wall breathe" and "Turn it into water".
    defaults: >-
      Seamless loop that matches the scene length; all edges pinned when applied to a region; amount 1.5% of region size.
    automation: >-
      Sets Cycle and Evolution keyframes so the loop closes exactly at the scene length.
    usability_check: >-
      A first-time user creates a wobble that loops seamlessly (last-to-first frame difference below threshold) in 3 or fewer actions.
  acceptance: >-
    Mini scene "water-wobble-loop": loop closure verified numerically; identical frames across two render workers.
  status: not-started
  evidence: []

- id: fx.distort.twirl
  name: Twirl
  sources:
    - ref: S02
      item: Twirl
      category: Distort
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S12
      item: Twirl
      category: Distort
      checked: true
  artist_can: >-
    Rotate the image around a center, more strongly at the middle, producing a whirlpool at extreme angles.
  projection_example: >-
    The facade swirls into a vortex centered on the clock face, then unswirls into the next scene.
  controls:
    - { name: "Angle", type: angle, animatable: true }
    - { name: "Twirl Radius", type: percent, animatable: true }
    - { name: "Twirl Center", type: point2d, animatable: true }
  animation: >-
    Angle is usually keyframed; center can follow a region.
  dependencies: [anim.keyframe.core, map.region]
  implementation: >-
    warp.inverse whose rotation angle is weighted by a smooth radial falloff, with adaptive 4× supersampling or EWA in the high-gradient core.
    Float32; no bounds change; no temporal dependency.
  io: >-
    none
  limitations: >-
    Extreme angles alias without supersampling, so the adaptive path is mandatory at export quality.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail distortion effect or CC plug-in clone. Corner pin, mesh warp, displacement, turbulent displace, ripple, wave warp, transform, offset and the region-aware distortion recipes stay required."
  milestone: C
  beginner:
    action: >-
      "Swirl it" / "Swirl away" (as a transition).
    defaults: >-
      Center on the selected region; angle 0 → 720° over 2 s with ease-in.
    automation: >-
      For "Swirl away", the recipe crossfades to the next scene at peak angle.
    usability_check: >-
      A first-time user creates a swirl transition between two scenes in 3 or fewer actions.
  acceptance: >-
    Mini scene "clock-vortex": no visible aliasing at 720° in a 4K export (edge-flicker metric under threshold).
  status: not-started
  evidence: []

- id: fx.distort.warp
  name: Warp
  sources:
    - ref: S02
      item: Warp
      category: Distort
      adobe_support: { gpu: false, bpc: [8, 16], mfr: true }
      checked: true
    - ref: S12
