      checked: true
    - ref: S12
      item: Ripple
      category: Distort
      checked: true
  artist_can: >-
    Make concentric ripples travel out from (or into) a point, like a stone dropped in a pond.
  projection_example: >-
    A stone "drops" onto the facade and ripples spread across the masonry.
  controls:
    - { name: "Radius", type: percent, animatable: true }
    - { name: "Center Of Ripple", type: point2d, animatable: true }
    - { name: "Type Of Conversion", type: "enum(asymmetric|symmetric)", animatable: false }
    - { name: "Wave Speed", type: float, animatable: true }
    - { name: "Wave Width", type: float, animatable: true }
    - { name: "Wave Height", type: float, animatable: true }
    - { name: "Ripple Phase", type: angle, animatable: true }
  animation: >-
    Animates by itself through Wave Speed; for variable speed set the speed to 0 and keyframe Ripple Phase.
  dependencies: [anim.keyframe.core, fx.distort.region-displace]
  implementation: >-
    warp.inverse with a radial sine wave decaying with distance. Phase = Ripple Phase + Wave Speed × t, a pure function of time with no
    history. Asymmetric adds a lateral component. No bounds change.
  io: >-
    none
  limitations: >-
    A single center; multiple impacts come from stacking or from the "Turn it into water" recipe.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Ripple like water" — click a point on the wall.
    defaults: >-
      Radius covers the selected region; asymmetric; speed set from the music tempo if present; edges pinned via region-aware displacement.
    automation: >-
      Scales wave width and height to region size.
    usability_check: >-
      A first-time user makes rings ripple from a clicked point on the facade in 3 or fewer actions.
  acceptance: >-
    Mini scene "stone-drop": a seek to random frames reproduces the exact same image as sequential playback.
  status: not-started
  evidence: []

- id: fx.distort.rolling-shutter-repair
  name: Rolling Shutter Repair
  sources:
    - ref: S02
      item: Rolling Shutter Repair
      category: Distort
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S12
      item: Rolling Shutter Repair
      category: Distort
      checked: false
    - ref: S01
      item: The Rolling Shutter Repair effect
      category: Distort
      checked: true
  artist_can: >-
    Remove the wobble and skew that phone or DSLR rolling shutters cause in moving shots.
  projection_example: >-
    Clean up a phone pan across the venue before using it as reference or show footage.
  controls:
    - { name: "Rolling Shutter Rate", type: percent, animatable: false }
    - { name: "Scan Direction", type: "enum(top-to-bottom|bottom-to-top|left-to-right|right-to-left)", animatable: false }
    - { name: "Method", type: "enum(warp|pixel-motion)", animatable: false }
    - { name: "Detailed Analysis", type: bool, animatable: false }
    - { name: "Pixel Motion Detail", type: float, animatable: false }
  animation: >-
    None; it is an analysis-based correction.
  dependencies: [track.point, preview.cache, render.queue]
  implementation: >-
    Vision sidecar (OpenCV). Warp uses sparse KLT tracks with a per-scanline motion model; Pixel Motion uses dense DIS optical flow with
    per-row time correction. Correction fields are baked per frame, cached by source hash, and rendered with warp.field. Each frame depends
    on its neighbours (t-1, t+1), so analysis runs as a background job.
  io: >-
    The analysis cache is stored beside the project and invalidated when the source changes.
  limitations: >-
    Fast subject motion or strobing can defeat the analysis. Not live-capable. S12 mentions rolling-shutter correction without
    an item section; the controls come from the dedicated S01 page.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail distortion effect or CC plug-in clone. Corner pin, mesh warp, displacement, turbulent displace, ripple, wave warp, transform, offset and the region-aware distortion recipes stay required."
  milestone: D
  beginner:
    action: >-
      "Fix wobbly phone footage" (one click on a selected clip).
    defaults: >-
      Rate 100% for phones and 60% for DSLR (from metadata when available); top-to-bottom; Warp method.
    automation: >-
      Reads camera make/model metadata to choose the rate; runs analysis in the background with progress shown.
    usability_check: >-
      A first-time user removes visible jello from a pan shot in 1 click and confirms it with a before/after toggle.
  acceptance: >-
    Mini scene "phone-pan": vertical edges straighten (measured skew under 0.5°); re-render is hash-identical from cache.
  status: not-started
  evidence: []

