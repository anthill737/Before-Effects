    - { name: Strength, type: percent, animatable: true }
    - { name: Offset per element, type: time, animatable: false }
    - { name: Feel (attack/release), type: preset, animatable: false }
  animation: >-
    Creates expression links or baked keyframes on targets; per-element offsets via index.
  dependencies: [audio.analysis, audio.envelope, audio.bands, audio.onsets, ux.recipe-engine, expr.rigs, tool.sequence-light-up]
  implementation: >-
