- id: audio.cueing
  name: Musical cueing (quantise and trigger)
  sources:
    - ref: brief
      item: §13 common musical cueing
      category: Product requirement
      checked: true
  artist_can: >-
    Quantise keyframes, layer starts and markers to beats, trigger an animation every N beats or bars, and cut scenes on bar lines.
  projection_example: >-
    A crack spreads one segment every bar; the scene changes on the downbeat of bar 33.
  controls:
    - { name: Quantise selection to, type: enum(bar|beat|half|quarter|onset), animatable: false }
    - { name: Trigger every, type: int, animatable: false }
    - { name: Trigger unit, type: enum(beat|bar|onset|marker), animatable: false }
    - { name: Swing, type: percent, animatable: false }
  animation: >-
    Generates keyframes or time-remap triggers; edits remain ordinary keyframes.
  dependencies: [audio.bpm-grid, audio.beat-markers, audio.onsets, anim.keyframe.core, anim.time-remap]
  implementation: >-
    Quantise is an op on selected keys/layers using the tempo map; triggers are recipe-generated time-remap or keyframe
    sequences retimed when the tempo map changes.
  io: >-
    none
  limitations: >-
    Retiming after a tempo change only moves generated items; hand-placed keys are left alone and flagged.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Put on the beat" on selected keyframes/layers; "Repeat every bar" on an animation.
    defaults: >-
      Nearest beat.
    automation: >-
      Shows a preview of where items will move before committing.
    usability_check: >-
      A user quantises 8 keyframes to beats in one action.
  acceptance: >-
    Mini scene "crack-per-bar": every trigger within one frame of its bar line.
  status: not-started
  evidence: []

- id: audio.sections
  name: Song sections
  sources:
    - ref: brief
      item: §13 common musical cueing; §0.6 automatically propose beat timing
      category: Product requirement
      checked: true
  artist_can: >-
