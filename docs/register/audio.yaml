- id: audio.midi-import
  name: MIDI file as a cue source
  sources:
    - ref: brief
      item: §13 common musical cueing; beat markers and BPM grid
      category: Product requirement
      checked: true
  artist_can: >-
    Import a MIDI file from the music project to get an exact tempo map and per-instrument note triggers.
  projection_example: >-
    The composer's MIDI drum track drives brick hits with sample-accurate timing instead of detected onsets.
  controls:
    - { name: MIDI file, type: file, animatable: false }
    - { name: Track / channel / note filter, type: filter, animatable: false }
    - { name: Velocity as strength, type: bool, animatable: false }
    - { name: Alignment offset, type: time, animatable: false }
  animation: >-
    Notes become onset-style triggers with velocity values.
  dependencies: [audio.bpm-grid, audio.onsets]
  implementation: >-
    Standard MIDI File parser in TypeScript core (tempo meta events → tempo map; note on/off → triggers).
  io: >-
    .mid import.
  limitations: >-
    Only useful when the music's MIDI exists and aligns with the audio render.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      Drag a .mid file onto the music clip.
    defaults: >-
      Tempo map adopted; drum notes offered as hit lanes.
    automation: >-
      Aligns MIDI to audio by cross-correlating onsets and suggests the offset.
    usability_check: >-
      A user drives an effect from a MIDI drum lane in under 2 minutes.
  acceptance: >-
    Trigger times equal MIDI note times within 1 ms after alignment.
  status: not-started
  evidence: []

- id: audio.live-input
  name: Live audio input with record/bake path
  sources:
    - ref: brief
      item: §13 live inputs need a recording/baking path for reproducible exports
      category: Product requirement
      checked: true
  artist_can: >-
    Drive visuals from a live microphone or line input during rehearsal or a show, and record that input so the same
    performance can be exported reproducibly.
  projection_example: >-
    A live drummer drives facade pulses during a rehearsal; the take is recorded and baked for the final video export.
  controls:
    - { name: Input device / channels, type: enum(dynamic), animatable: false }
    - { name: Monitor, type: bool, animatable: false }
    - { name: Record take, type: action, animatable: false }
    - { name: Bake take to audio layer, type: action, animatable: false }
  animation: >-
    Live signals feed the same driver API as pre-analysed audio; baked takes become ordinary audio layers with analysis.
  dependencies: [audio.analysis, audio.drive, show.cue-list]
  implementation: >-
    getUserMedia + AudioWorklet capture; live analysis uses the same DSP code in streaming mode; takes written to WAV
    with timestamps relative to show time, then analysed offline like any import.
  io: >-
    WAV takes stored in the project.
  limitations: >-
    Live mode is non-deterministic by nature; exports always use a recorded take. Live show operation itself is out of this area.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Audio effect processing and live audio input are not needed for music-synced shows now. Tracks, analysis, beats, cueing and export stay required."
  milestone: E
  beginner:
    action: >-
      "Use live sound" toggle; "Record this take" button.
    defaults: >-
      Default input, monitoring off.
    automation: >-
      Recorded takes are analysed and offered as the export source automatically.
    usability_check: >-
      A user records a live take and exports a video driven by it without re-routing anything.
  acceptance: >-
    Mini scene "live-take": exported motion matches the recorded take bit-exact on re-export.
  status: not-started
  evidence: []

