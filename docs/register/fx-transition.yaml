      checked: true
    - ref: S18
      item: CC Twister
      category: Transition
      checked: true
  artist_can: >-
    Twist the layer like a ribbon around an axis so its back side, another layer, swings into view.
  projection_example: >-
    A column's projected surface twists like a ribbon to reveal a new texture.
  controls:
    - { name: "Completion", type: "percent", animatable: true }
    - { name: "Backside", type: "layer-ref", animatable: false }
    - { name: "Shading", type: "bool", animatable: false }
    - { name: "Center", type: "point2d", animatable: true }
    - { name: "Axis", type: "angle", animatable: true }
  animation: >-
    All numeric controls keyframable and expression-linkable.
  dependencies: [fx.transition.scene-transition-placement, map.region]
  implementation: >-
    Per-scanline ribbon model. Along the axis, each slice rotates by an angle that ramps with completion and distance from Center; projection is computed analytically per row, and front or back is chosen by the sign of the normal. Shading uses a Lambert term. Temporal: none. Bounds: unchanged (the ribbon stays within its width). Precision: rgba16float.
  io: >-
    none
  limitations: >-
    Stylised 2.5D only.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "After Effects or CC transition clone not needed between scenes now. Linear, radial, iris, gradient, block dissolve, venetian blinds and all region, venue and path transitions stay required."
