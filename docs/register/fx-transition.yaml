- id: fx.transition.cc-warpomatic
  name: CC WarpoMatic
  sources:
    - ref: S02
      item: CC WarpoMatic
      category: Transition
      adobe_support: { gpu: false, bpc: [8, 16], mfr: true }
      checked: true
    - ref: S18
      item: CC WarpoMatic
      category: Transition
      checked: true
  artist_can: >-
    Warp and melt one image into another, driven by brightness or contrast differences between them, like a liquid morph.
  projection_example: >-
    A stone facade melts and flows into a portrait of the building's architect.
  controls:
    - { name: "Completion", type: "percent", animatable: true }
    - { name: "Layer to Reveal", type: "layer-ref", animatable: false }
    - { name: "Reactor (Brightness, Contrast Differences, Brightness Differences, Local Differences)", type: "enum", animatable: false }
    - { name: "Smoothness", type: "float", animatable: true }
    - { name: "Warp Amount", type: "float", animatable: true }
    - { name: "Warp Direction (Joint, Opposing, Twisting)", type: "enum", animatable: false }
    - { name: "Blend Span", type: "float", animatable: true }
  animation: >-
    All numeric controls keyframable and expression-linkable.
  dependencies: [fx.distort.displacement-map, fx.blur-sharpen.gaussian-blur, fx.transition.scene-transition-placement]
  implementation: >-
    Builds a reactor map from both layers (luma, contrast or local difference), smooths it with the Gaussian pass, and derives a displacement field from its gradient. Both layers are warped (jointly, opposing or twisting) and cross-blended over Blend Span as completion advances. Temporal: reads both layers at t. Bounds: union of both layers. Precision: rgba16float; gradients in f32.
  io: >-
    none
  limitations: >-
    Not a true feature-matched morph; landmark morphing needs track or puppet tools.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "After Effects or CC transition clone not needed between scenes now. Linear, radial, iris, gradient, block dissolve, venetian blinds and all region, venue and path transitions stay required."
  milestone: D
  beginner:
    action: >-
      "Melt into" transition thumbnail.
    defaults: >-
      Reactor = Local Differences, Smoothness 20, Joint direction.
    automation: >-
      Wires Layer to Reveal to the incoming scene.
    usability_check: >-
      A first-time user melts one scene into the next in at most 3 actions.
  acceptance: >-
    Mini scene "facade-melt": preview equals export.
  status: not-started
  evidence: []

- id: fx.transition.gradient-wipe
  name: Gradient Wipe
  sources:
    - ref: S02
      item: Gradient Wipe
      category: Transition
      adobe_support: { gpu: false, bpc: [8, 16], mfr: true }
      checked: true
    - ref: S18
      item: Gradient Wipe
      category: Transition
      checked: true
  artist_can: >-
    Make the layer vanish in the order set by another layer's brightness (dark first, light last), so any gradient, texture or video becomes the shape of the wipe.
  projection_example: >-
    The old scene burns away following a cloudy noise gradient, with soft smoky edges.
  controls:
    - { name: "Transition Completion", type: "percent", animatable: true }
    - { name: "Transition Softness", type: "percent", animatable: true }
    - { name: "Gradient Layer", type: "layer-ref", animatable: false }
    - { name: "Gradient Placement (Tile, Center, Stretch To Fit)", type: "enum", animatable: false }
    - { name: "Invert Gradient", type: "bool", animatable: false }
  animation: >-
    Completion and Softness keyframable and expression-linkable; the gradient layer may itself animate.
  dependencies: [proj.layer, fx.generate.gradient-ramp, fx.noise-grain.fractal-noise, fx.transition.scene-transition-placement, map.region]
  implementation: >-
    WGSL pass: coverage = 1 - smoothstep(g - s, g + s, completion·(1 + 2s) - s), where g is the gradient luminance read in f32 with the chosen placement. Temporal: reads the gradient layer at t. Bounds: unchanged. Precision: f32 gradient sampling avoids 8-bit stepping in slow wipes.
  io: >-
    none
  limitations: >-
    The gradient layer must be in the same composition (S18). Before Effects also accepts generated gradients and region distance fields without adding a layer.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Reveal with a pattern" recipe (pattern = clouds, ripples, distance from a region, or your own image).
    defaults: >-
      Fractal-noise gradient, Softness 15%.
    automation: >-
      Generates the gradient source, including "distance from selected region" fields, without a manual layer.
    usability_check: >-
      A first-time user wipes a scene away in a cloudy pattern in at most 3 actions and under 30 s.
  acceptance: >-
    Mini scene "smoke-wipe": no visible banding over an 8-second wipe in 10-bit export.
  status: not-started
  evidence: []

