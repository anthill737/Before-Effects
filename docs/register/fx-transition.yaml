      checked: true
    - ref: S18
      item: CC Radial ScaleWipe
      category: Transition
      checked: true
  artist_can: >-
    Punch an expanding hole in the layer whose edge pixels are stretched outward radially, giving a zooming "warp hole" reveal.
  projection_example: >-
    A hole tears open from the clock face and the facade image streaks outward around it to reveal a starfield.
  controls:
    - { name: "Completion", type: "percent", animatable: true }
    - { name: "Center", type: "point2d", animatable: true }
    - { name: "Reverse Transition", type: "bool", animatable: false }
  animation: >-
    Completion and Center keyframable and expression-linkable.
  dependencies: [fx.transition.iris-wipe, fx.transition.scene-transition-placement]
  implementation: >-
    Polar remap pass. Pixels at radius r outside the hole sample the source at a compressed radius, so the hole edge streaks outward; inside the hole, coverage is zero. Bicubic sampling with radial anti-aliasing. Temporal: none. Bounds: unchanged. Precision: rgba16float.
  io: >-
    none
  limitations: >-
    Circular in layer space; elliptical regions need the region-aligned option (local UV from fx.transition.region-sequenced-wipe).
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "After Effects or CC transition clone not needed between scenes now. Linear, radial, iris, gradient, block dissolve, venetian blinds and all region, venue and path transitions stay required."
