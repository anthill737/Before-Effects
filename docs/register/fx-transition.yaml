  artist_can: >-
    Stretch the layer's pixels from a dividing line out in one direction, so the image smears away like taffy.
  projection_example: >-
    The facade image stretches upward off the top of the building as if pulled into the sky.
  controls:
    - { name: "Stretch", type: "float", animatable: true }
    - { name: "Center", type: "point2d", animatable: true }
