  dependencies: [fx.transition.scene-transition-placement, fx.blur-sharpen.edge-overscan-policy]
  implementation: >-
    1D remap pass along Direction. Beyond the dividing line, samples come from a compressed coordinate (pixels at the line are stretched out by Stretch). Bicubic filtering; edge pixels are repeated. Temporal: none. Bounds: expands along Direction to the composition frame. Precision: rgba16float.
  io: >-
    none
  limitations: >-
    No Completion property; the scene-transition helper maps completion to Stretch.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
