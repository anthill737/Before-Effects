- id: tool.area-assign
  name: Assign media, pictures, animations and effects to an area
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "Easy assignment of videos, pictures, animations and effects to building areas"
      category: "Content assignment"
      checked: true
  artist_can: >-
    Drag a video, picture, animation or effect from the content browser onto an area (or a group), or select an area
    and choose "Add content". What is assigned to an area is listed on it, and that assignment is the unit you move,
    copy, replace and delete.
  projection_example: >-
    Drag Aquarium.mp4 onto the arched window, then drag Pulse onto the same window.
  controls:
    - { name: "Assignment list per area", type: "list", animatable: false }
    - { name: "Target (area, group, selection)", type: "enum", animatable: false }
    - { name: "Add as (content, effect)", type: "enum", animatable: false }
    - { name: "Enabled", type: "bool", animatable: true }
  animation: >-
    Assignment properties (opacity, effect parameters) are animatable like any layer property.
  dependencies: [tool.fill-region, proj.asset-browser, ux.effect-library, map.region, map.region-group, proj.layer, ux.apply-to-many, ux.operation-system]
  implementation: >-
    An assignment is a scene-owned project object {areaRef, contentRef, placement, clip, mode, blend, opacity, order}.
    The operation creates the layers, the region matte link and the fit transform through tool.fill-region, and
    records the assignment so the area card can list and edit it. Effects join the same stack. All edits are typed
    operations, so they undo and are available to external agents.
  io: >-
    Saved in the scene. Content is referenced by asset id.
  limitations: >-
    A scene shows only its own assignments. Areas themselves are shared by all scenes.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Drag from the content browser onto an area on the canvas, or select an area and press "Add content".
    defaults: >-
      Content fills the area and plays from the start. Effects join the area's stack.
    automation: >-
      Creates the layer, matte, fit and timing so nothing else needs to be set up.
    usability_check: >-
      A first-time user puts a video in a window in 2 or fewer deliberate actions.
  acceptance: >-
    AS-1 and mini scene "fill-three-windows": media and an effect assigned by drag, preview and export match.
  status: not-started
  evidence: []

- id: tool.assign-repeat-span
  name: Repeat per area or span across areas
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "Repeat per area versus span across areas"
      category: "Content assignment"
      checked: true
  artist_can: >-
    Choose whether one piece of content plays separately in every selected area (repeat) or is one picture laid across
    all of them and revealed through each (span). Switch between the two at any time without losing settings.
  projection_example: >-
    A fish video repeats in each of 12 windows. One cloudscape spans the whole facade and shows only inside the
    windows.
  controls:
    - { name: "Mode (repeat per area, span across areas)", type: "enum", animatable: false }
    - { name: "Span bounds (selection, group, building, custom)", type: "enum", animatable: false }
    - { name: "Per-area time offset", type: "time", animatable: true }
    - { name: "Per-area flip or variation", type: "enum", animatable: false }
  animation: >-
    Per-area offsets can be keyframed or driven by the area order.
  dependencies: [tool.area-assign, tool.apply-across-regions, map.uv-content-space, map.region-group, proj.nesting]
  implementation: >-
    Repeat instantiates the content in each area's own content space (shared source, per-instance offset and seed).
    Span places one layer in the shared surface space over the chosen bounds, with the union matte of the areas.
    Switching converts one to the other as a single undoable operation and keeps placement, trim, speed and effects.
  io: >-
    Saved in the scene.
  limitations: >-
    Span across areas on different planes uses venue UV space or the audience view, and the preview says which.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      A two-way switch on the assignment: "Same in each" or "One picture across".
    defaults: >-
      Repeat when the content is assigned to several areas.
    automation: >-
      Re-fits placement and matte when you flip the switch.
    usability_check: >-
      A first-time user flips a video from repeat to span and back in under 20 s.
  acceptance: >-
    Mini scene "repeat-vs-span": same clip repeated, then spanned across 12 windows; undo restores exactly.
  status: not-started
  evidence: []

- id: tool.content-placement
  name: Fit, fill, stretch, crop and position content in an area
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "Content placement: fit, fill, crop, position"
      category: "Content assignment"
      checked: true
  artist_can: >-
    Place content in an area: fit (whole picture inside), fill (cover, cropping the overflow), stretch, or original
    size. Then nudge position, scale and rotation, mirror it, and set the crop, with handles on the canvas.
  projection_example: >-
    A 16:9 video fills a tall narrow window with its centre cropped. A logo fits a round window and is rotated 10
    degrees.
  controls:
    - { name: "Fit mode (fit, fill, stretch, original size, tile)", type: "enum", animatable: false }
    - { name: "Position", type: "point2d", animatable: true }
    - { name: "Scale (linked or separate)", type: "float[2]", animatable: true }
    - { name: "Rotation", type: "angle", animatable: true }
    - { name: "Crop (left, top, right, bottom)", type: "float[4]", animatable: true }
    - { name: "Flip", type: "bool[2]", animatable: false }
  animation: >-
    All placement values are ordinary animatable properties.
  dependencies: [tool.area-assign, map.uv-content-space, proj.layer, mask.from-region]
  implementation: >-
    Placement is a transform in area content space (the area's bounding box or UV rectangle) that produces the layer's
    transform properties. Fit and fill are computed from source size and area aspect, and update when either changes
    unless the user has overridden them. Crop is a rectangular mask in content space.
  io: >-
    Saved with the assignment.
  limitations: >-
    Fit and fill assume the area content space is undistorted; strong perspective areas use the audience view or UV
    mapping (map.uv-content-space).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Select the content in an area, then pick Fit, Fill or Stretch and drag the handles.
    defaults: >-
      Fill for video and pictures, Fit for logos and text.
    automation: >-
      Recomputes the fit when the source or the area changes.
    usability_check: >-
      A first-time user fits and re-crops a video in a window in under 30 s.
  acceptance: >-
    Mini scene "placement-modes": the same clip in a wide, tall and round area with each mode; export matches preview.
  status: not-started
  evidence: []

- id: tool.clip-controls
  name: Trim, offset, speed, loop and audio level for content in an area
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "Clip trim, loop, speed and audio level for content in an area"
      category: "Content assignment"
      checked: true
  artist_can: >-
    For any video or animation in an area, set where it starts and ends in the clip (trim), when it starts in the
    scene (offset), how fast it plays, whether and how it loops, and its audio level, from the area's content list.
  projection_example: >-
    A 10 s ocean clip loops in three windows at 75% speed, starting 0.5 s apart, with its sound muted.
  controls:
    - { name: "Trim in and out", type: "time[2]", animatable: true }
    - { name: "Offset in scene", type: "time", animatable: true }
    - { name: "Speed", type: "percent", animatable: true }
    - { name: "Reverse", type: "bool", animatable: false }
    - { name: "Loop mode (once, loop, ping-pong, hold last frame)", type: "enum", animatable: false }
    - { name: "Audio level and mute", type: "dB + bool", animatable: true }
    - { name: "Fade in and out", type: "time[2]", animatable: false }
  animation: >-
    Speed and audio level are keyframable.
  dependencies: [tool.area-assign, proj.layer-trim, proj.layer-slip, anim.time-stretch, anim.loop, anim.time-reverse-layer, anim.freeze-frame, audio.levels]
  implementation: >-
    Controls map to layer in and out points, source offset, time stretch and the loop setting (anim.loop), with audio
    level on the layer's audio track (audio.levels). An edit that changes the clip duration shows its effect on the
    scene length instead of silently extending the scene.
  io: >-
    Saved with the assignment.
  limitations: >-
    Slow speed on low-frame-rate sources can look steppy because frame blending is deferred.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Select content in an area, then the clip bar: drag the ends to trim, pick Loop, drag the speed slider.
    defaults: >-
      Loop on, speed 100%, audio level 0 dB.
    automation: >-
      Snaps trims to beats and scene edges and reports the resulting length.
    usability_check: >-
      A first-time user loops a short clip across a 30 s scene in under 30 s.
  acceptance: >-
    Mini scene "clip-controls": trim, loop, speed and audio level on one clip; export audio and video match preview.
  status: not-started
  evidence: []

- id: tool.area-layers
  name: Several content layers in one area
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "Multiple content layers per area with ordering, opacity and blend"
      category: "Content assignment"
      checked: true
  artist_can: >-
    Stack several media items and effects in one area, reorder them, set opacity and blend mode (normal, add,
    multiply), and solo or mute each, so a background video, a smoke overlay and a glow combine.
  projection_example: >-
    One window shows a night-sky video, a bird animation added on top, and a pulsing glow at 60%.
  controls:
    - { name: "Layer order", type: "list", animatable: false }
    - { name: "Opacity", type: "percent", animatable: true }
    - { name: "Blend mode (normal, add, multiply, screen)", type: "enum", animatable: false }
    - { name: "Solo, mute", type: "bool", animatable: false }
    - { name: "Group as one", type: "action", animatable: false }
  animation: >-
    Opacity and blend mix are animatable.
  dependencies: [tool.area-assign, proj.layer-order, proj.layer-switches, mask.blend-modes, mask.blend.lighten, mask.blend.darken, proj.precompose]
  implementation: >-
    The area's assignment list is an ordered stack, rendered bottom to top inside the area matte in linear light.
    Blending uses the shared compositor modes. A stack can be grouped into a reusable scene (proj.precompose) and used
    as one item.
  io: >-
    Saved with the scene.
  limitations: >-
    Many layers of large video cost decode time; the performance advisor reports it.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Drop another item on the same area and drag it up or down in the area's content list.
    defaults: >-
      New items go on top, Normal blend, 100% opacity. Items on black default to Add.
    automation: >-
      Detects footage on black and proposes Add blending.
    usability_check: >-
      A first-time user layers a glow over a video in an area in under 45 s.
  acceptance: >-
    Mini scene "layer-stack-window": three layers with Add and Multiply; export matches preview.
  status: not-started
  evidence: []

- id: tool.copy-assignment
  name: Copy content assignments to other areas
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "Copy assignment to other areas"
      category: "Content assignment"
      checked: true
  artist_can: >-
    Copy what is on one area (content, placement, trim, speed, effects) to other areas or groups, either as linked
    copies that follow the original or as independent copies, with an offset or mirroring per area.
  projection_example: >-
    Copy window 1's setup to the other 23 windows as linked copies 0.1 s apart, then make window 12 independent.
  controls:
    - { name: "Copy mode (linked, independent)", type: "enum", animatable: false }
    - { name: "Targets (selection, group, similar areas)", type: "enum", animatable: false }
    - { name: "Per-area time offset", type: "time", animatable: true }
    - { name: "Mirror per area", type: "bool", animatable: false }
  animation: >-
    Offsets can follow area order or the music beat.
  dependencies: [tool.area-assign, tool.apply-across-regions, tool.content-placement, ux.apply-to-many, map.region-auto-group, ux.override-indicator]
  implementation: >-
    Linked copies are instances of the source assignment (tool.apply-across-regions), and exceptions are tracked
    overrides. "Make independent" detaches as one undoable operation. Placement is refitted to each target area's
    shape through tool.content-placement.
  io: >-
    Saved in the scene.
  limitations: >-
    Areas of very different shape are refitted, so the crop can differ. The preview shows each result.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Right-click an area's content, choose "Copy to other areas", then pick the areas.
    defaults: >-
      Linked, offset 0, refitted per area.
    automation: >-
      Proposes similar areas (map.region-auto-group) as targets.
    usability_check: >-
      A first-time user copies one window's setup to all other windows in under 30 s.
  acceptance: >-
    Mini scene "copy-to-23": linked copy with one exception; editing the original updates the copies.
  status: not-started
  evidence: []

- id: tool.collapse-rebuild-3d
  name: 3D collapse and rebuild with thickness, ledges and light shadows
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "3D collapse and rebuild with thickness, fragments, ledge collisions and shadows from movable lights"
      category: "3D scene and physics"
      checked: true
  artist_can: >-
    Make an area (a wall, a balcony) break into thick 3D pieces that fall, hit the real building's ledges and sills,
    tumble, pile up and then rebuild. Move the light and the shadows of the fragments move with it.
  projection_example: >-
    The panel above the door cracks, fragments land on the first-floor ledge and bounce off, then fly back in while a
    low sun sweeps shadows across the wall.
  controls:
    - { name: "Thickness", type: "length", animatable: false }
    - { name: "Break style and piece count", type: "enum + int", animatable: false }
    - { name: "Where it starts", type: "point2d", animatable: false }
    - { name: "Collide with ledges and sills", type: "bool", animatable: false }
    - { name: "Rebuild timing", type: "time", animatable: true }
    - { name: "Light that casts the shadows", type: "layer-ref", animatable: false }
  animation: >-
    Impulses and the rebuild are keyframable. Pieces come from the baked physics cache.
  dependencies: [fx.simulation.rigid-body-fracture, tool.crack-rebuild, 3d.physics-world, 3d.physics-colliders, 3d.physics-bake, 3d.shadows, 3d.light, map.derive-creative-geometry, 3d.creative-copy, 3d.extrude]
  implementation: >-
    Extends tool.crack-rebuild. The area outline is extruded to a thickness (3d.extrude). Fragments (Voronoi or brick)
    are Rapier bodies. Ledges, sills and the floor are static colliders derived read-only from the venue geometry
    (3d.physical-vs-creative). The light is an ordinary shadow-casting light, so moving it moves the shadows. Physics
    is baked (3d.physics-bake) and the rebuild is a time remap of the cache.
  io: >-
    Baked cache in the project cache folder.
  limitations: >-
    Fragments are projected light, so the illusion holds from the audience viewpoint only. A true hole depends on
    contrast with the physical wall.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      Select an area, then "Collapse and rebuild (3D)": adjust thickness, start point and light.
    defaults: >-
      Brick-style pieces, ledge collisions on, rebuild at the end of the scene.
    automation: >-
      Builds thick pieces, colliders and the bake in the background.
    usability_check: >-
      A first-time user makes a wall collapse onto a ledge and rebuild in under 3 minutes.
  acceptance: >-
    Mini scene "collapse-ledge": pieces land on a ledge, shadows follow a moving light, and seek, preview and export
    agree.
  status: not-started
  evidence: []
