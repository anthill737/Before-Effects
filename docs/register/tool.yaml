- id: tool.crack-rebuild
  name: Crack, fragment, disassemble and rebuild
  sources:
    - ref: brief §19
      item: "Build editable crack, fragment, disassembly, and rebuilding scenes"
      category: "Projection-specific creative tools"
      checked: true
    - ref: brief §0.1
      item: "Select a wall, choose 'Crack and rebuild,' and adjust intensity and duration"
      category: "Design around the result the user wants"
      checked: true
    - ref: brief §4
      item: "A collapse reverses exactly to rebuild the facade"
      category: "Animation engine"
      checked: true
  artist_can: >-
    Make a wall crack, break into blocks, fall or fly apart, and rebuild itself, with intensity, duration and break
    style under simple control.
  projection_example: >-
    Cracks race across the wall, bricks tumble out and fall, then fly back into place in exact reverse.
  controls:
    - { name: "Style (cracks only, blocks, bricks, shards)", type: "enum", animatable: false }
    - { name: "Intensity", type: "float", animatable: true }
    - { name: "Duration (break, hold, rebuild)", type: "time[3]", animatable: false }
    - { name: "Origin", type: "point", animatable: false }
    - { name: "Seed", type: "int", animatable: false }
  animation: >-
    The simulation is baked to a cache with checkpoints. The rebuild is the exact time-reverse of the cached
    collapse (anim.time-remap), and crack growth is keyframable.
  dependencies: [map.derive-creative-geometry, fx.simulation.shatter, 3d.scene, anim.time-remap, ux.recipe-engine]
  implementation: >-
    Venue-derived copy (map.derive-creative-geometry) fractured into bricks or Voronoi shards. Rapier (deterministic
    WASM) rigid-body simulation is baked to a seekable cache with checkpoints. Crack lines are animated vector paths
    (shape.path) and dark-gap shading. The background behind fragments is filled with a "void" or interior material.
    The rebuild is a time-remap of the baked cache.
  io: >-
    The simulation cache is stored with dependency hashes.
  limitations: >-
    Gaps where bricks have left show whatever is behind (dark or designed). The wall itself is still lit by the
    projector, so a true "hole" depends on contrast.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      Select a wall → "Crack and rebuild" → intensity, duration.
    defaults: >-
      Bricks style, medium intensity, 3 s break, 1 s hold, 3 s rebuild, origin at the wall centre.
    automation: >-
      Fracture geometry, simulation, cache and reverse.
    usability_check: >-
      Users create a crack-and-rebuild on a selected wall and adjust intensity in ≤3 actions.
  acceptance: >-
    AS-3 (fragmentation and reassembly; reproducible after reopening and seeking).
  status: implemented
  evidence:
    - "Crack and rebuild effect (core/recipes-crack.ts): Voronoi pieces carrying the venue photo (or lit slabs), glowing cracks along piece edges, fall or burst, rebuild; journey step crack-rebuild (16 pieces fall ~600 px and return exactly), 2026-10-02"

- id: tool.region-particles
  name: Particles from regions and along contours
  sources:
    - ref: brief §19
      item: "Let particles originate from selected physical regions or follow architectural contours"
      category: "Projection-specific creative tools"
      checked: true
    - ref: brief §11D
      item: "Architectural emission masks, deterministic seeds, surface-following options"
      category: "Simulation and particles"
      checked: true
  artist_can: >-
    Make particles (sparks, snow, petals, embers, smoke-like wisps) pour out of windows, rise from the roofline, or
    run along edges, reproducibly.
  projection_example: >-
    Golden sparks stream from every window and drift up past the roofline; snow settles along the ledges.
  controls:
    - { name: "Emit from (region area, region edge, path)", type: "enum", animatable: false }
    - { name: "Particle look (sparks, snow, petals, embers, smoke, custom sprite)", type: "enum", animatable: false }
    - { name: "Amount", type: "float", animatable: true }
    - { name: "Direction / gravity / wind", type: "vec2 + float", animatable: true }
    - { name: "Follow contour", type: "bool", animatable: false }
    - { name: "Seed", type: "int", animatable: false }
  animation: >-
    Deterministic seeded simulation with checkpointed state for seek and replay. Emission rate is keyframable and
    beat-drivable.
  dependencies: [fx.simulation.particle-system, fx.simulation.particle-playground, tool.region-link, tool.beat-sync, ux.recipe-engine]
  implementation: >-
    GPU compute particles (WGSL) with emitters sampled from region coverage (area) or region outlines (edge,
    arc-length sampling), and an optional contour-following force field (distance-field gradient from region
    edges). Seeded deterministic integration, checkpointed every N frames for random-access seeking.
  io: >-
    Checkpoint cache stored with the project.
  limitations: >-
    Collisions with real architecture are approximated by region/model geometry only.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      Select regions → "Particles from here" → look, amount, direction.
    defaults: >-
      Sparks, medium amount, upward drift, seed fixed.
    automation: >-
      Emitters, scale (particle size in cm from region size) and caching.
    usability_check: >-
      Users make sparks rise from selected windows in ≤3 actions; the result is identical after reopen and seek
      (automated).
  acceptance: >-
    AS-3 (reproducible particles after reopening and seeking).
  status: not-started
  evidence: []

