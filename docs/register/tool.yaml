    viewpoint.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Select a wall → "Make it breathe" / "Ripple" / "Melt".
    defaults: >-
      Medium intensity; light from the top-left.
    automation: >-
      Texture source picked from the venue photo; scale from the wall size.
    usability_check: >-
      Users create a breathing-wall effect and adjust its intensity in ≤3 actions.
  acceptance: >-
    AS-3 (apparent wall deformation).
  status: not-started
  evidence: []

