# Projection-specific creative tools — Before Effects capability register
# Sources: brief §0.1, §0.5, §1, §4, §5, §6, §7, §8, §11, §13, §15, §19, §22. Product-only requirements (no vendor source); checked against the brief 2026-10-01.

- id: tool.edge-trace
  name: Trace edges with light
  sources:
    - ref: brief §19
      item: "Select a building edge and create an editable tracing animation"
      category: "Projection-specific creative tools"
      checked: true
    - ref: brief §0.1
      item: "Click a roofline, choose 'Trace with light,' select color and speed, and preview it"
      category: "Design around the result the user wants"
      checked: true
    - ref: brief §22
      item: "AS-1 Architectural trace"
      category: "Acceptance shows"
      checked: true
  artist_can: >-
    Click edges (roofline, window frames, columns) and get light travelling along them. Choose colour, speed, length
    and glow; everything underneath stays editable paths, trim animation and effects.
  projection_example: >-
    A white comet of light runs around every window frame in turn, then along the roofline, timed to the music.
  controls:
    - { name: "Colour", type: "color", animatable: true }
    - { name: "Speed (m/s) or duration", type: "float", animatable: true }
    - { name: "Trail length", type: "percent", animatable: true }
    - { name: "Glow", type: "float", animatable: true }
    - { name: "Direction / start point", type: "enum + point", animatable: false }
    - { name: "Order and delay across edges", type: "enum + time", animatable: true }
  animation: >-
    Generates trim-path keyframes with constant-speed (arc-length) motion by default. Speed graph editable in
    anim.graph-editor; delays driven by group index (expression); optional beat snapping.
  dependencies: [ux.recipe-engine, tool.region-link, map.region, map.region-group, shape.path, shape.layer, fx.generate.stroke, fx.stylize.glow, anim.graph-editor, expr.rigs, tool.beat-sync]
  implementation: >-
    Recipe: for each target edge/region, a shape layer with a stroke whose path is live-linked to the region outline
    (tool.region-link), a trim-paths animator (start/end offsets from arc length so speed is constant in metres), and
    a glow (mask.layer-styles / fx.stylize.glow). Per-member delay comes from a rig expression on the group index.
    Rendering uses Skia CanvasKit path ops and GPU stroke rasterization.
  io: >-
    Saved as an ordinary recipe instance with overrides. Rebinding regenerates paths for new edges.
  limitations: >-
    Light follows the traced or modelled edge. If the outline is off, the trace is off — fix the region, not the
    animation.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Select edges or regions → "Trace with light" → colour, speed, glow.
    defaults: >-
      Warm white, 3 m/s, 25% trail, medium glow, clockwise from top-left. Groups run left to right with 0.2 s delay.
    automation: >-
      Creates paths, trim animation, glow and timing. Speed and glow size scale to the region size.
    usability_check: >-
      §0.10: from a selection, a first-time user creates and previews a roofline trace in ≤3 deliberate actions and
      under 1 minute, without opening the timeline.
  acceptance: >-
    AS-1 (paths around windows and rooflines, timed to audio, with repeaters, glow, masks and an editable speed
    graph).
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: tool.sequence-light-up
  name: Light up one after another
  sources:
    - ref: brief §0.1
      item: "Select windows, choose 'Light up one after another,' and adjust order and delay"
      category: "Design around the result the user wants"
      checked: true
    - ref: brief §19
      item: "Assign a reusable animation to all windows with adjustable order and delays"
      category: "Projection-specific creative tools"
      checked: true
    - ref: brief §5
      item: "Animate 100 windows using one rig, with each window's index determining its delay and color"
      category: "Expressions, controllers, and reusable rigs"
      checked: true
  artist_can: >-
    Select windows (or any regions) and make them light up one after another. Choose the order, the delay, how each
    lights (fade, flash, colour, any look), and whether they stay lit.
  projection_example: >-
    24 windows light up warm yellow from bottom-left to top-right, 0.15 s apart, then switch off in reverse.
  controls:
    - { name: "Order (left→right, top→bottom, centre-out, random, along a path, custom)", type: "enum", animatable: false }
    - { name: "Delay between windows", type: "time", animatable: true }
    - { name: "Look (fill colour, any library look)", type: "recipe-ref", animatable: false }
    - { name: "Fade in / hold / fade out", type: "time[3]", animatable: true }
    - { name: "Then (stay on, switch off, reverse)", type: "enum", animatable: false }
  animation: >-
    One rig drives all members: delay = index × spacing (or beat-snapped), with seeded random order stable between
    preview and export.
  dependencies: [ux.recipe-engine, tool.apply-across-regions, tool.region-link, map.region-group, expr.rigs, anim.keyframe.core, tool.beat-sync]
  implementation: >-
    A recipe over tool.apply-across-regions: one source animation, instanced per member with an index-based time
    offset read from the region group's order. Region mattes come from tool.region-link. The seeded order uses the
    stateless core RNG.
  io: >-
    Recipe instance; rebinding to a venue with a different window count respaces per the map.rebind policy.
  limitations: >-
    None specific; very large member counts (thousands) rely on instanced rendering.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Select windows → "Light up one after another" → drag the order arrow, set the delay.
    defaults: >-
      Left to right, 0.2 s delay, warm white fill with 0.3 s fades, stay on.
    automation: >-
      Order from geometry, delay fitted to the music beat when music exists, and total duration fitted to the scene.
    usability_check: >-
      §0.10: users apply the sequence to an existing selection of 24 windows in ≤3 deliberate actions, then reverse
      the order in 1 more.
  acceptance: >-
    AS-1. Mini scene "100-windows": 100 instances, seeded order identical across preview, export and reopen.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: tool.fill-region
  name: Put content on a region
  sources:
    - ref: brief §0.2
      item: "Set up the space → Add content"
      category: "Clear, flexible route through a show"
      checked: true
    - ref: brief §6
      item: "A texture appears only inside selected windows"
      category: "Masks, mattes, compositing"
      checked: true
  artist_can: >-
    Drop a video, image, colour or generator onto a region or group and have it fit automatically — per window,
    spanning the whole group, or as one picture across the wall.
  projection_example: >-
    A fish-tank video fills each window separately; a cloud video spans the whole facade, showing only inside the
    windows.
  controls:
    - { name: "Fit (fill, fit, stretch, tile)", type: "enum", animatable: false }
    - { name: "Spread (each region, across the group)", type: "enum", animatable: false }
    - { name: "Position / scale / rotation inside region", type: "transform", animatable: true }
    - { name: "Edge softness", type: "float", animatable: true }
  animation: >-
    Transforms and softness are keyframable. Video time can be offset per region.
  dependencies: [tool.region-link, map.uv-content-space, proj.layer, mask.track-matte]
  implementation: >-
    An op creates a layer (footage/solid/generator) in the region's content space with a fit transform, plus a
    region matte from tool.region-link. "Across the group" uses one layer in the shared surface space with the union
    matte. Media import uses the standard pipeline (ux.auto-media-prep).
  io: >-
    Ordinary layers and mattes.
  limitations: >-
    None specific.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Drag a file or library item onto a region on the canvas.
    defaults: >-
      Fill each region; video starts at the scene start.
    automation: >-
      Fit, matte creation and media conversion.
    usability_check: >-
      Users put a video into 6 selected windows in ≤2 actions (drag + drop).
  acceptance: >-
    §6 acceptance example (texture only inside selected windows, soft reveals). AS-1.
  status: not-started
  evidence: []

- id: tool.region-link
  name: Region-linked masks, mattes and paths
  sources:
    - ref: brief §0.1
      item: "The app creates the necessary masks, paths, layers... underneath these actions"
      category: "Design around the result the user wants"
      checked: true
    - ref: brief §6
      item: "Reusable matte sources; traveling reveals"
      category: "Masks, mattes, compositing"
      checked: true
  artist_can: >-
    Use any region or group as a mask, matte or path for creative work. It stays linked, so editing the region
    updates every effect that uses it.
  projection_example: >-
    A glow path linked to the roofline region updates itself after the roofline is corrected.
  controls:
    - { name: "Source region/group", type: "region-ref", animatable: false }
    - { name: "Use as (matte, mask, path)", type: "enum", animatable: false }
    - { name: "Expand / feather", type: "float[2]", animatable: true }
    - { name: "Link (live, frozen copy)", type: "enum", animatable: false }
  animation: >-
    Expansion and feather are animatable. The linked shape itself follows the region (static), and a frozen copy can
    be keyframed.
  dependencies: [map.region, map.binding, mask.bezier, mask.track-matte, shape.path]
  implementation: >-
    A reference node that resolves a role (through the binding) to region geometry in content space at evaluation
    time, producing a Skia path (for masks and shape paths) or a coverage texture (for mattes). It is cached by
    region hash. "Frozen copy" converts to an ordinary mask.bezier or shape.path.
  io: >-
    Saved as role references, so it survives rebinding.
  limitations: >-
    These are creative mattes, not installation output masks (out.output-mask).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Usually invisible (recipes create links). In More controls: "Only show inside: Windows".
    defaults: >-
      Live link, no feather.
    automation: >-
      Created by recipes and fill-region.
    usability_check: >-
      After correcting a region outline, users confirm all dependent effects updated without any further action.
  acceptance: >-
    AS-1. Mini scene "region-edit-propagates".
  status: not-started
  evidence: []

- id: tool.show-logic
  name: Venue-independent show logic
  sources:
    - ref: brief §19
      item: "Store venue-independent show logic separately from installation bindings"
      category: "Projection-specific creative tools"
      checked: true
    - ref: brief §1
      item: "A design can be reused on another installation without rebuilding its animation from scratch"
      category: "What the product must enable"
      checked: true
  artist_can: >-
    Build the show in terms of meanings ("the windows in order", "the hero wall", "the roofline") instead of
    particular pixels, so it can be moved to another building.
  projection_example: >-
    A Christmas show written for "Windows, Roofline, Door, Wall" runs on three different buildings.
  controls:
    - { name: "Roles used by the show (name, type, ordered?)", type: "list", animatable: false }
    - { name: "Relative units (region size, show length, beats)", type: "enum", animatable: false }
  animation: >-
    Animation parameters are expressed relative to roles (fraction of edge length, metres scaled by region size,
    beats), so they adapt on rebinding.
  dependencies: [map.binding, ux.recipe-engine, proj.project-model]
  implementation: >-
    The project model stores the show as compositions and recipe instances that reference roles, never venue region
    IDs. Each role declares type, cardinality and ordering expectations. Units are stored relative where recipes
    declare it. A lint flags absolute venue-specific values (e.g. hand-placed pixel positions) that will not adapt.
  io: >-
    The show exports without the venue. Binding and venue are separate files.
  limitations: >-
    Hand-placed absolute animation and viewpoint-specific illusions are venue-specific by nature; they are flagged,
    not hidden.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Invisible: working through regions and recipes creates roles automatically. "Use on another space" exposes the
      result.
    defaults: >-
      Relative units for every recipe parameter.
    automation: >-
      Role creation, relative units and portability lint.
    usability_check: >-
      Automated: the sample show rebinds to a second venue with zero manual fixes for recipe-only content.
  acceptance: >-
    AS-7 (bind the same show to another venue).
  status: not-started
  evidence: []

- id: tool.apply-across-regions
  name: One animation across many surfaces
  sources:
    - ref: brief §0.5
      item: "Applying one animation across many surfaces in a single action"
      category: "Visual library of editable outcomes"
      checked: true
    - ref: brief §19
      item: "Assign a reusable animation to all windows"
      category: "Projection-specific creative tools"
      checked: true
  artist_can: >-
    Make one animation and apply it to many regions at once, with automatic offsets and variation. Edit the original
    and every copy updates; change one copy only when you want an exception.
  projection_example: >-
    One "breathing glow" animation drives 40 windows with per-window delay by distance from the door; window 12 gets
    a red exception.
  controls:
    - { name: "Targets", type: "role-ref", animatable: false }
    - { name: "Offset by (index, position, distance from point, random)", type: "enum", animatable: false }
    - { name: "Offset amount", type: "time", animatable: true }
    - { name: "Variation (colour, intensity, seed)", type: "float[]", animatable: true }
    - { name: "Exceptions (per instance)", type: "list", animatable: false }
  animation: >-
    Instances share the source keyframes; each instance's time offset and variation come from rig expressions
    (expr.rigs) using index/position.
  dependencies: [expr.rigs, map.region-group, ux.recipe-engine, proj.precompose]
  implementation: >-
    Instancing: a source composition or recipe with instance parameters (index, count, normalized position, seed).
    Instances are evaluated with per-instance time offsets; GPU instancing is used where layers are identical except
    for parameters. Exceptions are per-instance override records (ux.override-indicator).
  io: >-
    Saved as a source plus an instance table.
  limitations: >-
    Effects that read neighbouring instances (e.g. one window's light spilling into the next) need a group-level
    effect instead.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Through ux.apply-to-many: select many regions, apply any look; an "Offset" control appears automatically.
    defaults: >-
      Offset by order, 0.1 s.
    automation: >-
      Instancing, offsets and seeds.
    usability_check: >-
      Users give one window an exception colour without breaking the others, in under 1 minute.
  acceptance: >-
    AS-1. Mini scene "100-windows".
  status: not-started
  evidence: []

- id: tool.light-sweep
  name: Light sweeps across the architecture
  sources:
    - ref: brief §19
      item: "Generate light sweeps"
      category: "Projection-specific creative tools"
      checked: true
    - ref: brief §11B
      item: "Light rays/sweeps/bursts"
      category: "Generators and light effects"
      checked: true
  artist_can: >-
    Send bands of light across the building in any direction — following the facade's real geometry, catching edges,
    and staying aligned across walls.
  projection_example: >-
    A diagonal golden sweep passes over the facade from left to right, brightening the window frames as it passes.
  controls:
    - { name: "Direction", type: "angle", animatable: true }
    - { name: "Width / softness", type: "float[2]", animatable: true }
    - { name: "Colour / intensity", type: "color + float", animatable: true }
    - { name: "Speed or duration", type: "float", animatable: true }
    - { name: "Highlight edges", type: "float", animatable: true }
  animation: >-
    The sweep position is keyframed by default with ease; optionally beat-triggered repeats.
  dependencies: [ux.recipe-engine, fx.generate.cc-light-sweep, fx.stylize.glow, map.uv-content-space, tool.region-link]
  implementation: >-
    A recipe built on a sweep generator evaluated in venue/world space (WGSL: band SDF along a direction in metres),
    so it stays continuous across surfaces and projectors. The optional edge highlight uses region outlines or model
    edges as an additive mask.
  io: >-
    None.
  limitations: >-
    None specific.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Select a wall or the whole building → "Light sweep" → direction arrow, speed, colour.
    defaults: >-
      Left to right, 2 s, soft warm white.
    automation: >-
      Width scaled to the facade, duration to the music phrase.
    usability_check: >-
      Users create a diagonal sweep timed to a bar of music in ≤3 actions.
  acceptance: >-
    AS-5 (crosses the projector overlap). Mini scene "sweep-two-walls".
  status: not-started
  evidence: []

- id: tool.beat-sync
  name: Move with the beat
  sources:
    - ref: brief §0.1
      item: "Add music, choose 'Move with the beat,' and control which elements respond and how strongly"
      category: "Design around the result the user wants"
      checked: true
    - ref: brief §13
      item: "Beat markers, BPM grid, editable onset detection, frequency-band control signals, smoothing/attack/release"
      category: "Sound and music-driven animation"
      checked: true
  artist_can: >-
    Make selected elements react to the music — pulse, flash, scale, shift colour — choosing which part of the music
    (beat, bass, highs) drives which elements, and how strongly.
  projection_example: >-
    Windows pulse blue on every kick drum; the roofline trace flashes on snares.
  controls:
    - { name: "Respond to (beat, bass, mids, highs, onsets, loudness)", type: "enum", animatable: false }
    - { name: "What moves (brightness, size, colour, position, speed)", type: "enum", animatable: false }
    - { name: "Strength", type: "percent", animatable: true }
    - { name: "Smoothness (attack/release)", type: "float[2]", animatable: true }
    - { name: "Which elements", type: "selection", animatable: false }
  animation: >-
    Driven from cached audio analysis (audio.analysis), so preview and export see identical data. Convertible to
    keyframes (audio.to-keyframes).
  dependencies: [audio.analysis, audio.to-keyframes, audio.track, expr.engine, ux.recipe-engine]
  implementation: >-
    A recipe adds an audio-reactive controller (expression control fed by the cached analysis track: beats, onsets,
    band envelopes with attack/release) and links it to target properties with mapping curves. Beat markers are
    editable on the timeline.
  io: >-
    The analysis cache is saved with the project. Optional bake to keyframes.
  limitations: >-
    Beat detection can be wrong on complex music. Markers are editable, and "tap tempo" is a manual alternative.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Add music → select elements → "Move with the beat" → choose what responds and how strongly.
    defaults: >-
      Beat drives brightness at 60% strength, with short attack and medium release.
    automation: >-
      Analysis, beat grid and mapping.
    usability_check: >-
      §0.10: users make windows pulse with the music in ≤3 actions; the pulses visibly land on beats (rated by 2
      observers).
  acceptance: >-
    AS-1 (timed to audio). Mini scene "beat-export-match": the frames where pulses peak are identical in preview and
    export.
  status: implemented
  evidence:
    - "journey: import-media (picture, video, music copied into project media; beat found 119.9 BPM), video-in-windows (frame-accurate FFmpeg decode, proxy sizes for preview), music-on-timeline (waveform), move-with-beat, audio-preview-sync (picture follows sound clock, 0 ms), export-with-sound (Sound: yes), av-timing-measured (59/59 clicks paired, mean 1 ms, worst 1 frame @30 fps)"
    - "unit: packages/core/test/audio.test.ts (tempo 90/120/128/140 BPM within 2 BPM, beats within 30 ms, downbeat phase, deterministic)"

- id: tool.text-columns
  name: Words across columns
  sources:
    - ref: brief §8
      item: "Words spread across architectural columns; letters rotate forward; timing editable from one text layer"
      category: "Text and typography"
      checked: true
    - ref: brief §1
      item: "Typography animates in coordination with music and the building's geometry"
      category: "What the product must enable"
      checked: true
  artist_can: >-
    Spread a phrase across columns, windows or panels (one word or letter per region) and animate it in with one
    editable text layer.
  projection_example: >-
    "HAPPY NEW YEAR" — one word per column group — letters rotate forward one by one on the beat.
  controls:
    - { name: "Text", type: "string", animatable: true }
    - { name: "Split by (letter, word, line)", type: "enum", animatable: false }
    - { name: "Target regions (ordered)", type: "role-ref", animatable: false }
    - { name: "Font, size fit, colour", type: "font + enum + color", animatable: true }
    - { name: "Entrance style", type: "recipe-ref", animatable: false }
  animation: >-
    Uses text animators and selectors (per character/word) with per-unit offsets. Timing stays in one text layer.
  dependencies: [text.layer, text.animator, map.region-group, ux.recipe-engine, tool.beat-sync]
  implementation: >-
    One text layer with HarfBuzz shaping. A layout mode places each text unit at the centroid/fit-box of its target
    region (per-unit transforms from region data), and the entrance animation uses text.animator selectors
    offset by unit index. Re-layout happens on rebinding.
  io: >-
    None.
  limitations: >-
    If the counts of units and regions differ, the app asks: wrap, shrink to fit, or skip.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Select columns → "Words across these" → type the text.
    defaults: >-
      One word per region, fit to width, bold sans, fade-up entrance.
    automation: >-
      Splitting, fitting and ordering.
    usability_check: >-
      Users spread a 4-word phrase over 4 columns and change the font in under 2 minutes.
  acceptance: >-
    Mini scene "columns-text".
  status: not-started
  evidence: []

- id: tool.region-transition
  name: Region-following transitions
  sources:
    - ref: brief §11G
      item: "Build transitions that can follow installation regions rather than always sweeping across a rectangular video frame"
      category: "Transitions"
      checked: true
  artist_can: >-
    Change from one scene to the next region by region — windows flipping one after another, walls wiping
    separately, the roofline revealing last.
  projection_example: >-
    The winter scene replaces the autumn scene window by window from the centre out, then walls dissolve.
  controls:
    - { name: "Order (as group order, centre-out, random)", type: "enum", animatable: false }
    - { name: "Per-region transition (wipe, dissolve, flip, any library transition)", type: "recipe-ref", animatable: false }
    - { name: "Duration / overlap", type: "time[2]", animatable: true }
  animation: >-
    Progress keyframes per region, generated from one master progress curve and offsets.
  dependencies: [tool.apply-across-regions, tool.region-link, fx.transition.linear-wipe, fx.transition.block-dissolve]
  implementation: >-
    A recipe instancing a transition effect per region matte, with a per-region progress offset from order. Usable
    between timeline scenes and as show.transition between cues.
  io: >-
    None.
  limitations: >-
    None specific.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Between two scene blocks → transition chip → "Window by window".
    defaults: >-
      Centre-out dissolve, 2 s total.
    automation: >-
      Order and offsets.
    usability_check: >-
      Users replace a crossfade with a window-by-window transition in ≤3 actions.
  acceptance: >-
    Mini scene "region-transition-cue".
  status: not-started
  evidence: []

- id: tool.surface-deform
  name: Apparent surface deformation
  sources:
    - ref: brief §19
      item: "Generate apparent surface deformation"
      category: "Projection-specific creative tools"
      checked: true
    - ref: brief §11A
      item: "Breathing walls, melting facades, liquid surfaces, rippling masonry"
      category: "Distortion and deformation"
      checked: true
  artist_can: >-
    Make a solid wall seem to breathe, bulge, ripple or melt. The app warps the wall's own photo texture and adds
    matching fake shading, so the illusion reads from the street.
  projection_example: >-
    The brick wall inhales and exhales twice, then ripples outward from the door as if hit by a wave.
  controls:
    - { name: "Type (breathe, bulge, ripple, melt, push out)", type: "enum", animatable: false }
    - { name: "Intensity", type: "float", animatable: true }
    - { name: "Centre / direction", type: "point + angle", animatable: true }
    - { name: "Speed", type: "float", animatable: true }
    - { name: "Shading strength", type: "float", animatable: true }
  animation: >-
    Keyframed intensity envelope by default; expressions for loops; optional beat drive.
  dependencies: [fx.distort.displacement-map, fx.distort.turbulent-displace, fx.distort.bulge, fx.distort.wave-warp, map.venue-preview, ux.recipe-engine]
  implementation: >-
    A recipe: the venue photo texture (or a generated brick texture) is displaced by an animated displacement field
    in surface space, and a fake-lighting pass derives normals from the field's gradient. It adds highlight and
    shadow consistent with a chosen virtual light, so the flat wall appears to move. Region outlines can stay pinned.
  io: >-
