- id: fx.keying.unmult
  name: Unmult (remove black or white background)
  sources:
    - ref: S37
      item: Unmult effect
      category: Keying
      adobe_support:
        gpu: null
        bpc: [8, 16, 32]
        mfr: null
      checked: true
    - ref: S02
      item: Unmult
      category: Keying
      checked: false
  artist_can: >-
    Remove a solid black or white background from elements such as fire, sparks, smoke, paint splashes and light leaks. Their colours stay at full strength instead of being darkened.
  projection_example: >-
    Drop stock fire, sparks or light-leak clips shot on black onto the facade without black boxes or dimmed edges.
  controls:
    - { name: Background Color (Black / White), type: enum, animatable: false }
    - { name: Black Level, type: number, animatable: true }
    - { name: White Level, type: number, animatable: true }
    - { name: Softness, type: number, animatable: true }
    - { name: Remove Color Matting, type: bool, animatable: false }
    - { name: Clip HDR Results, type: bool, animatable: false }
  animation: >-
    Levels and softness keyframable, for example to fade an element in by raising its black level.
  dependencies: [proj.effect-stack, color.management, fx.channel.remove-color-matting]
  implementation: >-
    WGSL pass. On black, alpha comes from max(r,g,b) after the black-level and softness remap; on white, from 1 - min(r,g,b). Colour is divided by alpha so that re-premultiplying reproduces the source (Remove Color Matting), with an optional clamp for HDR values.
  io: >-
    none
  limitations: >-
    Absent from the S02 matrix as of 2026-10-01, so Adobe's GPU and MFR status is unknown. Unmult is not a screen key; a dark subject on black loses opacity by design.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Remove the black background" (or "white background") applied automatically when a clip is dragged in, and offered as a one-click chip on the layer.
    defaults: >-
      Black background, levels at 0, Remove Color Matting on.
    automation: >-
      On import, detects stock elements on a near-uniform black or white background and offers the fix; it can also switch the layer to Add or Screen blending instead.
    usability_check: >-
      A first-time user puts the supplied fire-on-black clip onto the facade with no visible black box in one action and under 10 s.
  acceptance: >-
    Mini scene "fire-on-black": element composited over the facade with no luminance loss versus Add-mode reference within tolerance; export matches preview.
  status: not-started
  evidence: []

- id: fx.keying.remove-background-recipe
  name: Remove the green background (key recipe)
  sources:
    - ref: S37
      item: Keylight + Key Cleaner + Advanced Spill Suppressor animation preset
      category: Keying
      checked: true
    - ref: brief
      item: §0.1, §0.4, §11J, §22 show 4
      category: product requirement
      checked: true
  artist_can: >-
    Remove a green or blue screen with one action and get a complete, editable chain (screen key, edge cleanup, spill removal, choke and edge refinement). A few plain controls adjust the whole chain.
  projection_example: >-
    Put a performer filmed on green screen into a window of the building for a show's opening scene.
  controls:
    - { name: Background colour (auto / pick), type: color, animatable: true }
    - { name: Edge softness, type: number, animatable: true }
    - { name: Edge shrink, type: number, animatable: true }
    - { name: Remove green tint, type: bool, animatable: true }
    - { name: Quality (Fast / Best / AI-assisted), type: enum, animatable: false }
  animation: >-
    Simple controls map to underlying effect properties via recipe overrides; any underlying property remains keyframable.
  dependencies: [ux.recipe-engine, ux.effect-library, ux.operation-system, fx.keying.keylight-1-2, fx.keying.key-cleaner, fx.keying.advanced-spill-suppressor, fx.matte.simple-choker, fx.matte.refine-soft-matte, fx.keying.ml-matte-fallback, fx.matte.premultiply-fringe-diagnostics]
  implementation: >-
    A recipe-engine template that emits real effect-stack ops in the S37 order: screen key, Key Cleaner, Advanced Spill Suppressor, then Simple Choker and Refine Soft Matte. An expression links the spill key colour to the screen colour. Manual edits are tracked as recipe overrides, and the AI-assisted quality level swaps in the sidecar matte.
  io: >-
    none
  limitations: >-
    Automatic screen detection assumes a dominant screen hue at the frame borders. Unusual screens fall back to clicking the background.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Keying and spill removal serve live-action compositing, not projection (projected black is already no light). Unmult stays required for stock elements on black."
  milestone: D
  beginner:
    action: >-
      Select a clip → "Remove the green background" (search also matches "remove blue screen", "cut out person").
    defaults: >-
      Auto screen colour, Fast quality during preview, Best for export, spill removal on, edge shrink 0.5 px.
    automation: >-
      Samples the screen, orders the chain, sets the choke from measured fringe width, and shows the result over the venue preview with a fringe overlay.
    usability_check: >-
      A first-time user completes the AS-4 key on the supplied clip in three actions or fewer, under 90 s, with no external instructions, and can undo it in one action.
  acceptance: >-
    AS-4: supplied clip keyed, reopened and re-exported identically; the generated chain is inspectable and editable without breaking the recipe.
  status: not-started
  evidence: []

- id: fx.keying.ml-matte-fallback
  name: AI-assisted cutout (ML matting fallback)
  sources:
    - ref: S21
      item: AI-powered Object Matte
      category: Roto Brush and Refine Matte
      checked: true
    - ref: brief
      item: §11J, §12 (separate engines/models with fallbacks)
      category: product requirement
      checked: true
  artist_can: >-
    Get a clean, soft-edged cutout when a colour key fails: bad lighting, compressed footage, a moving camera or no screen at all. The result stays editable and cacheable.
  projection_example: >-
    Cut out a performer filmed against the real building at dusk, where no colour or difference key can separate them.
  controls:
    - { name: Subject selection (click / box / existing key or roto as hint), type: action, animatable: false }
    - { name: Model (Video matting / Single-frame high detail), type: enum, animatable: false }
    - { name: Edge detail, type: number, animatable: false }
    - { name: Temporal stability, type: number, animatable: false }
    - { name: Correction strokes (keep / remove), type: stroke-set, animatable: true }
  animation: >-
    The output is a cached matte sequence. Correction strokes can be keyframed per frame span and trigger re-propagation of only the affected range.
  dependencies: [track.roto, preview.cache, proj.effect-stack, fx.matte.refine-soft-matte, fx.keying.inner-outer-key]
  implementation: >-
    Vision sidecar (uv venv, CUDA). SAM 2 produces the subject mask, which is eroded and dilated into a trimap (or a user key supplies it). A matting model then outputs alpha and foreground colour: a video model with temporal memory (MatAnyone or RobustVideoMatting candidates) or a per-frame model (ViTMatte or BiRefNet candidates). Results are written as 16-bit or EXR frames into preview.cache, keyed by source hash, model version and params, so preview and export read identical pixels.
  io: >-
    The model weights are an installable component. Exports read the cached frames, and the cache is collected with the project when the model is unavailable on another machine.
  limitations: >-
    Model licences must be verified per model (some are non-commercial, which is acceptable for personal use). Results are not bit-reproducible across model versions, so the version is pinned in the cache key. Inference cost is significant at 4K.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Keying and spill removal serve live-action compositing, not projection (projected black is already no light). Unmult stays required for stock elements on black."
  milestone: D
  beginner:
    action: >-
      "Cut out the performer" → click the person; or the "Remove the green background" recipe → Quality "AI-assisted".
    defaults: >-
      Video model, medium edge detail, processing in the background with progress shown on the layer.
    automation: >-
      Builds the trimap, runs the job in the background, caches the result, and invalidates only frames affected by a correction stroke.
    usability_check: >-
      A first-time user produces a usable cutout of the supplied no-screen clip in two clicks, and fixes one bad frame with one correction stroke, without help.
  acceptance: >-
    AS-4 (no-screen variant): cutout cached, project reopened, export identical to preview; reports which model and version produced it.
  status: not-started
  evidence: []
