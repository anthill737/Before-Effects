- id: color.diagnostics
  name: Clipping and gamut diagnostics
  sources:
    - ref: brief
      item: §14 clipping/gamut diagnostics
      category: Product requirement
      checked: true
    - ref: S01
      item: Adjust exposure in the Composition panel (32-bpc viewing)
      category: View and preview
      checked: false
  artist_can: >-
    See where the image clips, goes out of the output gamut, goes negative or exceeds 1.0, and look into highlights
    with a viewer-only exposure control.
  projection_example: >-
    Spot that a saturated cyan sweep will clip on the Rec.709 projector file before rendering the whole show.
  controls:
    - { name: Overlay, type: enum(off|clipping|out-of-gamut|over-range|negative|false-colour), animatable: false }
    - { name: Target gamut, type: enum(dynamic), animatable: false }
    - { name: Viewer exposure (stops), type: float, animatable: false }
  animation: >-
    n/a
  dependencies: [color.output-transform, color.display]
  implementation: >-
    Viewer-only WGSL overlay computing the output transform in-shader and flagging channels outside [0,1] (or the
    target gamut), zebra-striped; exposure applied before the display transform in the viewer only.
  io: >-
    Optional diagnostic report per export (percentage of clipped pixels per frame).
  limitations: >-
    Diagnoses the file, not the projector's real gamut or the wall colour.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Check colours" toggle shows zebra stripes where colours will be lost.
    defaults: >-
      Target = selected export preset's output space.
    automation: >-
      Export preflight warns if more than 1% of pixels clip in sampled frames.
    usability_check: >-
      A user finds a clipping area and fixes it with a suggested grade in under 2 minutes.
  acceptance: >-
    Synthetic chart: flagged pixels exactly equal analytically out-of-range pixels.
  status: not-started
  evidence: []

