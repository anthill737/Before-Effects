  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Colour-pipeline parity item (OCIO/ACES, scopes, HDR or viewer-only LUT) not needed for projection workflows now. Core colour management, LUTs and projector simulation stay required."
  milestone: D
  beginner:
    action: >-
      Advanced only.
    defaults: >-
      SDR Rec.709 output transform for video, ACEScg for EXR.
    automation: >-
      Recognises common camera log metadata and suggests the IDT.
    usability_check: >-
      Expert brings in S-Log3 footage with the right IDT on the first suggestion.
  acceptance: >-
    Mini scene "aces-mix": log footage and EXR render match vendor reference frames within tolerance.
  status: not-started
  evidence: []

- id: color.lut
  name: LUT import and application
  sources:
    - ref: S26
      item: OCIO File Transform (apply a LUT or CDL); convert to LUT space, apply, convert back
      category: OpenColorIO and ACES
      checked: true
    - ref: brief
      item: §11-I LUT-based grading; §14 LUT preview; architecture .cube import
      category: Product requirement
      checked: true
  artist_can: >-
    Apply .cube (and other) LUTs as a grade, with the input space the LUT expects, and control its strength.
  projection_example: >-
    Apply the film-look LUT the show designer supplied to the whole master, at 70% strength.
  controls:
    - { name: LUT file, type: file, animatable: false }
    - { name: LUT input space, type: enum(dynamic), animatable: false }
    - { name: Interpolation, type: enum(trilinear|tetrahedral), animatable: false }
    - { name: Strength, type: percent, animatable: true }
  animation: >-
    Strength keyframable (crossfade looks).
  dependencies: [color.working-space, fx.utility.apply-color-lut]
  implementation: >-
    TypeScript parser for .cube (1D/3D, DOMAIN_MIN/MAX); other formats (.3dl, .csp, .spi3d, CDL .cc/.ccc) loaded through
    PyOpenColorIO. Applied as WGSL 3D-texture lookup with automatic working→LUT-space and back conversion so a
    display-referred LUT never receives scene-linear data.
  io: >-
    LUTs referenced and collected with the project.
  limitations: >-
    LUTs clip out-of-range values; HDR values above the LUT domain are clamped unless a shaper is supplied.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Drag a .cube file onto a layer or composition; "Look strength" slider.
    defaults: >-
      Input space guessed as Rec.709 display-referred; tetrahedral; 100%.
    automation: >-
      Wraps the LUT in the right conversions automatically.
    usability_check: >-
      A novice applies a supplied LUT and sets it to 50% in under 30 s.
  acceptance: >-
    Reference .cube applied to a test chart matches a Resolve/OCIO reference within 1 code value.
  status: not-started
  evidence: []

