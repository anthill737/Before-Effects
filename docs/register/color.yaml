  artist_can: >-
    Work in ACEScg, bring in camera log footage with the right input transforms, and output through ACES output
    transforms suited to SDR projection.
  projection_example: >-
    Graded S-Log3 drone footage and CG renders share one ACEScg working space and output through an SDR Rec.709 transform.
  controls:
    - { name: Input transform (IDT), type: enum(dynamic), animatable: false }
    - { name: Output transform, type: enum(dynamic), animatable: false }
  animation: >-
    n/a
  dependencies: [color.ocio, color.input-interpretation]
  implementation: >-
    OCIO built-in ACES configs (OCIO 2.4+ ships ACES 2.0 CG and Studio configs), baked via color.ocio.
  io: >-
    ACES2065-1 EXR interchange supported via chromaticities and config spaces.
  limitations: >-
    ACES output transforms are designed for displays, not projector-plus-surface systems; final look is checked on site.
