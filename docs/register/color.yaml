- id: color.hdr-source
  name: HDR source handling for SDR projection
  sources:
    - ref: brief
      item: §14 support HDR source assets without claiming an SDR projector becomes HDR
      category: Product requirement
      checked: true
    - ref: S01
      item: Enhanced HDR support / HDR preview
      category: Adjust colors
      checked: false
  artist_can: >-
    Use HDR video (PQ/HLG), EXR and HDR images as sources, with highlights handled gracefully when output to SDR projectors.
  projection_example: >-
    An HDR fireworks clip keeps colour in its bright bursts on the SDR projector file instead of clipping to white.
  controls:
    - { name: Source HDR interpretation, type: enum(auto|pq|hlg|linear), animatable: false }
    - { name: Highlight handling to SDR, type: enum(tone-map|soft-clip|clip), animatable: false }
    - { name: Source peak (nits), type: float, animatable: false }
  animation: >-
    n/a
  dependencies: [color.input-interpretation, color.output-transform, color.display]
  implementation: >-
    PQ/HLG decoded to scene-linear with documented reference-white scaling (203 nits = 1.0); SDR outputs use a
    hue-preserving tone-map (or ACES 2.0 SDR output under OCIO); HDR displays may preview in HDR, labelled "your
    projector output is SDR".
  io: >-
    HDR export only to formats/presets that declare HDR metadata (expert use); projector presets are SDR.
  limitations: >-
    An SDR projector cannot show HDR; tone mapping is a creative compromise. The app never labels projector output as HDR.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Colour-pipeline parity item (OCIO/ACES, scopes, HDR or viewer-only LUT) not needed for projection workflows now. Core colour management, LUTs and projector simulation stay required."
  milestone: D
  beginner:
    action: >-
      Automatic; HDR clips show an "HDR source" badge with "Looks fine on projector" preview.
    defaults: >-
      Tone-map for SDR outputs.
    automation: >-
      Detects PQ/HLG from metadata and picks highlight handling.
    usability_check: >-
      Users can tell from the UI that the projector output is SDR (9 of 10 in a quiz).
  acceptance: >-
    HDR test clip exports to SDR without hue shifts beyond tolerance in highlight patches.
  status: not-started
  evidence: []

- id: color.banding-dither
  name: Banding and dither policy
  sources:
    - ref: brief
      item: §14 alpha, glow and gradients survive the pipeline without banding
      category: Product requirement
      checked: true
  artist_can: >-
    Get smooth gradients and glows in 8-bit and 10-bit outputs without visible banding.
  projection_example: >-
    A large dark-blue sky gradient across the facade does not show steps in the H.264 file.
  controls:
    - { name: Dither, type: enum(off|blue-noise|ordered), animatable: false }
    - { name: Dither amplitude (LSB), type: float, animatable: false }
  animation: >-
    n/a
  dependencies: [color.bit-depth, color.output-transform]
  implementation: >-
    Quantisation and RGB→YUV conversion happen in WGSL (exact matrices) with a seeded blue-noise dither (fixed per
    frame index), so FFmpeg receives already-quantised planes and no swscale dithering varies the result.
  io: >-
    Dither applied only at integer outputs; float outputs never dithered.
  limitations: >-
    Heavy compression can still band; 10-bit presets recommended for big gradients where the player supports them.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      None; on by default.
    defaults: >-
      Blue-noise dither, ±0.5 LSB, for all 8/10-bit outputs.
    automation: >-
      Export preflight suggests a 10-bit preset when large smooth gradients are detected.
    usability_check: >-
      Viewers see no banding on a supplied gradient test in the default H.264 export.
  acceptance: >-
    Gradient test: no visible bands in H.264 at default settings; dithered output bit-identical across two exports.
  status: not-started
  evidence: []

- id: color.conversion-boundaries
  name: Effect precision and conversion boundaries
  sources:
    - ref: brief
      item: §14 document effect precision and conversion boundaries
      category: Product requirement
      checked: true
  artist_can: >-
    See, for any layer, where colour conversions and precision limits occur in its effect chain.
  projection_example: >-
    Find that a legacy-style effect works display-referred and is why a glow edge looks different from the rest.
  controls:
    - { name: Pipeline view (per layer), type: display, animatable: false }
    - { name: Effect colour expectation, type: display, animatable: false }
  animation: >-
    n/a
  dependencies: [color.working-space, proj.effect-stack]
  implementation: >-
    Every effect pass declares colour-space expectation, precision and alpha convention; the render-graph compiler
    inserts conversions and exposes them in a pipeline inspector.
  io: >-
    none
  limitations: >-
    Expert diagnostic only.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Not shown in the guided path; Advanced → "How this layer is processed".
    defaults: >-
      Hidden.
    automation: >-
      n/a
    usability_check: >-
      Expert identifies the conversion points of a 5-effect stack in under 60 s.
  acceptance: >-
    Every registered effect has a declared space/precision; compiler test fails otherwise.
  status: not-started
  evidence: []

- id: color.simulate-output
  name: Projector and surface simulation preview
  sources:
    - ref: S25
      item: View > Simulate Output (output profile, simulation profile, Preserve RGB)
      category: Adjust colors
      checked: true
    - ref: brief
      item: §14 surface colour, ambient light and projector limitations are installation constraints
      category: Product requirement
      checked: true
  artist_can: >-
    Preview roughly how the output will look from a projector onto a coloured surface under some ambient light, to
    catch problems early.
  projection_example: >-
    Preview a pastel scene on red brick and see that the blues will turn murky, before going on site.
  controls:
    - { name: Projector profile (gamut / white / gamma / contrast), type: enum(dynamic), animatable: false }
    - { name: Surface albedo / photo, type: color, animatable: false }
    - { name: Ambient light level, type: percent, animatable: false }
  animation: >-
    n/a
  dependencies: [color.display, map.venue, map.region]
  implementation: >-
    Viewer-only WGSL simulation: output transform → projector model (primaries, white, black level) → multiply by
    surface albedo (from a venue photo or swatch) → add ambient → display transform. Clearly labelled approximate.
  io: >-
    none
  limitations: >-
    An approximation; it cannot replace on-site testing. Surface albedo from a photo is uncalibrated unless a colour chart is used.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: D
  beginner:
    action: >-
      "Preview on the wall" toggle using the venue photo.
    defaults: >-
      Generic projector, venue photo albedo, low ambient.
    automation: >-
      Estimates surface colour per region from the venue photo.
    usability_check: >-
      Users can name which colours will suffer on brick after toggling the preview.
  acceptance: >-
    Labelled approximate; compare to an on-site photo when hardware is available.
  status: not-started
  evidence: []
