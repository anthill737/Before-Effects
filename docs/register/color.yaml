# Color precision — Before Effects capability register
# Sources: S25 (color management: working space, linearize, blend at 1.0 gamma, input/output profiles, display management, Simulate Output, color-managed video formats; checked 2026-10-01), S26 (OpenColorIO and ACES; OCIO effects; checked 2026-10-01), S30 (render color depth), S01 (HDR preview, Lumetri scopes), brief §14. Layer-level OCIO/LUT effects are catalogued as fx.* entries by the effect catalog.

- id: color.management
  name: Colour management (working, source, display and output spaces)
  sources:
    - ref: S25
      item: Color management workflow — input profile → working space → monitor profile; output profile per output module; Color Engine
      category: Adjust colors
      checked: true
    - ref: brief
      item: §14 explicit source/working/display/output spaces
      category: Product requirement
      checked: true
  artist_can: >-
    Have every source interpreted correctly, compose in one well-defined working space, see an accurate preview, and
    export with correct colour conversion and tags — without needing to understand colour science.
  projection_example: >-
    An sRGB logo, a Rec.709 video and an HDR EXR sky all look as intended together on the facade master.
  controls:
    - { name: Colour engine, type: enum(built-in|ocio), animatable: false }
    - { name: Working space, type: enum(dynamic), animatable: false }
    - { name: Display space, type: enum(dynamic), animatable: false }
    - { name: Default output space, type: enum(dynamic), animatable: false }
  animation: >-
    n/a
  dependencies: [color.working-space, color.input-interpretation, color.display, color.output-transform, color.bit-depth]
  implementation: >-
    Built-in engine: analytic WGSL transforms (sRGB, BT.1886/Rec.709, Display P3, Rec.2020, linear variants, PQ, HLG,
    ACEScg/ACES2065-1 matrices). OCIO engine: PyOpenColorIO sidecar bakes LUTs (color.ocio). Internal buffers are
    rgba16float scene-linear premultiplied; every conversion point is explicit in the render graph.
  io: >-
    Colour settings saved per project; output tags written per export.
  limitations: >-
    A monitor preview cannot guarantee the look on a real surface under real ambient light (color.simulate-output).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Nothing to set: projects start colour-managed. "Colour" appears only in project settings and export Advanced.
    defaults: >-
      Linear Rec.709/sRGB primaries working space, sRGB display, Rec.709 output tags.
    automation: >-
      Reads source colour metadata, converts automatically, tags exports.
    usability_check: >-
      In the guided path no user is asked a colour-space question; exports verify as correctly tagged (render.verify).
  acceptance: >-
    Mini scene "mixed-sources": sRGB PNG, Rec.709 H.264 and EXR sources match reference patches within ΔE 1 in export.
  status: not-started
  evidence: []

- id: color.working-space
  name: Working space and linear compositing
  sources:
    - ref: S25
      item: Working color space; Linearize working color space; Blend colors using 1.0 gamma
      category: Adjust colors
      checked: true
  artist_can: >-
    Composite in linear light so blends, glows, motion blur and fades behave like real light, and pick colours that
    mean the same thing everywhere.
  projection_example: >-
    Overlapping light sweeps add up naturally on the facade instead of turning muddy at the overlap.
  controls:
    - { name: Working space, type: enum(linear-rec709|acescg|linear-rec2020|linear-p3), animatable: false }
    - { name: Legacy display-referred blending (compat), type: bool, animatable: false }
    - { name: Colour picker space, type: enum(display|working), animatable: false }
  animation: >-
    n/a
  dependencies: [color.bit-depth]
  implementation: >-
    All compositing in scene-linear rgba16float with premultiplied alpha; colour pickers convert display-referred picks to
    working values (including >1.0 for HDR emission). A per-effect "expects display-referred" flag inserts
    linear↔display conversions where an effect's maths needs it (color.conversion-boundaries).
  io: >-
    none
  limitations: >-
    Linear blending changes the look of some AE habits (e.g. Screen-mode glows); a compat toggle exists per composition.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      None; linear is default.
    defaults: >-
      Linear Rec.709 primaries.
    automation: >-
      n/a
    usability_check: >-
      Users judge overlapping light sweeps as natural in an A/B test against display-referred blending.
  acceptance: >-
    Mini scene "light-overlap": two 50% lights sum to the analytic linear value.
  status: not-started
  evidence: []

- id: color.input-interpretation
  name: Source colour interpretation
  sources:
    - ref: S25
      item: Interpret Footage — Media Color Space, Override Media Color Space, Preserve RGB, interpretation rules; embedded ICC profiles; color-managed video formats (ProRes, H.264/HEVC, XAVC, camera RAW)
      category: Adjust colors
      checked: true
    - ref: brief
      item: §3 record source colour space; §14 input interpretation
      category: Product requirement
      checked: true
  artist_can: >-
    Have each image or video interpreted from its embedded tags or profile, override it when wrong, or preserve its raw
    numbers for data images.
  projection_example: >-
    A phone video tagged HLG and an sRGB PNG both look right; a normal map is marked "data" so it is never colour-converted.
  controls:
    - { name: Detected colour space, type: display, animatable: false }
    - { name: Override colour space, type: enum(dynamic), animatable: false }
    - { name: Range, type: enum(auto|limited|full), animatable: false }
    - { name: Preserve RGB (data/raw), type: bool, animatable: false }
    - { name: Interpretation rules, type: rule-list, animatable: false }
  animation: >-
    n/a
  dependencies: [color.management, proj.project-model]
  implementation: >-
    FFprobe stream tags (color_primaries, color_trc, colorspace, color_range) and PNG/TIFF ICC/cICP via the decoder
    sidecar; ICC profiles evaluated with LittleCMS (lcms2) in the sidecar to bake a 3D LUT when not analytic; EXR
    chromaticities honoured; camera log spaces via OCIO (color.aces).
  io: >-
    Interpretation stored per asset; rules file importable/exportable.
  limitations: >-
    Untagged files are guessed (sRGB for images, Rec.709 for HD video) and flagged in the asset panel.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Asset panel badge "Colours: automatic (Rec.709)"; click to change.
    defaults: >-
      Automatic from metadata.
    automation: >-
      Flags untagged or contradictory metadata with a plain explanation.
    usability_check: >-
      A user fixes a washed-out clip by choosing the suggested interpretation in under 30 s.
  acceptance: >-
    Test pack of tagged/untagged sources decodes to reference values within 1 code value (8-bit equivalent).
  status: not-started
  evidence: []

- id: color.display
  name: Display transform and display colour management
  sources:
    - ref: S25
      item: Use Display Color Management (per viewer); monitor profile
      category: Adjust colors
      checked: true
    - ref: S26
      item: Display Color Space menu in the Composition panel (OCIO)
      category: OpenColorIO and ACES
      checked: true
  artist_can: >-
    See the working image correctly converted for the monitor (sRGB, Display P3 or an HDR display), per viewer, with the
    option to view raw values.
  projection_example: >-
    On a wide-gamut laptop, saturated reds look the same as on the studio monitor.
  controls:
    - { name: Display space, type: enum(srgb|display-p3|rec709-bt1886|hdr-pq), animatable: false }
    - { name: Display colour management, type: bool, animatable: false }
    - { name: View transform (OCIO), type: enum(dynamic), animatable: false }
  animation: >-
    n/a
  dependencies: [color.management]
  implementation: >-
    WebGPU canvas configured with format rgba16float and colorSpace srgb or display-p3 (toneMapping extended on HDR
    displays); the display transform runs as the final WGSL pass of the viewer only, never in renders.
  io: >-
    none
  limitations: >-
    Chromium does not apply arbitrary monitor ICC profiles to WebGPU canvases; calibrated-display accuracy relies on OS
    calibration or an OCIO view.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      None; viewer picks the display automatically.
    defaults: >-
      Matches the OS display (sRGB or P3).
    automation: >-
      Detects HDR/wide-gamut displays via Electron screen info.
    usability_check: >-
      n/a for novices; expert check: test pattern matches reference on sRGB and P3 displays.
  acceptance: >-
    Viewer pixel readback equals the analytic display transform of working values.
  status: not-started
  evidence: []

- id: color.output-transform
  name: Output transforms and colour metadata
  sources:
    - ref: S25
      item: Output Module color profile; Convert To Linear Light; Embed profile; rendering intent; Preserve RGB on output
      category: Adjust colors
      checked: true
    - ref: S26
      item: Render Queue Output Color Space (OCIO)
      category: OpenColorIO and ACES
      checked: true
    - ref: brief
      item: §14 output transforms and correct metadata; §17 never apply output colour correction twice
      category: Product requirement
      checked: true
  artist_can: >-
    Export each file in the colour space its destination expects, with correct tags so players interpret it right.
  projection_example: >-
    The H.264 review copy is tagged Rec.709, the EXR master stays linear, and the projector file carries the projector's
    output correction exactly once.
  controls:
    - { name: Output colour space, type: enum(dynamic), animatable: false }
    - { name: Write colour tags / embed profile, type: bool, animatable: false }
    - { name: Linear output (float formats), type: bool, animatable: false }
    - { name: Preserve RGB (no conversion), type: bool, animatable: false }
  animation: >-
    n/a
  dependencies: [color.management, render.encode, color.banding-dither, out.projector-output, render.stage-declaration]
  implementation: >-
    Output transform is a WGSL pass at the end of the render graph (or a baked OCIO LUT) followed by quantisation and
    dither; FFmpeg receives already-encoded values plus tags (-color_primaries/-color_trc/-colorspace/-color_range,
    MOV colr atoms; PNG gAMA/cHRM/cICP where the build supports it; EXR chromaticities via OpenEXR).
  io: >-
    Tags verified by render.verify; the applied transform recorded in the stage declaration.
  limitations: >-
    Players may ignore tags (some media servers assume Rec.709 full range); export presets for known players set the
    safest convention.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Handled by export presets; Advanced → Colour for experts.
    defaults: >-
      Video presets Rec.709 limited range; image sequences sRGB; EXR linear.
    automation: >-
      Chooses output space from the export outcome and records it in history.
    usability_check: >-
      No guided-path export requires a colour choice; verification passes for all presets.
  acceptance: >-
    Exported colour-bar test re-imported matches source within 1 code value per preset.
  status: not-started
  evidence: []

- id: color.bit-depth
  name: Bit depth and processing precision (8/16/32f)
  sources:
    - ref: S25
      item: 8-bpc vs 16/32-bpc recommendations; linearized working space needs 16/32 bpc
      category: Adjust colors
      checked: true
    - ref: S30
      item: Render settings — Color Depth
      category: Render and export
      checked: true
  artist_can: >-
    Work at high precision by default, choose full 32-bit float where heavy grading or HDR needs it, and see which
    effects limit precision.
  projection_example: >-
    A slow sunrise gradient across the whole facade stays smooth after strong grading.
  controls:
    - { name: Processing precision, type: enum(16f|32f), animatable: false }
    - { name: Effect precision badge, type: display, animatable: false }
  animation: >-
    n/a
  dependencies: [color.working-space]
  implementation: >-
    Default rgba16float buffers; a 32f mode switches compositor targets to rgba32float (effects declare supported
    precision). 8-bit and 16-bit integer data appear only at decode and encode boundaries. AE 8/16/32 bpc project modes
    map to 16f/16f/32f.
  io: >-
    Output bit depth is per format (8/10/12/16-bit, half, float).
  limitations: >-
    rgba16float has ~11 bits of mantissa: fine for 10-bit output, but extreme gain on dark values benefits from 32f;
    32f doubles memory use.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      None by default; "Maximum precision" toggle in project settings.
    defaults: >-
      16-bit float.
    automation: >-
      Suggests 32f when a composition stacks large exposure/grade changes.
    usability_check: >-
      n/a for novices; expert check: precision badge visible on every effect.
  acceptance: >-
    Gradient test survives +6 stops / −6 stops round trip without visible banding at 16f.
  status: not-started
  evidence: []

- id: color.ocio
  name: OpenColorIO configurations
  sources:
    - ref: S26
      item: Color Engine OCIO color managed; OCIO Config (built-in, Custom); Working Color Space; Display Color Space; Show all; OCIO effects (File, Color Space, Display, Look, CDL Transform)
      category: OpenColorIO and ACES
      checked: true
  artist_can: >-
    Use a studio OCIO configuration (built-in ACES or a custom .ocio file) for working, input, display and output
    spaces, looks and view transforms.
  projection_example: >-
    Match a VFX vendor's ACES pipeline so their EXR renders drop straight into the show.
  controls:
    - { name: OCIO config, type: enum(builtin-cg|builtin-studio|custom-file), animatable: false }
    - { name: Working / display / view / look, type: enum(dynamic), animatable: false }
    - { name: Show all colour spaces, type: bool, animatable: false }
  animation: >-
    n/a
  dependencies: [color.management, color.lut]
  implementation: >-
    PyOpenColorIO in the sidecar resolves processors and bakes each needed transform to a 65³ 3D LUT with a 1D log2
    shaper for scene-linear input; LUTs uploaded as rgba16float 3D textures and applied in WGSL with tetrahedral
    interpolation; baked results cached by config hash + transform.
  io: >-
    Custom configs referenced by path and collected with the project.
  limitations: >-
    Baked LUTs approximate analytic OCIO transforms (error measured per transform and shown); requires the Python sidecar.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Colour-pipeline parity item (OCIO/ACES, scopes, HDR or viewer-only LUT) not needed for projection workflows now. Core colour management, LUTs and projector simulation stay required."
  milestone: D
  beginner:
    action: >-
      Advanced only: Project settings → Colour → "Use OCIO/ACES".
    defaults: >-
      Built-in ACES CG config when enabled.
    automation: >-
      Bakes LUTs in the background; warns if a custom config fails to load.
    usability_check: >-
      Expert loads a custom config and sees its spaces listed in under 60 s.
  acceptance: >-
    Baked transforms match PyOpenColorIO CPU reference within ΔE 0.5 on a test chart.
  status: not-started
  evidence: []

