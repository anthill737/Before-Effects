- id: out.sync
  name: Consistent timing across outputs
  sources:
    - ref: brief §16
      item: "Consistent timing across outputs"
      category: "Multiple projectors and output management"
      checked: true
    - ref: brief §17
      item: "Matching video durations alone does not guarantee synchronized external playback"
      category: "Rendering, export, and delivery"
      checked: true
  artist_can: >-
    Have all projector outputs show the same frame at the same moment during live playback, and know how well that
    holds on the actual hardware.
  projection_example: >-
    A fast light sweep crossing the overlap does not tear or double between the two projectors.
  controls:
    - { name: "Output topology (spanning window, per-display windows)", type: "enum", animatable: false }
    - { name: "Frame-counter test pattern", type: "action", animatable: false }
  animation: >-
    None.
  dependencies: [out.projector-output, out.routing, show.transport]
  implementation: >-
    One show clock (flicks) in one renderer process renders frame N for every output in the same tick. Topology
    options, most robust first: (1) one borderless window spanning adjacent outputs, or NVIDIA Surround / AMD
    Eyefinity grouping, giving a single swap chain; (2) per-display windows opened from the same renderer
    (window.open, same process, one GPUDevice) — feasibility to prototype in milestone A; (3) separate processes
    with a frame-number handshake. A frame-counter test pattern photographed by a camera across outputs verifies
    the result.
  io: >-
    Sync method and measured offsets are recorded in the bundle manifest.
  limitations: >-
    True genlock/frame lock needs pro GPUs or sync hardware, not available on GeForce cards. Windows DWM composition
    can add per-display offsets. Measure on the actual hardware; no universal guarantee.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: E
  beginner:
    action: >-
      Automatic. Output health shows "In step" or "Outputs may drift — run the timing check".
    defaults: >-
      Spanning window when the displays form a contiguous row at the same refresh rate.
    automation: >-
      Topology choice and refresh-rate checks.
    usability_check: >-
      Technical check rather than novice: measured inter-output offset is 0 frames in at least 99% of a 10-minute
      camera capture on target hardware (tolerance to be set after hardware is known).
  acceptance: >-
    AS-5. AS-6 (audio timing measured).
  status: not-started
  evidence: []

- id: out.projector-video
  name: Projector video export
  sources:
    - ref: brief §17
      item: "Installation-specific video for each projector, with selected correction baked in"
      category: "Rendering, export, and delivery"
      checked: true
    - ref: brief §0.8
      item: "Files for my projector setup"
      category: "Make export a guided outcome"
      checked: true
  artist_can: >-
    Export the exact video a projector needs — its raster, with mapping and the chosen corrections baked in — to play
    from any media player or the projector's USB player.
  projection_example: >-
    A 1920×1080 H.264 file of the mapped facade show plays from the projector's built-in media player.
  controls:
    - { name: "Output", type: "select", animatable: false }
    - { name: "Stages to bake (mapping, mask, blend, colour, warp, orientation)", type: "flags", animatable: false }
    - { name: "Preset (USB player, media server, high quality)", type: "enum", animatable: false }
    - { name: "Range", type: "time range", animatable: false }
  animation: >-
    None.
  dependencies: [out.projector-output, out.manifest, out.bake-once, render.queue, render.encode, render.verify]
  implementation: >-
    An offline render through render.queue using the same output pipeline as live output, at the projector's native
    raster from an immutable snapshot. Encoded by the FFmpeg sidecar (render.encode) and verified by render.verify
    (resolution, fps, frame count, duration, audio). Writes out.manifest next to the file.
  io: >-
    MP4/H.264 by default. HEVC, ProRes, DNxHR and HAP per tested support.
  limitations: >-
    A baked file is tied to this calibration version; recalibration means re-export. The manifest makes this visible.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Export → "Files for my projector setup".
    defaults: >-
      All stages baked, H.264 at the projector's native raster and the show's frame rate.
    automation: >-
      Preset choice from the player type, verification, and the manifest.
    usability_check: >-
      Users export a projector file that plays correctly on the target player without touching codec settings
      (at least 4 of 5).
  acceptance: >-
    AS-1 and B milestone guided path: master + projector video exported and verified.
  status: not-started
  evidence: []

- id: out.manifest
  name: Output manifest with stage ledger
  sources:
    - ref: brief §17
      item: "Manifest with output identity, calibration version, timing, codec, dimensions, and correction stages"
      category: "Rendering, export, and delivery"
      checked: true
    - ref: brief §17
      item: "Specify which stages are baked and which are expected in playback software"
      category: "Rendering, export, and delivery"
      checked: true
  artist_can: >-
    Get a readable record with every projector export of what it is, where it goes, how it was made, and which
    corrections are already inside it.
  projection_example: >-
    A technician opens the manifest and sees "Projector 2 RIGHT, calibration v4, warp baked, colour expected in
    player".
  controls:
    - { name: "Include human-readable summary", type: "bool", animatable: false }
  animation: >-
    None.
  dependencies: [render.verify, map.calibration-versions, map.binding]
  implementation: >-
    A schema-versioned JSON sidecar (Zod-validated), `<name>.manifest.json`, containing: app version; project, show,
    venue and binding IDs/hashes; calibration version hash; and per output {id, name, display fingerprint, raster,
    refresh, orientation, file, codec, pixel format, colour transform, rational fps, frame count, duration, start
    timecode, audio layout/offset, SHA-256}. It also holds the stage ledger {mapping, output mask, blend, black level,
    output colour, residual warp, orientation: baked | expected-in-player | not-used} and the render.verify results.
    A plain-text summary is written alongside.
  io: >-
    JSON + TXT next to exports, also embedded in bundles.
  limitations: >-
    External players do not read the manifest; it informs people and re-imports only.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Written automatically. A "What's in this file?" link appears in the export result.
    defaults: >-
      Always on.
    automation: >-
      Fully automatic.
    usability_check: >-
      Shown the summary, users correctly say whether warping is already in the file (at least 4 of 5).
  acceptance: >-
    AS-5 (matching exported output bundles). Schema test on every export.
  status: not-started
  evidence: []

- id: out.export-bundle
  name: Multi-projector export bundle
  sources:
    - ref: brief §17
      item: "Multi-projector bundles must include a manifest; matching durations do not guarantee synchronized playback"
      category: "Rendering, export, and delivery"
      checked: true
    - ref: brief §22
      item: "AS-5 matching exported output bundles"
      category: "Acceptance shows"
      checked: true
  artist_can: >-
    Export one folder with a video per projector, the shared audio, an overview preview and the manifest, ready for a
    media server or several players.
  projection_example: >-
    A three-projector facade show as one folder: P1.mov, P2.mov, P3.mov, show.wav, preview.mp4, manifest.json and
    README.txt.
  controls:
    - { name: "Outputs to include", type: "flags", animatable: false }
    - { name: "Shared preset", type: "select", animatable: false }
    - { name: "Separate or embedded audio", type: "enum", animatable: false }
    - { name: "Zip", type: "bool", animatable: false }
  animation: >-
    None.
  dependencies: [out.projector-video, out.manifest, out.sync, render.queue, render.verify]
  implementation: >-
    A bundle job renders all outputs from one immutable snapshot in a single pass per frame (shared content
    evaluation), so frame counts are identical. It writes the folder layout, checksums and a README with the
    required sync method, then verifies equal frame counts, durations and audio offsets.
  io: >-
    Folder or zip. Delivered through deliver.* destinations.
  limitations: >-
    Equal durations do not make separate players play in sync. The README states which sync method the bundle
    assumes (one multi-output player, network sync, or timecode).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: E
  beginner:
    action: >-
      Export → "Files for my projector setup" automatically becomes a bundle when there are 2+ projectors.
    defaults: >-
      All outputs, shared preset, separate WAV plus embedded audio in P1.
    automation: >-
      Layout, naming, checksums and verification.
    usability_check: >-
      Users export a 2-projector bundle and find its folder without assistance.
  acceptance: >-
    AS-5.
