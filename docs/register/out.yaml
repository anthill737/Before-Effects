  animation: >-
    Live parameter changes can be recorded to keyframes for reproducible exports.
  dependencies: [show.cue-list, show.blackout, show.transport]
  implementation: >-
    Web MIDI in the renderer (navigator.requestMIDIAccess), allowed through Electron's
    session.setPermissionRequestHandler for 'midi'. Learn mode maps messages to op-registry targets (cue go, param
    set). Mappings are saved per controller profile. MIDI out is used for LED feedback.
  io: >-
    Controller profiles saved as JSON.
  limitations: >-
    Driver quirks vary by device. MIDI clock and timecode chase are out of scope here (see show.timecode).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: E
  beginner:
    action: >-
      Show workspace → "Use a controller" → press a pad, then click a cue.
    defaults: >-
      Notes trigger cues; CC drives faders.
    automation: >-
      Device detection and learn mode.
    usability_check: >-
      Users map a pad to blackout and a fader to master intensity in under 2 minutes.
  acceptance: >-
    Mini scene "midi-cues".
  status: not-started
  evidence: []

- id: out.osc
  name: OSC control
  sources:
    - ref: brief §16
      item: "Plan MIDI/OSC and cue controls for live work"
      category: "Multiple projectors and output management"
      checked: true
    - ref: S27
      item: "OSC input / output with OSC Query support"
      category: "Networking & Control"
      checked: true
  artist_can: >-
    Control cues and parameters from other software or devices on the network (show control, TouchOSC, QLab), and
    send state back out.
  projection_example: >-
    A QLab cue sends /be/cue/go 5 so the projection follows the theatre's show control.
  controls:
    - { name: "Listen port / send host and port", type: "int + string", animatable: false }
    - { name: "Address map (auto-generated, editable)", type: "list", animatable: false }
    - { name: "OSC learn", type: "action", animatable: false }
  animation: >-
    As for out.midi.
  dependencies: [show.cue-list, show.blackout, show.transport]
  implementation: >-
    OSC over UDP in the Electron main process (node-osc or osc.js), forwarded to the renderer over IPC. The address
    space is generated from the op registry and cue list (/be/cue/go, /be/master/blackout, /be/param/<id>). OSCQuery
    discovery (as in MadMapper) is optional.
  io: >-
    Address map exportable as text/JSON.
  limitations: >-
    UDP is unacknowledged, so critical cues may need repetition or a confirmation reply. OSCQuery support is not
    decided.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Live inter-app (Spout, NDI) and OSC integration. The plan is export-first: baked projector video and mapping-data export come first. Revisit after show playback is proven. MIDI stays required for timecode sync."
  milestone: E
  beginner:
    action: >-
      Show workspace → "Control from other software" shows the port and copyable addresses.
    defaults: >-
      Listening on port 8000, local network only.
    automation: >-
      Address list generation.
    usability_check: >-
      Pilot user triggers a cue from TouchOSC in under 3 minutes using the shown address list.
  acceptance: >-
    Mini scene "osc-cues".
  status: not-started
  evidence: []
