    Generic formats: per-output UV remap as 32-bit float EXR (OpenEXR), masks and blend ramps as 16-bit PNG/EXR,
    venue mesh with UVs as OBJ/glTF, calibration as JSON (intrinsics/extrinsics/homography), colour as .cube. The
    manifest marks these stages expected-in-player.
  io: >-
    EXR/PNG/OBJ/glTF/JSON/.cube.
  limitations: >-
    Player-specific formats are an open question: Resolume Advanced Output XML, MadMapper projects, MiniMad and
