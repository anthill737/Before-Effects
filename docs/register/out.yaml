      category: "Multiple projectors and output management"
      checked: true
    - ref: S29
      item: "Advanced Output — input map vs output transformation"
      category: "Advanced Output"
      checked: true
  artist_can: >-
    Work in one coordinate system for the whole installation (metres in the venue, or one large canvas for 2D
    setups), so content crosses projector boundaries without per-projector layout.
  projection_example: >-
    A light sweep crosses from Projector 1's area into Projector 2's without any per-projector keyframes.
  controls:
    - { name: "Canvas size (2D multi-output)", type: "int[2]", animatable: false }
    - { name: "Output slices on canvas", type: "rect[]", animatable: false }
  animation: >-
    Content animates in installation space; projectors only sample it.
  dependencies: [map.venue, out.routing]
  implementation: >-
    Venue world coordinates (map.venue) are the single authority for model-based setups. 2D multi-output setups use
    a virtual canvas spanning all outputs, with each output a slice (comparable to Resolume's input map). Content is
    always authored in surface or venue space.
  io: >-
    Canvas/slice layout is recorded in the manifest.
  limitations: >-
    None beyond the routing limits.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: E
  beginner:
    action: >-
      Invisible: users place content on the building, never "on Projector 2".
    defaults: >-
      Venue metres; the canvas sized to cover all outputs.
    automation: >-
      Slice layout proposed from output arrangement.
    usability_check: >-
