# Outputs (projector outputs, masks, blending, output colour, interchange, control I/O) — Before Effects capability register
# Sources: brief §6, §11I, §14, §16, §17 (multi-projector bundle + manifest), §18, §22; S27 MadMapper features; S28 TouchDesigner Projection Mapping (Stoner, projectorBlend, camSchnappr); S29 Resolume edge blending, Advanced Output, Output Transformation. Electron offscreen-rendering, screen and Display docs checked 2026-10-01.

- id: out.projector-output
  name: Projector output window
  sources:
    - ref: brief §16
      item: "Per-projector routing, crop/orientation, warp, masks, overlap blending, gamma/color matching"
      category: "Multiple projectors and output management"
      checked: true
    - ref: S27
      item: "As many projector outputs as your GPU can handle"
      category: "Video Output"
      checked: true
    - ref: S29
      item: "Advanced Output — physical outputs (DVI/HDMI to a projector)"
      category: "Advanced Output"
      checked: true
  artist_can: >-
    Send a projector's finished picture full-screen to the display port it is plugged into, at the right
    resolution, for calibration, rehearsal and (later) live shows.
  projection_example: >-
    The facade projector on HDMI-2 shows the calibration points while the laptop screen keeps the editor.
  controls:
    - { name: "Output on/off", type: "bool", animatable: false }
    - { name: "Display", type: "select", animatable: false }
    - { name: "Expected resolution and refresh", type: "int[3]", animatable: false }
    - { name: "Stage toggles for diagnosis (mask, blend, colour, warp)", type: "bool[]", animatable: false }
  animation: >-
    None. Outputs display whatever the show evaluates at the current time.
  dependencies: [map.projector, map.model-3d, map.surface-2d, out.monitor-assignment, show.control-isolation]
  implementation: >-
    One frameless full-screen Electron BrowserWindow per projector, placed on its display from
    screen.getAllDisplays() (bounds, nativeOrigin, displayFrequency, label). Black background, CSS cursor:none, and
    powerSaveBlocker 'prevent-display-sleep'. Each output has a fixed WGSL stage order: projector-view render →
    output mask → blend + black level (linear) → output colour correction (linear matching) → residual mesh warp →
    display encode + dither → orientation/crop. The same pipeline renders export frames (out.projector-video), so
    preview and export match.
  io: >-
    The stage order is written into every manifest (out.manifest).
  limitations: >-
    Windows can scale or remap outputs (DPI scaling, HDR mode, GPU scaling). The app compares DIP bounds with native
    pixels (scaleFactor) and asks for 100% scaling and SDR mode on projector displays.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      A "Connect your projector" card detects the new display and asks "Is this your projector?" while a big number
      shows on it.
    defaults: >-
      The non-primary external display, at its native resolution.
    automation: >-
      Detection, placement, sleep prevention and resolution checks.
    usability_check: >-
      Users get the calibration pattern onto a newly plugged-in projector in under 1 minute.
  acceptance: >-
    AS-1 physical projection. Mini scene "output-vs-export": a live output frame grab equals the exported projector
    frame (8-bit exact after encode, or within 1 code value).
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"
    - "journey: projector-output-window step — full-screen output on chosen display at projector resolution, identify/grid/checker/white/black/colors patterns, open/close; display identification overlays. Physical projection NOT yet verified on hardware."

- id: out.monitor-assignment
  name: Display assignment
  sources:
    - ref: brief §16
      item: "Monitor assignment"
      category: "Multiple projectors and output management"
      checked: true
    - ref: S29
      item: "Advanced Output — save and switch screen setups across venues"
      category: "Advanced Output"
      checked: true
  artist_can: >-
    Choose which physical display each projector output goes to. The app remembers and restores the choice next
    time, even if Windows renumbers the displays.
  projection_example: >-
    After a reboot, Projector Left and Projector Right go back to the correct HDMI ports automatically.
  controls:
    - { name: "Output → display map", type: "map", animatable: false }
    - { name: "Display layout view", type: "view", animatable: false }
    - { name: "Re-match now", type: "action", animatable: false }
  animation: >-
    None.
  dependencies: [out.projector-output, out.identify]
  implementation: >-
    Assignments are stored by display fingerprint (Electron Display.label, native size, displayFrequency,
    nativeOrigin, internal) and fuzzy-matched on startup. The screen 'display-added', 'display-removed' and
    'display-metrics-changed' events re-place windows. The app warns when a projector display is mirrored (identical
    bounds) or running at a non-native mode.
  io: >-
    Saved with the venue's output configuration.
  limitations: >-
    Windows display IDs and labels are not guaranteed stable across driver updates or port changes; ambiguous
    matches ask the user (out.identify).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Drag an output tile onto a display tile in a simple picture of the connected screens.
    defaults: >-
      Projector 1 → the first external display.
    automation: >-
      Automatic re-matching and hot-plug handling.
    usability_check: >-
      After unplugging and replugging the projector, the output returns without user action in at least 9 of 10
      trials.
  acceptance: >-
    AS-5. Mini scene "replug".
  status: prototype
  evidence:
    - "journey: projector-output-window step — full-screen output on chosen display at projector resolution, identify/grid/checker/white/black/colors patterns, open/close; display identification overlays. Physical projection NOT yet verified on hardware."

- id: out.identify
  name: Output identification
  sources:
    - ref: brief §16
      item: "Output identification"
      category: "Multiple projectors and output management"
      checked: true
  artist_can: >-
    Flash a big number and name on every connected display or projector to see which is which, matched by
    highlighted tiles in the app.
  projection_example: >-
    Three projectors show "1 LEFT", "2 CENTRE", "3 RIGHT" on the building, and the app highlights the matching tiles.
  controls:
    - { name: "Identify all", type: "action", animatable: false }
    - { name: "Blink one output", type: "action", animatable: false }
  animation: >-
    None.
  dependencies: [out.projector-output]
  implementation: >-
    A temporary overlay pass on each output window (or a short-lived window on unassigned displays) showing number,
    name, resolution and refresh in large high-contrast type. Blink mode alternates full white and black for spotting
    far-away projectors.
  io: >-
    None.
  limitations: >-
    None.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      An "Identify" button on the outputs panel.
    defaults: >-
      Shows for 5 seconds.
    automation: >-
      Runs automatically when a new display appears.
    usability_check: >-
      Users name which physical projector is Output 2 in under 15 seconds.
  acceptance: >-
    AS-5.
  status: prototype
  evidence:
    - "journey: projector-output-window step — full-screen output on chosen display at projector resolution, identify/grid/checker/white/black/colors patterns, open/close; display identification overlays. Physical projection NOT yet verified on hardware."

- id: out.test-pattern
  name: Numbered output test patterns
  sources:
    - ref: brief §16
      item: "Numbered test patterns"
      category: "Multiple projectors and output management"
      checked: true
    - ref: S27
      item: "Built-in Grids and Test Pattern"
      category: "Video Output"
      checked: true
    - ref: S29
      item: "Test cards used during edge-blend setup"
      category: "Edge blending"
      checked: true
  artist_can: >-
    Show standard patterns on any projector: numbered grid, centre crosshair, focus pattern, colour bars, grey ramps,
    solid colours, overlap check and black-level check.
  projection_example: >-
    Focus both projectors with the focus pattern, then check that the blend is smooth with a 50% grey field.
  controls:
    - { name: "Pattern", type: "enum", animatable: false }
    - { name: "Grid spacing / numbering", type: "int", animatable: false }
    - { name: "Pass through output stages", type: "bool", animatable: false }
  animation: >-
    Optional moving bar for motion and tearing checks.
  dependencies: [out.projector-output]
  implementation: >-
    WGSL generators at native output raster, stamped with the output number. They can bypass or pass through the
    mask, blend and colour stages to check each stage. They reuse the generator effects (e.g.
    fx.generate.checkerboard, fx.generate.grid) where suitable.
  io: >-
    Patterns can be exported as PNG/video for testing external players.
  limitations: >-
    None.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      A "Test patterns" menu on each output, with pictures of each pattern.
    defaults: >-
      Numbered grid.
    automation: >-
      The guided calibration and blend steps pick the right pattern automatically.
    usability_check: >-
      Users show the focus pattern on Projector 1 in ≤2 actions.
  acceptance: >-
    AS-5 physical checks.
  status: prototype
  evidence:
    - "journey: projector-output-window step — full-screen output on chosen display at projector resolution, identify/grid/checker/white/black/colors patterns, open/close; display identification overlays. Physical projection NOT yet verified on hardware."

- id: out.crop-orientation
  name: Output crop and orientation
  sources:
    - ref: brief §16
      item: "Crop/orientation"
      category: "Multiple projectors and output management"
      checked: true
    - ref: S29
      item: "Output Transformation — flip horizontal/vertical"
      category: "Advanced Output"
      checked: true
  artist_can: >-
    Flip or rotate an output for ceiling, rear or portrait mounting, and crop or offset it to part of a display.
  projection_example: >-
    A ceiling-mounted projector needs a 180° rotation; a portrait-mounted projector for a tall column needs 90°.
  controls:
    - { name: "Rotate (0, 90, 180, 270)", type: "enum", animatable: false }
    - { name: "Flip H / V", type: "bool[2]", animatable: false }
    - { name: "Crop / offset", type: "rect", animatable: false }
  animation: >-
    None.
  dependencies: [out.projector-output]
  implementation: >-
    A final pixel-exact remap pass (no resampling for 90° steps and flips), with the crop as a viewport. Recorded in
    the manifest, so external players or the projector's own menu do not apply it again.
  io: >-
    Manifest stage "orientation".
  limitations: >-
    If the projector's own ceiling/rear mode is on, do not flip here as well; the guided check asks.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "How is the projector mounted?" with pictures: table, ceiling, behind the screen, sideways.
    defaults: >-
      Table mount, no flip.
    automation: >-
      Maps the mounting answer to rotation/flip and asks about the projector's own setting.
    usability_check: >-
      Users set up a ceiling-mounted projector correctly on the first try (at least 4 of 5).
  acceptance: >-
    Mini scene "ceiling-mount".
  status: not-started
  evidence: []

- id: out.routing
  name: Per-projector routing
  sources:
    - ref: brief §16
      item: "Per-projector routing"
      category: "Multiple projectors and output management"
      checked: true
    - ref: S29
      item: "Advanced Output — input selection and slices"
      category: "Advanced Output"
      checked: true
  artist_can: >-
    Decide what each projector shows: which venue surfaces or 2D surfaces, which show or scene, or a slice of a
    larger canvas — including the same content on several outputs.
  projection_example: >-
    Projector 1 covers the left wing, Projector 2 the right wing plus the tower; a third output sends a stage-monitor
    view to a TV.
  controls:
    - { name: "Source (projector camera, 2D surfaces, canvas slice)", type: "enum", animatable: false }
    - { name: "Include / exclude surfaces or roles", type: "region-ref[]", animatable: false }
    - { name: "Slice rectangle", type: "rect", animatable: false }
  animation: >-
    None (routing is installation setup). Cue-based output switching belongs to show.cue-list.
  dependencies: [out.projector-output, map.binding, out.installation-space]
  implementation: >-
    A routing graph per output. The show is evaluated once per frame into shared content textures, then rendered N
    times (once per output camera or slice), so cost scales with outputs, not with content evaluation.
  io: >-
    Routing is recorded per output in the manifest.
  limitations: >-
    GPU memory and fill rate limit the output count. The app measures and reports this instead of promising a number.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: E
  beginner:
    action: >-
      Automatic for model-based venues: each projector shows what it can see. In 2D setups, drag a slice on the
      canvas onto an output.
    defaults: >-
      Every projector renders all surfaces it covers.
    automation: >-
      Coverage-based routing and the overlap hand-off to out.edge-blend.
    usability_check: >-
      Users send a canvas slice to a second output in under 1 minute.
  acceptance: >-
    AS-5.
  status: not-started
  evidence: []

- id: out.output-mask
  name: Output (installation) masks
  sources:
    - ref: brief §6
      item: "Keep creative masks separate from physical output masks"
      category: "Masks, mattes, compositing"
      checked: true
    - ref: S29
      item: "Output Transformation — Masks and Crops (arbitrary points, invert)"
      category: "Advanced Output"
      checked: true
    - ref: S27
      item: "Bezier Masking / Feathering"
      category: "Surfaces"
      checked: true
  artist_can: >-
    Stop light hitting things it must not — doors, windows with people behind them, trees, the audience, a
    neighbour's wall — whatever the show does creatively.
  projection_example: >-
    An artistic glow spreads beyond the windows in the composition, but the output mask keeps the entrance doors dark.
  controls:
    - { name: "Mask shapes (from keep-dark regions, or drawn on the output)", type: "path[]", animatable: false }
    - { name: "Feather", type: "px", animatable: false }
    - { name: "Safety margin", type: "cm", animatable: false }
    - { name: "Invert", type: "bool", animatable: false }
  animation: >-
    Not animatable by default (installation safety). Show-time mask changes are cue-level, not keyframes.
  dependencies: [map.region, map.calibration, out.projector-output]
  implementation: >-
    Rendered in venue space from keep-dark regions, projected through the calibration, plus output-space polygons
    (Skia path → coverage texture). Multiplied in linear light after the projector render and before blending. A
    separate object type from mask.bezier: no shared IDs, not editable from the creative timeline.
  io: >-
    Baked into projector videos, or exported as mask images when a player applies masks (out.mapping-data-export).
    Recorded in the manifest stage ledger.
  limitations: >-
    Accuracy depends on calibration, and projector light scatters and defocuses, so a margin is added. Masks cannot
    stop reflections or spill from light bouncing off surfaces.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Mark a region "Keep dark" and the mask is created automatically; "Draw a no-light area" on the output for
      anything else.
    defaults: >-
      2 px feather, 5 cm safety margin.
    automation: >-
      Generated from keep-dark regions and updated on recalibration.
    usability_check: >-
      With a glow effect applied, users confirm the door stays dark (automated pixel check plus user confirmation)
      without any manual mask work.
  acceptance: >-
    AS-1. Mini scene "glow-vs-door": zero output pixels above black inside the door mask.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: out.residual-warp
  name: Residual output mesh warp
  sources:
    - ref: S29
      item: "Output Transformation — perspective warp; bezier warp with subdivisions"
      category: "Advanced Output"
      checked: true
    - ref: S28
      item: "Stoner — mesh warper; displacement map output for the Remap TOP"
      category: "Projection Mapping"
      checked: true
    - ref: S27
      item: "Mesh Warping"
      category: "Surfaces"
      checked: true
  artist_can: >-
    Fix the last small misalignments of a whole projector output with a fine Bezier grid, after calibration.
  projection_example: >-
    The facade bulges 2 cm at mid-height. A 9×9 grid nudge brings every window outline back on its edge.
  controls:
    - { name: "Grid size", type: "int[2]", animatable: false }
    - { name: "Grid points with Bezier handles", type: "point2d[]", animatable: false }
    - { name: "Initialise from calibration errors", type: "action", animatable: false }
    - { name: "Reset", type: "action", animatable: false }
  animation: >-
    None.
  dependencies: [out.projector-output, map.calibration-refine]
  implementation: >-
    A per-output Bezier patch grid (default 5×5, up to 33×33) evaluated to a UV-offset texture (rgba16float),
    consumed by a WGSL remap pass with bicubic filtering. It can be initialised from calibration residuals with a
    thin-plate spline. Stored in the calibration version.
  io: >-
    Exportable as a float EXR remap (like Stoner's displacement map) for players that warp themselves.
  limitations: >-
    An image-space correction, valid for this projector's view of a static surface. Large corrections point to a
    calibration or model problem, and stretching lowers effective resolution.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Calibration → "Fine-tune" → "Fix small leftovers", or drag points on the projector directly.
    defaults: >-
      5×5 grid, auto-initialised.
    automation: >-
      Initialisation from residuals, and a warning when warps are large.
    usability_check: >-
      Users correct a deliberate 10 px local offset in under 2 minutes.
  acceptance: >-
    Mini scene "refine-bulge". AS-1 physical.
  status: not-started
  evidence: []

- id: out.edge-blend
  name: Edge blending
  sources:
    - ref: brief §16
      item: "Overlap blending; matching content and aligned geometry are prerequisites"
      category: "Multiple projectors and output management"
      checked: true
    - ref: S29
      item: "Edge blending — Gamma (R, G, B), Power, Luminance; at least 15% overlap recommended; slices mirror physical overlap"
      category: "Edge blending"
      checked: true
    - ref: S27
      item: "Soft-Edge blending"
      category: "Masking & Blending"
      checked: true
    - ref: S28
      item: "projectorBlend (NxM arrays); camSchnappr auto blend masks"
      category: "Projection Mapping"
      checked: true
  artist_can: >-
    Make two or more overlapping projectors look like one seamless image by fading each one out across the overlap.
  projection_example: >-
    Two projectors overlap by 20% across the centre of a 30 m facade, and the seam disappears on a grey test field.
  controls:
    - { name: "Overlap (auto from calibration / manual width)", type: "enum + px", animatable: false }
    - { name: "Curve power", type: "float", animatable: false }
    - { name: "Luminance (midpoint)", type: "float", animatable: false }
    - { name: "Gamma R / G / B", type: "float[3]", animatable: false }
    - { name: "Show overlap zone", type: "bool", animatable: false }
  animation: >-
    None.
  dependencies: [map.calibration-3d, map.coverage, out.routing, out.test-pattern, out.color-match]
  implementation: >-
    For model-based setups, the overlap comes from calibrated projector cameras over the venue geometry. Per-projector
    weight textures use w_i = d_i^p / Σ_j d_j^p, where d is the surface-space distance to that projector's coverage
    edge (Raskar-style), shaped by Resolume-like power/luminance/gamma controls. Weights are applied in linear light
    in WGSL. For 2D setups, rectangular edge ramps are used per output. Weights are cached as rgba16float textures
    and rebuilt when the calibration version changes.
  io: >-
    Baked into projector videos, or exported as blend-ramp images for players (out.mapping-data-export). Recorded in
    the stage ledger.
  limitations: >-
    Needs aligned geometry and matching content. Differences in brightness, colour, focus and surface angle stay
    visible and need out.color-match. Blending cannot fix misalignment. Physical checking is required.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: E
  beginner:
    action: >-
      Automatic when projectors overlap: "Blend the overlap", with a grey test field and three plain sliders (Softness,
      Brightness in the middle, Colour balance).
    defaults: >-
      Auto overlap, power 2, luminance 0.5, gamma 2.2.
    automation: >-
      Overlap detection and weight computation.
    usability_check: >-
      Physical test: users reduce a visible seam on a grey field to "not noticeable from 10 m" (rated by 2 observers)
      in under 10 minutes.
  acceptance: >-
    AS-5 (geometry crosses an overlap; blend checked physically).
  status: not-started
  evidence: []

- id: out.black-level
  name: Black-level compensation
  sources:
    - ref: S29
      item: "Black level compensation — brightens non-overlapping regions; cannot fully eliminate the double-grey problem"
      category: "Edge blending"
      checked: true
    - ref: brief §16
      item: "Black-level compensation must account for residual light in overlaps; it cannot create physical darkness"
      category: "Multiple projectors and output management"
      checked: true
  artist_can: >-
    Reduce the grey band visible in dark scenes where projectors overlap, by lifting the black of the non-overlap
    areas to match.
  projection_example: >-
    A night-sky scene no longer shows a lighter vertical stripe where two projectors overlap.
  controls:
    - { name: "Black lift per zone", type: "float", animatable: false }
    - { name: "Edge softness", type: "px", animatable: false }
    - { name: "Black-level test pattern", type: "action", animatable: false }
  animation: >-
    None.
  dependencies: [out.edge-blend, out.test-pattern]
  implementation: >-
    A per-output additive lift mask in linear light: lift = (n_max − n_local) × measured black floor, feathered at
    zone edges. The black floor is matched by eye with a black test pattern and one slider per zone, or estimated
    from a camera later (map.structured-light infrastructure).
  io: >-
    Baked, or exported as a lift map. Recorded in the stage ledger.
  limitations: >-
    Lifts black everywhere outside overlaps, so contrast drops. It cannot create darkness, and the black floor varies
    with ambient light and projector temperature.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: E
  beginner:
    action: >-
      Blend step → "Even out dark scenes", with a black test field and one slider.
    defaults: >-
      Off until the user runs the step.
    automation: >-
      Zone map from overlap counts.
    usability_check: >-
      Physical test: users reduce the overlap band visibility on a black field (rated by 2 observers) in under
      5 minutes, and can say what it costs (lower contrast).
  acceptance: >-
    AS-5.
  status: not-started
  evidence: []

- id: out.color-match
  name: Projector gamma and colour matching
  sources:
    - ref: brief §16
      item: "Gamma/color matching; treat surface response and optical differences as measured limitations"
      category: "Multiple projectors and output management"
      checked: true
    - ref: S29
      item: "Edge blending — Gamma (Red, Green, Blue)"
      category: "Edge blending"
      checked: true
  artist_can: >-
    Make projectors of different models or ages match in brightness, white point and gamma, so blended areas and
    neighbouring walls look consistent.
  projection_example: >-
    A newer, bluer projector is matched to an older one on adjacent walls.
  controls:
    - { name: "Gain / offset / gamma per channel", type: "float[9]", animatable: false }
    - { name: "Match brightness to dimmest", type: "bool", animatable: false }
    - { name: "Side-by-side matching assistant", type: "action", animatable: false }
  animation: >-
    None.
  dependencies: [out.output-color, out.test-pattern]
  implementation: >-
    A per-output 3×3 matrix plus per-channel 1D curves in linear light, inside the out.output-color stage. Guided
    visual matching uses split-field patterns (both projectors in the overlap showing the same swatch). Camera-
    assisted estimation in the vision sidecar is an advanced option.
  io: >-
    Baked, or exported as a per-output 1D/3D LUT (.cube). Recorded in the stage ledger.
  limitations: >-
    Matching lowers every projector to the weakest one's range. Visual matching is subjective, and differences caused
    by surface material or angle are not projector issues. Colorimeter support is an open question (not planned).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: E
  beginner:
    action: >-
      Blend step → "Match colours": "Which side looks warmer?" style comparisons, with 2–3 controls.
    defaults: >-
      Identity correction.
    automation: >-
      Iterative comparisons converge on gains/gamma.
    usability_check: >-
      Physical test: users reduce a visible white-point mismatch to "not distracting" (2 observers) in under
      10 minutes.
  acceptance: >-
    AS-5 (colour checked physically).
  status: not-started
  evidence: []

- id: out.output-color
  name: Output colour correction (separate from the artistic grade)
  sources:
    - ref: brief §11I
      item: "Separate the show's artistic grade from each projector's output correction"
      category: "Color and channels"
      checked: true
    - ref: brief §14
      item: "Output transforms and correct metadata"
      category: "Color precision and image quality"
      checked: true
  artist_can: >-
    Keep each projector's output correction (brightness, gamma, colour balance, output transform) apart from the
    show's creative colour grade, so neither can disturb the other.
  projection_example: >-
    The show is graded warm for the story; the projector correction compensates a cool lamp. Exports to a second
    venue keep the grade but drop the old correction.
  controls:
    - { name: "Output transform (sRGB/Rec.709 2.2, 2.4, OCIO display/view, LUT)", type: "enum", animatable: false }
    - { name: "Brightness / gamma / balance", type: "float[]", animatable: false }
    - { name: "Dither", type: "bool", animatable: false }
  animation: >-
    None. Creative grades stay in compositions (fx.color.curves etc.).
  dependencies: [color.management, color.lut, out.projector-output]
  implementation: >-
    A separate output-pipeline stage. Linear-light correction (including out.color-match) runs first. After the
    residual warp comes the output transform from the scene-linear working space to the projector signal: analytic
    sRGB/gamma in WGSL, or an OCIO display/view baked to a 3D LUT by the PyOpenColorIO sidecar. Then
    triangular-noise dither to 8/10 bit. Creative grades remain effects in compositions.
  io: >-
    Recorded in the manifest stage ledger. Exportable as .cube for players.
  limitations: >-
    A monitor preview cannot guarantee a physical match. SDR projectors stay SDR even with HDR sources.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Output → "Projector picture" with Brightness / Contrast / Warmth, clearly labelled "affects this projector
      only".
    defaults: >-
      sRGB-like gamma 2.2 transform, no correction, dither on.
    automation: >-
      Chooses the transform from the output preset.
    usability_check: >-
      Users can say whether a change affects "the show" or "this projector" for 4 of 4 example controls.
  acceptance: >-
    AS-5. Mini scene "grade-vs-output": swapping the output correction leaves master exports bit-identical.
  status: not-started
  evidence: []

