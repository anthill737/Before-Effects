- id: out.spout
  name: Spout texture sharing
  sources:
    - ref: brief §16
      item: "Optional live texture/video interchange such as Spout, Syphon, or NDI"
      category: "Multiple projectors and output management"
      checked: true
    - ref: S27
      item: "Spout-Syphon send / receive"
      category: "Networking & Control"
      checked: true
  artist_can: >-
    Share live frames with other apps on the same Windows PC — send outputs to Resolume/TouchDesigner/OBS, or receive
    their frames as a source layer.
  projection_example: >-
    Send the mapped facade output to Resolume for playback; receive a live TouchDesigner generative feed into a
    window region.
  controls:
    - { name: "Send (per output or composition), sender name", type: "string", animatable: false }
    - { name: "Receive source", type: "select", animatable: false }
    - { name: "Format (8-bit, 16-bit float)", type: "enum", animatable: false }
  animation: >-
    Received frames act as live footage. Exports need a recorded/baked copy for reproducibility.
  dependencies: [out.projector-output, show.workspace]
  implementation: >-
    A native N-API addon wrapping the Spout2 SDK (SpoutDX, BSD-2). Send path: Electron offscreen rendering with
    webPreferences.offscreen.useSharedTexture (paint event delivers an OffscreenSharedTexture; release it promptly),
    passing its handle to SpoutDX. Fallback: WebGPU readback (copyTextureToBuffer + mapAsync) into a D3D11 texture.
    Receive path: SpoutDX receive → CPU copy → queue.writeTexture. Zero-copy import into WebGPU is assumed
    unavailable.
  io: >-
    Live only.
  limitations: >-
    Windows only. The shared-handle details (D3D11 NT handle) and latency are unverified until prototyped. The CPU
    fallback costs about 8 MB per 1080p RGBA8 frame.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Live inter-app (Spout, NDI) and OSC integration. The plan is export-first: baked projector video and mapping-data export come first. Revisit after show playback is proven. MIDI stays required for timecode sync."
  milestone: E
  beginner:
    action: >-
      Advanced → "Share with other apps (Spout)".
    defaults: >-
      Sender name "Before Effects – Output 1".
    automation: >-
      Source discovery.
    usability_check: >-
      Pilot user receives the output in Resolume within 2 minutes.
  acceptance: >-
    Mini scene "spout-loop": send → receive round trip matches within 1 code value; latency measured.
  status: not-started
  evidence: []

