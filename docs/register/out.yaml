  evidence: []

- id: out.bake-once
  name: Never apply mapping, blending or output colour twice
  sources:
    - ref: brief §17
      item: "Never apply mapping, blending, or output color correction twice"
      category: "Rendering, export, and delivery"
      checked: true
  artist_can: >-
    Trust that warping, blending and projector colour correction happen exactly once — in the app, in an exported
    file, or in external playback software.
  projection_example: >-
    Re-importing an exported projector file as a source raises "This file already contains Projector 1's mapping —
    use it as-is on that output?" instead of warping it again.
  controls:
    - { name: "Per-stage choice (bake here / player applies)", type: "enum[]", animatable: false }
  animation: >-
    None.
  dependencies: [out.manifest, out.projector-output, proj.project-model]
  implementation: >-
    Every texture, media item and export carries a stage ledger. The output pipeline skips or blocks stages already
    present in a source's ledger and explains why. Before Effects exports embed the ledger in the manifest and in
    container metadata (FFmpeg -metadata comment), so re-imported files are recognised. Export presets declare
    "player applies" stages. A property-based test asserts that each stage appears at most once along any render
    path.
  io: >-
    Ledger in manifest and container metadata.
  limitations: >-
    Files from other software carry no ledger; the app asks once how such a file was prepared.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Invisible unless a conflict appears, then a plain question with two buttons.
    defaults: >-
      Bake all stages for "Files for my projector setup"; bake none for masters.
    automation: >-
      Ledger tracking and conflict detection.
    usability_check: >-
      In a seeded double-mapping trap, at least 4 of 5 users choose the correct option from the prompt.
  acceptance: >-
    Mini scene "double-bake-trap"; AS-5 manifests.
  status: not-started
  evidence: []

