- id: fx.time.time-displacement
  name: Time Displacement
  sources:
    - ref: S02
      item: Time Displacement
      category: Time
      adobe_support: { gpu: false, bpc: [8, 16], mfr: true }
      checked: true
    - ref: S17
      item: Time Displacement
      category: Time
      checked: true
  artist_can: >-
    Shift each pixel forward or back in time according to a brightness map, for slit-scan, time-ripple and smeared-time looks.
  projection_example: >-
    A "time ripple" spreads out from the front door: footage near the door is live, while footage further away lags up to 2 seconds behind.
  controls:
    - { name: "Time Displacement Layer", type: "layer-ref", animatable: false }
    - { name: "Max Displacement Time (sec)", type: "float", animatable: true }
    - { name: "Time Resolution (fps)", type: "float", animatable: false }
    - { name: "Stretch Map To Fit", type: "bool", animatable: false }
    - { name: "Map source (layer / gradient / distance from region)", type: "enum (product addition)", animatable: false }
  animation: >-
    Max Displacement keyframable and expression-linkable. The map layer can itself be animated.
  dependencies: [proj.layer, map.region, fx.time.temporal-sampling-contract, preview.cache, fx.generate.gradient-ramp]
  implementation: >-
    Sliced gather. The per-pixel target time is computed from map luminance (read in f32, no 8-bit time quantisation) and quantised to Time Resolution. For each occupied slice, the upstream frame is fetched from cache and written to the pixels assigned to that slice, with optional blending of neighbouring slices for a smooth mode. Memory is O(1) frames plus the output; cost is O(slices). Temporal: reads up to 2 × Max × Resolution + 1 frames in [t - Max, t + Max]. Bounds: unchanged. Precision: rgba16float.
  io: >-
    none
  limitations: >-
    S17 notes that masks on the same layer are ignored; Before Effects applies masks after the pass instead. Long max times are expensive; the UI shows the number of frames read per output frame.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Temporal effect or plug-in clone with no projection workflow behind it. The temporal-sampling contract stays required for preview/export parity."
  milestone: D
  beginner:
    action: >-
      "Time ripple" recipe: pick a region or direction for the ripple to come from, then set Strength in seconds.
    defaults: >-
      Map = distance from the selected region, max 1 s, resolution = composition frame rate.
    automation: >-
      Generates the map from region geometry (no manual gradient layer). Uses the map layer with its effects applied, with no precompose step.
    usability_check: >-
      A first-time user creates a time ripple from a chosen door region in at most 3 actions and under 60 s.
  acceptance: >-
    Mini scene "door-ripple": per-pixel source times match the analytic map; random-access frames match sequential.
  status: not-started
  evidence: []

- id: fx.time.timewarp
  name: Timewarp
  sources:
    - ref: S02
      item: Timewarp
      category: Time
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S17
      item: Timewarp
      category: Time
      checked: true
  artist_can: >-
    Change playback speed with smooth slow motion, fast motion or speed ramps, choosing how in-between frames are made: repeat, blend or motion-interpolate.
  projection_example: >-
    Footage of crashing waves ramps from real time to 20% slow motion as the "water" floods across the facade, then snaps back on the drop.
  controls:
    - { name: "Adjust Time By (Speed / Source Frame)", type: "enum", animatable: false }
    - { name: "Speed", type: "percent", animatable: true }
    - { name: "Source Frame", type: "float", animatable: true }
    - { name: "Method (Whole Frames / Frame Mix / Pixel Motion)", type: "enum", animatable: false }
    - { name: "Tuning (Vector Detail, Error Threshold, Block Size, RGB Weighting)", type: "group", animatable: false }
    - { name: "Smoothing (Build From One Image, Correct Luminance Changes, Filtering)", type: "group", animatable: false }
    - { name: "Motion Blur (Enable, Shutter Control, Shutter Angle, Shutter Samples)", type: "group", animatable: true }
    - { name: "Matte Layer / Matte Channel", type: "layer-ref + enum", animatable: false }
    - { name: "Warp Layer", type: "layer-ref", animatable: false }
    - { name: "Show", type: "enum", animatable: false }
    - { name: "Source Crops (left, right, top, bottom)", type: "float[4]", animatable: false }
  animation: >-
    Speed and Source Frame keyframable with the graph editor (speed ramps) and expression-linkable. Shutter angle keyframable.
  dependencies: [anim.time-remap, anim.graph-editor, fx.time.optical-flow-engine, fx.time.temporal-sampling-contract, preview.cache]
  implementation: >-
    The core computes source time s(t) deterministically: either directly from Source Frame, or by integrating Speed from the layer in-point (exact per segment for linear and hold keys, fixed-step Simpson in flicks for Bezier). Pixel pass by method: Whole Frames takes the nearest frame; Frame Mix blends floor(s) and ceil(s); Pixel Motion warps floor(s) and ceil(s) bidirectionally with flow and occlusion-aware weights, with separate flow per matte region. Motion blur integrates S samples across the shutter in source time. Temporal: reads source frames floor(s)-1 to ceil(s)+1, plus every source frame spanned by the shutter. Bounds: unchanged; Source Crops repeat edge pixels inward. Precision: rgba16float, flow in f16.
  io: >-
    Uses flow caches.
  limitations: >-
    After Effects ignores masks on the same layer and does not handle interlaced fields (S17). Before Effects applies masks after the pass and expects progressive sources. Pixel Motion artefacts appear on occlusions and flashing content; Frame Mix is the fallback.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Temporal effect or plug-in clone with no projection workflow behind it. The temporal-sampling contract stays required for preview/export parity."
  milestone: D
  beginner:
    action: >-
      "Slow motion" and "Speed ramp" recipes: a Speed slider (or drawn ramp) plus a "Smooth (analyse motion)" switch.
    defaults: >-
      Pixel Motion for camera footage, Frame Mix for graphics and flashing content, motion blur off.
    automation: >-
      Classifies the clip (camera footage vs graphics) to pick the method. Starts flow analysis in the background. Extends the layer's out-point so slowed footage does not end early.
    usability_check: >-
      A first-time user makes a smooth 25% slow-motion clip in at most 3 actions and under 60 s, excluding analysis wait time, which is measured separately.
  acceptance: >-
    Mini scene "wave-ramp": speed ramp preview equals export frame-for-frame; interpolated frames meet the flow-engine PSNR target.
  status: not-started
  evidence: []
