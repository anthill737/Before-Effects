  controls:
    - { name: RAM / VRAM budget, type: size, animatable: false }
    - { name: Memory status, type: display, animatable: false }
  animation: >-
    n/a
  dependencies: [preview.gpu]
  implementation: >-
    Central allocator tracks GPU textures/buffers and CPU caches against budgets; pools reuse textures; GPU OOM caught
    via pushErrorScope('out-of-memory') and device.lost; fallback order: evict caches → lower preview scale → tiled
    rendering (for frames over texture limits) → clear message naming the heavy item.
  io: >-
    none
  limitations: >-
    Some effects cannot tile (global operations); they report their memory need.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      None; a message appears only if a fallback changes what is shown.
    defaults: >-
      Set automatically, with no controls: the editor's finished-frame and video-frame caches take about a third of
      the graphics card's own memory (video frames 1-1.5 GB of it); projector output and pop-out windows keep 1 GB +
      1 GB; preview frames are always also kept on disk, sized from the drive and the show.
    automation: >-
      Applies the fallback chain automatically.
    usability_check: >-
      In OOM fault tests, users get a message naming the cause and a fix, never a crash.
  acceptance: >-
    16K test canvas exports correctly via tiling; injected OOM never crashes the app.
  status: not-started
  evidence: []

