# Preview, cache and performance — Before Effects capability register
# Sources: S31 (Multi-Frame Rendering, Speculative Preview / Cache Frames When Idle; checked 2026-10-01), S30 (render settings Disk Cache, Proxy Use; checked), S10 (Adaptive Resolution with 3D; checked), S22 (transcode tip; checked), S01 (previews, RAM preview, Fast Previews, proxies, Media & Disk Cache, Composition Profiler, GPU, channels, snapshots, Mercury Transmit), brief §18 and §20. Live show operation is covered by show.* entries.

- id: preview.scrub
  name: Responsive scrubbing
  sources:
    - ref: brief
      item: §18 responsive scrubbing
      category: Product requirement
      checked: true
    - ref: S01
      item: Scrubbing the current-time indicator; Fast Previews
      category: View and preview
      checked: false
  artist_can: >-
    Drag the playhead and see the image follow immediately, refining to full quality when the drag stops.
  projection_example: >-
    Scrub through a dense 3D collapse to find the exact frame where a brick should start falling.
  controls:
    - { name: Scrub quality, type: enum(auto|draft|full), animatable: false }
  animation: >-
    n/a
  dependencies: [preview.cache, preview.quality, preview.decode]
  implementation: >-
    Scrub requests are cancellable and coalesced (latest-wins); cached frames shown instantly; uncached frames render at
    reduced resolution first then refine; decoders keep keyframe indices for fast random access.
  io: >-
    none
  limitations: >-
    Long-GOP footage and stateful simulations scrub slower until proxies/checkpoints exist.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Drag the playhead.
    defaults: >-
      Auto quality.
    automation: >-
      Builds proxies and checkpoints in the background when scrubbing is slow.
    usability_check: >-
      On starter scenes, first visible feedback within 100 ms of a scrub move on the target machine.
  acceptance: >-
    Measured scrub latency logged for the starter project and AS-3 scene.
  status: implemented
  evidence:
    - "journey: uitest steps resolution-full/half/quarter/eighth/auto (exact canvas sizes 1920×1080 → 240×135), zoom-is-display-only, view-3d/projector/show with pixel checks, frame-step, loop-range, cache-first-playback (30/30 fps, 0 skipped), edit-invalidates-only-affected, enlarge, pop-out; export at full size after Quarter preview"
    - "unit: core invalidation tests (affectedByPatches)"

- id: preview.playback
  name: Real-time playback preview
  sources:
    - ref: S01
      item: Preview panel — play/stop, range (work area, around current time), loop, frame rate, skip frames, play from current time, cache before playback
      category: View and preview
      checked: false
  artist_can: >-
    Play the composition with sound, loop a range, and choose whether to drop frames for real-time playback or wait to
    cache every frame.
  projection_example: >-
    Loop the 8-bar chorus while adjusting how the windows pulse.
  controls:
    - { name: Play / stop, type: action, animatable: false }
    - { name: Range, type: enum(work-area|around-playhead|whole|custom), animatable: false }
    - { name: Loop, type: enum(loop|once|ping-pong), animatable: false }
    - { name: Mode, type: enum(real-time-drop-frames|cache-then-play), animatable: false }
    - { name: Skip frames, type: int, animatable: false }
  animation: >-
    n/a
  dependencies: [preview.cache, audio.preview-sync, preview.dropped-frames]
  implementation: >-
    Playback scheduler keyed to the audio clock; frames served from the RAM cache or rendered just in time; in
    real-time mode late frames are dropped and counted.
  io: >-
    none
  limitations: >-
    Heavy scenes need caching or lower quality for real-time playback.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Space bar / big Play button.
    defaults: >-
      Loop work area, real-time with frame drops shown.
    automation: >-
      Suggests "cache first" when playback drops many frames.
    usability_check: >-
      First-time users start, stop and loop a preview without help.
  acceptance: >-
    Starter scene plays at full frame rate at Auto quality; dropped frames reported accurately.
  status: implemented
  evidence:
    - "journey: uitest steps resolution-full/half/quarter/eighth/auto (exact canvas sizes 1920×1080 → 240×135), zoom-is-display-only, view-3d/projector/show with pixel checks, frame-step, loop-range, cache-first-playback (30/30 fps, 0 skipped), edit-invalidates-only-affected, enlarge, pop-out; export at full size after Quarter preview"
    - "unit: core invalidation tests (affectedByPatches)"

- id: preview.quality
  name: Preview resolution and quality
  sources:
    - ref: S01
      item: Composition panel resolution (Full, Half, Third, Quarter, Custom, Auto); Fast Previews (Adaptive Resolution, Off/Final Quality); layer quality; Region of Interest
      category: View and preview
      checked: false
    - ref: S10
      item: Adaptive Resolution supports 3D rendering
      category: Advanced 3D renderer
      checked: true
  artist_can: >-
    Trade preview resolution and effect quality for speed, limit rendering to a region of interest, and switch to final
    quality to check details.
  projection_example: >-
    Preview a 16K-wide multi-projector canvas at quarter resolution, or only the region around one window at full quality.
  controls:
    - { name: Resolution, type: enum(auto|full|half|third|quarter|custom), animatable: false }
    - { name: Fast previews, type: enum(off|adaptive|draft-3d), animatable: false }
    - { name: Region of interest, type: rect2d, animatable: false }
    - { name: Layer quality, type: enum(draft|best), animatable: false }
  animation: >-
    n/a
  dependencies: [preview.fidelity-disclosure, 3d.quality-modes]
  implementation: >-
    Render graph evaluated at a scale factor (effects declare how parameters scale with resolution so looks stay
    consistent); ROI clips work to tiles intersecting the region; adaptive mode lowers scale during interaction.
  io: >-
    none
  limitations: >-
    Some effects (e.g. noise detail, thin strokes) look different at reduced resolution; disclosed.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Viewer quality chip "Auto / Full".
    defaults: >-
      Auto (full when idle, lower while moving).
    automation: >-
      Picks resolution from measured frame cost.
    usability_check: >-
      Users can switch to full quality to check a detail in one click.
  acceptance: >-
    Scaled previews match downscaled full renders within tolerance for scale-aware effects.
  status: not-started
  evidence: []

- id: preview.decode
  name: Fast, frame-exact media decode
  sources:
    - ref: brief
      item: architecture — WebCodecs for fast preview decode where exact enough; FFmpeg sidecar decode
      category: Product requirement
      checked: true
  artist_can: >-
    Scrub and play footage of many formats quickly while always seeing the exact frame that will be exported.
  projection_example: >-
    A 4K HEVC drone clip scrubs smoothly in a window region and shows exactly the frame the export will use.
  controls:
    - { name: Decode path, type: enum(auto|hardware|software), animatable: false }
  animation: >-
    n/a
  dependencies: [proj.project-model, color.input-interpretation]
  implementation: >-
    Demux with a frame index; WebCodecs VideoDecoder (hardware) for H.264/HEVC/VP9/AV1 where a per-asset exactness test
    matches FFmpeg-decoded reference frames; FFmpeg sidecar (NVDEC or software) otherwise, including ProRes/DNxHR;
    HAP decoded by Snappy + direct BC texture upload (WebGPU texture-compression-bc). Export always uses the
    reference-exact path.
  io: >-
    Frame index cached per asset.
  limitations: >-
    Variable-frame-rate sources are conformed to a constant rate on import with a notice.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      None.
    defaults: >-
      Auto.
    automation: >-
      Chooses decode path per asset after a quick exactness test.
    usability_check: >-
      n/a for novices; check: no preview/export frame mismatch on the test media pack.
  acceptance: >-
    Test pack: preview frame N equals export frame N (hash) for every supported format.
  status: implemented
  evidence:
    - "journey: import-media (picture, video, music copied into project media; beat found 119.9 BPM), video-in-windows (frame-accurate FFmpeg decode, proxy sizes for preview), music-on-timeline (waveform), move-with-beat, audio-preview-sync (picture follows sound clock, 0 ms), export-with-sound (Sound: yes), av-timing-measured (59/59 clicks paired, mean 1 ms, worst 1 frame @30 fps)"
    - "unit: packages/core/test/audio.test.ts (tempo 90/120/128/140 BPM within 2 BPM, beats within 30 ms, downbeat phase, deterministic)"

- id: preview.proxy
  name: Proxies and media conversion
  sources:
    - ref: S01
      item: Placeholders and proxies; Create Proxy; Set Proxy; proxy indicators
      category: Work with footage items
      checked: false
    - ref: S30
      item: Render settings — Proxy Use
      category: Render and export
      checked: true
    - ref: S22
      item: Use transcoded (scaled-down) footage for better performance
      category: Remove objects from your videos
      checked: true
  artist_can: >-
    Work with lightweight stand-ins for heavy footage or compositions, switch them on or off, and always export from originals.
  projection_example: >-
    8K drone footage gets a 2K proxy so the facade show stays responsive; the final master uses the 8K original.
  controls:
    - { name: Proxy status, type: enum(none|building|ready|in-use), animatable: false }
    - { name: Use proxies, type: bool, animatable: false }
    - { name: Proxy resolution, type: enum(half|quarter|custom), animatable: false }
    - { name: Proxy format, type: enum(prores-proxy|h264-intra|png), animatable: false }
  animation: >-
    n/a
  dependencies: [preview.decode, render.settings, render.background]
  implementation: >-
    Background FFmpeg jobs transcode heavy or poorly seekable media to all-intra proxies (ProRes Proxy or intra H.264)
    keyed by source hash; composition proxies are pre-rendered (preview.prerender); proxies keep source timing and
    pixel-aspect so they are drop-in; render settings default to originals.
  io: >-
    Proxies stored in the disk cache folder, regenerable, optionally collected.
  limitations: >-
    Proxies are not used for exports unless explicitly chosen (draft renders).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      None; heavy clips get proxies automatically with a small "fast copy" badge.
    defaults: >-
      Auto-proxy for sources above 4K, long-GOP 10-bit, or codecs WebCodecs cannot decode.
    automation: >-
      Builds proxies on import in the background and swaps them in when ready.
    usability_check: >-
      Users never need to create a proxy manually for the supplied media pack.
  acceptance: >-
    Export with proxies "in use" in the viewer still renders from originals (verified by hash).
  status: implemented
  evidence:
    - "journey: import-media (picture, video, music copied into project media; beat found 119.9 BPM), video-in-windows (frame-accurate FFmpeg decode, proxy sizes for preview), music-on-timeline (waveform), move-with-beat, audio-preview-sync (picture follows sound clock, 0 ms), export-with-sound (Sound: yes), av-timing-measured (59/59 clicks paired, mean 1 ms, worst 1 frame @30 fps)"
    - "unit: packages/core/test/audio.test.ts (tempo 90/120/128/140 BPM within 2 BPM, beats within 30 ms, downbeat phase, deterministic)"

- id: preview.cache
  name: RAM frame cache
  sources:
    - ref: S01
      item: RAM preview cache; cache indicators (green bar)
      category: View and preview
      checked: false
    - ref: brief
      item: §18 RAM caches
      category: Product requirement
      checked: true
  artist_can: >-
    Replay already-rendered frames instantly, with a timeline bar showing which frames are cached.
  projection_example: >-
    After one slow pass, the whole chorus loops in real time while adjusting an unrelated layer's colour.
  controls:
    - { name: Cache indicator, type: display, animatable: false }
    - { name: RAM budget, type: size, animatable: false }
    - { name: Purge, type: action, animatable: false }
  animation: >-
    n/a
  dependencies: [preview.cache-invalidation, preview.memory-budget]
  implementation: >-
    Frames cached per render-graph node output keyed by content hash (node params evaluated at t + upstream hashes +
    quality + engine version); stored as GPU textures (hot) and compressed half-float CPU buffers (warm) under an LRU
    with budgets; intermediate node caches let unrelated edits reuse upstream results.
  io: >-
    none
  limitations: >-
    4K rgba16float frames are ~66 MB uncompressed; long ranges spill to the disk cache.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      None; green bar on the timeline shows ready frames.
    defaults: >-
      Budget = 50% of free RAM, capped by settings.
    automation: >-
      Manages eviction automatically.
    usability_check: >-
      Users explain the green bar correctly after one tooltip (8 of 10).
  acceptance: >-
    Cached frames are bit-identical to fresh renders; editing one layer keeps unaffected node caches.
  status: implemented
  evidence:
    - "journey: uitest steps resolution-full/half/quarter/eighth/auto (exact canvas sizes 1920×1080 → 240×135), zoom-is-display-only, view-3d/projector/show with pixel checks, frame-step, loop-range, cache-first-playback (30/30 fps, 0 skipped), edit-invalidates-only-affected, enlarge, pop-out; export at full size after Quarter preview"
    - "unit: core invalidation tests (affectedByPatches)"

- id: preview.disk-cache
  name: Persistent disk cache
  sources:
    - ref: S30
      item: Render settings — Disk Cache (Read Only, Current Settings)
      category: Render and export
      checked: true
    - ref: S01
      item: Media & Disk Cache preferences (folder, maximum size, empty cache)
      category: Memory, storage, performance
      checked: false
  artist_can: >-
    Keep rendered frames between sessions on a fast drive so reopening a project does not mean re-rendering everything.
  projection_example: >-
    Next morning the heavy fluid scene previews instantly from yesterday's disk cache.
  controls:
    - { name: Cache folder, type: path, animatable: false }
    - { name: Maximum size, type: size, animatable: false }
    - { name: Empty cache, type: action, animatable: false }
  animation: >-
    n/a
  dependencies: [preview.cache, preview.cache-invalidation]
  implementation: >-
    Content-addressed store of half-float frames (LZ4/zstd-compressed tiles or EXR DWAA for large frames) keyed by the
    same node hashes as the RAM cache; LRU eviction by size; safe across crashes (write-then-rename).
  io: >-
    Not part of the project; rebuildable. Render jobs may read it (read-only by default).
  limitations: >-
    Disk speed matters; network drives are discouraged.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      None; Settings → Storage shows usage and "Free space".
    defaults: >-
      Fastest local drive, 50 GB or 10% of free space.
    automation: >-
      Chooses the fastest drive and warns when space is low.
    usability_check: >-
      Users free cache space from one settings page.
  acceptance: >-
    Reopened project shows previously cached frames as ready; hashes match.
  status: not-started
  evidence: []

- id: preview.cache-invalidation
  name: Cache invalidation and dependency tracking
  sources:
    - ref: brief
      item: §18 cache invalidation; §3 replace pre-render cache when dependencies change
      category: Product requirement
      checked: true
  artist_can: >-
    Trust that any cached or pre-rendered frame is current: changing something invalidates exactly the frames it affects.
  projection_example: >-
    Changing the colour of one window's glow from 0:30–0:40 re-renders only those frames of that layer and its consumers.
  controls:
    - { name: "Why is this frame not cached?", type: display, animatable: false }
  animation: >-
    n/a
  dependencies: [proj.project-model, ux.operation-system]
  implementation: >-
    Every op reports changed properties; per-node time-dependency intervals (keyframe spans, expression time-dependence,
    temporal effects' frame windows) give the affected time ranges; node hashes recomputed lazily; external asset
    changes detected by file watchers + content hash.
  io: >-
    none
  limitations: >-
    Expressions reading time or other layers broadly invalidate more frames; reported in the inspector.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      None.
    defaults: >-
      Always on.
    automation: >-
      Fully automatic.
    usability_check: >-
      No stale frame observed in a scripted edit/preview test of 1,000 random edits.
  acceptance: >-
    Fuzz test: random edits followed by cached vs fresh render comparisons never differ.
  status: implemented
  evidence:
    - "journey: uitest steps resolution-full/half/quarter/eighth/auto (exact canvas sizes 1920×1080 → 240×135), zoom-is-display-only, view-3d/projector/show with pixel checks, frame-step, loop-range, cache-first-playback (30/30 fps, 0 skipped), edit-invalidates-only-affected, enlarge, pop-out; export at full size after Quarter preview"
    - "unit: core invalidation tests (affectedByPatches)"

- id: preview.prerender
  name: Background pre-render of expensive content
  sources:
    - ref: S01
      item: Pre-render a nested composition; Post-Render Action Import & Replace Usage
      category: Work with compositions
      checked: false
    - ref: brief
      item: §0.6 pre-render expensive content in the background; §3 pre-rendering expensive nested content
      category: Product requirement
      checked: true
  artist_can: >-
    Have slow nested compositions and simulations rendered in the background and used automatically until they change.
  projection_example: >-
    The particle storm precomp pre-renders while the user works on lighting; the main show then plays in real time.
  controls:
    - { name: Pre-render this, type: action, animatable: false }
    - { name: Auto pre-render, type: bool, animatable: false }
    - { name: Status, type: enum(live|rendering|ready|stale), animatable: false }
  animation: >-
    n/a
  dependencies: [preview.disk-cache, preview.cache-invalidation, render.background, proj.precompose, preview.profiler]
  implementation: >-
    Node-level pre-render jobs write the node's output frames into the disk cache at final quality; consumers read them
    while hashes match; stale results discarded automatically.
  io: >-
    none
  limitations: >-
    Pre-rendered results consume disk; time-remapped consumers may request frames outside the pre-rendered range.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Suggestion card: "This part is slow — prepare it in the background?"
    defaults: >-
      Auto pre-render for nodes the profiler marks as bottlenecks (opt-in once per project).
    automation: >-
      Detects, schedules, invalidates and reuses automatically.
    usability_check: >-
      A user accepts a pre-render suggestion and sees real-time playback afterwards without further steps.
  acceptance: >-
    Pre-rendered and live results are identical; stale state appears immediately after an upstream edit.
  status: not-started
  evidence: []

- id: preview.idle-cache
  name: Cache frames when idle (speculative preview)
  sources:
    - ref: S31
      item: Speculative Preview — Cache Frames When Idle; Idle Delay Before Caching Starts (8 s); Cache Frames (From Current Time, Around Current Time, From Start of Range); Cache Range (Work Area, Work Area Extended by Current Time, Entire Duration)
      category: Multi-Frame Rendering
      checked: true
  artist_can: >-
    Let the app render ahead while you pause, so the preview is ready when you come back.
  projection_example: >-
    During a coffee break the whole 3-minute show caches for a smooth client run-through.
  controls:
    - { name: Cache when idle, type: bool, animatable: false }
    - { name: Idle delay, type: time, animatable: false }
    - { name: Cache order, type: enum(from-current|around-current|from-range-start), animatable: false }
    - { name: Cache range, type: enum(work-area|work-area-from-current|entire), animatable: false }
  animation: >-
    n/a
  dependencies: [preview.cache, preview.disk-cache, preview.concurrent-frames]
  implementation: >-
    Low-priority scheduler starts after the idle delay and yields instantly to user input.
  io: >-
    none
  limitations: >-
    Uses power and GPU while idle; disabled on battery by default.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      None; on by default.
    defaults: >-
      Always on (no switch): after 2 s idle, from the playhead through what Space plays.
    automation: >-
      Pauses on battery power.
    usability_check: >-
      Users notice the timeline filling green when idle and understand it (tooltip).
  acceptance: >-
    Idle caching never delays a user action by more than one frame time.
  status: not-started
  evidence: []

- id: preview.profiler
  name: Performance profiling and bottleneck finder
  sources:
    - ref: S01
      item: Composition Profiler (render time per layer and effect)
      category: Memory, storage, performance
      checked: false
    - ref: brief
      item: §0.6 find performance bottlenecks; §18 profiling
      category: Product requirement
      checked: true
  artist_can: >-
    See which layers and effects make a frame slow and get practical fixes (pre-render, lower quality, proxy) with one click.
  projection_example: >-
    The profiler shows a 2,000-particle glow costs 80% of the frame and offers to pre-render it.
  controls:
    - { name: Show render times, type: bool, animatable: false }
    - { name: Bottleneck list, type: display, animatable: false }
    - { name: Apply suggestion, type: action, animatable: false }
  animation: >-
    n/a
  dependencies: [preview.prerender, preview.proxy, preview.quality]
  implementation: >-
    WebGPU timestamp queries per pass (where the adapter supports timestamp-query) plus CPU timing per node; aggregated
    per layer/effect over sampled frames; suggestions generated from rules.
  io: >-
    Profile reports exportable as JSON for bug reports.
  limitations: >-
    GPU timing granularity varies by driver; numbers are indicative.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Why is it slow?" button when playback drops frames.
    defaults: >-
      Top 3 culprits with suggested fixes.
    automation: >-
      Profiles the current range in the background and ranks fixes by impact.
    usability_check: >-
      A user doubles preview speed on a supplied slow scene by applying one suggestion.
  acceptance: >-
    Profiler identifies the injected expensive node in a synthetic test 10 of 10 times.
  status: not-started
  evidence: []

- id: preview.gpu
  name: GPU processing and device recovery
  sources:
    - ref: S01
      item: GPU acceleration (Mercury GPU acceleration; GPU-accelerated effects)
      category: Memory, storage, performance
      checked: false
    - ref: brief
      item: §18 evaluate GPU processing
      category: Product requirement
      checked: true
  artist_can: >-
    Get fast GPU rendering for compositing, effects and 3D, and keep working if the graphics driver resets.
  projection_example: >-
    A driver update crash mid-session recovers the viewer without losing edits.
  controls:
    - { name: GPU adapter, type: enum(dynamic), animatable: false }
    - { name: GPU status, type: display, animatable: false }
  animation: >-
    n/a
  dependencies: [proj.autosave-recovery]
  implementation: >-
    WebGPU (Dawn/D3D12 on Windows) requesting the high-performance adapter and higher limits (maxTextureDimension2D up
    to adapter limits, timestamp-query, texture-compression-bc, shader-f16); device.lost handler recreates the device
    and resources from the project state; render jobs restart from the last good frame.
  io: >-
    none
  limitations: >-
    Target hardware is an RTX 5070 Ti (16 GB); other GPUs work within their limits.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      None; a short notice appears if the GPU resets.
    defaults: >-
      High-performance adapter.
    automation: >-
      Recovers automatically.
    usability_check: >-
      After an injected device loss, users continue working without data loss.
  acceptance: >-
    Fault injection (device.destroy) recovers viewer and resumes a render without corrupt frames.
  status: not-started
  evidence: []

- id: preview.concurrent-frames
  name: Concurrent frame rendering (multi-frame rendering equivalent)
  sources:
    - ref: S31
      item: Multi-Frame Rendering — enable/disable, CPU cores/RAM/GPU scaling, % CPU reserved, effects optimised for MFR
      category: Multi-Frame Rendering
      checked: true
    - ref: brief
      item: §18 concurrent frame work where dependencies permit; parallel workers must not skip simulation history
      category: Product requirement
      checked: true
  artist_can: >-
    Get faster previews and exports by working on several frames at once, automatically, wherever the scene allows it.
  projection_example: >-
    A 4K export of a mostly 2D facade show renders roughly twice as fast as one-frame-at-a-time.
  controls:
    - { name: Concurrent frames, type: enum(auto|1|2|4|8), animatable: false }
    - { name: CPU reserved (%), type: percent, animatable: false }
  animation: >-
    n/a
  dependencies: [preview.memory-budget, render.determinism]
  implementation: >-
    Several frames in flight: core evaluation in worker threads, GPU work interleaved on the device queue, and for
    exports optional extra hidden renderer processes (VRAM permitting). Nodes declare temporal/stateful dependencies;
    stateful simulations are split into contiguous chunks starting from checkpoints so no history is skipped.
  io: >-
    none
  limitations: >-
    Single-GPU throughput limits gains for GPU-bound scenes; stateful effects serialise.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      None.
    defaults: >-
      Auto, 10% CPU reserved.
    automation: >-
      Chooses concurrency from VRAM and measured throughput.
    usability_check: >-
