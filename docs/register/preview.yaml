  sources:
    - ref: brief
      item: §18 bounded memory/VRAM use; useful out-of-memory handling
      category: Product requirement
      checked: true
    - ref: S01
      item: Memory & Performance preferences
      category: Memory, storage, performance
      checked: false
  artist_can: >-
