- id: ai.external-agent-api
  name: Standing local external-agent API
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "A standing local external-agent API and MCP adapter"
      category: "External agents"
      checked: true
  artist_can: >-
    Any agent or script on this PC (Claude Code, Codex, another MCP client, or your own script) can talk to the
    running app through a local API: read the show, make changes as ordinary undoable operations, ask for a preview
    frame, and start exports. Before Effects does not run or embed a model.
  projection_example: >-
    From a terminal: "make the roofline windows pulse with the chorus" runs against the open project, the change
    appears in the app, and Ctrl+Z undoes it in one step.
  controls:
    - { name: "API on or off", type: "bool", animatable: false }
    - { name: "Endpoint (loopback port or named pipe)", type: "string", animatable: false }
    - { name: "Allowed scopes", type: "flags", animatable: false }
    - { name: "Connected agents", type: "view", animatable: false }
  animation: >-
    None.
  dependencies: [ai.mcp-server, ux.operation-system, ux.recipe-engine, render.queue, ai.context-summary, ai.bounded-edits]
  implementation: >-
    A loopback-only server (HTTP and JSON, with a Windows named-pipe option) started with the app. Versioned v1
    endpoints: describe operations (schemas from the operation registry), read the project summary and selection,
    submit typed operations (validated and applied as one undoable transaction, or staged for review), render a
    preview frame, queue and monitor exports, and subscribe to change events. The MCP server (ai.mcp-server) is a thin
    adapter over the same API. Results state plainly whether anything changed.
  io: >-
    No files are exposed. Media and file paths are referenced by asset id.
  limitations: >-
    Reachable only from this machine and only while the app is running. There is no embedded model, and quality
    depends on the agent the user runs.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Settings, "Let my agent connect": one switch and a copyable snippet.
    defaults: >-
      On and off by choice, local only, edit scope.
    automation: >-
      Starts with the app, publishes the operation list and keeps every change undoable.
    usability_check: >-
      A user connects Claude Code or Codex using only the shown snippet and makes one change.
  acceptance: >-
    Contract tests plus mini scene "agent-windows-pulse": an external agent makes a change over the API, and it undoes
    as one step.
  status: not-started
  evidence: []

