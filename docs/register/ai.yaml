      A first-time user connects an installed agent in under 2 minutes.
  acceptance: >-
    Version-tagged snippet tests and a manual connect and revoke with Claude Code and Codex.
  status: not-started
  evidence: []

- id: ai.agent-operations
  name: Every projection operation is available to agents
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "Standing external-agent API exposes the same operations as the interface"
      category: "External agents"
      checked: true
  artist_can: >-
    An agent can do whatever the visual interface does for projection work: areas, content assignment, scenes,
    timeline, 3D objects and physics, rendering and export. Each operation describes its inputs, units and an example.
  projection_example: >-
    An agent assigns a video to all windows (repeat), duplicates the scene, swaps the video and queues an export.
  controls:
    - { name: "Operation catalogue", type: "view", animatable: false }
    - { name: "Operation coverage report", type: "view", animatable: false }
  animation: >-
    None.
  dependencies: [ai.external-agent-api, ai.mcp-server, ux.operation-system, tool.area-assign, proj.scene-save-duplicate, 3d.object-editing, render.queue]
  implementation: >-
    The tool list is generated from the operation registry, so a new operation is exposed with its schema as soon as
    it exists. A coverage check compares registry operations with interface actions and fails when an interface action
    has no operation. Descriptions include units, ranges and a short example, and the generic stage-operations tool
    keeps the tool count small.
  io: >-
    None.
  limitations: >-
    Operations that only make sense interactively (dragging a handle) are exposed as their final operation, not as
    pointer events.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Internal: the catalogue is shown in the connect panel.
    defaults: >-
      Everything the interface can do is exposed unless flagged otherwise.
    automation: >-
      Generates schemas from the registry and checks coverage in tests.
    usability_check: >-
      A coverage test lists any interface action that an agent cannot do.
  acceptance: >-
    Coverage test over the acceptance journeys: each can be driven end to end through the API.
  status: not-started
  evidence: []

- id: ai.agent-permissions
  name: Agent permissions, activity log and kill switch
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "Safety for a standing local external-agent API"
      category: "External agents"
      checked: true
  artist_can: >-
    Decide what a connected agent may do (read only, edit, render and export), see a log of what it did, and cut it
    off instantly. Venue geometry, calibration and projector output are protected unless explicitly allowed.
  projection_example: >-
    An agent may edit scenes and queue exports but cannot touch calibration, and the log shows each operation it made.
  controls:
    - { name: "Scopes (read, edit, render and export, venue and calibration)", type: "flags", animatable: false }
    - { name: "Activity log", type: "view", animatable: false }
    - { name: "Disconnect all agents", type: "action", animatable: false }
    - { name: "Rate limit", type: "int", animatable: false }
  animation: >-
    None.
  dependencies: [ai.external-agent-api, ai.bounded-edits, ai.agent-connect, map.calibration-versions, ux.operation-system]
  implementation: >-
    Scopes are checked per operation by the operation registry before any change. Venue, calibration and output
    operations need the venue scope, which is off by default. Every call is written to a local activity log (time,
    agent, operation, result). A kill switch revokes tokens and closes connections. Rate limits stop runaway loops.
  io: >-
    The log is a local file in app data, trimmed by size.
  limitations: >-
    Scopes limit what the app performs. They cannot limit what an agent does outside the app.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Settings, "Agent access": pick Read only, Edit, or Edit and export.
    defaults: >-
      Edit without venue or calibration access.
    automation: >-
      Records the log and blocks out-of-scope operations with a readable message.
    usability_check: >-
      A first-time user limits an agent to read only and the agent's edit is refused with a clear message.
  acceptance: >-
    Contract tests: out-of-scope operations are rejected and logged; the kill switch disconnects within 1 s.
  status: not-started
  evidence: []
