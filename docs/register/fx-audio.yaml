  beginner:
    action: >-
      "Wobble the sound" with Speed and Amount sliders.
    defaults: >-
      Sine, 5 Hz, light depth.
    automation: >-
      Optional "match the visual wobble" link to a wave or turbulence effect's speed.
    usability_check: >-
      A first-time user adds an audible wobble in one action and under 10 s.
  acceptance: >-
    Mini scene "wobble": export sample-matches preview after random seeks.
  status: not-started
  evidence: []

- id: fx.audio.parametric-eq
  name: Parametric EQ
  sources:
    - ref: S02
      item: Parametric EQ
      category: Audio
      adobe_support:
        gpu: false
        bpc: []
        mfr: true
      checked: true
    - ref: S35
      item: Parametric EQ effect
      category: Audio
      checked: true
  artist_can: >-
    Boost or cut up to three chosen frequency bands, shown on a response graph, to shape a sound or remove a specific unwanted tone.
  projection_example: >-
    Cut the boomy resonance a stone courtyard adds at one frequency.
  controls:
    - { name: Band 1-3 Enabled, type: bool, animatable: false }
    - { name: Band 1-3 Frequency, type: number, animatable: true }
    - { name: Band 1-3 Bandwidth, type: number, animatable: true }
    - { name: Band 1-3 Boost/Cut, type: number, animatable: true }
    - { name: Frequency response graph (drag handles), type: widget, animatable: false }
  animation: >-
    All band values keyframable.
  dependencies: [audio.track, anim.keyframe.core, fx.generate.audio-spectrum]
  implementation: >-
    Three peaking BiquadFilterNodes in series (Q derived from bandwidth). The response graph comes from getFrequencyResponse(), and the same chain renders in OfflineAudioContext.
  io: >-
    none
  limitations: >-
    Three bands only, matching AE; more bands would be a product extension.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Audio effects are After Effects parity. Stereo mixing, levels, pan, fades, analysis and export (audio.*) cover music-synced shows. Revisit if a show needs in-app sound design."
  milestone: C
  beginner:
    action: >-
      "Fix a problem frequency": play, then click "Find the boom"/"Find the whistle" to sweep and pick; graph handles are in More controls.
    defaults: >-
      All bands flat; band colours red, green and blue as in AE.
    automation: >-
      Suggests problem frequencies from long-term spectrum peaks (audio.analysis).
    usability_check: >-
      A first-time user reduces a planted 250 Hz hum in the supplied clip in under 45 s using the suggestion.
  acceptance: >-
    Mini scene "eq-notch": target band attenuated within 1 dB of setting; export sample-matches preview.
  status: not-started
  evidence: []

- id: fx.audio.reverb
  name: Reverb
  sources:
    - ref: S02
      item: Reverb
      category: Audio
      adobe_support:
        gpu: false
        bpc: []
        mfr: true
      checked: true
    - ref: S35
      item: Reverb effect
      category: Audio
      checked: true
  artist_can: >-
    Make a sound feel like it is in a room, hall or large space.
  projection_example: >-
    Make a small studio recording sound like it fills the cathedral square in front of the projection.
  controls:
    - { name: Reverb Time (ms), type: number, animatable: true }
    - { name: Diffusion, type: number, animatable: true }
    - { name: Decay, type: number, animatable: true }
    - { name: Brightness, type: number, animatable: true }
    - { name: Dry Out / Wet Out, type: number, animatable: true }
  animation: >-
    Dry/wet keyframable smoothly; changes to time, diffusion, decay or brightness switch between cached impulse responses with a short crossfade.
  dependencies: [audio.track, anim.keyframe.core]
  implementation: >-
    A ConvolverNode whose impulse response is synthesised deterministically (seeded noise shaped by pre-delay, diffusion density, exponential decay and brightness low-pass) and cached by parameter hash. Dry/wet GainNodes are added, and the identical IR and graph render offline.
  io: >-
    Reverb tails extend beyond the layer out-point and are kept in the mixdown.
  limitations: >-
    An algorithmic IR approximates rather than reproduces AE's reverb. Continuous animation of IR parameters is stepped.
  disposition: deferred
  superseded_by: null
