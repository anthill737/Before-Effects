- id: fx.audio.stereo-mixer
  name: Stereo Mixer
  sources:
    - ref: S02
      item: Stereo Mixer
      category: Audio
      adobe_support:
        gpu: false
        bpc: []
        mfr: true
      checked: true
    - ref: S35
      item: Stereo Mixer effect
      category: Audio
      checked: true
  artist_can: >-
    Set left and right levels and pan a sound from one side to the other, with phase inversion.
  projection_example: >-
    Pan a sound from the left wing of the building to the right wing as a light sweeps across.
  controls:
    - { name: Left Level / Right Level, type: number, animatable: true }
    - { name: Left Pan / Right Pan, type: number, animatable: true }
    - { name: Invert Phase, type: bool, animatable: false }
  animation: >-
    Levels and pans keyframable and expression-linkable, for example pan following a layer's x position.
  dependencies: [audio.track, anim.keyframe.core, expr.engine]
  implementation: >-
    A ChannelSplitter feeds per-channel GainNodes and per-channel StereoPannerNodes, then a ChannelMerger. Inversion uses a -1 gain, and the same graph renders offline.
  io: >-
    Stereo only; multichannel venue speaker layouts are an open question for audio.track.
  limitations: >-
    Pan law follows Web Audio's equal-power panner, which may differ slightly from AE.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Pan" and "Balance" sliders in the simple sound inspector; "Follow this layer" makes the sound follow a moving visual left to right.
    defaults: >-
      Centred, 100% levels.
    automation: >-
      "Follow this layer" writes the pan expression automatically.
    usability_check: >-
      A first-time user makes a sound move left to right with a moving light in two actions or fewer and under 20 s.
  acceptance: >-
    Mini scene "pan-follow": channel energy ratio tracks the layer's x position; export sample-matches preview.
  status: not-started
  evidence: []

- id: fx.audio.tone
  name: Tone
  sources:
    - ref: S02
      item: Tone
      category: Audio
      adobe_support:
        gpu: false
        bpc: []
        mfr: true
      checked: true
    - ref: S35
      item: Tone effect
      category: Audio
      checked: true
  artist_can: >-
    Synthesise up to five simple tones (sine, triangle, saw, square, white noise) to make beeps, hums, sirens or test tones, even on a layer with no audio.
  projection_example: >-
    Generate a test tone to check every venue speaker before the show, or a rising hum under a build-up.
  controls:
    - { name: Waveform Options (Sine / Triangle / Saw / Square / White Noise), type: enum, animatable: false }
    - { name: Frequency 1-5, type: number, animatable: true }
    - { name: Level, type: number, animatable: true }
  animation: >-
    Frequencies and level keyframable; level ramps avoid clicks as S35 advises.
  dependencies: [audio.track, anim.keyframe.core]
  implementation: >-
    Up to five OscillatorNodes, or an AudioBufferSourceNode of seeded white noise, summed into a level GainNode. The source's own audio is ignored as in AE. Oscillators start at phase 0 at the layer in-point, so offline render equals preview.
  io: >-
    none
  limitations: >-
    Simple tones only; not a synthesiser.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Audio effects are After Effects parity. Stereo mixing, levels, pan, fades, analysis and export (audio.*) cover music-synced shows. Revisit if a show needs in-app sound design."
  milestone: D
  beginner:
    action: >-
      "Add a tone" (beep, hum, siren presets) and "Speaker test tone" in the output check tools.
    defaults: >-
      One sine at 440 Hz; level capped at 100% divided by the number of active tones (S35 anti-clipping guidance).
    automation: >-
      Adds 1-frame level ramps at in and out points to prevent clicks.
    usability_check: >-
      A first-time user creates a two-second beep without a click at the end in under 20 s.
  acceptance: >-
    Mini scene "tone": no discontinuity at layer ends; export sample-matches preview.
  status: not-started
  evidence: []

- id: fx.audio.automation-link
  name: Sound effects drive visuals (audio-effect automation link)
  sources:
    - ref: brief
      item: §0.1 "Move with the beat", §13 audio-to-animation and identical preview/export analysis
      category: product requirement
      checked: true
    - ref: S35
      item: Animating audio effect properties (e.g. Cutoff Frequency)
      category: Audio
      checked: true
  artist_can: >-
    Make visuals react to the processed sound, such as only the filtered bass or the echo, and share one curve between an audio effect and a visual property so a filter sweep and a light sweep rise together.
  projection_example: >-
    During a build-up, one curve opens the music's low-pass filter while brightening the facade and speeding up the particles; windows flash only on the echoed drum hits.
  controls:
    - { name: Analyse signal (before effects / after effects / after a chosen effect), type: enum, animatable: false }
    - { name: Linked property pairs (audio parameter ↔ visual property with range mapping), type: link-list, animatable: true }
    - { name: Response smoothing (attack / release), type: number, animatable: true }
  animation: >-
    Links are expressions and shared curves; generated keyframes (audio.to-keyframes) remain editable.
  dependencies: [audio.analysis, audio.to-keyframes, audio.track, expr.engine, anim.keyframe.core, ux.recipe-engine]
  implementation: >-
    Audio effect parameters are ordinary core properties evaluated at flicks. They are scheduled to AudioParams at sample times for both the realtime and offline contexts, so any visual property can read or drive them through expr.engine. For post-effect analysis, the analysis worker renders the layer's effect chain in an OfflineAudioContext and caches FFT, onsets and bands keyed by chain hash, so preview and export read identical data.
  io: >-
    Analysis caches are collected with the project; live audio inputs must be recorded and baked before deterministic export (brief §13).
  limitations: >-
    Re-analysis is needed when an upstream effect changes; the app shows a progress badge on affected layers.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Audio effects are After Effects parity. Stereo mixing, levels, pan, fades, analysis and export (audio.*) cover music-synced shows. Revisit if a show needs in-app sound design."
  milestone: C
  beginner:
    action: >-
      "Move with the beat" recipe → "Listen to: whole track / bass / drums / echo"; "Build-up" recipe links a filter sweep to brightness.
    defaults: >-
      Analyse after effects; bass band for "Move with the beat".
    automation: >-
      Creates the analysis tap, links and smoothing; shows a live meter next to the controlled property.
    usability_check: >-
      A first-time user makes the supplied windows pulse only with the kick drum in three actions or fewer and under 60 s, and the export shows the same pulses as preview.
  acceptance: >-
    AS-1 (timed to audio) and mini scene "build-up-link": visual and filter curves identical frame by frame in preview and export.
  status: not-started
  evidence: []
