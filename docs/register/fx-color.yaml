  artist_can: >-
    Replace one picked color with another chosen color, with separate hue, lightness and saturation tolerances and a feathered match.
  projection_example: >-
    Change a sponsor banner in supplied footage from red to the client's blue for the projection.
  controls:
    - { name: "From", type: "color", animatable: true }
    - { name: "To", type: "color", animatable: true }
    - { name: "Change (Hue / Hue & Lightness / Hue & Saturation / Hue, Lightness & Saturation)", type: "enum", animatable: false }
    - { name: "Change By (Setting To Color / Transforming To Color)", type: "enum", animatable: false }
    - { name: "Tolerance (Hue / Lightness / Saturation)", type: "percent[3]", animatable: true }
    - { name: "Softness", type: "percent", animatable: true }
    - { name: "View Correction Matte", type: "bool", animatable: false }
  animation: >-
    "To" color keyframable for animated recolors, as Adobe recommends.
  dependencies: [proj.effect-stack, anim.keyframe.core, ux.recipe-engine]
  implementation: >-
    The shared color-range key kernel uses separate HLS tolerances to build a feathered matte. The pixel is then either set to the target HLS components or moved toward them by HLS interpolation, weighted by the matte. Runs per pixel in grading encoding.
  io: >-
