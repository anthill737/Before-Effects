    Both keyframable.
  dependencies: [proj.effect-stack, anim.keyframe.core, fx.color.hue-saturation]
  implementation: >-
    Per-pixel pass in grading encoding. The saturation gain is weighted by (1 − current saturation) and attenuated for hues between magenta and orange; plain saturation is applied uniformly. f32 math.
