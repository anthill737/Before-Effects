- id: fx.color.color-link
  name: Color Link
  sources:
    - ref: S02
      item: Color Link
      category: Color Correction
      adobe_support:
        gpu: false
        bpc: [8]
        mfr: true
      checked: true
    - ref: S19
      item: Color Link
      category: Color Correction
      checked: true
  artist_can: >-
    Fill a layer with a color sampled from another layer (average, median, brightest, darkest, etc.) and blend it, so graphics automatically pick up a scene's dominant color.
  projection_example: >-
    Make projected text automatically take on the average color of the video currently playing on the wall beside it.
  controls:
    - { name: "Source Layer", type: "layer", animatable: false }
    - { name: "Sample (Average / Median / Brightest / Darkest / Max RGB / Min RGB / alpha variants)", type: "enum", animatable: false }
    - { name: "Clip (%)", type: "percent", animatable: true }
    - { name: "Stencil Original Alpha", type: "bool", animatable: false }
    - { name: "Opacity", type: "percent", animatable: true }
    - { name: "Blending Mode", type: "enum", animatable: false }
  animation: >-
    The sampled color updates every frame. Opacity and clip are keyframable.
  dependencies: [proj.effect-stack, proj.layer, mask.blend-modes, preview.cache]
  implementation: >-
    A GPU reduction over the source layer at the current time produces a single color uniform: mean via a parallel sum, median and clip via the shared histogram, min/max via reduction. A solid of that color is then blended with the layer through mask.blend-modes kernels. Statistics are cached per frame, and the effect depends on another layer's render at the same time.
  io: >-
    none
  limitations: >-
    One color per frame. Rapidly changing sources make the color flicker, so an optional smoothing window (in seconds) is added, which reads neighbour-frame statistics.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail colour-correction effect or plug-in clone. Basic correction (brightness/contrast, exposure, hue/saturation, levels, curves, tint, colour balance), projection looks and per-region grading stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Match the color of…" recipe → pick a layer.
    defaults: >-
      Average sample, Clip 0 %, Opacity 100 %, mode Normal, Stencil Original Alpha on, smoothing 0.25 s.
    automation: >-
      The source layer is pre-filled with the layer directly behind the selection.
    usability_check: >-
      A novice makes a title adopt the background video's color in under 30 s.
  acceptance: >-
    Mini scene "color-link": the output color equals the reference mean of the source within 1/1023, and preview equals export.
  status: not-started
  evidence: []

- id: fx.color.color-stabilizer
  name: Color Stabilizer
  sources:
    - ref: S02
      item: Color Stabilizer
      category: Color Correction
      adobe_support:
        gpu: false
        bpc: [8, 16]
        mfr: true
      checked: true
    - ref: S19
      item: Color Stabilizer
      category: Color Correction
      checked: true
  artist_can: >-
    Remove brightness or color flicker by locking one, two or three sampled points to their values on a chosen reference frame.
  projection_example: >-
    Remove flicker from a stop-motion or time-lapse clip of the building before it is projected back onto the same facade.
  controls:
    - { name: "Set Frame (reference/pivot frame)", type: "time", animatable: false }
    - { name: "Stabilize (Brightness / Levels / Curves)", type: "enum", animatable: false }
    - { name: "Black Point / Mid Point / White Point", type: "point2d[3]", animatable: true }
    - { name: "Sample Size (radius px)", type: "float", animatable: true }
  animation: >-
    Sample points are keyframable and can be driven by track.point data to follow moving objects.
  dependencies: [proj.effect-stack, preview.cache, track.point, anim.keyframe.core]
  implementation: >-
    Reads the upstream image at the absolute reference time once; this is cached and declared as a temporal dependency on that frame. Small disc-average reductions run at the 1–3 points on both the reference and current frames. A per-channel correction (offset, two-point levels, or a three-point monotone curve baked into a 1D LUT) maps current samples to reference samples. Evaluated in grading encoding.
  io: >-
    none
  limitations: >-
    Works best when the sampled areas differ strongly in value, as Adobe notes. Moving points need tracking data. Changing the reference frame invalidates the cache.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail colour-correction effect or plug-in clone. Basic correction (brightness/contrast, exposure, hue/saturation, levels, curves, tint, colour balance), projection looks and per-region grading stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Remove flicker" recipe.
    defaults: >-
      Curves mode. The reference is the current frame, and points are auto-placed on dark, mid and bright areas.
    automation: >-
      Auto-picks sample spots with stable local variance, and offers "follow the motion", which attaches a point tracker.
    usability_check: >-
      A novice visibly reduces flicker on a supplied time-lapse in under 1 minute with no manual point placement.
  acceptance: >-
    Mini scene "deflicker": the sampled-point values stay within 1/255 of the reference across all frames, and random-access export equals sequential export.
  status: not-started
  evidence: []

- id: fx.color.colorama
  name: Colorama
  sources:
    - ref: S02
      item: Colorama
      category: Color Correction
      adobe_support:
        gpu: false
        bpc: [8, 16]
        mfr: true
      checked: true
    - ref: S19
      item: Colorama
      category: Color Correction
      checked: true
  artist_can: >-
    Convert a chosen color attribute to a phase and remap it through an editable cyclic palette. Used for subtle tints, psychedelic cycling, false-color looks and procedural mattes.
  projection_example: >-
    Run a rainbow wave across fractal-noise "water" on the facade by animating the palette phase.
  controls:
    - { name: "Get Phase From (intensity / hue / lightness / saturation / R / G / B / alpha / zero…)", type: "enum", animatable: false }
    - { name: "Add Phase (layer) / Add Phase From / Add Mode (Wrap / Clamp / Average / Screen)", type: "group", animatable: false }
    - { name: "Phase Shift", type: "angle", animatable: true }
    - { name: "Use Preset Palette", type: "enum", animatable: false }
    - { name: "Output Cycle (1–64 color/opacity stops)", type: "gradient", animatable: true }
    - { name: "Cycle Repetitions", type: "int", animatable: true }
    - { name: "Interpolate Palette", type: "bool", animatable: false }
    - { name: "Modify / Modify Alpha / Change Empty Pixels", type: "group", animatable: false }
    - { name: "Matching Color / Matching Tolerance / Matching Softness / Matching Mode", type: "group", animatable: true }
    - { name: "Mask Layer / Masking Mode", type: "group", animatable: false }
    - { name: "Composite Over Layer", type: "bool", animatable: false }
    - { name: "Blend With Original", type: "percent", animatable: true }
  animation: >-
    Phase Shift is the usual animation target. Output Cycle stops interpolate between keyframes when stop counts match; otherwise the palettes are blended in LUT space.
  dependencies: [proj.effect-stack, anim.keyframe.core, expr.engine, ux.recipe-engine]
  implementation: >-
    The phase attribute is read in grading encoding and optionally combined with a second layer's attribute (wrap/clamp/average/screen). The pass then computes fract(phase·reps + shift) and samples a 1024-entry rgba16float palette LUT built on the CPU (smooth or stepped). The selected attribute or alpha is modified, gated by the shared color-range key and an optional mask layer.
  io: >-
    Palettes can be saved and shared as styles.
  limitations: >-
    Hard palette steps alias when scaled; a smooth palette is recommended for projection.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Reached through the "Color cycle / rainbow wave" recipe, which offers palette thumbnails and a speed control.
    defaults: >-
      Hue Cycle palette, phase animated at one cycle per 8 s (or per 4 bars with music), Composite Over Layer on.
    automation: >-
      The recipe writes the Phase Shift expression and links the speed to the BPM grid when audio exists.
    usability_check: >-
      A novice applies a looping rainbow cycle to a region and changes its speed in under 45 s.
  acceptance: >-
    Mini scene "color-cycle": loops seamlessly at the loop point, and preview equals export.
  status: not-started
  evidence: []

- id: fx.color.curves
  name: Curves
  sources:
    - ref: S02
      item: Curves
      category: Color Correction
      adobe_support:
        gpu: true
        bpc: [8, 16, 32]
        mfr: true
      checked: true
    - ref: S19
      item: Curves
      category: Color Correction
      checked: true
  artist_can: >-
    Reshape the tone response of the image or of each channel with a free curve, for precise contrast, fades and color shifts.
  projection_example: >-
    Crush the shadows of a texture so unlit areas stay truly dark on the facade while midtones stay bright.
  controls:
    - { name: "Channel (RGB / Red / Green / Blue / Alpha)", type: "enum", animatable: false }
    - { name: "Curve per channel (Bezier points or pencil-drawn)", type: "curve[5]", animatable: true }
    - { name: "Auto / Smooth / Reset", type: "action", animatable: false }
    - { name: "Open / Save", type: "action", animatable: false }
  animation: >-
    Curves are keyframable. Interpolation is per control point when point counts match; otherwise the curves are blended in LUT space. Point values are expression-addressable.
  dependencies: [proj.effect-stack, anim.keyframe.core, anim.graph-editor, ux.operation-system]
  implementation: >-
    The CPU builds a monotone cubic (or pencil-sampled) curve per channel and composes master∘channel into one 4096-entry rgba16float 1D LUT texture, sampled with linear filtering in grading encoding. End slopes extrapolate above 1.0 so HDR values are preserved. The alpha curve applies to straight alpha. Auto is a one-shot operation that writes editable points from histogram statistics, so it adds no per-frame dependency.
  io: >-
    Imports and exports .acv (Photoshop curves) and .amp (arbitrary map), and can export the curve as a 1D .cube.
  limitations: >-
    AE's Auto uses an expert database; our Auto is a statistics-based approximation.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      The "More punch" and "Softer / faded look" recipes write an S-curve or a lifted-black curve; More controls shows the curve with an on-canvas "click a tone to adjust it" picker.
    defaults: >-
      Identity curves. Recipe curves have three points.
    automation: >-
      Clicking the canvas adds a point at the sampled tone, and dragging vertically on the canvas moves it.
    usability_check: >-
      A novice makes footage punchier with the preset, then darkens only the shadows by dragging one point, in under 1 minute.
  acceptance: >-
    Mini scene "grade-basics": an 11-step gray ramp matches the analytic curve within 1/1023, and an .acv round-trip is lossless.
  status: not-started
  evidence: []

- id: fx.color.equalize
  name: Equalize
  sources:
    - ref: S02
      item: Equalize
      category: Color Correction
      adobe_support:
        gpu: false
        bpc: [8]
        mfr: true
      checked: true
    - ref: S19
      item: Equalize
      category: Color Correction
      checked: true
  artist_can: >-
    Redistribute brightness (or RGB) so values spread evenly across the range, revealing detail in flat images. Only visible (non-transparent) pixels count.
  projection_example: >-
    Pull hidden texture out of a low-contrast scan of an old stone carving before projecting it at large scale.
  controls:
    - { name: "Equalize (RGB / Brightness / Photoshop Style)", type: "enum", animatable: false }
    - { name: "Amount To Equalize", type: "percent", animatable: true }
  animation: >-
    Amount keyframable. The mapping is recomputed per frame.
  dependencies: [proj.effect-stack, preview.cache, fx.color.auto-color]
  implementation: >-
    The shared GPU histogram ignores alpha=0 pixels, so masked layers equalize over the mask area. The CPU turns the cumulative distribution into a 4096-entry 1D LUT blended with identity by Amount, evaluated in grading encoding. Optional temporal smoothing of the CDF reduces flicker on video and declares a neighbour-statistics dependency.
  io: >-
    none
  limitations: >-
    Per-frame equalization flickers on video unless smoothing is on, so the card defaults smoothing on for video.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail colour-correction effect or plug-in clone. Basic correction (brightness/contrast, exposure, hue/saturation, levels, curves, tint, colour balance), projection looks and per-region grading stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Reveal hidden detail" recipe → More controls.
    defaults: >-
      Photoshop Style, 100 %, smoothing 0.5 s for video.
    automation: >-
      Smoothing is enabled automatically for video layers.
    usability_check: >-
      A novice reveals detail in a flat supplied scan in one action and reduces the strength in a second.
  acceptance: >-
    Mini scene "equalize": the output histogram CDF is within 2 % of linear at 100 %, and preview equals export.
  status: not-started
  evidence: []

- id: fx.color.exposure
  name: Exposure
  sources:
    - ref: S02
      item: Exposure
      category: Color Correction
      adobe_support:
        gpu: true
        bpc: [8, 16, 32]
        mfr: true
      checked: true
    - ref: S19
      item: Exposure
      category: Color Correction
      checked: true
  artist_can: >-
    Brighten or darken in photographic stops, with offset and gamma, for all channels or per channel. This is the right tool for HDR footage and 3D renders.
  projection_example: >-
    Pull a 3D tunnel render down by one stop so it matches the brightness of the surrounding facade content.
  controls:
    - { name: "Channels (Master / Individual)", type: "enum", animatable: false }
    - { name: "Exposure (stops)", type: "float", animatable: true }
    - { name: "Offset", type: "float", animatable: true }
    - { name: "Gamma Correction", type: "float", animatable: true }
    - { name: "Red / Green / Blue Exposure, Offset, Gamma", type: "float[9]", animatable: true }
    - { name: "Bypass Linear Light Conversion", type: "bool", animatable: false }
  animation: >-
    All values keyframable and expression-linkable, e.g. a slow fade-up in stops or exposure pumping with the beat.
  dependencies: [proj.effect-stack, anim.keyframe.core, ux.guided-workflow, ux.recipe-engine]
  implementation: >-
    Runs natively in scene-linear: out = (in·2^stops + offset)^(1/gamma), with negatives mirrored as Adobe documents. Values above 1.0 are kept (f32 math, rgba16float output). Bypass applies the same math to grading-encoded values for parity with AE's raw-value mode.
  io: >-
    none
  limitations: >-
    Brightening cannot exceed the projector's physical output; values pushed above 1.0 clip at output unless compressed (see fx.utility.hdr-highlight-compression and fx.utility.clipping-gamut-diagnostics).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      The "Brighter / darker" slider on the Color card for footage and 3D layers (labelled in plain words, with stops shown as a tooltip).
    defaults: >-
      0 stops, offset 0, gamma 1, Master.
    automation: >-
      The guided path warns when the slider pushes content into clipping and offers "Protect highlights".
    usability_check: >-
      A first-time user darkens a selected 3D render to match neighbouring content in under 20 s without opening More controls.
  acceptance: >-
    AS-2 depth illusion: the exposure-matched tunnel render shows preview/export parity within 1 code value at 10-bit, and HDR values above 1.0 survive to the next effect.
  status: not-started
  evidence: []

- id: fx.color.gamma-pedestal-gain
  name: Gamma/Pedestal/Gain
  sources:
    - ref: S02
      item: Gamma/Pedestal/Gain
      category: Color Correction
      adobe_support:
        gpu: false
        bpc: [8]
        mfr: true
      checked: true
    - ref: S19
      item: Gamma/Pedestal/Gain
      category: Color Correction
      checked: true
  artist_can: >-
    Set each channel's lowest output (pedestal), highest output (gain) and midtone curve (gamma), plus a black stretch that lifts dark areas.
  projection_example: >-
    Raise the pedestal slightly so dark content never drops into the projector's crushed-black zone.
  controls:
    - { name: "Black Stretch", type: "float", animatable: true }
    - { name: "Red / Green / Blue Gamma", type: "float[3]", animatable: true }
    - { name: "Red / Green / Blue Pedestal", type: "float[3]", animatable: true }
    - { name: "Red / Green / Blue Gain", type: "float[3]", animatable: true }
  animation: >-
    All values keyframable.
  dependencies: [proj.effect-stack, anim.keyframe.core, out.projector-output]
  implementation: >-
    Per-channel analytic curve, out = pedestal + (gain − pedestal)·in^gamma with a black-stretch toe, evaluated in grading encoding in f32. No LUT is needed.
  io: >-
    none
  limitations: >-
    This is an ARTISTIC adjustment on show content. Compensating a specific projector's black level or gamma belongs in out.projector-output, and the card says so.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail colour-correction effect or plug-in clone. Basic correction (brightness/contrast, exposure, hue/saturation, levels, curves, tint, colour balance), projection looks and per-region grading stay required."
  milestone: D
  beginner:
    action: >-
      Reached through "Fine-tune tones" → More controls → "Per color channel".
    defaults: >-
      Gamma 1, pedestal 0, gain 1, black stretch 0.
    automation: >-
      none
    usability_check: >-
      A novice lifts dark tones slightly by raising one labelled slider in under 30 s after opening More controls.
  acceptance: >-
    Mini scene "grade-basics": a gray ramp matches the analytic curve within 1/1023.
  status: not-started
  evidence: []

