# Color Correction — Before Effects capability register
# Sources: S02 effect list + support matrix (helpx, "last updated May 13, 2026", fetched 2026-10-01); S19 Color Correction effects (updated 27 Jun 2025, fetched 2026-10-01); S26 OpenColorIO and ACES (fetched 2026-10-01); S01 Cycore plugins page (CC effects); brief §0, §11I, §14, §15, §16.
#
# Conventions used in `implementation` below (proposals against docs/register/SCHEMA.md architecture context):
#   - Working buffers are rgba16float, scene-linear, premultiplied. Every color op unpremultiplies, works in f32, and re-premultiplies.
#   - "Scene-linear" ops (exposure, gains, filters, channel mixing) run directly on working values, because they model light and keep HDR values intact.
#   - "Grading encoding" is a display-referred encoding of the working primaries used by perceptually tuned controls (curves, levels, hue/sat, tints).
#     Default: extended sRGB transfer (values above 1.0 extend smoothly, never clip). ACES projects use ACEScct. The in/out conversion is fused into the pass.
#   - "Auto"/statistics effects share one GPU histogram reduction (workgroup-local atomic<u32> bins merged globally; integer bins => deterministic across
#     preview, export and parallel workers). Per-frame statistics are cached in preview.cache keyed by the upstream hash. Temporal smoothing averages
#     statistics, not pixels, so the effect declares a dependency on neighbour frames' statistics.
#   - Everything here is the show's ARTISTIC grade. Per-projector output correction (gamma/color matching, black level) lives in out.projector-output and is never applied here.

- id: fx.color.auto-color
  name: Auto Color
  sources:
    - ref: S02
      item: Auto Color
      category: Color Correction
      adobe_support:
        gpu: false
        bpc: [8, 16]
        mfr: true
      checked: true
    - ref: S19
      item: Auto Color
      category: Color Correction
      checked: true
  artist_can: >-
    Automatically fix contrast and remove a color cast by mapping the darkest and lightest pixels to black and white and neutralizing near-gray midtones, optionally smoothed over time.
  projection_example: >-
    Clean up a slightly green, flickering phone video of the venue before using it as content or as a reference plate.
  controls:
    - { name: "Temporal Smoothing (seconds)", type: "float", animatable: false }
    - { name: "Scene Detect", type: "bool", animatable: false }
    - { name: "Black Clip / White Clip", type: "percent", animatable: true }
    - { name: "Snap Neutral Midtones", type: "bool", animatable: false }
    - { name: "Blend With Original", type: "percent", animatable: true }
  animation: >-
    Clip and blend values are keyframable and expression-linkable. The correction itself is recomputed per frame from image statistics.
  dependencies: [proj.effect-stack, preview.cache, anim.keyframe.core, ux.operation-system]
  implementation: >-
    Runs a GPU histogram reduction (1024 bins per channel) in grading encoding. Prefix sums give clipped black/white points per channel, and the mean of near-neutral pixels gives the midtone gamma; the result is applied as a per-channel levels pass. Temporal Smoothing averages the cached per-frame statistics over ±N s (Scene Detect cuts the window when the histogram distance exceeds a threshold), so the effect declares a temporal dependency on neighbour-frame statistics.
  io: >-
    none
  limitations: >-
    Adobe's exact heuristics are not reproduced. Statistics cover the whole layer unless region-scoped. A cold statistics cache slows the first random-access seek, because neighbour frames must be rendered upstream first.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail colour-correction effect or plug-in clone. Basic correction (brightness/contrast, exposure, hue/saturation, levels, curves, tint, colour balance), projection looks and per-region grading stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Fix footage color automatically" quick fix on a selected video layer → More controls.
    defaults: >-
      Clip 0.1 %, Snap Neutral Midtones on, Temporal Smoothing 0.5 s with Scene Detect on for video and 0 for stills.
    automation: >-
      Chooses smoothing from the layer type. Offers "Freeze this fix", which bakes the current result into editable Levels values.
    usability_check: >-
      A first-time user removes a visible color cast from a supplied clip in two actions (select, "Fix color") within 30 s and rates it improved in a side-by-side view.
  acceptance: >-
    Mini scene "auto-fix-flicker": a supplied cast/flicker clip shows reduced frame-to-frame mean-channel variance, and preview and export statistics match exactly.
  status: not-started
  evidence: []

- id: fx.color.auto-contrast
  name: Auto Contrast
  sources:
    - ref: S02
      item: Auto Contrast
      category: Color Correction
      adobe_support:
        gpu: false
        bpc: [8, 16]
        mfr: true
      checked: true
    - ref: S19
      item: Auto Contrast
      category: Color Correction
      checked: true
  artist_can: >-
    Automatically stretch overall contrast without changing color balance, because all channels share one black and white point.
  projection_example: >-
    Give flat archival footage, projected onto a pale wall, enough contrast to read from across the street.
  controls:
    - { name: "Temporal Smoothing (seconds)", type: "float", animatable: false }
    - { name: "Scene Detect", type: "bool", animatable: false }
    - { name: "Black Clip / White Clip", type: "percent", animatable: true }
    - { name: "Blend With Original", type: "percent", animatable: true }
  animation: >-
    Clip and blend values keyframable; correction recomputed per frame from statistics.
  dependencies: [proj.effect-stack, preview.cache, anim.keyframe.core, fx.color.auto-color]
  implementation: >-
    Uses the same statistics pipeline as fx.color.auto-color, but on a single combined (max-RGB/luma) histogram, so one linear stretch is applied to all channels and no cast is introduced or removed. The stretch is evaluated in grading encoding, and the same temporal-statistics dependency applies.
  io: >-
    none
  limitations: >-
    Same whole-frame and seek-latency caveats as Auto Color.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail colour-correction effect or plug-in clone. Basic correction (brightness/contrast, exposure, hue/saturation, levels, curves, tint, colour balance), projection looks and per-region grading stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Fix footage color automatically" quick fix → "Contrast only" option.
    defaults: >-
      Clip 0.1 %, smoothing 0.5 s for video.
    automation: >-
      Auto-selected instead of Auto Color when the layer is grayscale or has an intentional color look.
    usability_check: >-
      A novice increases the contrast of a flat supplied clip with one action in under 20 s and can undo it in one action.
  acceptance: >-
    Mini scene "auto-fix-flicker": output black/white points land at the requested clip percentiles within 1 histogram bin.
  status: not-started
  evidence: []

- id: fx.color.auto-levels
  name: Auto Levels
  sources:
    - ref: S02
      item: Auto Levels
      category: Color Correction
      adobe_support:
        gpu: false
        bpc: [8, 16]
        mfr: true
      checked: true
    - ref: S19
      item: Auto Levels
      category: Color Correction
      checked: true
  artist_can: >-
    Automatically stretch each color channel to full range independently, which can remove (or introduce) color casts and reduce exposure flicker.
  projection_example: >-
    Normalize a batch of found-footage clips that will play in sequence across the facade so none look muddy.
  controls:
    - { name: "Temporal Smoothing (seconds)", type: "float", animatable: false }
    - { name: "Scene Detect", type: "bool", animatable: false }
    - { name: "Black Clip / White Clip", type: "percent", animatable: true }
    - { name: "Blend With Original", type: "percent", animatable: true }
  animation: >-
    Clip and blend values keyframable; correction recomputed per frame from statistics.
  dependencies: [proj.effect-stack, preview.cache, anim.keyframe.core, fx.color.auto-color]
  implementation: >-
    Uses the shared histogram reduction with independent per-channel percentiles feeding a per-channel levels pass in grading encoding. The temporal-statistics dependency is the same as in Auto Color.
  io: >-
    none
  limitations: >-
    Can introduce a color cast on images dominated by one hue (e.g. a red-lit stage). The preview flags this when the channel stretches differ strongly.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail colour-correction effect or plug-in clone. Basic correction (brightness/contrast, exposure, hue/saturation, levels, curves, tint, colour balance), projection looks and per-region grading stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Fix footage color automatically" quick fix → "Stronger (per color)" option.
    defaults: >-
      Clip 0.1 %, smoothing 0.5 s for video.
    automation: >-
      Warns when the per-channel stretch would create a strong cast and suggests Auto Contrast instead.
    usability_check: >-
      A novice reduces exposure flicker on a supplied time-lapse in two actions in under 30 s.
  acceptance: >-
    Mini scene "auto-fix-flicker": per-channel percentiles map to 0/1 within 1 bin, and frame-to-frame mean variance is reduced.
  status: not-started
  evidence: []

- id: fx.color.black-white
  name: Black & White
  sources:
    - ref: S02
      item: Black & White
      category: Color Correction
      adobe_support:
        gpu: false
        bpc: [8, 16]
        mfr: true
      checked: true
    - ref: S19
      item: Black & White
      category: Color Correction
      checked: true
  artist_can: >-
    Convert to grayscale while choosing how light or dark each original color family becomes, with an optional single-color tint.
  projection_example: >-
    Turn a colorful archive photo of the building into a moody monochrome where the red brick reads light and the blue sky dark.
  controls:
    - { name: "Reds / Yellows / Greens / Cyans / Blues / Magentas", type: "percent[6]", animatable: true }
    - { name: "Tint", type: "bool", animatable: false }
    - { name: "Tint Color", type: "color", animatable: true }
  animation: >-
    All six weights and the tint color keyframable, so a scene can fade from color into a graded monochrome look.
  dependencies: [proj.effect-stack, anim.keyframe.core, ux.recipe-engine]
  implementation: >-
    Per-pixel WGSL pass in grading encoding. Gray is computed by the Photoshop-style min/mid/max channel decomposition weighted by the hue-sector weights; the tint is applied by colorizing at preserved lightness. No bounds expansion or temporal dependency.
  io: >-
    none
  limitations: >-
    Matches Photoshop's behaviour visually, not bit-exactly.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Make it black & white" — one action on the selection; the weights appear as "Color brightness" sliders under More controls.
    defaults: >-
      Photoshop default weights (Reds 40, Yellows 60, Greens 40, Cyans 60, Blues 20, Magentas 80), tint off.
    automation: >-
      Offers a "Sepia / cool / warm" tint swatch row that sets Tint and Tint Color.
    usability_check: >-
      A first-time user turns a selected layer black & white and makes its reds lighter in under 30 s without reading help.
  acceptance: >-
    Mini scene "grade-basics": golden-image match against a float reference within 1/1023 per channel in preview and export.
  status: not-started
  evidence: []

- id: fx.color.brightness-contrast
  name: Brightness & Contrast
  sources:
    - ref: S02
      item: Brightness & Contrast
      category: Color Correction
      adobe_support:
        gpu: true
        bpc: [8, 16, 32]
        mfr: true
      checked: true
    - ref: S19
      item: Brightness & Contrast
      category: Color Correction
      checked: true
  artist_can: >-
    Make the whole layer brighter or darker and add or reduce contrast in one simple step.
  projection_example: >-
    Add punch to a texture so it still reads on a stone facade washed by street lighting.
  controls:
    - { name: "Brightness", type: "float", animatable: true }
    - { name: "Contrast", type: "float", animatable: true }
    - { name: "Use Legacy", type: "bool", animatable: false }
  animation: >-
    Both sliders keyframable and expression-linkable (e.g. contrast pulsing with audio.to-keyframes data).
  dependencies: [proj.effect-stack, anim.keyframe.core, ux.recipe-engine, ux.guided-workflow]
  implementation: >-
    Per-pixel pass in grading encoding. Modern mode uses a CPU-built tone curve (midpoint-pivot contrast plus brightness lift that protects black and white), uploaded as a 4096-entry r16float 1D LUT texture and extrapolated linearly above 1.0. Legacy mode is a plain linear offset and scale.
  io: >-
    none
  limitations: >-
    Gives coarse global control only. Tonal targeting needs Curves, Levels or Lumetri.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "More punch" and "Brighter / darker" sliders on the Color card of any selected layer or region.
    defaults: >-
      Both 0. The modern (non-legacy) curve is used.
    automation: >-
      Recipes that add content to dark surfaces start with a small brightness lift suggested from the region's measured surface tone, where calibration data provides one.
    usability_check: >-
      A first-time user makes a selected layer punchier and brighter in under 20 s without opening More controls.
  acceptance: >-
    Guided-path mini scene "first-surface": the adjustment survives save/reopen, and the export matches the preview within 1 code value at 10-bit.
  status: not-started
  evidence: []

- id: fx.color.broadcast-colors
  name: Broadcast Colors
  sources:
    - ref: S02
      item: Broadcast Colors
      category: Color Correction
      adobe_support:
        gpu: false
        bpc: [8]
        mfr: true
      checked: true
    - ref: S19
      item: Broadcast Colors
      category: Color Correction
      checked: true
  artist_can: >-
    Keep composite NTSC/PAL signal amplitude under an IRE limit by reducing luminance or saturation of unsafe pixels, or key out safe/unsafe areas to see them.
  projection_example: >-
    A broadcast TV segment about the show needs a broadcast-safe version of the projected content.
  controls:
    - { name: "Broadcast Locale (NTSC / PAL)", type: "enum", animatable: false }
    - { name: "How To Make Color Safe (Reduce Luminance / Reduce Saturation / Key Out Unsafe / Key Out Safe)", type: "enum", animatable: false }
    - { name: "Maximum Signal Amplitude (IRE)", type: "float", animatable: true }
  animation: >-
    IRE limit keyframable (rarely needed).
  dependencies: [proj.effect-stack, fx.color.video-limiter, render.encode]
  implementation: >-
    If retained, a per-pixel pass computes composite amplitude (Y ± chroma magnitude in Rec.601 YIQ/YUV) on display-encoded values. Unsafe pixels are scaled toward black or toward gray of equal luma, and the key modes write alpha.
  io: >-
    none
  limitations: >-
    Decision 2026-10-02: kept for After Effects import fidelity, implemented as a luminance/saturation limiter. Hidden from the beginner library.

    OPEN QUESTION: does any deliverable of this projection product need NTSC/PAL composite-amplitude limiting? Projectors are driven by digital RGB, and a broadcast or streaming recap is better served by fx.color.video-limiter plus correct export range metadata (render.encode). If the answer is no, this becomes superseded by fx.color.video-limiter.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail colour-correction effect or plug-in clone. Basic correction (brightness/contrast, exposure, hue/saturation, levels, curves, tint, colour balance), projection looks and per-region grading stay required."
  milestone: F
  beginner:
    action: >-
      Not shown in guided tools. If retained, it is reached through Export → advanced → "Make it broadcast-safe".
    defaults: >-
      NTSC, Reduce Luminance, 110 IRE (Adobe defaults).
    automation: >-
      If retained, it is applied automatically on a broadcast export preset only.
    usability_check: >-
      If retained: a novice produces a broadcast-safe review export by choosing one preset, with no effect added to the show.
  acceptance: >-
    Pending resolution; if kept, mini scene "broadcast-safe": no output pixel exceeds the IRE limit.
  status: not-started
  evidence: []

- id: fx.color.cc-color-neutralizer
  name: CC Color Neutralizer
  sources:
    - ref: S02
      item: CC Color Neutralizer
      category: Color Correction
      adobe_support:
        gpu: false
        bpc: [8, 16, 32]
        mfr: true
      checked: true
    - ref: S19
      item: CC Color Neutralizer
      category: Color Correction
      checked: true
    - ref: S01
      item: CC Color Neutralizer (Cycore plugins page)
      category: Color Correction
      checked: true
  artist_can: >-
    Remove color casts separately in shadows, midtones and highlights by picking what should be neutral in each range.
  projection_example: >-
    Fix footage of the venue shot at dusk, with blue shadows and orange sodium-lit highlights, so it can serve as a neutral backdrop plate.
  controls:
    - { name: "Shadows / Midtones / Highlights Unbalance", type: "color[3]", animatable: true }
    - { name: "Pinning", type: "float", animatable: true }
    - { name: "Blend With Original", type: "percent", animatable: true }
    - { name: "Special (skin tone / darks / midtones / lights balance)", type: "group", animatable: true }
  animation: >-
    Unbalance colors keyframable to follow lighting changes across a shot.
  dependencies: [proj.effect-stack, anim.keyframe.core, fx.color.color-balance]
  implementation: >-
    Per-pixel pass in grading encoding. Each picked "unbalanced" color yields a per-channel correction for its tonal zone. The zones are smooth luminance partitions (shared with fx.color.color-balance), and Pinning controls how strongly black and white are held.
  io: >-
    none
  limitations: >-
    Controls are listed from Cycore's documentation and general knowledge; Adobe's pages only summarize the effect. Behaviour is matched functionally, not bit-exactly.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail colour-correction effect or plug-in clone. Basic correction (brightness/contrast, exposure, hue/saturation, levels, curves, tint, colour balance), projection looks and per-region grading stay required."
  milestone: D
  beginner:
    action: >-
      Reached through "Remove color cast" → "Pick something that should be gray or white" (eyedropper on canvas).
    defaults: >-
      All unbalance colors neutral gray, Pinning mid, blend 0 %.
    automation: >-
      A canvas click samples a 5×5 average and writes it into the matching tonal zone based on its luminance.
    usability_check: >-
      A novice neutralizes a blue cast by clicking a white wall area in under 20 s.
  acceptance: >-
    Mini scene "cast-removal": sampled neutral patches end within ΔE2000 < 2 of gray after correction.
  status: not-started
  evidence: []

- id: fx.color.cc-color-offset
  name: CC Color Offset
  sources:
    - ref: S02
      item: CC Color Offset
      category: Color Correction
      adobe_support:
        gpu: false
        bpc: [8, 16]
        mfr: true
      checked: true
    - ref: S19
      item: CC Color Offset
      category: Color Correction
      checked: true
    - ref: S01
      item: CC Color Offset (Cycore plugins page)
      category: Color Correction
      checked: true
  artist_can: >-
    Rotate each color channel's values around a cycle (phase) to get psychedelic color shifts, solarized or polarized looks.
  projection_example: >-
    Make projected stained-glass patterns cycle through shifting colors in time with the music.
  controls:
    - { name: "Red Phase / Green Phase / Blue Phase", type: "angle[3]", animatable: true }
    - { name: "Overflow (Wrap / Solarize / Polarize)", type: "enum", animatable: false }
  animation: >-
    Phases are keyframable and are commonly driven by time or audio expressions for continuous cycling.
  dependencies: [proj.effect-stack, anim.keyframe.core, expr.engine, audio.to-keyframes]
  implementation: >-
    Per-pixel pass on grading-encoded values clamped to 0–1, using v' = fract(v + phase/360) for Wrap and triangle/abs folds for Solarize and Polarize. Over-range HDR values are clamped first, and this is stated in the effect's color-space declaration.
  io: >-
    none
  limitations: >-
    Intentionally discontinuous, so high-contrast hard edges in the cycle can alias when scaled. Exact Cycore overflow curves are matched visually.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail colour-correction effect or plug-in clone. Basic correction (brightness/contrast, exposure, hue/saturation, levels, curves, tint, colour balance), projection looks and per-region grading stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Psychedelic color cycle" recipe → More controls.
    defaults: >-
      Phases 0/120/240° with Wrap, animated by the recipe at one cycle per 4 bars when music is present.
    automation: >-
      The recipe links phase speed to the show BPM grid.
    usability_check: >-
      A novice applies a cycling color look to a region and changes its speed in under 45 s.
  acceptance: >-
    Mini scene "color-cycle": phase animation loops seamlessly, and the exported frame at t equals the preview frame at t.
  status: not-started
  evidence: []

- id: fx.color.cc-kernel
  name: CC Kernel
  sources:
    - ref: S02
      item: CC Kernel
      category: Color Correction
      adobe_support:
        gpu: false
        bpc: [8, 16, 32]
        mfr: true
      checked: true
    - ref: S19
      item: CC Kernel
      category: Color Correction
      checked: true
    - ref: S01
      item: CC Kernel (Cycore plugins page)
      category: Color Correction
      checked: true
  artist_can: >-
    Apply a custom 3×3 convolution to make emboss, edge, sharpen or soften looks.
  projection_example: >-
    Emboss a brick texture so the projected mortar lines read as raised relief.
  controls:
    - { name: "Kernel weights (3×3)", type: "float[9]", animatable: true }
    - { name: "Divisor / normalize", type: "float", animatable: true }
    - { name: "Absolute Value", type: "bool", animatable: false }
    - { name: "Blend With Original", type: "percent", animatable: true }
  animation: >-
    Every weight keyframable, so the effect can morph between kernels.
  dependencies: [proj.effect-stack, anim.keyframe.core]
  implementation: >-
    WGSL 3×3 neighbourhood pass that declares a 1-pixel bounds expansion and uses clamp-to-edge sampling. It runs by default on premultiplied scene-linear values (correct for blur-like kernels), with a "perceptual" option that runs in grading encoding for emboss and edge looks.
  io: >-
    none
  limitations: >-
    Kernel size is fixed at 3×3, so it is resolution-dependent: the look changes when proxy resolution changes. Preview at reduced resolution scales the result approximately, and this is flagged. Exact Cycore controls are matched from general knowledge.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail colour-correction effect or plug-in clone. Basic correction (brightness/contrast, exposure, hue/saturation, levels, curves, tint, colour balance), projection looks and per-region grading stay required."
  milestone: D
  beginner:
    action: >-
      Advanced only. Reached through the "Emboss / edge look" recipe → More controls → "Custom 3×3 filter", which offers a preset menu.
    defaults: >-
      Identity kernel; presets for emboss, edge, sharpen and soften.
    automation: >-
      Normalizes the divisor automatically so that brightness is preserved unless the user overrides it.
    usability_check: >-
      A novice picks the "Emboss" kernel preset and adjusts its strength in under 30 s.
  acceptance: >-
    Mini scene "kernel": golden-image match for each preset at full resolution.
  status: not-started
  evidence: []

- id: fx.color.cc-toner
  name: CC Toner
  sources:
    - ref: S02
      item: CC Toner
      category: Color Correction
      adobe_support:
        gpu: false
        bpc: [8, 16, 32]
        mfr: true
      checked: true
    - ref: S19
      item: CC Toner
      category: Color Correction
      checked: true
    - ref: S01
      item: CC Toner (Cycore plugins page)
      category: Color Correction
      checked: true
  artist_can: >-
    Map the image's brightness onto a palette of 1, 2, 3 or 5 tones (solid, duotone, tritone, pentone).
  projection_example: >-
    Recolor all show content to the festival's brand palette so every scene on the facade feels consistent.
  controls:
    - { name: "Tones (Solid / Duotone / Tritone / Pentone)", type: "enum", animatable: false }
    - { name: "Highlights / Brights / Midtones / Darktones / Shadows", type: "color[5]", animatable: true }
    - { name: "Blend With Original", type: "percent", animatable: true }
  animation: >-
    Tone colors keyframable, so palettes can morph over time.
  dependencies: [proj.effect-stack, anim.keyframe.core, fx.color.tint]
  implementation: >-
    Uses the shared gradient-map kernel. Luminance in grading encoding indexes a 1024-entry rgba16float 1D LUT built on the CPU, with tone stops interpolated in OKLab to avoid muddy midpoints, and the result is mixed with the original. Tint and Tritone use the same kernel.
  io: >-
    Palettes can be saved and shared as reusable styles.
  limitations: >-
    Matches Cycore visually, not bit-exactly.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail colour-correction effect or plug-in clone. Basic correction (brightness/contrast, exposure, hue/saturation, levels, curves, tint, colour balance), projection looks and per-region grading stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Duotone / tritone look" recipe → "More tones".
    defaults: >-
      Tritone with a warm-highlight / neutral / deep-blue-shadow palette.
    automation: >-
      "Use show palette" fills the tones from the project's saved brand colors.
    usability_check: >-
      A novice applies a five-tone brand palette to a clip in under 45 s.
  acceptance: >-
    Mini scene "palette-map": gray ramp input reproduces the palette stops at their luminance positions within 1/1023.
  status: not-started
  evidence: []

