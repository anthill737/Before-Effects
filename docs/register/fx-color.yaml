        gpu: false
        bpc: [8, 16]
        mfr: true
      checked: true
    - ref: S19
      item: Selective Color
      category: Color Correction
      checked: true
  artist_can: >-
    Adjust the cyan/magenta/yellow/black content of one color family (reds, greens, neutrals, blacks…) without affecting the others.
  projection_example: >-
    Make the greens in a projected forest more yellow while leaving skin tones and sky untouched.
  controls:
    - { name: "Method (Relative / Absolute)", type: "enum", animatable: false }
    - { name: "Colors (Reds / Yellows / Greens / Cyans / Blues / Magentas / Whites / Neutrals / Blacks)", type: "enum", animatable: false }
    - { name: "Cyan / Magenta / Yellow / Black (per color; Details group shows all 36)", type: "percent[36]", animatable: true }
  animation: >-
    All 36 values keyframable.
  dependencies: [proj.effect-stack, anim.keyframe.core]
  implementation: >-
    Photoshop-compatible selective color per pixel in grading encoding. Membership in each color family comes from the max/mid/min channel decomposition (whites, neutrals and blacks from the extremes), CMYK percent adjustments are applied in relative or absolute mode, and all 36 values are uniforms.
  io: >-
    Preserves fidelity with Photoshop Selective Color adjustment layers on PSD import when such import exists.
  limitations: >-
    Matched visually to Photoshop, not bit-exact. CMYK terms are unfamiliar to novices, so the card describes them as "less red / more green" equivalents.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail colour-correction effect or plug-in clone. Basic correction (brightness/contrast, exposure, hue/saturation, levels, curves, tint, colour balance), projection looks and per-region grading stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Adjust one color family" recipe (e.g. "Greens → more yellow") → More controls.
    defaults: >-
