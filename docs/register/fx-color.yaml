- id: fx.color.levels
  name: Levels
  sources:
    - ref: S02
      item: Levels
      category: Color Correction
      adobe_support:
        gpu: true
        bpc: [8, 16, 32]
        mfr: true
      checked: true
    - ref: S19
      item: Levels
      category: Color Correction
      checked: true
  artist_can: >-
    Set black point, white point and midtone gamma for the image, each channel, or alpha (to firm up or soften a matte), with a live histogram.
  projection_example: >-
    Fix washed-out drone footage of the venue, and tighten a keyed performer's matte.
  controls:
    - { name: "Channel (RGB / Red / Green / Blue / Alpha)", type: "enum", animatable: false }
    - { name: "Histogram", type: "display", animatable: false }
    - { name: "Input Black / Input White", type: "float", animatable: true }
    - { name: "Gamma", type: "float", animatable: true }
    - { name: "Output Black / Output White", type: "float", animatable: true }
    - { name: "Clip To Output Black / Clip To Output White", type: "bool", animatable: false }
  animation: >-
    Every channel's five values are stored as separate keyframable, expression-linkable properties (this is what makes Levels (Individual Controls) redundant here).
  dependencies: [proj.effect-stack, anim.keyframe.core, ux.operation-system]
  implementation: >-
    Analytic per-channel remap, ((x − inB)/(inW − inB))^(1/γ)·(outW − outB) + outB, evaluated in f32 in grading encoding. With clipping off, values extend beyond the output range. Alpha mode operates on straight alpha. The histogram is a UI-only readback of the shared GPU histogram and is not a render dependency.
  io: >-
    none
  limitations: >-
    none beyond those of a global tonal tool.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Reached through the "Fix washed-out footage" quick fix (black and white eyedroppers) and the "Firm up the cut-out" matte fix (alpha mode).
    defaults: >-
      Identity (0, 1, 1.0, 0, 1). Clipping on.
    automation: >-
      "Auto set black & white" is a one-shot operation that writes points from 0.1 % histogram percentiles.
    usability_check: >-
      A novice fixes a washed-out clip using the two eyedroppers in under 30 s.
  acceptance: >-
    AS-4 performer composite: alpha Levels removes semi-transparent noise without edge fringes. Gray ramp matches the analytic curve within 1/1023.
  status: not-started
  evidence: []

