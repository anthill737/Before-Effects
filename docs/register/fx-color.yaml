- id: fx.color.channel-mixer
  name: Channel Mixer
  sources:
    - ref: S02
      item: Channel Mixer
      category: Color Correction
      adobe_support:
        gpu: false
        bpc: [8, 16, 32]
        mfr: true
      checked: true
    - ref: S19
      item: Channel Mixer
      category: Color Correction
      checked: true
  artist_can: >-
    Rebuild each output color channel as a mix of the input channels plus a constant, for custom monochrome, sepia, channel swaps or color-ID mattes.
  projection_example: >-
    Pull a clean matte for each colored region in an RGBCMY ID pass rendered from the venue model.
  controls:
    - { name: "Red-Red / Red-Green / Red-Blue / Red-Const", type: "percent[4]", animatable: true }
    - { name: "Green-Red / Green-Green / Green-Blue / Green-Const", type: "percent[4]", animatable: true }
    - { name: "Blue-Red / Blue-Green / Blue-Blue / Blue-Const", type: "percent[4]", animatable: true }
    - { name: "Monochrome", type: "bool", animatable: false }
    - { name: "Apply in (Linear / Display)", type: "enum", animatable: false }
  animation: >-
    All 12 coefficients keyframable and expression-linkable.
  dependencies: [proj.effect-stack, anim.keyframe.core, pass.object-id]
  implementation: >-
    A 3×4 affine matrix applied per pixel in f32. The default is scene-linear, because mixing light is physically linear and keeps HDR values. A Display option evaluates in grading encoding for parity with AE's working-space behaviour.
  io: >-
    none
  limitations: >-
    Linear and display modes give visibly different monochrome mixes. The mode is shown on the card to avoid surprise.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail colour-correction effect or plug-in clone. Basic correction (brightness/contrast, exposure, hue/saturation, levels, curves, tint, colour balance), projection looks and per-region grading stay required."
  milestone: C
  beginner:
    action: >-
      Reached through "Make it black & white" → More controls → "Custom mix", and through the "Swap colors" recipe.
    defaults: >-
      Identity matrix, Linear mode.
    automation: >-
      The "Matte from color ID" helper (pass.object-id) writes the coefficients needed to isolate a picked ID color.
    usability_check: >-
      A novice swaps red and blue on a layer with the "Swap colors" recipe in one action.
  acceptance: >-
    Mini scene "id-matte": an RGBCMY ID frame produces six mattes with no cross-talk above 1/1023.
  status: not-started
  evidence: []

- id: fx.color.color-balance
  name: Color Balance
  sources:
    - ref: S02
      item: Color Balance
      category: Color Correction
      adobe_support:
        gpu: false
        bpc: [8, 16]
        mfr: true
      checked: true
    - ref: S19
      item: Color Balance
      category: Color Correction
      checked: true
  artist_can: >-
    Push red/green/blue balance separately in shadows, midtones and highlights, optionally preserving brightness. This is the classic way to "tint the shadows teal, highlights orange".
  projection_example: >-
    Give the whole show a cinematic split-tone so cool shadows sit naturally on the night-time facade.
  controls:
    - { name: "Shadow Red / Green / Blue Balance", type: "float[3]", animatable: true }
    - { name: "Midtone Red / Green / Blue Balance", type: "float[3]", animatable: true }
    - { name: "Highlight Red / Green / Blue Balance", type: "float[3]", animatable: true }
    - { name: "Preserve Luminosity", type: "bool", animatable: false }
  animation: >-
    All nine balances keyframable.
  dependencies: [proj.effect-stack, anim.keyframe.core, ux.recipe-engine]
  implementation: >-
    Per-pixel pass in grading encoding. Smooth tonal-zone weights computed from luma scale the per-zone RGB offsets, and Preserve Luminosity rescales the result to the original luma. The zone functions are shared with CC Color Neutralizer and Lumetri wheels.
  io: >-
    none
  limitations: >-
    Zone weights approximate Photoshop's and are not bit-exact.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Reached through the "Tint shadows and highlights" recipe (e.g. "Teal & orange", "Moonlight") → More controls.
    defaults: >-
      All balances 0, Preserve Luminosity on.
    automation: >-
      Recipe presets write the nine values. A single "Strength" slider scales them together.
    usability_check: >-
      A novice applies "Teal & orange" and halves its strength in under 30 s.
  acceptance: >-
    Mini scene "grade-basics": a gray ramp shows the offsets only in the intended zones, and luma is preserved within 1/1023 when the option is on.
  status: not-started
  evidence: []

