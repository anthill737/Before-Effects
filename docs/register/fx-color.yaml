- id: fx.color.ocio-cdl-transform
  name: OCIO CDL Transform
  sources:
    - ref: S02
      item: OCIO CDL Transform (not listed in the support matrix)
      category: Color Correction
      adobe_support:
        gpu: null
        bpc: []
        mfr: null
      checked: false
    - ref: S19
      item: OCIO CDL Transform
      category: Color Correction
      checked: true
    - ref: S26
      item: OCIO CDL Transform
      category: Layer effects for applying OpenColorIO
      checked: true
  artist_can: >-
    Apply an ASC CDL grade (slope, offset, power, saturation) from a .cdl/.cc/.ccc file, choose a correction from a collection by ID, or invert it.
  projection_example: >-
    Apply the on-set colorist's CDL to a performer plate so it matches the grade used in the show's filmed segments.
  controls:
    - { name: "CDL file (.cdl / .cc / .ccc)", type: "file", animatable: false }
    - { name: "CCCID", type: "enum", animatable: false }
    - { name: "Inverse Transform", type: "bool", animatable: false }
    - { name: "Slope / Offset / Power (RGB)", type: "float[9]", animatable: true }
    - { name: "Saturation", type: "float", animatable: true }
    - { name: "Style (ASC clamp / no-clamp)", type: "enum", animatable: false }
  animation: >-
    The file values load into slope/offset/power/saturation properties, which are editable and keyframable; this is beyond AE's file-only effect.
  dependencies: [color.management, proj.effect-stack, anim.keyframe.core]
  implementation: >-
    Analytic WGSL, with no baking needed: out = (in·slope + offset)^power, then saturation using Rec.709 luma weights, with an analytic inverse. The ASC v1.2 clamp style or OCIO no-clamp style is selectable for scene-linear use. CDL XML is parsed in TypeScript, and the OCIO sidecar is used only in tests for parity.
  io: >-
    Imports and exports .cdl/.cc/.ccc, preserving CCC IDs.
  limitations: >-
    Not listed in the S02 support matrix (checked 2026-10-01). A CDL is only correct in the color space it was authored in; the card shows the expected space and offers a CST sandwich.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail colour-correction effect or plug-in clone. Basic correction (brightness/contrast, exposure, hue/saturation, levels, curves, tint, colour balance), projection looks and per-region grading stay required."
  milestone: D
  beginner:
    action: >-
      Reached through "Use a grade from a colorist (CDL)" — drop the file and the values appear as editable sliders.
    defaults: >-
      Identity CDL, first CCCID, ASC style.
    automation: >-
      Auto-selects the CCC ID whose name matches the clip's file name or reel.
    usability_check: >-
      A novice applies a supplied .ccc to the matching clip by drag-and-drop in one action.
  acceptance: >-
    Mini scene "ocio-roundtrip": analytic CDL matches OCIO CPU within 1e-5, and the round-trip export of a .cc file is lossless.
  status: not-started
  evidence: []

- id: fx.color.grade-per-region
  name: Grade per region
  sources:
    - ref: brief §11I
      item: Color and channels; artistic grade separate from projector output correction
      category: Effect library
      checked: true
    - ref: brief §15
      item: Named regions (windows, rooflines, columns, walls, doors)
      category: Projection design
      checked: true
  artist_can: >-
    Apply a different grade to each named region of the venue (windows, walls, columns) from one layer or adjustment layer, using the venue's region masks instead of hand-drawn masks.
  projection_example: >-
    Make all windows warm amber while the surrounding brick stays cool and slightly darker, from a single adjustment layer.
  controls:
    - { name: "Target regions (region roles, multi-select)", type: "region-set", animatable: false }
    - { name: "Invert (everything except)", type: "bool", animatable: false }
    - { name: "Edge feather / expansion", type: "float[2]", animatable: true }
    - { name: "Grade (any color effect or effect group)", type: "effect-group", animatable: true }
    - { name: "Mix", type: "percent", animatable: true }
  animation: >-
    Feather, expansion, mix and all grade controls keyframable. Per-region offsets can be driven by rigs (e.g. index-based delays).
  dependencies: [map.region, proj.effect-stack, mask.bezier, ux.recipe-engine, ux.operation-system, fx.color.curves]
  implementation: >-
    Gives any color effect (or effect group) an effect-level region mask input. Region geometry from map.region is rasterized in content/UV space into an r16float coverage texture, with analytic anti-aliasing and feather via a signed-distance field, and used to mix graded and ungraded pixels. Because the show targets region roles, rebinding the show to another venue regenerates the masks automatically.
  io: >-
    Region roles are saved with the show; bindings live with the venue.
  limitations: >-
    These are creative masks, distinct from physical output masks (out.output-mask). Light spilling past a physical edge still needs output masking.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Select one or more regions on the canvas → "Change color here", which opens the Color card scoped to that selection.
    defaults: >-
      Feather 2 px at output resolution, expansion 0, mix 100 %.
    automation: >-
      Creates the adjustment layer, region mask and grade underneath. "Same for all windows" uses the region group.
    usability_check: >-
      A first-time user makes all windows warmer while the walls stay unchanged in at most 3 actions and under 45 s.
  acceptance: >-
    AS-7 delivery/reuse: binding the show to another venue moves the per-region grade to the new regions with no manual edits; pixels outside regions are bit-identical to ungraded.
  status: not-started
  evidence: []

- id: fx.color.match-surfaces
  name: "Match two surfaces or projectors (artistic)"
  sources:
    - ref: brief §11I
      item: Separate the show's artistic grade from each projector's output correction
      category: Effect library
      checked: true
    - ref: brief §16
      item: Gamma/color matching across projectors (output side referenced, not implemented here)
      category: Multiple projectors
      checked: true
    - ref: brief §14
      item: Real surface color and projector limitations are installation constraints
      category: Color precision
      checked: true
  artist_can: >-
    Pick a reference area and a target area (two surfaces, or the parts of the show lit by two projectors). The helper builds an editable artistic grade that makes the target read like the reference to the audience.
  projection_example: >-
    A sandstone tower and a white-rendered wing turn the same white content cream and blue-white; the helper warms and darkens content on the wing so the two read alike.
  controls:
    - { name: "Reference area / Target area", type: "region", animatable: false }
    - { name: "Match (White balance / Tone / Both)", type: "enum", animatable: false }
    - { name: "Strength", type: "percent", animatable: true }
    - { name: "Sample source (camera capture of test pattern / venue photo / eyedroppers)", type: "enum", animatable: false }
  animation: >-
    The result is ordinary Curves/Lumetri values, so it is keyframable like any grade. Strength is keyframable.
  dependencies: [fx.color.grade-per-region, fx.color.curves, map.region, map.calibration, map.projector, out.projector-output, ux.operation-system]
  implementation: >-
    A one-shot operation. A GPU reduction takes mean and 5/50/95 % percentile statistics of both samples, preferably from a fixed-exposure calibration-camera capture (map.calibration) of a projected gray-step pattern. Per-channel gains plus a 3-point tone curve are solved by least squares in scene-linear and written into a Curves or Lumetri instance scoped by fx.color.grade-per-region. The helper never writes per-projector output correction (gamma, white point, black level). It links to out.projector-output for that and says so in the UI.
  io: >-
    Stores the capture reference and the solved values in the show (artistic), not in the venue calibration.
  limitations: >-
    Cannot exceed projector headroom: a darker or colored surface can only be matched by pulling the brighter side down. Albedo varies with ambient light and viewing angle. Camera captures need locked exposure and white balance. Eyedropper-only matching (no camera) is approximate.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: E
  beginner:
    action: >-
      Select two regions → "Make these match".
    defaults: >-
      Match Both, Strength 100 %, the newest calibration capture if one exists, otherwise eyedroppers.
    automation: >-
      Projects a gray-step pattern and captures it with the calibration camera when available, then solves the grade. A before/after split view is shown.
    usability_check: >-
      A novice reduces the measured mean color difference (ΔE2000 between the two captured regions under white content) by at least half in under 2 minutes, in at most 3 actions.
  acceptance: >-
    AS-5 multi-projector scene: the artistic grade and the per-projector output correction are stored and baked separately, the bundle manifest lists both stages, and neither is applied twice.
  status: not-started
  evidence: []
