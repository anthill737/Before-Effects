      item: Change Color
      category: Color Correction
      checked: true
  artist_can: >-
    Shift the hue, lightness and saturation of a range of similar colors while leaving the rest alone, with a viewable correction mask.
  projection_example: >-
    Turn the green foliage in a projected garden scene autumn-orange without touching the sky.
  controls:
    - { name: "View (Corrected Layer / Color Correction Mask)", type: "enum", animatable: false }
    - { name: "Hue Transform", type: "angle", animatable: true }
    - { name: "Lightness Transform", type: "float", animatable: true }
    - { name: "Saturation Transform", type: "float", animatable: true }
    - { name: "Color To Change", type: "color", animatable: true }
    - { name: "Matching Tolerance / Matching Softness", type: "percent", animatable: true }
    - { name: "Match Colors (RGB / Hue / Chroma)", type: "enum", animatable: false }
    - { name: "Invert Color Correction Mask", type: "bool", animatable: false }
  animation: >-
    All transforms and the target color keyframable, so a recolor can sweep over time.
  dependencies: [proj.effect-stack, anim.keyframe.core, fx.color.change-to-color]
  implementation: >-
    The shared color-range key kernel computes a soft mask from distance in RGB, hue angle, or chroma (OKLab a/b) in grading encoding. The HLS transform is then scaled by that mask. The mask view outputs the matte for inspection.
  io: >-
    none
  limitations: >-
    Fine-grained selection of similar hues may need Lumetri HSL Secondary or a region mask.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail colour-correction effect or plug-in clone. Basic correction (brightness/contrast, exposure, hue/saturation, levels, curves, tint, colour balance), projection looks and per-region grading stay required."
  milestone: C
  beginner:
    action: >-
      Reached through the "Recolor this" recipe → More controls → "Shift a range of colors".
    defaults: >-
      Color To Change comes from an eyedropper click; tolerance 15 %, softness 0 %, matching by Hue.
    automation: >-
      A "Show what will change" toggle flips View to the mask temporarily.
    usability_check: >-
      A novice shifts the greens in a clip toward orange and verifies the mask in under 45 s.
  acceptance: >-
    Mini scene "recolor": pixels outside tolerance are unchanged (bit-identical), and the mask view matches the reference matte.
  status: not-started
  evidence: []

- id: fx.color.change-to-color
