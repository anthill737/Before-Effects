- id: fx.color.shadow-highlight
  name: Shadow/Highlight
  sources:
    - ref: S02
      item: Shadow/Highlight
      category: Color Correction
      adobe_support:
        gpu: false
        bpc: [8, 16]
        mfr: true
      checked: true
    - ref: S19
      item: Shadow/Highlight
      category: Color Correction
      checked: true
  artist_can: >-
    Brighten shadowed areas and recover highlights based on each pixel's surroundings (local tone mapping), with automatic amounts.
  projection_example: >-
    Recover detail in a backlit photo of the building's façade before it becomes a texture source.
  controls:
    - { name: "Auto Amounts", type: "bool", animatable: false }
    - { name: "Shadow Amount / Highlight Amount", type: "percent", animatable: true }
    - { name: "Temporal Smoothing (seconds) / Scene Detect", type: "group", animatable: false }
    - { name: "Blend With Original", type: "percent", animatable: true }
    - { name: "Shadow / Highlight Tonal Width", type: "percent", animatable: true }
    - { name: "Shadow / Highlight Radius", type: "float", animatable: true }
    - { name: "Color Correction / Midtone Contrast", type: "float", animatable: true }
    - { name: "Black Clip / White Clip", type: "percent", animatable: true }
  animation: >-
    Amounts and radii keyframable when Auto Amounts is off.
  dependencies: [proj.effect-stack, preview.cache, anim.keyframe.core, fx.color.auto-color]
  implementation: >-
    A separable Gaussian blur of luminance (radius → bounds expansion of 3σ) gives local context. Tonal-width masks from the blurred luma drive a shadow lift and highlight compression, followed by saturation compensation and midtone contrast, all in grading encoding. Auto Amounts uses the shared histogram statistics with the same temporal-smoothing neighbour dependency as Auto Color.
  io: >-
    none
  limitations: >-
    Large amounts can produce halos at strong edges, as Adobe notes. The defaults are conservative.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail colour-correction effect or plug-in clone. Basic correction (brightness/contrast, exposure, hue/saturation, levels, curves, tint, colour balance), projection looks and per-region grading stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Recover shadows / tame highlights" quick fix → More controls.
    defaults: >-
      Auto Amounts on, smoothing 0 for stills and 0.5 s for video, Adobe-like tonal widths.
    automation: >-
      Radius auto-scales with layer resolution so the look stays consistent across proxies.
    usability_check: >-
      A novice reveals detail in a backlit supplied photo in one action and judges it improved.
  acceptance: >-
