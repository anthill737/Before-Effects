- id: fx.color.video-limiter
  name: Video Limiter
  sources:
    - ref: S02
      item: Video Limiter
      category: Color Correction
      adobe_support:
        gpu: true
        bpc: [8, 16, 32]
        mfr: true
      checked: true
    - ref: S19
      item: Video Limiter
      category: Color Correction
      checked: true
  artist_can: >-
    Keep luminance and chroma inside a chosen legal range (IRE) in the working space, compressing near the limit rather than hard clipping.
  projection_example: >-
    Produce a broadcast or stream recap of the projection show whose levels stay legal without regrading.
  controls:
    - { name: "Clip level / Luma min-max (IRE)", type: "float[2]", animatable: false }
    - { name: "Chroma limit", type: "float", animatable: false }
    - { name: "Limit axis (Luma / Chroma / Both)", type: "enum", animatable: false }
    - { name: "Soft compression (amount + tonal range)", type: "group", animatable: false }
  animation: >-
    Not normally animated.
  dependencies: [proj.effect-stack, render.encode, fx.utility.clipping-gamut-diagnostics]
  implementation: >-
    Per-pixel soft-knee limiter on Y'CbCr computed from display-encoded output-space values: luma is compressed above a knee toward the ceiling, and chroma magnitude is scaled where it exceeds the limit. Typically placed on an adjustment layer or applied automatically by a broadcast export preset.
  io: >-
    Pairs with export range metadata (full vs. limited) in render.encode.
  limitations: >-
    Adobe's page does not document the individual controls, so the control list above is the functional set rather than AE's exact UI. This is not a projector output limiter: per-projector peak or gamma limits belong in out.projector-output.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail colour-correction effect or plug-in clone. Basic correction (brightness/contrast, exposure, hue/saturation, levels, curves, tint, colour balance), projection looks and per-region grading stay required."
  milestone: D
  beginner:
    action: >-
      Export → "Video to share" → "Broadcast-safe" toggle (applied at export, not on the show).
    defaults: >-
      100 IRE luma ceiling, 0 IRE floor, chroma limited to Rec.709 legal, soft knee on.
    automation: >-
      Added automatically by broadcast presets; the clipping overlay shows affected areas.
    usability_check: >-
      A novice produces a broadcast-safe review export by flipping one toggle, with the show itself unchanged.
  acceptance: >-
    Mini scene "broadcast-safe": no output sample exceeds the limit, and in-range pixels below the knee are unchanged.
  status: not-started
  evidence: []

- id: fx.color.ocio-color-space-transform
  name: OCIO Color Space Transform
  sources:
    - ref: S02
      item: OCIO Color Space Transform (not listed in the support matrix)
      category: Color Correction
      adobe_support:
        gpu: null
        bpc: []
        mfr: null
      checked: false
    - ref: S19
      item: OCIO Color Space Transform
      category: Color Correction
      checked: true
    - ref: S26
      item: OCIO Color Space Transform
      category: Layer effects for applying OpenColorIO
      checked: true
  artist_can: >-
    Convert a layer from one color space to another using an OCIO config (e.g. LogC → ACEScg), typically to apply a LUT or effect built for a different space and convert back.
  projection_example: >-
    Convert a camera-log clip into the show's working space so it matches the 3D renders projected next to it.
  controls:
    - { name: "Input Color Space", type: "enum", animatable: false }
    - { name: "Output Color Space", type: "enum", animatable: false }
    - { name: "Inverse", type: "bool", animatable: false }
    - { name: "Gamut handling (Clip / Compress)", type: "enum", animatable: false }
    - { name: "Information (config, errors)", type: "display", animatable: false }
  animation: >-
    Not animatable (discrete choices).
  dependencies: [color.management, color.lut, proj.effect-stack, preview.cache]
  implementation: >-
    The PyOpenColorIO sidecar builds the processor from the project's config (or the bundled OCIO studio config when the project uses the analytic engine, since Adobe states project OCIO mode is not required). If the optimized processor reduces to matrix plus known transfer functions (sRGB, BT.1886, PQ, HLG, ACEScc/cct, Log camera curves), WGSL analytic parameters are emitted. Otherwise a log2 shaper 1D LUT covering about −8…+8 stops plus a 65³ rgba16float 3D LUT is baked, with tetrahedral interpolation in the shader, cached by config hash and space pair. Runs on unpremultiplied values. Optional gamut compression uses an ACES RGC-style analytic pass.
  io: >-
    The project stores config identity and space names, and collect-for-transfer includes the config. The baked LUT is a cache, never the source of truth.
  limitations: >-
    Not listed in the S02 support matrix (checked 2026-10-01), so Adobe's GPU, bit-depth and MFR support is unknown. Baked LUTs are an approximation of non-analytic transforms; extreme values outside the shaper range clamp.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail colour-correction effect or plug-in clone. Basic correction (brightness/contrast, exposure, hue/saturation, levels, curves, tint, colour balance), projection looks and per-region grading stay required."
  milestone: D
  beginner:
    action: >-
      Advanced only. Most users never see it, because color.management interprets footage automatically. It is reached through "This clip looks gray/flat (log footage)" → "Convert from camera log".
    defaults: >-
      Input = layer's interpreted space; Output = working space; Clip.
    automation: >-
      Suggests the input space from footage metadata (camera, gamma tag) when available.
    usability_check: >-
      A novice fixes a flat log clip via the plain-language prompt in under 30 s without seeing a color-space name list.
  acceptance: >-
    Mini scene "ocio-roundtrip": a CST A→B→A round-trip is within 1e-3 relative error for in-gamut values, and the baked path matches the OCIO CPU processor within 1/1023 at 10-bit output.
  status: not-started
  evidence: []

- id: fx.color.ocio-file-transform
  name: OCIO File Transform
  sources:
    - ref: S02
      item: OCIO File Transform (not listed in the support matrix)
      category: Color Correction
      adobe_support:
        gpu: null
        bpc: []
        mfr: null
      checked: false
    - ref: S19
      item: OCIO File Transform
      category: Color Correction
      checked: true
    - ref: S26
      item: OCIO File Transform
      category: Layer effects for applying OpenColorIO
      checked: true
  artist_can: >-
    Apply any LUT or CDL file that OpenColorIO can read, in the color space it was built for.
  projection_example: >-
    Apply a colorist's .clf look delivered for the show, using the LogC space it expects.
  controls:
    - { name: "File (.cube, .3dl, .csp, .spi1d/.spi3d, .clf/.ctf, .cdl/.cc/.ccc, .look, .lut, .mga, .vf, .icc)", type: "file", animatable: false }
    - { name: "CCC ID", type: "enum", animatable: false }
    - { name: "Interpolation (Linear / Tetrahedral / Best)", type: "enum", animatable: false }
    - { name: "Direction (Forward / Inverse)", type: "enum", animatable: false }
    - { name: "LUT expects (color space; wraps the conversion in and out)", type: "enum", animatable: false }
    - { name: "Intensity", type: "percent", animatable: true }
  animation: >-
    Only Intensity (a mix with the input) is animatable.
  dependencies: [fx.color.ocio-color-space-transform, color.lut, color.management, proj.effect-stack]
  implementation: >-
    The sidecar fuses the CST sandwich Adobe describes (working → LUT space → file → working) into one processor and bakes it: 1D-only files become a 4096-entry 1D LUT texture; other files become a shaper plus 65³ 3D LUT with tetrahedral interpolation. Inverse uses OCIO's inversion where the format supports it. The result is cached by file hash.
  io: >-
    The referenced file is collected with the project. A missing LUT is reported with a relink action.
  limitations: >-
    Not listed in the S02 support matrix (checked 2026-10-01). Inverting 3D LUTs is approximate.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail colour-correction effect or plug-in clone. Basic correction (brightness/contrast, exposure, hue/saturation, levels, curves, tint, colour balance), projection looks and per-region grading stay required."
  milestone: D
  beginner:
    action: >-
      "Apply a look (LUT)" — the same entry point as fx.utility.apply-color-lut. Formats that need OCIO route here automatically, and a "This LUT expects…" picker appears only if the file does not say.
    defaults: >-
      LUT expects Rec.709 display, Forward, Best interpolation, Intensity 100 %.
    automation: >-
      Chooses between the native LUT path and the OCIO path by file type, and reads the expected space from CLF/CTF metadata.
    usability_check: >-
      A novice applies a supplied .clf look by drag-and-drop and sets its strength in under 30 s.
  acceptance: >-
    Mini scene "ocio-roundtrip": the baked result matches the OCIO CPU processor within 1/1023.
  status: not-started
  evidence: []

