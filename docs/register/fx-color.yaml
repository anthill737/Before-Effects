- id: fx.color.ps-arbitrary-map
  name: PS Arbitrary Map
  sources:
    - ref: S02
      item: PS Arbitrary Map
      category: Color Correction
      adobe_support:
        gpu: false
        bpc: [8]
        mfr: true
      checked: true
    - ref: S19
      item: PS Arbitrary Map
      category: Color Correction
      checked: true
  artist_can: >-
    Apply a Photoshop arbitrary-map (.amp) brightness remap, and cycle it with a phase control (legacy compatibility effect).
  projection_example: >-
    Reuse a solarize-style .amp map from an old Photoshop project on projected footage.
  controls:
    - { name: "Arbitrary map file (.amp)", type: "file", animatable: false }
    - { name: "Phase", type: "float", animatable: true }
    - { name: "Apply Phase Map To Alpha", type: "bool", animatable: false }
  animation: >-
    Phase was the animatable control. It maps to Colorama's Phase Shift.
  dependencies: [fx.color.curves, fx.color.colorama]
  implementation: >-
    No separate pass. Static maps import into Curves (pencil mode) per channel. Phase-cycled maps become a Colorama setup (Get Phase From Intensity, Modify Intensity, the imported map as Output Cycle, Phase Shift animated).
  io: >-
    .amp import, through fx.color.curves.
  limitations: >-
    Superseded: Adobe marks this effect as compatibility-only and recommends Curves. Static remaps are covered exactly by Curves. Phase cycling is covered by Colorama, because Curves has no phase control.
  disposition: superseded
  superseded_by: fx.color.curves
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Not listed separately. Dropping an .amp file onto a layer opens Curves with the map loaded.
    defaults: >-
      n/a
    automation: >-
      File-drop handler and search alias.
    usability_check: >-
      A user applies an .amp file by drag-and-drop in one action.
  acceptance: >-
    Unit test: an .amp import reproduces the map's 256 values within 1/1023.
