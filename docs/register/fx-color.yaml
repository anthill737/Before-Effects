- id: fx.color.lumetri-color
  name: Lumetri Color
  sources:
    - ref: S02
      item: Lumetri Color
      category: Color Correction
      adobe_support:
        gpu: true
        bpc: [8, 16, 32]
        mfr: true
      checked: true
    - ref: S19
      item: Lumetri Color
      category: Color Correction
      checked: true
  artist_can: >-
    Grade in one place: white balance, exposure and tone, creative looks, RGB and hue/saturation curves, color wheels, a secondary HSL key with its own correction, and a vignette.
  projection_example: >-
    Give every scene in the show a consistent warm "golden hour" look, then pull the sky-blue in the video slightly toward teal.
  controls:
    - { name: "Basic: Input LUT, White Balance (picker, Temperature, Tint)", type: "group", animatable: true }
    - { name: "Basic: Exposure, Contrast, Highlights, Shadows, Whites, Blacks, Saturation", type: "float[7]", animatable: true }
    - { name: "Creative: Look (LUT), Intensity, Faded Film, Sharpen, Vibrance, Saturation, Shadow Tint, Highlight Tint, Tint Balance", type: "group", animatable: true }
    - { name: "Curves: RGB curves (master + R/G/B)", type: "curve[4]", animatable: true }
    - { name: "Curves: Hue vs Sat, Hue vs Hue, Hue vs Luma, Luma vs Sat, Sat vs Sat", type: "hue-curve[5]", animatable: true }
    - { name: "Color Wheels: Shadows / Midtones / Highlights (+ lightness)", type: "wheel[3]", animatable: true }
    - { name: "HSL Secondary: key (H/S/L ranges, denoise, blur, show mask), correction (temperature, tint, contrast, sharpen, saturation, wheel)", type: "group", animatable: true }
    - { name: "Vignette: Amount, Midpoint, Roundness, Feather", type: "float[4]", animatable: true }
  animation: >-
    All numeric, color and curve controls keyframable. Curves interpolate per point when point counts match.
  dependencies: [proj.effect-stack, anim.keyframe.core, color.lut, color.management, fx.color.curves, fx.utility.apply-color-lut, fx.color.change-color, ux.recipe-engine, ux.effect-library]
  implementation: >-
    A pass graph. (1) A fused per-pixel uber-shader runs the enabled sections in AE order: Input LUT (3D texture), white balance as von Kries gains in LMS in scene-linear, then tone and the creative, curve and wheel sections in grading encoding. Tone controls are a CPU-built 1D LUT, hue curves are periodic 1D LUTs indexed by hue, and the creative look is a 3D LUT with intensity mix. Disabled sections are removed with WGSL override constants. (2) The HSL secondary key renders a mask, blurs it with a separable Gaussian, then mixes the correction. (3) Sharpen is an unsharp neighbourhood pass that declares bounds expansion. (4) Vignette is analytic.
  io: >-
    Input and Creative LUTs accept .cube (and OCIO-readable formats via fx.color.ocio-file-transform). Grades save as reusable style presets; Premiere .prfpset import is not promised.
  limitations: >-
    Matches Lumetri's controls and intent, not Adobe's exact math. Monitor preview cannot guarantee how a grade reads on a real, non-white surface (brief §14).
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail colour-correction effect or plug-in clone. Basic correction (brightness/contrast, exposure, hue/saturation, levels, curves, tint, colour balance), projection looks and per-region grading stay required."
  milestone: C
  beginner:
    action: >-
      The "Match the look" / "Film looks" library of animated thumbnails previewed on the selected surface. Picking one opens a Grade card with Warmth, Brightness, Contrast, Color and Look strength; everything else is under More controls.
    defaults: >-
      Neutral. Looks apply at 70 % intensity.
    automation: >-
      "Auto" (one-shot operation) sets exposure and white balance from statistics as editable values. Applying a look to many layers in one action adds one shared adjustment layer.
    usability_check: >-
      A first-time user applies a look from thumbnails, lowers its strength and warms it in under 1 minute, in at most 3 actions for the apply step.
  acceptance: >-
    Mini scene "lumetri-graph": each section matches a float reference within 1/1023; disabling sections changes no other pixels; preview equals export.
  status: not-started
  evidence: []

- id: fx.color.photo-filter
