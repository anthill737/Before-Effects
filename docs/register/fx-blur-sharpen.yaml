  animation: >-
    All controls keyframable and expression-linkable.
  dependencies: [fx.blur-sharpen.gaussian-blur, color.management]
  implementation: >-
    Reuses the Gaussian pass: detail = I - G(I) on perceptually encoded luminance, with a soft-knee Threshold, added back × Amount. Temporal: none. Bounds: + 3σ. Precision: rgba16float.
  io: >-
    none
  limitations: >-
    Same output-stage caveat as Sharpen.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail blur or sharpen effect with no projection workflow behind it. Gaussian, directional, radial and fast box blur and the overscan policy stay required."
