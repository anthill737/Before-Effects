      checked: true
    - ref: S36
      item: CC Radial Fast Blur
      category: "Blur & Sharpen"
      checked: true
  artist_can: >-
    A fast radial zoom blur whose Brightest mode turns bright areas into light-ray streaks bursting from a point.
  projection_example: >-
    Light rays stream out of the windows from a point behind the building as the sun "rises".
  controls:
    - { name: "Center", type: "point2d", animatable: true }
    - { name: "Amount", type: "float", animatable: true }
    - { name: "Zoom (Standard, Brightest, Darkest)", type: "enum", animatable: false }
  animation: >-
    Center and Amount keyframable and expression-linkable.
  dependencies: [fx.blur-sharpen.radial-blur, fx.stylize.glow]
  implementation: >-
    Radial cascade gather with average (Standard), max (Brightest) or min (Darkest) accumulation; max/min keep highlight energy for ray looks. Temporal: none. Bounds: + Amount outward. Precision: rgba16float, so values above 1.0 stay in the rays.
  io: >-
    none
  limitations: >-
    After Effects supports 8/16-bpc only; Before Effects processes in float, so highlights may look brighter than in After Effects.
  disposition: deferred
  superseded_by: null
