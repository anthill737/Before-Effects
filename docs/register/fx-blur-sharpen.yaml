      category: "Blur & Sharpen"
      checked: true
    - ref: S02
      item: Box Blur
      category: "Blur & Sharpen"
      adobe_support: { gpu: null, bpc: [], mfr: null }
      checked: false
  artist_can: >-
    Blur with an adjustable number of box-filter passes (Iterations), from boxy to Gaussian-smooth.
  projection_example: >-
    Same uses as Fast Box Blur.
  controls:
    - { name: "Blur Radius", type: "float", animatable: true }
    - { name: "Iterations", type: "int", animatable: true }
    - { name: "Blur Dimensions", type: "enum", animatable: false }
    - { name: "Repeat Edge Pixels", type: "bool", animatable: false }
  animation: >-
    As Fast Box Blur.
  dependencies: [fx.blur-sharpen.fast-box-blur]
  implementation: >-
