# Blur & Sharpen — Before Effects capability register
# Sources: S02 effect list + support matrix (Blur & Sharpen rows; Obsolete rows for Reduce Interlace Flicker), S36 Blur and Sharpen effects page, S01 Cycore plugins and Obsolete effects pages, brief §11H, §6, §14, §15. Live pages read 2026-10-01 through a browser session (WebFetch was blocked with HTTP 403). The Cycore pages give one-line summaries only, so CC control lists come from product knowledge.
# Shared rule: radii are in composition pixels and are scaled with preview resolution, so a draft preview matches export. Working buffers are rgba16float, scene-linear and premultiplied.

- id: fx.blur-sharpen.edge-overscan-policy
  name: Blur edges and overscan
  sources:
    - ref: brief
      item: "§11H — define edge handling and overscan so large blurs do not clip unexpectedly"
      category: Blur and sharpness (product requirement)
      checked: true
    - ref: S36
      item: Repeat Edge Pixels option (About Blur & Sharpen effects)
      category: "Blur & Sharpen"
      checked: true
  artist_can: >-
    Use big blurs and glows without hard-clipped edges or dark borders, and choose whether a layer's edge fades out, repeats its edge pixels, mirrors, or blurs into real content beyond the frame.
  projection_example: >-
    A 200 px glow on a roofline near the top of the composition continues softly past the frame edge instead of ending in a straight cut. The output mask still keeps the glow off the neighbouring building.
  controls:
    - { name: "Edge mode (Transparent, Repeat Edge Pixels, Mirror, Use overscan content)", type: "enum", animatable: false }
    - { name: "Overscan margin", type: "enum (auto) or float (px)", animatable: false }
    - { name: "Clip to layer bounds", type: "bool", animatable: false }
  animation: >-
    Not animatable; set per effect, with a project default.
  dependencies: [proj.effect-stack, proj.composition, preview.cache, out.output-mask, map.region]
  implementation: >-
    Every pass declares bounds expansion as a function of its parameters (Gaussian 3σ, box n·r, lens max radius, directional L/2). The compositor propagates the region of interest upstream (request = output ROI expanded by the kernel footprint) and renders into oversized rgba16float buffers, so nothing clips until the final composite. Compositions can render an overscan margin beyond the frame for frame-edge blurs. Edge modes map to sampler addressing: clamp-to-edge for Repeat, mirror-repeat for Mirror, and a WGSL-emulated transparent border, because WebGPU has no border colour. Region-confined blurs clip against map.region masks. Oversized regions are tiled under a VRAM budget.
  io: >-
    Overscan is internal; exported frames are cropped to the output size. The output mask is still applied downstream.
  limitations: >-
    The GPU maximum texture size (8192 or 16384) caps the expanded region; beyond that, the pyramid path runs at reduced resolution and the UI says so. Creative overscan never bypasses out.output-mask.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      No action needed. Blurs and glows "just don't clip". The edge choice sits under More controls → Edges.
    defaults: >-
      Repeat Edge Pixels for full-frame footage. Transparent for shapes, text and regions. Auto overscan sized from the declared bounds expansion.
    automation: >-
      Picks the edge mode from the layer type. Expands bounds automatically. Warns when the GPU limit forces reduced resolution.
    usability_check: >-
      A first-time user adds a large glow to a shape touching the frame edge, and no hard edge or dark border appears in preview or export, with no setting changed.
  acceptance: >-
    AS-1 and mini scene "edge-glow": a 300 px blur at the frame edge shows no clipping or darkening; export matches preview.
  status: not-started
  evidence: []

- id: fx.blur-sharpen.focus-on-region
  name: Focus on a region (selective focus)
  sources:
    - ref: brief
      item: "§11H — depth/lens-style and variable-map blurs; §10 — depth-of-field compositing"
      category: Blur and sharpness (product requirement)
      checked: true
  artist_can: >-
    Keep one window, door or feature sharp while the rest of the building softens, and move the focus from one feature to another over time.
  projection_example: >-
    Before the reveal, everything but the central doorway goes soft to draw the audience's eye, then the focus racks to the clock tower.
  controls:
    - { name: "Focus target", type: "region-ref or point2d", animatable: true }
    - { name: "Blur amount", type: "float", animatable: true }
    - { name: "Falloff distance", type: "float", animatable: true }
    - { name: "Focus change time", type: "time", animatable: false }
    - { name: "Look (Soft, Lens bokeh)", type: "enum", animatable: false }
    - { name: "Keep blur inside each region", type: "bool", animatable: false }
  animation: >-
    Target, amount and falloff keyframable. Changing the target generates a smooth rack-focus transition.
  dependencies: [map.region, map.model-3d, pass.depth, fx.blur-sharpen.camera-lens-blur, fx.blur-sharpen.compound-blur, ux.recipe-engine, anim.keyframe.core]
  implementation: >-
    Recipe plus a map generator. The blur map is the distance from the target: a jump-flood distance field over the map.region raster, venue-space 3D distance when map.model-3d exists, or pass.depth for 3D scenes. That map drives Camera Lens Blur (Lens look) or the pyramid variable blur from Compound Blur (Soft look). A rack focus interpolates between two maps. Temporal: none. Bounds: those of the underlying blur. Precision: distance field in r32float.
  io: >-
    none
  limitations: >-
    Region distance is 2D unless venue geometry exists, so a far window and a near one at the same screen distance blur alike in 2D mode.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail blur or sharpen effect with no projection workflow behind it. Gaussian, directional, radial and fast box blur and the overscan policy stay required."
  milestone: C
  beginner:
    action: >-
      Select a window or feature → "Focus on this". Select another and choose "Move focus here" to rack focus.
    defaults: >-
      Soft look, blur = 1.5% of the composition diagonal, falloff = 25% of the building width, 1 s rack.
    automation: >-
      Builds the distance map, adds the blur and keys the rack focus.
    usability_check: >-
      A first-time user makes everything but a chosen door go soft, then moves the focus to another feature, in at most 4 actions and under 45 s.
  acceptance: >-
    AS-2 support scene: focus racks between two regions; preview equals export.
  status: not-started
  evidence: []

- id: fx.blur-sharpen.bilateral-blur
  name: Bilateral Blur
  sources:
    - ref: S02
      item: Bilateral Blur
      category: "Blur & Sharpen"
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S36
      item: Bilateral Blur
      category: "Blur & Sharpen"
      checked: true
  artist_can: >-
    Smooth flat areas while mostly keeping edges, for a soft, dreamy, painterly surface (similar to Photoshop's Surface Blur).
  projection_example: >-
    Smooths a photographed stone texture into a soft painted look before it is projected back onto the same stone.
  controls:
    - { name: "Radius", type: "float", animatable: true }
    - { name: "Threshold", type: "float", animatable: true }
    - { name: "Colorize", type: "bool", animatable: false }
  animation: >-
    Radius and Threshold keyframable and expression-linkable.
  dependencies: [proj.effect-stack, fx.blur-sharpen.edge-overscan-policy]
  implementation: >-
    Bilateral-grid pass (splat into a downsampled x, y, intensity grid; blur; slice), so cost is near-constant with radius. With Colorize off, it operates on luminance and outputs a monochrome image (per S36); with Colorize on, each channel uses range weights. Temporal: none. Bounds: + Radius. Precision: grid in rgba16float with f32 weights.
  io: >-
    none
  limitations: >-
    The grid approximation differs slightly from a brute-force bilateral at very small radii; small radii use the brute-force path.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail blur or sharpen effect with no projection workflow behind it. Gaussian, directional, radial and fast box blur and the overscan policy stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Painterly smooth" look → More controls.
    defaults: >-
      Radius 8, Threshold 20, Colorize on.
    automation: >-
      Scales the radius to the region size.
    usability_check: >-
      A first-time user applies a painterly smooth look to a selected surface in at most 3 actions.
  acceptance: >-
    Mini scene "stone-paint": result within tolerance of a brute-force bilateral reference.
  status: not-started
  evidence: []

