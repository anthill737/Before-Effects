- id: fx.blur-sharpen.radial-blur
  name: Radial Blur
  sources:
    - ref: S02
      item: Radial Blur
      category: "Blur & Sharpen"
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S36
      item: Radial Blur
      category: "Blur & Sharpen"
      checked: true
  artist_can: >-
    Blur around a point as if the camera zoomed (rays bursting outward) or spun (circular swirl).
  projection_example: >-
    A zoom-burst blur centred on the doorway makes the facade appear to rush toward the audience.
  controls:
    - { name: "Amount", type: "float", animatable: true }
    - { name: "Center", type: "point2d", animatable: true }
    - { name: "Type (Spin, Zoom)", type: "enum", animatable: false }
    - { name: "Antialiasing (Best Quality) (Low, High)", type: "enum", animatable: false }
  animation: >-
    Amount and Center keyframable and expression-linkable.
  dependencies: [proj.effect-stack, fx.blur-sharpen.edge-overscan-policy, map.region]
  implementation: >-
    Zoom: cascaded multi-pass gather toward the centre (each pass N taps at geometric scale steps; three passes give N³ effective taps). Spin: the same in the angular domain via polar sampling. Temporal: none. Bounds: Zoom expands outward by Amount; Spin stays within the circumscribed circle. Precision: f32 accumulation. No grainy Draft mode; preview uses fewer passes and labels it.
  io: >-
    none
  limitations: >-
    The After Effects Draft-quality grain look is not reproduced by default; it can be had with an added noise option.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Zoom burst" and "Spin blur" looks; drag the centre on the canvas.
    defaults: >-
      Zoom, centred on the selected region, Amount 20.
    automation: >-
      Centres on the selected region.
    usability_check: >-
      A first-time user makes a zoom burst from a chosen door in at most 3 actions.
  acceptance: >-
    Mini scene "door-rush": cascade output matches a 512-tap reference within tolerance.
  status: not-started
  evidence: []

- id: fx.blur-sharpen.reduce-interlace-flicker
  name: Reduce Interlace Flicker
  sources:
    - ref: S02
      item: Reduce Interlace Flicker
      category: Obsolete
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S01
      item: Reduce Interlace Flicker (Obsolete effects page)
      category: Obsolete
      checked: true
  artist_can: >-
    Soften vertically to stop thin horizontal lines and fine detail from twittering on interlaced displays.
  projection_example: >-
    Possibly: thin horizontal architectural lines in content shimmer when scaled by a projector's scaler.
  controls:
    - { name: "Softness", type: "float", animatable: true }
  animation: >-
    Softness keyframable.
  dependencies: [fx.blur-sharpen.gaussian-blur]
  implementation: >-
    Vertical-only Gaussian pass (σ = Softness). Temporal: none. Bounds: + 3σ vertically. Precision: rgba16float.
  io: >-
    none
  limitations: >-
    Decision 2026-10-02: kept for After Effects import fidelity (imported projects may use it), implemented as a vertical softening pass. Projectors are progressive, so it is not shown in the beginner library.

    Open question 1: does any target output or source in this product involve interlaced signals or line-twitter, given that projectors and media servers are progressive? If not, this is superseded by Gaussian Blur with Blur Dimensions = Vertical. Open question 2 (register hygiene): S02 now lists this effect under Obsolete, and fx.obsolete.reduce-interlace-flicker already registers the same Adobe item as superseded by fx.blur-sharpen.gaussian-blur. Keep one entry; if the Obsolete entry is accepted, set this one to superseded with superseded_by fx.obsolete.reduce-interlace-flicker.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail blur or sharpen effect with no projection workflow behind it. Gaussian, directional, radial and fast box blur and the overscan policy stay required."
  milestone: F
  beginner:
    action: >-
      If kept: "Fix shimmering thin lines" under Soften → More controls.
    defaults: >-
      Softness 1.
    automation: >-
      none
    usability_check: >-
      If kept: a first-time user removes shimmer from thin horizontal lines in at most 3 actions.
  acceptance: >-
    To be defined once relevance is resolved.
  status: not-started
  evidence: []

- id: fx.blur-sharpen.sharpen
  name: Sharpen
  sources:
    - ref: S02
      item: Sharpen
      category: "Blur & Sharpen"
      adobe_support: { gpu: true, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S36
      item: Sharpen
      category: "Blur & Sharpen"
      checked: true
  artist_can: >-
    Increase contrast where colours change, to crisp up soft footage or images.
  projection_example: >-
    Crisps up an upscaled archive photograph of the building before it is projected at 4K.
  controls:
    - { name: "Sharpen Amount", type: "float", animatable: true }
  animation: >-
    Keyframable and expression-linkable.
  dependencies: [proj.effect-stack, color.management]
  implementation: >-
    3×3 Laplacian-weighted pass applied to a perceptual (log2) encoding of luminance and mapped back, avoiding the bright-edge halos that sharpening directly in linear light causes. Chroma is untouched. Temporal: none. Bounds: + 1 px. Precision: rgba16float with negative clamping.
  io: >-
    none
  limitations: >-
    Creative sharpening only. Compensating for projector softness or warp resampling belongs to the output stage, not here, so it is never applied twice.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail blur or sharpen effect with no projection workflow behind it. Gaussian, directional, radial and fast box blur and the overscan policy stay required."
  milestone: C
  beginner:
    action: >-
      "Sharpen" with an Amount slider.
    defaults: >-
      Amount 15.
    automation: >-
      Warns when sharpening is stacked on already-sharpened sources.
    usability_check: >-
      A first-time user sharpens a soft photo in at most 3 actions and under 15 s.
  acceptance: >-
    Mini scene "archive-photo": no halo overshoot above 5% at high-contrast edges.
  status: not-started
  evidence: []

- id: fx.blur-sharpen.smart-blur
  name: Smart Blur
  sources:
    - ref: S02
      item: Smart Blur
      category: "Blur & Sharpen"
      adobe_support: { gpu: false, bpc: [8, 16], mfr: true }
      checked: true
    - ref: S36
      item: Smart Blur
      category: "Blur & Sharpen"
      checked: true
  artist_can: >-
    Blur smooth areas while keeping lines and edges crisp, or output just the edges as a line drawing.
  projection_example: >-
    Flattens a photo of the facade into clean cartoon-like colour areas, then "Edge Only" gives line art to trace with light.
  controls:
    - { name: "Radius", type: "float", animatable: true }
    - { name: "Threshold", type: "float", animatable: true }
    - { name: "Mode (Normal, Edge Only, Overlay Edge)", type: "enum", animatable: false }
  animation: >-
    Radius and Threshold keyframable and expression-linkable.
  dependencies: [proj.effect-stack, fx.blur-sharpen.edge-overscan-policy, tool.edge-trace]
  implementation: >-
    Sigma-filter pass: averages only neighbours within Threshold of the centre, as a separable approximation in two passes. Edge Only and Overlay Edge output a thresholded Sobel edge map (black/white, or white over the image). Temporal: none. Bounds: + Radius. Precision: rgba16float, where After Effects is limited to 8/16-bpc.
  io: >-
    none
  limitations: >-
    The separable approximation differs from a true 2D sigma filter on diagonal edges; Final quality uses the 2D path.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail blur or sharpen effect with no projection workflow behind it. Gaussian, directional, radial and fast box blur and the overscan policy stay required."
  milestone: D
  beginner:
    action: >-
      "Cartoon smooth" look, and "Find edges for tracing" (Edge Only) inside the edge-trace tool.
    defaults: >-
      Radius 5, Threshold 25, Normal.
    automation: >-
      Edge Only output can seed edge tracing.
    usability_check: >-
      A first-time user gets a clean line drawing of a facade photo in at most 3 actions.
  acceptance: >-
    Mini scene "facade-lineart": edge output is stable across preview resolutions.
  status: not-started
  evidence: []

