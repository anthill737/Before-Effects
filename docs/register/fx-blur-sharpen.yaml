- id: fx.blur-sharpen.cc-vector-blur
  name: CC Vector Blur
  sources:
    - ref: S02
      item: CC Vector Blur
      category: "Blur & Sharpen"
      adobe_support: { gpu: false, bpc: [8, 16], mfr: true }
      checked: true
    - ref: S36
      item: CC Vector Blur
      category: "Blur & Sharpen"
      checked: true
  artist_can: >-
    Smear the image along directions taken from a map layer, for brushed, swirling, painterly or flow-like streaks.
  projection_example: >-
    Brick texture smears along a swirling noise field, as if the wall turns to flowing paint.
  controls:
    - { name: "Type (Natural, Constant Length, Perpendicular, Direction Center, Direction Fading)", type: "enum", animatable: false }
    - { name: "Amount", type: "float", animatable: true }
    - { name: "Angle Offset", type: "angle", animatable: true }
    - { name: "Revolutions", type: "float", animatable: true }
    - { name: "Vector Map / Property", type: "layer-ref + enum", animatable: false }
    - { name: "Map Softness", type: "float", animatable: true }
  animation: >-
    All numeric controls keyframable and expression-linkable; the map may animate.
  dependencies: [proj.layer, fx.blur-sharpen.gaussian-blur, fx.noise-grain.fractal-noise]
  implementation: >-
    Line-integral convolution. The vector field comes from the map's gradient (Natural, Perpendicular) or an angle encoding, pre-softened with the Gaussian pass. Each pixel gathers N samples along the RK2-integrated streamline. Temporal: reads the map at t. Bounds: + Amount. Precision: field in rg32float, rgba16float output.
  io: >-
    none
  limitations: >-
    none
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail blur or sharpen effect with no projection workflow behind it. Gaussian, directional, radial and fast box blur and the overscan policy stay required."
  milestone: D
  beginner:
    action: >-
      "Turn into flowing paint" look.
    defaults: >-
      Natural, generated fractal-noise map, Amount 15.
    automation: >-
      Generates and animates the map.
    usability_check: >-
      A first-time user makes a wall smear into flowing paint in at most 3 actions.
  acceptance: >-
    Mini scene "paint-flow": preview equals export.
  status: not-started
  evidence: []
