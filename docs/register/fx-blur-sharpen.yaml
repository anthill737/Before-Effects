      As Fast Box Blur.
    automation: >-
      A preset or script naming Box Blur resolves to Fast Box Blur.
    usability_check: >-
      Covered by the Fast Box Blur check.
  acceptance: >-
    Covered by Fast Box Blur acceptance.
  status: not-started
  evidence: []

- id: fx.blur-sharpen.camera-lens-blur
  name: Camera Lens Blur
  sources:
    - ref: S02
      item: Camera Lens Blur
      category: "Blur & Sharpen"
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S36
      item: Camera Lens Blur
      category: "Blur & Sharpen"
      checked: true
  artist_can: >-
    Make a real-lens out-of-focus look with shaped bokeh (iris blades, roundness, diffraction rings), glowing highlights, and focus that varies across the image from a map or depth.
  projection_example: >-
    Projected city-night footage on the facade turns into big coloured bokeh balls while one window stays in focus.
  controls:
    - { name: "Blur Radius (up to 500)", type: "float", animatable: true }
    - { name: "Iris Properties (Shape, Roundness, Aspect Ratio, Rotation, Diffraction Fringe)", type: "group", animatable: true }
    - { name: "Blur Map (Layer, Channel, Placement, Blur Focal Distance, Invert Blur Map)", type: "group", animatable: true }
    - { name: "Highlight (Gain, Threshold, Saturation)", type: "group", animatable: true }
    - { name: "Edge Behavior (Repeat Edge Pixels)", type: "bool", animatable: false }
    - { name: "Use Linear Working Space", type: "bool", animatable: false }
  animation: >-
    All numeric controls keyframable and expression-linkable; Blur Focal Distance is the rack-focus control.
  dependencies: [pass.depth, 3d.camera, proj.layer, fx.blur-sharpen.edge-overscan-policy, color.management]
  implementation: >-
    The circle of confusion per pixel comes from the blur map channel or pass.depth relative to the Blur Focal Distance. A 16×16 tile max-CoC is computed and dilated. A half-resolution gather uses a polygonal iris kernel (blades, roundness, rotation, aspect) sampled on rings, with near and far fields kept separate so sharp foreground does not leak. Diffraction fringe is a ring-weighted kernel. A highlight pre-pass multiplies pixels above Threshold by Gain, with Saturation control. A CoC-aware upsample follows. Temporal: none. Bounds: + Blur Radius. Precision: scene-linear rgba16float, with f32 accumulation. Because the working space is already linear, "Use Linear Working Space" defaults on; switching it off emulates gamma-space After Effects looks.
  io: >-
    Reads depth from EXR or Cryptomatte workflows via pass.depth.
  limitations: >-
    Gather-based bokeh cannot show content hidden behind a sharp foreground object (2.5D limitation); true 3D depth of field belongs to 3d.camera. S36 notes it replaces Lens Blur.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail blur or sharpen effect with no projection workflow behind it. Gaussian, directional, radial and fast box blur and the overscan policy stay required."
  milestone: C
  beginner:
    action: >-
      Reached through "Focus on…" (Lens look) and the "Dreamy bokeh" look.
    defaults: >-
      Hexagon iris with roundness 50%, radius 20, highlights Gain 20 / Threshold 0.9 / Saturation 80.
    automation: >-
      Uses depth automatically when the layer is a 3D render. Otherwise builds a region-distance map.
    usability_check: >-
      A first-time user turns a night-city clip into bokeh with one window sharp in at most 4 actions and under 60 s.
  acceptance: >-
    Mini scene "night-bokeh": 32-bpc highlight bokeh retains colour, and export matches preview.
  status: not-started
  evidence: []

- id: fx.blur-sharpen.camera-shake-deblur
  name: Camera-Shake Deblur
  sources:
    - ref: S02
      item: Camera-Shake Deblur
      category: "Blur & Sharpen"
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S36
      item: Camera-Shake Deblur
      category: "Blur & Sharpen"
      checked: true
  artist_can: >-
    Repair frames blurred by camera shake by rebuilding them from sharper neighbouring frames.
  projection_example: >-
    Handheld footage of the venue, filmed for a "the building watches itself" sequence, is stabilised and then deblurred so it holds up at 4K on the wall.
  controls:
    - { name: "Blur Duration (frames)", type: "int", animatable: false }
    - { name: "Deblur Method (Standard, High Quality)", type: "enum", animatable: false }
    - { name: "Strength (100-200%)", type: "percent", animatable: true }
    - { name: "Shake Sensitivity", type: "float", animatable: false }
  animation: >-
    Strength keyframable.
  dependencies: [fx.time.optical-flow-engine, fx.time.temporal-sampling-contract, fx.distort.warp-stabilizer, preview.cache]
  implementation: >-
    A per-frame sharpness score (variance of the Laplacian on luma) is computed and cached for the clip. For frames below the Shake Sensitivity threshold, the sharpest frames within ±Blur Duration are warped into place with optical flow (High Quality uses the sidecar backend) and blended with confidence weights scaled by Strength. Temporal: reads frames t ± Blur Duration plus their flows. Bounds: unchanged. Precision: rgba16float.
  io: >-
    Uses flow caches.
  limitations: >-
    Needs nearby sharp frames. S36 recommends stabilising first and stacking low-strength copies for hard shots; Before Effects does both through the recipe.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail blur or sharpen effect with no projection workflow behind it. Gaussian, directional, radial and fast box blur and the overscan policy stay required."
  milestone: D
  beginner:
    action: >-
      "Fix shaky footage" recipe, which stabilises and then deblurs.
    defaults: >-
      Standard method, Blur Duration 3, Strength 100%, auto sensitivity.
    automation: >-
      Adds the stabiliser before deblur. Analyses sharpness in the background. Flags frames it could not repair.
    usability_check: >-
      A first-time user fixes a shaky handheld clip in at most 2 actions, excluding analysis time, which is measured separately.
  acceptance: >-
    Mini scene "handheld-fix": the median Laplacian sharpness of flagged frames increases by at least 25%.
  status: not-started
  evidence: []

- id: fx.blur-sharpen.channel-blur
  name: Channel Blur
  sources:
    - ref: S02
      item: Channel Blur
      category: "Blur & Sharpen"
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S36
      item: Channel Blur
      category: "Blur & Sharpen"
      checked: true
  artist_can: >-
    Blur the red, green, blue and alpha channels by different amounts, for colour-fringe softness or to clean noise in one channel.
  projection_example: >-
    Blurs only the alpha of a hard-edged logo for a soft-edged mask on brick, while the colour stays crisp.
  controls:
    - { name: "Red / Green / Blue / Alpha Blurriness", type: "float[4]", animatable: true }
    - { name: "Edge Behavior (Repeat Edge Pixels)", type: "bool", animatable: false }
    - { name: "Blur Dimensions", type: "enum", animatable: false }
  animation: >-
    All blurriness values keyframable and expression-linkable.
  dependencies: [fx.blur-sharpen.gaussian-blur, fx.blur-sharpen.edge-overscan-policy]
  implementation: >-
    The Gaussian pass with a per-channel σ vector, using the pyramid path per channel when large. RGB is blurred un-premultiplied, alpha separately, then the result is re-premultiplied to avoid dark halos. Temporal: none. Bounds: + 3 × max σ. Precision: rgba16float with f32 accumulation.
  io: >-
    none
  limitations: >-
    none
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail blur or sharpen effect with no projection workflow behind it. Gaussian, directional, radial and fast box blur and the overscan policy stay required."
  milestone: D
  beginner:
    action: >-
      Reached through "Soften" → More controls → "Per colour".
    defaults: >-
      All channels 0 except the one chosen.
    automation: >-
      none
    usability_check: >-
      A first-time user softens only a logo's edge without blurring its colour, guided by the "Soft edge only" preset, in at most 3 actions.
  acceptance: >-
    Mini scene "soft-alpha": no dark fringe on an alpha-only blur over white.
  status: not-started
  evidence: []

- id: fx.blur-sharpen.compound-blur
  name: Compound Blur
  sources:
    - ref: S02
      item: Compound Blur
      category: "Blur & Sharpen"
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S36
      item: Compound Blur
      category: "Blur & Sharpen"
      checked: true
  artist_can: >-
    Blur different parts of a layer by different amounts using another layer's brightness as a blur map, for smudges, heat haze or smoke-obscured areas.
  projection_example: >-
    An animated turbulent-noise map makes a wall look as though seen through rising heat haze.
  controls:
    - { name: "Blur Layer", type: "layer-ref", animatable: false }
    - { name: "Maximum Blur", type: "float", animatable: true }
    - { name: "Stretch Map To Fit", type: "bool", animatable: false }
    - { name: "Invert Blur", type: "bool", animatable: false }
  animation: >-
    Maximum Blur keyframable; the blur layer may animate.
  dependencies: [proj.layer, fx.blur-sharpen.gaussian-blur, fx.blur-sharpen.edge-overscan-policy, fx.noise-grain.turbulent-noise]
  implementation: >-
    Variable-radius blur. A Gaussian pyramid is built once, then each pixel samples trilinearly at level log2(r) with r = map × Maximum Blur (Fast). Final quality uses a summed-area table (rgba32float) variable box gather, iterated twice. Reads the blur layer at t, after its effects (an improvement on After Effects, where the map is the layer source). Temporal: none. Bounds: + Maximum Blur. Precision: f32 SAT and rgba16float output.
  io: >-
    none
  limitations: >-
    The pyramid mode slightly overweights sharp map transitions; Final mode is exact.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Long-tail blur or sharpen effect with no projection workflow behind it. Gaussian, directional, radial and fast box blur and the overscan policy stay required."
  milestone: C
  beginner:
    action: >-
      "Heat haze" look, and "Soften using a pattern" under Soften.
    defaults: >-
      Generated turbulent-noise map, Maximum Blur 12.
    automation: >-
      Generates and animates the map layer; no manual layer needed.
    usability_check: >-
      A first-time user applies a heat-haze look to a wall in at most 3 actions and under 30 s.
  acceptance: >-
    Mini scene "heat-haze": Fast and Final modes differ by less than tolerance on reference maps.
  status: not-started
  evidence: []

- id: fx.blur-sharpen.directional-blur
  name: Directional Blur
  sources:
    - ref: S02
      item: Directional Blur
      category: "Blur & Sharpen"
      adobe_support: { gpu: true, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S36
      item: Directional Blur
      category: "Blur & Sharpen"
      checked: true
  artist_can: >-
    Streak a layer in one direction to suggest fast motion.
  projection_example: >-
    Text streaks horizontally as it whooshes across the facade.
  controls:
    - { name: "Direction", type: "angle", animatable: true }
    - { name: "Blur Length", type: "float", animatable: true }
  animation: >-
    Keyframable and expression-linkable; can be linked to layer velocity.
  dependencies: [proj.effect-stack, fx.blur-sharpen.edge-overscan-policy, expr.engine]
  implementation: >-
    Line-integral blur along a unit vector, symmetric about the pixel (0° and 180° are equal, per S36). Iterated jump passes with doubling tap spacing (4 to 8 bilinear taps each) give O(log L) cost. Temporal: none. Bounds: + L/2 along the direction. Precision: f32 accumulation.
  io: >-
    none
  limitations: >-
    Not true motion blur (no time sampling); see the Time effects for motion blur.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Motion streak" look; drag the arrow on the canvas for direction and length.
    defaults: >-
      Direction from the layer's motion path when animated, length 30 px.
    automation: >-
      An optional expression links the streak to the layer's speed.
    usability_check: >-
      A first-time user adds a streak matching a moving title's direction in at most 3 actions.
  acceptance: >-
    Mini scene "title-whoosh": the O(log L) path matches a brute-force reference within tolerance.
  status: not-started
  evidence: []

- id: fx.blur-sharpen.fast-box-blur
  name: Fast Box Blur
  sources:
    - ref: S02
      item: Fast Box Blur
      category: "Blur & Sharpen"
      adobe_support: { gpu: true, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S36
      item: Fast Box Blur
      category: "Blur & Sharpen"
      checked: true
  artist_can: >-
    Blur quickly at any size, with Iterations controlling boxy versus smooth, including very large soft washes.
  projection_example: >-
    A huge 400 px blur turns a projected video into a soft ambient colour wash behind the main content.
  controls:
    - { name: "Blur Radius", type: "float", animatable: true }
    - { name: "Iterations", type: "int", animatable: true }
    - { name: "Blur Dimensions (Horizontal and Vertical, Horizontal, Vertical)", type: "enum", animatable: false }
    - { name: "Repeat Edge Pixels", type: "bool", animatable: false }
  animation: >-
    Radius and Iterations keyframable and expression-linkable.
  dependencies: [proj.effect-stack, fx.blur-sharpen.edge-overscan-policy]
  implementation: >-
    Each iteration is a separable running-sum box filter in compute, using per-tile local sums so the f32 sums never cancel catastrophically. Cost per pixel is independent of radius; three iterations approximate a Gaussian. Temporal: none. Bounds: + n·r per axis. Precision: f32 sums, rgba16float output.
  io: >-
    none
  limitations: >-
    S36 says it can replicate the Fast Blur (Legacy) result. Fast Blur (Legacy) itself belongs to the Obsolete category.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Reached through "Soften" when the size is large or the quality is "Fast".
    defaults: >-
      Iterations 3.
    automation: >-
      "Soften" switches between Gaussian and Fast Box automatically by size and performance budget, and tells the user.
    usability_check: >-
      A first-time user makes a 400 px ambient wash in at most 3 actions, and preview stays at least 24 fps at 1080p.
  acceptance: >-
    Mini scene "ambient-wash": 3 iterations match a Gaussian of equal variance within tolerance.
  status: not-started
  evidence: []

- id: fx.blur-sharpen.gaussian-blur
  name: Gaussian Blur
  sources:
    - ref: S02
      item: Gaussian Blur
      category: "Blur & Sharpen"
      adobe_support: { gpu: true, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S36
      item: Gaussian Blur
      category: "Blur & Sharpen"
      checked: true
  artist_can: >-
    Soften any layer smoothly, from a slight softening to a huge diffuse blur. It is also the building block of glows, soft masks and many looks.
  projection_example: >-
    Softens a light trace so the glow around the roofline reads as light rather than a hard line.
  controls:
    - { name: "Blurriness", type: "float", animatable: true }
    - { name: "Blur Dimensions (Horizontal and Vertical, Horizontal, Vertical)", type: "enum", animatable: false }
    - { name: "Repeat Edge Pixels", type: "bool", animatable: false }
  animation: >-
    Blurriness keyframable, expression-linkable and audio-drivable (for example, pulses on the beat).
  dependencies: [proj.effect-stack, anim.keyframe.core, fx.blur-sharpen.edge-overscan-policy]
  implementation: >-
    Separable two-pass compute (rows then columns) with workgroup shared-memory tiles and f32 accumulation. For σ > 8 px it descends a 2× mip chain (Kawase/box prefilter) to the level where the residual σ ≤ 8, blurs there, and upsamples with a tent filter; this must match a full-resolution Gaussian within 1/1024 RMS. Temporal: current frame only. Bounds: + 3σ per blurred axis, or none with Repeat Edge Pixels (clamped). Precision: rgba16float premultiplied.
  io: >-
    none
  limitations: >-
    S36 notes it renders slightly differently from Gaussian Blur (Legacy), which is registered under the Obsolete category. The layer quality switch does not affect it, as in After Effects.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "Soften" on any selection, with a single Amount slider. It is also used inside "Make it glow".
    defaults: >-
      Amount = 0.5% of the region diagonal. Edges follow the overscan policy.
    automation: >-
      Scales with preview resolution. Chooses the pyramid path for large sizes. Picks the edge mode.
    usability_check: >-
      A first-time user softens a selected layer in at most 3 actions and under 20 s, with no dark border in the result.
  acceptance: >-
    AS-1 (glow on the roofline trace) and mini scene "soft-trace": preview at half resolution matches export within tolerance.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

