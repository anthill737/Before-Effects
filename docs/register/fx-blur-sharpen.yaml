  io: >-
    none
  limitations: >-
    S36 still documents Box Blur (8, 16 and 32-bpc) and says the Fast Box Blur match name is ADBE Box Blur2, while the old match name ADBE Box Blur still applies it under the old name Box Blur. The S02 matrix lists only Fast Box Blur, so the Box Blur support data there is unknown. Controls and outcome are identical, so nothing useful is lost.
  disposition: superseded
  superseded_by: fx.blur-sharpen.fast-box-blur
  exclusion_reason: null
  milestone: C
  beginner:
