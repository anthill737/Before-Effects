        mfr: true
      checked: true
    - ref: S11
      item: IDentifier effect (fnord ProEXR)
      category: 3D Channel
      checked: true
  artist_can: >-
    Show a render's ID channel as distinct colours, or output a matte for one chosen ID, to find and isolate objects.
  projection_example: >-
    Show all object IDs as colours to find which ID belongs to the rooftop ornaments.
  controls:
    - { name: Channel info (ID channel picker), type: channel-ref, animatable: false }
