- id: fx.3d-channel.exr-pass-explode
  name: Open render passes (multi-channel EXR layers)
  sources:
    - ref: S11
      item: ProEXR Comp Creator and OpenEXR_channel_map.txt channel tagging
      category: 3D Channel
      checked: true
    - ref: brief
      item: §10 multi-channel EXR and Cryptomatte workflows; depth units and alpha conventions
      category: product requirement
      checked: true
  artist_can: >-
    Open a multi-pass render as one layer per pass, already stacked so it rebuilds the beauty. Each light pass can then be adjusted without re-rendering.
  projection_example: >-
    Open a 20-pass Blender EXR of the facade animation and brighten only the emission pass of the windows.
  controls:
    - { name: Passes to import, type: string-list, animatable: false }
    - { name: Channel map preset (Blender / Arnold / V-Ray / Redshift / Octane / custom), type: enum, animatable: false }
    - { name: Rebuild mode (additive light passes / beauty plus utility passes), type: enum, animatable: false }
  animation: >-
    Not animated; generated layers are ordinary animatable layers.
  dependencies: [proj.precompose, proj.layer, mask.blend-modes, color.management, fx.3d-channel.extractor]
  implementation: >-
    The OpenEXR Python sidecar enumerates parts, layers and channels and tags them through an editable channel map (depth, normal, position, UV, IDs, crypto*, light passes), the equivalent of OpenEXR_channel_map.txt. An undoable op creates a precomp with one EXtractoR layer per pass, Add blending for light passes and hidden utility passes. It reports the difference between the rebuild and the beauty, and records depth units and alpha convention per plane.
  io: >-
    EXR import (multi-part, tiled). Aux planes travel with the layer through precomps and render to multi-channel EXR on export where requested.
  limitations: >-
    Rebuild exactness depends on the renderer's pass set. Missing passes are reported, not invented.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "3D-channel effects serve After Effects render-pass compositing. Projection depth illusions use pass.depth, pass.depth-fog, pass.depth-matte and displacement instead."
  milestone: D
  beginner:
    action: >-
      Dropping a multi-pass EXR asks "Open as separate passes?"; each pass appears with a plain name such as "Window glow (emission)".
    defaults: >-
      Preset detected from channel names; light passes visible, utility passes hidden.
    automation: >-
      Detects the renderer, builds the stack, and verifies the rebuild against the beauty.
    usability_check: >-
      A first-time user opens the supplied EXR as passes and brightens one pass in under 60 s without knowing EXR channel names.
  acceptance: >-
    Mini scene "exr-rebuild": rebuild equals beauty within float tolerance; a pass tweak exports correctly.
  status: not-started
  evidence: []
