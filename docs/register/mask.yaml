  milestone: C
  beginner:
    action: >-
      "Give it depth" → Raised / Carved.
    defaults: >-
      Inner bevel, smooth, 100% depth, size at 2% of the layer height, and Global Light 120° at 30° altitude.
    automation: >-
      Matches the light angle to the venue's chosen virtual light direction when one is set.
    usability_check: >-
      A novice makes a panel look raised in 1 action and switches to carved in 1 more.
  acceptance: >-
    Mini scene "style-stack": all 5 styles match references; AS-3 bevelled blocks render consistently after reopen.
  status: not-started
  evidence: []

- id: mask.style.satin
  name: Satin style
  sources:
    - ref: S33
      item: "Satin"
      category: "Blending modes and layer styles"
      checked: false
  artist_can: >-
    Add soft internal shading that follows the layer's shape, giving a silky or liquid sheen.
  projection_example: >-
    Give projected ribbon-like shapes a liquid-metal sheen that shifts as their angle animates.
  controls:
    - { name: "Blend mode", type: "enum(multiply|screen|normal|overlay)", animatable: false }
    - { name: "Color", type: "color", animatable: true }
    - { name: "Opacity", type: "percent", animatable: true }
    - { name: "Angle", type: "angle", animatable: true }
    - { name: "Distance", type: "float", animatable: true }
    - { name: "Size", type: "float", animatable: true }
    - { name: "Invert", type: "bool", animatable: false }
  animation: >-
    Angle, distance, size, color and opacity are keyframable.
  dependencies: [mask.layer-styles]
  implementation: >-
    Two copies of the blurred alpha, offset in opposite directions by angle and distance, are differenced, clipped to
    the layer alpha, and composited with the mode.
  io: >-
    Maps from PSD Satin, without contour.
  limitations: >-
    Contour shaping from Photoshop is not supported.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "After Effects layer-style, roto or blend-mode parity detail. Masks, feather, expansion, mattes, region links, Normal/Add/Multiply blending and colour-space blending stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Turn it to liquid metal" recipe → More controls.
    defaults: >-
      Multiply at 50%, angle 19°, and distance and size at 3% of the layer height.
    automation: >-
      The recipe animates the angle slowly for a living sheen.
    usability_check: >-
      A novice applies the liquid-metal look in no more than 3 actions.
  acceptance: >-
    Mini scene "style-stack": the satin style matches the reference.
  status: not-started
  evidence: []

- id: mask.style.color-overlay
  name: Color overlay style
  sources:
    - ref: S33
      item: "Color Overlay"
      category: "Blending modes and layer styles"
      checked: false
  artist_can: >-
    Fill the layer's visible area with a single color using a chosen blend mode and opacity, without editing its source.
  projection_example: >-
    Turn every window silhouette pure white for a flash-on-the-beat moment, then back to its texture.
  controls:
    - { name: "Blend mode", type: "enum(normal|multiply|screen|overlay|color)", animatable: false }
    - { name: "Color", type: "color", animatable: true }
    - { name: "Opacity", type: "percent", animatable: true }
  animation: >-
    Color and opacity are keyframable, which suits beat-driven flashes.
  dependencies: [mask.layer-styles]
  implementation: >-
    Composites a constant color clipped to the layer alpha onto the fill, using the selected mode.
  io: >-
    Maps from PSD Color Overlay.
  limitations: >-
    None beyond those of the framework.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "After Effects layer-style, roto or blend-mode parity detail. Masks, feather, expansion, mattes, region links, Normal/Add/Multiply blending and colour-space blending stay required."
  milestone: C
  beginner:
    action: >-
      "Tint it / Flash a color".
    defaults: >-
      White, Normal mode, 100% opacity, toggled off at rest.
    automation: >-
      Flash recipes key the opacity to beat markers (audio.analysis).
    usability_check: >-
      A novice makes shapes flash white on 4 beats in under 2 minutes using the recipe.
  acceptance: >-
    Mini scene "beat-flash": overlay flashes land on the same frames in preview and export.
  status: not-started
  evidence: []

- id: mask.style.gradient-overlay
  name: Gradient overlay style
  sources:
    - ref: S33
      item: "Gradient Overlay"
      category: "Blending modes and layer styles"
      checked: false
  artist_can: >-
    Fill the layer's visible area with a linear, radial, angle, reflected or diamond gradient that can be rotated,
    scaled and offset.
  projection_example: >-
    Wash projected letters with a sunset gradient whose angle slowly turns over the course of the song.
  controls:
    - { name: "Blend mode", type: "enum(normal|multiply|screen|overlay|color)", animatable: false }
    - { name: "Opacity", type: "percent", animatable: true }
    - { name: "Colors", type: "gradient", animatable: true }
    - { name: "Gradient smoothness", type: "percent", animatable: true }
    - { name: "Angle", type: "angle", animatable: true }
    - { name: "Style", type: "enum(linear|radial|angle|reflected|diamond)", animatable: false }
    - { name: "Reverse", type: "bool", animatable: false }
    - { name: "Align with layer", type: "bool", animatable: false }
    - { name: "Scale", type: "percent", animatable: true }
    - { name: "Offset", type: "point2d", animatable: true }
  animation: >-
    Colors, angle, scale, offset and opacity are keyframable.
  dependencies: [mask.layer-styles]
  implementation: >-
    A WGSL gradient evaluator shared with shape.gradient-fill, interpolating in linear light with optional dithering to
    avoid banding. The result is clipped to the layer alpha.
  io: >-
    Maps from PSD Gradient Overlay.
  limitations: >-
    Gradient interpolation in linear light can look different from Photoshop's gamma interpolation. A per-gradient
    "perceptual" option preserves the designed look.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "After Effects layer-style, roto or blend-mode parity detail. Masks, feather, expansion, mattes, region links, Normal/Add/Multiply blending and colour-space blending stay required."
  milestone: C
  beginner:
    action: >-
      "Color it with a gradient", with on-canvas handles for direction.
    defaults: >-
      Two colors sampled from the project palette, linear style, aligned with the layer.
    automation: >-
      Adds dithering automatically when the output is 8-bit.
    usability_check: >-
      A novice applies and rotates a gradient on text in under 45 s.
  acceptance: >-
    Mini scene "style-stack": the gradient overlay shows no visible banding in 8-bit H.264 export.
  status: not-started
  evidence: []

- id: mask.style.stroke
  name: Stroke style
  sources:
    - ref: S33
      item: "Stroke"
      category: "Blending modes and layer styles"
      checked: false
    - ref: "brief §6"
      item: "stroke ... layer treatments"
      category: "Masks, mattes, compositing and layer styles"
      checked: true
  artist_can: >-
    Outline the layer's visible shape (of any layer type, including video with alpha) with a colored stroke placed
    outside, inside or centred on the edge.
  projection_example: >-
    Outline a keyed performer composite with a thin bright line so they read clearly against the busy facade.
  controls:
    - { name: "Color", type: "color", animatable: true }
    - { name: "Size", type: "float", animatable: true }
    - { name: "Opacity", type: "percent", animatable: true }
    - { name: "Position", type: "enum(outside|inside|center)", animatable: false }
    - { name: "Blend mode", type: "enum(normal|screen|add|multiply)", animatable: false }
  animation: >-
    Color, size and opacity are keyframable.
  dependencies: [mask.layer-styles]
  implementation: >-
    Thresholds the signed alpha distance field at the stroke band ([0, size] outside, [−size, 0] inside, or centred).
    It is antialiased from the SDF gradient and composited on top of the other styles.
  io: >-
    Maps from PSD Stroke (color fill type only).
  limitations: >-
    Gradient and pattern stroke fills from Photoshop are not mapped. Vector strokes on shapes use shape.stroke and stay
    sharper at large scale.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "After Effects layer-style, roto or blend-mode parity detail. Masks, feather, expansion, mattes, region links, Normal/Add/Multiply blending and colour-space blending stay required."
  milestone: C
  beginner:
    action: >-
      "Outline it".
    defaults: >-
      White, outside, size at 1% of the layer height.
    automation: >-
      Suggests shape.stroke instead when the layer is already a vector shape, for sharper results.
    usability_check: >-
      A novice outlines a keyed figure in 1 action and changes the outline color in 1 more.
  acceptance: >-
    AS-4: a stroked keyed composite shows no gaps or fringes along the edge.
  status: not-started
  evidence: []

- id: mask.style.blending-options
  name: Layer style blending options
  sources:
    - ref: S33
      item: "Blending Options (Global Light Angle/Altitude, Advanced Blending: Fill Opacity, Knockout, Blend Interior Styles as Group, Use Blend Ranges from Source)"
      category: "Blending modes and layer styles"
      checked: false
  artist_can: >-
    Fade the layer's own fill while keeping its styles. Set a comp-wide light angle that every shadow and bevel shares.
    Control how interior styles group and knock out.
  projection_example: >-
    Make letters invisible except for their glowing outline and bevel (Fill Opacity 0%), with all shadows sharing one
    light direction.
  controls:
    - { name: "Global light angle", type: "angle", animatable: true }
    - { name: "Global light altitude", type: "angle", animatable: true }
    - { name: "Fill opacity", type: "percent", animatable: true }
    - { name: "Red / green / blue channels", type: "bool", animatable: false }
    - { name: "Knockout", type: "enum(none|shallow|deep)", animatable: false }
    - { name: "Blend interior styles as group", type: "bool", animatable: false }
    - { name: "Use blend ranges from source", type: "bool", animatable: false }
  animation: >-
    Global light and fill opacity are keyframable. Global light lives on the comp and drives every style with
    "use global light" enabled.
  dependencies: [mask.layer-styles]
  implementation: >-
    Global light is a comp-level property read by style passes. Fill opacity scales the layer fill before interior
    styles. Knockout and channel options alter which accumulated comp buffer the layer composites against, in the
    style pass graph.
  io: >-
    Maps from PSD blending options where an equivalent exists. Unsupported options are reported.
  limitations: >-
    Deep knockout across nested comps is limited to the current comp. Blend-If ranges are honoured only when imported
    with the source.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "After Effects layer-style, roto or blend-mode parity detail. Masks, feather, expansion, mattes, region links, Normal/Add/Multiply blending and colour-space blending stay required."
  milestone: D
  beginner:
    action: >-
      "Outline only" (fill off, style on) in the style card. Global light appears as "Light direction for all shadows".
    defaults: >-
      Fill 100%, global light at 120° angle and 30° altitude, knockout none.
    automation: >-
      Changing one shadow's angle with "use global light" on updates every linked style, with an on-canvas note.
    usability_check: >-
      A novice makes letters show only their glow and outline in 1 toggle, and turns every shadow together with 1 drag.
  acceptance: >-
    Mini scene "style-stack": fill-opacity and global-light changes propagate to all styles in preview and export.
  status: not-started
  evidence: []

- id: mask.area-holes
  name: Holes and cut-outs in a building area
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "Building-area holes and cutouts"
      category: "Building areas"
      checked: true
  artist_can: >-
    Cut holes in an area, such as a door in a wall or a window in a panel, so content appears around them but not in
    them. Holes are drawn like any outline, can be nested, and stay attached to the area.
  projection_example: >-
    A brick wall area has holes for six windows. The brick animation fills the wall but not the windows, and each
    window plays its own water.
  controls:
    - { name: "Hole outlines", type: "path list", animatable: false }
    - { name: "Cut out another area", type: "action", animatable: false }
    - { name: "Island inside a hole", type: "bool", animatable: false }
    - { name: "Hole edge feather and expansion", type: "inherit or override", animatable: true }
  animation: >-
    Hole outlines may be animated through mask.path-animation. Holes themselves are static area geometry.
  dependencies: [map.region, mask.bezier, mask.from-region, mask.feather, mask.expansion, shape.merge-paths, tool.region-link]
  implementation: >-
    An area outline is an outer path plus hole paths with even-odd fill. Region-linked masks and mattes
    (mask.from-region, tool.region-link) use the compound path built with Skia path ops, so feather and expansion
    apply to the hole edges. "Cut out" subtracts another area and keeps a link, so correcting the window outline also
    corrects the hole. Holes do not change the identity of the area.
  io: >-
    Part of the venue package.
  limitations: >-
    Holes are creative coverage. Light that must never reach a window is an output safety mask (out.output-mask).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Select an area, then "Add a hole": draw it, or click another area to cut it out.
    defaults: >-
      Holes inherit the area's feather and expansion.
    automation: >-
      Detects openings drawn inside an area and offers to turn them into holes.
    usability_check: >-
      A first-time user cuts a door out of a wall area in under 30 s.
  acceptance: >-
    Mini scene "wall-with-windows": one wall area with holes and separate content in the holes; area edit updates
    both.
  status: not-started
  evidence: []

- id: mask.area-defaults
  name: Per-area feather and expansion defaults
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "Per-area feather and expansion defaults"
      category: "Building areas"
      checked: true
  artist_can: >-
    Set feather (soft edge) and expansion (grow or shrink) once on an area, a group or the whole building. Every use
    of the area inherits it, and any single use can override it.
  projection_example: >-
    All 24 windows pull in 4 mm and soften 6 mm to hide a small calibration error. The tall arched window overrides to
    8 mm.
  controls:
    - { name: "Feather", type: "length", animatable: true }
    - { name: "Expansion (negative shrinks)", type: "length", animatable: true }
    - { name: "Falloff", type: "enum(smooth, linear)", animatable: false }
    - { name: "Scope (area, group, building)", type: "enum", animatable: false }
  animation: >-
    Feather and expansion can be keyframed on the use of an area, not on the default.
  dependencies: [mask.feather, mask.expansion, mask.variable-feather, map.region, map.region-group, ux.override-indicator]
  implementation: >-
    The venue region carries defaultMask {feather, expansion, falloff}. Group and building levels cascade. The
    evaluator resolves the effective value at use time in physical units (metres on the surface) and converts to
    pixels at the current content resolution, so changing preview resolution does not change the look. Overrides are
    tracked recipe overrides.
  io: >-
    Part of the venue package.
  limitations: >-
    Units on curved or sloped surfaces follow the surface scale at the area centroid.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Select areas, then "Soften edge" and "Grow / shrink" sliders in the area card.
    defaults: >-
      Feather 0.5% of the area width, expansion 0.
    automation: >-
      Applies the same defaults to new areas in a group and converts units for any preview resolution.
    usability_check: >-
      A first-time user softens every window edge in one action.
  acceptance: >-
    Mini scene "area-edges": defaults on a group, one override; preview at Half and Quarter look the same.
  status: not-started
  evidence: []

- id: mask.area-scene-adjust
  name: Scene-specific mask adjustment over a shared outline
  sources:
    - ref: "brief 2026-10-02 (projection scope)"
      item: "Scene-specific mask adjustment versus the shared outline"
      category: "Building areas"
      checked: true
  artist_can: >-
    In one scene, adjust how an area's mask behaves (more feather, grow, shift, nudge a few points) without changing
    the outline that every other scene uses. "Reset to area" goes back, and "Apply to area" promotes the change to all
    scenes.
  projection_example: >-
    In the finale the glow spills 20 mm past the windows, while the other scenes keep the tight outline.
  controls:
    - { name: "Scene feather override", type: "length", animatable: true }
    - { name: "Scene expansion override", type: "length", animatable: true }
    - { name: "Scene offset", type: "point2d", animatable: true }
    - { name: "Point nudges", type: "point list", animatable: false }
    - { name: "Reset to area / Apply to area", type: "action", animatable: false }
  animation: >-
    Overrides may be keyframed in the scene.
  dependencies: [mask.area-defaults, map.region, tool.region-link, ux.override-indicator, proj.composition]
  implementation: >-
    A scene-level override record on the region reference: the region id plus a delta (feather, expansion, offset,
    point nudges). Evaluation is the shared outline from the venue plus the scene delta, so later outline corrections
    still reach every scene. "Apply to area" writes the delta into the area as one undoable operation. Overrides use
    the existing override indicator.
  io: >-
    Stored in the scene, not the venue.
  limitations: >-
    Nudged points follow the outline only while the point count is unchanged. If the outline is rebuilt, the nudges
    are flagged for review.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      In a scene, edit an area's edge and choose "Only in this scene" or "Everywhere".
    defaults: >-
      Edits apply to this scene only until promoted.
    automation: >-
      Keeps the shared outline untouched and shows the override badge.
    usability_check: >-
      A first-time user widens one glow in one scene and sees the other scenes unchanged.
  acceptance: >-
    Mini scene "two-scenes-one-outline": scene override, then outline correction reaches both scenes.
  status: not-started
  evidence: []
