- id: mask.blend.dissolve
  name: Dissolve and Dancing Dissolve
  sources:
    - ref: S33
      item: "Dissolve, Dancing Dissolve"
      category: "Blending modes and layer styles"
      checked: false
  artist_can: >-
    Turn partial transparency into a random scatter of fully opaque pixels, either static (Dissolve) or changing every
    frame (Dancing Dissolve).
  projection_example: >-
    Make a fading layer break up into glittering pixel dust as it disappears from a wall.
  controls:
    - { name: "Mode", type: "enum(dissolve|dancing-dissolve)", animatable: false }
    - { name: "Seed", type: "seed", animatable: false }
  animation: >-
    Driven by layer opacity and feathered edges. Dancing Dissolve re-randomizes per frame.
  dependencies: [mask.blend-modes, expr.stable-random]
  implementation: >-
    A WGSL hash-based threshold per pixel. The hash is seeded from the layer ID and seed, plus the frame index for
    Dancing Dissolve, so preview and export match exactly.
  io: >-
    None.
  limitations: >-
    Pixel-scale noise can alias or shimmer once projection-mapped and resampled. The scatter scale is defined in comp
    pixels, not projector pixels.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "After Effects layer-style, roto or blend-mode parity detail. Masks, feather, expansion, mattes, region links, Normal/Add/Multiply blending and colour-space blending stay required."
  milestone: D
