  name: Drop shadow style
  sources:
    - ref: S33
      item: "Drop Shadow"
      category: "Blending modes and layer styles"
      checked: false
  artist_can: >-
    Cast a soft, offset shadow from the layer's outline onto the layers behind it, with control over angle, distance,
    spread and size.
  projection_example: >-
    Give flat letters a shadow on the wall so they seem to float a few centimetres off the facade.
  controls:
    - { name: "Blend mode", type: "enum(normal|multiply|linear-burn|darken)", animatable: false }
    - { name: "Color", type: "color", animatable: true }
    - { name: "Opacity", type: "percent", animatable: true }
    - { name: "Use global light", type: "bool", animatable: false }
    - { name: "Angle", type: "angle", animatable: true }
    - { name: "Distance", type: "float", animatable: true }
    - { name: "Spread", type: "percent", animatable: true }
    - { name: "Size", type: "float", animatable: true }
    - { name: "Noise", type: "percent", animatable: true }
    - { name: "Layer knocks out drop shadow", type: "bool", animatable: false }
  animation: >-
    All numeric and color controls are keyframable. Angle follows Global Light when linked.
  dependencies: [mask.layer-styles]
  implementation: >-
    The alpha distance field is offset by the angle and distance, thresholded by spread, and blurred by size (separable
    Gaussian). It is composited beneath the layer with the chosen mode, and knockout multiplies by (1 − layer alpha).
  io: >-
    Maps from PSD Drop Shadow.
  limitations: >-
    This is a 2D illusion. Physically consistent shadows from a 3D light are handled by 3d.light.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "After Effects layer-style, roto or blend-mode parity detail. Masks, feather, expansion, mattes, region links, Normal/Add/Multiply blending and colour-space blending stay required."
  milestone: C
  beginner:
    action: >-
      "Add a shadow", with a drag handle on the canvas to set angle and distance.
    defaults: >-
      Black at 60% opacity, angle from Global Light (120°), and distance and size at 2% of the layer height.
    automation: >-
      When an audience viewpoint and venue light direction are known, offers a matching angle.
    usability_check: >-
      A novice adds a shadow and sets its direction by dragging, in under 30 s.
  acceptance: >-
