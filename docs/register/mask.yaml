    defaults: >-
      Alpha Add on generated adjoining fragments.
    automation: >-
      Fragment recipes set Alpha Add on pieces that share edges, so seams never appear.
    usability_check: >-
      In the "Crack and rebuild" recipe, novices observe no seam lines; 0 of 5 testers report seams.
  acceptance: >-
    AS-3: reassembled fragments show no seam in the exported frames (pixel test along the shared edges).
  status: not-started
  evidence: []

- id: mask.blend-color-space
  name: Blending color space (linear versus gamma)
  sources:
    - ref: S33
      item: "Blend colors using 1.0 gamma (project setting)"
      category: "Blending modes and layer styles"
      checked: false
    - ref: "brief §14"
      item: "linear-light compositing where appropriate"
      category: "Color precision and image quality"
      checked: true
  artist_can: >-
    Choose whether layers blend in linear light, which is physically natural for light-on-light, or in display gamma,
    which matches the classic AE and Photoshop look. Overrides can be set per comp.
  projection_example: >-
    Keep linear blending for glowing light traces, but switch a graphic poster-style comp to gamma blending so its
    multiply textures look as designed in Photoshop.
  controls:
    - { name: "Blending space", type: "enum(linear|gamma-encoded)", animatable: false }
    - { name: "Per-comp override", type: "bool", animatable: false }
  animation: >-
    Not animatable.
  dependencies: [mask.blend-modes, color.management]
  implementation: >-
    The compositor keeps buffers scene-linear. In gamma mode the blend shader encodes both inputs to the working
    display-referred curve, blends, then decodes. This applies equally to mattes (luma) and to blend modes.
  io: >-
    Saved per project and per comp. Recorded in render manifests so exports are reproducible.
  limitations: >-
    The two settings give visibly different results for the same project. Switching is a creative change and is
    flagged as such, not a transparent one.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Hidden from the common workflow. In comp settings → More: "Mix like light (recommended)" or "Mix like paint
      (Photoshop look)".
    defaults: >-
      Linear (mix like light) for new projects. Gamma for comps created from imported layered PSD/AI files.
    automation: >-
      Chooses gamma for imported layered designs, so they match their source app, and shows a note explaining why.
    usability_check: >-
      Novices never need to touch it in the common journeys; 0 of 5 testers encounter it unprompted.
  acceptance: >-
    Mini scene "blend-chart" rendered in both spaces matches the reference set for each space.
  status: not-started
  evidence: []

- id: mask.layer-styles
  name: Layer styles (framework)
  sources:
    - ref: S33
      item: "Layer styles (add, copy/paste, Convert to Editable Styles from Photoshop)"
      category: "Blending modes and layer styles"
      checked: false
    - ref: "brief §6"
      item: "shadow, glow, stroke, bevel, and overlay-style layer treatments"
      category: "Masks, mattes, compositing and layer styles"
      checked: true
  artist_can: >-
    Add editable shadow, glow, bevel, satin, overlay and stroke treatments to a layer's outline. They stay live as the
    layer animates and can be copied between layers.
  projection_example: >-
    Give a projected logo a soft outer glow and a thin stroke that follow it as it flies across the facade.
  controls:
    - { name: "Enabled styles", type: "enum(drop-shadow|inner-shadow|outer-glow|inner-glow|bevel-emboss|satin|color-overlay|gradient-overlay|stroke)", animatable: false }
    - { name: "Style on/off", type: "bool", animatable: false }
    - { name: "Copy / paste styles", type: "action", animatable: false }
  animation: >-
    Every numeric and color parameter of every style is keyframable and expression-linkable.
  dependencies: [proj.layer, proj.effect-stack, mask.blend-modes]
  implementation: >-
    Styles are a fixed-order WGSL pass graph after the layer's effects and transform: shadows and outer glow below the
    fill, then fill with overlays, then inner effects and bevel, then stroke. Shared jump-flood distance fields of the
    layer alpha feed every style. Bounds expand by the largest size, spread or distance declared.
  io: >-
    Imported PSD layer styles map to equivalent styles (proj.layered-file-import). Exports are flattened.
  limitations: >-
    Contour curves, texture and pattern overlays from Photoshop are not supported initially; unmapped attributes are
    reported on import. AE parity on 3D layers needs a defined rule (styles render in layer space before 3D projection).
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "After Effects layer-style, roto or blend-mode parity detail. Masks, feather, expansion, mattes, region links, Normal/Add/Multiply blending and colour-space blending stay required."
  milestone: C
  beginner:
    action: >-
      "Make it glow", "Add a shadow", "Outline it", "Give it depth": one-click treatments with live preview on the
      selected layer.
    defaults: >-
      Sizes scale with the layer's on-screen size, so a treatment looks right on both small and large regions.
    automation: >-
      Adds the style, sets proportional sizes, and picks colors that contrast with the layer.
    usability_check: >-
      A first-time user adds a glow and an outline to a logo in no more than 3 actions each.
  acceptance: >-
    AS-1 (glow on traces) and mini scene "style-stack": all 9 styles on an animated logo render identically in preview
    and export.
  status: not-started
  evidence: []

