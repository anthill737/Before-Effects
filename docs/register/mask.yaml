# Masks, mattes, compositing and layer styles — Before Effects capability register
# Sources: S34 (masks), S07 (track mattes and traveling mattes), S33 (blending modes and layer styles), brief §0, §6. Adobe helpx pages returned HTTP 403 on 2026-10-01; Adobe items authored from knowledge (checked: false).

- id: mask.bezier
  name: Bezier masks
  sources:
    - ref: S34
      item: "Create masks (Pen tool, Rectangle/Rounded Rectangle/Ellipse/Polygon/Star mask tools)"
      category: "Masks"
      checked: false
    - ref: "brief §6"
      item: "animated Bezier masks"
      category: "Masks, mattes, compositing and layer styles"
      checked: true
  artist_can: >-
    Draw one or more closed or open Bezier masks on any layer, using a pen or a rectangle, ellipse, polygon or star
    tool, and edit vertices and tangents directly on the canvas to cut the layer to that shape.
  projection_example: >-
    Cut a looping brick-water texture to the outline of an arched doorway traced over the venue photo.
  controls:
    - { name: "Mask path", type: "path", animatable: true }
    - { name: "Drawing tool", type: "enum(pen|rectangle|rounded-rectangle|ellipse|polygon|star)", animatable: false }
    - { name: "Mask name", type: "string", animatable: false }
    - { name: "Mask color", type: "color", animatable: false }
    - { name: "Locked", type: "bool", animatable: false }
  animation: >-
    The mask path is a keyframable path property (see mask.path-animation); it can also be driven by an expression or
    by tracker data.
  dependencies: [shape.path, proj.layer, ux.operation-system]
  implementation: >-
    Masks share the core Bezier path type with shapes. Each mask is rasterized in layer space into an r16float coverage
    texture by a WGSL analytic-AA fill pass at render resolution. Creating, moving and deleting vertices are typed ops
    with Immer undo patches.
  io: >-
    Saved in the project as path data in layer coordinates. Paths can be pasted from SVG/AI imports (shape.vector-import)
    and converted to and from shapes (shape.mask-conversion).
  limitations: >-
    Masks are creative only and never act as physical output masks (mask.creative-vs-output). Self-intersecting paths use
    a non-zero fill rule; even-odd is not offered initially.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "Cut to a shape": draw on the canvas with click-to-place points or a rectangle or ellipse, or pick a traced region.
    defaults: >-
      New masks start in Add mode with a 0 px feather. Masks drawn over a selected region snap to its edges.
    automation: >-
      The app creates the mask on the selected layer, names it after the region or tool, and keeps the layer's other
      masks intact.
    usability_check: >-
      A first-time user cuts a video to a drawn window outline in under 60 s, with fewer than 3 undo steps, and without
      opening a property tree.
  acceptance: >-
    Mini scene "window-cutout": a texture masked to a hand-drawn window matches preview after save/reopen and export.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: mask.rotobezier
  name: RotoBezier masks
  sources:
    - ref: S34
      item: "RotoBezier"
      category: "Masks"
      checked: false
  artist_can: >-
    Draw masks whose curve tangents are computed automatically from the vertices, so a smooth outline can be placed and
    animated by moving points only, then converted to an ordinary Bezier when needed.
  projection_example: >-
    Quickly outline a rounded sculptural ornament on a facade without fiddling with tangent handles.
  controls:
    - { name: "RotoBezier", type: "bool", animatable: false }
    - { name: "Vertex tension", type: "percent", animatable: true }
  animation: >-
    Tension is stored per vertex inside the mask path keyframes, so changing it animates with the path.
  dependencies: [mask.bezier]
  implementation: >-
    Stored as a vertex list plus tension values. Tangents are derived during path evaluation using a Catmull-Rom-style
    construction matching the RotoBezier look, then cached as a regular Bezier for rasterization.
  io: >-
    Saved as RotoBezier vertices. Converting to Bezier bakes the tangents.
  limitations: >-
    The tangent formula is a functional equivalent and may not reproduce Adobe's exact curve.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "After Effects layer-style, roto or blend-mode parity detail. Masks, feather, expansion, mattes, region links, Normal/Add/Multiply blending and colour-space blending stay required."
  milestone: C
  beginner:
    action: >-
      "Smooth outline" toggle in the drawing toolbar, so a user can click around a curved object and get a smooth shape.
    defaults: >-
      Off for the pen. On when the user picks "Smooth outline", with 33% tension.
    automation: >-
      Computes the tangents, and converts to Bezier automatically when the user drags a tangent handle (one undoable op).
    usability_check: >-
      A novice outlines a round window with 6 clicks or fewer and gets a visually smooth curve without touching a
      tangent handle.
  acceptance: >-
    Mini scene "smooth-ornament": a RotoBezier outline animates smoothly through 3 keyframes and survives save/reopen.
  status: not-started
  evidence: []

- id: mask.modes
  name: Mask modes and inversion
  sources:
    - ref: S34
      item: "Mask modes (None, Add, Subtract, Intersect, Lighten, Darken, Difference) and Inverted"
      category: "Masks"
      checked: false
    - ref: "brief §6"
      item: "inversion, and Boolean combinations"
      category: "Masks, mattes, compositing and layer styles"
      checked: true
  artist_can: >-
    Combine several masks on one layer as Boolean operations: add, subtract, intersect, lighten, darken or difference.
    Each mask can be inverted, and a mask can be set to None so it only serves as a path for effects.
  projection_example: >-
    Add all twelve window masks together, then subtract the mullion bars so the texture shows only in the glass.
  controls:
    - { name: "Mode", type: "enum(none|add|subtract|intersect|lighten|darken|difference)", animatable: false }
    - { name: "Inverted", type: "bool", animatable: false }
  animation: >-
    Mode and inversion are not animatable (they match AE). Mask opacity, feather and path animate per mask.
  dependencies: [mask.bezier]
  implementation: >-
    A WGSL combine pass folds the per-mask coverage textures in stack order. With a = accumulated and m = mask
    coverage × opacity: add = a+m−am, subtract = a·(1−m), intersect = a·m, lighten = max, darken = min, difference = |a−m|.
    The first mask's mode is applied against an empty accumulator, except that a first Subtract or Intersect starts from
    full coverage (AE behaviour).
  io: >-
    Saved per mask.
  limitations: >-
    Parity with AE's edge cases (for example a stack that begins with Subtract) must be verified against reference
    renders, because the pages could not be checked.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "Add area / Cut away / Keep only overlap" buttons on the selected mask, plus "Flip inside and outside".
    defaults: >-
      The first mask is Add. A mask drawn while holding the "cut away" modifier becomes Subtract.
    automation: >-
      When a user selects excluded regions (for example a door), the app adds them as Subtract masks automatically.
    usability_check: >-
      A novice shows a texture in four windows but not in their mullions in under 2 minutes, using visible buttons only.
  acceptance: >-
    Mini scene "mask-boolean": a 7-mode test chart renders identically in preview and export, and matches the reference
    images within tolerance.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: mask.feather
  name: Mask feather
  sources:
    - ref: S34
      item: "Mask Feather (and Mask Feather Falloff: Smooth / Linear)"
      category: "Masks"
      checked: false
    - ref: "brief §6"
      item: "animated Bezier masks with feather"
      category: "Masks, mattes, compositing and layer styles"
      checked: true
  artist_can: >-
    Soften a mask's edge by a uniform amount, separately horizontally and vertically, with a smooth or linear falloff.
  projection_example: >-
    Fade a projected glow softly at the edges of a window so the edges do not read as a hard video rectangle.
  controls:
    - { name: "Feather", type: "size2d", animatable: true }
    - { name: "Feather falloff", type: "enum(smooth|linear)", animatable: false }
    - { name: "Link horizontal/vertical", type: "bool", animatable: false }
  animation: >-
    Feather is keyframable and expression-linkable per mask.
  dependencies: [mask.bezier, anim.keyframe.core]
  implementation: >-
    A jump-flood pass builds a signed-distance field from the mask edge. Coverage is then remapped across the feather
    width using a smoothstep or linear ramp. Anisotropic feather scales the distance field by the x/y ratio. Feather is
    centred on the path, as in AE.
  io: >-
    Saved per mask. The bounds expansion equals half the feather and is declared to the compositor.
  limitations: >-
    A distance-field feather differs slightly from AE's blur-based feather at sharp corners; the target is visual
    equivalence, not bit parity.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "Soften the edge" slider shown on the canvas next to the selected mask.
    defaults: >-
      Masks created from regions get a feather of 0.5% of the region size, so they do not alias on projection.
    automation: >-
      Scales the feather with the region and layer resolution, so a "soft" setting looks the same on a small window and
      a large wall.
    usability_check: >-
      A first-time user softens a window mask edge in 1 drag, without finding a property in the timeline.
  acceptance: >-
    Brief §6 acceptance: a texture appears only inside selected windows with animated soft reveals, and the exported
    alpha shows no dark or bright fringes.
  status: prototype
  evidence:
    - "unit: packages/core/test/core.test.ts (pnpm test)"
    - "spike: pnpm --filter @be/studio spike → spike-report.json (render, determinism, verified encodes)"
    - "journey: pnpm --filter @be/studio uitest → ui-test-report.json + step screenshots"

- id: mask.variable-feather
  name: Variable mask feather
  sources:
    - ref: S34
      item: "Mask Feather tool (variable-width mask feather, feather points)"
      category: "Masks"
      checked: false
  artist_can: >-
    Place feather points along a mask edge, each with its own radius, tension and direction (inside or outside), so the
    softness can vary around the outline.
  projection_example: >-
    Keep a hard edge where a reveal meets the roofline but let it dissolve softly where it meets the sky.
  controls:
    - { name: "Feather point position along path", type: "float", animatable: true }
    - { name: "Feather point radius", type: "float", animatable: true }
    - { name: "Feather point tension", type: "percent", animatable: true }
    - { name: "Feather point side", type: "enum(outer|inner)", animatable: false }
    - { name: "Corner style", type: "enum(round|sharp)", animatable: false }
  animation: >-
    Feather points are keyframed with the mask path. Each point is stored at a fixed proportion of its segment, so it
    stays in place when the path changes shape.
  dependencies: [mask.feather, mask.path-animation]
  implementation: >-
    Feather radius is interpolated along the path's arc-length parameter. The jump-flood distance field records the
    nearest-segment parameter, so each pixel looks up the local radius before the coverage remap.
  io: >-
    Saved as a feather-point list per mask.
  limitations: >-
    Extreme radius changes on tight concave corners can make the falloff look discontinuous, as they can in AE.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Reached through "Soften the edge" → More controls → "Soften only here", then click on the edge and drag outward.
    defaults: >-
      A new feather point copies the mask's current uniform feather.
    automation: >-
      Places matching points automatically where the mask meets a selected region boundary that should stay hard.
    usability_check: >-
      A novice gives a mask a hard top and a soft bottom in under 90 s, with no help text beyond on-canvas hints.
  acceptance: >-
    Mini scene "sky-fade-reveal": a variable-feather reveal animates for 5 s and renders identically after save/reopen.
  status: not-started
  evidence: []

- id: mask.expansion
  name: Mask expansion
  sources:
    - ref: S34
      item: "Mask Expansion"
      category: "Masks"
      checked: false
  artist_can: >-
    Grow or shrink the area a mask covers by a set number of pixels without editing its path.
  projection_example: >-
    Pull a window mask in by 4 px so the texture never touches the stone frame when calibration has a small error.
  controls:
    - { name: "Mask expansion", type: "float", animatable: true }
  animation: >-
    Keyframable and expression-linkable, for growing or shrinking reveals.
  dependencies: [mask.bezier, anim.keyframe.core]
  implementation: >-
    Applied as a threshold shift on the same signed-distance field used for feathering, then the feather ramp is applied.
    Positive values extend the declared bounds.
  io: >-
    Saved per mask.
  limitations: >-
    Corners round under large expansion, matching distance-field offset behaviour. For mitred geometric offsets use
    shape.offset-paths on a path copy.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Grow / shrink" slider beside "Soften the edge", and the "Keep away from the frame" option on region masks.
    defaults: >-
      0 px, or −0.25% of the region size when "Keep away from the frame" is on.
    automation: >-
      Suggests a safety inset from the calibration residual reported by map.calibration.
    usability_check: >-
      A novice insets every window mask in one action (multi-select, one slider) in under 30 s.
  acceptance: >-
    Mini scene "safe-inset": a uniform −4 px expansion across 10 window masks is preserved through export.
  status: not-started
  evidence: []

- id: mask.opacity
  name: Mask opacity
  sources:
    - ref: S34
      item: "Mask Opacity"
      category: "Masks"
      checked: false
  artist_can: >-
    Set how strongly each mask contributes, so one mask can partially reveal or partially cut away the layer.
  projection_example: >-
    Dim one window to 40% while the others stay fully lit during a sequence.
  controls:
    - { name: "Mask opacity", type: "percent", animatable: true }
  animation: >-
    Keyframable and expression-linkable. Useful with index-driven rigs to fade masks in sequence.
  dependencies: [mask.bezier, anim.keyframe.core]
  implementation: >-
    Multiplies the mask's coverage before the mode combine pass in mask.modes.
  io: >-
    Saved per mask.
  limitations: >-
    Affects only the mask's own contribution; it is not the same as layer opacity.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Reached through the "Light up one after another" recipe → More controls → per-window strength.
    defaults: >-
      100%.
    automation: >-
      Recipes animate mask opacity instead of duplicating layers when one layer covers several regions.
    usability_check: >-
      A novice dims one of five windows to half strength in under 45 s without opening the timeline.
  acceptance: >-
    Mini scene "window-dimmer": mask opacity keyframes produce the expected partial reveals in export.
  status: not-started
  evidence: []

- id: mask.path-animation
  name: Mask path animation
  sources:
    - ref: S34
      item: "Animate a mask path; Set First Vertex"
      category: "Masks"
      checked: false
    - ref: "brief §6"
      item: "animated Bezier masks"
      category: "Masks, mattes, compositing and layer styles"
      checked: true
  artist_can: >-
    Keyframe a mask's shape over time so it grows, shifts or morphs, and choose the first vertex that controls how
    points correspond between keyframes.
  projection_example: >-
    A reveal starts as a thin slit at the base of a door and opens to the full arch over two seconds.
  controls:
    - { name: "Mask path keyframes", type: "path", animatable: true }
    - { name: "Set first vertex", type: "action", animatable: false }
    - { name: "Spatial interpolation of vertices", type: "enum(linear|bezier)", animatable: false }
  animation: >-
    Uses the standard keyframe engine with temporal easing. Vertices interpolate in correspondence order from the first
    vertex. A different vertex count between keyframes triggers automatic resampling.
  dependencies: [mask.bezier, anim.keyframe.core]
  implementation: >-
    Path keyframes store vertex arrays. Evaluation interpolates each vertex and tangent with the keyframe's temporal
    ease. When vertex counts differ, both paths are resampled to a common count by arc length, aligned to the first
    vertex.
  io: >-
    Saved as path keyframes in flicks.
  limitations: >-
    Morphs between very different topologies may twist. mask.smart-interpolation gives finer control.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Reveal from here": drag the mask edge at two moments in the timeline. Also reached through the "Soft reveal" recipe.
    defaults: >-
      Easy-ease timing on new path keyframes.
    automation: >-
      Records a path keyframe automatically when the user edits a mask after moving the playhead (auto-key in guided
      mode), and fixes vertex correspondence.
    usability_check: >-
      A first-time user makes a door-opening reveal in under 2 minutes with 2 drags, and the motion has no twisting.
  acceptance: >-
    AS-3 and mini scene "door-reveal": the mask path animation scrubs and seeks identically after reopen.
  status: not-started
  evidence: []

- id: mask.smart-interpolation
  name: Smart mask interpolation
  sources:
    - ref: S34
      item: "Smart Mask Interpolation keyframe assistant"
      category: "Masks"
      checked: false
  artist_can: >-
    Generate intermediate mask keyframes between two very different shapes, with control over vertex matching,
    bending resistance and added vertices, for a clean morph.
  projection_example: >-
    Morph a square window outline into a circular rose-window outline without the edge folding over itself.
  controls:
    - { name: "Keyframe rate", type: "float", animatable: false }
    - { name: "Keyframe fields", type: "bool", animatable: false }
    - { name: "Use linear vertex paths", type: "bool", animatable: false }
    - { name: "Bending resistance", type: "percent", animatable: false }
    - { name: "Quality", type: "percent", animatable: false }
    - { name: "Add mask shape vertices", type: "enum(pixels-between|total-vertices|percent-of-outline)", animatable: false }
    - { name: "Matching method", type: "enum(auto|curve|polyline)", animatable: false }
    - { name: "Use 1:1 vertex matches / first vertices match", type: "bool", animatable: false }
  animation: >-
    Bakes ordinary mask path keyframes that remain fully editable afterwards.
  dependencies: [mask.path-animation]
  implementation: >-
    A core TS solver resamples both shapes, finds the correspondence by minimizing bending and stretching energy (a
    dynamic-programming match over the resampled points), and emits path keyframes as a single op. It runs in a worker
    for responsiveness.
  io: >-
    None. The output is ordinary keyframes.
  limitations: >-
    The algorithm is a functional equivalent, not Adobe's. Results on self-intersecting shapes are not guaranteed.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "After Effects layer-style, roto or blend-mode parity detail. Masks, feather, expansion, mattes, region links, Normal/Add/Multiply blending and colour-space blending stay required."
  milestone: D
  beginner:
    action: >-
      "Morph smoothly" button shown when two path keyframes have very different shapes.
    defaults: >-
      Auto matching, 50% bending resistance, and a keyframe rate equal to the comp frame rate.
    automation: >-
      Detects twisting in a plain interpolation and offers smart interpolation as a one-click fix.
    usability_check: >-
      A novice fixes a twisting square-to-circle morph with 1 click and judges the result clean in a 3-person test.
  acceptance: >-
    Mini scene "square-to-rose": the morph has no self-intersection on any frame (automated check), and the result is
    editable afterwards.
  status: not-started
  evidence: []

- id: mask.tracking
  name: Mask tracking
  sources:
    - ref: S34
      item: "Mask tracker (Position; Position & Rotation; Position, Scale & Rotation; Position, Scale, Rotation & Skew; Perspective)"
      category: "Masks"
      checked: false
  artist_can: >-
    Make a mask follow an object moving in footage by tracking the pixels inside it, with a choice of how much of the
    motion (position, rotation, scale, skew, perspective) the mask inherits.
  projection_example: >-
    Isolate a performer's face in filmed footage that is later composited into a window of the facade.
  controls:
    - { name: "Track method", type: "enum(position|position-rotation|position-scale-rotation|position-scale-rotation-skew|perspective)", animatable: false }
    - { name: "Track direction", type: "enum(forward|backward|frame-by-frame)", animatable: false }
    - { name: "Track range", type: "time", animatable: false }
  animation: >-
    Writes mask path keyframes that stay editable. Tracking can be resumed from a corrected keyframe.
  dependencies: [mask.path-animation, track.planar, track.point]
  implementation: >-
    Hands off to the vision sidecar trackers (track.planar for perspective and skew, track.point for the simpler
    methods). The resulting homography or affine per frame is applied to the mask vertices and committed as one op.
  io: >-
    Tracking data is cached per footage item and invalidated when the source or interpretation changes.
  limitations: >-
    Footage tracking only; this is not projector calibration. Low-texture or occluded regions need manual correction.
    AE's face-tracking modes are left to track.roto.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "After Effects layer-style, roto or blend-mode parity detail. Masks, feather, expansion, mattes, region links, Normal/Add/Multiply blending and colour-space blending stay required."
  milestone: D
  beginner:
    action: >-
      "Follow this in the video": with a mask selected on footage, press one button and watch it track.
    defaults: >-
      Position, scale and rotation, tracking forward from the current frame.
    automation: >-
      Chooses the perspective method automatically when it detects a planar surface. It flags frames with high tracking
      error for review.
    usability_check: >-
      A novice tracks a mask on a 5 s supplied clip with 1 action and corrects 1 flagged frame without help.
  acceptance: >-
    AS-4: the tracked mask on supplied footage stays within the tolerance of the ground-truth corners.
  status: not-started
  evidence: []

- id: mask.from-region
  name: Mask to venue regions
  sources:
    - ref: "brief §6"
      item: "a texture appears only inside selected windows"
      category: "Masks, mattes, compositing and layer styles"
      checked: true
    - ref: "brief §0.1"
      item: "select windows, choose an action; the app creates the necessary masks"
      category: "User experience"
      checked: true
  artist_can: >-
    Limit any layer to one or more named venue regions (windows, columns, walls), excluding others. The mask stays
    linked, so it updates when a region's outline is corrected.
  projection_example: >-
    Show flowing water only inside the twelve ground-floor windows. After the venue outline is refined on site, the
    mask follows automatically.
  controls:
    - { name: "Regions", type: "region-ref", animatable: false }
    - { name: "Excluded regions", type: "region-ref", animatable: false }
    - { name: "Live link to region", type: "bool", animatable: false }
    - { name: "Edge softness", type: "float", animatable: true }
    - { name: "Inset", type: "float", animatable: true }
  animation: >-
    Feather, inset and per-region opacity are animatable. The path itself comes from the region binding unless it is
    detached.
  dependencies: [map.region, mask.bezier, mask.modes, mask.feather, ux.recipe-engine]
  implementation: >-
    A linked mask references a region role. Mask evaluation resolves the role through the show's venue bindings and
    reprojects the region outline into layer space (UV or comp space). Detaching copies the path into a normal mask as
    one undoable op. A linked mask edited by hand becomes a tracked recipe override.
  io: >-
    Saved as a role reference, not a copied path, so a show can be rebound to another venue (AS-7).
  limitations: >-
    For true 3D surfaces the linked outline is valid only in the comp space it was projected into. View-dependent
    illusions need 3D-space masking, which is handled by map.model-3d.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "Only inside these windows": select regions on the canvas, then choose the action, or drag content onto a region.
    defaults: >-
      Live link on, with a small soft edge and inset scaled to the region size.
    automation: >-
      Builds the add and subtract masks, names them by role, and re-fits them whenever region geometry or venue binding
      changes.
    usability_check: >-
      A first-time user restricts a texture to 3 selected windows in no more than 3 deliberate actions, in under 30 s.
  acceptance: >-
    Brief §6 acceptance and AS-7: the texture shows only inside the selected windows. After rebinding to a second venue,
    the masks follow the new regions with no manual edits.
  status: not-started
  evidence: []

- id: mask.creative-vs-output
  name: Creative masks kept separate from output masks
  sources:
    - ref: "brief §6"
      item: "Keep creative masks separate from physical output masks"
      category: "Masks, mattes, compositing and layer styles"
      checked: true
  artist_can: >-
    Use creative masks freely, for example letting a glow spread beyond a window inside the composition. A separate
    installation output mask still stops light from reaching areas that must stay dark.
  projection_example: >-
    A neon glow spills artistically over the stone around a window in the content, but the projector output mask still
    blocks light on the neighbour's wall and the street signs.
  controls:
    - { name: "Mask kind (creative / output)", type: "enum(creative|output)", animatable: false }
    - { name: "Show output-mask overlay in preview", type: "bool", animatable: false }
  animation: >-
    Creative masks animate normally. Output masks are installation settings, versioned with calibration and not
    keyframed in content.
  dependencies: [mask.bezier, out.output-mask, map.region]
  implementation: >-
    The two are distinct types in the project model: creative masks live on layers in the show, while output masks live
    on projector outputs in the venue. No op converts one into the other silently, and "Copy as output mask" creates a
    new venue object. The output pipeline applies output masks after content rendering, exactly once.
  io: >-
    Output masks are exported in projector bundles. Creative masks are baked into content renders.
  limitations: >-
    Prevents confusing the two types; it cannot fix projector light that physically spills because of lens or surface
    scattering.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Preview shows a "Light allowed here" overlay from the installation. Content masks are edited in the Animate step
      and output masks in the Set up the space step.
    defaults: >-
      Masks drawn in the content steps are always creative masks.
    automation: >-
      Warns when content is masked to match an output exclusion (a likely misunderstanding), and offers to make it an
      output mask instead.
    usability_check: >-
      In a test, 4 of 5 novices correctly explain why a glow appears in the comp preview but not in the projector
      preview, using only on-screen labels.
  acceptance: >-
    AS-5 and mini scene "glow-spill": a glow crossing an output exclusion appears in the content master and is blocked
    in the projector export.
  status: not-started
  evidence: []

- id: mask.effect-masks
  name: Effect masks and effect opacity
  sources:
    - ref: S34
      item: "Effect Compositing Options (apply effect through masks, Effect Opacity)"
      category: "Masks"
      checked: false
    - ref: "brief §6"
      item: "editable effects ordering"
      category: "Masks, mattes, compositing and layer styles"
      checked: true
  artist_can: >-
    Limit one effect in a layer's stack to chosen masks and blend the effect's result with its input by an opacity,
    without splitting the layer.
  projection_example: >-
    Blur only the top band of a video where the cornice is, and leave the rest of the wall sharp.
  controls:
    - { name: "Compositing masks", type: "mask-ref", animatable: false }
    - { name: "Per-mask opacity", type: "percent", animatable: true }
    - { name: "Effect opacity", type: "percent", animatable: true }
  animation: >-
    Effect opacity and per-mask opacity are keyframable.
  dependencies: [proj.effect-stack, mask.bezier, mask.modes]
  implementation: >-
    After each effect pass, the effect stack runs a lerp pass: output = mix(input, effectOutput, opacity × combined mask
    coverage). The coverage is cached per mask set.
  io: >-
    Saved per effect instance.
  limitations: >-
    Effects that read neighbouring pixels may still pull image data from outside the mask, which is expected.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Only here" on any applied effect: paint or pick a region, and the effect applies only there.
    defaults: >-
      100% effect opacity, with no masks (the effect applies everywhere).
    automation: >-
      Picking a region creates a None-mode mask on the layer and wires it into that effect.
    usability_check: >-
      A novice restricts a blur to one region in no more than 3 actions without seeing the word "mask".
  acceptance: >-
    Brief §6 acceptance (reordering effects changes the result predictably), and mini scene "partial-blur".
  status: not-started
  evidence: []

- id: mask.track-matte
  name: Track mattes
  sources:
    - ref: S07
      item: "Track mattes and traveling mattes (Track Matte layer selector, any layer as matte)"
      category: "Transparency and compositing"
      checked: false
    - ref: "brief §6"
      item: "alpha and luminance track mattes, inverted mattes, reusable matte sources"
      category: "Masks, mattes, compositing and layer styles"
      checked: true
  artist_can: >-
    Use any other layer in the comp as a matte, so the target layer shows only where the matte layer is opaque (alpha)
    or bright (luma).
  projection_example: >-
    Use an animated text layer as a matte so a fire-like texture appears only inside the letters across the facade.
  controls:
    - { name: "Matte source layer", type: "layer-ref", animatable: false }
    - { name: "Matte type", type: "enum(alpha|luma)", animatable: false }
    - { name: "Invert", type: "bool", animatable: false }
    - { name: "Hide matte source from output", type: "bool", animatable: false }
  animation: >-
    The matte layer animates normally (transforms, masks, effects, keyframes). The matte assignment itself is not
    keyframed.
  dependencies: [proj.layer, proj.layer-order]
  implementation: >-
    Track matte is a layer property that references a layer ID, not stack adjacency (AE 2023+ behaviour). The compositor
    renders the matte layer through its full transform and effect stack into a comp-space texture, then multiplies the
    target layer's premultiplied color by the matte coverage before blending. Cycles (A matting B matting A) are
    rejected by the op validator.
  io: >-
    Saved as a layer reference. Legacy "matte must be the layer above" layouts import with the reference resolved.
  limitations: >-
    A matte source in another comp needs nesting, because cross-comp mattes are not referenced directly.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Show through this": drag a layer's matte picker onto another layer, or use the "Reveal through text/shape" recipe.
    defaults: >-
      Alpha matte, not inverted, and the matte source hidden from output.
    automation: >-
      Picks luma automatically when the chosen source has no alpha (for example a grayscale video). Hides the source and
      labels both layers as linked.
    usability_check: >-
      A novice makes a texture appear inside animated text in under 60 s and no more than 3 actions.
  acceptance: >-
    AS-4 and mini scene "texture-in-letters": the matte renders identically in preview and export, with no fringes on
    the letter edges.
  status: not-started
  evidence: []

- id: mask.matte-alpha
  name: Alpha matte
  sources:
    - ref: S07
      item: "Alpha Matte"
      category: "Transparency and compositing"
      checked: false
  artist_can: >-
    Reveal a layer only where the matte layer's pixels are opaque, using the matte's transparency as the stencil.
  projection_example: >-
    Reveal a starfield only inside an animated circular shape that grows from the centre of a rose window.
  controls:
    - { name: "Matte type = Alpha", type: "enum(alpha|luma)", animatable: false }
  animation: >-
    Follows the matte layer's animation.
  dependencies: [mask.track-matte]
  implementation: >-
    Coverage = matte premultiplied alpha. Target premultiplied rgba is multiplied by that coverage in the matte stage
    pass.
  io: >-
    None.
  limitations: >-
    Matte edges are only as clean as the source alpha. Straight-alpha sources must be interpreted correctly
    (proj.alpha-interpretation).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Show through this shape", the default whenever the source has transparency.
    defaults: >-
      Selected automatically when the matte source has a non-trivial alpha channel.
    automation: >-
      Detects alpha presence from source interpretation and chooses alpha or luma.
    usability_check: >-
      A novice reveals footage inside a shape without choosing a matte type explicitly, with 100% success across 5 testers.
  acceptance: >-
    Mini scene "alpha-matte-chart": a soft-edged matte composites without dark halos in a 16-bit EXR export.
  status: not-started
  evidence: []

- id: mask.matte-luma
  name: Luma matte
  sources:
    - ref: S07
      item: "Luma Matte"
      category: "Transparency and compositing"
      checked: false
  artist_can: >-
    Reveal a layer according to the brightness of the matte layer, so white shows the layer, black hides it, and gray is
    partially transparent.
  projection_example: >-
    Use a fractal-noise layer as a luma matte so a new material burns through the brick in organic patches.
  controls:
    - { name: "Matte type = Luma", type: "enum(alpha|luma)", animatable: false }
    - { name: "Luma coefficients", type: "enum(rec709|rec2020|working-space)", animatable: false }
  animation: >-
    Follows the matte layer's animation. Animated noise or gradient sources give traveling reveals.
  dependencies: [mask.track-matte, color.management]
  implementation: >-
    Coverage = luma(matte rgb) × matte alpha, computed in the working space with the working space's luma coefficients
    (Rec.709 by default). The result is clamped to 0–1 because scene-linear HDR values can exceed 1.
  io: >-
    None.
  limitations: >-
    In a linear working space, a mid-gray matte gives a different reveal than in a gamma-encoded AE project. The
    "Match AE (gamma) mattes" option in mask.blend-color-space resolves this.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Reached through the "Burn through" and "Organic reveal" recipes, or "Show through this" with a grayscale source.
    defaults: >-
      Chosen automatically for sources without alpha, using Rec.709 luma.
    automation: >-
      The recipe builds the noise or gradient source, sets luma, and animates the source's contrast or offset for the
      reveal.
    usability_check: >-
      A novice applies an organic reveal to a wall and changes its speed in under 2 minutes without touching the
      matte settings.
  acceptance: >-
    Mini scene "noise-burn-through": the luma reveal is deterministic after reopen and seek (AS-3 reproducibility).
  status: not-started
  evidence: []

- id: mask.matte-invert
  name: Inverted mattes
  sources:
    - ref: S07
      item: "Alpha Inverted Matte / Luma Inverted Matte (Invert toggle)"
      category: "Transparency and compositing"
      checked: false
    - ref: "brief §6"
      item: "inverted mattes"
      category: "Masks, mattes, compositing and layer styles"
      checked: true
  artist_can: >-
    Flip a matte, so the layer shows everywhere except where the matte is opaque or bright.
  projection_example: >-
    Hide content wherever a moving silhouette passes, so a performer's shadow seems to cut a hole in the projection.
  controls:
    - { name: "Invert", type: "bool", animatable: false }
  animation: >-
    Not animatable; animate the matte source instead.
  dependencies: [mask.track-matte]
  implementation: >-
    Coverage = 1 − coverage before the multiply, in the same matte stage pass.
  io: >-
    None.
  limitations: >-
    None beyond those of the underlying matte type.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Flip inside and outside" toggle on any "Show through this" link.
    defaults: >-
      Off.
    automation: >-
      None needed. The toggle is a single undoable op shown on canvas.
    usability_check: >-
      A novice inverts an existing matte in 1 click and confirms the effect in the preview without help.
  acceptance: >-
    Mini scene "cut-out-silhouette": an inverted luma matte matches an inverted alpha matte made from equivalent sources.
  status: not-started
  evidence: []

- id: mask.traveling-matte
  name: Traveling mattes and animated reveals
  sources:
    - ref: S07
      item: "Traveling mattes"
      category: "Transparency and compositing"
      checked: false
    - ref: "brief §6"
      item: "traveling reveals"
      category: "Masks, mattes, compositing and layer styles"
      checked: true
  artist_can: >-
    Animate the matte source (move it, grow it or play a video in it) so the revealed area travels across the target
    layer.
  projection_example: >-
    A soft-edged bar sweeps left to right across the facade, turning brick into glass as it passes.
  controls:
    - { name: "Reveal direction", type: "angle", animatable: true }
    - { name: "Reveal progress", type: "percent", animatable: true }
    - { name: "Edge softness", type: "float", animatable: true }
  animation: >-
    The matte source carries the keyframes. Recipe-level progress and direction controls drive them through expressions
    or generated keyframes.
  dependencies: [mask.track-matte, anim.keyframe.core, ux.recipe-engine]
  implementation: >-
    A recipe generates a matte source (gradient, shape or noise) with keyframed transforms or parameters and links it to
    the target as a track matte. Simplified controls write to the generated properties through the recipe-override
    mechanism (proj.recipe-override).
  io: >-
    None beyond the generated layers.
  limitations: >-
    Region-following sweeps rely on map.region geometry. A sweep on a non-planar 3D surface follows UV space, not world
    space, unless a 3D reveal is used.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Soft reveal": pick a direction and duration, and the new look sweeps across the selection.
    defaults: >-
      Left-to-right, 2 s, easy-ease, and soft edge at 10% of the target width.
    automation: >-
      Builds the matte source, sizes it to the selection's bounds, keys it, and hides it from output.
    usability_check: >-
      A first-time user applies a soft reveal to a selected wall in no more than 3 actions and changes its direction in
      1 more.
  acceptance: >-
    Brief §6 acceptance (animated soft reveals), and mini scene "brick-to-glass-sweep".
  status: not-started
  evidence: []

- id: mask.shared-matte-source
  name: Reusable matte sources
  sources:
    - ref: S07
      item: "Use any layer as a track matte (multiple layers can share one matte)"
      category: "Transparency and compositing"
      checked: false
    - ref: "brief §6"
      item: "reusable matte sources"
      category: "Masks, mattes, compositing and layer styles"
      checked: true
  artist_can: >-
    Use one matte layer for many target layers at once, so changing the matte changes every reveal together.
  projection_example: >-
    One animated "wave" shape reveals separate texture layers on the left wing, centre and right wing in sync.
  controls:
    - { name: "Matte source layer", type: "layer-ref", animatable: false }
    - { name: "Targets using this matte", type: "layer-ref", animatable: false }
  animation: >-
    The shared source animates once, and every target follows.
  dependencies: [mask.track-matte]
  implementation: >-
    The matte texture is rendered once per frame and cached in the frame graph. Every referencing layer samples the same
    texture. The dependency view shows the fan-out.
  io: >-
    None.
  limitations: >-
    Targets with different transforms see the matte in comp space, not their own layer space. This matches AE.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Use the same reveal for these": select several layers and choose an existing reveal.
    defaults: >-
      Same matte type and inversion as the first target.
    automation: >-
      Links all selected layers in one op and draws link badges on the timeline.
    usability_check: >-
      A novice applies one reveal to 3 layers in no more than 3 actions, then edits the reveal once and sees all 3 change.
  acceptance: >-
    Mini scene "shared-wave": 3 targets share one matte; render time scales sublinearly, and the output matches per-layer
    mattes.
  status: not-started
  evidence: []

- id: mask.preserve-transparency
  name: Preserve underlying transparency
  sources:
    - ref: S33
      item: "Preserve Underlying Transparency"
      category: "Blending modes and layer styles"
      checked: false
  artist_can: >-
    Make a layer draw only where the layers beneath it already have content, so it paints onto existing shapes without
    a separate matte.
  projection_example: >-
    Sweep a light streak over a set of window shapes; the streak appears only on the windows, not in the gaps.
  controls:
    - { name: "Preserve underlying transparency", type: "bool", animatable: false }
  animation: >-
    Not animatable. The layer's own content animates normally.
  dependencies: [proj.layer, mask.blend-modes]
  implementation: >-
    In the composite pass the layer's contribution is multiplied by the accumulated alpha below it, before blending.
    The accumulated alpha is unchanged.
  io: >-
    None.
  limitations: >-
    Depends on stack order within one comp. Inside a nested comp it refers only to layers in that comp.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "After Effects layer-style, roto or blend-mode parity detail. Masks, feather, expansion, mattes, region links, Normal/Add/Multiply blending and colour-space blending stay required."
  milestone: C
  beginner:
    action: >-
      "Only on what's below", a toggle in the layer's More controls. The "Light sweep across shapes" recipe also uses it.
    defaults: >-
      Off.
    automation: >-
      Recipes that overlay highlights on existing artwork set it automatically.
    usability_check: >-
      A novice limits a light sweep to existing shapes in 1 toggle after reading only the toggle's tooltip.
  acceptance: >-
    Mini scene "sweep-on-shapes": output alpha equals the underlying alpha exactly (pixel test).
  status: not-started
  evidence: []

- id: mask.stencil-silhouette
  name: Stencil and silhouette modes
  sources:
    - ref: S33
      item: "Stencil Alpha, Stencil Luma, Silhouette Alpha, Silhouette Luma"
      category: "Blending modes and layer styles"
      checked: false
  artist_can: >-
    Use a layer to cut through all layers beneath it: a stencil keeps everything below only inside the layer, and a
    silhouette punches it out.
  projection_example: >-
    A large logo stencil cuts every layer below it, so the entire show appears only within the logo shape.
  controls:
    - { name: "Mode", type: "enum(stencil-alpha|stencil-luma|silhouette-alpha|silhouette-luma)", animatable: false }
  animation: >-
    The stencil layer's transforms, masks and effects animate. The mode is static.
  dependencies: [mask.blend-modes]
  implementation: >-
    A WGSL composite variant multiplies the accumulated comp buffer by the layer's alpha or luma (stencil) or by its
    complement (silhouette). The layer's own color is not drawn.
  io: >-
    None.
  limitations: >-
    Affects all layers below within the same comp. To limit scope, precompose the affected layers.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "After Effects layer-style, roto or blend-mode parity detail. Masks, feather, expansion, mattes, region links, Normal/Add/Multiply blending and colour-space blending stay required."
  milestone: C
  beginner:
    action: >-
      "Cut everything below to this shape", or "Punch a hole through everything below".
    defaults: >-
      Alpha-based.
    automation: >-
      Offers to group affected layers into a precomp when the user wants the cut to apply to only some layers.
    usability_check: >-
      A novice confines a whole scene to a logo shape in under 45 s and no more than 2 actions.
  acceptance: >-
    Mini scene "logo-stencil": all four modes match reference renders.
  status: not-started
  evidence: []

- id: mask.blend-modes
  name: Blend modes (framework and Normal)
  sources:
    - ref: S33
      item: "Blending modes (Normal category: Normal)"
      category: "Blending modes and layer styles"
      checked: false
    - ref: "brief §6"
      item: "compositing blend modes"
      category: "Masks, mattes, compositing and layer styles"
      checked: true
  artist_can: >-
    Choose how each layer's colors combine with the layers below it. Normal is the default, and the other families are
    listed by outcome.
  projection_example: >-
    Set a light-sweep layer to a lighten-family mode so it brightens the texture below instead of covering it.
  controls:
    - { name: "Blend mode", type: "enum(normal|dissolve|dancing-dissolve|darken|multiply|color-burn|classic-color-burn|linear-burn|darker-color|add|lighten|screen|color-dodge|classic-color-dodge|linear-dodge|lighter-color|overlay|soft-light|hard-light|linear-light|vivid-light|pin-light|hard-mix|difference|classic-difference|exclusion|subtract|divide|hue|saturation|color|luminosity|stencil-alpha|stencil-luma|silhouette-alpha|silhouette-luma|alpha-add|luminescent-premul)", animatable: false }
    - { name: "Layer opacity", type: "percent", animatable: true }
  animation: >-
    Blend mode is not keyframable (as in AE). Opacity is. Mode changes over time are achieved with duplicated layers or
    crossfades.
  dependencies: [proj.layer, ux.operation-system]
  implementation: >-
    A programmable WGSL composite shader (not fixed-function blending) reads the accumulated premultiplied rgba16float
    comp buffer and the layer texture, un-premultiplies where the formula needs it, applies the mode, and re-premultiplies.
    Separable modes use the W3C compositing formulas; AE-specific "classic" variants are separate code paths.
  io: >-
    Saved per layer. Exported flattened.
  limitations: >-
    Results depend on the blending colour space (mask.blend-color-space). Pixel parity with AE is verified per mode
    against reference renders, not assumed.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "How it mixes" picker with live thumbnails grouped as Cover, Brighten, Darken, Contrast, Difference, Color and Cut.
      Mode names appear as secondary labels.
    defaults: >-
      Normal. Light-type recipes default to a Brighten mode.
    automation: >-
      Recipes set the mode their look requires. Hovering a thumbnail previews the mode on the canvas.
    usability_check: >-
      A novice finds a mode that makes a light sweep brighten the wall in under 30 s, using only hover previews.
  acceptance: >-
    Mini scene "blend-chart": all modes over a standard gradient and photo pair match reference images within
    tolerance, in both preview and export.
  status: not-started
  evidence: []

- id: mask.blend.darken
  name: Darken blend modes
  sources:
    - ref: S33
      item: "Darken, Multiply, Color Burn, Classic Color Burn, Linear Burn, Darker Color"
      category: "Blending modes and layer styles"
      checked: false
  artist_can: >-
    Darken the layers below. Multiply shades like ink, the burn modes deepen and saturate shadows, and Darker Color keeps
    the darker pixel.
  projection_example: >-
    Multiply a grime and crack texture over the facade so cracks appear darker without hiding the projected base color.
  controls:
    - { name: "Mode", type: "enum(darken|multiply|color-burn|classic-color-burn|linear-burn|darker-color)", animatable: false }
  animation: >-
    Not animatable. Animate opacity.
  dependencies: [mask.blend-modes]
  implementation: >-
    Per-mode WGSL formulas in the composite shader. Classic Color Burn reproduces the legacy AE formula. Linear Burn
    clamps at 0. Darker Color compares luma.
  io: >-
    None.
  limitations: >-
    On a projector, darkening is limited by surface reflectance and ambient light. Multiply cannot make a lit wall
    darker than its unlit state.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Darken" group in the "How it mixes" picker, with a "Shade it" recipe for cracks and grime.
    defaults: >-
      Multiply when picked from the group.
    automation: >-
      Crack and grime recipes choose Multiply or Linear Burn.
    usability_check: >-
      A novice darkens a texture into the wall with 2 clicks in the picker.
  acceptance: >-
    Mini scene "blend-chart" (darken group).
  status: not-started
  evidence: []

- id: mask.blend.lighten
  name: Lighten (additive) blend modes
  sources:
    - ref: S33
      item: "Add, Lighten, Screen, Color Dodge, Classic Color Dodge, Linear Dodge, Lighter Color"
      category: "Blending modes and layer styles"
      checked: false
  artist_can: >-
    Brighten the layers below. Add and Screen layer light on light, the dodge modes intensify highlights, and Lighten or
    Lighter Color keep the brighter pixel.
  projection_example: >-
    Add a glowing traced outline over the architecture so overlapping light lines get brighter where they cross.
  controls:
    - { name: "Mode", type: "enum(add|lighten|screen|color-dodge|classic-color-dodge|linear-dodge|lighter-color)", animatable: false }
  animation: >-
    Not animatable. Animate opacity or the layer's intensity.
  dependencies: [mask.blend-modes]
  implementation: >-
    Per-mode WGSL formulas. Add works on scene-linear premultiplied values without clamping, so HDR highlights survive
    until the display or output transform. Screen is defined on 0–1 values and is clamped in its formula.
  io: >-
    Unclamped additive values may exceed 1.0. Delivery encodes tone-map or clip them per color.management.
  limitations: >-
    Additive light looks different in linear and gamma blending. The default (linear) is closer to physical light
    addition on a projected surface.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "Brighten" group in the picker. Applied automatically by the "Trace with light" and "Make it glow" recipes.
    defaults: >-
      Add for light recipes; Screen when picked manually from the group.
    automation: >-
      Light-type recipes set Add and adjust intensity so the default result does not clip.
    usability_check: >-
      In the B guided path, a novice produces a glowing trace that brightens (not covers) the wall without ever seeing a
      blend-mode control.
  acceptance: >-
    AS-1: traced light lines over a texture brighten additively. The export shows no clipping banding at the default
    intensity.
  status: not-started
  evidence: []

- id: mask.blend.contrast
  name: Contrast blend modes
  sources:
    - ref: S33
      item: "Overlay, Soft Light, Hard Light, Linear Light, Vivid Light, Pin Light, Hard Mix"
