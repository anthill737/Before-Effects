- id: mask.blend.utility
  name: Alpha Add and Luminescent Premul
  sources:
    - ref: S33
      item: "Alpha Add, Luminescent Premul"
      category: "Blending modes and layer styles"
      checked: false
  artist_can: >-
    Join adjacent alpha-edged layers without a visible seam (Alpha Add). Composite premultiplied light effects without
    losing values above white (Luminescent Premul).
  projection_example: >-
    Seamlessly join two halves of a cracked-wall layer split along the same edge, so no faint line shows when they meet.
  controls:
    - { name: "Mode", type: "enum(alpha-add|luminescent-premul)", animatable: false }
  animation: >-
    Not animatable.
  dependencies: [mask.blend-modes]
  implementation: >-
    Alpha Add adds the alpha channels directly (clamped) and composites color normally. Luminescent Premul adds the
    premultiplied color without dividing by alpha, which is natural in the premultiplied linear pipeline.
  io: >-
    None.
  limitations: >-
    Mainly a fix-up tool. Most seam problems are better solved by correct alpha interpretation.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "After Effects layer-style, roto or blend-mode parity detail. Masks, feather, expansion, mattes, region links, Normal/Add/Multiply blending and colour-space blending stay required."
  milestone: D
