- id: fx.generate.eyedropper-fill
  name: Eyedropper Fill
  sources:
    - ref: S02
      item: Eyedropper Fill
      category: Generate
      adobe_support: { gpu: false, bpc: [8], mfr: true }
      checked: true
    - ref: S13
      item: Eyedropper Fill
      category: Generate
      checked: true
  artist_can: >-
    Fill a layer with the average color sampled from a point and radius, with options for transparent pixels, premultiplication and keeping the original alpha.
  projection_example: >-
    Sample the real wall color from the venue reference photo to make a base fill that blends with the building.
  controls:
    - { name: "Sample point", type: "point2d", animatable: true }
    - { name: "Sample radius", type: "float", animatable: true }
    - { name: "Average pixel color (Skip empty, All, All premultiplied, Including alpha)", type: "enum", animatable: false }
    - { name: "Maintain original alpha", type: "bool", animatable: false }
    - { name: "Blend with original", type: "percent", animatable: true }
  animation: >-
    Sample point keyframable or tracked, so the fill color can follow moving footage.
  dependencies: [proj.effect-stack, anim.keyframe.core, track.point, map.venue]
  implementation: >-
    WGSL two-stage parallel reduction averages pixels inside the disc, with premultiplication options. A second pass fills the layer. Stateless; the reduction reads only the current frame.
  io: >-
    none
  limitations: >-
    Matches the photo's color, not the projected appearance. A real surface's color under projector light needs physical checking.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Generator for After Effects parity or a decorative look that projection recipes do not need now. Gradients, fill, stroke, music visualisers, lightning, radio waves, Vegas and the region-aware generators stay required."
  milestone: D
  beginner:
    action: >-
      "Match a color from the picture": click the reference photo or footage.
    defaults: >-
      Radius 10 px, skip empty pixels, keep original alpha.
    automation: >-
      Offers the sampled color as a swatch in the show palette.
    usability_check: >-
      A first-time user samples the wall color from the venue photo into a fill in under 20 s.
  acceptance: >-
    Mini scene "match-wall": sampled color equals the mean of the sampled region within 1/1000.
  status: not-started
  evidence: []

- id: fx.generate.fill
  name: Fill
  sources:
    - ref: S02
      item: Fill
      category: Generate
      adobe_support: { gpu: true, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S13
      item: Fill
      category: Generate
      checked: true
  artist_can: >-
    Fill one or all masks, shapes or regions on a layer with a solid color, with feather, invert and opacity.
  projection_example: >-
    Each window region is filled with flat color as the base of a "light up one after another" sequence.
  controls:
    - { name: "Fill mask / All masks (or selected regions)", type: "path-ref", animatable: false }
    - { name: "Color", type: "color", animatable: true }
    - { name: "Invert", type: "bool", animatable: false }
    - { name: "Horizontal / Vertical feather", type: "float", animatable: true }
    - { name: "Opacity", type: "percent", animatable: true }
  animation: >-
    Color and opacity keyframable and audio-drivable; per-region timing offsets come from recipes.
  dependencies: [proj.effect-stack, mask.bezier, shape.path, map.region, anim.keyframe.core, tool.sequence-light-up]
  implementation: >-
    Paths (masks, shapes or region polygons) are flattened with CanvasKit and drawn with analytic AA into a coverage mask. Feather is a separable blur of the coverage, then a premultiplied color fill composites in rgba16float (HDR colors allowed, matching Adobe's 32-bpc support). Bounds = layer plus feather; stateless.
  io: >-
    none
  limitations: >-
    S13 documents no individual controls; the list comes from product knowledge. Stroke/fill order matters as in Adobe: stroke after fill shows full stroke width.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      Part of "Trace with light" and "Light up windows": select regions → "Fill with color".
    defaults: >-
      Show-palette color, no feather, full opacity.
    automation: >-
      Uses the selected regions directly; no manual masks needed.
    usability_check: >-
      A first-time user fills three selected windows with a color in 3 or fewer deliberate actions and under 20 s.
  acceptance: >-
    AS-1 and mini scene "fill-windows": fill matches region outlines exactly; saved and reopened project renders identically.
  status: not-started
  evidence: []

- id: fx.generate.fractal
  name: Fractal
  sources:
    - ref: S02
      item: Fractal
      category: Generate
      adobe_support: { gpu: false, bpc: [8, 16], mfr: true }
      checked: true
    - ref: S13
      item: Fractal
      category: Generate
      checked: true
  artist_can: >-
    Render Mandelbrot and Julia sets (and their inverses and overlays) as colorful textures with palettes, hue cycling, edge highlights and oversampling. Navigate them with zoom and pan tools on the canvas.
  projection_example: >-
    A psychedelic infinite zoom into a Mandelbrot set fills the tunnel opening during the trance section.
  controls:
    - { name: "Set choice (Mandelbrot, Mandelbrot inverse, Julia, Julia inverse, Mandelbrot over Julia, Mandelbrot inverse over Julia)", type: "enum", animatable: false }
    - { name: "Mandelbrot / Julia (X real, Y imaginary, magnification, escape limit)", type: "group", animatable: true }
    - { name: "Post-invert / Overlay / Transparency", type: "group", animatable: false }
    - { name: "Palette (Lightness gradient, Hue wheel, Black and white, Solid color)", type: "enum", animatable: false }
    - { name: "Hue, Cycle steps, Cycle offset", type: "group", animatable: true }
    - { name: "Edge highlight", type: "bool", animatable: false }
    - { name: "High quality (oversample method, oversample factor)", type: "group", animatable: false }
  animation: >-
    Magnification, center and hue cycle keyframable; zooms should use exponential interpolation (graph editor) for constant-feel speed.
  dependencies: [proj.effect-stack, anim.keyframe.core, anim.graph-editor]
  implementation: >-
    WGSL escape-time iteration with smooth (continuous) iteration counts, so palettes are banding-free. Oversampling is a supersample loop, and canvas zoom and pan are on-canvas manipulators. f32 limits zoom depth (about 1e5×); deeper zooms use a double-float (df64) path. Stateless.
  io: >-
    none
  limitations: >-
    Deep zooms past f32 precision need the slower df64 path. Adobe's Alt-click orbit-tracing visualization is low priority.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Generator for After Effects parity or a decorative look that projection recipes do not need now. Gradients, fill, stroke, music visualisers, lightning, radio waves, Vegas and the region-aware generators stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Infinite fractal zoom" recipe in Patterns → More controls.
    defaults: >-
      Classic Mandelbrot at a scenic coordinate, hue-wheel palette, 4× oversampling for export.
    automation: >-
      Recipe picks a visually rich target point and creates an exponential zoom over the scene length.
    usability_check: >-
      A first-time user creates a 10 s fractal zoom inside a region in under 60 s.
  acceptance: >-
    Mini scene "fractal-tunnel": zoom renders without banding or precision blockiness to the recipe's default depth.
  status: not-started
  evidence: []

- id: fx.generate.gradient-ramp
  name: Gradient Ramp
  sources:
    - ref: S02
      item: Gradient Ramp
      category: Generate
      adobe_support: { gpu: true, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S13
      item: Gradient Ramp
      category: Generate
      checked: true
  artist_can: >-
    Create a linear or radial two-color gradient with animatable start and end points and colors, plus ramp scatter that dithers away banding.
  projection_example: >-
    A dark-to-gold gradient rises up the facade as a dawn effect, and the same ramp drives a bottom-to-top reveal.
  controls:
    - { name: "Start of ramp / End of ramp", type: "point2d", animatable: true }
    - { name: "Start color / End color", type: "color", animatable: true }
    - { name: "Ramp shape (Linear, Radial)", type: "enum", animatable: false }
    - { name: "Ramp scatter (dither)", type: "float", animatable: true }
    - { name: "Blend with original", type: "percent", animatable: true }
    - { name: "Interpolation space (linear light, perceptual; product addition)", type: "enum", animatable: false }
  animation: >-
    Points and colors keyframable, expression-linkable and audio-drivable; points snap to region bounds.
  dependencies: [proj.effect-stack, anim.keyframe.core, color.management, render.encode, map.region, fx.generate.region-space-mapping]
  implementation: >-
    WGSL linear/radial ramp evaluated in scene-linear (optionally OKLab), written to rgba16float. Ramp scatter is a seeded blue-noise dither scaled to the target output bit depth. Gradients carry high banding risk, so precision must survive the whole pipeline to encode. Stateless; bounds = layer.
  io: >-
    none
  limitations: >-
    Dithering here does not replace export dithering for 8-bit encodes; both are coordinated so dither is not applied twice.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "Gradient" in Add content → Color; drag the start/end handles on the canvas.
    defaults: >-
      Fit to the selected region bottom→top, two show-palette colors, scatter on.
    automation: >-
      Handles snap to the region's edges, and "Use as reveal" turns it into a wipe matte.
    usability_check: >-
      A first-time user adds a two-color gradient to a region and reverses its direction by dragging, in under 30 s.
  acceptance: >-
    Mini scene "ramp-banding": 8-bit and 10-bit exports show no visible banding with scatter on; AS-1 background layer.
  status: not-started
  evidence: []

