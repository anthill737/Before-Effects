- id: fx.generate.region-edge-stroke
  name: Edge light trace (stroke along architecture)
  sources:
    - ref: "brief §19"
      item: Select a building edge and create an editable tracing animation
      category: Projection-specific creative tools
      checked: true
    - ref: "brief §11B"
      item: Path strokes, write-on effects
      category: Generators and light effects
      checked: true
  artist_can: >-
    Stroke and draw on along the edges of selected venue regions (rooflines, window frames, columns) at constant speed, without first copying the edges into masks.
  projection_example: >-
    Light traces every window frame, then runs along the roofline, all as one editable layer that re-targets to another venue.
  controls:
    - { name: "Regions / edges (selection)", type: "region-ref list", animatable: false }
    - { name: "Edge set (outline, inner edges, chosen segments)", type: "enum", animatable: false }
    - { name: "Start corner / direction", type: "enum", animatable: false }
    - { name: "Progress or speed", type: "percent / float", animatable: true }
    - { name: "Order and delay across regions", type: "group", animatable: true }
    - { name: "Color / width / taper", type: "group", animatable: true }
    - { name: "Glow amount", type: "float", animatable: true }
    - { name: "Corner handling (continuous, restart per segment)", type: "enum", animatable: false }
  animation: >-
    Progress keyframable at constant arc-length speed. Per-region delays come from index or order, and progress or brightness can follow the music.
  dependencies: [map.region, shape.path, tool.edge-trace, fx.generate.stroke, fx.stylize.glow, ux.recipe-engine, expr.rigs, anim.graph-editor, fx.generate.audio-reactive-controls]
  implementation: >-
    Region outlines are converted to CanvasKit paths in role space, each with an arc-length LUT for constant-speed trimming, and drawn by the Stroke pass. Recipe-generated expressions set per-region offsets. Bound by region role, so another venue's matching regions re-target the same animation.
  io: >-
    Stored as region-role references, not copied coordinates; survives venue rebinding.
  limitations: >-
    Edges are only as accurate as the region outlines. 3D model edges need projecting into content space (map.model-3d).
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "Trace with light": click a roofline or window, then choose color and speed.
    defaults: >-
      Warm-white 4 px line with glow, 2 s per region, clockwise from top-left, 0.2 s stagger.
    automation: >-
      Builds paths from regions, orders them left→right and top→bottom, creates the keyframes and glow, and binds to roles.
    usability_check: >-
      A first-time user traces all windows of the sample facade, changes speed and previews in under 2 minutes, with 3 or fewer deliberate actions for the trace itself.
  acceptance: >-
    AS-1 (architectural trace) and AS-7 (bind the same show to another venue and the trace follows the new regions).
  status: not-started
  evidence: []

- id: fx.generate.region-light-sweep
  name: Light sweep across regions
  sources:
    - ref: "brief §19"
      item: Generate material changes, light sweeps, and apparent surface deformation
      category: Projection-specific creative tools
      checked: true
    - ref: "brief §11B"
      item: Light rays/sweeps/bursts
      category: Generators and light effects
      checked: true
  artist_can: >-
    Sweep a band of light across selected regions, clipped to them. It can run as one sweep across the whole facade or one per region in sequence.
  projection_example: >-
    A gleam crosses each window left to right, one after another, then a single wide sweep crosses the whole facade on the chorus.
  controls:
    - { name: "Regions", type: "region-ref list", animatable: false }
    - { name: "Mode (one sweep across all, per region in sequence)", type: "enum", animatable: false }
    - { name: "Direction", type: "angle", animatable: true }
    - { name: "Width / softness", type: "float", animatable: true }
    - { name: "Intensity / edge highlight", type: "float", animatable: true }
    - { name: "Color", type: "color", animatable: true }
    - { name: "Duration / delay / repeat", type: "group", animatable: true }
  animation: >-
    Timing is generated as editable keyframes and expressions. It can be beat-locked and looped.
  dependencies: [fx.generate.cc-light-sweep, map.region, tool.sequence-light-up, fx.generate.region-space-mapping, ux.recipe-engine, mask.track-matte, fx.noise-grain.seamless-loop, fx.generate.audio-reactive-controls]
  implementation: >-
    The CC Light Sweep pass is evaluated in a region-local or facade-global frame (region-space mapping), with region mattes clipping. Per-region offsets come from recipe-generated expressions. Stateless.
  io: >-
    Region-role references; rebinds per venue.
  limitations: >-
    Irregular regions use their oriented bounding box for the sweep frame, so very concave shapes can show a sweep that seems to skip.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Light sweep": select regions, choose "together" or "one after another", then direction and speed.
    defaults: >-
      One after another, left→right order, 45° band, 0.8 s per region, 0.15 s delay.
    automation: >-
      Orders regions spatially, sizes the band to region width, and writes the offsets.
    usability_check: >-
      A first-time user makes light sweep across 10 windows in sequence in 3 or fewer deliberate actions and under 45 s.
  acceptance: >-
    Mini scene "window-gleam": sweep timing per region equals the configured delay; export matches preview.
  status: not-started
  evidence: []

- id: fx.generate.edge-lightning
  name: Electric arcs along edges
  sources:
    - ref: "brief §11B"
      item: Electrical arcs
      category: Generators and light effects
      checked: true
    - ref: "brief §19"
      item: Effects that follow architectural contours
      category: Projection-specific creative tools
      checked: true
  artist_can: >-
    Make lightning crawl along a traced edge or jump between two named points on the building. It stays near the path, with adjustable wander, branching and crackle rate.
  projection_example: >-
    Electricity races along the roofline and down the corner columns at the climax.
  controls:
    - { name: "Edge path or two anchor points", type: "region-ref / point2d", animatable: true }
    - { name: "Wander (max deviation)", type: "float", animatable: true }
    - { name: "Branching", type: "percent", animatable: true }
    - { name: "Crackle rate", type: "float", animatable: true }
    - { name: "Travel progress", type: "percent", animatable: true }
    - { name: "Core / glow color and size", type: "group", animatable: true }
    - { name: "Seed", type: "seed", animatable: false }
    - { name: "Flash on beat", type: "bool", animatable: false }
  animation: >-
    Travel progress and crackle keyframable; flashes can follow audio onsets.
  dependencies: [fx.generate.advanced-lightning, fx.generate.region-edge-stroke, map.region, fx.noise-grain.seed-control, fx.generate.audio-reactive-controls, fx.stylize.glow]
  implementation: >-
    The Advanced Lightning compute pass with path-guided random walk. Targets advance along arc-length points of the CanvasKit path, and deviation is clamped by Wander. Seeded and stateless; capsule SDF plus glow. Bounds = path bbox + wander + glow.
  io: >-
    Region-role references.
  limitations: >-
    Very long paths need many segments, so cost scales with path length; draft preview reduces segment density and flags it.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Electric edges": click an edge (or two points), choose color and intensity.
    defaults: >-
      Blue-white core, wander 2% of path length, crackle 12 per second, travels over 1.5 s.
    automation: >-
      Builds the path from the region edge, sets glow, and offers beat flashes.
    usability_check: >-
      A first-time user sends electricity along a roofline in 3 or fewer deliberate actions and under 45 s.
  acceptance: >-
    Mini scene "roof-arcs": arcs stay within the wander limit; identical frames after reopen and seek.
  status: not-started
  evidence: []

- id: fx.generate.region-space-mapping
  name: Fit generators to regions
  sources:
    - ref: "brief §0.5"
      item: Automatically adapt scale and timing to the target region and show
      category: User experience
      checked: true
    - ref: "brief §15"
      item: Keep editable UV/content coordinates and projector coordinates distinct
      category: Projection design, surfaces, and calibration
      checked: true
  artist_can: >-
    Choose where a generator's coordinates live: composition, layer, a region's own box, or a surface's UV. Generators can also be instanced per region, so each window gets its own fitted copy with an index-based offset.
  projection_example: >-
    A cell pattern fills each of 24 windows separately, sized to each window, with each window's evolution slightly offset.
  controls:
    - { name: "Space (Composition, Layer, Region box, Region oriented box, Surface UV)", type: "enum", animatable: false }
    - { name: "Fit (Fit, Fill, Stretch, Real-world units)", type: "enum", animatable: false }
    - { name: "Each region separately", type: "bool", animatable: false }
    - { name: "Index offset (time, seed, phase)", type: "group", animatable: true }
    - { name: "Regions", type: "region-ref list", animatable: false }
  animation: >-
    Index offsets are expression-driven and editable as a rig.
  dependencies: [map.region, map.surface-2d, map.model-3d, expr.rigs, fx.noise-grain.seed-control, proj.effect-stack]
  implementation: >-
    Every generator pass takes a uniform transform from pixel to generator space (2D affine, or a 3D/UV lookup). Per-region instancing renders one instance per region through region-ID mattes (pass.object-id for 3D), with index-driven parameter offsets. Surface UV comes from the venue model.
  io: >-
    Region-role references; instancing follows rebinding.
  limitations: >-
    Real-world units need a measured venue scale. UV space inherits the model's UV layout quality, and seams appear where UVs split.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Automatic: a generator applied to a region fits it. An "Each window separately" toggle appears in the inspector.
    defaults: >-
      Region box fit for single regions; one shared space across a multi-region selection unless toggled.
    automation: >-
      Chooses the space from the selection type and derives index order spatially.
    usability_check: >-
      A first-time user applies a pattern to 12 windows and toggles "each separately", getting distinct but stable patterns, in under 30 s.
  acceptance: >-
    Mini scene "per-window-cells": per-region instances are stable after reopen; rebinding to a venue with 8 windows keeps the look.
  status: not-started
  evidence: []

- id: fx.generate.audio-reactive-controls
  name: Move with the beat (audio-driven generator controls)
  sources:
    - ref: "brief §13"
      item: Frequency-band control signals, smoothing/attack/release
      category: Sound and music-driven animation
      checked: true
    - ref: "brief §0.1"
      item: Add music, choose "Move with the beat"
      category: User experience
      checked: true
  artist_can: >-
    Link any generator or noise control to the music: intensity, evolution speed, color, size or position. The source can be a frequency band level, beat or onset pulses, or overall loudness, with smoothing, attack/release and a range map.
  projection_example: >-
    Light-sweep intensity pulses with the kick drum while cloud evolution speeds up with the high-hat energy.
  controls:
    - { name: "Target control", type: "property-ref", animatable: false }
    - { name: "Source (band, onsets, beats, loudness)", type: "enum", animatable: false }
    - { name: "Band range (Hz)", type: "float range", animatable: false }
    - { name: "Amount / output range", type: "float range", animatable: true }
    - { name: "Attack / Release", type: "time", animatable: false }
    - { name: "Threshold", type: "float", animatable: true }
    - { name: "Per-region offset", type: "time", animatable: false }
  animation: >-
    The binding is an editable expression modifier and can be baked to keyframes.
  dependencies: [audio.analysis, audio.to-keyframes, expr.engine, expr.rigs, ux.recipe-engine, anim.keyframe.core]
  implementation: >-
    An expression-backed modifier reads the audio analysis cache, so preview and export see identical data. It is evaluated in the TS core with no GPU work. When speed controls (such as evolution speed) are driven, the driven rate is integrated over time with a prefix-sum cache, so random access stays exact.
  io: >-
    Uses the shared analysis cache; optional keyframe bake.
  limitations: >-
    Live audio inputs need recording or baking for reproducible exports (audio domain). Onset detection errors need the editable onset track.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Move with the beat": select an element, choose what responds (brightness, size, speed, color) and how strongly.
    defaults: >-
      Kick band (40–120 Hz) to brightness, attack 10 ms, release 200 ms, amount 60%.
    automation: >-
      Picks the show music, suggests the band from the target (bass for pulses, highs for sparkle), and writes the modifier.
    usability_check: >-
      A first-time user makes a light sweep pulse with the kick drum in 3 or fewer deliberate actions and under 60 s.
  acceptance: >-
    AS-1 timing and mini scene "pulse-kick": driven values are identical in preview and export at sampled frames.
  status: not-started
  evidence: []

- id: fx.generate.editable-looks
  name: Editable generator looks (no stock clips)
  sources:
    - ref: "brief §11B"
      item: Use editable generator parameters rather than fixed stock videos
      category: Generators and light effects
      checked: true
    - ref: "brief §0.5"
      item: Visual library of editable outcomes
      category: User experience
      checked: true
  artist_can: >-
    Pick ready-made looks such as clouds, lava, electric arcs, light sweep, marquee lights, tech grid and ripples. Each look is saved generator settings rather than a video clip, so color, scale, speed and loop length stay editable at any resolution.
  projection_example: >-
    Search "lava", apply it to the lower wall, recolor it blue, and it becomes glowing water: same generator, different settings.
  controls:
    - { name: "Look", type: "preset", animatable: false }
    - { name: "Hero controls (3-5 per look)", type: "group", animatable: true }
    - { name: "Variation (shuffle seed)", type: "action", animatable: false }
    - { name: "Save as my look", type: "action", animatable: false }
  animation: >-
    Looks include their own animation (evolution, loop) and expose it through hero controls.
  dependencies: [ux.effect-library, ux.recipe-engine, fx.noise-grain.seamless-loop, fx.noise-grain.seed-control, fx.generate.region-space-mapping, preview.cache]
  implementation: >-
    Looks are serialized effect and recipe parameter sets applied through the operation system. Library thumbnails are animated renders of the real generators, cached and optionally shown on the selected surface.
  io: >-
    Looks import and export as small JSON preset files with no media.
  limitations: >-
    Looks are limited by the generators that exist; photoreal footage looks still need footage or simulation.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      Effect library → search an everyday word ("clouds", "lava", "electric") → click to apply.
    defaults: >-
      Looks scale to the selected region and loop over the scene length.
    automation: >-
      Search maps everyday words to looks, and thumbnails preview on the selected surface.
    usability_check: >-
      A first-time user searches "clouds", applies an editable cloud look to the wall and changes its color in under 30 s.
  acceptance: >-
    Mini scene "look-swap": a look renders at 4K and at preview size from the same settings; saved look reloads identically.
  status: not-started
  evidence: []
