# Generate effects — Before Effects capability register
# Sources: S02 effect list + support matrix (Generate rows), S13 Generate effects (incl. bundled Cycore list), Cycore plugins page (S01 navigation), brief §0, §2, §11B, §13, §19. Live pages checked 2026-10-01 in a browser (Adobe CDN blocks non-browser fetches).

- id: fx.generate.4-color-gradient
  name: 4-Color Gradient
  sources:
    - ref: S02
      item: 4-Color Gradient
      category: Generate
      adobe_support: { gpu: false, bpc: [8, 16], mfr: true }
      checked: true
    - ref: S13
      item: 4-Color Gradient
      category: Generate
      checked: true
  artist_can: >-
    Fill a layer with a soft blend of four colors, each anchored at a movable point, with jitter that hides banding.
  projection_example: >-
    A slowly drifting sunset wash covers the whole facade behind traced window outlines.
  controls:
    - { name: "Points 1-4", type: "point2d x4", animatable: true }
    - { name: "Colors 1-4", type: "color x4", animatable: true }
    - { name: "Blend", type: "float", animatable: true }
    - { name: "Jitter (anti-banding)", type: "float", animatable: true }
    - { name: "Opacity", type: "percent", animatable: true }
    - { name: "Blending mode", type: "enum", animatable: false }
  animation: >-
    Points and colors keyframable and expression-linkable; points can bind to region corners or tracked points; colors can be driven by audio bands.
  dependencies: [proj.effect-stack, anim.keyframe.core, expr.engine, mask.blend-modes, color.management, fx.generate.region-space-mapping, fx.generate.audio-reactive-controls]
  implementation: >-
    One WGSL pass: inverse-distance-weighted blend of four colors (Blend = falloff exponent) in scene-linear, optional OKLab interpolation, output rgba16float. Jitter = seeded blue-noise dither. Bounds = layer, no temporal deps.
  io: >-
    none
  limitations: >-
    Adobe's exact falloff curve is matched visually, not numerically. 8-bit projector feeds can still band unless export dithering (render.encode) is on.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Color wash" in Add content → Color; drag the four color dots on the canvas.
    defaults: >-
      Four harmonious colors from the show palette, points at the selected region's corners, Jitter on.
    automation: >-
      Points snap to region corners; colors come from the show palette; "Slow drift" is one toggle that creates the point animation.
    usability_check: >-
      A first-time user fills a selected wall with a four-color wash and changes one color in under 45 s without opening More controls.
  acceptance: >-
    Mini scene "color-wash": an 8-bit export with dithering shows no visible banding; preview and export match within tolerance.
  status: not-started
  evidence: []

- id: fx.generate.advanced-lightning
  name: Advanced Lightning
  sources:
    - ref: S02
      item: Advanced Lightning
      category: Generate
      adobe_support: { gpu: false, bpc: [8], mfr: true }
      checked: true
    - ref: S13
      item: Advanced Lightning
      category: Generate
      checked: true
  artist_can: >-
    Generate branching electric bolts from an origin toward a direction point or radius, styled with core and glow settings. Bolts can wrap around a layer's opaque areas or stay inside them (Alpha Obstacle).
  projection_example: >-
    Lightning crackles out of the doorway and wraps around the columns, using the column regions as the obstacle matte.
  controls:
    - { name: "Lightning type (Direction, Strike, Breaking, Bouncy, Omni, Anywhere, Vertical, Two-Way Strike)", type: "enum", animatable: false }
    - { name: "Origin", type: "point2d", animatable: true }
    - { name: "Direction / Outer radius", type: "point2d", animatable: true }
    - { name: "Conductivity state", type: "float", animatable: true }
    - { name: "Core settings (radius, opacity, color)", type: "group", animatable: true }
    - { name: "Glow settings (radius, opacity, color)", type: "group", animatable: true }
    - { name: "Alpha obstacle", type: "float", animatable: true }
    - { name: "Turbulence", type: "float", animatable: true }
    - { name: "Forking", type: "percent", animatable: true }
    - { name: "Decay and Decay main core", type: "float + bool", animatable: true }
    - { name: "Composite on original", type: "bool", animatable: false }
    - { name: "Expert (complexity, min fork distance, termination threshold, main-core collision only, fractal type, core drain, fork strength, fork variation)", type: "group", animatable: true }
    - { name: "Seed (product addition)", type: "seed", animatable: false }
  animation: >-
    The bolt does not animate by itself: animate Conductivity State, or link it to time or audio onsets, to make it crackle. Origin and Direction accept tracked points and region anchors.
  dependencies: [proj.effect-stack, anim.keyframe.core, expr.engine, fx.noise-grain.seed-control, fx.generate.audio-reactive-controls, fx.stylize.glow, map.region]
  implementation: >-
    A WGSL compute pass generates bolt segments: a seeded fractal random walk with branching, where conductivity is the noise phase. Alpha obstacles steer it by sampling a fixed-resolution distance field of the layer alpha. Segments are drawn as analytic capsule SDFs, then a separable Gaussian glow pass runs in rgba16float. Bounds = bolt bbox + glow radius (can exceed the layer); stateless per frame.
  io: >-
    none
  limitations: >-
    Branch shapes will not match Adobe's for the same settings. Adobe warns that obstacles change with preview resolution; we use a fixed-resolution obstacle field so draft and full resolution agree, which loses some fine detail. The obsolete self-animating "Lightning" maps here via an auto-crackle option.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Electric arcs" recipe: click two points on the building (or pick an edge) and choose intensity and color.
    defaults: >-
      Strike type, blue-white core with glow, auto-crackle at a lively rate, Composite on original on.
    automation: >-
      The recipe animates conductivity with a seeded expression, builds alpha obstacles from the selected regions, and offers "Flash on beat" from audio onsets.
    usability_check: >-
      A first-time user makes lightning jump between two windows in 3 or fewer deliberate actions, and syncs the flashes to music in under 2 minutes.
  acceptance: >-
    AS-3 and mini scene "arc-columns": lightning wraps the column regions; frames are identical after reopening and random-access seeking.
  status: not-started
  evidence: []

- id: fx.generate.audio-spectrum
  name: Audio Spectrum
  sources:
    - ref: S02
      item: Audio Spectrum
      category: Generate
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S13
      item: Audio Spectrum
      category: Generate
      checked: true
  artist_can: >-
    Draw an audio layer's frequency spectrum as bars, lines or dots. They can sit on a straight line, a mask, shape or region path, or a radial path. Controls cover frequency range, band count, height, colors and hue cycling.
  projection_example: >-
    Equalizer bars rise from the roofline in time with the music, colored by frequency.
  controls:
    - { name: "Audio layer", type: "layer", animatable: false }
    - { name: "Start point / End point", type: "point2d", animatable: true }
    - { name: "Path (mask, shape or region edge)", type: "path", animatable: false }
    - { name: "Use polar path", type: "bool", animatable: false }
    - { name: "Start / End frequency (Hz)", type: "float", animatable: true }
    - { name: "Frequency bands", type: "int", animatable: true }
    - { name: "Maximum height", type: "float", animatable: true }
    - { name: "Audio duration / Audio offset (ms)", type: "float", animatable: true }
    - { name: "Thickness / Softness", type: "float", animatable: true }
    - { name: "Inside / Outside color", type: "color", animatable: true }
    - { name: "Hue interpolation, Dynamic hue phase, Color symmetry, Blend overlapping colors", type: "group", animatable: true }
    - { name: "Display options (Digital, Analog lines, Analog dots)", type: "enum", animatable: false }
    - { name: "Side options (A, B, A and B)", type: "enum", animatable: false }
    - { name: "Duration averaging", type: "bool", animatable: false }
    - { name: "Composite on original", type: "bool", animatable: false }
    - { name: "Response smoothing (attack / release; product addition)", type: "group", animatable: true }
  animation: >-
    Bar heights come from cached audio analysis at each frame time; all style controls are keyframable. The path can be a region edge, so bars follow the architecture.
  dependencies: [proj.effect-stack, audio.track, audio.analysis, mask.bezier, shape.path, map.region, anim.keyframe.core, fx.generate.region-edge-stroke]
  implementation: >-
    FFT magnitudes come from the audio analysis cache: a worker computes a window of Audio Duration at Audio Offset for each frame. They are grouped into log-spaced bands and drawn as instanced SDF quads, placed by arc-length sampling of the path (CanvasKit path measure). The only temporal input is the audio window. Preview and export read the same cache, so output is deterministic.
  io: >-
    Reads project audio; the analysis cache is stored with project caches and can be rebuilt.
  limitations: >-
    Adobe reads raw source audio and ignores time-remap and effects. We offer a "source" mode that matches Adobe and an "as heard" (post-mix) mode, which is the default. Band levels will not numerically match Adobe's FFT windowing.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Music bars" in Add content → Sound visuals; pick an edge or region and the song.
    defaults: >-
      The show's music track, 20 Hz–8 kHz, 32 bands, bars on side A, show-palette colors, smoothing on.
    automation: >-
      Picks the show's music track, lays the bars along the selected roofline or region path, and scales maximum height to the region.
    usability_check: >-
      A first-time user places music-reactive bars along a selected roofline in 3 or fewer deliberate actions and under 60 s.
  acceptance: >-
    AS-1 and mini scene "eq-roofline": exported bar heights match preview frames at the same times exactly.
  status: not-started
  evidence: []

- id: fx.generate.audio-waveform
  name: Audio Waveform
  sources:
    - ref: S02
      item: Audio Waveform
      category: Generate
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S13
      item: Audio Waveform
      category: Generate
      checked: true
  artist_can: >-
    Draw an audio layer's waveform as an oscilloscope-style line or dots, on a straight line or along an open or closed path.
  projection_example: >-
    An oscilloscope line runs along the cornice and wiggles with the narrator's voice.
  controls:
    - { name: "Audio layer", type: "layer", animatable: false }
    - { name: "Start point / End point", type: "point2d", animatable: true }
    - { name: "Path (mask, shape or region edge)", type: "path", animatable: false }
    - { name: "Displayed samples", type: "int", animatable: true }
    - { name: "Maximum height", type: "float", animatable: true }
    - { name: "Audio duration / Audio offset (ms)", type: "float", animatable: true }
    - { name: "Thickness / Softness", type: "float", animatable: true }
    - { name: "Inside / Outside color", type: "color", animatable: true }
    - { name: "Waveform options (Mono, Left, Right)", type: "enum", animatable: false }
    - { name: "Display options (Digital, Analog lines, Analog dots)", type: "enum", animatable: false }
    - { name: "Composite on original", type: "bool", animatable: false }
  animation: >-
    Driven by cached time-domain audio at each frame; all style controls are keyframable.
  dependencies: [proj.effect-stack, audio.track, audio.analysis, mask.bezier, shape.path, map.region, anim.keyframe.core]
  implementation: >-
    Per-frame min/max sample envelopes come from the audio analysis cache, laid out along the path by arc length. They are drawn as SDF polylines or dots in WGSL. The temporal input is the audio window only, and output is deterministic.
  io: >-
    Reads project audio; uses the shared analysis cache.
  limitations: >-
    Same source vs "as heard" choice as Audio Spectrum. Very high sample counts on long paths are capped in draft preview, and the preview flags this.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Sound wave line" in Add content → Sound visuals; pick an edge and the audio.
    defaults: >-
      Show music or voice track, mono, analog lines, 2 px line, show-palette color.
    automation: >-
      Selects the audio track, fits the line to the chosen edge, and scales height to the region.
    usability_check: >-
      A first-time user adds a waveform along a selected edge and previews it moving with the audio in under 60 s.
  acceptance: >-
    Mini scene "scope-cornice": waveform frames are identical in preview and export at the same times.
  status: not-started
  evidence: []

- id: fx.generate.beam
  name: Beam
  sources:
    - ref: S02
      item: Beam
      category: Generate
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S13
      item: Beam
      category: Generate
      checked: true
  artist_can: >-
    Draw a tapered laser-like beam between two points, with inner and outer colors, a visible length and travel time, and optional 3D perspective. Looks best with motion blur.
  projection_example: >-
    Laser beams shoot from window to window across the facade at the drop.
  controls:
    - { name: "Starting point / Ending point", type: "point2d", animatable: true }
    - { name: "Length", type: "percent", animatable: true }
    - { name: "Time", type: "percent", animatable: true }
    - { name: "Starting / Ending thickness", type: "float", animatable: true }
    - { name: "Softness", type: "percent", animatable: true }
    - { name: "Inside / Outside color", type: "color", animatable: true }
    - { name: "3D perspective", type: "bool", animatable: false }
    - { name: "Composite on original", type: "bool", animatable: false }
  animation: >-
    Animate Time to fire the beam; endpoints accept region anchors and tracked points; Time can be triggered by beats.
  dependencies: [proj.effect-stack, anim.keyframe.core, expr.engine, map.region, fx.stylize.glow, fx.generate.audio-reactive-controls]
  implementation: >-
    Analytic tapered-capsule SDF in WGSL with an inner/outer color falloff, output HDR in rgba16float. Length and Time set the visible segment along start→end. Motion blur uses the shared comp-shutter sub-frame sampler. Bounds = beam bbox + softness; stateless.
  io: >-
    none
  limitations: >-
    Most of the control list comes from product knowledge; the S13 page describes only Length, Time and 3D Perspective in detail.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Generator for After Effects parity or a decorative look that projection recipes do not need now. Gradients, fill, stroke, music visualisers, lightning, radio waves, Vegas and the region-aware generators stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Laser beams" recipe: click a start and an end point; More controls for thickness and colors.
    defaults: >-
      Red core, white-hot center, 0.5 s travel, motion blur on, glow on.
    automation: >-
      Endpoints snap to region centers; recipe adds glow and motion blur and can fire a beam on each beat.
    usability_check: >-
      A first-time user fires a beam between two windows on a beat in under 60 s.
  acceptance: >-
    Mini scene "laser-windows": beams with motion blur match between preview (full quality) and export.
  status: not-started
  evidence: []

- id: fx.generate.cc-glue-gun
  name: CC Glue Gun
  sources:
    - ref: S02
      item: CC Glue Gun
      category: Generate
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S13
      item: CC Glue Gun
      category: Generate (bundled Cycore)
      checked: true
  artist_can: >-
    Paint a glossy, shaded, blobby trail, like hot glue or liquid metal, that follows an animated brush position over a time span. The trail is lit by a built-in light or the comp lights.
  projection_example: >-
    A molten gold line oozes along the window frames just before the facade turns to metal.
  controls:
    - { name: "Brush position", type: "point2d", animatable: true }
    - { name: "Stroke width", type: "float", animatable: true }
    - { name: "Density", type: "float", animatable: true }
    - { name: "Time span (sec)", type: "float", animatable: true }
    - { name: "Reflection (map layer) / Strength", type: "layer + float", animatable: true }
    - { name: "Style", type: "enum", animatable: false }
    - { name: "Light (source, intensity, color, type, height, direction)", type: "group", animatable: true }
    - { name: "Shading (ambient, diffuse, specular, roughness, metal)", type: "group", animatable: true }
  animation: >-
    Brush position is keyframed, follows a path, or is generated from a region edge; the trail is the brush history over Time Span.
  dependencies: [proj.effect-stack, anim.keyframe.core, anim.motion-path, 3d.light, shape.path, fx.generate.region-edge-stroke]
  implementation: >-
    Stateless trail: the brush-position property is sampled at sub-frame steps over [t − Time Span, t] and the stamps are splatted into a height field in compute. Normals come from the height gradient, with GGX shading from the effect light or comp lights. The only temporal dependency is pure property evaluation, so it is MFR-safe.
  io: >-
    none
  limitations: >-
    Adobe's page only names the effect, so the control list comes from Cycore knowledge. Cycore's exact shading model is not reproduced.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Generator for After Effects parity or a decorative look that projection recipes do not need now. Gradients, fill, stroke, music visualisers, lightning, radio waves, Vegas and the region-aware generators stay required."
  milestone: D
  beginner:
    action: >-
      Reached through "Trace with light" → Style: "Liquid trail"; More controls for shading.
    defaults: >-
      Gold metal shading, 1.5 s trail, brush following the chosen edge at constant speed.
    automation: >-
      Brush position is generated from the selected edge path, and light direction defaults to the scene key light.
    usability_check: >-
      A first-time user turns an existing edge trace into a glossy liquid trail by changing one style option, in under 30 s.
  acceptance: >-
    Mini scene "liquid-trace": trail renders identically when seeking backward and in parallel export.
  status: not-started
  evidence: []

- id: fx.generate.cc-light-burst-2-5
  name: CC Light Burst 2.5
  sources:
    - ref: S02
      item: CC Light Burst 2.5
      category: Generate
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S13
      item: CC Light Burst 2.5
      category: Generate (bundled Cycore)
      checked: true
  artist_can: >-
    Streak the bright parts of a layer outward from a center point into a burst of rays, with ray length, intensity, burst style and optional color.
  projection_example: >-
    Light bursts out of a window as if a door opened onto the sun; a title bursts on the downbeat.
  controls:
    - { name: "Center", type: "point2d", animatable: true }
    - { name: "Intensity", type: "float", animatable: true }
    - { name: "Ray length", type: "float", animatable: true }
    - { name: "Burst (Straight, Fade, Center)", type: "enum", animatable: false }
    - { name: "Halo alpha", type: "bool", animatable: false }
    - { name: "Set color / Color", type: "bool + color", animatable: true }
  animation: >-
    Intensity and Ray length are keyframable and audio-drivable; Center accepts region centroids and tracked points.
  dependencies: [proj.effect-stack, anim.keyframe.core, map.region, fx.generate.audio-reactive-controls]
  implementation: >-
    Multi-pass radial streak in WGSL: log-step accumulation along rays from Center, 3–5 passes of doubling stride, HDR-safe in rgba16float. Bounds expand by ray length (declared); stateless.
  io: >-
    none
  limitations: >-
    Control list comes from Cycore knowledge (Adobe's Cycore page gives a one-line description). Streak falloff is matched visually.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Generator for After Effects parity or a decorative look that projection recipes do not need now. Gradients, fill, stroke, music visualisers, lightning, radio waves, Vegas and the region-aware generators stay required."
  milestone: C
  beginner:
    action: >-
      "Light burst": select a region (or click a point) and pick intensity and color.
    defaults: >-
      Center at region centroid, Fade burst, warm white, medium ray length.
    automation: >-
      Centers on the selected region and offers "Pulse on beat", which drives intensity from audio onsets.
    usability_check: >-
      A first-time user makes light burst out of a chosen window in 3 or fewer deliberate actions and under 30 s.
  acceptance: >-
    Mini scene "window-burst": rays extend beyond the layer without clipping; preview and export match.
  status: not-started
  evidence: []

- id: fx.generate.cc-light-rays
  name: CC Light Rays
  sources:
    - ref: S02
      item: CC Light Rays
      category: Generate
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S13
      item: CC Light Rays
      category: Generate (bundled Cycore)
      checked: true
  artist_can: >-
    Cast volumetric-looking rays (god rays) from a light point through the layer's image, colored by the source or a chosen color.
  projection_example: >-
    God rays stream through the rose window and fan out across the church facade.
  controls:
    - { name: "Intensity", type: "float", animatable: true }
    - { name: "Center", type: "point2d", animatable: true }
    - { name: "Radius", type: "float", animatable: true }
    - { name: "Warp softness", type: "float", animatable: true }
    - { name: "Shape (Round, Square)", type: "enum", animatable: false }
    - { name: "Direction", type: "angle", animatable: true }
    - { name: "Color from source / Allow brightening", type: "bool", animatable: false }
    - { name: "Color", type: "color", animatable: true }
    - { name: "Transfer mode", type: "enum", animatable: false }
  animation: >-
    Center and Intensity are keyframable or expression-linked; Center can follow a tracked light or a region centroid.
  dependencies: [proj.effect-stack, anim.keyframe.core, map.region, fx.generate.audio-reactive-controls]
  implementation: >-
    WGSL radial accumulation from Center, limited to a light-source mask of radius Radius with shape warp. Multi-pass doubling-stride sampling; HDR in rgba16float. Bounds expand by the ray reach (declared); stateless.
  io: >-
    none
  limitations: >-
    Control list comes from Cycore knowledge. True volumetric light in 3D scenes belongs to 3d.light; this is a 2D image effect.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Generator for After Effects parity or a decorative look that projection recipes do not need now. Gradients, fill, stroke, music visualisers, lightning, radio waves, Vegas and the region-aware generators stay required."
  milestone: C
  beginner:
    action: >-
      "Light rays": select a window or opening; choose intensity and color.
    defaults: >-
      Center on the region, round shape, color from source, medium intensity.
    automation: >-
      Places the light center on the region, masks the source to the opening, and adds a slow intensity breathe.
    usability_check: >-
      A first-time user creates rays streaming from a selected window in under 30 s without opening More controls.
  acceptance: >-
    Mini scene "rose-window": rays render beyond layer bounds and match between preview and export.
  status: not-started
  evidence: []

- id: fx.generate.cc-light-sweep
  name: CC Light Sweep
  sources:
    - ref: S02
      item: CC Light Sweep
      category: Generate
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S13
      item: CC Light Sweep
      category: Generate (bundled Cycore)
      checked: true
  artist_can: >-
    Sweep a shimmering band of light across a layer, brightening its body and its edges as the band passes.
  projection_example: >-
    A gleam sweeps across the venue's logo, then across each window in turn.
  controls:
    - { name: "Center", type: "point2d", animatable: true }
    - { name: "Direction", type: "angle", animatable: true }
    - { name: "Shape (Linear, Smooth, Sharp)", type: "enum", animatable: false }
    - { name: "Width", type: "float", animatable: true }
    - { name: "Sweep intensity", type: "float", animatable: true }
    - { name: "Edge intensity / Edge thickness", type: "float", animatable: true }
    - { name: "Light color", type: "color", animatable: true }
    - { name: "Light reception (Add, Composite, Cutout)", type: "enum", animatable: false }
  animation: >-
    The sweep moves by animating Center; recipes generate the keyframes from a direction and speed.
  dependencies: [proj.effect-stack, anim.keyframe.core, fx.generate.region-light-sweep, fx.generate.region-space-mapping]
  implementation: >-
    One WGSL pass with an edge pre-pass. The band profile is evaluated from the signed distance to the line through Center. The body term is multiplied by alpha, and the edge term comes from an alpha-gradient (Sobel) mask scaled by Edge Thickness. Stateless; no bounds expansion.
  io: >-
    none
  limitations: >-
    Control list comes from Cycore knowledge. Edge highlight quality depends on clean alpha edges.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Light sweep": select regions, pick a direction arrow and speed.
    defaults: >-
      45° direction, smooth shape, warm white, 1 s per sweep, edges highlighted.
    automation: >-
      Generates Center keyframes from the direction and region extents, so the band fully enters and leaves.
    usability_check: >-
      A first-time user sweeps light across a selected logo in 3 or fewer deliberate actions and under 30 s.
  acceptance: >-
    Mini scene "logo-gleam": sweep enters and exits fully; preview and export match.
  status: not-started
  evidence: []

- id: fx.generate.cc-threads
  name: CC Threads
  sources:
    - ref: S02
      item: CC Threads
      category: Generate
      adobe_support: { gpu: false, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S13
      item: CC Threads
      category: Generate (bundled Cycore)
      checked: true
  artist_can: >-
    Turn a layer into a woven-thread pattern. Thread width, height, overlaps, direction, coverage and shadowing are adjustable, and the source image colors the threads.
  projection_example: >-
    The brick wall appears to turn into woven fabric that tightens as the music builds.
  controls:
    - { name: "Width / Height", type: "float", animatable: true }
    - { name: "Overlaps", type: "int", animatable: true }
    - { name: "Direction", type: "angle", animatable: true }
    - { name: "Center", type: "point2d", animatable: true }
    - { name: "Coverage", type: "percent", animatable: true }
    - { name: "Shadowing", type: "percent", animatable: true }
    - { name: "Texture", type: "percent", animatable: true }
  animation: >-
    All numeric controls keyframable; Coverage is a natural reveal control.
  dependencies: [proj.effect-stack, anim.keyframe.core, fx.generate.region-space-mapping]
  implementation: >-
    WGSL procedural weave: two orthogonal stripe sets in a rotated lattice, with over/under ordering from overlap parity. Shadowing uses an analytic occlusion term, and the source is sampled per thread cell. Stateless; no bounds expansion.
  io: >-
    none
  limitations: >-
    Control list comes from Cycore knowledge; weave look matched visually.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Generator for After Effects parity or a decorative look that projection recipes do not need now. Gradients, fill, stroke, music visualisers, lightning, radio waves, Vegas and the region-aware generators stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Turn into fabric" material recipe → More controls.
    defaults: >-
      Thread size scaled to the region (about 40 threads across), 45° direction, medium shadowing.
    automation: >-
      Sizes threads relative to region width and animates Coverage for the reveal.
    usability_check: >-
      A first-time user turns a selected wall into a woven pattern and changes thread size in under 45 s.
  acceptance: >-
    Mini scene "fabric-wall": pattern is stable (no shimmer) at export resolution.
  status: not-started
  evidence: []

- id: fx.generate.cell-pattern
  name: Cell Pattern
  sources:
    - ref: S02
      item: Cell Pattern
      category: Generate
      adobe_support: { gpu: false, bpc: [8], mfr: true }
      checked: true
    - ref: S13
      item: Cell Pattern
      category: Generate
      checked: true
  artist_can: >-
    Generate animated cellular patterns: bubbles, crystals, plates, pillows, tubes and mixed crystals. They work as textures, mattes, transition maps or displacement sources, with evolution, looping and tiling.
  projection_example: >-
    The facade dissolves into glowing organic cells, and the same pattern drives a displacement for a "living stone" look.
  controls:
    - { name: "Cell pattern (Bubbles, Crystals, Plates, Static plates, Crystallize, Pillow, Tubular, HQ variants, Mixed crystals)", type: "enum", animatable: false }
    - { name: "Invert", type: "bool", animatable: false }
    - { name: "Contrast / Sharpness", type: "float", animatable: true }
    - { name: "Overflow (Clip, Soft clamp, Wrap back)", type: "enum", animatable: false }
    - { name: "Disperse", type: "float", animatable: true }
    - { name: "Size", type: "float", animatable: true }
    - { name: "Offset", type: "point2d", animatable: true }
    - { name: "Tiling (enable, cells horizontal / vertical)", type: "group", animatable: false }
    - { name: "Evolution", type: "angle", animatable: true }
    - { name: "Evolution options (cycle evolution, cycle revolutions, random seed)", type: "group", animatable: true }
  animation: >-
    Animate Evolution for smooth change. Cycle Evolution and the shared loop control give exact loops. Animating Random Seed flashes between patterns, as in Adobe.
  dependencies: [proj.effect-stack, anim.keyframe.core, fx.noise-grain.seed-control, fx.noise-grain.seamless-loop, fx.generate.region-space-mapping, fx.distort.displacement-map, mask.track-matte]
  implementation: >-
    WGSL Worley/cellular noise. Feature points are PCG-hashed from the seed, and each pattern type combines F1/F2/F2−F1. Evolution moves each feature point around its own circle, so Cycle Evolution is periodic and exact. Tiling uses lattice modulo. Output is rgba16float; stateless.
  io: >-
    none
  limitations: >-
    Adobe works in 8 bpc only; we generate at 16f, so results are smoother but not pixel-identical. Disperse above 1 needs supersampling, which preview flags as a quality setting.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Cells / bubbles pattern" in Patterns; choose a style thumbnail, size and speed.
    defaults: >-
      Bubbles HQ, size scaled to the region, slow evolution, seamless loop on.
    automation: >-
      Scales cells to the region, loops evolution over the scene length, and offers "Use as reveal" (matte) or "Use as warp" (displacement).
    usability_check: >-
      A first-time user applies a looping cell pattern to a region and uses it as a reveal in under 60 s.
  acceptance: >-
    Mini scene "living-stone": cycle loop is exact (frame 0 equals frame L); displacement driven by the pattern matches in export.
  status: not-started
  evidence: []

