    - { name: "Blend with original", type: "percent", animatable: true }
  animation: >-
    Center and brightness keyframable; center can follow a 3D light or tracked point.
  dependencies: [proj.effect-stack, anim.keyframe.core, 3d.light, track.point]
  implementation: >-
    Element-table procedural flare in WGSL. Glow, ring, streak and ghost elements sit along the line from flare center through frame center, and each lens type is its own element table. Additive HDR in rgba16float; stateless; bounds = layer.
  io: >-
    none
  limitations: >-
    It is a camera artifact, so on a building it reads as a graphic, not optics. Only Adobe's three lens types are in scope. S13 does not list individual controls; the list comes from product knowledge.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Generator for After Effects parity or a decorative look that projection recipes do not need now. Gradients, fill, stroke, music visualisers, lightning, radio waves, Vegas and the region-aware generators stay required."
  milestone: D
  beginner:
    action: >-
      Reached through the "Sunrise flare" recipe in Light → More controls.
    defaults: >-
      50-300mm zoom type, brightness 100%, center following the recipe's sun path.
    automation: >-
      Animates center along an arc over the roofline and fades brightness in and out.
    usability_check: >-
      A first-time user adds a moving flare over the roofline in under 45 s.
  acceptance: >-
    Mini scene "sunrise": flare elements stay aligned through center as it moves; preview and export match.
  status: not-started
  evidence: []

- id: fx.generate.paint-bucket
  name: Paint Bucket
  sources:
    - ref: S02
      item: Paint Bucket
      category: Generate
      adobe_support: { gpu: false, bpc: [8], mfr: true }
      checked: true
    - ref: S13
      item: Paint Bucket
      category: Generate
      checked: true
  artist_can: >-
    Flood-fill the area around a fill point with color, like Photoshop's Paint Bucket, non-destructively. Controls cover tolerance, channel selection and edge treatment (antialias, feather, spread, choke, stroke).
  projection_example: >-
    Hand-drawn line-art animation projected on the wall is colored in frame by frame without repainting.
  controls:
    - { name: "Fill point", type: "point2d", animatable: true }
    - { name: "Fill selector (Color and alpha, Straight color, Transparency, Opacity, Alpha channel)", type: "enum", animatable: false }
    - { name: "Tolerance", type: "float", animatable: true }
    - { name: "View threshold", type: "bool", animatable: false }
    - { name: "Stroke (Antialias, Feather, Spread, Choke, Stroke) + softness / radius / width", type: "group", animatable: true }
    - { name: "Invert fill", type: "bool", animatable: false }
    - { name: "Color / Opacity", type: "color + percent", animatable: true }
    - { name: "Blending mode (incl. Fill only)", type: "enum", animatable: false }
  animation: >-
    Fill point can be tracked; color and opacity keyframable.
  dependencies: [proj.effect-stack, anim.keyframe.core, track.point]
  implementation: >-
    GPU flood fill seeded at the fill point. Compute ping-pong propagates over a tolerance mask using connected-component labeling with pointer jumping, with bounded iterations. Spread, choke and stroke use a jump-flood distance transform. Stateless; cost scales with area.
  io: >-
    none
  limitations: >-
    Leaks through small gaps, as in Adobe; View Threshold helps diagnose. Region fills on the venue should use regions (fx.generate.fill), not flood fill on a photo.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Generator for After Effects parity or a decorative look that projection recipes do not need now. Gradients, fill, stroke, music visualisers, lightning, radio waves, Vegas and the region-aware generators stay required."
  milestone: D
  beginner:
    action: >-
      "Color in a drawing" in Paint & draw: click inside an outlined area.
    defaults: >-
      Tolerance 10, antialias edges, show-palette color.
    automation: >-
      Shows the matched area live while hovering before committing.
    usability_check: >-
      A first-time user colors in three closed shapes of a line drawing in under 45 s.
  acceptance: >-
    Mini scene "cel-color": fill stays inside outlines across a 5 s line-art clip with the fill point tracked.
  status: not-started
  evidence: []

- id: fx.generate.radio-waves
  name: Radio Waves
  sources:
    - ref: S02
      item: Radio Waves
      category: Generate
      adobe_support: { gpu: false, bpc: [8], mfr: true }
      checked: true
    - ref: S13
      item: Radio Waves
      category: Generate
      checked: true
  artist_can: >-
    Emit expanding waves from a point at a set frequency. Wave shapes can be polygons or stars, a mask, or the contours of another layer. Each wave has a lifespan, fades, width ramp, spin and optional reflection off the layer edges.
  projection_example: >-
    Rings ripple outward from the clock face on every beat, with wave outlines shaped like the arch.
  controls:
    - { name: "Producer point", type: "point2d", animatable: true }
    - { name: "Parameters are set at (Birth, Each frame)", type: "enum", animatable: false }
    - { name: "Render quality", type: "int", animatable: false }
    - { name: "Wave type (Polygon, Image contours, Mask)", type: "enum", animatable: false }
    - { name: "Polygon (sides, curve size, curvyness, star, star depth)", type: "group", animatable: true }
    - { name: "Mask", type: "path-ref", animatable: false }
    - { name: "Image contour (source layer, source center, value channel, invert, threshold, pre-blur, tolerance, contour)", type: "group", animatable: true }
    - { name: "Wave motion (frequency, expansion, orientation, direction, velocity, spin, lifespan, reflection)", type: "group", animatable: true }
    - { name: "Stroke (profile, color, opacity, fade-in / fade-out time, start / end width)", type: "group", animatable: true }
  animation: >-
    With "Birth", each wave keeps the parameter values from its birth time, giving twisting tunnels. Emission can be tied to beats (product addition).
  dependencies: [proj.effect-stack, anim.keyframe.core, mask.bezier, map.region, fx.generate.audio-reactive-controls, fx.distort.displacement-map, fx.simulation.caustics]
  implementation: >-
    Stateless emitter: wave k is born at t_k = k / frequency, and each frame draws every wave with t − t_k < lifespan. "Birth" parameters are evaluated at t_k by pure property evaluation, so random access and MFR are safe. Polygons and stars are SDFs. Mask and image contours (marching squares plus simplification, cached per frame) are drawn as offset-curve SDF strokes. Supersampled AA; reflection mirrors centers across the bounds.
  io: >-
    none
  limitations: >-
    Image-contour waves depend on a clean high-contrast source. Very high frequency × long lifespan raises per-frame cost linearly, so the number of live waves is capped with a warning.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Expanding rings / ripples": click the source point or pick a region for the ring shape.
    defaults: >-
      Circle waves, 1 wave per second (or per beat when music exists), 2 s lifespan, fades on.
    automation: >-
      Uses the selected region outline as the wave shape (mask mode) and emits on detected beats.
    usability_check: >-
      A first-time user makes arch-shaped ripples emit on each beat in 3 or fewer deliberate actions and under 60 s.
  acceptance: >-
    Mini scene "beat-ripples": random-access frame render equals sequential render; waves born on beat markers.
  status: not-started
  evidence: []

- id: fx.generate.scribble
  name: Scribble
  sources:
    - ref: S02
      item: Scribble
      category: Generate
      adobe_support: { gpu: false, bpc: [8], mfr: true }
      checked: true
    - ref: S13
      item: Scribble
      category: Generate
      checked: true
  artist_can: >-
    Fill or edge a closed path with a single hand-drawn zigzag stroke, like marker fill, crosshatching or textile. Controls cover angle, spacing, curviness, overlap variation, start/end draw-on and wiggle animation.
  projection_example: >-
    Each window is scribbled in with marker strokes, one after another, before it lights up.
  controls:
    - { name: "Scribble (Single mask, All masks, All masks using modes)", type: "enum", animatable: false }
    - { name: "Mask / region", type: "path-ref", animatable: false }
    - { name: "Fill type (Inside, Centered edge, Inside edge, Outside edge, Left edge, Right edge)", type: "enum", animatable: false }
    - { name: "Edge options (edge width, end cap, join, miter limit)", type: "group", animatable: true }
    - { name: "Color / Opacity", type: "color + percent", animatable: true }
    - { name: "Angle", type: "angle", animatable: true }
    - { name: "Stroke width", type: "float", animatable: true }
    - { name: "Stroke options (curviness, curviness variation, spacing, spacing variation, path overlap, path overlap variation)", type: "group", animatable: true }
    - { name: "Start / End", type: "percent", animatable: true }
    - { name: "Start/End apply to (Scribble result, Mask path); Fill paths sequentially", type: "group", animatable: false }
    - { name: "Wiggle type (Static, Jumpy, Smooth) / Wiggles per second", type: "enum + float", animatable: true }
    - { name: "Random seed", type: "seed", animatable: false }
    - { name: "Composite (On transparent, On original image, Reveal original image)", type: "enum", animatable: false }
  animation: >-
    Start/End draw the scribble on; wiggle animates the strokes; seeds keep the scribble identical on re-render.
  dependencies: [proj.effect-stack, anim.keyframe.core, mask.bezier, shape.path, map.region, fx.noise-grain.seed-control, tool.sequence-light-up]
  implementation: >-
    Geometry is generated in the TS core. A hatch polyline crosses the region at Angle with seeded spacing and curviness variation, is clipped with CanvasKit path ops (complex shapes split into simpler pieces), and is smoothed to Béziers. Start/End trims by arc length. Wiggle is seeded noise in time: Jumpy reseeds per interval, Smooth interpolates. Drawn by CanvasKit stroke → GPU AA; geometry cached per parameter set and wiggle step.
  io: >-
    none
  limitations: >-
    Scribbles will not match Adobe stroke-for-stroke. Very dense fills on large regions are geometry-heavy, so caching is required.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Generator for After Effects parity or a decorative look that projection recipes do not need now. Gradients, fill, stroke, music visualisers, lightning, radio waves, Vegas and the region-aware generators stay required."
  milestone: D
  beginner:
    action: >-
      "Hand-scribbled fill" in Paint & draw: select regions and choose marker or crosshatch style.
    defaults: >-
      Marker style, 45° angle, spacing scaled to region, smooth wiggle at 2 per second, draw-on over 1.5 s.
    automation: >-
      Uses selected regions as paths and staggers draw-on across regions.
    usability_check: >-
      A first-time user scribbles in four windows in sequence in under 60 s.
  acceptance: >-
    Mini scene "marker-windows": scribble geometry identical after reopen and seek.
  status: not-started
  evidence: []

- id: fx.generate.stroke
  name: Stroke
  sources:
    - ref: S02
      item: Stroke
      category: Generate
      adobe_support: { gpu: false, bpc: [8], mfr: true }
      checked: true
    - ref: S13
      item: Stroke
      category: Generate
      checked: true
  artist_can: >-
    Stroke the paths of one or more masks, shapes or regions with a brush-like line. Controls cover color, size, hardness, opacity, spacing, start/end draw-on, and painting over the image, on transparency or as a reveal.
  projection_example: >-
    The core "Trace with light" line: window frames are outlined and then traced by a moving light.
  controls:
    - { name: "Path / All masks (or selected regions)", type: "path-ref", animatable: false }
    - { name: "Stroke sequentially", type: "bool", animatable: false }
    - { name: "Color", type: "color", animatable: true }
    - { name: "Brush size", type: "float", animatable: true }
    - { name: "Brush hardness", type: "percent", animatable: true }
    - { name: "Opacity", type: "percent", animatable: true }
    - { name: "Start / End", type: "percent", animatable: true }
    - { name: "Spacing", type: "percent", animatable: true }
    - { name: "Paint style (On original image, On transparent, Reveal original image)", type: "enum", animatable: false }
  animation: >-
    Start/End keyframes draw the line on at constant speed (arc-length based); speed is editable in the graph editor.
  dependencies: [proj.effect-stack, mask.bezier, shape.path, map.region, anim.keyframe.core, anim.graph-editor, fx.stylize.glow, tool.edge-trace, fx.generate.region-edge-stroke]
  implementation: >-
    Solid strokes use CanvasKit path measure plus stroke-to-path with GPU analytic AA. Hardness and spacing render as instanced soft dabs along arc length in WGSL. Start/End trims by arc length. Stateless; bounds = path bbox + brush radius.
  io: >-
    Paths pasted from Illustrator/SVG import via shape.path.
  limitations: >-
    S13 details only brush hardness, spacing and paint style; the rest come from product knowledge.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: B
  beginner:
    action: >-
      "Trace with light": click a roofline or window, then choose color and speed.
    defaults: >-
      4 px warm-white line with glow, 2 s draw-on, sequential across selected regions.
    automation: >-
      Builds the path from the region, sets Start/End keyframes, and adds glow; no manual masks.
    usability_check: >-
      A first-time user traces a roofline with an animated light line and previews it in 3 or fewer deliberate actions and under 60 s.
  acceptance: >-
    AS-1: traced windows and roofline timed to audio; constant speed verified via arc-length sampling; export matches preview.
  status: not-started
  evidence: []

- id: fx.generate.vegas
  name: Vegas
  sources:
    - ref: S02
      item: Vegas
      category: Generate
      adobe_support: { gpu: false, bpc: [8], mfr: true }
      checked: true
    - ref: S13
      item: Vegas
      category: Generate
      checked: true
  artist_can: >-
    Run chasing lights or pulses around image contours or masks. Controls set segment count, length, distribution, rotation, random phase, color, width, hardness and opacity ramps.
  projection_example: >-
    Marquee lights chase around every window and the doorway like a theatre sign.
  controls:
    - { name: "Stroke (Image contours, Mask/path)", type: "enum", animatable: false }
    - { name: "Image contours (input layer, invert, if layer sizes differ, channel, threshold, pre-blur, tolerance, render, selected contour, shorter contours have)", type: "group", animatable: true }
    - { name: "Mask / path / region", type: "path-ref", animatable: false }
    - { name: "Segments", type: "int", animatable: true }
    - { name: "Length", type: "float", animatable: true }
    - { name: "Segment distribution (Bunched, Even)", type: "enum", animatable: false }
    - { name: "Rotation", type: "angle", animatable: true }
    - { name: "Random phase / seed", type: "bool + seed", animatable: false }
    - { name: "Blend mode (Transparent, Over, Under, Stencil)", type: "enum", animatable: false }
    - { name: "Color / Width / Hardness", type: "group", animatable: true }
    - { name: "Start / Mid-point / End opacity, Mid-point position", type: "group", animatable: true }
  animation: >-
    Animate Rotation for chasing; speed can be an expression (revolutions per second) or beat-locked.
  dependencies: [proj.effect-stack, anim.keyframe.core, expr.engine, mask.bezier, map.region, fx.noise-grain.seed-control, fx.generate.audio-reactive-controls, fx.stylize.glow]
  implementation: >-
    Contours come from masks, region paths or image contours (marching squares on the threshold, cached per frame) and are parameterized by arc length. Segments sit at (i / N + rotation) along each contour with a start/mid/end opacity ramp. They are drawn as SDF strokes with hardness falloff in WGSL. Stateless.
  io: >-
    none
  limitations: >-
    Contour numbering differs from Adobe's for image contours; region paths are the recommended input.
  disposition: required-equivalent
  superseded_by: null
  exclusion_reason: null
  milestone: C
  beginner:
    action: >-
      "Chasing lights": select regions, pick color and speed.
    defaults: >-
      Segment count from each region's perimeter (one light per ~20 px), 50% length, Even distribution, 0.5 rev/s.
    automation: >-
      Uses region outlines, writes the rotation-speed expression, and offsets phase per region so neighbors don't sync unless asked.
    usability_check: >-
      A first-time user puts chasing lights around all windows in 3 or fewer deliberate actions and under 45 s.
  acceptance: >-
    AS-1 variant "marquee": chase speed constant and identical in preview and export.
