- id: fx.generate.write-on
  name: Write-on
  sources:
    - ref: S02
      item: Write-on
      category: Generate
      adobe_support: { gpu: false, bpc: [8], mfr: true }
      checked: true
    - ref: S13
      item: Write-on
      category: Generate
      checked: true
  artist_can: >-
    Paint a stroke that follows an animated brush position over time, simulating handwriting or signatures. Brush size, hardness, opacity, stroke length and spacing are adjustable, and paint or brush properties can change over time.
  projection_example: >-
    The venue's name is hand-written across the wall as if by a giant pen of light.
  controls:
    - { name: "Brush position", type: "point2d", animatable: true }
    - { name: "Color", type: "color", animatable: true }
    - { name: "Brush size / Brush hardness / Brush opacity", type: "group", animatable: true }
    - { name: "Stroke length (secs)", type: "float", animatable: true }
    - { name: "Brush spacing (secs)", type: "float", animatable: true }
    - { name: "Paint time properties (None, Opacity, Color)", type: "enum", animatable: false }
    - { name: "Brush time properties (None, Size, Hardness, Size and hardness)", type: "enum", animatable: false }
    - { name: "Paint style (On original image, On transparent, Reveal original image)", type: "enum", animatable: false }
  animation: >-
    Brush Position is keyframed, motion-sketched, or generated from a path; Adobe suggests linking it with an expression to a sketched layer.
  dependencies: [proj.effect-stack, anim.keyframe.core, anim.motion-path, expr.engine, shape.path, fx.generate.region-edge-stroke, preview.cache]
  implementation: >-
    The stroke is rebuilt from the Brush Position property, sampled every Brush Spacing seconds from the layer in-point to t. Evaluation is pure, and the sample list is cached per property revision. Dabs are instanced on the GPU, and Stroke Length limits the window. Temporal dependency: the property history up to t; deterministic and MFR-safe, with cost growing with time.
  io: >-
    none
  limitations: >-
    For clean vector draw-ons, trim paths (shape.path) or Stroke are better; Write-on is for brushy, hand-painted motion.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "Generator for After Effects parity or a decorative look that projection recipes do not need now. Gradients, fill, stroke, music visualisers, lightning, radio waves, Vegas and the region-aware generators stay required."
  milestone: C
  beginner:
    action: >-
      "Draw it on": draw a line on the canvas, or pick a path or handwriting text, then set the duration.
    defaults: >-
      Brush follows the path at constant speed over 3 s, soft 8 px brush, stroke persists.
    automation: >-
      Generates Brush Position keyframes or an expression from the drawn or traced path at constant speed.
    usability_check: >-
      A first-time user draws a freehand line on the facade and makes it draw on over 3 s in under 45 s.
  acceptance: >-
    Mini scene "signature": frame at t rendered cold equals the frame reached by playback; export matches preview.
  status: not-started
  evidence: []

