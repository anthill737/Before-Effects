- id: fx.immersive.vr-plane-to-sphere
  name: VR Plane to Sphere
  sources:
    - ref: S02
      item: VR Plane to Sphere
      category: Immersive Video
      adobe_support: { gpu: true, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S01
      item: VR Plane to Sphere
      category: Immersive Video
      checked: true
  artist_can: >-
    Place flat elements (text, logos, graphics, video) into 360 or dome content so they appear undistorted when seen from the centre.
  projection_example: >-
    Places a title so it reads correctly on the front of the dome, then glides it around to the side.
  controls:
    - { name: "Scale (Degrees)", type: "angle", animatable: true }
    - { name: "Rotate Source (X, Y, Z)", type: "angle[3]", animatable: true }
    - { name: "Rotate Projection (X, Y, Z)", type: "angle[3]", animatable: true }
    - { name: "Feather", type: "float", animatable: true }
    - { name: "Stereo Disparity (Degrees)", type: "angle", animatable: true }
    - { name: "Frame Layout + Horizontal/Vertical Field of View", type: "enum + angle[2]", animatable: false }
  animation: >-
    All controls keyframable and expression-linkable (titles moving around the dome).
  dependencies: [text.layer, shape.layer, fx.immersive.vr-converter]
  implementation: >-
    Inverse gnomonic placement. For each output pixel: get the direction, rotate into the plane's frame (Rotate Projection, then Rotate Source), intersect with a plane whose angular size is Scale, and sample the layer with bicubic filtering and feathered edges. Directions behind the plane are skipped. Temporal: none. Bounds: output equals the spherical frame. Precision: f32 math, rgba16float output.
  io: >-
    none
  limitations: >-
    Stereo disparity is supported for interop only; stereo projection is out of scope.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "360, VR and dome processing is not part of the building-projection priorities. Revisit if a dome or panoramic venue is requested."
  milestone: D
  beginner:
    action: >-
      Dragging any flat layer onto a 360 or dome composition places it with this automatically; move it by dragging in the dome preview.
    defaults: >-
      Scale 40°, facing the audience's main direction.
    automation: >-
      Wraps flat layers automatically. Converts canvas drags into projection rotation.
    usability_check: >-
      A first-time user places a readable title on the dome front in at most 2 actions without seeing a degree control.
  acceptance: >-
    Mini scene "dome-title": the title edge stays straight in the audience-view preview.
  status: not-started
  evidence: []

- id: fx.immersive.vr-rotate-sphere
  name: VR Rotate Sphere
  sources:
    - ref: S02
      item: VR Rotate Sphere
      category: Immersive Video
      adobe_support: { gpu: true, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S01
      item: VR Rotate Sphere
      category: Immersive Video
      checked: true
  artist_can: >-
    Rotate 360 content to straighten the horizon, re-centre the main view, or add camera-like tilt, pan and roll moves.
  projection_example: >-
    Re-centres a 360 clip so the action faces the room's main wall, then slowly rotates it during the show.
  controls:
    - { name: "Tilt (X), Pan (Y), Roll (Z)", type: "angle[3]", animatable: true }
    - { name: "Invert Rotation", type: "bool", animatable: false }
    - { name: "Frame Layout + Horizontal/Vertical Field of View", type: "enum + angle[2]", animatable: false }
  animation: >-
    Tilt, Pan and Roll keyframable and expression-linkable.
  dependencies: [fx.immersive.vr-converter, anim.keyframe.core]
  implementation: >-
    The VR Converter remap with identical input and output layouts and a 3×3 rotation, using EWA near the poles and wrap addressing. Temporal: none. Bounds: wraps. Precision: f32 rotation, rgba16float output.
  io: >-
    none
  limitations: >-
    Each rotation resamples the image; consecutive rotations are fused into one matrix to avoid repeated softening.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "360, VR and dome processing is not part of the building-projection priorities. Revisit if a dome or panoramic venue is requested."
  milestone: D
  beginner:
    action: >-
      "Turn the 360 view": drag in the dome preview to rotate; a "Level the horizon" button handles tilt.
    defaults: >-
      All 0.
    automation: >-
      "Level the horizon" estimates the horizon tilt from vertical lines.
    usability_check: >-
      A first-time user re-centres a 360 clip onto the main wall in under 20 s by dragging.
  acceptance: >-
    Mini scene "recentre": rotation fusion keeps PSNR within tolerance after 5 stacked rotations.
  status: not-started
  evidence: []

