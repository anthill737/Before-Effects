    - { name: "Frame Layout + Horizontal/Vertical Field of View", type: "enum + angle[2]", animatable: false }
  animation: >-
    All numeric controls keyframable and expression-linkable; Evolution supports looping.
  dependencies: [fx.noise-grain.fractal-noise, mask.blend-modes]
  implementation: >-
    Shares the Fractal Noise WGSL noise library, but samples 3D (or 4D, for looping evolution) noise at unit-sphere direction vectors, rotated by tilt, pan and roll. There is no 2D mapping, so no seam or pole pinch. Octaves follow Complexity and Sub settings. Temporal: none (evolution is a function of time). Bounds: wraps. Precision: f32 noise, rgba16float output.
  io: >-
    none
  limitations: >-
    none
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "360, VR and dome processing is not part of the building-projection priorities. Revisit if a dome or panoramic venue is requested."
  milestone: D
  beginner:
    action: >-
      "Clouds / smoke / energy" looks automatically use the 360 version on 360 or dome layers.
    defaults: >-
      Basic, Complexity 6, slow evolution, seamless loop to the show length.
    automation: >-
      Chooses the 360 variant by layer tag and sets the loop length to the composition.
    usability_check: >-
      A first-time user fills a dome with drifting clouds in at most 3 actions, with no visible seam.
  acceptance: >-
    Mini scene "nebula-dome": loop seam identical frames at 0 and the loop length.
  status: not-started
  evidence: []

