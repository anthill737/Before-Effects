- id: fx.immersive.vr-sphere-to-plane
  name: VR Sphere to Plane
  sources:
    - ref: S02
      item: VR Sphere to Plane
      category: Immersive Video
      adobe_support: { gpu: true, bpc: [8, 16, 32], mfr: true }
      checked: true
    - ref: S01
      item: VR Sphere to Plane
      category: Immersive Video
      checked: true
  artist_can: >-
    Extract a flat, undistorted view in any direction from 360 footage, like pointing a virtual camera inside it.
  projection_example: >-
    Pulls a flat view of the sky from 360 drone footage to use as a sky plate on a flat facade.
  controls:
    - { name: "Input Format", type: "enum", animatable: false }
    - { name: "Output Frame Width", type: "int", animatable: false }
    - { name: "Output Frame Ratio", type: "enum", animatable: false }
    - { name: "Rotate Projection (Tilt Y, Tilt X, Tilt Z)", type: "angle[3]", animatable: true }
  animation: >-
    Rotations keyframable (virtual pan, tilt and roll inside the 360 clip).
  dependencies: [fx.immersive.vr-converter, proj.layer]
  implementation: >-
    Gnomonic (rectilinear) extraction. For each output pixel: compute the ray from the virtual camera's FOV and rotation, convert to an input-layout UV, and sample with mip-level EWA. Temporal: none. Bounds: replaced by the output frame size. Precision: f32 math, rgba16float output.
  io: >-
    none
  limitations: >-
    Field of view is derived from the output frame settings; very wide views stretch at the edges, as with any rectilinear projection.
  disposition: deferred
  superseded_by: null
  exclusion_reason: null
  deferred_reason: "360, VR and dome processing is not part of the building-projection priorities. Revisit if a dome or panoramic venue is requested."
  milestone: D
  beginner:
    action: >-
      "Take a flat view from 360": drag inside the 360 preview to aim, then confirm.
    defaults: >-
      Output = composition size, 90° horizontal view.
    automation: >-
      Sizes the output to the target composition or region.
    usability_check: >-
      A first-time user extracts a flat view of a chosen direction in at most 3 actions and under 30 s.
  acceptance: >-
    Mini scene "sky-plate": straight lines in the source stay straight in the output.
  status: not-started
  evidence: []
